<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>루틴 트래커 · Life Town v2</title><link rel="stylesheet" href="./assets/life-town-v2.css"><style>
:root{--panel:#fff;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--line:#e5e5e8;--line2:#f0f0f2;--soft:#f7f7f8;--blue:#007aff;--green:#34c759;--yellow:#ffcc00;--red:#ff3b30;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}html[data-lt-theme="dark"]{--panel:#1c1c1e;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--line:#38383a;--line2:#2c2c2e;--soft:#2c2c2e;--blue:#0a84ff;--green:#30d158;--yellow:#ffd60a;--red:#ff453a;--shadow:none}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}.root{width:100%;max-width:460px;margin:auto;container-type:inline-size}.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px 14px 12px;box-shadow:var(--shadow);overflow:hidden}.card:before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:linear-gradient(90deg,transparent,#b8b8bd 22%,#f5f5f7 50%,#b8b8bd 78%,transparent);opacity:.52}.top{display:grid;grid-template-columns:minmax(0,1fr) 90px 60px;align-items:start;gap:8px}.title{font-size:17.5px;font-weight:760;letter-spacing:-.04em}.label{margin-top:4px;font-size:8.8px;color:var(--muted)}.count{margin-top:2px;display:flex;align-items:flex-end;gap:3px}.done{font-size:23px;font-weight:780;letter-spacing:-.055em}.slash,.total{font-size:12px;color:var(--muted);font-weight:680;margin-bottom:3px}.spark{display:grid;place-items:center;padding-top:12px}.spark svg{width:84px;height:36px;overflow:visible}.percent{text-align:right}.percent-row{display:flex;justify-content:flex-end;align-items:flex-end;gap:2px;margin-top:3px}.percent-row strong{font-size:23px;font-weight:780;letter-spacing:-.055em}.percent-row span{font-size:10px;color:var(--sub);margin-bottom:3px}.divider{height:1px;background:var(--line);margin:10px 0 8px}.days,.habit-row{display:grid;grid-template-columns:66px repeat(7,1fr);column-gap:4px;align-items:center}.days{margin-bottom:6px}.day{font-size:8.8px;color:var(--muted);text-align:center}.day.sat{color:var(--blue)}.day.sun{color:var(--red)}.habit-row{min-height:26px;border-top:1px solid var(--line2)}.name-cell{min-width:0}.name-editor{width:100%;height:23px;border:0;outline:0;background:transparent;border-radius:7px;padding:0 4px;color:var(--text);font:inherit;font-size:9.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name-editor:hover,.name-editor:focus{background:var(--soft)}.dot{width:11px;height:11px;border:1px solid var(--line);border-radius:50%;padding:0;margin:auto;background:var(--soft);cursor:pointer;transition:.12s}.dot:hover{transform:scale(1.12)}.dot.active{background:var(--green);border-color:var(--green)}.habit-row .dot:nth-child(7).active{background:var(--blue);border-color:var(--blue)}.habit-row .dot:nth-child(8).active{background:var(--red);border-color:var(--red)}.add-area{display:flex;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}.add-input{flex:1;min-width:0;height:30px;border:1px solid var(--line);outline:0;border-radius:9px;background:var(--soft);padding:0 9px;color:var(--text);font-size:9.5px}.add-btn{height:30px;min-width:48px;border:0;border-radius:9px;background:var(--blue);color:#fff;font-size:9px;font-weight:720;padding:0 11px;cursor:pointer}.tip{margin-top:6px;font-size:8.8px;color:var(--muted)}@container(max-width:390px){.days,.habit-row{grid-template-columns:58px repeat(7,1fr)}.top{grid-template-columns:minmax(0,1fr) 78px 54px}.spark svg{width:72px}.card{padding:13px 12px}}
</style></head><body><div class="root"><section class="card" data-widget-control-root data-control-sizes="380,420,460"><div class="top"><div><div class="title">루틴 트래커</div><div class="label">이번 주 완료</div><div class="count"><span class="done" id="doneCount">0</span><span class="slash">/</span><span class="total" id="totalCount">0</span></div></div><div class="spark"><svg viewBox="0 0 84 36"><polyline id="sparkLine" fill="none" stroke="var(--yellow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle id="sparkDot" r="2.3" fill="var(--green)"/></svg></div><div class="percent"><div class="label">달성률</div><div class="percent-row"><strong id="percent">0</strong><span>%</span></div></div></div><div class="divider"></div><div class="days"><div></div><div class="day">월</div><div class="day">화</div><div class="day">수</div><div class="day">목</div><div class="day">금</div><div class="day sat">토</div><div class="day sun">일</div></div><div id="habitRows"></div><div class="add-area"><input class="add-input" id="newHabit" maxlength="12" placeholder="새 항목 추가"><button class="add-btn" id="addBtn" type="button">추가</button></div><div class="tip">항목 이름은 눌러서 바로 수정할 수 있습니다.</div></section></div><script>
const DAYS=['월','화','수','목','금','토','일'],KEY='lifeTownHabitTracker.v2',OLD_KEY='lifeTownHabitTracker.v1',DEFAULT=[{name:'운동',checks:[0,1,1,1,1,1,1]},{name:'독서',checks:[1,0,1,1,1,1,0]},{name:'명상',checks:[1,1,0,0,0,0,0]}],copy=v=>JSON.parse(JSON.stringify(v));function normalize(v){if(!Array.isArray(v)||!v.length)return null;const out=v.filter(x=>x&&typeof x.name==='string'&&Array.isArray(x.checks)).map(x=>({name:(x.name.trim().slice(0,12)||'새 습관'),checks:DAYS.map((_,d)=>x.checks[d]?1:0)}));return out.length?out:null}function load(){for(const k of [KEY,OLD_KEY]){try{const v=normalize(JSON.parse(localStorage.getItem(k)||'null'));if(v)return v}catch{}}return copy(DEFAULT)}let state=load();function save(){localStorage.setItem(KEY,JSON.stringify(state))}function updateSummary(){const done=state.reduce((s,r)=>s+r.checks.reduce((a,b)=>a+b,0),0),total=state.length*7,pct=total?Math.round(done/total*100):0;doneCount.textContent=done;totalCount.textContent=total;percent.textContent=pct;updateSpark()}function updateSpark(){const counts=DAYS.map((_,d)=>state.reduce((s,r)=>s+r.checks[d],0)),max=Math.max(1,state.length),xs=[3,16,29,42,55,68,81],pts=counts.map((c,i)=>`${xs[i]},${(29-(c/max)*17).toFixed(1)}`);sparkLine.setAttribute('points',pts.join(' '));const [x,y]=pts[6].split(',');sparkDot.setAttribute('cx',x);sparkDot.setAttribute('cy',y)}function render(){habitRows.innerHTML='';state.forEach((item,r)=>{const row=document.createElement('div');row.className='habit-row';const cell=document.createElement('div');cell.className='name-cell';const input=document.createElement('input');input.className='name-editor';input.value=item.name;input.maxLength=12;input.onchange=()=>{const v=input.value.trim().slice(0,12);state[r].name=v||item.name;save();input.value=state[r].name};input.onkeydown=e=>{if(e.key==='Enter')input.blur();if(e.key==='Escape'){input.value=state[r].name;input.blur()}};cell.appendChild(input);row.appendChild(cell);DAYS.forEach((day,d)=>{const dot=document.createElement('button');dot.className='dot'+(item.checks[d]?' active':'');dot.type='button';dot.setAttribute('aria-label',`${item.name} ${day} 체크`);dot.onclick=()=>{state[r].checks[d]=state[r].checks[d]?0:1;save();render()};row.appendChild(dot)});habitRows.appendChild(row)});updateSummary()}function addHabit(){const name=newHabit.value.trim().slice(0,12);if(!name)return;state.push({name,checks:[0,0,0,0,0,0,0]});newHabit.value='';save();render();newHabit.focus()}addBtn.onclick=addHabit;newHabit.addEventListener('keydown',e=>{if(e.key==='Enter')addHabit()});render();</script><script src="./assets/life-town-controls-v2.js"></script></body></html>
