<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>우리의 돈 · 예산 저축 플래너</title>
<style>
:root{
  --bg:#f7f7f8;--panel:#fff;--text:#151515;--sub:#6f7075;--muted:#a2a3a8;
  --line:#e7e7ea;--soft:#f3f3f5;--yellow:#f6c62e;--green:#55bf45;--pink:#f4a6b8;
  --red:#ee4d45;--blue:#5d8df5;--shadow:0 8px 28px rgba(20,20,24,.045),0 1px 2px rgba(20,20,24,.035);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:205px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;background:rgba(251,251,252,.94);border-right:1px solid var(--line);padding:20px 14px;backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:10px;padding:8px 12px 25px;font-size:22px;font-weight:780;letter-spacing:-.6px}
.brand-mark{width:30px;height:30px;border:1.5px solid #1c1c1e;border-radius:10px;display:grid;place-items:center;font-size:15px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{width:100%;border:0;background:transparent;color:#1d1d1f;border-radius:11px;padding:11px 12px;display:flex;align-items:center;gap:12px;text-align:left;font-weight:650;letter-spacing:-.15px}
.nav button:hover{background:#f0f0f2}
.nav button.active{background:#eaeaed}
.nav-icon{width:22px;text-align:center;font-size:18px;font-weight:500;color:#47474a}
.main{min-width:0}
.topbar{height:70px;position:sticky;top:0;z-index:20;background:rgba(247,247,248,.88);border-bottom:1px solid var(--line);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.month-control,.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn,.month-btn,.action-btn{border:1px solid #dfdfe3;background:#fff;border-radius:11px;box-shadow:0 2px 7px rgba(0,0,0,.025);height:38px}
.icon-btn{width:38px;font-size:20px}.month-btn{padding:0 18px;font-weight:720}.action-btn{padding:0 14px;font-weight:650}
.content{padding:16px 22px 30px;max-width:1500px;margin:0 auto}
.view{display:none}.view.active{display:block}
.grid{display:grid;gap:14px}.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:1.1fr .85fr .85fr}.grid.four{grid-template-columns:repeat(4,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card.flat{box-shadow:none}
.card-title{font-size:17px;font-weight:760;letter-spacing:-.35px;display:flex;align-items:center;gap:9px;margin-bottom:13px}
.card-title .mini{font-size:13px;color:var(--sub);font-weight:560}
.kicker{font-size:12px;color:var(--sub);font-weight:650;margin-bottom:7px}
.big{font-size:30px;line-height:1;font-weight:780;letter-spacing:-1.2px}
.medium{font-size:22px;font-weight:760;letter-spacing:-.65px}
.sub{font-size:12px;color:var(--sub);line-height:1.55}
.hero{min-height:202px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(135deg,#fff 0%,#fff 72%,#fafafa 100%)}
.hero .big{font-size:28px}.hero .danger{color:#e54b56}
.person-card{min-height:202px;display:flex;flex-direction:column;justify-content:space-between}
.person-head{display:flex;justify-content:space-between;align-items:flex-start}
.person-name{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:760}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}.dot.yellow{background:var(--yellow)}.dot.green{background:var(--green)}.dot.pink{background:var(--pink)}.dot.gray{background:#b9b9bd}
.progress{height:10px;background:#ececef;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;border-radius:inherit}
.progress.yellow>span{background:var(--yellow)}.progress.green>span{background:var(--green)}.progress.pink>span{background:var(--pink)}
.split-meta{display:grid;grid-template-columns:1fr 1fr;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.split-meta>div+div{border-left:1px solid var(--line);padding-left:16px}
.meta-label{font-size:11px;color:var(--sub)}.meta-value{font-weight:740;margin-top:3px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#f3f3f5;color:#3f3f43;font-weight:690;padding:9px 10px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:10px;border-bottom:1px solid #ededf0;text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}.total-row td{font-weight:760;background:#f7f7f8}.current-row td{font-weight:760;background:#faf7f4}
.pos{color:#218b42}.neg{color:#e4473d}.neutral{color:#555}
.kpi{display:flex;flex-direction:column;gap:8px;min-height:124px;justify-content:center}.kpi .label{font-size:12px;color:var(--sub);font-weight:650}.kpi .value{font-size:25px;font-weight:780;letter-spacing:-.7px}
.suggestion{background:linear-gradient(135deg,#fff,#f6fbf3);border-color:#dfead9}
.suggestion ul{padding:0;margin:0;list-style:none}.suggestion li{font-size:12px;line-height:1.55;margin:7px 0;padding-left:17px;position:relative}.suggestion li:before{content:"✓";position:absolute;left:0;color:#3ca340;font-weight:800}
.chart-box{height:250px;position:relative}.chart-box svg{width:100%;height:100%;overflow:visible}.chart-grid{stroke:#ececef;stroke-width:1}.axis-text{fill:#777;font-size:11px}.line-j{fill:none;stroke:#e8b91d;stroke-width:2.5}.line-c{fill:none;stroke:#43aa3b;stroke-width:2.5}.line-s{fill:none;stroke:#7d6ce7;stroke-width:2.5}.point{fill:#fff;stroke-width:2.3}.point.j{stroke:#e8b91d}.point.c{stroke:#43aa3b}.point.s{stroke:#7d6ce7}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-head h2{margin:0;font-size:25px;letter-spacing:-.7px}.section-head p{margin:4px 0 0;color:var(--sub);font-size:12px}
.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--sub);font-weight:650}
input[type=text],input[type=number],input[type=month],select,textarea{width:100%;border:1px solid #dadade;border-radius:10px;background:#fff;padding:10px 11px;outline:none;color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:#a8a8ad;box-shadow:0 0 0 3px #00000008}
textarea{min-height:74px;resize:vertical}
.primary{border:0;background:#222326;color:#fff;border-radius:11px;padding:11px 16px;font-weight:720}.secondary{border:1px solid #dcdce0;background:#fff;color:#1d1d1f;border-radius:11px;padding:10px 14px;font-weight:650}.danger-btn{border:1px solid #f0d0d0;background:#fff7f7;color:#d43f3f;border-radius:11px;padding:10px 14px;font-weight:680}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#f1f1f3;font-size:11px;font-weight:690}.pill.good{background:#edf8eb;color:#2e7b34}.pill.bad{background:#fff0ef;color:#b93e38}.pill.warn{background:#fff8da;color:#8e7619}
.budget-summary{display:grid;grid-template-columns:1.15fr repeat(3,.75fr);align-items:center;gap:12px}.summary-stat{padding-left:20px;border-left:1px solid var(--line)}.summary-stat:first-of-type{border-left:0}
.bar-list{display:flex;flex-direction:column;gap:16px}.bar-row .line{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:7px}.bar-row .track{height:10px;background:#ececef;border-radius:999px;overflow:hidden}.bar-row .fill{height:100%;border-radius:999px;background:#49bb4b}.bar-row.over .fill{background:#ef655c}
.goal-card{padding:20px}.goal-top{display:flex;justify-content:space-between;gap:12px}.goal-amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.goal-amounts>div{border-right:1px solid var(--line)}.goal-amounts>div:last-child{border-right:0}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:14px}.mile{position:relative;padding-top:25px;text-align:center;font-size:11px;color:var(--sub)}.mile:before{content:"";position:absolute;top:7px;left:0;right:0;height:3px;background:#e4e4e7}.mile:first-child:before{left:50%}.mile:last-child:before{right:50%}.mile span{position:absolute;top:0;left:50%;transform:translateX(-50%);width:17px;height:17px;border-radius:50%;background:#fff;border:2px solid #b8b8bd}.mile.active span{background:#58b955;border-color:#58b955}.mile strong{display:block;color:#222;font-size:12px;margin-bottom:2px}
.backup-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.backup-action{border:1px solid var(--line);background:#fff;border-radius:18px;padding:20px;text-align:left;min-height:170px;box-shadow:var(--shadow)}.backup-action .icon{font-size:30px;margin-bottom:24px}.backup-action h3{margin:0 0 10px;font-size:20px}.backup-action p{margin:0;color:var(--sub);font-size:12px;line-height:1.6}
.empty{padding:28px;text-align:center;color:var(--sub);font-size:13px}
.modal{position:fixed;inset:0;background:#0006;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-card{width:min(520px,100%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 24px 80px #0003}.modal-title{font-size:20px;font-weight:780;margin-bottom:16px}
.mobile-nav{display:none}
@media(max-width:1050px){.app{grid-template-columns:76px minmax(0,1fr)}.brand{justify-content:center;padding:8px 0 22px}.brand span:last-child{display:none}.nav button{justify-content:center;padding:12px}.nav button span:last-child{display:none}.grid.three{grid-template-columns:1fr 1fr}.grid.three>.hero{grid-column:1/-1}.backup-actions{grid-template-columns:1fr 1fr}.grid.four{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.app{display:block}.sidebar{display:none}.topbar{height:58px;padding:0 10px}.content{padding:12px 10px 80px}.top-actions .action-btn{display:none}.grid.two,.grid.three,.grid.four,.input-grid{grid-template-columns:1fr}.budget-summary{grid-template-columns:1fr 1fr}.summary-stat{padding:10px 0;border-left:0}.backup-actions{grid-template-columns:1fr}.goal-amounts{grid-template-columns:1fr 1fr}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(252,252,253,.94);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:7px 5px 9px}.mobile-nav button{border:0;background:transparent;font-size:10px;color:#666}.mobile-nav button.active{color:#111;font-weight:760}.mobile-nav .mi{display:block;font-size:18px;margin-bottom:2px}}

/* Desktop one-screen mode: spacious, full-width, no page scroll */
@media (min-width:761px){
  html,body{height:100%;overflow:hidden}
  .app{height:100vh;min-height:0;grid-template-columns:190px minmax(0,1fr)}
  .sidebar{height:100vh;overflow:hidden;padding:18px 12px}
  .brand{padding:7px 10px 22px;font-size:21px}
  .nav{gap:5px}
  .nav button{padding:11px 11px;font-size:14px}
  .nav-icon{width:21px;font-size:17px}

  .main{height:100vh;min-height:0;overflow:hidden}
  .topbar{height:58px;min-height:58px;padding:0 18px}
  .icon-btn,.month-btn,.action-btn{height:38px}
  .content{
    width:100%;
    max-width:none;
    margin:0;
    height:calc(100vh - 58px);
    max-height:calc(100vh - 58px);
    overflow:hidden;
    padding:11px 18px 13px;
  }
  .view.active{height:100%;min-height:0;overflow:hidden}

  .card{padding:15px 16px;border-radius:16px}
  .card-title{font-size:16px;margin-bottom:10px}
  .big{font-size:27px}
  .medium{font-size:20px}
  .sub{font-size:12px;line-height:1.45}
  .grid,.grid.two,.grid.three,.grid.four{gap:11px}
  th{padding:7px 9px;font-size:12px}
  td{padding:7px 9px;font-size:12px}
  .kpi{min-height:0;gap:5px}
  .kpi .label{font-size:11.5px}
  .kpi .value{font-size:22px}
  .progress{height:9px}
  .split-meta{margin-top:10px;padding-top:10px}
  .meta-label{font-size:10.5px}
  .meta-value{font-size:12.5px}
  .section-head{margin-bottom:10px}
  .section-head h2{font-size:23px}
  .input-grid{gap:9px}
  input[type=text],input[type=number],input[type=month],select,textarea{padding:8px 10px}
  textarea{min-height:56px}
  .form-actions{margin-top:9px}

  #view-dashboard.active{
    display:grid;
    grid-template-rows:174px 218px minmax(232px,1fr) 112px;
    gap:11px;
  }
  #view-dashboard.active>div{margin-top:0!important;min-height:0}
  #view-dashboard .grid.three,
  #view-dashboard .grid.two,
  #view-dashboard .grid.four{height:100%;min-height:0}
  #view-dashboard .grid.three{grid-template-columns:1.12fr .88fr .88fr!important}
  #view-dashboard .grid.four{grid-template-columns:.78fr .78fr .86fr .92fr!important}
  #view-dashboard .card{height:100%;min-height:0;overflow:hidden}
  #view-dashboard .hero{justify-content:center;padding-left:20px}
  #view-dashboard .hero .card-title{font-size:15px;margin-bottom:10px}
  #view-dashboard .hero .big{font-size:25px;line-height:1.16}
  #view-dashboard .hero .sub{font-size:12px;margin-top:10px!important}
  #view-dashboard .person-card{padding:15px 17px}
  #view-dashboard .person-card .big{font-size:26px}
  #view-dashboard .person-name{font-size:17px}
  #view-dashboard .person-card .sub{font-size:11px}
  #view-dashboard .chart-box{height:100%;min-height:175px}
  #view-dashboard .axis-text{font-size:10.5px}
  #view-dashboard .suggestion li{font-size:11px;line-height:1.42;margin:5px 0}
  #view-dashboard .empty-state{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--sub);gap:8px;text-align:center
  }
  #view-dashboard .empty-state strong{font-size:13px;color:#3f3f43}
  #view-dashboard .empty-state button{padding:7px 11px;font-size:11px}

  #view-budget.active{
    display:grid;
    grid-template-rows:104px minmax(0,1fr) minmax(178px,.56fr);
    gap:11px;
  }
  #view-budget.active>div{margin-top:0!important;min-height:0}
  #view-budget .card{min-height:0;overflow:hidden}
  #view-budget .grid.two{height:100%;min-height:0}
  #view-budget .grid.two>.grid{min-height:0}
  #view-budget .bar-list{gap:11px}
  #view-budget .bar-row .line{margin-bottom:5px}

  #view-savings.active{
    display:grid;
    grid-template-rows:108px minmax(0,1.34fr) minmax(0,.86fr);
    gap:11px;
  }
  #view-savings.active>div{margin-top:0!important;min-height:0}
  #view-savings .card{min-height:0;overflow:hidden}
  #view-savings .grid.two{height:100%;min-height:0}
  #view-savings .chart-box{height:100%;min-height:145px}
  #view-savings textarea{min-height:48px}

  #view-assets.active{
    display:grid;
    grid-template-rows:108px minmax(0,1fr);
    gap:11px;
  }
  #view-assets.active>div{margin-top:0!important;min-height:0}
  #view-assets .card{min-height:0;overflow:hidden}
  #view-assets .grid.two{height:100%;min-height:0}
  #view-assets .grid.two>.grid{min-height:0}
  #view-assets .chart-box{height:calc(100% - 44px)!important;min-height:190px}

  #view-goals.active{
    display:grid;
    grid-template-rows:46px minmax(0,1.05fr) minmax(0,.8fr) minmax(0,.9fr);
    gap:11px;
  }
  #view-goals.active>div{margin-top:0!important;min-height:0}
  #view-goals .section-head{margin:0}
  #view-goals .card{min-height:0;overflow:hidden}
  #view-goals .grid.two{height:100%;min-height:0}
  #view-goals .goal-card{padding:14px 15px}
  #view-goals .goal-amounts{margin:10px 0;gap:8px}
  #view-goals .timeline{margin-top:8px}
  #view-goals .mile{padding-top:21px;font-size:10px}
  #view-goals .mile strong{font-size:11px}

  #view-backup.active{
    display:grid;
    grid-template-rows:minmax(142px,.58fr) minmax(0,1fr);
    gap:11px;
  }
  #view-backup.active>div{margin-top:0!important;min-height:0}
  #view-backup .card{min-height:0;overflow:hidden}
  #view-backup .backup-actions{height:100%;min-height:0;gap:11px}
  #view-backup .backup-action{height:100%;min-height:0;padding:15px}
  #view-backup .backup-action .icon{font-size:25px;margin-bottom:12px}
  #view-backup .backup-action h3{font-size:17px;margin-bottom:6px}
  #view-backup .backup-action p{font-size:11px;line-height:1.45}
}

/* Short desktop: preserve readability, trim spacing before text size */
@media (min-width:761px) and (max-height:820px){
  .topbar{height:52px;min-height:52px}
  .content{height:calc(100vh - 52px);max-height:calc(100vh - 52px);padding:8px 14px 9px}
  .card{padding:12px 13px}
  .grid,.grid.two,.grid.three,.grid.four{gap:8px}
  #view-dashboard.active{grid-template-rows:154px 192px minmax(190px,1fr) 96px;gap:8px}
  #view-dashboard .hero .big{font-size:23px}
  #view-dashboard .person-card .big{font-size:24px}
  #view-dashboard .chart-box{min-height:145px}
  th,td{padding:5px 7px;font-size:11px}
  .card-title{font-size:15px;margin-bottom:7px}
  .sub{font-size:11px}
  .kpi .value{font-size:20px}
  #view-budget.active,#view-savings.active,#view-assets.active,#view-goals.active,#view-backup.active{gap:8px}
}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">₩</span><span>우리의 돈</span></div>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="active"><span class="nav-icon">⌂</span><span>대시보드</span></button>
      <button data-view="budget"><span class="nav-icon">▤</span><span>예산 관리</span></button>
      <button data-view="savings"><span class="nav-icon">▱</span><span>저축 기록</span></button>
      <button data-view="assets"><span class="nav-icon">↗</span><span>자산 추이</span></button>
      <button data-view="goals"><span class="nav-icon">◎</span><span>목표 설정</span></button>
      <button data-view="backup"><span class="nav-icon">⇧</span><span>백업 / 내보내기</span></button>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="month-control"><button class="icon-btn" id="prevMonth">‹</button><button class="month-btn" id="monthLabel">2026년 11월</button><button class="icon-btn" id="nextMonth">›</button></div>
      <div class="top-actions"><button class="action-btn" id="addTxTop">＋ 거래 기록 추가</button><button class="icon-btn" data-view-jump="assets">⌁</button><button class="icon-btn" data-view-jump="backup">⇧</button></div>
    </header>
    <div class="content">
      <section class="view active" id="view-dashboard"></section>
      <section class="view" id="view-budget"></section>
      <section class="view" id="view-savings"></section>
      <section class="view" id="view-assets"></section>
      <section class="view" id="view-goals"></section>
      <section class="view" id="view-backup"></section>
    </div>
  </main>
</div>
<nav class="mobile-nav" id="mobileNav">
  <button data-view="dashboard" class="active"><span class="mi">⌂</span>홈</button>
  <button data-view="budget"><span class="mi">▤</span>예산</button>
  <button data-view="savings"><span class="mi">▱</span>저축</button>
  <button data-view="assets"><span class="mi">↗</span>자산</button>
  <button data-view="goals"><span class="mi">◎</span>목표</button>
  <button data-view="backup"><span class="mi">⇧</span>백업</button>
</nav>

<div class="modal" id="txModal"><div class="modal-card"><div class="modal-title">거래 기록 추가</div><div class="input-grid">
<div class="field"><label>날짜</label><input id="txDate" type="text" placeholder="2026-11-03"></div>
<div class="field"><label>구분</label><select id="txType"><option value="expense">지출</option><option value="income">수입</option><option value="save">저축</option></select></div>
<div class="field"><label>항목</label><input id="txCategory" type="text" placeholder="식비"></div>
<div class="field"><label>금액</label><input id="txAmount" type="number" min="0" step="1000" placeholder="0"></div>
</div><div class="field" style="margin-top:12px"><label>메모</label><input id="txMemo" type="text" placeholder="선택 입력"></div>
<div class="form-actions"><button class="secondary" data-close-modal>취소</button><button class="primary" id="saveTx">저장</button></div></div></div>

<div class="modal" id="budgetModal"><div class="modal-card"><div class="modal-title">예산 항목 편집</div><div id="budgetEditor"></div><div class="form-actions"><button class="secondary" data-close-modal>닫기</button><button class="primary" id="saveBudget">저장</button></div></div></div>

<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script>
(function(){
const K='ourmoney-dashboard-v1', GOAL=100000000;
const defaults={
  jobs:6,pay:120000,hisPay:null,myIncome:4000000,myAssets:60000000,myFixed:425130,myPersonal:600000,mySave:2000000,
  hisIncome:2150000,hisAssets:10000000,hisFixed:0,hisPersonal:450000,hisSave:1000000,
  expenses:[['월세',938000],['KB캐피탈',300497],['전기',123615],['도시가스',127567],['수도',17758],['LG 가전 구독 4건',184200],['LG 구독 추가 (오빠 결제)',28500],['인터넷',64000]],
  records:{},transactions:[],budgetPlan:null,jointGoal:null
};
let d;try{d=Object.assign({},defaults,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){d=Object.assign({},defaults)}
if(!Array.isArray(d.expenses))d.expenses=defaults.expenses.slice();
if(!d.records)d.records={};if(!Array.isArray(d.transactions))d.transactions=[];
if(!d.budgetPlan){
  d.budgetPlan=[
    {name:'월세',budget:938000},{name:'식비',budget:500000},{name:'차량비',budget:300497},
    {name:'전기·가스·수도',budget:268940},{name:'생활·기타',budget:212700}
  ];
}
if(!d.jointGoal)d.jointGoal={name:'공동 목표',target:0,current:0,monthly:0};
let selectedMonth=(new Date()).toISOString().slice(0,7), currentView='dashboard';
const q=new URLSearchParams(location.search);if(q.get('month'))selectedMonth=q.get('month');
if(q.get('panel')==='shared')currentView='budget';else if(q.get('panel')==='savings')currentView='savings';
function N(x){return Math.max(0,Number(x)||0)}
function won(n){return Math.round(N(n)).toLocaleString('ko-KR')+'원'}
function man(n){return Math.round(N(n)/10000).toLocaleString('ko-KR')+'만원'}
function pct(a,b){return b?Math.min(999,a/b*100):0}
function ymLabel(m){const p=m.split('-');return Number(p[0])+'년 '+Number(p[1])+'월'}
function persist(){localStorage.setItem(K,JSON.stringify(d))}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function monthShift(m,n){const p=m.split('-').map(Number),dt=new Date(p[0],p[1]-1+n,1);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')}
function rec(m){const r=d.records[m];if(!r)return null;return Object.assign({month:m,myTarget:r.myTarget!=null?r.myTarget:r.mySave||d.mySave,hisTarget:r.hisTarget!=null?r.hisTarget:r.hisSave||d.hisSave,myActual:r.myActual!=null?r.myActual:r.mySave||0,hisActual:r.hisActual!=null?r.hisActual:r.hisSave||0,jointActual:r.jointActual||0},r)}
function currentSavings(){const r=rec(selectedMonth);return r?{my:r.myActual,his:r.hisActual,joint:r.jointActual||0,myT:r.myTarget,hisT:r.hisTarget,jointT:r.jointTarget||0}:{my:0,his:0,joint:0,myT:d.mySave,hisT:d.hisSave,jointT:0}}
function expenseActualByCategory(name){
  const tx=d.transactions.filter(function(t){return t.type==='expense'&&String(t.date||'').slice(0,7)===selectedMonth});
  const lower=name.toLowerCase();
  let sum=0;
  tx.forEach(function(t){
    const c=String(t.category||'').toLowerCase();
    if(c===lower||(lower==='전기·가스·수도'&&/전기|가스|수도/.test(c))||(lower==='생활·기타'&&!/월세|식비|차량|전기|가스|수도/.test(c)))sum+=N(t.amount);
  });
  if(sum>0)return sum;
  const aliases={
    '월세':['월세'],'식비':['식비'],'차량비':['KB캐피탈','차량비'],
    '전기·가스·수도':['전기','도시가스','수도'],
    '생활·기타':['LG 가전 구독 4건','LG 구독 추가 (오빠 결제)','인터넷','생활·기타']
  };
  return (aliases[name]||[name]).reduce(function(s,a){const x=d.expenses.find(function(e){return e[0]===a});return s+(x?N(x[1]):0)},0)
}
function budgetRows(){return d.budgetPlan.map(function(x){return {name:x.name,budget:N(x.budget),actual:expenseActualByCategory(x.name)}})}
function totalBudget(){return budgetRows().reduce(function(s,x){return s+x.budget},0)}
function totalActual(){return budgetRows().reduce(function(s,x){return s+x.actual},0)}
function expectedDate(assets,monthly,target){const gap=Math.max(0,target-assets);if(!gap)return '목표 달성';if(!monthly)return '계산 불가';const months=Math.ceil(gap/monthly),p=selectedMonth.split('-').map(Number),dt=new Date(p[0],p[1]-1+months,1);return dt.getFullYear()+'년 '+(dt.getMonth()+1)+'월'}
function monthsTo(assets,monthly,target){const gap=Math.max(0,target-assets);return monthly?Math.ceil(gap/monthly):0}
function assetsAtMonth(person,m){
  const months=Object.keys(d.records).sort(),cur=person==='my'?N(d.myAssets):N(d.hisAssets),latest=months.length?months[months.length-1]:selectedMonth;
  if(m>=latest)return cur;
  let subtract=0;months.forEach(function(mm){if(mm>m){const r=rec(mm);subtract+=person==='my'?N(r.myActual):N(r.hisActual)}});
  return Math.max(0,cur-subtract)
}
function historyMonths(count){const arr=[];for(let i=count-1;i>=0;i--)arr.push(monthShift(selectedMonth,-i));return arr}
function lineChart(months,series){
  const W=680,H=220,pad={l:58,r:26,t:20,b:34},vals=[];series.forEach(function(s){s.values.forEach(function(v){vals.push(N(v))})});
  let max=Math.max.apply(null,vals.concat([1000000])),min=Math.min.apply(null,vals.concat([0]));if(max===min)max=min+1;
  const x=function(i){return pad.l+(W-pad.l-pad.r)*(months.length===1?0:i/(months.length-1))},y=function(v){return pad.t+(H-pad.t-pad.b)*(1-(v-min)/(max-min))};
  let svg='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  for(let i=0;i<4;i++){const yy=pad.t+(H-pad.t-pad.b)*i/3;svg+='<line class="chart-grid" x1="'+pad.l+'" y1="'+yy+'" x2="'+(W-pad.r)+'" y2="'+yy+'"/>'}
  months.forEach(function(m,i){svg+='<text class="axis-text" x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+Number(m.slice(5))+'월</text>'});
  series.forEach(function(s){
    const pts=s.values.map(function(v,i){return x(i)+','+y(v)}).join(' ');
    svg+='<polyline class="'+s.cls+'" points="'+pts+'"/>';
    s.values.forEach(function(v,i){svg+='<circle class="point '+s.point+'" cx="'+x(i)+'" cy="'+y(v)+'" r="4"/>'});
  });
  svg+='</svg>';return svg
}
function setView(v){currentView=v;document.querySelectorAll('.view').forEach(function(x){x.classList.toggle('active',x.id==='view-'+v)});document.querySelectorAll('[data-view]').forEach(function(x){x.classList.toggle('active',x.dataset.view===v)});render()}
function renderHeader(){document.getElementById('monthLabel').textContent=ymLabel(selectedMonth)}
function renderDashboard(){
  const s=currentSavings(),target=s.myT+s.hisT+s.jointT,actual=s.my+s.his+s.joint,diff=actual-target;
  const rb=budgetRows(),tb=rb.reduce(function(a,x){return a+x.budget},0),ta=rb.reduce(function(a,x){return a+x.actual},0);
  const ms=historyMonths(6),myVals=ms.map(function(m){return assetsAtMonth('my',m)}),hisVals=ms.map(function(m){return assetsAtMonth('his',m)});
  const msg=!rec(selectedMonth)?'이번 달 실제 저축을 아직 기록하지 않았어요.':diff>=0?'목표보다 '+man(diff)+' 더 저축했어요':'목표보다 '+man(-diff)+' 부족';
  const msgClass=diff<0?'danger':'';
  const rows=rb.map(function(x){const df=x.actual-x.budget;return '<tr><td>'+esc(x.name)+'</td><td>'+man(x.budget)+'</td><td>'+man(x.actual)+'</td><td class="'+(df>0?'neg':df<0?'pos':'')+'">'+(df>0?'+':'')+man(df)+'</td></tr>'}).join('');
  const rmonths=historyMonths(6).map(function(m){const r=rec(m);if(!r)return '';const t=N(r.myTarget)+N(r.hisTarget)+N(r.jointTarget),a=N(r.myActual)+N(r.hisActual)+N(r.jointActual),df=a-t;return '<tr class="'+(m===selectedMonth?'current-row':'')+'"><td>'+ymLabel(m).replace('년 ','년 ')+'</td><td>'+man(t)+'</td><td>'+man(a)+'</td><td class="'+(df<0?'neg':df>0?'pos':'')+'">'+(df>0?'+':'')+man(df)+'</td><td>'+pct(a,t).toFixed(1)+'%</td></tr>'}).join('');
  document.getElementById('view-dashboard').innerHTML=
  '<div class="grid three"><div class="card hero"><div class="card-title">이번 달 결론</div><div class="big '+msgClass+'">'+msg+'</div><div class="sub" style="margin-top:13px">'+(diff<0?'식비·쇼핑 등 조정 가능한 지출부터 확인해보세요.':'현재 저축 흐름을 유지해보세요.')+'</div></div>'+
  personCard('지은',d.myAssets,d.mySave,'yellow')+personCard('찬영',d.hisAssets,d.hisSave,'green')+'</div>'+
  '<div class="grid two" style="margin-top:14px"><div class="card"><div class="card-title">▱ 이번 달 저축 현황</div><div class="table-wrap"><table><thead><tr><th>구분</th><th>목표 저축</th><th>실제 저축</th><th>차이</th></tr></thead><tbody>'+
  saveRow('지은',s.myT,s.my,'yellow')+saveRow('찬영',s.hisT,s.his,'green')+saveRow('공동',s.jointT,s.joint,'pink')+
  '<tr class="total-row"><td>합계</td><td>'+man(target)+'</td><td>'+man(actual)+'</td><td class="'+(diff<0?'neg':diff>0?'pos':'')+'">'+(diff>0?'+':'')+man(diff)+'</td></tr></tbody></table></div></div>'+
  '<div class="card"><div class="card-title">⌂ 공동생활비 (예산 vs 실제)</div><div class="table-wrap"><table><thead><tr><th>항목</th><th>예산</th><th>실제</th><th>차이</th></tr></thead><tbody>'+rows+
  '<tr class="total-row"><td>합계</td><td>'+man(tb)+'</td><td>'+man(ta)+'</td><td class="'+(ta>tb?'neg':'pos')+'">'+(ta-tb>0?'+':'')+man(ta-tb)+'</td></tr></tbody></table></div></div></div>'+
  '<div class="grid two" style="margin-top:14px"><div class="card"><div class="card-title">↗ 자산 추이</div><div class="chart-box">'+lineChart(ms,[{values:myVals,cls:'line-j',point:'j'},{values:hisVals,cls:'line-c',point:'c'}])+'</div></div>'+
  '<div class="card"><div class="card-title">□ 월별 저축 및 목표 대비</div><div class="table-wrap"><table><thead><tr><th>월</th><th>목표 저축</th><th>실제 저축</th><th>차이</th><th>달성률</th></tr></thead><tbody>'+ (rmonths||'<tr><td colspan="5" class="empty">저축 기록을 저장하면 여기에 표시됩니다.</td></tr>') +'</tbody></table></div></div></div>'+
  '<div class="grid four" style="margin-top:14px"><div class="card kpi"><div class="label">◎ 목표 저축</div><div class="value">'+man(target)+'</div></div><div class="card kpi"><div class="label">▱ 실제 저축</div><div class="value">'+man(actual)+'</div><div class="sub">목표 대비 '+pct(actual,target).toFixed(1)+'%</div></div><div class="card kpi"><div class="label">▤ 합산 자산</div><div class="value">'+man(N(d.myAssets)+N(d.hisAssets))+'</div></div><div class="card suggestion"><div class="card-title">이번 달 제안</div><ul>'+suggestions(rb,diff)+'</ul></div></div>';
}
function personCard(name,assets,monthly,color){return '<div class="card person-card"><div class="person-head"><div class="person-name"><span class="dot '+color+'"></span>'+name+'</div><span class="pill">목표 1억원</span></div><div><div class="big">'+man(assets)+'</div><div class="sub" style="margin-top:4px">1억원 중 '+pct(assets,GOAL).toFixed(1)+'%</div></div><div><div class="progress '+color+'"><span style="width:'+Math.min(100,pct(assets,GOAL))+'%"></span></div><div class="split-meta"><div><div class="meta-label">월 목표 저축</div><div class="meta-value">'+man(monthly)+'</div></div><div><div class="meta-label">예상 달성일</div><div class="meta-value">'+expectedDate(assets,monthly,GOAL)+'</div></div></div></div></div>'}
function saveRow(name,t,a,color){const df=N(a)-N(t);return '<tr><td><span class="dot '+color+'" style="margin-right:7px"></span>'+name+'</td><td>'+man(t)+'</td><td>'+man(a)+'</td><td class="'+(df<0?'neg':df>0?'pos':'')+'">'+(df>0?'+':'')+man(df)+'</td></tr>'}
function suggestions(rows,diff){const over=rows.filter(function(x){return x.actual>x.budget}).sort(function(a,b){return (b.actual-b.budget)-(a.actual-a.budget)});let out='';over.slice(0,2).forEach(function(x){out+='<li>'+esc(x.name)+' 지출이 예산보다 '+man(x.actual-x.budget)+' 많습니다.</li>'});if(diff<0)out+='<li>저축 목표까지 '+man(-diff)+' 추가 확보가 필요합니다.</li>';if(!out)out='<li>현재 예산과 저축 흐름이 계획 범위 안입니다.</li>';return out}
function renderBudget(){
  const rows=budgetRows(),tb=rows.reduce(function(a,x){return a+x.budget},0),ta=rows.reduce(function(a,x){return a+x.actual},0),gap=tb-ta;
  const trs=rows.map(function(x){const df=x.actual-x.budget;return '<tr><td>'+esc(x.name)+'</td><td>'+won(x.budget)+'</td><td>'+won(x.actual)+'</td><td class="'+(df>0?'neg':df<0?'pos':'')+'">'+(df>0?'+':'')+won(df)+'</td><td>'+(df>0?'<span class="pill bad">초과 지출</span>':df<0?'<span class="pill good">절약</span>':'<span class="pill">계획대로</span>')+'</td></tr>'}).join('');
  const groups=[
    {name:'필수지출',names:['월세','전기·가스·수도'],b:0,a:0},
    {name:'변동지출',names:['식비','차량비'],b:0,a:0},
    {name:'공동생활비',names:['생활·기타'],b:0,a:0}
  ];groups.forEach(function(g){rows.forEach(function(x){if(g.names.indexOf(x.name)>=0){g.b+=x.budget;g.a+=x.actual}})});
  const bars=groups.map(function(g){const p=g.b?pct(g.a,g.b):0;return '<div class="bar-row '+(p>100?'over':'')+'"><div class="line"><strong>'+g.name+'</strong><span>'+won(g.a)+' / '+won(g.b)+'</span></div><div class="track"><div class="fill" style="width:'+Math.min(100,p)+'%"></div></div><div class="sub" style="text-align:right;margin-top:4px">'+p.toFixed(1)+'%</div></div>'}).join('');
  const tx=d.transactions.filter(function(t){return String(t.date||'').slice(0,7)===selectedMonth}).slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date))}).slice(0,8);
  document.getElementById('view-budget').innerHTML=
  '<div class="card budget-summary"><div><div class="card-title" style="margin:0">이번 달 예산 현황</div><div class="sub">계획한 범위 안에서 지출을 관리해요.</div></div><div class="summary-stat"><div class="meta-label">총 예산</div><div class="medium">'+won(tb)+'</div></div><div class="summary-stat"><div class="meta-label">실제 지출</div><div class="medium">'+won(ta)+'</div></div><div class="summary-stat"><div class="meta-label">조정 가능 금액</div><div class="medium '+(gap>=0?'pos':'neg')+'">'+won(Math.abs(gap))+'</div></div></div>'+
  '<div class="grid two" style="margin-top:14px"><div class="card"><div class="section-head"><div><div class="card-title" style="margin:0">▱ 항목별 예산 현황</div></div><button class="secondary" id="editBudget">✎ 예산 항목 편집</button></div><div class="table-wrap"><table><thead><tr><th>항목</th><th>예산</th><th>실제</th><th>차이</th><th>상태</th></tr></thead><tbody>'+trs+'<tr class="total-row"><td>합계</td><td>'+won(tb)+'</td><td>'+won(ta)+'</td><td class="'+(ta>tb?'neg':'pos')+'">'+(ta-tb>0?'+':'')+won(ta-tb)+'</td><td></td></tr></tbody></table></div></div>'+
  '<div class="grid"><div class="card"><div class="card-title">◎ 지출 그룹별 진행률</div><div class="bar-list">'+bars+'</div></div><div class="card suggestion"><div class="card-title">이번 달 조정 제안</div><ul>'+suggestions(rows,0)+'</ul></div></div></div>'+
  '<div class="card" style="margin-top:14px"><div class="section-head"><div class="card-title" style="margin:0">◷ 최근 거래 내역</div><button class="secondary" id="addTxBudget">＋ 거래 기록 추가</button></div>'+txTable(tx)+'</div>';
  document.getElementById('editBudget').onclick=openBudgetModal;document.getElementById('addTxBudget').onclick=openTxModal;
}
function txTable(tx){if(!tx.length)return '<div class="empty">이 달의 거래 기록이 없습니다.</div>';return '<div class="table-wrap"><table><thead><tr><th>날짜</th><th>구분</th><th>항목</th><th>메모</th><th>금액</th></tr></thead><tbody>'+tx.map(function(t){return '<tr><td>'+esc(t.date)+'</td><td>'+({expense:'지출',income:'수입',save:'저축'}[t.type]||t.type)+'</td><td>'+esc(t.category)+'</td><td>'+esc(t.memo||'')+'</td><td>'+won(t.amount)+'</td></tr>'}).join('')+'</tbody></table></div>'}
function renderSavings(){
  const s=currentSavings(),target=s.myT+s.hisT+s.jointT,actual=s.my+s.his+s.joint;
  const rows=Object.keys(d.records).sort().reverse().slice(0,8).map(function(m){const r=rec(m),t=N(r.myTarget)+N(r.hisTarget)+N(r.jointTarget),a=N(r.myActual)+N(r.hisActual)+N(r.jointActual),df=a-t;return '<tr class="'+(m===selectedMonth?'current-row':'')+'"><td>'+ymLabel(m)+'</td><td>'+man(r.myTarget)+' / '+man(r.myActual)+'</td><td>'+man(r.hisTarget)+' / '+man(r.hisActual)+'</td><td>'+man(r.jointActual||0)+'</td><td>'+man(t)+' / '+man(a)+'</td><td class="'+(df<0?'neg':df>0?'pos':'')+'">'+(df>0?'+':'')+man(df)+'</td><td>'+(df>=0?'<span class="pill good">달성</span>':'<span class="pill warn">부족</span>')+'</td></tr>'}).join('');
  const ms=historyMonths(5),targets=ms.map(function(m){const r=rec(m);return r?N(r.myTarget)+N(r.hisTarget)+N(r.jointTarget):0}),actuals=ms.map(function(m){const r=rec(m);return r?N(r.myActual)+N(r.hisActual)+N(r.jointActual):0});
  document.getElementById('view-savings').innerHTML=
  '<div class="grid three"><div class="card kpi"><div class="label">◎ 이번 달 목표 저축</div><div class="value">'+man(target)+'</div></div><div class="card kpi"><div class="label">▱ 이번 달 실제 저축</div><div class="value">'+man(actual)+'</div></div><div class="card kpi"><div class="label">누적 달성률</div><div class="value">'+pct(actual,target).toFixed(1)+'%</div><div class="progress yellow"><span style="width:'+Math.min(100,pct(actual,target))+'%"></span></div></div></div>'+
  '<div class="grid two" style="margin-top:14px;grid-template-columns:380px minmax(0,1fr)"><div class="card"><div class="card-title">✎ 저축 기록 입력</div><div class="sub" style="margin-bottom:14px">'+ymLabel(selectedMonth)+'의 목표와 실제 저축액을 저장하세요.</div><div class="input-grid">'+
  fieldNum('saveMyTarget','지은 목표 저축',s.myT)+fieldNum('saveMyActual','지은 실제 저축',s.my)+fieldNum('saveHisTarget','찬영 목표 저축',s.hisT)+fieldNum('saveHisActual','찬영 실제 저축',s.his)+fieldNum('saveJoint','공동 저축',s.joint)+'</div>'+
  '<div class="field" style="margin-top:12px"><label>메모</label><textarea id="saveMemo">'+esc(rec(selectedMonth)?.memo||'')+'</textarea></div><button class="primary" id="saveMonthRecord" style="width:100%;margin-top:12px">✓ 이번 달 기록 저장</button></div>'+
  '<div class="card"><div class="card-title">□ 월별 저축 기록</div><div class="table-wrap"><table><thead><tr><th>월</th><th>지은 목표/실제</th><th>찬영 목표/실제</th><th>공동</th><th>합계 목표/실제</th><th>차이</th><th>상태</th></tr></thead><tbody>'+(rows||'<tr><td colspan="7" class="empty">저축 기록이 없습니다.</td></tr>')+'</tbody></table></div></div></div>'+
  '<div class="grid two" style="margin-top:14px"><div class="card"><div class="card-title">↗ 저축 성과 추이</div><div class="chart-box">'+lineChart(ms,[{values:targets,cls:'line-j',point:'j'},{values:actuals,cls:'line-c',point:'c'}])+'</div></div><div class="card suggestion"><div class="card-title">저축 트렌드 요약</div><ul>'+(!rec(selectedMonth)?'<li>이번 달 실제 저축액을 입력하면 분석이 시작됩니다.</li>':(actual>=target?'<li>이번 달 저축 목표를 달성했습니다.</li>':'<li>이번 달 목표보다 '+man(target-actual)+' 부족합니다.</li>'))+'<li>목표와 실제를 분리해 기록하면 달성 추세가 자동 반영됩니다.</li></ul></div></div>';
  document.getElementById('saveMonthRecord').onclick=saveMonthRecord;
}
function fieldNum(id,label,val){return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="number" min="0" step="10000" value="'+N(val)+'"></div>'}
function saveMonthRecord(){const old=rec(selectedMonth)||{};d.records[selectedMonth]=Object.assign({},old,{month:selectedMonth,myTarget:N(document.getElementById('saveMyTarget').value),myActual:N(document.getElementById('saveMyActual').value),hisTarget:N(document.getElementById('saveHisTarget').value),hisActual:N(document.getElementById('saveHisActual').value),jointActual:N(document.getElementById('saveJoint').value),jointTarget:0,memo:document.getElementById('saveMemo').value});d.mySave=d.records[selectedMonth].myTarget;d.hisSave=d.records[selectedMonth].hisTarget;persist();render()}
function renderAssets(){
  const ms=historyMonths(6),my=ms.map(function(m){return assetsAtMonth('my',m)}),his=ms.map(function(m){return assetsAtMonth('his',m)}),sum=my.map(function(v,i){return v+his[i]});
  const avgMy=avgActual('my'),avgHis=avgActual('his'),avg=avgMy+avgHis;
  document.getElementById('view-assets').innerHTML=
  '<div class="grid four"><div class="card kpi"><div class="label"><span class="dot yellow"></span> 지은 현재 자산</div><div class="value">'+man(d.myAssets)+'</div></div><div class="card kpi"><div class="label"><span class="dot green"></span> 찬영 현재 자산</div><div class="value">'+man(d.hisAssets)+'</div></div><div class="card kpi"><div class="label">▱ 합산 자산</div><div class="value">'+man(N(d.myAssets)+N(d.hisAssets))+'</div></div><div class="card kpi"><div class="label">□ 예상 목표 달성일</div><div class="value" style="font-size:20px">'+expectedDate(N(d.myAssets)+N(d.hisAssets),avg||N(d.mySave)+N(d.hisSave),GOAL*2)+'</div></div></div>'+
  '<div class="grid two" style="margin-top:14px;grid-template-columns:minmax(0,1.6fr) minmax(300px,.7fr)"><div class="grid"><div class="card"><div class="card-title">↗ 자산 성장 추이</div><div class="sub" style="margin-bottom:8px">지은, 찬영, 합산 자산의 월별 변화를 확인하세요.</div><div class="chart-box" style="height:310px">'+lineChart(ms,[{values:my,cls:'line-j',point:'j'},{values:his,cls:'line-c',point:'c'},{values:sum,cls:'line-s',point:'s'}])+'</div></div>'+
  '<div class="card"><div class="card-title">월별 저축 추세</div><div class="table-wrap"><table><thead><tr><th>월</th><th>지은 자산</th><th>찬영 자산</th><th>합산</th></tr></thead><tbody>'+ms.map(function(m,i){return '<tr><td>'+ymLabel(m)+'</td><td>'+man(my[i])+'</td><td>'+man(his[i])+'</td><td>'+man(sum[i])+'</td></tr>'}).join('')+'</tbody></table></div></div></div>'+
  '<div class="grid"><div class="card"><div class="card-title">⚡ 가장 빠른 성장 구간</div><div class="medium">'+fastestGrowth(ms,sum)+'</div></div><div class="card"><div class="card-title">◴ 저축 속도</div><div class="medium">월 평균 '+man(avg)+' 저축 중</div><div class="sub" style="margin-top:8px">지은 '+man(avgMy)+' · 찬영 '+man(avgHis)+'</div></div><div class="card"><div class="card-title">△ 리스크 / 주의 포인트</div><div class="sub">실제 저축 기록이 적을수록 예상 달성일의 오차가 커집니다. 월별 실제 금액을 계속 기록해 주세요.</div></div></div></div>';
}
function avgActual(person){const rs=Object.keys(d.records).map(rec).filter(Boolean);if(!rs.length)return 0;return rs.reduce(function(s,r){return s+N(person==='my'?r.myActual:r.hisActual)},0)/rs.length}
function fastestGrowth(ms,sum){let best=-Infinity,label='기록 부족';for(let i=1;i<sum.length;i++){const g=sum[i]-sum[i-1];if(g>best){best=g;label=Number(ms[i-1].slice(5))+'월 → '+Number(ms[i].slice(5))+'월 · +'+man(g)}}return best>0?label:'기록 부족'}
function renderGoals(){
  const myP=pct(d.myAssets,GOAL),hisP=pct(d.hisAssets,GOAL),jg=d.jointGoal||defaults.jointGoal,jp=pct(jg.current,jg.target);
  document.getElementById('view-goals').innerHTML=
  '<div class="section-head"><div><h2>목표 설정</h2><p>개인 목표와 둘이 함께 이루고 싶은 목표를 관리하세요.</p></div></div>'+
  '<div class="grid two">'+goalPerson('지은',d.myAssets,d.mySave,myP,'yellow','my')+goalPerson('찬영',d.hisAssets,d.hisSave,hisP,'green','his')+'</div>'+
  '<div class="card goal-card" style="margin-top:14px"><div class="section-head"><div><div class="card-title" style="margin:0">공동 목표</div><div class="sub">둘이 함께 준비하는 목표를 따로 설정할 수 있습니다.</div></div><button class="secondary" id="editJointGoal">✎ 공동 목표 편집</button></div>'+
  (jg.target>0?'<div class="goal-amounts"><div><div class="meta-label">목표</div><div class="medium">'+won(jg.target)+'</div></div><div><div class="meta-label">현재</div><div class="medium">'+won(jg.current)+'</div></div><div><div class="meta-label">월 저축</div><div class="medium">'+won(jg.monthly)+'</div></div><div><div class="meta-label">예상 달성일</div><div class="medium">'+expectedDate(jg.current,jg.monthly,jg.target)+'</div></div></div><div class="progress pink"><span style="width:'+Math.min(100,jp)+'%"></span></div>':'<div class="empty">아직 공동 목표가 없습니다. 목표 금액을 설정해보세요.</div>')+'</div>'+
  '<div class="grid two" style="margin-top:14px"><div class="card"><div class="card-title">⚑ 목표 달성 타임라인</div>'+timelineHtml(N(d.myAssets)+N(d.hisAssets))+'</div><div class="card"><div class="card-title">▤ 목표 조정 시뮬레이션</div>'+simulationHtml()+'</div></div>';
  document.getElementById('editJointGoal').onclick=editJointGoal;
  document.querySelectorAll('[data-edit-person]').forEach(function(b){b.onclick=function(){editPersonGoal(b.dataset.editPerson)}})
}
function goalPerson(name,assets,monthly,p,color,key){return '<div class="card goal-card"><div class="goal-top"><div><div class="person-name"><span class="dot '+color+'"></span>'+name+'의 목표</div><div class="medium" style="margin-top:10px">1억원 모으기</div><div class="sub">장기적인 자산 형성을 위한 개인 목표</div></div><button class="secondary" data-edit-person="'+key+'">✎ 수정</button></div><div class="goal-amounts"><div><div class="meta-label">목표 금액</div><div class="meta-value">1억원</div></div><div><div class="meta-label">현재 자산</div><div class="meta-value">'+man(assets)+'</div></div><div><div class="meta-label">월 목표 저축</div><div class="meta-value">'+man(monthly)+'</div></div><div><div class="meta-label">예상 달성일</div><div class="meta-value">'+expectedDate(assets,monthly,GOAL)+'</div></div></div><div class="progress '+color+'"><span style="width:'+Math.min(100,p)+'%"></span></div><div class="sub" style="margin-top:7px">'+p.toFixed(1)+'% · 남은 금액 '+man(Math.max(0,GOAL-assets))+'</div></div>'}
function timelineHtml(sum){const milestones=[0,50000000,100000000,200000000];return '<div class="timeline">'+milestones.map(function(v,i){return '<div class="mile '+(sum>=v?'active':'')+'"><span></span><strong>'+(i===0?'현재':man(v))+'</strong>'+(sum>=v?'도달':'예정')+'</div>'}).join('')+'</div>'}
function simulationHtml(){const base=N(d.mySave)+N(d.hisSave);return '<div class="table-wrap"><table><thead><tr><th>월 저축액</th><th>합산 2억원 예상</th><th>기준 대비</th></tr></thead><tbody>'+[-500000,0,500000,1000000].map(function(delta){const m=Math.max(0,base+delta),dt=expectedDate(N(d.myAssets)+N(d.hisAssets),m,GOAL*2);const months=monthsTo(N(d.myAssets)+N(d.hisAssets),m,GOAL*2),baseMonths=monthsTo(N(d.myAssets)+N(d.hisAssets),base,GOAL*2),df=months-baseMonths;return '<tr><td>'+man(m)+'</td><td>'+dt+'</td><td class="'+(df<0?'pos':df>0?'neg':'')+'">'+(df===0?'—':(df>0?'+':'')+df+'개월')+'</td></tr>'}).join('')+'</tbody></table></div>'}
function editPersonGoal(key){const cur=key==='my'?d.mySave:d.hisSave,val=prompt((key==='my'?'지은':'찬영')+' 월 목표 저축액을 입력하세요.',String(cur));if(val===null)return;if(key==='my')d.mySave=N(val);else d.hisSave=N(val);persist();render()}
function editJointGoal(){const name=prompt('공동 목표 이름을 입력하세요.',d.jointGoal.name||'공동 목표');if(name===null)return;const target=prompt('공동 목표 금액을 입력하세요.',String(d.jointGoal.target||0));if(target===null)return;const current=prompt('현재 공동 자산을 입력하세요.',String(d.jointGoal.current||0));if(current===null)return;const monthly=prompt('월 공동 저축액을 입력하세요.',String(d.jointGoal.monthly||0));if(monthly===null)return;d.jointGoal={name:name,target:N(target),current:N(current),monthly:N(monthly)};persist();render()}
function renderBackup(){
  document.getElementById('view-backup').innerHTML=
  '<div class="backup-actions"><button class="backup-action" id="csvBtn"><div class="icon">▧</div><h3>CSV 내보내기</h3><p>월별 저축 기록과 거래 내역을 CSV 파일로 내보냅니다.</p></button><button class="backup-action" id="jsonBtn"><div class="icon">◫</div><h3>JSON 백업</h3><p>모든 설정과 기록을 하나의 백업 파일로 저장합니다.</p></button><button class="backup-action" id="restoreBtn"><div class="icon">⇧</div><h3>백업 불러오기</h3><p>이전에 저장한 JSON 파일로 데이터를 복원합니다.</p></button><button class="backup-action" id="resetBtn"><div class="icon">↻</div><h3>데이터 초기화</h3><p>현재 브라우저의 모든 가계 데이터를 처음 상태로 되돌립니다.</p></button></div>'+
  '<div class="grid two" style="margin-top:14px"><div class="card"><div class="card-title">▱ 백업 상태</div><div class="table-wrap"><table><tbody><tr><td>저장 방식</td><td>현재 브라우저 localStorage</td></tr><tr><td>저축 기록</td><td>'+Object.keys(d.records).length+'개월</td></tr><tr><td>거래 기록</td><td>'+d.transactions.length+'건</td></tr><tr><td>동기화 상태</td><td><span class="pill good">저장됨</span></td></tr></tbody></table></div></div><div class="card"><div class="card-title">백업 도움말</div><div class="sub">장기 사용 전이나 큰 변경 전에는 JSON 백업을 권장합니다. CSV는 엑셀·구글 스프레드시트에서 열 수 있습니다.</div></div></div>';
  document.getElementById('csvBtn').onclick=downloadCSV;document.getElementById('jsonBtn').onclick=downloadJSON;document.getElementById('restoreBtn').onclick=function(){document.getElementById('restoreFile').click()};document.getElementById('resetBtn').onclick=resetAll;
}
function dl(name,txt,type){const u=URL.createObjectURL(new Blob([txt],{type:type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
function downloadJSON(){dl('our-money-backup.json',JSON.stringify(d,null,2),'application/json')}
function downloadCSV(){const lines=[['월','지은 목표','지은 실제','찬영 목표','찬영 실제','공동 실제','메모']];Object.keys(d.records).sort().forEach(function(m){const r=rec(m);lines.push([m,r.myTarget,r.myActual,r.hisTarget,r.hisActual,r.jointActual||0,r.memo||''])});dl('our-money-savings.csv','\ufeff'+lines.map(function(x){return x.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n'),'text/csv')}
function resetAll(){if(confirm('모든 설정과 기록을 삭제하고 초기화할까요?')){localStorage.removeItem(K);location.reload()}}
function openTxModal(){document.getElementById('txDate').value=selectedMonth+'-01';document.getElementById('txAmount').value='';document.getElementById('txCategory').value='';document.getElementById('txMemo').value='';document.getElementById('txModal').classList.add('open')}
function openBudgetModal(){document.getElementById('budgetEditor').innerHTML=d.budgetPlan.map(function(x,i){return '<div class="input-grid" style="margin-bottom:10px"><div class="field"><label>항목</label><input data-bname="'+i+'" type="text" value="'+esc(x.name)+'"></div><div class="field"><label>예산</label><input data-bvalue="'+i+'" type="number" min="0" step="10000" value="'+N(x.budget)+'"></div></div>'}).join('');document.getElementById('budgetModal').classList.add('open')}
function saveBudget(){d.budgetPlan=d.budgetPlan.map(function(x,i){return {name:document.querySelector('[data-bname="'+i+'"]').value||x.name,budget:N(document.querySelector('[data-bvalue="'+i+'"]').value)}});persist();document.getElementById('budgetModal').classList.remove('open');render()}
function render(){renderHeader();if(currentView==='dashboard')renderDashboard();if(currentView==='budget')renderBudget();if(currentView==='savings')renderSavings();if(currentView==='assets')renderAssets();if(currentView==='goals')renderGoals();if(currentView==='backup')renderBackup()}
document.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){setView(b.dataset.view)}});document.querySelectorAll('[data-view-jump]').forEach(function(b){b.onclick=function(){setView(b.dataset.viewJump)}});
document.getElementById('prevMonth').onclick=function(){selectedMonth=monthShift(selectedMonth,-1);render()};document.getElementById('nextMonth').onclick=function(){selectedMonth=monthShift(selectedMonth,1);render()};
document.getElementById('addTxTop').onclick=openTxModal;document.querySelectorAll('[data-close-modal]').forEach(function(b){b.onclick=function(){b.closest('.modal').classList.remove('open')}});document.getElementById('saveTx').onclick=function(){const amount=N(document.getElementById('txAmount').value),category=document.getElementById('txCategory').value.trim();if(!amount||!category){alert('항목과 금액을 입력하세요.');return}d.transactions.push({id:Date.now(),date:document.getElementById('txDate').value||selectedMonth+'-01',type:document.getElementById('txType').value,category:category,amount:amount,memo:document.getElementById('txMemo').value.trim()});persist();document.getElementById('txModal').classList.remove('open');render()};
document.getElementById('saveBudget').onclick=saveBudget;document.getElementById('restoreFile').onchange=async function(e){try{const f=e.target.files[0];if(!f)return;const obj=JSON.parse(await f.text());if(!obj.records||!Array.isArray(obj.expenses))throw new Error('bad');if(confirm('현재 데이터를 백업 파일로 덮어쓸까요?')){d=Object.assign({},defaults,obj);if(!d.transactions)d.transactions=[];if(!d.budgetPlan)d.budgetPlan=defaults.budgetPlan;persist();render()}}catch(err){alert('올바른 JSON 백업 파일이 아닙니다.')}e.target.value=''};
document.querySelectorAll('.modal').forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)m.classList.remove('open')})});
window.addEventListener('storage',function(e){if(e.key!==K||!e.newValue)return;try{d=Object.assign({},defaults,JSON.parse(e.newValue));render()}catch(err){}});
persist();setView(currentView);
})();
</script>
</body>
</html>
