<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work Today</title></head><body><script>(async()=>{const r=await fetch('./work-today-v3.html?v=20260908-tags-v17',{cache:'no-store'});let html=await r.text();const css=`<style id="wt-no-tags">.tag,.tag-picker{display:none!important}.task-row{grid-template-columns:20px minmax(0,1fr) 48px 16px!important}@media(max-width:620px){.task-row{grid-template-columns:18px minmax(0,1fr) 42px 14px!important}}@media(max-width:470px){.task-row{grid-template-columns:16px minmax(0,1fr) 0 12px!important}}</style>`;const patch=`<script>(()=>{try{['today','tomorrow'].forEach(k=>(s[k]||[]).forEach(t=>{delete t.tag;delete t.tone}));saveLocal()}catch{};renderTodayTomorrow=function(k){const root=document.getElementById(k+'List');root.innerHTML='';s[k].forEach(t=>{const r=document.createElement('div');r.className='task-row'+(t.done?' done':'');r.innerHTML=\`<button class="check \\${t.done?'done':''}" aria-label="완료">\\${t.done?'✓':''}</button><input class="task-text" value="\\${esc(t.text)}" placeholder="메모 입력"><input class="time-input" value="\\${esc(t.time||'')}" placeholder="--:--" maxlength="5" inputmode="numeric"><button class="delete" aria-label="삭제">×</button>\`;r.querySelector('.check').onclick=()=>{t.done=!t.done;save();renderAll()};const text=r.querySelector('.task-text');text.oninput=e=>{t.text=e.target.value;save();updateProgress()};text.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add(k)}};const ti=r.querySelector('.time-input');ti.oninput=e=>{let v=e.target.value.replace(/[^0-9:]/g,'').slice(0,5);if(/^\\d{3,4}$/.test(v)&&!v.includes(':'))v=v.slice(0,-2)+':'+v.slice(-2);e.target.value=v;t.time=v;save()};r.querySelector('.delete').onclick=()=>removeTask(k,t.id);root.appendChild(r)})};renderAll()})()<\/script>`;html=html.replace('</head>',css+'</head>').replace('</body>',patch+'</body>');document.open();document.write(html);document.close()})().catch(()=>{location.replace('./work-today-v3.html?v=20260908-tags-v17')});</script></body></html>
