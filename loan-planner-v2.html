<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Loan Planner v2</title>
<link rel="stylesheet" href="./assets/life-town-v2.css">
<style>
:root{--bg:#fff;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--line:#e5e5e8;--soft:#f7f7f8;--soft2:#fafafa;--blue:#007aff;--blue-soft:rgba(0,122,255,.07);--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}
html[data-lt-theme="dark"]{--bg:#1c1c1e;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--line:#38383a;--soft:#2c2c2e;--soft2:#242426;--blue:#0a84ff;--blue-soft:rgba(10,132,255,.13);--shadow:none}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent}body{padding:8px!important;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
.widget{width:100%;max-width:500px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:13px;box-shadow:var(--shadow);container-type:inline-size}.header{margin-bottom:11px}.title{font-size:18px;font-weight:760;letter-spacing:-.04em;line-height:1.1}.sub{font-size:10.5px;color:var(--muted);margin-top:4px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.card{min-width:0;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--bg)}.label{font-size:9.8px;font-weight:700;color:var(--sub);margin-bottom:6px}.value{font-size:18px;line-height:1.12;font-weight:720;letter-spacing:-.035em;font-variant-numeric:tabular-nums;white-space:nowrap}.unit{font-size:10px;margin-left:2px;color:var(--sub);font-weight:600}.range{margin-top:11px}.track{position:relative;height:18px}.track input{position:absolute;inset:0;width:100%;height:18px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer}.track input::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:linear-gradient(90deg,var(--blue) 0 var(--fill),var(--line) var(--fill) 100%)}.track input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--blue);margin-top:-6px;box-shadow:0 1px 2px rgba(0,0,0,.08)}.track input::-moz-range-track{height:4px;border-radius:999px;background:var(--line)}.track input::-moz-range-progress{height:4px;border-radius:999px;background:var(--blue)}.track input::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--blue)}.ends{display:flex;justify-content:space-between;font-size:8.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}.result{margin-top:8px;border:1px solid var(--line);border-radius:14px;background:var(--soft2);padding:11px 12px}.result-main{display:flex;align-items:center;justify-content:space-between;gap:12px}.result-label{font-size:10.5px;font-weight:720}.result-note{font-size:8.8px;color:var(--muted);margin-top:3px}.monthly{font-size:24px;font-weight:740;color:var(--blue);letter-spacing:-.04em;white-space:nowrap;font-variant-numeric:tabular-nums}.breakdown{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:8.8px;color:var(--sub)}.breakdown strong{color:var(--text);font-weight:720}.breakdown span:last-child{text-align:right;font-variant-numeric:tabular-nums}.footer{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:9px;font-size:8.6px;color:var(--muted)}.footer span{line-height:1.4}.footer span:last-child{white-space:nowrap;text-align:right}
@container(max-width:430px){.controls{gap:6px}.card{padding:9px}.value{font-size:16.5px}.monthly{font-size:21px}.result-main{align-items:flex-end}}
@container(max-width:340px){.controls{grid-template-columns:1fr}.breakdown,.footer{flex-direction:column;align-items:flex-start;gap:4px}.breakdown span:last-child,.footer span:last-child{text-align:left}}
</style>
</head>
<body>
<main class="widget" aria-label="대출 플래너" data-widget-control-root data-control-sizes="460,500,540">
<header class="header"><div class="title">Loan Planner</div><div class="sub">대출 금액·금리·기간으로 월 상환액 계산</div></header>
<section class="controls">
<div class="card"><div class="label">대출 금액</div><div class="value" id="amountValue">₩380,000,000</div><div class="range"><div class="track"><input id="amount" type="range" min="100000000" max="1000000000" step="10000000" value="380000000" aria-label="대출 금액"></div><div class="ends"><span>1억</span><span>10억</span></div></div></div>
<div class="card"><div class="label">금리</div><div class="value"><span id="rateValue">4.20</span><span class="unit">%</span></div><div class="range"><div class="track"><input id="rate" type="range" min="2" max="7" step="0.05" value="4.20" aria-label="금리"></div><div class="ends"><span>2%</span><span>7%</span></div></div></div>
<div class="card"><div class="label">대출 기간</div><div class="value"><span id="yearsValue">30</span><span class="unit">년</span></div><div class="range"><div class="track"><input id="years" type="range" min="10" max="50" step="1" value="30" aria-label="대출 기간"></div><div class="ends"><span>10년</span><span>50년*</span></div></div></div>
</section>
<section class="result" aria-live="polite"><div class="result-main"><div><div class="result-label">예상 월 상환액</div><div class="result-note">원금 + 이자 · 원리금균등상환</div></div><div class="monthly" id="monthly">₩1,858,265</div></div><div class="breakdown"><span><strong>월 상환액</strong> = 원금 + 이자</span><span id="firstBreakdown">첫 달 원금 — · 이자 —</span></div></section>
<footer class="footer"><span>* 최장 50년 선택 가능. 실제 만기는 상품·연령·심사 조건에 따라 달라질 수 있습니다.</span><span id="asOf">기준일: —</span></footer>
</main>
<script>
const q=new URLSearchParams(location.search),forced=q.get('theme'),dark=matchMedia('(prefers-color-scheme:dark)').matches;if(!document.documentElement.dataset.ltTheme)document.documentElement.dataset.ltTheme=(forced==='light'||forced==='dark')?forced:(dark?'dark':'light');
const amount=document.getElementById('amount'),rate=document.getElementById('rate'),years=document.getElementById('years');const won=n=>'₩'+Math.round(n).toLocaleString('ko-KR');
function fill(el){const min=+el.min,max=+el.max,val=+el.value;el.style.setProperty('--fill',((val-min)/(max-min)*100)+'%')}
function calc(){const p=+amount.value,a=+rate.value/100,n=+years.value*12,r=a/12;const payment=r===0?p/n:p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);const firstInterest=p*r;const firstPrincipal=payment-firstInterest;document.getElementById('amountValue').textContent=won(p);document.getElementById('rateValue').textContent=(+rate.value).toFixed(2);document.getElementById('yearsValue').textContent=years.value;document.getElementById('monthly').textContent=won(payment);document.getElementById('firstBreakdown').textContent=`첫 달 원금 ${won(firstPrincipal)} · 이자 ${won(firstInterest)}`;[amount,rate,years].forEach(fill)}
[amount,rate,years].forEach(el=>el.addEventListener('input',calc));const parts=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=t=>parts.find(x=>x.type===t)?.value||'';document.getElementById('asOf').textContent=`기준일: ${get('year')}.${get('month')}.${get('day')}`;calc();
</script>
<script src="./assets/life-town-controls-v2.js"></script>
</body>
</html>
