<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="light only" />
<title>루틴 트래커</title>
<style>
:root{--card:#fff;--ink:#2f2f2f;--muted:#b9b9b9;--muted2:#cecece;--dot:#343434;--empty:#ededed;--line:#f1f1f1}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:transparent}body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}.wrap{width:100%;padding:0}.card{width:100%;background:var(--card);border-radius:20px;padding:14px 15px 14px;box-shadow:0 0 0 1px rgba(0,0,0,.018)}.top{display:grid;grid-template-columns:minmax(0,1fr) 78px 54px;align-items:start;column-gap:8px}.title{font-size:13px;font-weight:750;letter-spacing:-.045em;margin-bottom:7px}.label{font-size:8px;color:#b8b8b8;font-weight:600;line-height:1.1}.count{margin-top:1px;display:flex;align-items:flex-end;gap:3px;line-height:1}.count .done{font-size:20px;font-weight:800;letter-spacing:-.06em}.count .slash{font-size:13px;color:#d0d0d0;font-weight:700;margin-bottom:2px}.count .total{font-size:13px;color:#c3c3c3;font-weight:700;margin-bottom:1px}.gauge{display:flex;justify-content:center;align-items:center;padding-top:15px}.gauge svg{width:72px;height:34px;overflow:visible}.percent{text-align:right;padding-top:1px}.percent .label{text-align:right}.percent-row{display:flex;align-items:flex-end;justify-content:flex-end;gap:1px;line-height:1;margin-top:1px}.percent-row strong{font-size:20px;letter-spacing:-.06em}.percent-row span{font-size:10px;font-weight:700;margin-bottom:1px;color:#808080}.tracker{margin-top:14px;display:grid;grid-template-columns:42px repeat(7,1fr);column-gap:3px;row-gap:8px;align-items:center}.day{font-size:8px;color:#bcbcbc;text-align:center;font-weight:500}.row-wrap{display:flex;align-items:center;gap:3px;min-width:0}.row-label{font-size:9px;font-weight:700;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.remove{width:13px;height:13px;border:0;border-radius:50%;padding:0;display:grid;place-items:center;background:#f3f3f3;color:#aaa;font-size:10px;cursor:pointer;flex:0 0 auto}.remove:hover{background:#e9e9e9;color:#777}.dot{width:10px;height:10px;border:0;border-radius:50%;padding:0;margin:auto;background:var(--empty);cursor:pointer;transition:transform .12s ease,background .12s ease}.dot:hover{transform:scale(1.13)}.dot.active{background:var(--dot)}.add-area{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;gap:6px;align-items:center}.add-input{flex:1;min-width:0;height:28px;border:0;outline:0;border-radius:9px;background:#f7f7f7;color:var(--ink);font-size:10px;padding:0 9px}.add-input::placeholder{color:#b9b9b9}.add-btn{height:28px;border:0;border-radius:9px;background:#343434;color:#fff;font-size:10px;font-weight:750;padding:0 10px;cursor:pointer}.add-btn:hover{opacity:.9}@media(max-width:320px){.top{grid-template-columns:minmax(0,1fr) 66px 50px}.gauge svg{width:62px}.tracker{grid-template-columns:38px repeat(7,1fr)}.card{padding:13px 12px}}
</style>
</head>
<body>
<div class="wrap">
<section class="card" aria-label="루틴 트래커">
  <div class="top">
    <div>
      <div class="title">루틴 트래커</div>
      <div class="label">이번 주</div>
      <div class="count"><span class="done" id="doneCount">0</span><span class="slash">/</span><span class="total" id="totalCount">0</span></div>
    </div>
    <div class="gauge" aria-hidden="true">
      <svg viewBox="0 0 72 34">
        <line id="graphLine" x1="7" y1="25" x2="61" y2="11" stroke="#9b9b9b" stroke-width="1.25" stroke-linecap="round"/>
        <circle id="graphDot" cx="61" cy="11" r="2.15" fill="#313131"/>
      </svg>
    </div>
    <div class="percent">
      <div class="label">달성률</div>
      <div class="percent-row"><strong id="percent">0</strong><span>%</span></div>
    </div>
  </div>

  <div class="tracker" id="tracker">
    <div></div>
    <div class="day">월</div><div class="day">화</div><div class="day">수</div><div class="day">목</div><div class="day">금</div><div class="day">토</div><div class="day">일</div>
  </div>

  <div class="add-area">
    <input id="routineInput" class="add-input" type="text" maxlength="12" placeholder="새 항목 추가" aria-label="새 루틴 이름" />
    <button id="addBtn" class="add-btn" type="button">추가</button>
  </div>
</section>
</div>
<script>
const DAYS=['월','화','수','목','금','토','일'];
const KEY='routineTracker.v3';
const OLD_KEY='routineTracker.v2';
const DEFAULT=[
  {name:'운동',checks:[0,0,0,0,0,0,0],custom:false},
  {name:'독서',checks:[0,0,0,0,0,0,0],custom:false},
  {name:'명상',checks:[0,0,0,0,0,0,0],custom:false}
];
function copyDefault(){return JSON.parse(JSON.stringify(DEFAULT))}
function normalize(v){
  if(!Array.isArray(v)||!v.length)return null;
  const out=v.filter(x=>x&&typeof x.name==='string'&&Array.isArray(x.checks)).map(x=>({name:x.name.trim().slice(0,12),checks:DAYS.map((_,i)=>x.checks[i]?1:0),custom:!!x.custom})).filter(x=>x.name);
  return out.length?out:null;
}
function load(){
  try{const v=normalize(JSON.parse(localStorage.getItem(KEY)||'null'));if(v)return v}catch(e){}
  try{const old=JSON.parse(localStorage.getItem(OLD_KEY)||'null');if(Array.isArray(old)&&old.length===3&&old.every(r=>Array.isArray(r)&&r.length===7)){const d=copyDefault();d.forEach((x,i)=>x.checks=old[i].map(v=>v?1:0));return d}}catch(e){}
  return copyDefault();
}
let state=load();
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function updateSummary(){
  const done=state.reduce((sum,row)=>sum+row.checks.reduce((a,b)=>a+b,0),0);
  const total=state.length*7;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('doneCount').textContent=done;
  document.getElementById('totalCount').textContent=total;
  document.getElementById('percent').textContent=pct;
  const x1=7,y1=25,x2=61;
  const y2=23-(pct/100)*14;
  const line=document.getElementById('graphLine'),dot=document.getElementById('graphDot');
  line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',x2);line.setAttribute('y2',y2.toFixed(2));
  dot.setAttribute('cx',x2);dot.setAttribute('cy',y2.toFixed(2));
}
function render(){
  const tracker=document.getElementById('tracker');
  tracker.querySelectorAll('.dynamic').forEach(el=>el.remove());
  state.forEach((item,r)=>{
    const wrap=document.createElement('div');wrap.className='row-wrap dynamic';
    const label=document.createElement('div');label.className='row-label';label.textContent=item.name;wrap.appendChild(label);
    if(item.custom){const del=document.createElement('button');del.className='remove';del.type='button';del.textContent='×';del.title='항목 삭제';del.onclick=()=>{state.splice(r,1);save();render()};wrap.appendChild(del)}
    tracker.appendChild(wrap);
    DAYS.forEach((day,d)=>{const b=document.createElement('button');b.className='dot dynamic'+(item.checks[d]?' active':'');b.type='button';b.setAttribute('aria-label',`${item.name} ${day} 체크`);b.onclick=()=>{state[r].checks[d]=state[r].checks[d]?0:1;save();render()};tracker.appendChild(b)});
  });
  updateSummary();
}
function addRoutine(){const input=document.getElementById('routineInput'),name=input.value.trim();if(!name)return;state.push({name:name.slice(0,12),checks:[0,0,0,0,0,0,0],custom:true});input.value='';save();render()}
document.getElementById('addBtn').onclick=addRoutine;
document.getElementById('routineInput').addEventListener('keydown',e=>{if(e.key==='Enter')addRoutine()});
render();
</script>
</body>
</html>
