<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>투자 레이더 · 사전 방향 예측</title><style>body{margin:0;background:#f2f5fa;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px 16px}a{color:#365e9a}.source-note{padding:12px 16px;border:1px solid #d9e2ef;background:#fff;border-radius:12px;color:#566b86;font-size:13px;line-height:1.7}</style><script src="./assets/stock-forecast.js?v=direction-forecast-1.0" defer></script><script src="./assets/stock-forecast-learning.js?v=forward-learning-1.0" defer></script></head><body><main class="wrap"><a href="./stock-value-radar.html">‹ 투자 레이더</a><p class="source-note">현재는 지연 가능한 제공처 자료로 정기 실행합니다. 장중 모델은 마지막 확정 봉 이후 30분의 간격을 두고, 그 뒤의 30분 구간을 예측하도록 학습합니다. 따라서 ‘지금부터 30분’이 아니라 카드의 <b>예측 시작·종료 시각</b>을 확인하세요. 토스 실시간 인증이 완료된 상태로 표시하지 않습니다.</p><section id="directionForecast"></section></main></body></html>
