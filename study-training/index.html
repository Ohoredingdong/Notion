/* Study Training / visual refinement v2 — same IA, improved hierarchy and balance */
:root{--bg:#faf8f5;--panel:#fffefd;--ink:#292623;--muted:#6f6864;--line:#ebe5e0;--accent:#d99284;--accentlight:#fff0e9;--good:#619176;--bad:#ca5c62;--side:#fffcfa;--shadow:0 10px 26px rgba(71,57,50,.065)}
body{background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.app{grid-template-columns:176px minmax(0,1fr);grid-template-rows:94px minmax(0,1fr)}
.sidebar{padding:22px 13px 16px;background:#fffcfa;border-right-color:#eae5df}
.study-logo{font-size:16px;letter-spacing:-.7px;padding:8px 7px 27px;font-weight:800;gap:9px}
.study-logo-mark{width:24px;height:24px;font-size:15px;background:#282728}
.side-list{gap:6px}.sidebtn{font-size:14px;min-height:46px;padding:11px 11px;gap:11px;font-weight:650;color:#605852}
.sidebtn .st-icon{width:19px;height:19px;stroke-width:1.8}
.sidebtn.active{background:#f3e9e3;color:#2d2522}
.sidebtn:focus-visible,.course-tile:focus-visible,.trend-start:focus-visible{outline:3px solid #8ba6d4;outline-offset:2px}
.siteheader{height:94px;padding:15px 24px 11px 25px;gap:20px}
.header-greeting{font-size:22px;line-height:1.25;letter-spacing:-.85px;margin-bottom:7px;color:#292523;font-weight:800}
.header-identity p{font-size:12.5px;color:#726c69;line-height:1.35}
.siteheader nav{gap:9px}
.siteheader .navbtn{width:81px;min-height:64px;font-size:12px;font-weight:680;gap:5px;border-radius:14px;border:1px solid #eee8e3;background:#fffdfa;box-shadow:0 5px 13px #4d3b3210;color:#4d4642}
.siteheader .navbtn .st-icon{width:23px;height:23px}
.siteheader .navbtn.active,.siteheader .navbtn:hover{background:#f6eae4;border-color:#efdbd2;color:#8f5e50}
.header-actions{gap:5px}.header-round{width:39px;height:39px}
.main{padding:13px 24px 12px 25px}
.study-dashboard{gap:17px}
.dash-top{grid-template-columns:1.04fr .96fr;gap:17px}
.dash-middle{grid-template-columns:1.05fr repeat(3,1fr);gap:16px}
.dash-bottom{grid-template-columns:1fr 1fr 1fr;gap:16px}
.dash-top>.st-card{height:236px;min-height:236px}
.dash-middle>.st-card,.dash-middle>.course-tile{height:229px}
.dash-bottom>.st-card{height:213px}
.st-card{background:#fffefd;border:1px solid #ebe4df;border-radius:19px;box-shadow:0 9px 26px rgba(82,62,52,.066);padding:18px 20px}
.st-card-header{margin-bottom:12px;gap:9px}
.st-card-header h2{font-size:20px;letter-spacing:-.65px;font-weight:800;color:#2c2725}
.st-card-header h2 .st-icon{color:#c7836e;width:24px;height:24px}
.muted-small{font-size:12px;color:#756c67}.muted-small strong{font-size:14px;color:#312a28}
.st-inline-button{font-size:12px;color:#71635e;padding:6px 4px;font-weight:650}
.routine-panel{padding:19px 21px}
.routine-panel .st-card-header{margin-bottom:10px}
.routine-pill{background:#f8eee9;color:#6c5a54;font-size:12px;padding:6px 12px}
.routine-pill strong{color:#bb7462}
.routine-panel .st-card-header>.st-progress{width:91px;margin-right:0}
.st-progress{height:10px;background:#eee9e6;min-width:28px}
.st-progress>span{background:#dc9685}.st-progress.st-brain>span{background:#93a9e5}.st-progress.st-reading>span{background:#88b6a1}.st-progress.st-review>span{background:#c5afcf}
.routine-row{grid-template-columns:23px 27px minmax(94px,1fr) minmax(72px,1.1fr) 40px 20px;gap:8px;min-height:43px;padding:5px 5px;border-bottom:1px solid #f1ebe7;border-radius:8px}
.routine-row:hover{background:#fbf6f2}
.routine-checkbox{width:20px;height:20px;border-radius:6px;border-color:#cdbfba}
.routine-row.done .routine-checkbox{background:#517f69;border-color:#517f69}
.routine-subject-icon .st-icon{height:23px;width:23px}
.routine-name{font-size:13px;font-weight:740;letter-spacing:-.3px;color:#34302d}
.routine-min{font-size:12px;color:#584e4a}
.routine-status{height:18px;width:18px;background:#df9e8e}
.routine-row .st-progress{height:9px}
.st-math{color:#bd7563}.st-brain{color:#6186d1}.st-reading{color:#4e8f6f}.st-review{color:#aa85b9}
.weekly-panel{padding:19px 20px}.weekly-panel .st-card-header{margin-bottom:8px}
.weekly-content-grid{grid-template-columns:163px minmax(0,1fr);gap:16px;height:165px}
.donut{width:155px;height:155px}
.weekly-rows{gap:13px}.goal-row{gap:10px}
.weekly-icon{width:35px;height:35px;border-radius:11px;background:#fff0e9}
.weekly-icon.st-brain{background:#edf1ff}.weekly-icon.st-reading{background:#edf6ed}
.weekly-heading strong{font-size:13px;font-weight:730;color:#332d29}.weekly-heading small{font-size:11px;color:#645d59}
.weekly-content .st-progress{height:9px}
.st-calendar{padding:18px 20px}.st-calendar .st-card-header{margin-bottom:9px}
.st-calendar .st-card-header h2{font-size:17px;font-weight:780}
.icon-control{width:29px;height:29px;font-size:25px;color:#574f4b}
.cal-weekdays{height:22px;font-size:11px;color:#837972;margin-bottom:6px}
.cal-dates{grid-template-rows:repeat(6,minmax(22px,1fr))}
.cal-day{width:26px;height:26px;font-size:12px;color:#49423e}
.cal-day.is-today{background:#edb2a4;color:#392823}
.cal-foot{font-size:10px;color:#857b75;margin-top:4px}
.course-tile{position:relative;border-radius:19px;gap:8px;padding:18px 11px;border:1px solid transparent;box-shadow:0 9px 26px #523c3513;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.course-tile.st-math{background:#fff0e9;border-color:#f3dad0}
.course-tile.st-brain{background:#edf1fd;border-color:#dce4f5}
.course-tile.st-reading{background:#edf5ed;border-color:#dbeadf}
.course-tile:hover{transform:translateY(-4px);box-shadow:0 16px 32px #51403820}
.course-tile-icon{margin:0}.course-tile-icon .st-icon{height:48px;width:48px;stroke-width:1.65}
.course-tile.st-math .course-tile-icon{color:#c77f65}
.course-tile.st-brain .course-tile-icon{color:#5f85cd}
.course-tile.st-reading .course-tile-icon{color:#578d6c}
.course-tile strong{font-size:21px;letter-spacing:-.75px;font-weight:800;color:#2f2927}
.tile-sub{font-size:11.5px;color:#6b625f;line-height:1.4}
.tile-action{display:inline-flex;align-items:center;justify-content:center;gap:4px;border-radius:999px;background:#fffdfb;border:1px solid #ece4dd;box-shadow:0 3px 10px #44362b0d;color:#4a3932;font-size:12px;font-weight:780;min-height:29px;padding:4px 13px;transition:background .2s}
.course-tile:hover .tile-action{background:#fff}
.course-tile.st-brain .tile-action{color:#476bac}
.course-tile.st-reading .tile-action{color:#386b50}
.tile-progress{width:78%;margin-top:1px}.tile-progress .st-progress{height:8px;background:#fffefbc0}
.lower-card{padding:19px 20px}.lower-card .st-card-header{margin-bottom:11px}.lower-card .st-card-header h2{font-size:18px}
.daily-flex{gap:19px;min-height:135px;justify-content:center}
.progress-donut{width:128px;height:128px;background:conic-gradient(#e6ab9b calc(var(--pct)*1%),#f2eae6 0)}
.progress-donut>div{width:103px;height:103px}
.progress-donut strong{font-size:30px;color:#2d2927}
.progress-donut small{font-size:11.5px;color:#716965}
.daily-checklist{font-size:12.5px;gap:8px;color:#453f3b}
.daily-dot{height:19px;width:19px;border-color:#d3c6bd}
.daily-dot.yes{background:#db9787;border-color:#db9787}
.metric-row{gap:9px}.metric-box{background:#f9f6f3;border:1px solid #f3ece7;padding:13px 4px 11px;min-height:121px}
.metric-box>span .st-icon{width:24px;height:24px}.metric-box small{font-size:11.5px;color:#756b65}
.metric-box strong{font-size:22px;font-weight:790;color:#332d29}.tiny-helper{font-size:11px;color:#827973;margin-top:9px}
.trend-rows{gap:9px}.trend-row{height:38px;grid-template-columns:23px minmax(90px,1fr) 50px 93px}
.trend-row strong{font-size:12px;font-weight:700;color:#423b38}
.trend-row>span:nth-child(3){font-size:11px;color:#746a65}

passages.push(...[{"level":2,"topic":"전력 사용과 최대 수요","text":"전력 시스템은 소비자가 실제로 사용하는 전기량뿐 아니라 특정 시각에 동시에 필요한 전력도 고려해야 한다. 하루 전체 사용량이 같더라도 많은 설비가 한꺼번에 가동되면 공급 설비에 더 큰 부담이 생긴다. 그래서 전력 수요 관리에서는 전기를 아끼는 것과 사용 시각을 분산하는 일을 구별한다. 두 접근은 서로 보완될 수 있다.","main":"전력 관리에는 총사용량 절감과 최대 수요 분산이 모두 중요하다.","fact":"같은 전력량이라도 사용 시각에 따라 최대 수요가 달라질 수 있다.","cause":"같은 시각에 여러 기기가 가동되면 공급에 필요한 순간 전력이 커지기 때문이다.","effect":"공급 설비에 걸리는 최대 부담을 줄일 수 있다.","example":"고전력 기기의 가동 시간을 서로 다르게 배치한다.","wrong":"전체 사용량이 같다면 동시 가동 여부는 전력망과 무관하다.","category":"과학","keyword":"최대 수요","definition":"특정 기간에 동시에 필요했던 전력의 최대 크기"},{"level":2,"topic":"추천 알고리즘과 정보 다양성","text":"개인화 추천은 이용자가 이전에 좋아했던 콘텐츠를 빠르게 찾도록 돕는다. 그러나 과거 선호도만을 지나치게 반영하면 익숙한 주제의 정보만 반복해서 보게 될 수 있다. 이런 문제를 줄이려면 추천의 적합성을 유지하면서도 새로운 관점과 주제를 일정 비율 포함해야 한다. 이용자가 추천 이유를 이해하도록 하는 설명도 선택의 자율성을 높일 수 있다.","main":"추천 시스템은 편의성과 정보 다양성의 균형을 고려해야 한다.","fact":"개인화 추천은 과거 선호를 바탕으로 정보를 제안한다.","cause":"과거 선호만 반영하면 다른 관점의 노출이 제한될 수 있기 때문이다.","effect":"새로운 정보를 접하고 선택할 가능성을 넓힐 수 있다.","example":"추천 목록에 익숙한 주제와 다른 관점의 콘텐츠를 함께 포함한다.","wrong":"추천 정확도가 높아지면 정보 다양성은 항상 자동으로 확보된다.","category":"정보","keyword":"개인화","definition":"개인의 과거 행동이나 선호를 반영하여 내용을 조정하는 방식"},{"level":2,"topic":"재료의 환경 영향 평가","text":"일회용 포장재를 평가할 때 원료가 자연에서 유래했다는 사실만으로 환경 부담이 낮다고 단정하기는 어렵다. 원료 생산과 가공, 운송, 사용 이후의 수거와 처리 과정에서도 에너지와 자원이 소비된다. 따라서 대체 소재를 비교할 때는 생산부터 폐기까지의 여러 단계를 함께 살피는 것이 바람직하다. 사용 횟수와 지역의 재활용 시설도 결과를 바꿀 수 있다.","main":"포장재의 환경성을 판단할 때는 전체 사용 과정을 평가해야 한다.","fact":"운송과 폐기 단계도 포장재의 환경 부담에 영향을 준다.","cause":"소재별로 생산과 사용 후 처리에서 필요한 자원이 다르기 때문이다.","effect":"단일 특성만을 근거로 잘못 선택하는 일을 줄일 수 있다.","example":"두 포장재를 생산·운송·재활용 조건까지 포함하여 비교한다.","wrong":"자연 유래 원료는 모든 조건에서 가장 낮은 환경 부담을 보장한다.","category":"환경","keyword":"전과정 평가","definition":"제품의 생산부터 사용과 폐기까지 환경 영향을 살피는 방법"},{"level":2,"topic":"원격근무와 협업","text":"원격근무는 이동에 쓰던 시간을 절약하고 업무 공간을 유연하게 활용하도록 해 준다. 반면 서로의 상황을 우연히 파악하거나 짧게 의견을 나누는 기회는 줄어들 수 있다. 따라서 협업을 잘 운영하려면 문서로 공유할 정보를 명확히 정하고, 즉각적인 토론이 필요한 사안에는 별도의 소통 시간을 마련해야 한다. 업무 성과도 단순한 온라인 접속 시간보다 결과와 과정의 질을 함께 고려하는 편이 낫다.","main":"원격근무의 장점을 살리려면 협업 방식도 함께 설계해야 한다.","fact":"원격근무는 출퇴근에 쓰는 시간을 줄일 수 있다.","cause":"비대면 환경에서는 우연한 정보 교환이 줄어들 수 있기 때문이다.","effect":"협업 과정의 혼선을 줄이면서 유연성을 유지할 수 있다.","example":"정기 토론 시간을 정하고 결정 사항을 문서로 남긴다.","wrong":"온라인 접속 시간이 길수록 업무 성과가 반드시 높다.","category":"경제","keyword":"비동기 소통","definition":"참여자가 같은 시각에 접속하지 않아도 정보를 주고받는 방식"},{"level":2,"topic":"도시의 빗물 관리","text":"도시에서는 비가 내릴 때 물이 스며들 수 있는 흙보다 아스팔트와 지붕 면적이 넓은 경우가 많다. 그러면 짧은 시간에 많은 물이 배수 시설로 모여 침수 위험이 커질 수 있다. 빗물정원과 투수성 포장은 물이 한꺼번에 흐르는 속도를 낮추는 방법으로 활용된다. 다만 지역의 토양과 지하수 조건을 검토하지 않으면 효과가 제한될 수 있다.","main":"도시 침수 대응에는 물의 유출 속도를 늦추는 설계가 필요하다.","fact":"불투수 면적이 넓으면 빗물이 빠르게 배수 시설에 모일 수 있다.","cause":"땅속으로 침투하는 물의 양이 줄기 때문이다.","effect":"집중호우 때 배수 시설의 순간 부담을 완화할 수 있다.","example":"도로 일부에 투수성 포장을 적용하고 관리 상태를 점검한다.","wrong":"도시의 지붕과 아스팔트는 모든 빗물을 토양으로 흡수한다.","category":"환경","keyword":"투수성","definition":"물이 재료나 표면을 통과하여 스며들 수 있는 성질"},{"level":2,"topic":"표본과 조사 결과","text":"설문조사는 모든 사람의 의견을 직접 조사하기 어려울 때 일부 대상을 선택해 전체의 경향을 추정한다. 이때 참여자가 많더라도 특정 집단만 과도하게 포함되면 결과가 한쪽으로 치우칠 수 있다. 따라서 조사에서는 표본의 크기뿐 아니라 누구를 어떤 방법으로 뽑았는지도 중요하다. 응답하지 않은 사람의 특성이 결과에 영향을 미치는지도 살펴야 한다.","main":"조사 결과의 신뢰성은 표본 크기와 선정 방식 모두에 달려 있다.","fact":"표본이 커도 집단 구성이 치우치면 결과가 편향될 수 있다.","cause":"조사 참여 집단이 전체 집단을 적절히 대표하지 못할 수 있기 때문이다.","effect":"전체 의견을 잘못 추정할 위험을 줄일 수 있다.","example":"표본을 추출하는 기준과 응답률을 조사 보고서에 공개한다.","wrong":"표본의 수만 많으면 선정 방식과 관계없이 정확한 결과가 나온다.","category":"과학","keyword":"대표성","definition":"선택된 표본이 전체 집단의 특성을 적절히 반영하는 정도"},{"level":3,"topic":"상관관계와 인과관계","text":"어떤 지역에서 운동 시설 수와 건강 지표가 함께 높게 나타났다고 가정해 보자. 그렇다고 운동 시설이 지표 향상의 유일한 원인이라고 곧바로 결론 내릴 수는 없다. 소득, 의료 접근성, 연령 구성 등 다른 요인이 둘 모두에 영향을 주었을 가능성이 있기 때문이다. 인과관계를 검증하려면 대안적 설명을 검토하고 적절한 비교 집단이나 연구 설계를 활용해야 한다.","main":"함께 변하는 두 현상만으로 인과관계를 확정해서는 안 된다.","fact":"운동 시설과 건강 지표가 함께 높다고 해서 유일한 원인이 밝혀지는 것은 아니다.","cause":"두 현상 모두에 작용하는 제3의 요인이 있을 수 있기 때문이다.","effect":"성급한 인과 추론을 방지할 수 있다.","example":"소득과 연령을 고려한 비교 집단 분석을 수행한다.","wrong":"서로 상관된 두 변수는 반드시 직접적인 원인과 결과 관계이다.","category":"과학","keyword":"교란 요인","definition":"관찰된 관계의 해석에 영향을 줄 수 있는 다른 변수"},{"level":3,"topic":"매몰비용과 의사결정","text":"어떤 프로젝트에 이미 큰 비용을 지출했다면 중단 결정을 내리기 어려울 수 있다. 그러나 과거에 지출한 돈을 회수할 수 없다면 그 사실 자체가 미래 투자를 정당화하지는 않는다. 이후 투입할 자원과 앞으로 기대되는 가치, 대안의 가치를 비교해야 한다. 단, 계약 해지 수수료처럼 중단할 때 새롭게 발생하는 비용은 미래의 선택에 실제 영향을 주므로 별도로 계산해야 한다.","main":"되돌릴 수 없는 과거 비용보다 앞으로의 편익과 비용을 비교해야 한다.","fact":"회수할 수 없는 과거 지출만으로 추가 투자를 정당화할 수 없다.","cause":"과거 비용은 현재 선택에 따라 달라지지 않기 때문이다.","effect":"손실이 커지는 결정을 줄일 수 있다.","example":"사업 중단 수수료와 예상 수익을 비교해 지속 여부를 결정한다.","wrong":"이미 쓴 돈이 클수록 어떤 경우에도 추가 투자를 해야 한다.","category":"경제","keyword":"매몰비용","definition":"이미 발생해 현재 결정으로 되돌릴 수 없는 비용"},{"level":3,"topic":"통계적 유의성과 실질적 중요성","text":"대규모 조사에서는 매우 작은 차이도 통계적으로 유의하게 나타날 수 있다. 통계적 유의성은 관찰된 결과를 일정한 가정 아래 우연의 산물로 보기 어려운 정도를 설명하지만, 차이의 실제 크기나 정책적 중요성을 자동으로 알려주지는 않는다. 따라서 연구를 해석할 때는 유의확률과 함께 효과 크기, 불확실성의 범위, 적용 환경을 살펴야 한다. 유의하지 않은 결과 역시 효과가 전혀 없음을 증명하는 것은 아니다.","main":"연구 결과를 판단하려면 유의성뿐 아니라 효과의 크기와 맥락도 고려해야 한다.","fact":"통계적으로 유의하더라도 실질적인 변화 폭은 작을 수 있다.","cause":"표본 규모가 커지면 작은 차이도 통계적으로 탐지될 수 있기 때문이다.","effect":"연구 결과를 실제 의사결정에 더 적절히 적용할 수 있다.","example":"유의확률 외에 효과 크기와 신뢰구간을 함께 보고한다.","wrong":"통계적으로 유의한 모든 차이는 현장에서 반드시 큰 변화를 만든다.","category":"과학","keyword":"효과 크기","definition":"관찰된 차이나 관계가 얼마나 큰지를 나타내는 지표"},{"level":3,"topic":"공동자원과 무임승차","text":"여러 사람이 함께 이용하는 자원은 누군가가 이용하더라도 다른 사람의 접근을 완전히 막기 어려울 수 있다. 각자가 단기 이익만을 고려하면 이용량이 지나치게 늘어나 자원 전체가 훼손될 가능성이 있다. 그러나 이를 개인의 도덕성 문제로만 볼 수는 없다. 사용 규칙, 감시와 협의 절차, 지역별 환경에 맞는 관리 제도가 결과를 바꿀 수 있기 때문이다.","main":"공동자원 관리는 개인 선택뿐 아니라 제도의 설계가 중요하다.","fact":"공동자원은 개별 이용자의 선택이 다른 이용자에게 영향을 줄 수 있다.","cause":"이용에서 발생하는 비용이 사용자 개인에게 전부 반영되지 않을 수 있기 때문이다.","effect":"지나친 이용으로 인한 자원 고갈을 줄일 수 있다.","example":"이용자들이 채취 한도를 합의하고 함께 관리한다.","wrong":"공동자원은 언제나 아무 규칙 없이도 지속적으로 보존된다.","category":"경제","keyword":"공동자원","definition":"여러 사용자가 함께 이용하면서 서로에게 영향을 주는 자원"},{"level":3,"topic":"배터리 사용과 에너지 효율","text":"배터리의 용량이 크다고 해서 모든 장치의 사용 시간이 같은 비율로 늘어나는 것은 아니다. 장치의 전력 소비와 사용 환경, 온도 및 변환 손실에 따라 실제 사용 가능 시간이 달라진다. 또한 고속 충전 과정에서는 온도와 충전 상태에 따라 허용 전력이 조정될 수 있으므로 최대 충전 출력이 전체 충전 시간에 계속 유지된다고 보기 어렵다. 성능을 비교할 때는 정격 수치와 실제 운용 조건을 구분해야 한다.","main":"배터리 성능은 용량뿐 아니라 소비 전력과 운용 조건을 함께 보아야 한다.","fact":"같은 용량이라도 장치의 소비 전력에 따라 사용 시간이 달라진다.","cause":"전력 소비와 손실이 실제로 활용 가능한 에너지에 영향을 주기 때문이다.","effect":"현실적인 사용 시간과 충전 계획을 세울 수 있다.","example":"장치별 소비 전력과 충전 곡선을 함께 비교한다.","wrong":"최대 충전 출력은 충전이 끝날 때까지 항상 동일하게 유지된다.","category":"과학","keyword":"정격","definition":"정해진 조건에서 표시하는 장치의 표준 성능 수치"},{"level":3,"topic":"역사 자료의 해석","text":"과거의 사건을 연구할 때 한 사람이 남긴 기록은 중요한 단서가 되지만 사건 전체를 그대로 대표하지는 않을 수 있다. 기록 작성자의 위치와 목적, 당시의 제도와 언어 표현은 서술 방식에 영향을 미친다. 서로 다른 자료의 일치점과 차이점을 대조하고 자료가 만들어진 시점을 검토하면 해석의 한계를 줄일 수 있다. 자료가 부족한 부분은 가능성과 확정된 사실을 구분하여 서술해야 한다.","main":"역사 자료는 작성 배경과 다른 근거를 함께 검토하며 해석해야 한다.","fact":"한 기록은 작성자의 입장에 따라 사건을 부분적으로 보여줄 수 있다.","cause":"작성 목적과 사회적 위치가 기록 내용의 선택에 영향을 주기 때문이다.","effect":"확정되지 않은 추정을 사실과 구분할 수 있다.","example":"같은 사건을 기록한 여러 자료의 작성 시점과 목적을 비교한다.","wrong":"한 인물의 기록이 존재한다면 다른 자료를 검토할 필요가 없다.","category":"역사","keyword":"사료 비판","definition":"역사 자료의 출처와 작성 배경 및 신뢰도를 검토하는 과정"}]);
const joinOptions=(right,wrong)=>shuffle([right,...shuffle(uniq(wrong.filter(x=>x!==undefined).filter(x=>String(x)!==String(right)))).slice(0,3)]);
const qchoice=(prompt,answer,wrong,extra={})=>({type:'choice',prompt,answer,options:joinOptions(answer,wrong),...extra});
const qnum=(prompt,answer,extra={})=>({type:'number',prompt,answer,...extra});
const readingDistractors=(p,field='fact')=>{
 const related=shuffle(passages.filter(x=>x.topic!==p.topic&&x.category===p.category).map(x=>x[field]||x.fact));
 const elsewhere=shuffle(passages.filter(x=>x.topic!==p.topic&&x.category!==p.category).map(x=>x[field]||x.fact));
 const wrong=(['fact','main','cause','example'].includes(field)?[p.wrong]:[]);
 return uniq([...wrong,...related,...elsewhere].filter(x=>x&&x!==p[field])).slice(0,3);
};
const readingQ=(prompt,answer,wrong,p,reason)=>qchoice(prompt,answer,wrong,{passage:p.text,explanation:reason||`지문의 핵심 근거: ${p.fact}`});
const qseq=(prompt,seq,extra={})=>({type:'sequence',prompt,answer:seq.join(''),keys:uniq([...seq,...'1234567890'.split('')]).sort(),...extra});
const numOpts=(a,count=4)=>{let s=new Set([a]);while(s.size<count){let v=a+r(-9,9);if(v>=0)s.add(v)}return shuffle([...s])};
function makeQ(id,diff=2){const big=diff===3, p=pick(passages.filter(x=>(x.level||1)===diff)), d=diff;let x,y,z,seq,ans,choices;
switch(id){
case 'match':{
 const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
 const code=Array.from({length:d+3},()=>pick(alphabet.split(''))).join('');
 const wrong=new Set();
 while(wrong.size<3){let pos=r(0,code.length-1),replacement=pick([...alphabet].filter(v=>v!==code[pos]));wrong.add(code.slice(0,pos)+replacement+code.slice(pos+1))}
 return qchoice(`목표 코드와 정확히 같은 것을 찾으세요.\n${code}`,code,[...wrong],{note:`${code.length}자리 코드 · 비슷한 글자를 정확히 대조하세요.`});
}
case 'shadow':{
 const symbols=d===1?['●','▲','■','◆']:d===2?['▲','△','◆','◇']:['⬠','⬡','⬢','⬟'];
 ans=pick(symbols);const hidden={1:28,2:45,3:57}[d];
 return qchoice('가려진 모양의 원래 형태를 추론하세요.',ans,shuffle(symbols.filter(v=>v!==ans)),{visual:`<div class="sd-partial-shape" style="font-size:92px;clip-path:inset(0 ${hidden}% 0 0);color:#5b7a64;line-height:1.2">${ans}</div>`,note:'난이도에 따라 비슷한 형태와 가려진 비율이 달라집니다.'});
}
case 'pieces': case 'shape':{let s=['●','■','▲','◆'];let start=r(0,3);ans=s[(start+3)%4];return qchoice('도형 순서의 마지막 빈칸에 들어갈 것은?',ans,s.filter(x=>x!==ans),{visual:`<div class="focuswords">${[s[start],s[(start+1)%4],s[(start+2)%4],'?'].join('  ')}</div>`,note:'반복되는 4개 도형 규칙을 찾아보세요.'})}
case 'detective':{let icons=['☀','☂','♣','☘','☕','☎','♫','☾'];seq=shuffle(icons).slice(0,d+2);ans=pick(seq);return qchoice('방금 보인 기호에 포함된 것은?',ans,shuffle(icons.filter(a=>!seq.includes(a))).slice(0,3),{preview:seq.join('  '),previewTime:big?1500:2400})}
case 'flash':{seq=Array.from({length:d+2},()=>String(r(1,9)));return {type:'number',prompt:'나타난 숫자를 순서대로 입력하세요.',answer:seq.join(''),preview:seq.join(' '),previewTime:big?1900:3100,strict:true,note:'입력할 때 공백을 넣지 않아도 됩니다.'}}
case 'cards':{let all=['♠','♥','★','◆','☀','☘'];seq=shuffle(all).slice(0,Math.min(d+2,5));let deck=shuffle([...seq,...seq]);return {type:'pairs',prompt:'카드의 짝을 모두 찾아보세요.',answer:seq.length,deck,previewTime:1700, note:'카드를 클릭하면 뒤집힙니다.'}}

 ];

function sudokuCells(){let q=session.q;return session.sudokuInput.map((row,i)=>row.map((v,j)=>`<button class="${q.fixed[i][j]?'fixed':''} ${session.sudokuFocused===`${i},${j}`?'active':''}" data-cell="${i},${j}">${v||''}</button>`).join('')).join('')}
function gridHtml(selected,show){return `<div class="grid5">${[...Array(25)].map((_,i)=>`<button type="button" class="sq ${show?'': 'clickable'} ${show&&selected.includes(i)?'selected':''}" ${show?'disabled':'data-gridcell="'+i+'"'} aria-label="${i+1}번 칸">${show&&selected.includes(i)?'◆':''}</button>`).join('')}</div>`}
function flipCard(i){let s=session,ps=s.pairState,q=s.q;if(!s||s.locked||ps.found.includes(i)||ps.open.includes(i)||ps.open.length>=2)return;ps.open.push(i);let b=$(`[data-card="${i}"]`);b.textContent=q.deck[i];b.classList.add('is-revealed');if(ps.open.length===2){ps.tries++;let[a,c]=ps.open;if(q.deck[a]===q.deck[c]){ps.found.push(a,c);ps.open=[];$('#pair-info').textContent=`짝 ${ps.found.length/2} / ${q.answer}`;if(ps.found.length===q.deck.length){evaluate('complete')}}else{setTimeout(()=>{if(!session||session.q!==q)return;[a,c].forEach(z=>{let b=$(`[data-card="${z}"]`);if(b){b.textContent='?';b.classList.remove('is-revealed')}});ps.open=[]},630)}}}
function validSudoku(grid,q){const valid=(a)=>a.length===4&&new Set(a).size===4&&a.every(n=>n>=1&&n<=4);for(let i=0;i<4;i++){if(!valid(grid[i])||!valid(grid.map(row=>row[i])))return false;for(let j=0;j<4;j++){if(q.fixed[i][j]&&grid[i][j]!==q.grid[i][j])return false}}for(let a=0;a<4;a+=2)for(let b=0;b<4;b+=2){if(!valid([grid[a][b],grid[a][b+1],grid[a+1][b],grid[a+1][b+1]]))return false}return true}
function evaluate(value,clicked){if(!session||session.locked||previewing)return;let s=session,q=s.q,correct=q.type==='pairs'?'complete'===value:q.type==='sudoku'?validSudoku(s.sudokuInput,q):String(value).replace(/\s/g,'')===String(q.answer).replace(/\s/g,'');s.locked=true;let dt=(Date.now()-s.questionStart)/1000;s.correct+=correct?1:0;s.score+=correct?Math.max(20,Math.round(100-Math.min(70,dt*2))):0;const selectedDifficulty=s.currentDifficulty||s.diff;
s.answers.push({id:s.items[s.current].id,correct,seconds:Number(dt.toFixed(1)),difficulty:selectedDifficulty,
 ...(correct?{}:{prompt:String(q.prompt).slice(0,260),selected:String(value).slice(0,150),expected:String(q.answer).slice(0,200),explanation:String(q.explanation||q.note||'정답과 지문 또는 문제 조건을 다시 비교해 보세요.').slice(0,360)})});if(clicked){clicked.classList.add(correct?'correct':'wrong')}let msg=correct?'✓ 정답입니다.':`정답: ${q.type==='sudoku'?'규칙을 만족하는 격자':q.type==='pairs'?'모든 짝':esc(String(q.answer).slice(0,95))}`;
$('#feedback').classList.toggle('bad',!correct);
$$('#challenge button').forEach(b=>b.disabled=true);
if(!correct&&q.type==='choice')$$('[data-answer]').forEach(b=>{if(b.dataset.answer===String(q.answer))b.classList.add('correct')});
const advance=()=>{if(!session)return;s.current++;if(s.current>=s.total)finishSession();else renderQuestion()};
if(correct){$('#feedback').textContent=msg;nextTick=setTimeout(advance,780)}
else{$('#feedback').innerHTML=`<div class="sd-explain-answer"><strong>${msg}</strong><p>${esc(String(q.explanation||q.note||'문제의 조건과 정답을 다시 비교해 보세요.'))}</p><button id="sd-next-question" type="button">다음 문제 ${stIcon('chevron',17)}</button></div>`;$('#sd-next-question').onclick=advance;}}
function finishSession(){let s=session;if(!s)return;clearTimers();let seconds=Math.max(1,Math.round((Date.now()-s.start)/1000));let earnedXP=s.answers.reduce((sum,answer)=>sum+xpForAnswer(answer.correct,answer.difficulty||s.diff),0)+(s.correct/s.total>=.8?20:0);
let previousLevel=levelFromXP();
let record={date:currentDay(),stamp:new Date().toISOString(),label:s.label,items:s.items.map(g=>({id:g.id,group:g.group})),correct:s.correct,total:s.total,seconds,difficulty:s.auto?'auto':s.diff,answers:s.answers,earnedXP,score:s.score};
data.progress.xp=lifetimeXP()+earnedXP;data.progress.lifetimeCorrect=(Number(data.progress.lifetimeCorrect)||0)+s.correct;data.progress.completed=(Number(data.progress.completed)||0)+1;
data.progress.bestByGame ||= {};
const distinctGames=new Set(record.items.map(item=>item.id));
if(distinctGames.size===1){const id=record.items[0].id,accuracy=Math.round(100*record.correct/record.total);const previous=Number(data.progress.bestByGame[id]??-1);record.isBest=accuracy>previous;data.progress.bestByGame[id]=Math.max(previous,accuracy)}

record.levelUp=levelFromXP()>previousLevel;
data.sessions.push(record);
const existingBadges=new Set(Object.keys(data.progress.badges||{}));
const availableBadges=unlockedBadges();
record.newBadges=availableBadges.filter(x=>!existingBadges.has(x.label)).map(x=>x.label);
for(const badge of availableBadges)data.progress.badges[badge.label]=true;
if(data.sessions.length>1500)data.sessions.splice(0,data.sessions.length-1500);save();session=null;document.body.classList.remove('in-session');updateHeader();let a=Math.round(record.correct/record.total*100);$('#page-title').textContent='훈련 완료';$('#page-desc').textContent='이번 세션의 결과가 브라우저에 저장되었습니다.';let avgResponse=record.answers.length?record.answers.reduce((sum,x)=>sum+(Number(x.seconds)||0),0)/record.answers.length:0;
let bestRun=0,run=0;for(const answer of record.answers){run=answer.correct?run+1:0;bestRun=Math.max(bestRun,run)}
let earned=record.earnedXP;
let theme=record.items.every(x=>x.group==='math')?'math':record.items.every(x=>x.group==='read')?'reading':'brain';
$('#content').innerHTML=`<div class="gh-inner-root gh-results-shell sd-result-shell">${sharedGameBar()}<div class="gh-inner-content"><section class="sd-results-panel sd-theme-${theme}"><div class="sd-result-icon">${stIcon('trophy',40)}</div><h1>훈련 완료</h1><p class="sd-result-sub">${esc(record.label)} · ${record.total}문제 도전</p><div class="sd-total-score"><b>${a}</b><span>점</span></div>
<div class="sd-result-stats"><div><span>${stIcon('target',24)}</span><small>정답률</small><strong>${a}%</strong></div><div><span>${stIcon('clock',24)}</span><small>평균 반응</small><strong>${avgResponse.toFixed(1)}초</strong></div><div><span>${stIcon('fire',24)}</span><small>연속 정답</small><strong>${bestRun}회</strong></div><div><span>${stIcon('spark',24)}</span><small>획득 포인트</small><strong>+${earned}</strong></div></div>
<div class="sd-result-chart"><div class="sd-result-chart-title">문제별 정답 기록 <span>${record.correct}/${record.total} 정답</span></div><div class="sd-result-bars">${record.answers.map((answer,i)=>`<div class="sd-result-bar ${answer.correct?'is-correct':'is-wrong'}" title="${i+1}번: ${answer.correct?'정답':'오답'}"><i></i><small>${i+1}</small></div>`).join('')}</div></div>
<div class="sd-review-box"><details><summary>오답 복습 · ${record.total-record.correct}문제 ${stIcon('chevron',18)}</summary><div class="sd-review-items">${record.answers.filter(x=>!x.correct).slice(0,15).map((x,i)=>`<article><small>${esc(x.id)} · 오답 ${i+1}</small><strong>${esc(x.prompt||'문제') }</strong><p>내 답: ${esc(x.selected||'미입력')}</p><p>정답: ${esc(x.expected||'문제의 정답')}</p><p class="sd-review-help">${esc(x.explanation||'다시 살펴보세요.')}</p></article>`).join('')||'<p class="sd-all-correct">모든 문제를 맞혔습니다!</p>'}</div></details></div>
<div class="sd-result-note">${record.newBadges?.length?`새 배지: ${esc(record.newBadges.join(', '))} · `:''}${record.isBest?'새로운 개인 최고 기록! · ':''}${record.levelUp?`레벨 업! Lv. ${levelFromXP()} · `:''}${a>=90?'매우 정확하게 해결했어요. 다음 훈련에도 도전해 보세요.':a>=70?'좋은 흐름이에요. 어려웠던 문제를 다시 연습해 보세요.':'속도보다 정확도에 집중해 다시 도전해 보세요.'}</div>
<div class="sd-xp-progress"><span>Lv. ${levelFromXP()} · 다음 레벨까지 ${500-lifetimeXP()%500}XP</span><div class="sd-xp-track"><i style="width:${lifetimeXP()%500/5}%"></i></div></div><div class="sd-result-actions"><button class="sd-retry" id="again">${stIcon('target',19)} 다시 도전</button><button class="sd-next" id="back-home">홈으로 ${stIcon('chevron',19)}</button></div></section></div></div>`;attachCards();window.scrollTo(0,0);$('#back-home').onclick=()=>setPage('home');$('#again').onclick=()=>openStart(record.items.every(x=>x.id===record.items[0].id)?record.items[0].id:null,record.label==='국어 독해 랜덤 연습'?'literacy':record.label==='계산 랜덤 연습'?'math':'brain')}
$('#brand-home').onclick=()=>setPage('home');$$('button[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));setupShellIcons();document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('#quit-dialog'))$('#quit-resume')?.click();else if($('#modal'))closeModal();else if(session)showQuitConfirm();return}
 if(!session||previewing||session.locked||$('#modal-root').children.length)return;
 if(e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;
 if(/^[1-4]$/.test(e.key)){const choices=$$('#challenge [data-answer]');const idx=Number(e.key)-1;if(choices[idx]){e.preventDefault();choices[idx].click()}}
});render();
