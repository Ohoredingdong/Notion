<div class="root" id="root"><main class="widget"><header class="header"><div class="header-left"><div class="app-icon" aria-hidden="true"></div><div><div class="title">Work Today</div><div class="subtitle">오늘도, 차근차근. 좋은 일이 더 가까워져요.</div></div></div><div class="header-right"><div class="head-date" id="headDate"></div><button class="sync-btn" id="syncBtn" aria-label="기기 동기화">Sync</button></div></header><div class="grid"><section class="panel today"><div class="panel-head"><div><div class="panel-title">Today</div><div class="panel-sub">오늘의 할 일을 집중해서 처리해요.</div></div><div class="ring-wrap"><div class="ring" id="todayRing"><span id="todayCount">0/0</span></div><div class="small-date" id="todayDate"></div></div></div><div class="task-list" id="todayList"></div><div class="foot"><button class="add" data-add="today">+ 추가</button></div></section><section class="panel tomorrow"><div class="panel-head"><div><div class="panel-title">Tomorrow</div><div class="panel-sub">내일의 일정을 미리 준비해요.</div></div><div class="ring-wrap"><div class="ring" id="tomorrowRing"><span id="tomorrowCount">0/0</span></div><div class="small-date" id="tomorrowDate"></div></div></div><div class="task-list" id="tomorrowList"></div><div class="foot"><button class="add" data-add="tomorrow">+ 추가</button></div></section><section class="panel week"><div class="panel-head"><div><div class="panel-title">This Week</div><div class="panel-sub">이번 주의 할 일을 한눈에 확인해요.</div></div><div class="week-head-side"><div class="week-summary" id="weekSummary">0/0 완료</div><div class="week-bar-wrap"><div class="week-bar"><i id="weekBar"></i></div><div class="week-pct" id="weekPct">0%</div></div></div></div><div class="week-list" id="weekList"></div><div class="foot"><button class="add" data-add="week">+ 추가</button></div></section></div><section class="archive open" id="archiveBox"><div class="archive-head"><div><div class="archive-title">Archive</div><div class="archive-sub">완료한 작업을 기록해요.</div></div><div class="archive-actions"><button class="archive-toggle" id="toggleArchive">최근 완료순⌄</button><button class="archive-more" id="clearArchive" aria-label="완료 기록 비우기">Clear</button></div></div><div class="archive-list" id="archiveList"></div></section></main><div class="control-rail" aria-label="위젯 컨트롤"><button class="control-btn" id="sizeBtn" aria-label="크기 변경"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/><path d="M3 8l5-5M21 8l-5-5M3 16l5 5M21 16l-5 5"/></svg></button><button class="control-btn" id="themeBtn" aria-label="다크 모드"><svg viewBox="0 0 24 24"><path d="M20.5 15.2A8 8 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg></button><button class="control-btn" id="lockBtn" aria-label="크기 잠금"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/></svg></button><button class="control-btn" id="resetBtn" aria-label="UI 초기화"><svg viewBox="0 0 24 24"><path d="M4 8V4h4"/><path d="M5.5 5.5A8 8 0 1 1 4.2 14"/></svg></button></div></div><div class="sync-overlay" id="syncOverlay" aria-hidden="true"><div class="sync-panel"><button class="sync-close" id="syncClose">×</button><div class="sync-title">기기 동기화</div><div class="sync-desc">같은 코드를 휴대폰·태블릿·PC에 입력하면 동일한 Work Today 데이터를 공유합니다.</div><div class="sync-field"><input class="sync-input" id="syncCodeInput" autocomplete="off" spellcheck="false"><button class="sync-action" id="copySyncCode">복사</button></div><div class="sync-actions"><button class="sync-action" id="useSyncCode">이 코드 사용</button><button class="sync-action" id="newSyncCode">새 코드</button></div><div class="sync-status" id="syncStatusText"></div><div class="sync-hint">동기화 코드는 비공개로 보관해 주세요.</div></div></div>
<script>
const STORAGE_KEY='lifetown_work_today_compact_v3',SYNC_CODE_KEY='lifetown_work_today_sync_code_v1',SYNC_ENDPOINT='https://dfklyngtjqvlirgrtdfb.supabase.co/functions/v1/work-today-sync',UI_KEY='lifetown_work_today_v3_ui';const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36).slice(-4),dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,fromKey=k=>{const[y,m,d]=String(k).split('-').map(Number);return new Date(y,m-1,d)},esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');function blank(kind='task'){return kind==='week'?{id:uid(),text:'',done:false,status:'대기'}:{id:uid(),text:'',done:false,time:'',tag:'',tone:'gray'}}function load(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(v&&typeof v==='object')return v}catch{}return{lastDate:dateKey(new Date()),today:[blank()],tomorrow:[blank()],week:[blank('week')],archive:[],archiveOpen:true,sampleSeeded:false}}const s=load();function normalizeTask(x,kind){return{id:x?.id||uid(),text:String(x?.text||''),done:!!x?.done,time:kind==='week'?'':String(x?.time||''),tag:kind==='week'?'':String(x?.tag||''),tone:kind==='week'?'gray':String(x?.tone||'gray'),status:kind==='week'?String(x?.status||(x?.done?'완료':'대기')):''}}function saveLocal(){localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}function normalize(){s.today=Array.isArray(s.today)?s.today.map(x=>normalizeTask(x,'today')):[blank()];s.tomorrow=Array.isArray(s.tomorrow)?s.tomorrow.map(x=>normalizeTask(x,'tomorrow')):[blank()];s.week=Array.isArray(s.week)?s.week.map(x=>normalizeTask(x,'week')):[blank('week')];if(!s.today.length)s.today=[blank()];if(!s.tomorrow.length)s.tomorrow=[blank()];if(!s.week.length)s.week=[blank('week')];if(!Array.isArray(s.archive))s.archive=[];if(typeof s.archiveOpen!=='boolean')s.archiveOpen=true;if(!s.lastDate)s.lastDate=dateKey(new Date());saveLocal()}let syncCode=localStorage.getItem(SYNC_CODE_KEY)||'',lastRemoteAt='',cloudReady=false,applyingRemote=false,cloudSaveTimer=null;function save(){saveLocal();if(!applyingRemote&&cloudReady&&syncCode)scheduleCloudSave()}function seedIfEmpty(){const has=(s.today||[]).some(x=>x.text.trim())||(s.tomorrow||[]).some(x=>x.text.trim())||(s.week||[]).some(x=>x.text.trim())||(s.archive||[]).length;if(has||s.sampleSeeded)return;const prev=new Date();prev.setDate(prev.getDate()-1);const prev2=new Date();prev2.setDate(prev2.getDate()-2);s.today=[{id:uid(),text:'프로젝트 기획안 검토',done:true,time:'09:00',tag:'',tone:'gray'},{id:uid(),text:'디자인 시안 피드백',done:true,time:'11:00',tag:'',tone:'gray'},{id:uid(),text:'개발팀 미팅',done:false,time:'14:00',tag:'회의',tone:'blue'},{id:uid(),text:'블로그 초안 작성',done:false,time:'16:00',tag:'콘텐츠',tone:'yellow'},{id:uid(),text:'주간 리포트 정리',done:false,time:'18:00',tag:'',tone:'gray'}];s.tomorrow=[{id:uid(),text:'클라이언트 미팅 준비',done:false,time:'10:00',tag:'중요',tone:'red'},{id:uid(),text:'서비스 기획안 작성',done:false,time:'11:00',tag:'',tone:'gray'},{id:uid(),text:'디자인 레퍼런스 조사',done:false,time:'15:00',tag:'',tone:'gray'},{id:uid(),text:'팀 회의 자료 정리',done:false,time:'17:00',tag:'',tone:'gray'}];s.week=[{id:uid(),text:'프로젝트 기획안 검토 및 피드백',done:true,status:'완료'},{id:uid(),text:'고객 인터뷰 정리',done:true,status:'완료'},{id:uid(),text:'서비스 개선안 작성',done:true,status:'완료'},{id:uid(),text:'마케팅 전략 미팅',done:false,status:'진행중'},{id:uid(),text:'주간 리포트 작성',done:false,status:'대기'},{id:uid(),text:'콘텐츠 일정 정리',done:false,status:'대기'},{id:uid(),text:'다음 주 우선순위 정리',done:false,status:'대기'}];s.archive=[{id:uid(),text:'지난주 회의록 정리',done:true,date:dateKey(prev),at:'18:24'},{id:uid(),text:'브랜드 리서치 자료 취합',done:true,date:dateKey(prev2),at:'16:03'}];s.sampleSeeded=true;saveLocal()}function archiveToday(k){const at=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});(s.today||[]).filter(x=>x.text.trim()).reverse().forEach(x=>s.archive.unshift({id:uid(),text:x.text.trim(),done:!!x.done,date:k,at}))}function rollover(){const now=dateKey(new Date());if(s.lastDate===now)return;let gap=Math.floor((fromKey(now)-fromKey(s.lastDate))/86400000);if(!Number.isFinite(gap)||gap<1)gap=1;for(let i=0;i<gap;i++){archiveToday(s.lastDate);const moved=(s.tomorrow||[]).filter(x=>x.text.trim()||x.done).map(x=>({...normalizeTask(x,'today'),id:uid()}));s.today=moved.length?moved:[blank()];s.tomorrow=[blank()];const n=fromKey(s.lastDate);n.setDate(n.getDate()+1);s.lastDate=dateKey(n)}s.lastDate=now;saveLocal()}function countProgress(items){const visible=items.filter(x=>x.text.trim()),total=visible.length,done=visible.filter(x=>x.done).length;return{done,total,pct:total?Math.round(done/total*100):0}}function updateProgress(){['today','tomorrow'].forEach(k=>{const p=countProgress(s[k]),ring=document.getElementById(k+'Ring'),txt=document.getElementById(k+'Count');ring.style.setProperty('--p',p.pct+'%');txt.textContent=p.total?`${p.done}/${p.total}`:'0/0'});const p=countProgress(s.week);document.getElementById('weekSummary').textContent=`${p.done}/${p.total||0} 완료`;document.getElementById('weekBar').style.width=p.pct+'%';document.getElementById('weekPct').textContent=p.pct+'%'}function renderTodayTomorrow(k){const root=document.getElementById(k+'List');root.innerHTML='';s[k].forEach(t=>{const r=document.createElement('div');r.className='task-row'+(t.done?' done':'');const tag=t.tag?`<span class="tag ${esc(t.tone||'gray')}">${esc(t.tag)}</span>`:'<span></span>';r.innerHTML=`<button class="check ${t.done?'done':''}" aria-label="완료">${t.done?'✓':''}</button><input class="task-text" value="${esc(t.text)}" placeholder="메모 입력">${tag}<input class="time-input" value="${esc(t.time||'')}" placeholder="--:--" maxlength="5"><button class="delete" aria-label="삭제">×</button>`;r.querySelector('.check').onclick=()=>{t.done=!t.done;save();renderAll()};const text=r.querySelector('.task-text');text.oninput=e=>{t.text=e.target.value;save();updateProgress()};text.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add(k)}};r.querySelector('.time-input').oninput=e=>{t.time=e.target.value;save()};r.querySelector('.delete').onclick=()=>removeTask(k,t.id);root.appendChild(r)})}function weekDateFor(index){const n=new Date(),start=new Date(n),diff=(start.getDay()+6)%7;start.setDate(start.getDate()-diff);const d=new Date(start);d.setDate(start.getDate()+Math.min(index,6));return{date:d.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'}),day:d.toLocaleDateString('ko-KR',{weekday:'short'})}}function cycleStatus(t){const seq=['대기','진행중','완료'],i=seq.indexOf(t.status);t.status=seq[(i+1)%seq.length];t.done=t.status==='완료';save();renderAll()}function renderWeek(){const root=document.getElementById('weekList');root.innerHTML='';s.week.forEach((t,i)=>{const m=weekDateFor(i),r=document.createElement('div');r.className='week-row'+(t.done?' done':'');const cls=t.status==='완료'?'done':t.status==='진행중'?'progress':'';r.innerHTML=`<span class="dot"></span><span class="week-date"><b>${esc(m.date)}</b><span>${esc(m.day)}</span></span><button class="check ${t.done?'done':''}" aria-label="완료">${t.done?'✓':''}</button><input class="task-text" value="${esc(t.text)}" placeholder="메모 입력"><button class="status ${cls}">${esc(t.status||'대기')}</button><button class="delete" aria-label="삭제">×</button>`;r.querySelector('.check').onclick=()=>{t.done=!t.done;t.status=t.done?'완료':'대기';save();renderAll()};const text=r.querySelector('.task-text');text.oninput=e=>{t.text=e.target.value;save();updateProgress()};text.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add('week')}};r.querySelector('.status').onclick=()=>cycleStatus(t);r.querySelector('.delete').onclick=()=>removeTask('week',t.id);root.appendChild(r)})}function removeTask(k,id){s[k]=s[k].filter(x=>x.id!==id);if(!s[k].length)s[k]=[blank(k==='week'?'week':'task')];save();renderAll()}function add(k){s[k].push(blank(k==='week'?'week':'task'));save();renderAll();const xs=document.getElementById(k+'List').querySelectorAll('.task-text');xs[xs.length-1]?.focus()}function renderArchive(){const box=document.getElementById('archiveBox'),root=document.getElementById('archiveList');box.classList.toggle('open',s.archiveOpen);document.getElementById('toggleArchive').textContent=s.archiveOpen?'최근 완료순⌄':'완료 내역 보기';root.innerHTML='';if(!s.archiveOpen)return;if(!s.archive.length){root.innerHTML='<div class="archive-empty">완료된 Today 메모가 날짜가 지나면 여기에 저장됩니다.</div>';return}s.archive.forEach(a=>{const d=fromKey(a.date),label=Number.isNaN(d.getTime())?a.date:d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'}),r=document.createElement('div');r.className='arch-row';r.innerHTML=`<span class="arch-check">✓</span><span class="arch-text">${esc(a.text)}</span><span class="arch-meta">${esc(label)} ${esc(a.at||'')}</span><button class="delete" aria-label="삭제">×</button>`;r.querySelector('.delete').onclick=()=>{s.archive=s.archive.filter(x=>x.id!==a.id);save();renderArchive()};root.appendChild(r)})}function renderDates(){const n=new Date(),tm=new Date(n);tm.setDate(n.getDate()+1);document.getElementById('headDate').textContent=n.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});document.getElementById('todayDate').textContent=n.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});document.getElementById('tomorrowDate').textContent=tm.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})}function renderAll(){renderDates();renderTodayTomorrow('today');renderTodayTomorrow('tomorrow');renderWeek();renderArchive();updateProgress()}document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));document.getElementById('toggleArchive').onclick=()=>{s.archiveOpen=!s.archiveOpen;save();renderArchive()};document.getElementById('clearArchive').onclick=()=>{if(confirm('Archive 기록을 모두 비울까요?')){s.archive=[];save();renderArchive()}};function setSyncStatus(mode,label){const b=document.getElementById('syncBtn'),t=document.getElementById('syncStatusText');b.classList.remove('online','syncing','offline');b.classList.add(mode);b.title=label||'Sync';if(t&&label)t.textContent=label}function genCode(){const a=new Uint8Array(18);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,28).toUpperCase()}async function syncReq(action,payload={}){const r=await fetch(SYNC_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,code:syncCode,...payload}),cache:'no-store'});if(!r.ok)throw new Error('sync_failed');return r.json()}function scheduleCloudSave(){clearTimeout(cloudSaveTimer);setSyncStatus('syncing','Syncing…');cloudSaveTimer=setTimeout(cloudSave,450)}async function cloudSave(){if(!syncCode)return;try{await syncReq('save',{state:JSON.parse(JSON.stringify(s))});lastRemoteAt=new Date().toISOString();setSyncStatus('online','Synced')}catch{setSyncStatus('offline','Offline')}}async function cloudLoad(initial=false){if(!syncCode)return false;try{setSyncStatus('syncing','Syncing…');const d=await syncReq('load');if(d.state){applyingRemote=true;Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,d.state);normalize();applyingRemote=false;saveLocal();lastRemoteAt=d.updated_at||'';renderAll();setSyncStatus('online','Synced');return true}if(initial)await cloudSave();else setSyncStatus('online','Synced');return false}catch{setSyncStatus('offline','Offline');return false}}async function pollCloud(){if(!cloudReady||!syncCode)return;try{const d=await syncReq('load');if(d.state&&d.updated_at&&(!lastRemoteAt||new Date(d.updated_at)>new Date(lastRemoteAt))){applyingRemote=true;Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,d.state);normalize();applyingRemote=false;saveLocal();lastRemoteAt=d.updated_at;renderAll();setSyncStatus('online','Synced')}}catch{setSyncStatus('offline','Offline')}}function openSync(){document.getElementById('syncCodeInput').value=syncCode;document.getElementById('syncOverlay').classList.add('open');document.getElementById('syncStatusText').textContent='모든 기기에서 같은 코드를 사용하세요.'}function closeSync(){document.getElementById('syncOverlay').classList.remove('open')}async function useCode(){const v=document.getElementById('syncCodeInput').value.trim().toUpperCase().replace(/\s+/g,'');if(v.length<16){document.getElementById('syncStatusText').textContent='코드가 너무 짧습니다.';return}syncCode=v;localStorage.setItem(SYNC_CODE_KEY,syncCode);cloudReady=true;const found=await cloudLoad(false);if(!found)await cloudSave()}async function newCode(){syncCode=genCode();localStorage.setItem(SYNC_CODE_KEY,syncCode);cloudReady=true;document.getElementById('syncCodeInput').value=syncCode;await cloudSave();document.getElementById('syncStatusText').textContent='새 동기화 공간을 만들었습니다.'}async function copyCode(){try{await navigator.clipboard.writeText(syncCode);document.getElementById('syncStatusText').textContent='동기화 코드를 복사했습니다.'}catch{const i=document.getElementById('syncCodeInput');i.select();document.execCommand('copy')}}async function initSync(){if(!syncCode){syncCode=genCode();localStorage.setItem(SYNC_CODE_KEY,syncCode)}cloudReady=true;await cloudLoad(true);setInterval(pollCloud,5000)}document.getElementById('syncBtn').onclick=openSync;document.getElementById('syncClose').onclick=closeSync;document.getElementById('syncOverlay').onclick=e=>{if(e.target.id==='syncOverlay')closeSync()};document.getElementById('useSyncCode').onclick=useCode;document.getElementById('newSyncCode').onclick=newCode;document.getElementById('copySyncCode').onclick=copyCode;const sizes=[520,620,720];let ui={sizeIndex:2,theme:'light',locked:false};try{ui={...ui,...JSON.parse(localStorage.getItem(UI_KEY)||'{}')}}catch{}const root=document.getElementById('root'),sizeBtn=document.getElementById('sizeBtn'),themeBtn=document.getElementById('themeBtn'),lockBtn=document.getElementById('lockBtn');function saveUI(){localStorage.setItem(UI_KEY,JSON.stringify(ui))}function applyUI(){root.style.maxWidth=sizes[ui.sizeIndex]+'px';document.documentElement.dataset.theme=ui.theme;sizeBtn.disabled=ui.locked;lockBtn.classList.toggle('active',ui.locked)}sizeBtn.onclick=()=>{if(ui.locked)return;ui.sizeIndex=(ui.sizeIndex+1)%sizes.length;saveUI();applyUI()};themeBtn.onclick=()=>{ui.theme=ui.theme==='dark'?'light':'dark';saveUI();applyUI()};lockBtn.onclick=()=>{ui.locked=!ui.locked;saveUI();applyUI()};document.getElementById('resetBtn').onclick=()=>{ui={sizeIndex:2,theme:'light',locked:false};localStorage.removeItem(UI_KEY);applyUI()};normalize();rollover();seedIfEmpty();renderAll();applyUI();initSync();
