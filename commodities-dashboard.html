<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>원자재 · 원료 시세</title>
<style>
:root{--bg:#ffffff;--panel:#ffffff;--line:#eceae6;--soft:#f7f6f3;--text:#23231f;--sub:#73756f;--muted:#a2a29b;--green:#2f8f59;--greenbg:#eef8f1;--red:#dd605a;--redbg:#fceeed;--gold:#e3ae2b;--silver:#98a0a9;--oil:#5e8ee6;--brent:#7a83d8;--gas:#4da1ff;--copper:#d07a46;--shadow:0 8px 24px rgba(20,20,18,.03)}
html[data-theme="dark"]{--bg:#20201e;--panel:#20201e;--line:#34342f;--soft:#272724;--text:#f2f2ed;--sub:#c0c2bb;--muted:#90918b;--green:#7bc697;--greenbg:#28382f;--red:#ef8a80;--redbg:#3c2b2a;--gold:#efc25a;--silver:#c2c7ce;--oil:#7ba8f0;--brent:#9aa3ef;--gas:#73bbff;--copper:#e09f75;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}.widget{width:min(100%,760px);margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.title{font-size:18px;font-weight:780;letter-spacing:-.03em}.subtitle{margin-top:4px;font-size:10px;color:var(--muted)}.meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:9px;white-space:nowrap}.refresh{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1.45fr;gap:12px}.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px}.panel-title{font-size:12px;font-weight:760;letter-spacing:-.01em;margin-bottom:10px}.panel-title .small{font-size:9px;color:var(--muted);font-weight:500}.summary-list{display:grid}.summary-item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.summary-item:last-child{border-bottom:0}.name{font-size:10px;color:var(--sub);white-space:nowrap}.price{font-size:11px;font-weight:760;white-space:nowrap}.change{font-size:9px;font-weight:740;padding:2px 6px;border-radius:999px;white-space:nowrap}.up{color:var(--green);background:var(--greenbg)}.down{color:var(--red);background:var(--redbg)}.trend-list{display:grid;gap:8px}.trend-item{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;min-height:28px}.trend-name{font-size:9px;color:var(--sub);white-space:nowrap}.trend-price{font-size:10px;font-weight:760;white-space:nowrap}.spark{width:100%;height:24px;display:block;overflow:visible}.spark-path{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:9px;color:var(--muted)}.loading{opacity:.68}@media(max-width:620px){.grid{grid-template-columns:1fr}.trend-item{grid-template-columns:64px 1fr auto}.title{font-size:17px}}
</style>
</head>
<body>
<div class="widget" id="widget">
<div class="top"><div><div class="title">원자재 · 원료 시세</div><div class="subtitle">핵심 요약과 최근 추이를 한 번에 확인하세요.</div></div><div class="meta"><span class="refresh">↻</span><span id="updated">업데이트 확인 중</span></div></div>
<div class="grid"><section class="panel"><div class="panel-title">핵심 요약</div><div id="summary" class="summary-list"></div></section><section class="panel"><div class="panel-title">주요 가격 추이 <span class="small">(7일)</span></div><div id="trends" class="trend-list"></div></section></div>
<div class="footer"><span id="fxInfo">통화: USD &nbsp;&nbsp; 환율: ₩—</span><span id="timeInfo">Source · Yahoo Finance · Data — · Hourly</span></div>
</div>
<script>
const theme=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=theme==='dark'?'dark':theme==='light'?'light':(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
const FALLBACK={updated_at:'2026-08-20T23:30:00+09:00',fx:1360.5,items:[{name:'금',price:2345.60,change_pct:0.42,color:'var(--gold)',history:[2284,2291,2300,2313,2308,2321,2311,2326,2335,2332,2340,2345.6]},{name:'은',price:29.82,change_pct:1.32,color:'var(--silver)',history:[28.8,28.9,29.0,29.1,29.0,29.3,29.2,29.5,29.4,29.6,29.7,29.82]},{name:'구리',price:4.72,change_pct:0.68,color:'var(--copper)',history:[4.60,4.61,4.59,4.63,4.64,4.70,4.67,4.71,4.69,4.73,4.70,4.72]},{name:'브렌트유',price:81.14,change_pct:1.25,color:'var(--brent)',history:[79.1,79.7,79.4,80.0,79.8,80.3,80.5,80.1,80.7,80.9,81.0,81.14]},{name:'WTI 원유',price:78.64,change_pct:1.87,color:'var(--oil)',history:[76.9,77.3,77.2,77.6,77.4,77.8,78.0,77.5,78.1,77.7,78.2,78.64]},{name:'천연가스',price:2.55,change_pct:-0.93,color:'var(--gas)',history:[2.61,2.59,2.63,2.58,2.56,2.59,2.57,2.54,2.57,2.54,2.56,2.55]}]};
const displayOrder=['금','은','구리','브렌트유','WTI 원유','천연가스'];
function fmtPrice(v){return '$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function fmtChange(v){const n=Number(v)||0;return `${n>=0?'▲':'▼'} ${Math.abs(n).toFixed(2)}%`}function changeClass(v){return Number(v)>=0?'up':'down'}
function sparkline(values,color){const nums=(values||[]).slice(-7).map(Number).filter(v=>Number.isFinite(v));const W=168,H=24,P=2;if(nums.length<2)return '';const min=Math.min(...nums),max=Math.max(...nums),range=max-min||1;const pts=nums.map((v,i)=>{const x=P+(W-P*2)*(i/(nums.length-1));const y=H-P-((v-min)/range)*(H-P*2);return[x,y]});const d=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="spark-path" d="${d}" stroke="${color}"></path></svg>`}
function normalizeData(raw){const colorMap={'금':'var(--gold)','은':'var(--silver)','구리':'var(--copper)','브렌트유':'var(--brent)','WTI 원유':'var(--oil)','천연가스':'var(--gas)'};const base=(raw.items||[]).map(item=>({...item,color:colorMap[item.name]||'var(--gold)'}));return{updated_at:raw.updated_at||FALLBACK.updated_at,source_updated_at:raw.source_updated_at||raw.updated_at||FALLBACK.updated_at,fx:raw.fx||FALLBACK.fx,items:base}}
function render(data){const items=displayOrder.map(name=>data.items.find(item=>item.name===name)).filter(Boolean);document.getElementById('summary').innerHTML=items.map(item=>`<div class="summary-item"><div class="name">${item.name}</div><div class="price">${fmtPrice(item.price)}</div><div class="change ${changeClass(item.change_pct)}">${fmtChange(item.change_pct)}</div></div>`).join('');document.getElementById('trends').innerHTML=items.map(item=>`<div class="trend-item"><div class="trend-name">${item.name}</div>${sparkline(item.history,item.color||'var(--gold)')}<div class="trend-price">${fmtPrice(item.price)}</div></div>`).join('');document.getElementById('fxInfo').textContent=`통화: USD   환율: ₩${Number(data.fx||0).toLocaleString('ko-KR',{maximumFractionDigits:1})}`;const d=new Date(data.source_updated_at||data.updated_at||Date.now());if(!isNaN(d)){const hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0');document.getElementById('updated').textContent=`Data ${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${hh}:${mm}`;document.getElementById('timeInfo').textContent=`Source · Yahoo Finance · Data ${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${hh}:${mm} KST · Hourly`}}
async function load(){document.getElementById('widget').classList.add('loading');try{const res=await fetch('./commodities-data.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('fetch failed');render(normalizeData(await res.json()))}catch(err){render(FALLBACK)}document.getElementById('widget').classList.remove('loading')}render(FALLBACK);load();
</script>
</body>
</html>
