<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>원자재 · 원료 시세</title><style>
:root{--bg:#fff;--panel:#fff;--line:#eceae6;--text:#23231f;--sub:#73756f;--muted:#a2a29b;--green:#2f8f59;--greenbg:#eef8f1;--red:#dd605a;--redbg:#fceeed;--gold:#e3ae2b;--silver:#98a0a9;--oil:#5e8ee6;--brent:#7a83d8;--gas:#4da1ff;--copper:#d07a46;--shadow:0 8px 24px rgba(20,20,18,.03)}html[data-theme=dark]{--bg:#20201e;--panel:#20201e;--line:#34342f;--text:#f2f2ed;--sub:#c0c2bb;--muted:#90918b;--green:#7bc697;--greenbg:#28382f;--red:#ef8a80;--redbg:#3c2b2a;--gold:#efc25a;--silver:#c2c7ce;--oil:#7ba8f0;--brent:#9aa3ef;--gas:#73bbff;--copper:#e09f75;--shadow:none}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;-webkit-font-smoothing:antialiased}.widget{width:min(100%,760px);margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.title{font-size:18px;font-weight:780;letter-spacing:-.03em}.subtitle{margin-top:4px;font-size:10px;color:var(--muted)}.meta{font-size:9px;color:var(--muted);white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1.45fr;gap:12px}.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:12px}.panel-title{font-size:12px;font-weight:760;margin-bottom:10px}.small{font-size:9px;color:var(--muted);font-weight:500}.summary-list{display:grid}.summary-item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.summary-item:last-child{border-bottom:0}.name{font-size:10px;color:var(--sub);white-space:nowrap}.price{font-size:11px;font-weight:760;white-space:nowrap}.change{font-size:9px;font-weight:740;padding:2px 6px;border-radius:999px;white-space:nowrap}.up{color:var(--green);background:var(--greenbg)}.down{color:var(--red);background:var(--redbg)}.trend-list{display:grid;gap:8px}.trend-item{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;min-height:28px}.trend-name{font-size:9px;color:var(--sub);white-space:nowrap}.trend-price{font-size:10px;font-weight:760;white-space:nowrap}.spark{width:100%;height:24px;display:block}.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:9px;color:var(--muted)}@media(max-width:620px){.grid{grid-template-columns:1fr}.trend-item{grid-template-columns:64px 1fr auto}.title{font-size:17px}}
</style></head><body><div class="widget"><div class="top"><div><div class="title">원자재 · 원료 시세</div><div class="subtitle">핵심 요약과 최근 추이를 한 번에 확인하세요.</div></div><div class="meta" id="updated">Data 불러오는 중</div></div><div class="grid"><section class="panel"><div class="panel-title">핵심 요약</div><div id="summary" class="summary-list"></div></section><section class="panel"><div class="panel-title">주요 가격 추이 <span class="small">(최근 7거래일)</span></div><div id="trends" class="trend-list"></div></section></div><div class="footer"><span id="fxInfo">통화: USD · 환율: —</span><span id="timeInfo">Source · Yahoo Finance · Hourly</span></div></div><script>
const theme=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=theme==='dark'?'dark':theme==='light'?'light':(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
const order=['금','은','구리','브렌트유','WTI 원유','천연가스'];const colors={'금':'var(--gold)','은':'var(--silver)','구리':'var(--copper)','브렌트유':'var(--brent)','WTI 원유':'var(--oil)','천연가스':'var(--gas)'};
function fmtPrice(v){return '$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function fmtChange(v){const n=Number(v)||0;return `${n>=0?'▲':'▼'} ${Math.abs(n).toFixed(2)}%`}function sparkline(values,color){const a=(values||[]).slice(-7).map(Number).filter(Number.isFinite);if(a.length<2)return '<div></div>';const W=168,H=24,P=2,min=Math.min(...a),max=Math.max(...a),r=max-min||1;const pts=a.map((v,i)=>[P+(W-P*2)*(i/(a.length-1)),H-P-((v-min)/r)*(H-P*2)]);const d=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function placeholders(){document.getElementById('summary').innerHTML=order.map(n=>`<div class="summary-item"><div class="name">${n}</div><div class="price">—</div><div class="change">—</div></div>`).join('');document.getElementById('trends').innerHTML=order.map(n=>`<div class="trend-item"><div class="trend-name">${n}</div><div></div><div class="trend-price">—</div></div>`).join('')}
function render(data){const items=order.map(n=>(data.items||[]).find(i=>i.name===n)).filter(Boolean);document.getElementById('summary').innerHTML=items.map(i=>`<div class="summary-item"><div class="name">${i.name}</div><div class="price">${fmtPrice(i.price)}</div><div class="change ${Number(i.change_pct)>=0?'up':'down'}">${fmtChange(i.change_pct)}</div></div>`).join('');document.getElementById('trends').innerHTML=items.map(i=>`<div class="trend-item"><div class="trend-name">${i.name}</div>${sparkline(i.history,colors[i.name])}<div class="trend-price">${fmtPrice(i.price)}</div></div>`).join('');document.getElementById('fxInfo').textContent=`통화: USD · 환율: ₩${Number(data.fx||0).toLocaleString('ko-KR',{maximumFractionDigits:2})}`;const d=new Date(data.source_updated_at||data.updated_at);if(!isNaN(d)){const mm=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'),hh=String(d.getHours()).padStart(2,'0'),mi=String(d.getMinutes()).padStart(2,'0');document.getElementById('updated').textContent=`Data ${mm}.${dd} ${hh}:${mi}`;document.getElementById('timeInfo').textContent=`Source · Yahoo Finance · Data ${mm}.${dd} ${hh}:${mi} KST · Hourly`}}
async function load(){placeholders();try{const r=await fetch('./commodities-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();render(await r.json())}catch(e){document.getElementById('updated').textContent='데이터 불러오기 실패';document.getElementById('timeInfo').textContent='Source · Yahoo Finance · 재시도 필요'}}load();
</script></body></html>
