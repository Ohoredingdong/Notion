<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Commodities Dashboard</title><style>:root{--bg:#fdfdfc; --panel:#ffffff; --line:#ebe9e4; --soft:#f7f6f3; --text:#242420; --sub:#777872; --muted:#a2a29d;--up:#2d6d4d; --down:#c15a4c; --accent:#b78b48; --spark:#b5b5b1;--shadow:0 10px 30px rgba(25,25,22,.03), 0 1px 2px rgba(25,25,22,.02);}html[data-theme="dark"]{--bg:#181817; --panel:#20201e; --line:#31312f; --soft:#252523; --text:#f1f1ee; --sub:#c0c1bb; --muted:#8d8e89;--up:#79c596; --down:#f08a7d; --accent:#e1be78; --spark:#8f8f8b; --shadow:none;}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}button{font:inherit;color:inherit}.widget{width:min(100%,760px);margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px 16px 12px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.title{font-size:18px;font-weight:760;letter-spacing:-.03em}.subtitle{margin-top:4px;font-size:10px;color:var(--muted)}.meta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:10px;white-space:nowrap}.refresh{width:26px;height:26px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:var(--muted);cursor:pointer}.refresh:hover{background:var(--soft);color:var(--text)}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:12px}.section{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel),var(--soft));padding:14px 14px 12px;min-height:294px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.section-title{font-size:13px;font-weight:740;letter-spacing:-.02em}.section-sub{font-size:10px;color:var(--muted)}.rows{display:grid;gap:10px}.row{padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0;padding-bottom:0}.row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.label-wrap{display:flex;align-items:center;gap:8px}.metal-emoji{font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center;width:18px}.name{font-size:13px;font-weight:760;letter-spacing:-.02em}.code{margin-top:2px;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.02em}.price-wrap{text-align:right}.change{font-size:12px;font-weight:760}.change.up{color:var(--up)}.change.down{color:var(--down)}.price{margin-top:4px;font-size:18px;font-weight:780;letter-spacing:-.03em}.subprices{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:7px;font-size:10px;color:var(--sub)}.subprices strong{color:var(--text);font-weight:760;margin-left:3px}.tabs{display:flex;gap:6px;background:var(--soft);padding:3px;border-radius:10px;border:1px solid var(--line)}.tab{height:28px;padding:0 11px;border:0;background:transparent;border-radius:8px;font-size:10px;font-weight:730;color:var(--sub);cursor:pointer}.tab.active{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(30,30,26,.05)}.energy-main{padding-top:4px}.energy-price-line{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}.energy-price{font-size:22px;font-weight:800;letter-spacing:-.035em}.energy-change{font-size:11px;font-weight:760;margin-bottom:3px}.energy-meta{margin-top:4px;font-size:10px;color:var(--sub)}.chart-box{height:66px;margin:14px 0 12px;border-bottom:1px solid var(--line)}.chart{width:100%;height:58px;display:block}.stat-grid{display:grid;gap:12px;margin-top:2px}.stat{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.stat-label{font-size:10px;color:var(--sub)}.stat-value{font-size:14px;font-weight:760;letter-spacing:-.02em}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.empty{opacity:.55}.loader{display:inline-block;width:13px;height:13px;border:1.7px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:680px){.grid{grid-template-columns:1fr}.section{min-height:auto}.widget{padding:12px}.top{margin-bottom:10px}.title{font-size:17px}.energy-price{font-size:20px}}</style></head><body><div class="widget"><div class="top"><div><div class="title">원자재 시세</div><div class="subtitle">금 · 은 · 에너지 시세를 한 화면에서 확인하세요.</div></div><div class="meta"><button id="refreshBtn" class="refresh" aria-label="새로고침" title="새로고침"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M19 7v4h-4M5 17v-4h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.5 9A6.5 6.5 0 0 0 6.6 7L5 11M6.5 15A6.5 6.5 0 0 0 17.4 17L19 13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button><span id="updated">로딩 중</span></div></div><div class="grid"><section class="section"><div class="section-head"><div><div class="section-title">금속</div><div class="section-sub">달러/온스 · 원/g</div></div></div><div class="rows" id="metalRows"></div></section><section class="section"><div class="section-head"><div><div class="section-title">에너지</div><div class="section-sub" id="energySub">선물 시세</div></div><div class="tabs" id="energyTabs"><button class="tab active" data-symbol="CL=F">WTI</button><button class="tab" data-symbol="BZ=F">브렌트</button><button class="tab" data-symbol="NG=F">천연가스</button></div></div><div class="energy-main"><div class="energy-price-line"><div class="energy-price" id="energyPrice">—</div><div class="energy-change" id="energyChange">—</div></div><div class="energy-meta" id="energyLabel">달러 / 배럴</div><div class="chart-box"><svg class="chart" id="energyChart" viewBox="0 0 320 58" preserveAspectRatio="none"></svg></div><div class="stat-grid" id="energyStats"></div></div></section></div><div class="footer"><span id="fxInfo">환율 적용 중</span><span id="sourceInfo">Yahoo Finance 기반 · 2분 자동 새로고침</span></div></div><script>const theme = new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme = (theme==='dark'||theme==='light') ? theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');const SYMBOLS = {gold: { symbol:'GC=F', name:'금', code:'GOLD', dot:'gold' },silver: { symbol:'SI=F', name:'은', code:'SILVER', dot:'silver' }};const ENERGY = {'CL=F': { name:'WTI', label:'달러 / 배럴 (WTI 선물)', unit:'배럴', krwUnit:'1배럴', liter:true },'BZ=F': { name:'브렌트', label:'달러 / 배럴 (브렌트유 선물)', unit:'배럴', krwUnit:'1배럴', liter:true },'NG=F': { name:'천연가스', label:'달러 / MMBtu (천연가스 선물)', unit:'MMBtu', krwUnit:'1MMBtu', liter:false }};const FALLBACK = {fx: 1394,quote: {'GC=F': { price:4545.8, prev:4541.3, changePct:0.10 },'SI=F': { price:67.02, prev:65.83, changePct:1.81 },'CL=F': { price:86.51, prev:84.39, changePct:2.51 },'BZ=F': { price:89.12, prev:87.44, changePct:1.92 },'NG=F': { price:2.18, prev:2.11, changePct:3.31 }},chart: {'CL=F':[78,79,78.5,80.3,81.2,80.8,82.4,83.5,82.7,84.2,85.4,86.5],'BZ=F':[81,81.4,82.1,82.5,83.1,84.2,83.8,84.7,85.2,86.3,88.1,89.1],'NG=F':[2.45,2.41,2.35,2.31,2.29,2.26,2.18,2.14,2.12,2.15,2.17,2.18]}};let state = { selectedEnergy: 'CL=F', fx: FALLBACK.fx, quotes: JSON.parse(JSON.stringify(FALLBACK.quote)), charts: JSON.parse(JSON.stringify(FALLBACK.chart)) };const $ = sel => document.querySelector(sel);const $$ = sel => [...document.querySelectorAll(sel)];function fmtUsd(v){ return '$' + Number(v).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }function fmtKrw(v){ return '₩' + Math.round(v).toLocaleString('ko-KR'); }function fmtPct(v){ const n = Number(v)||0; const sign = n>0 ? '▲ ' : n<0 ? '▼ ' : ''; return sign + Math.abs(n).toFixed(2) + '%'; }function changeClass(v){ const n = Number(v)||0; return n >= 0 ? 'up' : 'down'; }function fmtTime(d=new Date()){ return `${d.getMonth()+1}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }function ounceToGram(usdPerOz, fx){ return usdPerOz * fx / 31.1034768; }function renderMetals(){const wrap = $('#metalRows');const metals = [SYMBOLS.gold, SYMBOLS.silver];wrap.innerHTML = metals.map(meta => {const q = state.quotes[meta.symbol] || {};const perG = ounceToGram(q.price || 0, state.fx);const perDon = perG * 3.75;return `<div class="row"><div class="row-top"><div><div class="label-wrap"><span class="metal-emoji">${meta.symbol==='GC=F'?'🟡':'⚪'}</span><div><div class="name">${meta.name}</div><div class="code">${meta.code}</div></div></div></div><div class="price-wrap"><div class="change ${changeClass(q.changePct)}">${fmtPct(q.changePct)}</div><div class="price">${fmtUsd(q.price || 0)}</div></div></div><div class="subprices"><span>1g<strong>${fmtKrw(perG)}</strong></span><span>1돈 3.75g<strong>${fmtKrw(perDon)}</strong></span></div></div>`;}).join('');}function buildSparkline(values){const svg = $('#energyChart');const nums = values.map(Number).filter(v => Number.isFinite(v));if(!nums.length){ svg.innerHTML=''; return; }const min = Math.min(...nums), max = Math.max(...nums);const padX = 6, padY = 7, w = 320, h = 58;const range = max-min || 1;const pts = nums.map((v,i)=>{const x = padX + (w-padX*2) * (i/(nums.length-1 || 1));const y = h-padY - ((v-min)/range) * (h-padY*2);return [x,y];});const d = pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');const area = `${d} L ${pts[pts.length-1][0].toFixed(1)} ${h-padY} L ${pts[0][0].toFixed(1)} ${h-padY} Z`;const last = pts[pts.length-1];svg.innerHTML = `<defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(183,139,72,.22)"/><stop offset="100%" stop-color="rgba(183,139,72,0)"/></linearGradient></defs><path d="${area}" fill="url(#fade)"></path><path d="${d}" fill="none" stroke="var(--spark)" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.3" fill="var(--accent)"></circle>`;}function renderEnergy(){const meta = ENERGY[state.selectedEnergy];const q = state.quotes[state.selectedEnergy] || {};$('#energyPrice').textContent = fmtUsd(q.price || 0);$('#energyChange').textContent = fmtPct(q.changePct);$('#energyChange').className = `energy-change ${changeClass(q.changePct)}`;$('#energyLabel').textContent = meta.label;$('#energySub').textContent = meta.name + ' 시세';buildSparkline(state.charts[state.selectedEnergy] || []);let statsHTML = '';if(meta.liter){const krwBarrel = (q.price || 0) * state.fx;const krwLiter = krwBarrel / 158.987294928;statsHTML = `<div class="stat"><div class="stat-label">${meta.krwUnit}</div><div class="stat-value">${fmtKrw(krwBarrel)}</div></div><div class="stat"><div class="stat-label">1리터 환산</div><div class="stat-value">${fmtKrw(krwLiter)}</div></div>`;} else {const krwMmbtu = (q.price || 0) * state.fx;const krwTherm = krwMmbtu / 10;statsHTML = `<div class="stat"><div class="stat-label">1MMBtu</div><div class="stat-value">${fmtKrw(krwMmbtu)}</div></div><div class="stat"><div class="stat-label">1 therm 환산</div><div class="stat-value">${fmtKrw(krwTherm)}</div></div>`;}$('#energyStats').innerHTML = statsHTML;}async function fetchQuoteBatch(){const symbols = ['GC=F','SI=F','CL=F','BZ=F','NG=F','KRW=X'];const url = 'https://query1.finance.yahoo.com/v7/finance/quote?symbols=' + encodeURIComponent(symbols.join(','));const res = await fetch(url, {cache:'no-store'});if(!res.ok) throw new Error('quote fetch failed');const data = await res.json();const rows = data.quoteResponse?.result || [];const map = {};rows.forEach(r => {if(r.symbol === 'KRW=X'){state.fx = Number(r.regularMarketPrice) || state.fx;} else {map[r.symbol] = {price: Number(r.regularMarketPrice),prev: Number(r.regularMarketPreviousClose || r.regularMarketOpen || r.regularMarketPrice),changePct: Number(r.regularMarketChangePercent)};}});state.quotes = {...state.quotes, ...map};}async function fetchChart(symbol){const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?range=1mo&interval=1d&includePrePost=false&events=div%2Csplits`;const res = await fetch(url, {cache:'no-store'});if(!res.ok) throw new Error('chart fetch failed');const data = await res.json();const result = data.chart?.result?.[0];const closes = result?.indicators?.quote?.[0]?.close || [];const cleaned = closes.map(Number).filter(v => Number.isFinite(v));if(cleaned.length) state.charts[symbol] = cleaned.slice(-12);}async function refreshAll(){$('#updated').innerHTML = '<span class="loader"></span>';try{await fetchQuoteBatch();await fetchChart(state.selectedEnergy);}catch(e){console.warn(e);}renderMetals();renderEnergy();$('#fxInfo').textContent = `환율 ₩${Math.round(state.fx).toLocaleString('ko-KR')} 적용`;$('#updated').textContent = fmtTime(new Date()) + ' 갱신';}$$('#energyTabs .tab').forEach(btn => btn.addEventListener('click', async () => {$$('#energyTabs .tab').forEach(b => b.classList.toggle('active', b===btn));state.selectedEnergy = btn.dataset.symbol;if(!state.charts[state.selectedEnergy]){try{ await fetchChart(state.selectedEnergy); }catch(e){ console.warn(e); }}renderEnergy();}));$('#refreshBtn').addEventListener('click', refreshAll);renderMetals();renderEnergy();$('#fxInfo').textContent = `환율 ₩${Math.round(state.fx).toLocaleString('ko-KR')} 적용`;$('#updated').textContent = '데이터 불러오는 중';refreshAll();setInterval(refreshAll, 120000);</script></body></html>
