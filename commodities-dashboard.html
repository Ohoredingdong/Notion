<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>원자재 요약</title>
<style>
:root{--bg:#fff;--text:#22231f;--sub:#6f716b;--muted:#a0a29c;--line:#ebe9e5;--soft:#f7f6f3;--green:#2f8f59;--greenbg:#edf7f0;--red:#db5f59;--redbg:#fceeed;--gold:#e6a817;--silver:#969ca5;--blue:#4d86df;--orange:#d07a46;--corn:#72ad4c;--shadow:0 8px 24px rgba(20,20,18,.035)}
html[data-theme="dark"]{--bg:#20201e;--text:#f2f2ed;--sub:#c1c2bc;--muted:#8f908b;--line:#33332f;--soft:#262624;--green:#7bc697;--greenbg:#26352c;--red:#ef8a80;--redbg:#392827;--gold:#efc35c;--silver:#c2c6cc;--blue:#7ba7ee;--orange:#e2a078;--corn:#95c56f;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}.widget{width:min(100%,760px);margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}.title{font-size:18px;font-weight:780;letter-spacing:-.03em}.subtitle{margin-top:4px;font-size:10px;color:var(--muted)}.meta{font-size:9px;color:var(--muted);white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1.45fr;gap:12px}.panel{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}.panel-title{font-size:12px;font-weight:760;margin-bottom:9px}.small{font-size:9px;color:var(--muted);font-weight:500}.summary-list{display:grid}.summary-item{display:grid;grid-template-columns:18px 1fr auto auto;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.summary-item:last-child{border-bottom:0}.icon{font-size:12px;text-align:center}.name{font-size:10px;white-space:nowrap}.price{font-size:11px;font-weight:760;white-space:nowrap}.change{font-size:9px;font-weight:740;padding:2px 5px;border-radius:999px;white-space:nowrap}.up{color:var(--green);background:var(--greenbg)}.down{color:var(--red);background:var(--redbg)}.cta{width:100%;height:29px;margin-top:9px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--sub);font-size:9px;font-weight:700}.trend-list{display:grid;gap:7px}.trend-item{display:grid;grid-template-columns:18px 58px 1fr auto;gap:7px;align-items:center;min-height:29px}.trend-name{font-size:9px;color:var(--sub);white-space:nowrap}.trend-price{font-size:10px;font-weight:760;white-space:nowrap}.spark{width:100%;height:24px;display:block}.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:9px;color:var(--muted)}.loading{opacity:.65}.error{display:none;margin-top:9px;padding:8px 10px;border-radius:9px;background:var(--soft);font-size:9px;color:var(--sub)}@media(max-width:620px){.grid{grid-template-columns:1fr}.trend-item{grid-template-columns:18px 64px 1fr auto}.title{font-size:17px}}
</style>
</head>
<body>
<div class="widget" id="widget">
  <div class="top"><div><div class="title">원자재 · 원료 시세</div><div class="subtitle">핵심 가격과 최근 추이를 한눈에 확인하세요.</div></div><div class="meta" id="updated">업데이트 확인 중</div></div>
  <div class="grid">
    <section class="panel"><div class="panel-title">핵심 요약</div><div id="summary" class="summary-list"></div><button class="cta" type="button">전체 보기 〉</button></section>
    <section class="panel"><div class="panel-title">주요 가격 추이 <span class="small">(최근)</span></div><div id="trends" class="trend-list"></div></section>
  </div>
  <div class="error" id="error">데이터 업데이트가 지연되어 마지막 저장값을 표시하고 있습니다.</div>
  <div class="footer"><span id="fx">통화 USD · 환율 —</span><span>GitHub 저장 데이터 · 자동 갱신</span></div>
</div>
<script>
const theme=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=theme==='dark'?'dark':theme==='light'?'light':(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
const FALLBACK={updated_at:'2026-08-20T14:17:23Z',fx:1394.59,items:[
{id:'gold',name:'금',emoji:'🟡',price:4537.8,history:[4033.7,4095.4,4245.8,4242,4340.7,4361.8,4383,4408.9,4363.6,4380.4,4417.8,4366,4489.4,4537.8]},
{id:'silver',name:'은',emoji:'⚪',price:67.27,history:[57.667,60.056,62.099,61.439,63.332,65.106,64.769,65.555,64.873,64.988,66.121,63.941,65.734,67.27]},
{id:'wti',name:'WTI 원유',emoji:'🛢️',price:86.72,history:[80.34,75.77,75.22,77.29,78.18,82.13,83.2,83.27,81.25,82.4,84.5,84.94,85.83,86.72]},
{id:'gas',name:'천연가스',emoji:'🔥',price:2.756,history:[2.781,2.682,2.688,2.64,2.662,2.794,2.767,2.804,2.727,2.733,2.69,2.776,2.814,2.756]},
{id:'copper',name:'구리',emoji:'🟫',price:6.429,history:[6.514,6.6185,6.703,6.687,6.5705,6.5945,6.612,6.597,6.5925,6.5995,6.604,6.4825,6.4875,6.4285]},
{id:'aluminum',name:'알루미늄',emoji:'◻️',price:3347,history:[3405.25,3382.75,3366,3365,3359,3420.5,3470,3423,3391,3355.5,3427.25,3329.5,3350.5,3347]}
]};
const colors={gold:'var(--gold)',silver:'var(--silver)',wti:'var(--blue)',gas:'var(--blue)',copper:'var(--orange)',aluminum:'var(--silver)',corn:'var(--corn)'};
function pct(i){const h=(i.history||[]).map(Number).filter(Number.isFinite);if(h.length<2)return 0;const a=h[h.length-2],b=h[h.length-1];return a?((b-a)/a*100):0}function fp(v){return '$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function fc(v){return `${v>=0?'▲':'▼'} ${Math.abs(v).toFixed(2)}%`}function spark(h,c){const a=(h||[]).slice(-8).map(Number).filter(Number.isFinite);if(a.length<2)return '';const W=160,H=24,P=2,min=Math.min(...a),max=Math.max(...a),r=max-min||1;const pts=a.map((v,i)=>[P+(W-P*2)*(i/(a.length-1)),H-P-((v-min)/r)*(H-P*2)]);const d=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function norm(data){const map={};(data.items||[]).forEach(x=>map[x.id]=x);return map}function render(data){const m=norm(data);const summary=['gold','silver','wti','gas','copper'].map(id=>m[id]).filter(Boolean);document.getElementById('summary').innerHTML=summary.map(i=>{const ch=pct(i);return `<div class="summary-item"><div class="icon">${i.emoji||'•'}</div><div class="name">${i.name}</div><div class="price">${fp(i.price)}</div><div class="change ${ch>=0?'up':'down'}">${fc(ch)}</div></div>`}).join('');const trends=['gold','wti','gas','copper','aluminum'].map(id=>m[id]).filter(Boolean);document.getElementById('trends').innerHTML=trends.map(i=>`<div class="trend-item"><div class="icon">${i.emoji||'•'}</div><div class="trend-name">${i.name}</div>${spark(i.history,colors[i.id]||'var(--blue)')}<div class="trend-price">${fp(i.price)}</div></div>`).join('');document.getElementById('fx').textContent=`통화 USD · 환율 ₩${Number(data.fx||0).toLocaleString('ko-KR',{maximumFractionDigits:2})}`;const d=new Date(data.updated_at||Date.now());document.getElementById('updated').textContent=isNaN(d)?'업데이트됨':`${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
async function load(){const w=document.getElementById('widget');w.classList.add('loading');try{const r=await fetch('./commodities-data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();const d=await r.json();render(d);document.getElementById('error').style.display='none'}catch(e){render(FALLBACK);document.getElementById('error').style.display='block'}w.classList.remove('loading')}render(FALLBACK);load();setInterval(load,120000);
</script>
</body></html>
