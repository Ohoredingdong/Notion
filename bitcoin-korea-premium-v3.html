<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Bitcoin Korea Premium v2</title><link rel="stylesheet" href="./assets/life-town-v2.css">
<style>
:root{--panel:#fff;--soft:#f7f7f8;--line:#e5e5e8;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--blue:#007aff;--green:#248a3d;--yellow:#9a7200;--red:#d92d27;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}
html[data-theme="dark"],html[data-lt-theme="dark"]{--panel:#1c1c1e;--soft:#2c2c2e;--line:#38383a;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--blue:#0a84ff;--green:#30d158;--yellow:#ffd60a;--red:#ff453a;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px!important;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}
.shell{width:100%;max-width:420px;margin:0 auto;container-type:inline-size}.widget{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:13px 13px 11px;box-shadow:var(--shadow)}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.title{font-size:17.5px;font-weight:760;letter-spacing:-.04em}.subtitle{margin-top:4px;font-size:10px;color:var(--muted)}.refresh{width:28px;height:28px;border:1px solid var(--line);border-radius:9px;background:var(--panel);display:grid;place-items:center;cursor:pointer}.refresh svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:13px;padding-bottom:11px;border-bottom:1px solid var(--line)}.eyebrow{font-size:9px;color:var(--muted)}.premium{margin-top:3px;font-size:34px;font-weight:790;letter-spacing:-.055em;line-height:1}.summary{max-width:180px;text-align:right;font-size:9.6px;line-height:1.4;color:var(--sub)}.summary strong{display:block;margin-bottom:2px;color:var(--text);font-size:10.3px}
.rows{margin-top:2px}.row{display:grid;grid-template-columns:40px minmax(0,1fr) 70px;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.symbol{font-size:13px;font-weight:770}.local{font-size:13.2px;font-weight:740}.global{margin-top:2px;font-size:9px;color:var(--muted)}.rp{text-align:right;font-size:12.2px;font-weight:760}
.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;padding-top:8px;border-top:1px solid var(--line);font-size:8.8px;color:var(--muted)}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--green);margin-left:4px}.loading{padding:30px 4px;text-align:center;color:var(--muted);font-size:10px}
@container(max-width:380px){.summary{max-width:145px;font-size:9.2px}.premium{font-size:32px}.local{font-size:12.8px}}
</style><style id="finish-v3">body{padding:6px!important}.shell{max-width:410px!important}.widget{border-radius:20px!important;padding:14px 14px 11px!important;box-shadow:none!important}.title{font-size:18.5px!important}.subtitle{font-size:10.2px!important}.refresh{width:30px!important;height:30px!important;box-shadow:none!important}.hero{margin-top:11px!important;padding-bottom:9px!important}.eyebrow{font-size:9.2px!important}.premium{font-size:32px!important}.summary{font-size:9.5px!important;line-height:1.35!important}.summary strong{font-size:10px!important}.row{grid-template-columns:42px minmax(0,1fr) 68px!important;padding:9px 0!important}.symbol{font-size:12.5px!important}.local{font-size:12.8px!important}.global{font-size:8.9px!important}.rp{font-size:11.8px!important}.footer{font-size:8.7px!important;margin-top:6px!important;padding-top:7px!important}</style></head>
<body><div class="shell"><main class="widget" id="widget" data-widget-control-root data-control-sizes="360,390,420"><div id="content" class="loading">프리미엄 데이터를 불러오는 중...</div></main></div>
<script>
const $=s=>document.querySelector(s);
const valid=n=>n!==null&&n!==undefined&&Number.isFinite(Number(n));
const fmtKRW=n=>valid(n)?'₩'+Number(n).toLocaleString('ko-KR'):'—';
const fmtUSD=n=>valid(n)?'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:Number(n)<100?3:2,maximumFractionDigits:Number(n)<100?3:2}):'—';
const pct=n=>valid(n)?`${Number(n)>=0?'+':''}${Number(n).toFixed(2)}%`:'—';
let lastData=null;
function premiumColor(n){if(!valid(n))return'var(--muted)';const v=Number(n);if(v<0)return'var(--blue)';if(v>=5)return'var(--red)';if(v>=2)return'var(--yellow)';return'var(--text)'}
function rel(v){const t=Date.parse(v);if(!Number.isFinite(t))return'시각 미확인';const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?'방금':m<60?`${m}분 전`:m<1440?`${Math.floor(m/60)}시간 전`:`${Math.floor(m/1440)}일 전`}
function stamp(v){return Number.isFinite(Date.parse(v))?new Date(v).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})+' KST':'시각 미확인'}
function render(d,error=false){
 const delayed=error||d.stale||!d.updated_at||Date.now()-Date.parse(d.updated_at)>3*3600000;
 const rows=(d.rows||[]).map(r=>`<div class="row"><div class="symbol">${r.symbol}</div><div><div class="local">${fmtKRW(r.local_krw)}</div><div class="global" title="Coinbase USD · ${stamp(r.global_source_time)}">Coinbase ${fmtUSD(r.global_usd)}</div></div><div class="rp" style="color:${premiumColor(r.premium_pct)}">${pct(r.premium_pct)}</div></div>`).join('');
 $('#content').className='';
 $('#content').innerHTML=`<header class="header"><div><div class="title">비트코인 한국 프리미엄</div><div class="subtitle">업비트·Coinbase 현물 / ECB 일별 기준환율</div></div><button class="refresh" id="refreshBtn" aria-label="새로고침">↻</button></header><section class="hero"><div><div class="eyebrow">${d.premium_label||'BTC 참고 프리미엄'}</div><div class="premium" style="color:${premiumColor(d.premium_pct)}">${pct(d.premium_pct)}</div></div><div class="summary"><strong>${delayed?'갱신 지연 · ':''}${rel(d.updated_at)} 시세</strong>${error?(d.rows?.length?'연결 오류로 마지막 유효값을 표시합니다.':'가격 데이터를 불러오지 못했습니다.'):d.summary||'원본 데이터를 확인하지 못했습니다.'}</div></section><section class="rows">${rows||'<div class="loading">가격 데이터 없음</div>'}</section><footer class="footer"><span>USD/KRW ${fmtKRW(d.usdkrw)}<br>환율 기준 ${d.fx_reference_date||'미확인'}</span><span>${stamp(d.updated_at)}<br>30분 수집 예정 · 지연 가능 <i class="dot" style="background:${delayed?'var(--yellow)':'var(--green)'}"></i></span></footer>`;
 $('#content').title=d.accuracy_note||'환율은 일별 기준값이며 거래소별 시세 시각은 다릅니다.';
 $('#refreshBtn').onclick=()=>load();
}
async function load(){try{const r=await fetch('./bitcoin-korea-premium-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data.rows)||!data.rows.length||!valid(data.premium_pct))throw new Error('Missing premium');lastData=data;render(data)}catch{render(lastData||{rows:[],premium_pct:null,usdkrw:null},true)}}
load();setInterval(load,300000);
</script><script src="./assets/life-town-controls-v2.js"></script></body></html>
