<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Real Estate Pulse</title>
<style>
:root{--bg:#fff;--text:#20201e;--sub:#70706b;--muted:#9a9a94;--line:#e9e9e5;--soft:#f7f7f4;--up:#567a63;--down:#9b6863;--flat:#82827d}
html[data-theme="dark"]{--bg:#191919;--text:#f1f1ee;--sub:#b4b4ae;--muted:#85857f;--line:#30302d;--soft:#232321;--up:#8caf96;--down:#c3928c;--flat:#9a9a95}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent}body{padding:3px;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif}
.widget{width:min(100%,286px);margin:0 auto;border:1px solid var(--line);border-radius:9px;background:var(--bg);overflow:hidden}
.top{padding:11px 11px 9px;border-bottom:1px solid var(--line)}.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.kicker{font-size:6.5px;letter-spacing:.13em;color:var(--muted);font-weight:700;text-transform:uppercase}.title{margin-top:3px;font-size:12px;font-weight:740;letter-spacing:-.025em}.ratebox{text-align:right}.rate-label{font-size:6.5px;color:var(--muted)}.rate{margin-top:2px;font-size:16px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}.rate-note{margin-top:3px;font-size:6.3px;color:var(--muted);white-space:nowrap}
.switch{display:grid;grid-template-columns:1fr 1fr;margin-top:9px;padding:2px;background:var(--soft);border-radius:6px}.switch button{height:25px;border:0;border-radius:5px;background:transparent;color:var(--muted);font:inherit;font-size:8px;cursor:pointer}.switch button.active{background:var(--bg);color:var(--text);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.summary{display:flex;align-items:center;justify-content:space-between;padding:8px 11px 6px;font-size:6.8px;color:var(--muted)}.summary strong{color:var(--sub);font-weight:650}
.grid{display:grid;grid-template-columns:1fr 1fr;padding:0 11px 8px;column-gap:10px}.item{min-width:0;height:31px;display:flex;align-items:center;justify-content:space-between;gap:5px;border-bottom:1px solid var(--line)}.item:nth-last-child(-n+2){border-bottom:0}.name{font-size:8.5px;font-weight:640;white-space:nowrap}.value{font-size:10px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}.value.up{color:var(--up)}.value.down{color:var(--down)}.value.flat{color:var(--flat)}.arrow{font-size:6px;margin-right:2px;vertical-align:1px}
.footer{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 11px;background:var(--soft);border-top:1px solid var(--line);font-size:6.5px;color:var(--muted)}.source{white-space:nowrap}.asof{white-space:nowrap;font-variant-numeric:tabular-nums}.dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--up);margin-right:4px;vertical-align:1px}
@media(max-width:290px){body{padding:2px}.widget{width:100%}.top,.summary,.footer{padding-left:9px;padding-right:9px}.grid{padding-left:9px;padding-right:9px;column-gap:8px}.name{font-size:8px}.value{font-size:9.5px}}
</style>
</head>
<body>
<main class="widget">
  <section class="top">
    <div class="topline">
      <div><div class="kicker">Korea Weekly Apartment</div><div class="title">Real Estate Pulse</div></div>
      <div class="ratebox"><div class="rate-label">기준금리</div><div class="rate" id="baseRate">—</div><div class="rate-note" id="rateNote">BOK</div></div>
    </div>
    <div class="switch" role="tablist" aria-label="가격 유형">
      <button class="active" id="saleBtn" data-mode="sale" type="button">매매</button>
      <button id="leaseBtn" data-mode="lease" type="button">전세</button>
    </div>
  </section>
  <div class="summary"><span id="metricLabel">주간 매매 변동률</span><strong id="regionCount">지역 확인 중</strong></div>
  <section class="grid" id="grid" aria-label="전국 지역별 주간 아파트 가격 변동률"></section>
  <footer class="footer"><div class="source"><span class="dot"></span>REB · BOK</div><div class="asof" id="asOf">기준일 —</div></footer>
</main>
<script>
const q=new URLSearchParams(location.search),forced=q.get('theme'),dark=matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=(forced==='light'||forced==='dark')?forced:(dark?'dark':'light');
let mode='sale',data=null;
const $=s=>document.querySelector(s);
const dateKo=s=>s?String(s).replaceAll('-','.'):'—';
const fmt=v=>`${v>0?'+':''}${Number(v).toFixed(2)}%`;
const cls=v=>v>0?'up':v<0?'down':'flat';
const arrow=v=>v>0?'▲':v<0?'▼':'•';
function render(){if(!data)return;$('#grid').innerHTML=data.regions.map(r=>{const v=r[mode];return `<div class="item"><span class="name">${r.name}</span><span class="value ${cls(v)}"><span class="arrow">${arrow(v)}</span>${fmt(v)}</span></div>`}).join('');$('#metricLabel').textContent=mode==='sale'?'주간 매매 변동률':'주간 전세 변동률';document.querySelectorAll('.switch button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode))}
document.querySelectorAll('.switch button').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;render()}));
async function load(){try{const r=await fetch(`real-estate-pulse-data.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw 0;data=await r.json();$('#baseRate').textContent=`${Number(data.baseRate.value).toFixed(2)}%`;$('#rateNote').textContent=dateKo(data.baseRate.changedAt);$('#asOf').textContent=`${dateKo(data.asOf)} 기준`;$('#regionCount').textContent=data.regions.length===17?'전국 17개 시·도':`검증 데이터 ${data.regions.length}개`;render()}catch(e){$('#regionCount').textContent='데이터 오류';$('#grid').innerHTML='<div class="item" style="grid-column:1/-1"><span class="name">데이터를 불러오지 못했습니다.</span></div>'}}
load();
</script>
</body>
</html>
