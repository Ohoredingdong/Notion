<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Real Estate Pulse</title>
<style>
:root{
  --bg:#ffffff;
  --text:#1f1f1d;
  --sub:#6f706c;
  --muted:#9a9a95;
  --line:#e9e9e5;
  --soft:#f7f7f4;
  --up:#557b64;
  --down:#9a6a64;
  --flat:#7d7d78;
}
html[data-theme="dark"]{
  --bg:#191919;
  --text:#f1f1ee;
  --sub:#b3b3ad;
  --muted:#85857f;
  --line:#30302d;
  --soft:#232321;
  --up:#8fb09a;
  --down:#c59690;
  --flat:#9b9b95;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{padding:8px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;color:var(--text)}
.widget{width:min(100%,620px);margin:0 auto;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:17px 18px 14px;border-bottom:1px solid var(--line)}
.kicker{font-size:8px;letter-spacing:.16em;color:var(--muted);font-weight:700;text-transform:uppercase}.title{margin-top:5px;font-size:15px;line-height:1.15;font-weight:740;letter-spacing:-.025em}.subtitle{margin-top:5px;font-size:9px;color:var(--muted)}
.header-right{text-align:right}.rate-label{font-size:8px;color:var(--muted)}.rate{margin-top:3px;font-size:22px;line-height:1;font-weight:650;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.rate-change{margin-top:4px;font-size:8px;color:var(--sub);font-variant-numeric:tabular-nums}
.table{padding:4px 18px 2px}.row{display:grid;grid-template-columns:88px 1fr 1fr;align-items:center;min-height:58px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.head{min-height:31px;color:var(--muted);font-size:8px}.region{font-size:11px;font-weight:680}.cell{display:flex;flex-direction:column;align-items:flex-start;gap:3px}.value{font-size:17px;line-height:1;font-weight:610;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.delta{font-size:8px;color:var(--muted);font-variant-numeric:tabular-nums}.delta.up{color:var(--up)}.delta.down{color:var(--down)}.delta.flat{color:var(--flat)}
.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 18px;background:var(--soft);border-top:1px solid var(--line);font-size:8px;color:var(--muted)}.source{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asof{font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--up);margin-right:6px;vertical-align:1px}
.skeleton{opacity:.36}
@media(max-width:440px){body{padding:4px}.widget{border-radius:9px}.header{padding:15px 14px 12px}.table{padding:4px 14px 2px}.row{grid-template-columns:68px 1fr 1fr;min-height:55px}.footer{padding:10px 14px}.value{font-size:16px}.rate{font-size:20px}}
</style>
</head>
<body>
<main class="widget" id="widget">
  <header class="header">
    <div>
      <div class="kicker">Weekly Apartment Index</div>
      <div class="title">Real Estate Pulse</div>
      <div class="subtitle">수도권 주간 매매 · 전세 흐름</div>
    </div>
    <div class="header-right">
      <div class="rate-label">한국은행 기준금리</div>
      <div class="rate" id="baseRate">—</div>
      <div class="rate-change" id="rateChange">—</div>
    </div>
  </header>

  <section class="table" aria-label="지역별 주간 아파트 가격 변동률">
    <div class="row head">
      <div>지역</div><div>매매</div><div>전세</div>
    </div>
    <div id="rows" class="skeleton">
      <div class="row"><div class="region">서울</div><div class="cell"><div class="value">+0.00%</div><div class="delta">—</div></div><div class="cell"><div class="value">+0.00%</div><div class="delta">—</div></div></div>
      <div class="row"><div class="region">경기</div><div class="cell"><div class="value">+0.00%</div><div class="delta">—</div></div><div class="cell"><div class="value">+0.00%</div><div class="delta">—</div></div></div>
      <div class="row"><div class="region">인천</div><div class="cell"><div class="value">+0.00%</div><div class="delta">—</div></div><div class="cell"><div class="value">+0.00%</div><div class="delta">—</div></div></div>
    </div>
  </section>

  <footer class="footer">
    <div class="source"><span class="dot"></span>REB · BOK</div>
    <div class="asof" id="asOf">기준일 —</div>
  </footer>
</main>
<script>
const qs=new URLSearchParams(location.search);
const forced=qs.get('theme');
const dark=matchMedia('(prefers-color-scheme:dark)').matches;
document.documentElement.dataset.theme=(forced==='light'||forced==='dark')?forced:(dark?'dark':'light');

const fmt=v=>`${v>0?'+':''}${Number(v).toFixed(2)}%`;
const pp=(now,prev)=>Number((now-prev).toFixed(2));
const deltaText=(now,prev)=>{
  const d=pp(now,prev);
  if(d===0) return {text:'전주와 동일',cls:'flat'};
  return {text:`전주 대비 ${d>0?'+':''}${d.toFixed(2)}%p`,cls:d>0?'up':'down'};
};
const dateKo=s=>{
  const d=new Date(`${s}T00:00:00+09:00`);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
};

async function load(){
  try{
    const res=await fetch(`real-estate-pulse-data.json?v=${Date.now()}`,{cache:'no-store'});
    if(!res.ok) throw new Error('data');
    const data=await res.json();
    document.querySelector('#baseRate').textContent=`${data.baseRate.value.toFixed(2)}%`;
    const rateDiff=Number((data.baseRate.value-data.baseRate.previous).toFixed(2));
    document.querySelector('#rateChange').textContent=`${rateDiff>0?'↑':rateDiff<0?'↓':'→'} ${Math.abs(rateDiff).toFixed(2)}%p · ${dateKo(data.baseRate.changedAt)}`;
    document.querySelector('#rows').innerHTML=data.regions.map(r=>{
      const s=deltaText(r.sale,r.salePrev), l=deltaText(r.lease,r.leasePrev);
      return `<div class="row"><div class="region">${r.name}</div><div class="cell"><div class="value">${fmt(r.sale)}</div><div class="delta ${s.cls}">${s.text}</div></div><div class="cell"><div class="value">${fmt(r.lease)}</div><div class="delta ${l.cls}">${l.text}</div></div></div>`;
    }).join('');
    document.querySelector('#rows').classList.remove('skeleton');
    document.querySelector('#asOf').textContent=`기준일 ${dateKo(data.asOf)}`;
  }catch(e){
    document.querySelector('#rows').classList.remove('skeleton');
    document.querySelector('#rows').innerHTML='<div class="row"><div class="region">데이터</div><div class="cell" style="grid-column:2 / 4"><div class="delta">불러오지 못했습니다.</div></div></div>';
  }
}
load();
</script>
</body>
</html>
