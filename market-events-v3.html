<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>마켓 이벤트 · Life Town</title>
<style>
:root{
  --bg:#fff;--panel:#fff;--soft:#f8f9fb;--line:#e6e9ee;--line2:#eef1f4;
  --text:#111827;--sub:#5f6b7a;--muted:#8792a2;
  --blue:#2f80ed;--blue-soft:#eef6ff;--blue-line:#d6e8fb;
  --green:#28b77a;--green-soft:#eaf8f2;
  --yellow:#e5b126;--yellow-soft:#fff7d8;
  --pink:#ef5f8a;--pink-soft:#fdebf1;
  --red:#ea4d67;--red-soft:#fdecef
}
html[data-theme="dark"]{
  --bg:#111214;--panel:#1b1c1f;--soft:#22252a;--line:#343840;--line2:#2b2f35;
  --text:#f5f7fa;--sub:#c4cad3;--muted:#8d96a4;
  --blue:#63a8ff;--blue-soft:#18283a;--blue-line:#27496c;
  --green:#45d49a;--green-soft:#173128;
  --yellow:#ffd154;--yellow-soft:#3a3218;
  --pink:#ff7ea4;--pink-soft:#3b202a;
  --red:#ff6b81;--red-soft:#3b2026
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{padding:8px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}.root{position:relative;width:100%;max-width:760px;margin:auto;container-type:inline-size}
.widget{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:none;overflow:hidden}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;gap:14px}
.header-left{display:flex;align-items:center;gap:12px;min-width:0}
.app-icon{width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:var(--blue-soft);display:grid;place-items:center;color:var(--blue)}
.app-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.title{font-size:20px;line-height:1.04;font-weight:790;letter-spacing:-.045em}.subtitle{margin-top:4px;font-size:9.8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto}.updated{height:31px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:var(--soft);display:inline-flex;align-items:center;gap:6px;font-size:8.7px;font-weight:650;color:var(--sub);white-space:nowrap}.updated i{width:6px;height:6px;border-radius:50%;background:var(--green)}.updated.stale i{background:var(--yellow)}.updated.error i{background:var(--red)}
.refresh{width:33px;height:33px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--sub)}.refresh:hover{background:var(--soft)}.refresh svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Featured */
.feature{margin-top:14px;padding:15px;border:1px solid var(--blue-line);border-radius:18px;background:var(--blue-soft)}
.feature-grid{display:grid;grid-template-columns:88px minmax(0,1fr) 260px;gap:16px;align-items:stretch}
.date-card{border:1px solid var(--line);border-radius:14px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:112px}.date-month{font-size:11px;font-weight:720;color:var(--sub)}.date-day{margin-top:4px;font-size:31px;line-height:1;font-weight:800;letter-spacing:-.055em}.today-pill{margin-top:10px;height:23px;padding:0 9px;border-radius:999px;background:#e6f1ff;color:var(--blue);display:inline-flex;align-items:center;font-size:8.7px;font-weight:720}
.feature-copy{min-width:0;display:flex;flex-direction:column;justify-content:center}.feature-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.feature-title{font-size:18px;font-weight:790;letter-spacing:-.035em;line-height:1.2}.importance{height:24px;padding:0 8px;border-radius:7px;background:var(--red-soft);color:var(--red);display:inline-flex;align-items:center;gap:5px;font-size:8px;font-weight:730}.bars{display:inline-flex;align-items:flex-end;gap:2px}.bars i{display:block;width:3px;border-radius:2px;background:currentColor}.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:11px}.feature-meta{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:9.5px;color:var(--sub);flex-wrap:wrap}.feature-meta .sep{width:1px;height:11px;background:var(--line)}.feature-desc{margin-top:10px;font-size:9.5px;line-height:1.5;color:var(--sub);word-break:keep-all}
.feature-values{display:grid;grid-template-columns:repeat(3,1fr);border-left:1px solid var(--blue-line)}.value-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 9px;min-width:0}.value-box+.value-box{border-left:1px solid var(--blue-line)}.value-label{font-size:8.8px;color:var(--muted);font-weight:650}.value-main{margin-top:9px;font-size:17px;font-weight:790;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.value-sub{margin-top:5px;font-size:8px;color:var(--muted)}

/* Category cards */
.categories{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}.cat{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:11px 12px;min-width:0}.cat-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.cat-name-wrap{display:flex;align-items:center;gap:8px;min-width:0}.cat-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}.cat-name{font-size:10px;font-weight:740}.cat-count{font-size:10px;font-weight:720;color:var(--sub)}.cat-sub{margin-top:6px;padding-left:17px;font-size:8.2px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Schedule blocks */
.section{margin-top:10px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}.section-head{height:37px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line2);background:linear-gradient(#fff,#fcfcfd)}html[data-theme="dark"] .section-head{background:var(--panel)}.section-title-wrap{display:flex;align-items:center;gap:8px}.section-title{font-size:11.5px;font-weight:790}.section-count{font-size:9px;color:var(--sub)}.section-range{font-size:8.6px;color:var(--muted)}
.event{display:grid;grid-template-columns:74px 72px minmax(150px,1fr) 54px 235px 14px;align-items:center;gap:8px;min-height:38px;padding:0 11px;border-bottom:1px solid var(--line2);cursor:pointer;transition:.12s ease}.event:last-child{border-bottom:0}.event:hover{background:var(--soft)}.event.selected{background:var(--blue-soft)}.event[hidden]{display:none!important}
.when{font-size:9.4px;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}.country{display:flex;align-items:center;gap:5px;font-size:9.3px;color:var(--sub);white-space:nowrap}.event-title{min-width:0;font-size:9.7px;font-weight:690;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.type-pill{justify-self:start;height:20px;padding:0 7px;border-radius:7px;display:inline-flex;align-items:center;font-size:7.9px;font-weight:720;white-space:nowrap}.metrics{display:flex;align-items:center;justify-content:flex-end;gap:9px;font-size:8.7px;color:var(--sub);white-space:nowrap;min-width:0}.metrics .divider{color:#c7ccd4}.metrics b{font-weight:690;color:var(--text)}.chev{font-size:15px;line-height:1;color:var(--muted);text-align:right}.more{width:100%;height:29px;border:0;border-top:1px solid var(--line2);background:transparent;color:var(--sub);font-size:8.5px;font-weight:650;cursor:pointer}.more:hover{background:var(--soft)}.more[hidden]{display:none}.empty{padding:18px;text-align:center;font-size:8.8px;color:var(--muted)}
.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:8px 1px 0;border-top:1px solid var(--line2);font-size:8px;color:var(--muted)}.footer-left{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.retry{height:24px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:8.2px;color:var(--sub);cursor:pointer}.loading{padding:56px 10px;text-align:center;font-size:9px;color:var(--muted)}

/* controls */
.control-rail{position:absolute;top:10px;right:-32px;z-index:20;width:30px;display:flex;flex-direction:column;gap:7px;opacity:0;transform:translateX(-3px);transition:.14s ease}.root:hover .control-rail,.control-rail:hover{opacity:1;transform:none}.control-btn{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:var(--panel);display:grid;place-items:center;color:var(--sub);cursor:pointer;box-shadow:none}.control-btn:hover,.control-btn.active{background:var(--soft);color:var(--text)}.control-btn:disabled{opacity:.35}.control-btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}

@container(max-width:700px){.widget{padding:16px 14px}.feature-grid{grid-template-columns:76px minmax(0,1fr)}.date-card{min-height:104px}.feature-values{grid-column:1/-1;border-left:0;border-top:1px solid var(--blue-line);padding-top:11px}.event{grid-template-columns:64px 62px minmax(120px,1fr) 50px 190px 12px}.metrics{gap:7px;font-size:8.2px}.categories{gap:6px}.cat{padding:10px}}
@container(max-width:560px){.updated{display:none}.app-icon{width:38px;height:38px;flex-basis:38px}.title{font-size:18px}.subtitle{font-size:8.8px}.feature{padding:12px}.feature-grid{grid-template-columns:66px minmax(0,1fr);gap:12px}.date-card{min-height:92px}.date-day{font-size:26px}.feature-title{font-size:15px}.categories{grid-template-columns:repeat(2,1fr)}.event{grid-template-columns:56px minmax(0,1fr) 44px 12px}.country{display:none}.metrics{display:none}.event-title{font-size:9.2px}.section-range{display:none}.control-rail{right:-29px}}
@media(hover:none){.control-rail{opacity:.9;transform:none}}
</style>
</head>
<body>
<div class="root" id="root">
<main class="widget">
<header class="header">
  <div class="header-left">
    <div class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3.5v4M16 3.5v4M4 9h16"/><path d="M8 13h3M8 16h7"/></svg></div>
    <div><div class="title">마켓 이벤트</div><div class="subtitle">한국·미국 주요 경제 일정을 한눈에</div></div>
  </div>
  <div class="header-actions"><div class="updated" id="updated"><i></i><span>불러오는 중</span></div><button class="refresh" id="refresh" aria-label="새로고침"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5"/><path d="M18.5 9A7 7 0 1 0 19 15"/></svg></button></div>
</header>
<div id="content"><div class="loading">경제 일정을 불러오는 중...</div></div>
<footer class="footer"><div class="footer-left" id="source">모든 시간은 한국 시간(KST) 기준입니다.</div><button class="retry" id="retry" hidden>다시 불러오기</button></footer>
</main>
<div class="control-rail" aria-label="위젯 설정">
  <button class="control-btn" id="sizeBtn" aria-label="크기 변경"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/><path d="M3 8l5-5M21 8l-5-5M3 16l5 5M21 16l-5 5"/></svg></button>
  <button class="control-btn" id="themeBtn" aria-label="다크 모드"><svg id="themeIcon" viewBox="0 0 24 24"><path d="M20.5 15.2A8 8 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg></button>
  <button class="control-btn" id="lockBtn" aria-label="크기 잠금"><svg id="lockIcon" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/></svg></button>
  <button class="control-btn" id="resetBtn" aria-label="UI 초기화"><svg viewBox="0 0 24 24"><path d="M4 8V4h4"/><path d="M5.5 5.5A8 8 0 1 1 4.2 14"/></svg></button>
</div>
</div>
<script>
const $=s=>document.querySelector(s),root=$('#root'),content=$('#content'),updated=$('#updated'),source=$('#source'),retry=$('#retry');
const flags={US:'🇺🇸',KR:'🇰🇷',JP:'🇯🇵',GB:'🇬🇧',DE:'🇩🇪',FR:'🇫🇷',CN:'🇨🇳',EU:'🇪🇺'};
const countryNames={US:'미국',KR:'한국',JP:'일본',GB:'영국',DE:'독일',FR:'프랑스',CN:'중국',EU:'유로존'};
const cats={rate:{label:'금리',color:'var(--blue)',soft:'var(--blue-soft)',sub:'기준금리, 통화정책 등'},inflation:{label:'물가',color:'var(--green)',soft:'var(--green-soft)',sub:'CPI, PPI, 물가 지표 등'},jobs:{label:'고용',color:'var(--yellow)',soft:'var(--yellow-soft)',sub:'고용지표, 실업률 등'},growth:{label:'경기',color:'var(--pink)',soft:'var(--pink-soft)',sub:'GDP, PMI, 경기지표 등'},other:{label:'기타',color:'var(--muted)',soft:'var(--soft)',sub:'기타 경제 일정'}};
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function rel(iso){const d=new Date(iso);if(isNaN(d))return null;const m=Math.max(0,Math.round((Date.now()-d.getTime())/60000));if(m<1)return'방금 전';if(m<60)return`${m}분 전`;const h=Math.floor(m/60);if(h<24)return`${h}시간 전`;return`${Math.floor(h/24)}일 전`}
function val(v){return v===null||v===undefined||v===''?'—':esc(v)}
function shortDate(s=''){return String(s).replace(/\s*\([^)]*\)\s*$/,'')||'—'}
function dateBits(s=''){const m=String(s).match(/(\d+)월\s*(\d+)일/);return m?{month:`${m[1]}월`,day:m[2]}:{month:'',day:'—'}}
function metricInline(e){const a=[];if(e.actual!==null&&e.actual!==undefined)a.push(`<span>실제 <b>${val(e.actual)}</b></span>`);if(e.forecast!==null&&e.forecast!==undefined)a.push(`<span>예상 <b>${val(e.forecast)}</b></span>`);if(e.previous!==null&&e.previous!==undefined)a.push(`<span>이전 <b>${val(e.previous)}</b></span>`);return a.length?a.join('<span class="divider">|</span>'):'<span>세부 값 없음</span>'}
let dataCache=null,selectedId=null;
function featureHtml(e){const d=dateBits(e.date_kst),country=countryNames[e.country]||e.country||'',imp=Number(e.importance)||1;return `<section class="feature"><div class="feature-grid"><div class="date-card"><div class="date-month">${esc(d.month)}</div><div class="date-day">${esc(d.day)}</div><div class="today-pill">${e.bucket==='today'?'오늘':'예정'}</div></div><div class="feature-copy"><div class="feature-title-row"><div class="feature-title">${esc(country?country+' '+(e.title_ko||e.title||'주요 이벤트'):(e.title_ko||e.title||'주요 이벤트'))}</div>${imp>=3?'<span class="importance"><span class="bars"><i></i><i></i><i></i></span>매우 중요</span>':''}</div><div class="feature-meta"><span>${flags[e.country]||''} ${esc(country)}</span><span class="sep"></span><span>${esc(e.bucket==='today'?'오늘 ':shortDate(e.date_kst)+' ')}${esc(e.time_kst||'—')}</span></div><div class="feature-desc">${esc(e.comment_ko||'금융시장에 영향을 줄 수 있는 주요 경제 일정입니다.')}</div></div><div class="feature-values"><div class="value-box"><div class="value-label">실제</div><div class="value-main">${val(e.actual)}</div><div class="value-sub">${e.actual==null?'발표 전':'Actual'}</div></div><div class="value-box"><div class="value-label">예상</div><div class="value-main">${val(e.forecast)}</div><div class="value-sub">Forecast</div></div><div class="value-box"><div class="value-label">이전</div><div class="value-main">${val(e.previous)}</div><div class="value-sub">Previous</div></div></div></div></section>`}
function categoryHtml(events){return ['rate','inflation','jobs','growth'].map(k=>{const c=cats[k],n=events.filter(e=>e.category===k).length;return `<div class="cat"><div class="cat-top"><div class="cat-name-wrap"><i class="cat-dot" style="background:${c.color}"></i><div class="cat-name">${c.label}</div></div><div class="cat-count">${n}건</div></div><div class="cat-sub">${c.sub}</div></div>`}).join('')}
function rowHtml(e,bucket,hidden=false){const c=cats[e.category]||cats.other,when=bucket==='today'?esc(e.time_kst||'—'):`${esc(shortDate(e.date_kst))} ${esc(e.time_kst||'—')}`;return `<div class="event ${String(e.id)===String(selectedId)?'selected':''}" data-id="${esc(e.id)}" ${hidden?'hidden':''}><div class="when">${when}</div><div class="country"><span>${flags[e.country]||''}</span><span>${esc(countryNames[e.country]||e.country||'')}</span></div><div class="event-title">${esc(e.title_ko||e.title||'')}</div><span class="type-pill" style="color:${c.color};background:${c.soft}">${c.label}</span><div class="metrics">${metricInline(e)}</div><div class="chev">›</div></div>`}
function sectionHtml(title,bucket,items,note){const first=items.slice(0,4),rest=items.slice(4);return `<section class="section"><div class="section-head"><div class="section-title-wrap"><div class="section-title">${title}</div><div class="section-count">${items.length}건</div></div><div class="section-range">${esc(note||'')}</div></div><div>${items.length?first.map(e=>rowHtml(e,bucket)).join('')+rest.map(e=>rowHtml(e,bucket,true)).join(''):'<div class="empty">예정 이벤트 없음</div>'}</div><button class="more" ${rest.length?'':'hidden'}>더 보기</button></section>`}
function bindRows(events){document.querySelectorAll('.event').forEach(row=>row.onclick=()=>{selectedId=row.dataset.id;const e=events.find(x=>String(x.id)===String(selectedId));if(!e)return;document.querySelectorAll('.event').forEach(x=>x.classList.toggle('selected',x.dataset.id===selectedId));const old=document.querySelector('.feature');if(old)old.outerHTML=featureHtml(e)}) ;document.querySelectorAll('.more').forEach(btn=>btn.onclick=ev=>{ev.stopPropagation();const sec=btn.closest('.section'),hidden=[...sec.querySelectorAll('.event[hidden]')],expanded=hidden.length>0;if(expanded){hidden.forEach(x=>x.hidden=false);btn.textContent='접기'}else{[...sec.querySelectorAll('.event')].slice(4).forEach(x=>x.hidden=true);btn.textContent='더 보기'}})}
function render(d){dataCache=d;const events=Array.isArray(d.events)?d.events:[],h=d.highlight||events[0];if(!h){renderError('표시할 경제 일정이 없습니다.');return}selectedId=h.id;const today=events.filter(e=>e.bucket==='today'),week=events.filter(e=>e.bucket==='week'),later=events.filter(e=>e.bucket==='later');content.innerHTML=featureHtml(h)+`<section class="categories">${categoryHtml(events)}</section>`+sectionHtml('오늘','today',today,h.date_kst||'')+sectionHtml('이번 주','week',week,'이번 주 예정')+sectionHtml('이후','later',later,'향후 일정');bindRows(events);updated.className='updated'+(d.stale?' stale':'');updated.querySelector('span').textContent=d.stale?'업데이트 지연':`최근 업데이트 ${rel(d.generated_at)||d.updated_label||'완료'}`;source.textContent=`${d.source||'경제 캘린더'} · 모든 시간 KST`;retry.hidden=!d.stale}
function renderError(msg){content.innerHTML=`<div class="loading">${esc(msg)}</div>`;updated.className='updated error';updated.querySelector('span').textContent='불러오기 실패';retry.hidden=false}
async function load(){updated.className='updated';updated.querySelector('span').textContent='불러오는 중';retry.hidden=true;try{const r=await fetch('./market-events-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();render(await r.json())}catch{renderError('경제 일정을 불러오지 못했습니다.')}}
$('#refresh').onclick=load;retry.onclick=load;load();
const KEY='lifetown-market-events-v3-ui',sizes=[600,680,760];let ui={sizeIndex:2,theme:'light',locked:false};try{ui={...ui,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{};if(!Number.isInteger(ui.sizeIndex)||ui.sizeIndex<0||ui.sizeIndex>2)ui.sizeIndex=2;if(!['light','dark'].includes(ui.theme))ui.theme='light';const sizeBtn=$('#sizeBtn'),themeBtn=$('#themeBtn'),lockBtn=$('#lockBtn'),themeIcon=$('#themeIcon'),lockIcon=$('#lockIcon');function saveUI(){localStorage.setItem(KEY,JSON.stringify(ui))}function applyUI(){root.style.maxWidth=sizes[ui.sizeIndex]+'px';document.documentElement.dataset.theme=ui.theme;sizeBtn.disabled=ui.locked;lockBtn.classList.toggle('active',ui.locked);themeBtn.classList.toggle('active',ui.theme==='dark');themeIcon.innerHTML=ui.theme==='dark'?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>':'<path d="M20.5 15.2A8 8 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/>';lockIcon.innerHTML=ui.locked?'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/>':'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/>'}sizeBtn.onclick=()=>{if(ui.locked)return;ui.sizeIndex=(ui.sizeIndex+1)%sizes.length;saveUI();applyUI()};themeBtn.onclick=()=>{ui.theme=ui.theme==='dark'?'light':'dark';saveUI();applyUI()};lockBtn.onclick=()=>{ui.locked=!ui.locked;saveUI();applyUI()};$('#resetBtn').onclick=()=>{ui={sizeIndex:2,theme:'light',locked:false};localStorage.removeItem(KEY);applyUI()};applyUI();
</script>
