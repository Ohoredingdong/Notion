<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>마켓 이벤트 · Life Town</title>
<style>
:root{
  --panel:#fff;--soft:#f7f7f8;--soft2:#fbfbfc;--line:#e7e7ea;--line2:#f0f0f2;
  --text:#111113;--sub:#6e6e73;--muted:#9a9aa0;
  --blue:#007aff;--green:#248a3d;--red:#d92d27;--yellow:#9a7200;
  --blue-soft:rgba(0,122,255,.075);--green-soft:rgba(52,199,89,.085);--red-soft:rgba(255,59,48,.075);--yellow-soft:rgba(255,204,0,.11)
}
html[data-theme="dark"]{
  --panel:#1c1c1e;--soft:#2c2c2e;--soft2:#242426;--line:#38383a;--line2:#2f3033;
  --text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;
  --blue:#0a84ff;--green:#30d158;--red:#ff453a;--yellow:#ffd60a;
  --blue-soft:rgba(10,132,255,.13);--green-soft:rgba(48,209,88,.12);--red-soft:rgba(255,69,58,.12);--yellow-soft:rgba(255,214,10,.12)
}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}button{font:inherit;color:inherit}.root{width:100%;max-width:720px;margin:auto;position:relative;container-type:inline-size}.widget{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 17px 13px;box-shadow:none;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.head-left{display:flex;align-items:center;gap:11px;min-width:0}.app-icon{width:42px;height:42px;flex:0 0 42px;border:1px solid var(--line);border-radius:13px;display:grid;place-items:center;background:var(--panel);color:var(--blue)}.app-icon svg{width:21px;height:21px}.head-copy{min-width:0}.title{font-size:20px;line-height:1.03;font-weight:790;letter-spacing:-.045em}.subtitle{margin-top:5px;font-size:10px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto}.updated{height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:8.8px;font-weight:650;color:var(--sub);white-space:nowrap}.updated i{width:6px;height:6px;border-radius:50%;background:var(--green)}.updated.stale i{background:var(--yellow)}.updated.error i{background:var(--red)}.refresh{width:32px;height:32px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--sub)}.refresh:hover{background:var(--soft)}.refresh svg{width:14px;height:14px}.section-rule{height:1px;background:var(--line2);margin:15px 0 13px}
.upcoming{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:14px;align-items:stretch}.up-main{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:11px;align-items:center;min-width:0}.up-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}.up-icon svg{width:23px;height:23px}.up-copy{min-width:0}.eyebrow{display:flex;align-items:center;gap:5px;font-size:8.6px;font-weight:700;color:var(--muted);margin-bottom:4px}.eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--red)}.up-title{font-size:15.5px;line-height:1.25;font-weight:780;letter-spacing:-.03em;word-break:keep-all}.up-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:8.8px;color:var(--sub)}.up-meta span{white-space:nowrap}.impact{align-self:start;display:flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:999px;font-size:8px;font-weight:720}.impact.high{background:var(--red-soft);color:var(--red)}.impact.medium{background:var(--yellow-soft);color:var(--yellow)}.impact.low{background:var(--soft);color:var(--sub)}.facts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--panel)}.fact{min-width:0;padding:10px 9px}.fact+.fact{border-left:1px solid var(--line2)}.fact-label{font-size:7.8px;color:var(--muted);font-weight:650}.fact-value{margin-top:5px;font-size:12px;font-weight:740;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fact-value.na{color:var(--muted);font-weight:650}.up-desc{grid-column:1/-1;margin-top:2px;font-size:9.1px;line-height:1.5;color:var(--sub);word-break:keep-all}.category-strip{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px}.cat{height:25px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:8.5px;color:var(--sub)}.cat i{width:6px;height:6px;border-radius:50%}.cat b{font-size:9px;color:var(--text)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:11px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}.col{min-width:0;padding:0 11px 8px}.col+.col{border-left:1px solid var(--line2)}.col-head{height:39px;display:flex;align-items:center;justify-content:space-between;gap:7px;border-bottom:1px solid var(--line2)}.col-title-wrap{display:flex;align-items:center;gap:6px}.col-title{font-size:11.2px;font-weight:760}.col-dot{width:5px;height:5px;border-radius:50%;background:var(--blue)}.col-count{font-size:8.3px;color:var(--muted)}.event{display:grid;grid-template-columns:41px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid var(--line2)}.event:last-child{border-bottom:0}.event[hidden]{display:none!important}.time{padding-top:1px;font-size:8.8px;line-height:1.35;color:var(--muted);font-weight:680;font-variant-numeric:tabular-nums;white-space:pre-line}.event-main{min-width:0}.event-title-row{display:flex;align-items:flex-start;gap:5px;min-width:0}.event-dot{width:6px;height:6px;flex:0 0 6px;border-radius:50%;margin-top:4px}.event-title{font-size:9.7px;line-height:1.35;font-weight:690;word-break:keep-all}.country{font-weight:760;margin-right:3px}.event-info{margin-top:3px;font-size:8.2px;line-height:1.25;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-important{margin-top:4px;font-size:7.7px;font-weight:720;color:var(--red)}.more{width:100%;height:28px;margin-top:5px;border:0;border-top:1px solid var(--line2);background:transparent;color:var(--sub);font-size:8.5px;font-weight:650;cursor:pointer}.more[hidden]{display:none}.empty{padding:22px 0 14px;text-align:center;font-size:8.7px;color:var(--muted)}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:9px 1px 0;border-top:1px solid var(--line2);font-size:8.2px;color:var(--muted)}.footer-left{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.retry{height:24px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:8.4px;color:var(--sub);cursor:pointer}.loading{padding:58px 10px;text-align:center;color:var(--muted);font-size:9.3px}.load-state{display:flex;align-items:center;justify-content:center;gap:7px}.load-state i{width:6px;height:6px;border-radius:50%;background:var(--blue)}
.control-rail{position:absolute;top:10px;right:-32px;z-index:30;width:30px;display:flex;flex-direction:column;gap:7px;opacity:0;transform:translateX(-3px);transition:.14s ease}.root:hover .control-rail,.control-rail:hover{opacity:1;transform:none}.control-btn{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:var(--panel);display:grid;place-items:center;color:var(--sub);cursor:pointer}.control-btn:hover,.control-btn.active{background:var(--soft);color:var(--text)}.control-btn:disabled{opacity:.35;cursor:not-allowed}.control-btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
@container(max-width:610px){.widget{padding:15px 12px 11px}.app-icon{width:38px;height:38px;flex-basis:38px}.title{font-size:18px}.updated{display:none}.upcoming{grid-template-columns:1fr}.facts{grid-row:2}.up-main{grid-template-columns:44px minmax(0,1fr) auto}.up-icon{width:44px;height:44px}.board{display:flex;overflow-x:auto;scroll-snap-type:x proximity}.board::-webkit-scrollbar{height:4px}.board::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}.col{flex:0 0 196px;scroll-snap-align:start}.col+.col{border-left:1px solid var(--line2)}}
@container(max-width:430px){.head-left{gap:9px}.app-icon{width:34px;height:34px;flex-basis:34px;border-radius:11px}.app-icon svg{width:18px;height:18px}.title{font-size:16.5px}.subtitle{font-size:8.7px}.refresh{width:30px;height:30px}.up-main{grid-template-columns:38px minmax(0,1fr)}.up-icon{width:38px;height:38px;border-radius:11px}.up-icon svg{width:19px;height:19px}.impact{grid-column:2;justify-self:start}.up-title{font-size:13.5px}.facts{border-radius:11px}.fact{padding:9px 7px}.fact-value{font-size:11px}.category-strip{gap:5px}.cat{height:23px;padding:0 7px}.control-rail{right:-29px}}
@media(hover:none){.control-rail{opacity:.92;transform:none}}
</style>
</head>
<body>
<div class="root" id="root">
<main class="widget">
<header class="top">
  <div class="head-left">
    <div class="app-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M8 3.5v4M16 3.5v4M4 9h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M8 13h3M8 16h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></div>
    <div class="head-copy"><div class="title">마켓 이벤트</div><div class="subtitle">주요 경제 일정을 한국 시간 기준으로 확인합니다.</div></div>
  </div>
  <div class="head-actions"><div class="updated" id="updated"><i></i><span>불러오는 중</span></div><button class="refresh" id="refresh" aria-label="새로고침"><svg viewBox="0 0 24 24" fill="none"><path d="M20 7v5h-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 9A7 7 0 1 0 19 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div>
</header>
<div class="section-rule"></div>
<div id="content"><div class="loading"><div class="load-state"><i></i><span>경제 일정을 불러오는 중...</span></div></div></div>
<footer class="footer"><div class="footer-left" id="source">모든 시간은 한국 시간(KST) 기준입니다.</div><button class="retry" id="retry" hidden>다시 불러오기</button></footer>
</main>
<div class="control-rail" aria-label="위젯 설정">
  <button class="control-btn" id="sizeBtn" aria-label="크기 변경"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/><path d="M3 8l5-5M21 8l-5-5M3 16l5 5M21 16l-5 5"/></svg></button>
  <button class="control-btn" id="themeBtn" aria-label="다크 모드"><svg id="themeIcon" viewBox="0 0 24 24"><path d="M20.5 15.2A8 8 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg></button>
  <button class="control-btn" id="lockBtn" aria-label="크기 잠금"><svg id="lockIcon" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/></svg></button>
  <button class="control-btn" id="resetBtn" aria-label="UI 초기화"><svg viewBox="0 0 24 24"><path d="M4 8V4h4"/><path d="M5.5 5.5A8 8 0 1 1 4.2 14"/></svg></button>
</div>
</div>
<script>
const $=s=>document.querySelector(s),root=$('#root'),content=$('#content'),updated=$('#updated'),source=$('#source'),retry=$('#retry');
const icons={rate:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 10h16M6 10v8m4-8v8m4-8v8m4-8v8M3 20h18M4 8l8-4 8 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',inflation:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 18V6M4 18h16M7 14l3-4 4 3 3-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',jobs:'<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="9" r="3" stroke="currentColor" stroke-width="1.7"/><circle cx="17" cy="10" r="2.4" stroke="currentColor" stroke-width="1.7"/><path d="M4 18c0-2.4 2.2-4 5-4s5 1.6 5 4M15 17c.5-1.5 2-2.6 4-2.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',growth:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 19V6M5 19h14M8 14l3-4 3 2 3-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',other:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.7"/><path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>'};
const flags={US:'🇺🇸',KR:'🇰🇷',JP:'🇯🇵',GB:'🇬🇧',DE:'🇩🇪',FR:'🇫🇷',CN:'🇨🇳',EU:'🇪🇺'},countryNames={US:'미국',KR:'한국',JP:'일본',GB:'영국',DE:'독일',FR:'프랑스',CN:'중국',EU:'유로존'};
const category={rate:{label:'금리',tone:'red'},inflation:{label:'물가',tone:'yellow'},jobs:{label:'고용',tone:'green'},growth:{label:'경기',tone:'blue'},other:{label:'기타',tone:'blue'}},toneVar={red:'var(--red)',yellow:'var(--yellow)',green:'var(--green)',blue:'var(--blue)'};
const summaryCats=[['rate','금리'],['inflation','물가'],['jobs','고용'],['growth','경기']];
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function rel(iso){const d=new Date(iso);if(isNaN(d))return null;const m=Math.max(0,Math.round((Date.now()-d.getTime())/60000));if(m<1)return'방금 전';if(m<60)return`${m}분 전`;const h=Math.floor(m/60);if(h<24)return`${h}시간 전`;return`${Math.floor(h/24)}일 전`}
function value(v){return v===null||v===undefined||v===''?'—':esc(v)}
function eventInfo(e){const a=[];if(e.actual!==null&&e.actual!==undefined)a.push(`실제 ${esc(e.actual)}`);if(e.forecast!==null&&e.forecast!==undefined)a.push(`예상 ${esc(e.forecast)}`);if(!a.length&&e.previous!==null&&e.previous!==undefined)a.push(`이전 ${esc(e.previous)}`);return a.join(' · ')||'세부 값 없음'}
function impactClass(n){return n>=3?'high':n===2?'medium':'low'}function impactLabel(n){return n>=3?'높은 영향도':n===2?'중간 영향도':'낮은 영향도'}
function eventHtml(e,hidden=false){const c=category[e.category]||category.other,t=toneVar[c.tone];return `<div class="event" ${hidden?'hidden':''}><div class="time">${esc(e.time_kst||'—')}</div><div class="event-main"><div class="event-title-row"><i class="event-dot" style="background:${t}"></i><div class="event-title"><span class="country">${flags[e.country]||''} ${esc(countryNames[e.country]||e.country||'')}</span>${esc(e.title_ko||e.title||'')}</div></div><div class="event-info">${eventInfo(e)}</div>${Number(e.importance)>=3?'<div class="event-important">높은 영향도</div>':''}</div></div>`}
function renderColumn(title,items){const first=items.slice(0,4),rest=items.slice(4);return `<section class="col"><div class="col-head"><div class="col-title-wrap"><i class="col-dot"></i><div class="col-title">${title}</div></div><div class="col-count">${items.length}</div></div><div class="list">${first.map(x=>eventHtml(x)).join('')}${rest.map(x=>eventHtml(x,true)).join('')||(!items.length?'<div class="empty">예정 이벤트 없음</div>':'')}</div><button class="more" ${rest.length?'':'hidden'}>더 보기</button></section>`}
function render(d){const events=Array.isArray(d.events)?d.events:[],h=d.highlight||events[0];if(!h){renderError('표시할 경제 일정이 없습니다.');return}const hc=category[h.category]||category.other,heroCountry=countryNames[h.country]||h.country||'',importance=Number(h.importance)||1;const cats=summaryCats.map(([k,label])=>{const arr=events.filter(e=>e.category===k),tone=category[k]?.tone||'blue';return `<span class="cat"><i style="background:${toneVar[tone]}"></i><span>${label}</span><b>${arr.length}</b></span>`}).join('');content.innerHTML=`<section class="upcoming"><div class="up-main"><div class="up-icon">${icons[h.category]||icons.other}</div><div class="up-copy"><div class="eyebrow"><i></i><span>다음 주요 일정</span></div><div class="up-title">${esc(heroCountry?heroCountry+' '+(h.title_ko||h.title||'주요 이벤트'):(h.title_ko||h.title||'주요 이벤트'))}</div><div class="up-meta"><span>${flags[h.country]||''} ${esc(heroCountry)}</span><span>${esc(h.date_kst||'—')}</span><span>${esc(h.time_kst||'—')}</span></div></div><span class="impact ${impactClass(importance)}">${impactLabel(importance)}</span><div class="up-desc">${esc(h.comment_ko||'시장에 영향을 줄 수 있는 주요 경제 일정입니다.')}</div></div><div class="facts"><div class="fact"><div class="fact-label">실제</div><div class="fact-value ${h.actual==null?'na':''}">${value(h.actual)}</div></div><div class="fact"><div class="fact-label">예상</div><div class="fact-value ${h.forecast==null?'na':''}">${value(h.forecast)}</div></div><div class="fact"><div class="fact-label">이전</div><div class="fact-value ${h.previous==null?'na':''}">${value(h.previous)}</div></div></div></section><div class="category-strip">${cats}</div><section class="board">${renderColumn('오늘',events.filter(e=>e.bucket==='today'))}${renderColumn('이번 주',events.filter(e=>e.bucket==='week'))}${renderColumn('이후',events.filter(e=>e.bucket==='later'))}</section>`;document.querySelectorAll('.more').forEach(btn=>btn.onclick=()=>{const extra=[...btn.closest('.col').querySelectorAll('.event')].slice(4),open=extra.some(x=>x.hidden);extra.forEach(x=>x.hidden=!open);btn.textContent=open?'접기':'더 보기'});updated.className='updated'+(d.stale?' stale':'');updated.querySelector('span').textContent=d.stale?'업데이트 지연':`업데이트 ${rel(d.generated_at)||d.updated_label||'완료'}`;source.textContent=`${d.source||'경제 캘린더'} · KST`;retry.hidden=!d.stale}
function renderError(msg){content.innerHTML=`<div class="loading">${esc(msg)}</div>`;updated.className='updated error';updated.querySelector('span').textContent='불러오기 실패';retry.hidden=false}
async function load(){updated.className='updated';updated.querySelector('span').textContent='불러오는 중';retry.hidden=true;try{const r=await fetch('./market-events-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();render(await r.json())}catch{renderError('경제 일정을 불러오지 못했습니다.')}}
$('#refresh').onclick=load;retry.onclick=load;load();
const KEY='lifetown-market-events-v3-ui',sizes=[560,640,720];let ui={sizeIndex:2,theme:'light',locked:false};try{ui={...ui,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{};if(!Number.isInteger(ui.sizeIndex)||ui.sizeIndex<0||ui.sizeIndex>2)ui.sizeIndex=2;if(!['light','dark'].includes(ui.theme))ui.theme='light';const sizeBtn=$('#sizeBtn'),themeBtn=$('#themeBtn'),lockBtn=$('#lockBtn'),themeIcon=$('#themeIcon'),lockIcon=$('#lockIcon');function saveUI(){localStorage.setItem(KEY,JSON.stringify(ui))}function applyUI(){root.style.maxWidth=sizes[ui.sizeIndex]+'px';document.documentElement.dataset.theme=ui.theme;sizeBtn.disabled=ui.locked;lockBtn.classList.toggle('active',ui.locked);themeBtn.classList.toggle('active',ui.theme==='dark');themeIcon.innerHTML=ui.theme==='dark'?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>':'<path d="M20.5 15.2A8 8 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/>';lockIcon.innerHTML=ui.locked?'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/>':'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/>'}sizeBtn.onclick=()=>{if(ui.locked)return;ui.sizeIndex=(ui.sizeIndex+1)%sizes.length;saveUI();applyUI()};themeBtn.onclick=()=>{ui.theme=ui.theme==='dark'?'light':'dark';saveUI();applyUI()};lockBtn.onclick=()=>{ui.locked=!ui.locked;saveUI();applyUI()};$('#resetBtn').onclick=()=>{ui={sizeIndex:2,theme:'light',locked:false};localStorage.removeItem(KEY);applyUI()};applyUI();
</script>
</body>
</html>
