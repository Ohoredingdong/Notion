<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>마켓 이벤트 · Life Town</title>
<style>
:root{
  --panel:#fff;--soft:#f7f7f8;--line:#e7e7ea;--line2:#f1f1f3;
  --text:#111113;--sub:#6e6e73;--muted:#9a9aa0;
  --blue:#007aff;--green:#34c759;--red:#ff3b30;--yellow:#b88900;
  --blue-soft:rgba(0,122,255,.07);--green-soft:rgba(52,199,89,.08);--red-soft:rgba(255,59,48,.07);--yellow-soft:rgba(255,204,0,.11)
}
html[data-theme="dark"]{
  --panel:#1c1c1e;--soft:#2c2c2e;--line:#38383a;--line2:#303033;
  --text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;
  --blue:#0a84ff;--green:#30d158;--red:#ff453a;--yellow:#ffd60a;
  --blue-soft:rgba(10,132,255,.12);--green-soft:rgba(48,209,88,.11);--red-soft:rgba(255,69,58,.11);--yellow-soft:rgba(255,214,10,.11)
}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}.root{position:relative;width:100%;max-width:700px;margin:auto;container-type:inline-size}.widget{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:19px 18px 14px;box-shadow:none;overflow:hidden}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.head-copy{min-width:0}.title{font-size:21px;line-height:1.05;font-weight:790;letter-spacing:-.045em}.subtitle{margin-top:5px;font-size:10px;color:var(--muted);line-height:1.4}.head-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto}.updated{height:31px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:8.8px;font-weight:650;color:var(--sub);white-space:nowrap}.updated i{width:6px;height:6px;border-radius:50%;background:var(--green)}.updated.stale i{background:var(--yellow)}.updated.error i{background:var(--red)}.refresh{width:31px;height:31px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:grid;place-items:center;color:var(--sub);cursor:pointer}.refresh:hover{background:var(--soft)}.refresh svg{width:14px;height:14px}
.hero{margin-top:16px;border:1px solid var(--line);border-radius:17px;padding:15px 15px 14px;background:var(--panel)}.hero-kicker{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.hero-kicker-left{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:720;color:var(--sub)}.hero-kicker-left i{width:6px;height:6px;border-radius:50%;background:var(--red)}.impact{height:23px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;font-size:8px;font-weight:720}.impact.high{background:var(--red-soft);color:var(--red)}.impact.medium{background:var(--yellow-soft);color:var(--yellow)}.impact.low{background:var(--soft);color:var(--sub)}.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:18px;align-items:end}.hero-title{font-size:18px;font-weight:790;letter-spacing:-.035em;line-height:1.2;word-break:keep-all}.hero-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;font-size:9px;color:var(--sub)}.hero-meta span{white-space:nowrap}.hero-desc{margin-top:9px;font-size:9.5px;line-height:1.5;color:var(--sub);word-break:keep-all;max-width:95%}.facts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}.fact{min-width:0;padding:10px 9px 9px;background:var(--panel)}.fact+.fact{border-left:1px solid var(--line2)}.fact-label{font-size:7.9px;color:var(--muted);font-weight:650}.fact-value{margin-top:5px;font-size:12px;font-weight:750;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fact-value.na{color:var(--muted);font-weight:650}
.categories{display:grid;grid-template-columns:repeat(4,1fr);margin-top:10px;border:1px solid var(--line);border-radius:13px;overflow:hidden}.cat{min-width:0;padding:10px 11px;background:var(--panel)}.cat+.cat{border-left:1px solid var(--line2)}.cat-top{display:flex;align-items:center;gap:6px}.cat-dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}.cat-name{font-size:9px;font-weight:700;color:var(--sub)}.cat-count{margin-top:5px;font-size:17px;font-weight:780;letter-spacing:-.04em}.cat-sub{margin-top:2px;font-size:7.8px;color:var(--muted)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}.col{min-width:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:0 11px 9px;overflow:hidden}.col-head{height:39px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line2)}.col-title{font-size:11px;font-weight:760}.col-count{font-size:8.2px;color:var(--muted)}.event{display:grid;grid-template-columns:38px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid var(--line2)}.event:last-child{border-bottom:0}.event[hidden]{display:none!important}.time{font-size:8.8px;line-height:1.35;color:var(--muted);font-weight:680;font-variant-numeric:tabular-nums;white-space:pre-line;padding-top:1px}.event-main{min-width:0}.event-title{font-size:9.8px;line-height:1.38;font-weight:690;word-break:keep-all}.country{font-weight:760;margin-right:3px}.event-info{margin-top:4px;font-size:8.2px;line-height:1.25;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-foot{display:flex;align-items:center;gap:5px;margin-top:5px}.event-type{height:17px;padding:0 6px;border-radius:999px;display:inline-flex;align-items:center;font-size:7.4px;font-weight:700}.event-high{font-size:7.5px;font-weight:720;color:var(--red)}.more{width:100%;height:27px;border:0;border-top:1px solid var(--line2);background:transparent;color:var(--sub);font-size:8.3px;font-weight:650;cursor:pointer;margin-top:4px}.more[hidden]{display:none}.empty{padding:22px 0 15px;text-align:center;font-size:8.6px;color:var(--muted)}
.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line2);font-size:8.2px;color:var(--muted)}.footer-left{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.retry{height:24px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:8.3px;color:var(--sub);cursor:pointer}.loading{padding:58px 10px;text-align:center;color:var(--muted);font-size:9.3px}.control-rail{position:absolute;top:10px;right:-32px;z-index:20;width:30px;display:flex;flex-direction:column;gap:7px;opacity:0;transform:translateX(-3px);transition:.14s ease}.root:hover .control-rail,.control-rail:hover{opacity:1;transform:none}.control-btn{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:var(--panel);display:grid;place-items:center;color:var(--sub);cursor:pointer;box-shadow:none}.control-btn:hover,.control-btn.active{background:var(--soft);color:var(--text)}.control-btn:disabled{opacity:.35;cursor:not-allowed}.control-btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
@container(max-width:610px){.widget{padding:16px 13px 12px}.title{font-size:18px}.updated{display:none}.hero-grid{grid-template-columns:1fr}.facts{max-width:none}.board{display:flex;overflow-x:auto;scroll-snap-type:x proximity}.board::-webkit-scrollbar{height:4px}.board::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}.col{flex:0 0 198px;scroll-snap-align:start}.categories{grid-template-columns:repeat(2,1fr)}.cat:nth-child(3){border-left:0;border-top:1px solid var(--line2)}.cat:nth-child(4){border-top:1px solid var(--line2)}}
@container(max-width:430px){.title{font-size:17px}.subtitle{font-size:8.8px}.refresh{width:29px;height:29px}.hero{padding:13px}.hero-title{font-size:15.5px}.hero-meta{font-size:8.4px}.hero-desc{font-size:8.9px;max-width:none}.fact{padding:9px 7px}.fact-value{font-size:11px}.cat{padding:9px}.cat-count{font-size:15px}.control-rail{right:-29px}}
@media(hover:none){.control-rail{opacity:.92;transform:none}}
</style>
</head>
<body>
<div class="root" id="root">
<main class="widget">
<header class="top"><div class="head-copy"><div class="title">마켓 이벤트</div><div class="subtitle">한국·미국·일본·유럽의 주요 경제 일정을 KST 기준으로 확인합니다.</div></div><div class="head-actions"><div class="updated" id="updated"><i></i><span>불러오는 중</span></div><button class="refresh" id="refresh" aria-label="새로고침"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5"/><path d="M18.5 9A7 7 0 1 0 19 15"/></svg></button></div></header>
<div id="content"><div class="loading">경제 일정을 불러오는 중...</div></div>
<footer class="footer"><div class="footer-left" id="source">모든 시간은 한국 시간(KST) 기준입니다.</div><button class="retry" id="retry" hidden>다시 불러오기</button></footer>
</main>
<div class="control-rail" aria-label="위젯 설정"><button class="control-btn" id="sizeBtn" aria-label="크기 변경"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/><path d="M3 8l5-5M21 8l-5-5M3 16l5 5M21 16l-5 5"/></svg></button><button class="control-btn" id="themeBtn" aria-label="다크 모드"><svg id="themeIcon" viewBox="0 0 24 24"><path d="M20.5 15.2A8 8 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg></button><button class="control-btn" id="lockBtn" aria-label="크기 잠금"><svg id="lockIcon" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/></svg></button><button class="control-btn" id="resetBtn" aria-label="UI 초기화"><svg viewBox="0 0 24 24"><path d="M4 8V4h4"/><path d="M5.5 5.5A8 8 0 1 1 4.2 14"/></svg></button></div>
</div>
<script>
const $=s=>document.querySelector(s),root=$('#root'),content=$('#content'),updated=$('#updated'),source=$('#source'),retry=$('#retry');
const flags={US:'🇺🇸',KR:'🇰🇷',JP:'🇯🇵',GB:'🇬🇧',DE:'🇩🇪',FR:'🇫🇷',CN:'🇨🇳',EU:'🇪🇺'},countryNames={US:'미국',KR:'한국',JP:'일본',GB:'영국',DE:'독일',FR:'프랑스',CN:'중국',EU:'유로존'};
const cats={rate:{label:'금리',tone:'red',sub:'통화정책'},inflation:{label:'물가',tone:'yellow',sub:'CPI · PPI'},jobs:{label:'고용',tone:'green',sub:'고용 · 실업'},growth:{label:'경기',tone:'blue',sub:'GDP · 생산'},other:{label:'기타',tone:'blue',sub:'경제 일정'}};
const toneVar={red:'var(--red)',yellow:'var(--yellow)',green:'var(--green)',blue:'var(--blue)'},toneSoft={red:'var(--red-soft)',yellow:'var(--yellow-soft)',green:'var(--green-soft)',blue:'var(--blue-soft)'};
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function rel(iso){const d=new Date(iso);if(isNaN(d))return null;const m=Math.max(0,Math.round((Date.now()-d.getTime())/60000));if(m<1)return'방금 전';if(m<60)return`${m}분 전`;const h=Math.floor(m/60);if(h<24)return`${h}시간 전`;return`${Math.floor(h/24)}일 전`}
function val(v){return v===null||v===undefined||v===''?'—':esc(v)}function impactClass(n){return n>=3?'high':n===2?'medium':'low'}function impactLabel(n){return n>=3?'높은 영향도':n===2?'중간 영향도':'낮은 영향도'}
function eventInfo(e){const a=[];if(e.actual!==null&&e.actual!==undefined)a.push(`실제 ${esc(e.actual)}`);if(e.forecast!==null&&e.forecast!==undefined)a.push(`예상 ${esc(e.forecast)}`);if(!a.length&&e.previous!==null&&e.previous!==undefined)a.push(`이전 ${esc(e.previous)}`);return a.join(' · ')||'세부 값 없음'}
function eventHtml(e,hidden=false){const c=cats[e.category]||cats.other,t=toneVar[c.tone],s=toneSoft[c.tone];return `<div class="event" ${hidden?'hidden':''}><div class="time">${esc(e.time_kst||'—')}</div><div class="event-main"><div class="event-title"><span class="country">${flags[e.country]||''} ${esc(countryNames[e.country]||e.country||'')}</span>${esc(e.title_ko||e.title||'')}</div><div class="event-info">${eventInfo(e)}</div><div class="event-foot"><span class="event-type" style="color:${t};background:${s}">${c.label}</span>${Number(e.importance)>=3?'<span class="event-high">중요</span>':''}</div></div></div>`}
function renderColumn(title,items){const first=items.slice(0,4),rest=items.slice(4);return `<section class="col"><div class="col-head"><div class="col-title">${title}</div><div class="col-count">${items.length}개</div></div><div>${first.map(x=>eventHtml(x)).join('')}${rest.map(x=>eventHtml(x,true)).join('')||(!items.length?'<div class="empty">예정 이벤트 없음</div>':'')}</div><button class="more" ${rest.length?'':'hidden'}>더 보기</button></section>`}
function render(d){const events=Array.isArray(d.events)?d.events:[],h=d.highlight||events[0];if(!h){renderError('표시할 경제 일정이 없습니다.');return}const heroCountry=countryNames[h.country]||h.country||'',importance=Number(h.importance)||1;const categoryKeys=['rate','inflation','jobs','growth'];const categoryHtml=categoryKeys.map(k=>{const c=cats[k],arr=events.filter(e=>e.category===k);return `<div class="cat"><div class="cat-top"><i class="cat-dot" style="background:${toneVar[c.tone]}"></i><div class="cat-name">${c.label}</div></div><div class="cat-count">${arr.length}</div><div class="cat-sub">${c.sub}</div></div>`}).join('');content.innerHTML=`<section class="hero"><div class="hero-kicker"><div class="hero-kicker-left"><i></i><span>다음 주요 일정</span></div><span class="impact ${impactClass(importance)}">${impactLabel(importance)}</span></div><div class="hero-grid"><div><div class="hero-title">${esc(heroCountry?heroCountry+' '+(h.title_ko||h.title||'주요 이벤트'):(h.title_ko||h.title||'주요 이벤트'))}</div><div class="hero-meta"><span>${flags[h.country]||''} ${esc(heroCountry)}</span><span>${esc(h.date_kst||'—')}</span><span>${esc(h.time_kst||'—')}</span></div><div class="hero-desc">${esc(h.comment_ko||'시장에 영향을 줄 수 있는 주요 경제 일정입니다.')}</div></div><div class="facts"><div class="fact"><div class="fact-label">실제</div><div class="fact-value ${h.actual==null?'na':''}">${val(h.actual)}</div></div><div class="fact"><div class="fact-label">예상</div><div class="fact-value ${h.forecast==null?'na':''}">${val(h.forecast)}</div></div><div class="fact"><div class="fact-label">이전</div><div class="fact-value ${h.previous==null?'na':''}">${val(h.previous)}</div></div></div></div></section><section class="categories">${categoryHtml}</section><section class="board">${renderColumn('오늘',events.filter(e=>e.bucket==='today'))}${renderColumn('이번 주',events.filter(e=>e.bucket==='week'))}${renderColumn('이후',events.filter(e=>e.bucket==='later'))}</section>`;document.querySelectorAll('.more').forEach(btn=>btn.onclick=()=>{const extra=[...btn.closest('.col').querySelectorAll('.event')].slice(4),open=extra.some(x=>x.hidden);extra.forEach(x=>x.hidden=!open);btn.textContent=open?'접기':'더 보기'});updated.className='updated'+(d.stale?' stale':'');updated.querySelector('span').textContent=d.stale?'업데이트 지연':`업데이트 ${rel(d.generated_at)||d.updated_label||'완료'}`;source.textContent=`${d.source||'경제 캘린더'} · KST`;retry.hidden=!d.stale}
function renderError(msg){content.innerHTML=`<div class="loading">${esc(msg)}</div>`;updated.className='updated error';updated.querySelector('span').textContent='불러오기 실패';retry.hidden=false}
async function load(){updated.className='updated';updated.querySelector('span').textContent='불러오는 중';retry.hidden=true;try{const r=await fetch('./market-events-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();render(await r.json())}catch{renderError('경제 일정을 불러오지 못했습니다.')}}
$('#refresh').onclick=load;retry.onclick=load;load();
const KEY='lifetown-market-events-v3-ui',sizes=[560,630,700];let ui={sizeIndex:2,theme:'light',locked:false};try{ui={...ui,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{};if(!Number.isInteger(ui.sizeIndex)||ui.sizeIndex<0||ui.sizeIndex>2)ui.sizeIndex=2;if(!['light','dark'].includes(ui.theme))ui.theme='light';const sizeBtn=$('#sizeBtn'),themeBtn=$('#themeBtn'),lockBtn=$('#lockBtn'),themeIcon=$('#themeIcon'),lockIcon=$('#lockIcon');function saveUI(){localStorage.setItem(KEY,JSON.stringify(ui))}function applyUI(){root.style.maxWidth=sizes[ui.sizeIndex]+'px';document.documentElement.dataset.theme=ui.theme;sizeBtn.disabled=ui.locked;lockBtn.classList.toggle('active',ui.locked);themeBtn.classList.toggle('active',ui.theme==='dark');themeIcon.innerHTML=ui.theme==='dark'?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>':'<path d="M20.5 15.2A8 8 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/>';lockIcon.innerHTML=ui.locked?'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/>':'<rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.5-2"/>'}sizeBtn.onclick=()=>{if(ui.locked)return;ui.sizeIndex=(ui.sizeIndex+1)%sizes.length;saveUI();applyUI()};themeBtn.onclick=()=>{ui.theme=ui.theme==='dark'?'light':'dark';saveUI();applyUI()};lockBtn.onclick=()=>{ui.locked=!ui.locked;saveUI();applyUI()};$('#resetBtn').onclick=()=>{ui={sizeIndex:2,theme:'light',locked:false};localStorage.removeItem(KEY);applyUI()};applyUI();
</script>
</body>
</html>
