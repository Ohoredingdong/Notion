<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kimchi Premium Widget</title>
<style>
:root{
  --panel:#fff;--line:#ebe7df;--line-soft:#f3f1ec;--soft:#f8f7f4;
  --text:#24272a;--sub:#80858a;--muted:#a8adb1;
  --green:#5f9b63;--red:#dd7872;--red-soft:#fbefee;
  --ctrl:rgba(255,255,255,.95);--shadow:0 8px 22px rgba(24,23,20,.04)
}
html[data-theme="dark"]{
  --panel:#202120;--line:#383733;--line-soft:#2d2d2a;--soft:#282926;
  --text:#efefeb;--sub:#c1c4bf;--muted:#8f938f;
  --green:#84b985;--red:#eb8e87;--red-soft:#382725;
  --ctrl:rgba(35,35,33,.95);--shadow:none
}
*{box-sizing:border-box} html,body{margin:0;background:transparent}
body{padding:8px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.root{position:relative;width:min(100%,420px);margin:0 auto;transition:width .18s ease}
.root[data-size="compact"]{width:min(100%,390px)} .root[data-size="normal"]{width:min(100%,420px)} .root[data-size="large"]{width:min(100%,465px)}
.widget{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;box-shadow:var(--shadow)}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.title{font-size:18px;font-weight:790;letter-spacing:-.03em;line-height:1.15}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.copy-btn{display:flex;align-items:center;gap:5px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:11px;font-weight:500;color:var(--sub);cursor:pointer}
.copy-btn svg{width:13px;height:13px}.copy-btn:hover{background:var(--soft)}
.updated{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.updated svg{width:12px;height:12px}
.caption{font-size:11px;color:var(--sub);font-weight:650}
.main{padding:8px 0 10px}
.main-value{font-size:44px;font-weight:500;letter-spacing:-.05em;line-height:1;color:var(--red)}
.main-label{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.main-label strong{font-size:18px;font-weight:500}
.main-sub{margin-top:6px;font-size:12px;color:var(--sub)}
.table{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:42px 1fr 84px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line-soft)}
.symbol{font-size:16px;font-weight:780}
.prices{min-width:0}
.local{font-size:21px;font-weight:760;letter-spacing:-.03em;line-height:1.15}
.global{margin-top:3px;font-size:14px;color:var(--sub);line-height:1.15}
.premium{text-align:right;font-size:21px;font-weight:770;color:var(--red);letter-spacing:-.03em}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;margin-top:2px;border-top:1px solid var(--line)}
.foot-left,.foot-right{font-size:11px;color:var(--muted)}
.foot-left strong,.foot-right strong{color:var(--sub);font-weight:700}
.status-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--green);margin-left:5px;vertical-align:1px}
.loading,.error{padding:36px 10px;text-align:center;font-size:12px;color:var(--muted)}
.controls{position:absolute;top:10px;right:-36px;display:flex;flex-direction:column;gap:7px;opacity:0;transform:translateX(6px);pointer-events:none;transition:opacity .18s ease,transform .18s ease}.controls:before{content:"";position:absolute;left:-10px;top:0;width:10px;height:100%}
.root:hover .controls,.root:focus-within .controls{opacity:1;transform:none;pointer-events:auto}
.ctrl{position:relative;width:28px;height:28px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--ctrl);cursor:pointer;box-shadow:0 2px 8px rgba(20,20,20,.05)}.ctrl:hover{background:var(--soft)}.ctrl[disabled]{opacity:.42;cursor:not-allowed}.ctrl svg{width:14px;height:14px}
.ctrl:after{content:attr(data-tip);position:absolute;right:35px;top:50%;transform:translateY(-50%);padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-size:9px;color:var(--sub);white-space:nowrap;opacity:0;pointer-events:none}.ctrl:hover:after{opacity:1}
@media (max-width:430px){.root{width:100%!important}.main-value{font-size:40px}.local,.premium{font-size:19px}.global{font-size:13px}.controls{right:7px;top:7px;opacity:1;transform:none;pointer-events:auto;flex-direction:row}.ctrl:after{display:none}.header{padding-right:126px}}
@media (hover:none),(pointer:coarse){.controls{opacity:1;transform:none;pointer-events:auto}}
</style>
</head>
<body>
<div class="root" id="root" data-size="normal">
  <div class="widget">
    <div id="content" class="loading">김치프리미엄 데이터를 불러오는 중...</div>
  </div>
  <div class="controls" aria-label="Widget controls">
    <button class="ctrl" id="sizeBtn" data-tip="Size"><svg viewBox="0 0 24 24" fill="none"><path d="M6 8h12M6 12h9M6 16h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button class="ctrl" id="themeBtn" data-tip="Dark Mode"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3.7a8.3 8.3 0 1 0 8.3 8.3A6.5 6.5 0 1 1 12 3.7Z" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button class="ctrl" id="lockBtn" data-tip="Lock"><svg id="lockSvg" viewBox="0 0 24 24" fill="none"><path d="M7 11V8.5a5 5 0 0 1 10 0V11" stroke="currentColor" stroke-width="1.8"/><rect x="5" y="11" width="14" height="9" rx="2.5" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button class="ctrl" id="resetBtn" data-tip="Reset"><svg viewBox="0 0 24 24" fill="none"><path d="M19 7v4h-4M5 17v-4h4M17.5 9A6.5 6.5 0 0 0 6.6 7L5 11M6.5 15A6.5 6.5 0 0 0 17.4 17L19 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div>
</div>
<script>
const FALLBACK={generated_at:'2026-08-22T14:15:00+09:00',updated_at:'2026-08-22T14:13:00+09:00',source:'Upbit vs Global spot benchmark',source_url:'https://docs.upbit.com/kr/reference/ticker',update_interval_sec:60,usdkrw:1395,premium_pct:-1.23,premium_label:'BTC 프리미엄',summary:'업비트가 글로벌보다 낮습니다 (역프 상태)',rows:[{symbol:'BTC',local_krw:103750000,global_usd:75044.64,premium_pct:-1.23},{symbol:'ETH',local_krw:3245000,global_usd:2286.249,premium_pct:-1.26}]};
const KEY='widget.kimchiPremium.controls.v1';const root=document.getElementById('root');const q=new URLSearchParams(location.search);const osTheme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';let settings={theme:q.get('theme')||osTheme,size:'normal',locked:false};try{settings={...settings,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}
function save(){localStorage.setItem(KEY,JSON.stringify(settings))}function applyTheme(v){document.documentElement.dataset.theme=v;settings.theme=v;save()}function applySize(v){root.dataset.size=v;settings.size=v;save();document.getElementById('sizeBtn').disabled=settings.locked}function applyLock(v){settings.locked=v;save();document.getElementById('sizeBtn').disabled=v;document.getElementById('lockBtn').dataset.tip=v?'Unlock':'Lock';document.getElementById('lockSvg').innerHTML=v?'<rect x="5" y="11" width="14" height="9" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8.7a4 4 0 0 1 8 0V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>':'<path d="M7 11V8.5a5 5 0 0 1 10 0V11" stroke="currentColor" stroke-width="1.8"/><rect x="5" y="11" width="14" height="9" rx="2.5" stroke="currentColor" stroke-width="1.8"/>'}
applyTheme(settings.theme);applySize(settings.size);applyLock(settings.locked);document.getElementById('themeBtn').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');document.getElementById('sizeBtn').onclick=()=>{if(settings.locked)return;const arr=['compact','normal','large'];applySize(arr[(arr.indexOf(settings.size)+1)%arr.length])};document.getElementById('lockBtn').onclick=()=>applyLock(!settings.locked);document.getElementById('resetBtn').onclick=()=>{settings={theme:q.get('theme')||osTheme,size:'normal',locked:false};applyTheme(settings.theme);applySize('normal');applyLock(false)};
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function fmtKRW(n){return '₩'+Number(n).toLocaleString('ko-KR')}function fmtUSD(n){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:Number(n)<100?3:2,maximumFractionDigits:Number(n)<100?3:2})}function premiumCls(v){return Number(v)>=0?'var(--green)':'var(--red)'}function premiumText(v){return `${Number(v)>=0?'+':''}${Number(v).toFixed(2)}%`}function relUpdated(iso){try{const diff=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));return `${diff}분 전`}catch{return '방금'}}
function render(data){const mainPremium=Number(data.premium_pct);const rows=(data.rows||[]).map(r=>`<div class="row"><div class="symbol">${esc(r.symbol)}</div><div class="prices"><div class="local">${fmtKRW(r.local_krw)}</div><div class="global">${fmtUSD(r.global_usd)}</div></div><div class="premium" style="color:${premiumCls(r.premium_pct)}">${premiumText(r.premium_pct)}</div></div>`).join('');const html=`<div class="header"><div><div class="title">비트코인 한국 프리미엄</div></div><div class="header-right"><button class="copy-btn" id="copyLinkBtn" type="button"><svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="5" y="5" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/></svg><span>Copy Link</span></button><div class="updated"><svg viewBox="0 0 24 24" fill="none"><path d="M20 7v5h-5M4 17v-5h5M17.5 9A6.5 6.5 0 0 0 6.6 7L4 12M6.5 15A6.5 6.5 0 0 0 17.4 17L20 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${relUpdated(data.updated_at)}</span></div></div></div><div class="main"><div class="caption">업비트 vs 글로벌</div><div class="main-value" style="color:${premiumCls(mainPremium)}">${premiumText(mainPremium)}</div><div class="main-label"><strong>${esc(data.premium_label||'BTC 프리미엄')}</strong></div><div class="main-sub">${esc(data.summary||'')}</div></div><div class="table">${rows}</div><div class="footer"><div class="foot-left">USD <strong>${fmtKRW(data.usdkrw)}</strong> 적용</div><div class="foot-right"><strong>${Number(data.update_interval_sec||60)}초</strong> 갱신<span class="status-dot"></span></div></div>`;document.getElementById('content').outerHTML=`<div id="content">${html}</div>`;document.getElementById('copyLinkBtn').onclick=async()=>{try{await navigator.clipboard.writeText(location.href)}catch{}}}
async function load(){try{const res=await fetch('./kimchi-premium-data.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error(res.status);const data=await res.json();render({...FALLBACK,...data})}catch(e){render(FALLBACK)}}load();
</script>
</body>
</html>
