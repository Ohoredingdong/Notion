</style></head><body><div class="root"><main class="widget" data-widget-control-root data-control-sizes="420,460,500"><header class="header"><div><div class="title">Work Today</div><div class="date" id="headDate"></div></div><button class="sync-btn offline" id="syncBtn" type="button">Sync</button></header><div class="grid"><section class="section today"><div class="section-head"><div class="section-title">Today</div><div class="section-date" id="todayDate"></div></div><div class="list" id="todayList"></div><div class="foot"><button class="add" data-add="today">+ 추가</button></div></section><section class="section tomorrow"><div class="section-head"><div class="section-title">Tomorrow</div><div class="section-date" id="tomorrowDate"></div></div><div class="list" id="tomorrowList"></div><div class="foot"><button class="add" data-add="tomorrow">+ 추가</button></div></section><section class="section week"><div class="section-head"><div class="section-title">This Week</div><div class="section-date" id="weekDate"></div></div><div class="list" id="weekList"></div><div class="foot"><button class="add" data-add="week">+ 추가</button></div></section></div><section class="archive open" id="archiveBox"><div class="archive-head"><div class="archive-title"><i></i><span>Archive</span></div><div class="archive-actions"><span class="count" id="archiveCount">0 saved</span><button class="small" id="toggleArchive">Hide</button><button class="small" id="clearArchive">Clear</button></div></div><div class="archive-list" id="archiveList"></div></section></main></div><div class="sync-overlay" id="syncOverlay" aria-hidden="true"><div class="sync-panel"><button class="sync-close" id="syncClose" type="button">×</button><div class="sync-title">기기 동기화</div><div class="sync-desc">같은 코드를 휴대폰·태블릿·PC에 입력하면 동일한 Work Today 데이터를 공유합니다.</div><div class="sync-field"><input class="sync-input" id="syncCodeInput" autocomplete="off" spellcheck="false"><button class="sync-action" id="copySyncCode" type="button">복사</button></div><div class="sync-actions"><button class="sync-action" id="useSyncCode" type="button">이 코드 사용</button><button class="sync-action" id="newSyncCode" type="button">새 코드</button></div><div class="sync-status" id="syncStatusText"></div><div class="sync-hint">동기화 코드는 비공개로 보관해 주세요.</div></div></div><script>
const STORAGE_KEY='lifetown_work_today_compact_v3',SYNC_CODE_KEY='lifetown_work_today_sync_code_v1',SYNC_ENDPOINT='https://dfklyngtjqvlirgrtdfb.supabase.co/functions/v1/work-today-sync';const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36).slice(-4),blank=()=>({id:uid(),text:'',done:false}),dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};let syncCode=localStorage.getItem(SYNC_CODE_KEY)||'',lastRemoteAt='',cloudReady=false,applyingRemote=false,cloudSaveTimer=null;function load(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(v&&typeof v==='object')return v}catch{}return{lastDate:dateKey(new Date()),today:[blank()],tomorrow:[blank()],week:[blank()],archive:[],archiveOpen:true,sampleSeeded:false}}const s=load();function saveLocal(){localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}function save(){saveLocal();if(!applyingRemote&&cloudReady&&syncCode)scheduleCloudSave()}function normalize(){['today','tomorrow','week'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];s[k]=s[k].map(x=>({id:x.id||uid(),text:String(x.text||''),done:!!x.done}));if(!s[k].length)s[k]=[blank()]});if(!Array.isArray(s.archive))s.archive=[];if(typeof s.archiveOpen!=='boolean')s.archiveOpen=true;saveLocal()}function archiveToday(k){(s.today||[]).filter(x=>x.text.trim()).reverse().forEach(x=>s.archive.unshift({id:uid(),text:x.text.trim(),done:!!x.done,date:k}))}function rollover(){const now=dateKey(new Date());if(!s.lastDate){s.lastDate=now;save();return}if(s.lastDate===now)return;let gap=Math.floor((fromKey(now)-fromKey(s.lastDate))/86400000);if(!Number.isFinite(gap)||gap<1)gap=1;for(let i=0;i<gap;i++){archiveToday(s.lastDate);const moved=(s.tomorrow||[]).filter(x=>x.text.trim()||x.done).map(x=>({id:uid(),text:x.text,done:!!x.done}));s.today=moved.length?moved:[blank()];s.tomorrow=[blank()];const n=fromKey(s.lastDate);n.setDate(n.getDate()+1);s.lastDate=dateKey(n)}s.lastDate=now;save()}const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');function renderSection(k){const root=document.getElementById(k+'List');root.innerHTML='';s[k].forEach(t=>{const r=document.createElement('div');r.className='task'+(t.done?' done':'');r.innerHTML=`<button class="check ${t.done?'done':''}">${t.done?'✓':''}</button><input value="${esc(t.text)}" placeholder="메모 입력"><button class="x">×</button>`;r.querySelector('.check').onclick=()=>{t.done=!t.done;save();renderSection(k)};const inp=r.querySelector('input');inp.oninput=e=>{t.text=e.target.value;save()};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add(k)}};r.querySelector('.x').onclick=()=>{s[k]=s[k].filter(x=>x.id!==t.id);if(!s[k].length)s[k]=[blank()];save();renderSection(k)};root.appendChild(r)})}function add(k){s[k].push(blank());save();renderSection(k);const xs=document.querySelectorAll('#'+k+'List input');xs[xs.length-1]?.focus()}function renderArchive(){const box=document.getElementById('archiveBox'),root=document.getElementById('archiveList');box.classList.toggle('open',s.archiveOpen);toggleArchive.textContent=s.archiveOpen?'Hide':'Show';archiveCount.textContent=s.archive.length+' saved';root.innerHTML='';if(!s.archiveOpen)return;if(!s.archive.length){root.innerHTML='<div class="archive-empty">완료된 Today 메모가 날짜가 지나면 여기에 저장됩니다.</div>';return}s.archive.forEach(a=>{const c=document.createElement('div');c.className='arch-item';c.innerHTML=`<button class="delete-arch">×</button><div class="arch-meta">${a.date}${a.done?' · 완료':''}</div><div class="arch-text">${esc(a.text)}</div>`;c.querySelector('.delete-arch').onclick=()=>{s.archive=s.archive.filter(x=>x.id!==a.id);save();renderArchive()};root.appendChild(c)})}function renderDates(){const n=new Date(),tm=new Date(n);tm.setDate(n.getDate()+1);headDate.textContent=new Intl.DateTimeFormat('ko-KR',{weekday:'long',month:'long',day:'numeric'}).format(n);todayDate.textContent=n.toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'});tomorrowDate.textContent=tm.toLocaleDateString('ko-KR',{month:'2-digit',day:'2-digit'});const st=new Date(n),diff=(st.getDay()+6)%7;st.setDate(st.getDate()-diff);const en=new Date(st);en.setDate(st.getDate()+6),f=d=>`${d.getMonth()+1}.${d.getDate()}`;weekDate.textContent=f(st)+' – '+f(en)}function renderAll(){renderDates();renderSection('today');renderSection('tomorrow');renderSection('week');renderArchive()}function setSyncStatus(mode,label){syncBtn.classList.remove('online','syncing','offline');syncBtn.classList.add(mode);syncBtn.textContent=label||'Sync';if(syncStatusText&&label)syncStatusText.textContent=label}function genCode(){const a=new Uint8Array(18);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,28).toUpperCase()}async function syncReq(action,payload={}){const r=await fetch(SYNC_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,code:syncCode,...payload}),cache:'no-store'});if(!r.ok)throw new Error('sync_failed');return r.json()}function scheduleCloudSave(){clearTimeout(cloudSaveTimer);setSyncStatus('syncing','Syncing…');cloudSaveTimer=setTimeout(cloudSave,450)}async function cloudSave(){if(!syncCode)return;try{await syncReq('save',{state:JSON.parse(JSON.stringify(s))});lastRemoteAt=new Date().toISOString();setSyncStatus('online','Synced')}catch{setSyncStatus('offline','Offline')}}async function cloudLoad(initial=false){if(!syncCode)return false;try{setSyncStatus('syncing','Syncing…');const d=await syncReq('load');if(d.state){applyingRemote=true;Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,d.state);normalize();applyingRemote=false;saveLocal();lastRemoteAt=d.updated_at||'';renderAll();setSyncStatus('online','Synced');return true}if(initial)await cloudSave();else setSyncStatus('online','Synced');return false}catch{setSyncStatus('offline','Offline');return false}}async function pollCloud(){if(!cloudReady||!syncCode)return;try{const d=await syncReq('load');if(d.state&&d.updated_at&&(!lastRemoteAt||new Date(d.updated_at)>new Date(lastRemoteAt))){applyingRemote=true;Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,d.state);normalize();applyingRemote=false;saveLocal();lastRemoteAt=d.updated_at;renderAll();setSyncStatus('online','Synced')}}catch{setSyncStatus('offline','Offline')}}function openSync(){syncCodeInput.value=syncCode;syncOverlay.classList.add('open');syncStatusText.textContent='같은 코드를 다른 기기에도 입력하세요.'}function closeSync(){syncOverlay.classList.remove('open')}async function useCode(){const v=syncCodeInput.value.trim().toUpperCase().replace(/\s+/g,'');if(v.length<16){syncStatusText.textContent='코드가 너무 짧습니다.';return}syncCode=v;localStorage.setItem(SYNC_CODE_KEY,syncCode);cloudReady=true;const found=await cloudLoad(false);if(!found)await cloudSave();syncCodeInput.value=syncCode}async function newCode(){syncCode=genCode();localStorage.setItem(SYNC_CODE_KEY,syncCode);cloudReady=true;syncCodeInput.value=syncCode;await cloudSave();syncStatusText.textContent='새 동기화 공간을 만들었습니다.'}async function copyCode(){try{await navigator.clipboard.writeText(syncCode);syncStatusText.textContent='동기화 코드를 복사했습니다.'}catch{syncCodeInput.select();document.execCommand('copy');syncStatusText.textContent='동기화 코드를 복사했습니다.'}}async function initSync(){if(!syncCode){syncCode=genCode();localStorage.setItem(SYNC_CODE_KEY,syncCode)}cloudReady=true;await cloudLoad(true);setInterval(pollCloud,5000)}document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));toggleArchive.onclick=()=>{s.archiveOpen=!s.archiveOpen;save();renderArchive()};clearArchive.onclick=()=>{s.archive=[];save();renderArchive()};syncBtn.onclick=openSync;syncClose.onclick=closeSync;syncOverlay.onclick=e=>{if(e.target.id==='syncOverlay')closeSync()};useSyncCode.onclick=useCode;newSyncCode.onclick=newCode;copySyncCode.onclick=copyCode;rollover();normalize();renderAll();initSync();
</script><script src="./assets/life-town-controls-v2.js"></script></body></html>
