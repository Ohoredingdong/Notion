<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Work Today · Life Town v2</title>
<link rel="stylesheet" href="./assets/life-town-v2.css">
<style>
:root{--panel:#fff;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--line:#e5e5e8;--line2:#f0f0f2;--soft:#f7f7f8;--blue:#007aff;--green:#34c759;--yellow:#ffcc00;--yellow-ink:#7a6200;--red:#ff3b30;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}
html[data-lt-theme="dark"]{--panel:#1c1c1e;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--line:#38383a;--line2:#2c2c2e;--soft:#2c2c2e;--blue:#0a84ff;--green:#30d158;--yellow:#ffd60a;--yellow-ink:#ffd60a;--red:#ff453a;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit;color:inherit}.root{width:100%;max-width:420px;margin:auto;container-type:inline-size}.widget{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:15px 14px 13px;box-shadow:var(--shadow);overflow:hidden}.widget:before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:linear-gradient(90deg,transparent,#b8b8bd 22%,#f5f5f7 50%,#b8b8bd 78%,transparent);opacity:.48}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:1px 1px 2px}.title{font-size:18px;font-weight:760;letter-spacing:-.04em}.date{margin-top:4px;font-size:8.8px;color:var(--muted)}
.sync-btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--sub);font-size:8.8px;font-weight:690;cursor:pointer;transition:.14s}.sync-btn:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}.sync-btn.online:before{background:var(--green)}.sync-btn.syncing{background:rgba(255,204,0,.07);border-color:rgba(255,204,0,.22);color:var(--yellow-ink)}.sync-btn.syncing:before{background:var(--yellow)}.sync-btn.offline{border-color:rgba(255,59,48,.16)}.sync-btn.offline:before{background:var(--red)}
.grid{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}.section{position:relative;border:1px solid var(--line);border-radius:16px;padding:12px 11px 10px;background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--soft) 34%,var(--panel)));overflow:hidden;transition:.14s;min-height:112px}.section:before{content:"";position:absolute;left:11px;top:0;width:32px;height:3px;border-radius:999px;background:var(--line)}.section.today{min-height:124px;background:rgba(0,122,255,.05);border-color:rgba(0,122,255,.20)}.section.today:before{background:var(--blue)}.section.tomorrow:before{background:color-mix(in srgb,var(--blue) 38%,var(--line))}.section.week:before{background:#c9c9cd}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.section-heading{display:flex;align-items:center;gap:7px;min-width:0}.section-title{font-size:11.5px;font-weight:740;letter-spacing:-.015em}.section.today .section-title{color:var(--blue)}.section-side{display:flex;align-items:center;gap:5px}.section-date{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:7px;background:var(--soft);font-size:8.8px;color:var(--muted);white-space:nowrap}.section.today .section-date{background:rgba(0,122,255,.07);color:var(--blue)}.progress-chip{display:inline-flex;align-items:center;justify-content:center;min-width:29px;height:20px;padding:0 6px;border:1px solid rgba(0,122,255,.16);border-radius:999px;background:rgba(0,122,255,.05);color:var(--blue);font-size:8.4px;font-weight:720}.progress-chip.has-progress{background:rgba(0,122,255,.085);border-color:rgba(0,122,255,.22);color:var(--blue)}.progress-chip.complete{background:rgba(52,199,89,.09);border-color:rgba(52,199,89,.22);color:#248a3d}
.list{display:flex;flex-direction:column;gap:3px;margin-top:8px;min-height:58px}.task{display:grid;grid-template-columns:18px minmax(0,1fr) 14px;align-items:center;gap:7px;min-height:28px;border-top:1px solid color-mix(in srgb,var(--line2) 88%,transparent)}.task:first-child{border-top:0}.check{width:17px;height:17px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--panel);display:grid;place-items:center;color:#fff;font-size:9px;cursor:pointer;transition:.12s}.check:hover{border-color:rgba(0,122,255,.40);box-shadow:0 0 0 3px rgba(0,122,255,.06)}.check.done{background:var(--green);border-color:var(--green);box-shadow:none}.task input{width:100%;min-width:0;border:0;outline:0;background:transparent;padding:5px 0;font-size:10.2px;color:var(--text)}.task input::placeholder{color:var(--muted)}.task.done input{text-decoration:line-through;color:var(--muted)}.x{border:0;background:transparent;color:var(--muted);font-size:13px;padding:0;cursor:pointer}.x:hover,.delete-arch:hover{color:var(--red)}
.foot{display:flex;justify-content:flex-end;margin-top:7px}.add{height:26px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--blue);font-size:8.8px;font-weight:700;cursor:pointer}.add:hover{background:rgba(0,122,255,.055);border-color:rgba(0,122,255,.22)}
.archive{margin-top:9px;border:1px solid var(--line);border-radius:16px;padding:11px;background:var(--panel)}.archive-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.archive-title{display:flex;align-items:center;gap:7px;font-size:10.2px;font-weight:720}.archive-title:before{content:"";width:6px;height:6px;border-radius:50%;background:#c9c9cd}.archive-actions{display:flex;align-items:center;gap:5px}.count,.small{height:24px;padding:0 7px;border-radius:8px;font-size:8.5px}.count{display:inline-flex;align-items:center;background:var(--soft);color:var(--sub)}.small{border:1px solid var(--line);background:var(--panel);color:var(--sub);cursor:pointer}.small:hover{background:var(--soft)}#clearArchive:hover{color:var(--red);border-color:rgba(255,59,48,.2);background:rgba(255,59,48,.035)}.archive-list{display:none;gap:6px;overflow-x:auto;padding-top:9px}.archive.open .archive-list{display:flex}.arch-item{position:relative;flex:0 0 118px;min-height:70px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:9px 20px 8px 9px}.arch-item.is-done{border-color:rgba(52,199,89,.17);box-shadow:inset 3px 0 0 rgba(52,199,89,.55)}.arch-meta{font-size:8.3px;color:var(--muted);margin-bottom:5px}.arch-item.is-done .arch-meta{color:#248a3d}.arch-text{font-size:9.3px;line-height:1.35;color:var(--text);word-break:break-word}.delete-arch{position:absolute;right:6px;top:5px;border:0;background:transparent;color:var(--muted);font-size:11px;padding:0;cursor:pointer}.archive-empty{font-size:8.8px;color:var(--muted);padding:8px 1px 4px}
.sync-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.16);backdrop-filter:blur(7px);z-index:9999}.sync-overlay.open{display:flex}.sync-panel{width:min(330px,92vw);position:relative;border:1px solid var(--line);border-radius:22px;background:var(--panel);padding:18px 16px 15px;box-shadow:0 18px 45px rgba(0,0,0,.16)}.sync-title{text-align:center;font-size:17px;font-weight:760;letter-spacing:-.03em}.sync-desc{margin:5px 5px 13px;text-align:center;font-size:9px;line-height:1.45;color:var(--sub)}.sync-field{display:flex;gap:6px}.sync-input{flex:1;min-width:0;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:0 9px;outline:0;font:650 9px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}.sync-input:focus{border-color:rgba(0,122,255,.35);box-shadow:0 0 0 3px rgba(0,122,255,.06)}.sync-action{height:34px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 10px;font-size:8.8px;font-weight:700;cursor:pointer}.sync-action:hover{background:var(--soft)}.sync-actions{display:flex;justify-content:center;gap:6px;margin-top:8px}.sync-status{min-height:14px;margin-top:8px;text-align:center;font-size:8.8px;color:var(--sub)}.sync-hint{text-align:center;font-size:8.5px;color:var(--muted);line-height:1.4}.sync-close{position:absolute;right:10px;top:9px;border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}
/* Work Today owns its local color/layout so shared balancing rules do not flatten it. */
body:has(#todayList):has(#tomorrowList):has(#weekList) .grid{grid-template-columns:1fr!important}
body:has(#todayList):has(#tomorrowList):has(#weekList) .section{background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--soft) 34%,var(--panel)))!important;border-color:var(--line)!important}
body:has(#todayList):has(#tomorrowList):has(#weekList) .section:before{background:var(--line)!important}
body:has(#todayList):has(#tomorrowList):has(#weekList) .section.today{background:rgba(0,122,255,.05)!important;border-color:rgba(0,122,255,.20)!important}
body:has(#todayList):has(#tomorrowList):has(#weekList) .section.today:before{background:var(--blue)!important}
body:has(#todayList):has(#tomorrowList):has(#weekList) .section.tomorrow:before{background:color-mix(in srgb,var(--blue) 38%,var(--line))!important}
body:has(#todayList):has(#tomorrowList):has(#weekList) .section.week:before{background:#c9c9cd!important}
body:has(#todayList):has(#tomorrowList):has(#weekList) .add{color:var(--blue)!important}
body:has(#todayList):has(#tomorrowList):has(#weekList) .arch-item{box-shadow:none!important}
body:has(#todayList):has(#tomorrowList):has(#weekList) .arch-item.is-done{box-shadow:inset 3px 0 0 rgba(52,199,89,.55)!important}
@container(max-width:360px){.root{max-width:340px}.widget{padding:13px 12px 11px}.title{font-size:17px}.section{padding:11px 9px 9px}.section-side{gap:4px}.section-date{font-size:8.4px}.progress-chip{min-width:27px}}
</style>
</head>
<body>
<div class="root">
<main class="widget" data-widget-control-root data-control-sizes="360,390,420">
<header class="header"><div><div class="title">Work Today</div><div class="date" id="headDate"></div></div><button class="sync-btn offline" id="syncBtn" type="button">Sync</button></header>
<div class="grid">
<section class="section today"><div class="section-head"><div class="section-heading"><div class="section-title">Today</div></div><div class="section-side"><span class="progress-chip" id="todayCount">0</span><div class="section-date" id="todayDate"></div></div></div><div class="list" id="todayList"></div><div class="foot"><button class="add" data-add="today">+ 추가</button></div></section>
<section class="section tomorrow"><div class="section-head"><div class="section-heading"><div class="section-title">Tomorrow</div></div><div class="section-side"><span class="progress-chip" id="tomorrowCount">0</span><div class="section-date" id="tomorrowDate"></div></div></div><div class="list" id="tomorrowList"></div><div class="foot"><button class="add" data-add="tomorrow">+ 추가</button></div></section>
<section class="section week"><div class="section-head"><div class="section-heading"><div class="section-title">This Week</div></div><div class="section-side"><span class="progress-chip" id="weekCount">0</span><div class="section-date" id="weekDate"></div></div></div><div class="list" id="weekList"></div><div class="foot"><button class="add" data-add="week">+ 추가</button></div></section>
</div>
<section class="archive open" id="archiveBox"><div class="archive-head"><div class="archive-title">Archive</div><div class="archive-actions"><span class="count" id="archiveCount">0 saved</span><button class="small" id="toggleArchive">Hide</button><button class="small" id="clearArchive">Clear</button></div></div><div class="archive-list" id="archiveList"></div></section>
</main>
</div>
<div class="sync-overlay" id="syncOverlay" aria-hidden="true"><div class="sync-panel"><button class="sync-close" id="syncClose" type="button">×</button><div class="sync-title">기기 동기화</div><div class="sync-desc">같은 코드를 휴대폰·태블릿·PC에 입력하면 동일한 Work Today 데이터를 공유합니다.</div><div class="sync-field"><input class="sync-input" id="syncCodeInput" autocomplete="off" spellcheck="false"><button class="sync-action" id="copySyncCode" type="button">복사</button></div><div class="sync-actions"><button class="sync-action" id="useSyncCode" type="button">이 코드 사용</button><button class="sync-action" id="newSyncCode" type="button">새 코드</button></div><div class="sync-status" id="syncStatusText"></div><div class="sync-hint">동기화 코드는 비공개로 보관해 주세요.</div></div></div>
<script>
const STORAGE_KEY='lifetown_work_today_compact_v3',SYNC_CODE_KEY='lifetown_work_today_sync_code_v1',SYNC_ENDPOINT='https://dfklyngtjqvlirgrtdfb.supabase.co/functions/v1/work-today-sync';
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36).slice(-4),blank=()=>({id:uid(),text:'',done:false}),dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
let syncCode=localStorage.getItem(SYNC_CODE_KEY)||'',lastRemoteAt='',cloudReady=false,applyingRemote=false,cloudSaveTimer=null;
function load(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(v&&typeof v==='object')return v}catch{}return{lastDate:dateKey(new Date()),today:[blank()],tomorrow:[blank()],week:[blank()],archive:[],archiveOpen:true,sampleSeeded:false}}
const s=load();function saveLocal(){localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}function save(){saveLocal();if(!applyingRemote&&cloudReady&&syncCode)scheduleCloudSave()}function normalize(){['today','tomorrow','week'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];s[k]=s[k].map(x=>({id:x.id||uid(),text:String(x.text||''),done:!!x.done}));if(!s[k].length)s[k]=[blank()]});if(!Array.isArray(s.archive))s.archive=[];if(typeof s.archiveOpen!=='boolean')s.archiveOpen=true;saveLocal()}
function archiveToday(k){(s.today||[]).filter(x=>x.text.trim()).reverse().forEach(x=>s.archive.unshift({id:uid(),text:x.text.trim(),done:!!x.done,date:k}))}
function rollover(){const now=dateKey(new Date());if(!s.lastDate){s.lastDate=now;save();return}if(s.lastDate===now)return;let gap=Math.floor((fromKey(now)-fromKey(s.lastDate))/86400000);if(!Number.isFinite(gap)||gap<1)gap=1;for(let i=0;i<gap;i++){archiveToday(s.lastDate);const moved=(s.tomorrow||[]).filter(x=>x.text.trim()||x.done).map(x=>({id:uid(),text:x.text,done:!!x.done}));s.today=moved.length?moved:[blank()];s.tomorrow=[blank()];const n=fromKey(s.lastDate);n.setDate(n.getDate()+1);s.lastDate=dateKey(n)}s.lastDate=now;save()}
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function updateSectionCount(k){const items=(s[k]||[]).filter(x=>x.text.trim());const done=items.filter(x=>x.done).length,total=items.length,chip=document.getElementById(k+'Count');if(!chip)return;chip.textContent=total?`${done}/${total}`:'0';chip.classList.toggle('has-progress',done>0&&done<total);chip.classList.toggle('complete',total>0&&done===total)}
function renderSection(k){const root=document.getElementById(k+'List');root.innerHTML='';s[k].forEach(t=>{const r=document.createElement('div');r.className='task'+(t.done?' done':'');r.innerHTML=`<button class="check ${t.done?'done':''}">${t.done?'✓':''}</button><input value="${esc(t.text)}" placeholder="메모 입력"><button class="x">×</button>`;r.querySelector('.check').onclick=()=>{t.done=!t.done;save();renderSection(k)};const inp=r.querySelector('input');inp.oninput=e=>{t.text=e.target.value;save();updateSectionCount(k)};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add(k)}};r.querySelector('.x').onclick=()=>{s[k]=s[k].filter(x=>x.id!==t.id);if(!s[k].length)s[k]=[blank()];save();renderSection(k)};root.appendChild(r)});updateSectionCount(k)}
function add(k){s[k].push(blank());save();renderSection(k);const xs=document.querySelectorAll('#'+k+'List input');xs[xs.length-1]?.focus()}
function renderArchive(){const box=document.getElementById('archiveBox'),root=document.getElementById('archiveList');box.classList.toggle('open',s.archiveOpen);document.getElementById('toggleArchive').textContent=s.archiveOpen?'Hide':'Show';document.getElementById('archiveCount').textContent=s.archive.length+' saved';root.innerHTML='';if(!s.archiveOpen)return;if(!s.archive.length){root.innerHTML='<div class="archive-empty">완료된 Today 메모가 날짜가 지나면 여기에 저장됩니다.</div>';return}s.archive.forEach(a=>{const c=document.createElement('div');c.className='arch-item'+(a.done?' is-done':'');c.innerHTML=`<button class="delete-arch">×</button><div class="arch-meta">${a.date}${a.done?' · 완료':''}</div><div class="arch-text">${esc(a.text)}</div>`;c.querySelector('.delete-arch').onclick=()=>{s.archive=s.archive.filter(x=>x.id!==a.id);save();renderArchive()};root.appendChild(c)})}
function renderDates(){const n=new Date(),tm=new Date(n);tm.setDate(n.getDate()+1);document.getElementById('headDate').textContent=n.toLocaleDateString('ko-KR',{weekday:'long',month:'long',day:'numeric'});document.getElementById('todayDate').textContent=n.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});document.getElementById('tomorrowDate').textContent=tm.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});const st=new Date(n),diff=(st.getDay()+6)%7;st.setDate(st.getDate()-diff);const en=new Date(st);en.setDate(st.getDate()+6),f=d=>d.toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'});document.getElementById('weekDate').textContent=f(st)+' – '+f(en)}
function renderAll(){renderDates();renderSection('today');renderSection('tomorrow');renderSection('week');renderArchive()}
function setSyncStatus(mode,label){const b=document.getElementById('syncBtn'),t=document.getElementById('syncStatusText');b.classList.remove('online','syncing','offline');b.classList.add(mode);b.textContent=label||'Sync';if(t&&label)t.textContent=label}
function genCode(){const a=new Uint8Array(18);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,28).toUpperCase()}
async function syncReq(action,payload={}){const r=await fetch(SYNC_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,code:syncCode,...payload}),cache:'no-store'});if(!r.ok)throw new Error('sync_failed');return r.json()}
function scheduleCloudSave(){clearTimeout(cloudSaveTimer);setSyncStatus('syncing','Syncing…');cloudSaveTimer=setTimeout(cloudSave,450)}
async function cloudSave(){if(!syncCode)return;try{await syncReq('save',{state:JSON.parse(JSON.stringify(s))});lastRemoteAt=new Date().toISOString();setSyncStatus('online','Synced')}catch{setSyncStatus('offline','Offline')}}
async function cloudLoad(initial=false){if(!syncCode)return false;try{setSyncStatus('syncing','Syncing…');const d=await syncReq('load');if(d.state){applyingRemote=true;Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,d.state);normalize();applyingRemote=false;saveLocal();lastRemoteAt=d.updated_at||'';renderAll();setSyncStatus('online','Synced');return true}if(initial)await cloudSave();else setSyncStatus('online','Synced');return false}catch{setSyncStatus('offline','Offline');return false}}
async function pollCloud(){if(!cloudReady||!syncCode)return;try{const d=await syncReq('load');if(d.state&&d.updated_at&&(!lastRemoteAt||new Date(d.updated_at)>new Date(lastRemoteAt))){applyingRemote=true;Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,d.state);normalize();applyingRemote=false;saveLocal();lastRemoteAt=d.updated_at;renderAll();setSyncStatus('online','Synced')}}catch{setSyncStatus('offline','Offline')}}
function openSync(){document.getElementById('syncCodeInput').value=syncCode;document.getElementById('syncOverlay').classList.add('open');document.getElementById('syncStatusText').textContent='모든 기기에서 같은 코드를 사용하세요.'}
function closeSync(){document.getElementById('syncOverlay').classList.remove('open')}
async function useCode(){const v=document.getElementById('syncCodeInput').value.trim().toUpperCase().replace(/\s+/g,'');if(v.length<16){document.getElementById('syncStatusText').textContent='코드가 너무 짧습니다.';return}syncCode=v;localStorage.setItem(SYNC_CODE_KEY,syncCode);cloudReady=true;const found=await cloudLoad(false);if(!found)await cloudSave();document.getElementById('syncCodeInput').value=syncCode}
async function newCode(){syncCode=genCode();localStorage.setItem(SYNC_CODE_KEY,syncCode);cloudReady=true;document.getElementById('syncCodeInput').value=syncCode;await cloudSave();document.getElementById('syncStatusText').textContent='새 동기화 공간을 만들었습니다.'}
async function copyCode(){try{await navigator.clipboard.writeText(syncCode);document.getElementById('syncStatusText').textContent='동기화 코드를 복사했습니다.'}catch{const i=document.getElementById('syncCodeInput');i.select();document.execCommand('copy');document.getElementById('syncStatusText').textContent='동기화 코드를 복사했습니다.'}}
async function initSync(){if(!syncCode){syncCode=genCode();localStorage.setItem(SYNC_CODE_KEY,syncCode)}cloudReady=true;await cloudLoad(true);setInterval(pollCloud,5000)}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));document.getElementById('toggleArchive').onclick=()=>{s.archiveOpen=!s.archiveOpen;save();renderArchive()};document.getElementById('clearArchive').onclick=()=>{s.archive=[];save();renderArchive()};document.getElementById('syncBtn').onclick=openSync;document.getElementById('syncClose').onclick=closeSync;document.getElementById('syncOverlay').onclick=e=>{if(e.target.id==='syncOverlay')closeSync()};document.getElementById('useSyncCode').onclick=useCode;document.getElementById('newSyncCode').onclick=newCode;document.getElementById('copySyncCode').onclick=copyCode;rollover();normalize();renderAll();initSync();
</script>
<script src="./assets/life-town-controls-v2.js"></script>
</body>
</html>
