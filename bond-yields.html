<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Bond Yields</title>
<style>
:root{
  --panel:#fff;--line:#ebe8e1;--line-soft:#f3f1ec;--soft:#f8f7f3;
  --text:#202326;--sub:#303438;--muted:#666b70;
  --green:#5d9a5f;--green-soft:#eef5ee;--red:#d9756f;--red-soft:#faeded;
  --amber:#d9ad52;--ctrl:rgba(255,255,255,.95);--shadow:0 8px 22px rgba(20,20,18,.04)
}
html[data-theme="dark"]{
  --panel:#202120;--line:#383733;--line-soft:#2d2d2a;--soft:#292926;
  --text:#efefeb;--sub:#c1c4bf;--muted:#8f938f;
  --green:#84bb84;--green-soft:#263426;--red:#e28b84;--red-soft:#392725;
  --amber:#e0c470;--ctrl:rgba(35,35,33,.95);--shadow:none
}
*{box-sizing:border-box}html,body{margin:0;background:transparent}
body{padding:8px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.root{position:relative;width:min(100%,560px);margin:0 auto;transition:width .18s ease}
.root[data-size="compact"]{width:min(100%,520px)}.root[data-size="normal"]{width:min(100%,560px)}.root[data-size="large"]{width:min(100%,620px)}
.widget{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;box-shadow:var(--shadow)}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:790;letter-spacing:-.02em}
.brand svg{width:16px;height:16px;color:var(--text)}
.top-actions{display:flex;align-items:center;gap:9px;color:var(--text)}
.icon-btn{width:18px;height:18px;border:0;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;color:inherit}
.icon-btn svg{width:15px;height:15px}.icon-btn.active{color:var(--green)}
.market-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.market-tab{height:28px;min-width:44px;padding:0 12px;border-radius:7px;border:1px solid transparent;background:transparent;font-size:10px;font-weight:750;color:var(--text);cursor:pointer}
.market-tab.active{background:var(--soft);color:var(--text);border-color:var(--line)}
.layout{display:grid;grid-template-columns:1.02fr 1.38fr;gap:12px;align-items:start;border-top:1px solid var(--line-soft);padding-top:10px}
.main-kicker{font-size:10px;font-weight:700;color:var(--text);margin-top:2px}
.main-country{margin-top:5px;font-size:10px;color:var(--text);font-weight:560}
.main-price{margin-top:9px;font-size:24px;font-weight:790;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.main-change{display:flex;align-items:center;gap:6px;margin-top:10px;color:var(--green);font-size:11px;font-weight:760}
.main-change.down{color:var(--red)}
.main-change small{font-size:10px;color:var(--text);font-weight:560}
.chart-box{height:92px;padding-top:7px;display:flex;align-items:flex-end}.chart{width:100%;height:78px;display:block}
.chart path{fill:none;stroke:var(--sub);stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.table{margin-top:10px;border-top:1px solid var(--line-soft)}
.thead,.row{display:grid;grid-template-columns:1.2fr .9fr .72fr;gap:10px;align-items:center}
.thead{padding:8px 0 7px;font-size:9px;font-weight:780;color:var(--text)}
.row{padding:8px 0;border-top:1px solid var(--line-soft)}
.term{font-size:12px;font-weight:780;white-space:nowrap}
.rate{font-size:11px;font-weight:750;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bp{font-size:11px;font-weight:760;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.up{color:var(--green)}.down{color:var(--red)}
.spread{margin-top:8px;padding:9px 10px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:10px}
.spread-copy{min-width:0}.spread-title{font-size:10px;font-weight:700;color:var(--text)}.spread-state{margin-top:3px;font-size:9px;color:var(--text)}.spread-value{font-size:12px;font-weight:780;white-space:nowrap;font-variant-numeric:tabular-nums}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line-soft)}
.stamp{font-size:9.5px;color:var(--muted);white-space:nowrap}.footright{display:flex;align-items:center;gap:7px;min-width:0}.sourcepill{font-size:8.8px;color:var(--muted);white-space:nowrap}.statusdot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:0 0 auto}.statusdot.stale{background:var(--amber)}
.loading,.error{padding:36px 10px;text-align:center;font-size:11px;color:var(--muted)}
.controls{position:absolute;top:10px;right:-36px;display:flex;flex-direction:column;gap:7px;opacity:0;transform:translateX(6px);pointer-events:none;transition:opacity .18s ease,transform .18s ease}
.controls:before{content:"";position:absolute;left:-10px;top:0;width:10px;height:100%}.root:hover .controls,.root:focus-within .controls{opacity:1;transform:none;pointer-events:auto}
.ctrl{position:relative;width:28px;height:28px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--ctrl);cursor:pointer;box-shadow:0 2px 8px rgba(20,20,20,.05)}
.ctrl:hover{background:var(--soft)}.ctrl[disabled]{opacity:.42;cursor:not-allowed}.ctrl svg{width:14px;height:14px}
.ctrl:after{content:attr(data-tip);position:absolute;right:35px;top:50%;transform:translateY(-50%);padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-size:9px;color:var(--sub);white-space:nowrap;opacity:0;pointer-events:none}.ctrl:hover:after,.ctrl:focus-visible:after{opacity:1}
@media(max-width:540px){.layout{grid-template-columns:1fr}.chart-box{height:80px}.chart{height:68px}.thead,.row{grid-template-columns:1.15fr .88fr .72fr}}
@media(max-width:430px){.controls{right:7px;top:7px;opacity:1;transform:none;pointer-events:auto;flex-direction:row}.ctrl:after{display:none}.header{padding-right:126px}.market-tab{min-width:38px;padding:0 10px}}
@media(hover:none),(pointer:coarse){.controls{opacity:1;transform:none;pointer-events:auto}}
</style>
</head>
<body>
<div class="root" id="root" data-size="normal">
  <div class="widget">
    <header class="header">
      <div class="brand"><svg viewBox="0 0 24 24" fill="none"><path d="M5 18.5h14M7 16V9M12 16V6M17 16V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4.5 8 12 3l7.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>BOND YIELDS</span></div>
      <div class="top-actions">
        <button class="icon-btn" id="pinBtn" aria-label="Pin"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m15.8 3 5.2 5.2-3 1.2-2.8 5.2-2.1-2.1-4.4 4.4-1.1-1.1 4.4-4.4-2.1-2.1 5.2-2.8L15.8 3Z"/></svg></button>
        <button class="icon-btn" id="refreshBtn" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none"><path d="M20 7v5h-5M4 17v-5h5M17.5 9A6.5 6.5 0 0 0 6.6 7L4 12M6.5 15A6.5 6.5 0 0 0 17.4 17L20 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </header>
    <div class="market-tabs"><button class="market-tab active" data-country="KR">KOR</button><button class="market-tab" data-country="US">US</button></div>
    <div id="content" class="loading">국채 금리 데이터를 불러오는 중...</div>
  </div>
  <div class="controls" aria-label="Widget controls">
    <button class="ctrl" id="sizeBtn" data-tip="Size" aria-label="Size"><svg viewBox="0 0 24 24" fill="none"><path d="M6 8h12M6 12h9M6 16h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button class="ctrl" id="themeBtn" data-tip="Dark Mode" aria-label="Dark Mode"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3.7a8.3 8.3 0 1 0 8.3 8.3A6.5 6.5 0 1 1 12 3.7Z" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button class="ctrl" id="lockBtn" data-tip="Lock" aria-label="Lock"><svg id="lockSvg" viewBox="0 0 24 24" fill="none"><path d="M7 11V8.5a5 5 0 0 1 10 0V11" stroke="currentColor" stroke-width="1.8"/><rect x="5" y="11" width="14" height="9" rx="2.5" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button class="ctrl" id="resetBtn" data-tip="Reset" aria-label="Reset"><svg viewBox="0 0 24 24" fill="none"><path d="M19 7v4h-4M5 17v-4h4M17.5 9A6.5 6.5 0 0 0 6.6 7L5 11M6.5 15A6.5 6.5 0 0 0 17.4 17L19 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div>
</div>
<script>
const KEY='widget.bondYields.controls.v3',PIN='widget.bondYields.pin.v1',TAB='widget.bondYields.country.v3';
const root=document.getElementById('root'),q=new URLSearchParams(location.search),osTheme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
let settings={theme:osTheme,size:'normal',locked:false};try{settings={...settings,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{};if(q.get('theme')==='light'||q.get('theme')==='dark')settings.theme=q.get('theme');
function save(){localStorage.setItem(KEY,JSON.stringify(settings))}function applyTheme(v){document.documentElement.dataset.theme=v;settings.theme=v;save()}function applySize(v){root.dataset.size=v;settings.size=v;save();document.getElementById('sizeBtn').disabled=settings.locked}function applyLock(v){settings.locked=v;save();document.getElementById('sizeBtn').disabled=v;document.getElementById('lockBtn').dataset.tip=v?'Unlock':'Lock'}
applyTheme(settings.theme);applySize(settings.size);applyLock(settings.locked);
document.getElementById('themeBtn').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
document.getElementById('sizeBtn').onclick=()=>{if(settings.locked)return;const arr=['compact','normal','large'];applySize(arr[(arr.indexOf(settings.size)+1)%arr.length])};
document.getElementById('lockBtn').onclick=()=>applyLock(!settings.locked);document.getElementById('resetBtn').onclick=()=>{settings={theme:q.get('theme')||osTheme,size:'normal',locked:false};applyTheme(settings.theme);applySize('normal');applyLock(false)};
const pinBtn=document.getElementById('pinBtn');let pinned=localStorage.getItem(PIN)==='1';pinBtn.classList.toggle('active',pinned);pinBtn.onclick=()=>{pinned=!pinned;localStorage.setItem(PIN,pinned?'1':'0');pinBtn.classList.toggle('active',pinned)};
let state={country:localStorage.getItem(TAB)||'KR',data:null};
function fmtRate(v){return Number(v).toFixed(2)+'%'}function cls(v){return Number(v)>=0?'up':'down'}function bp(v){const n=Number(v)||0;return `${n>=0?'▲':'▼'} ${Math.abs(n).toFixed(1)}bp`}function termLabel(t){return t==='3M'?'3개월물':t.replace('Y','년물')}
function relStamp(iso){try{const d=new Date(iso);return 'As of '+d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Seoul'})+' KST'}catch{return 'As of latest update'}}
function spark(values){const vals=(values||[]).map(x=>Number(x[1])).filter(Number.isFinite);if(!vals.length)return '';const arr=vals.length===1?[vals[0],vals[0]]:vals;const w=220,h=78,p=4,min=Math.min(...arr),max=Math.max(...arr),span=max-min||1;const d=arr.map((v,i)=>{const x=p+i*(w-p*2)/(arr.length-1||1),y=p+(max-v)*(h-p*2)/span;return`${i?'L':'M'}${x.toFixed(2)},${y.toFixed(2)}`}).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}"/></svg>`}
function spreadState(v){if(v<0)return '역전 구간';if(v<25)return '평탄 구간';return '정상 기울기'}
function render(){const data=state.data,c=data?.countries?.[state.country];if(!c){document.getElementById('content').innerHTML='<div class="error">데이터 없음</div>';return}const main=c.yields?.[c.main]||{},rows=Object.entries(c.yields||{}).map(([t,v])=>`<div class="row"><div class="term">${termLabel(t)}</div><div class="rate">${fmtRate(v.yield)}</div><div class="bp ${cls(v.change_bp)}">${bp(v.change_bp)}</div></div>`).join(''),spread=Number(c.spread?.value_bp)||0;document.getElementById('content').innerHTML=`<div class="layout"><div><div class="main-kicker">10년물 국채 수익률</div><div class="main-country">${c.label} · ${c.main}</div><div class="main-price">${fmtRate(main.yield)}</div><div class="main-change ${cls(main.change_bp)}">${bp(main.change_bp)} <small>전일 대비</small></div></div><div class="chart-box">${spark(c.history)}</div></div><div class="table"><div class="thead"><div>MATURITY</div><div style="text-align:right">YIELD</div><div style="text-align:right">CHANGE</div></div>${rows}</div><div class="spread"><div class="spread-copy"><div class="spread-title">${c.spread?.label||'장단기 금리차'}</div><div class="spread-state">${spreadState(spread)}</div></div><div class="spread-value ${spread<0?'down':'up'}">${spread>=0?'+':''}${spread.toFixed(1)}bp</div></div><div class="footer"><div class="stamp">${relStamp(data.generated_at)}</div><div class="footright"><span class="sourcepill">TradingView TVC · delayed/indicative</span><span class="statusdot ${data.stale?'stale':''}"></span></div></div>`;document.querySelectorAll('.market-tab').forEach(b=>b.classList.toggle('active',b.dataset.country===state.country));}
document.querySelectorAll('.market-tab').forEach(b=>b.onclick=()=>{state.country=b.dataset.country;localStorage.setItem(TAB,state.country);render()});
async function load(){try{const r=await fetch('./bond-yields-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);state.data=await r.json();render()}catch(e){document.getElementById('content').innerHTML='<div class="error">데이터를 불러오지 못했습니다.</div>'}}
document.getElementById('refreshBtn').onclick=()=>load();load();
</script>
</body>
</html>
