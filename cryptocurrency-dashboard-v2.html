<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>암호화폐 시장 · Life Town v2</title>
<link rel="stylesheet" href="./assets/life-town-v2.css">
<style>
:root{--panel:#fff;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--line:#e5e5e8;--line2:#f0f0f2;--soft:#f7f7f8;--blue:#007aff;--green:#34c759;--yellow:#ffcc00;--yellow-ink:#8d7000;--red:#ff3b30;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}
html[data-lt-theme="dark"]{--panel:#1c1c1e;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--line:#38383a;--line2:#2c2c2e;--soft:#2c2c2e;--blue:#0a84ff;--green:#30d158;--yellow:#ffd60a;--yellow-ink:#ffd60a;--red:#ff453a;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}.root{width:100%;max-width:560px;margin:auto;container-type:inline-size}.widget{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px 14px 11px;box-shadow:var(--shadow);overflow:hidden}.widget:before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:linear-gradient(90deg,transparent,#b8b8bd 22%,#f5f5f7 50%,#b8b8bd 78%,transparent);opacity:.52}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.title{font-size:18px;font-weight:760;letter-spacing:-.04em;line-height:1.08}.sub{margin-top:4px;font-size:10px;color:var(--muted)}.actions{display:flex;gap:5px}.icon{width:28px;height:28px;border:1px solid var(--line);border-radius:9px;background:var(--panel);display:grid;place-items:center;color:var(--sub);cursor:pointer}.icon:hover{background:var(--soft);color:var(--text)}.icon svg{width:13px;height:13px}.filter-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:11px;padding:3px;border-radius:11px;background:var(--soft)}.range-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:8px;padding-bottom:9px;border-bottom:1px solid var(--line)}.tab{border:0;background:transparent;cursor:pointer;font-weight:680;color:var(--sub)}.filter-tabs .tab{height:29px;border-radius:8px;font-size:9.5px}.filter-tabs .tab.active{background:var(--panel);color:var(--blue);box-shadow:0 1px 2px rgba(0,0,0,.05)}.range-tabs .tab{height:24px;border-radius:7px;font-size:9px}.range-tabs .tab.active{background:rgba(255,204,0,.12);color:var(--yellow-ink)}.table{border-top:0}.thead,.row{display:grid;grid-template-columns:1.28fr .95fr .82fr .62fr .88fr;gap:9px;align-items:center}.thead{padding:9px 0 6px;font-size:8.8px;font-weight:700;color:var(--muted)}.row{position:relative;padding:9px 0 9px 8px;border-top:1px solid var(--line2)}.row:before{content:"";position:absolute;left:0;top:50%;width:3px;height:18px;border-radius:999px;transform:translateY(-50%)}.row:nth-child(2):before{background:var(--yellow)}.row:nth-child(3):before{background:var(--blue)}.row:nth-child(4):before{background:var(--green)}.row:nth-child(5):before{background:var(--red)}.row:nth-child(6):before{background:var(--blue)}.coin-wrap{display:flex;align-items:baseline;gap:6px;min-width:0}.coin{font-size:11px;font-weight:760;white-space:nowrap}.name{font-size:9px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:10.3px;font-weight:700;white-space:nowrap}.change,.pct{font-size:9.4px;font-weight:700;white-space:nowrap;text-align:right}.up{color:var(--green)}.down{color:var(--red)}.spark{height:24px}.spark svg{width:100%;height:100%;display:block}.footer{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-top:8px;margin-top:1px;border-top:1px solid var(--line);font-size:8.8px;color:var(--muted)}.source{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fresh{white-space:nowrap}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:4px}.dot.stale{background:var(--yellow)}.empty,.loading,.error{padding:30px 8px;text-align:center;font-size:10px;color:var(--muted)}
@container(max-width:470px){.name{display:none}.thead,.row{grid-template-columns:1.02fr .95fr .8fr .62fr .8fr;gap:6px}.title{font-size:17px}}
</style>
</head>
<body><div class="root"><main class="widget" data-widget-control-root data-control-sizes="500,530,560">
<header class="header"><div><div class="title">암호화폐 시장</div><div class="sub">업비트 KRW · 주요 코인 흐름</div></div><div class="actions"><button class="icon" id="copyBtn" aria-label="링크 복사"><svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="5" y="5" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/></svg></button><button class="icon" id="refreshBtn" aria-label="새로고침"><svg viewBox="0 0 24 24" fill="none"><path d="M20 7v5h-5M4 17v-5h5M17.5 9A6.5 6.5 0 0 0 6.6 7L4 12M6.5 15A6.5 6.5 0 0 0 17.4 17L20 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></header>
<div class="filter-tabs" id="filterTabs"></div><div class="range-tabs" id="rangeTabs"></div><div id="content" class="loading">가상자산 데이터를 불러오는 중...</div>
</main></div>
<script>
const FALLBACK={updated_at:null,source:'Upbit Open API · KRW spot',stale:true,filters:['ALL','TOP GAINERS','TOP LOSERS'],ranges:['1D','1W','1M','3M','1Y'],activeFilter:'ALL',activeRange:'1D',coins:[]};
let state={data:FALLBACK,filter:FALLBACK.activeFilter,range:FALLBACK.activeRange};const $=s=>document.querySelector(s),FILTER_LABEL={'ALL':'전체','TOP GAINERS':'상승','TOP LOSERS':'하락'};function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function formatKRW(n){return '₩'+Number(n).toLocaleString('ko-KR')}function formatChange(n){return`${n>=0?'▲':'▼'} ${Math.abs(Number(n)).toLocaleString('ko-KR')}`}function trendClass(n){return n>=0?'up':'down'}function labelStamp(iso){if(!iso)return'데이터 대기';try{const d=new Date(iso);return d.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return'데이터 대기'}}function linePath(values,w,h,p=1.5){const min=Math.min(...values),max=Math.max(...values),span=max-min||1;return values.map((v,i)=>{const x=p+i*(w-p*2)/(values.length-1||1),y=p+(max-v)*(h-p*2)/span;return`${i?'L':'M'}${x.toFixed(2)},${y.toFixed(2)}`}).join(' ')}function spark(values,positive=true){const w=70,h=24;if(!values||!values.length)return'';return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${linePath(values,w,h,1.5)}" fill="none" stroke="${positive?'var(--green)':'var(--red)'}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function getRows(){let a=[...(state.data.coins||[])];if(state.filter==='TOP GAINERS')a=a.filter(x=>x.change_pct>0).sort((a,b)=>b.change_pct-a.change_pct);else if(state.filter==='TOP LOSERS')a=a.filter(x=>x.change_pct<0).sort((a,b)=>a.change_pct-b.change_pct);return a.slice(0,5)}function renderTabs(){$('#filterTabs').innerHTML=(state.data.filters||[]).map(f=>`<button class="tab ${f===state.filter?'active':''}" data-filter="${f}">${FILTER_LABEL[f]||f}</button>`).join('');$('#rangeTabs').innerHTML=(state.data.ranges||[]).map(r=>`<button class="tab ${r===state.range?'active':''}" data-range="${r}">${r}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;renderAll()});document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{state.range=b.dataset.range;renderAll()})}
function renderAll(){renderTabs();const rows=getRows(),last=state.range==='1D'?'7D':state.range,body=rows.length?rows.map(r=>`<div class="row"><div class="coin-wrap"><span class="coin">${esc(r.symbol)}</span><span class="name">${esc(r.name)}</span></div><div class="price">${formatKRW(r.price_krw)}</div><div class="change ${trendClass(r.change_krw)}">${formatChange(r.change_krw)}</div><div class="pct ${trendClass(r.change_pct)}">${Number(r.change_pct).toFixed(2)}%</div><div class="spark">${spark((r.series||{})[state.range]||[],r.change_pct>=0)}</div></div>`).join(''):`<div class="empty">실시간 데이터를 준비 중입니다.</div>`;$('#content').outerHTML=`<div id="content"><div class="table"><div class="thead"><div>코인</div><div>가격</div><div style="text-align:right">변동</div><div style="text-align:right">%</div><div style="text-align:right">${last}</div></div>${body}</div><div class="footer"><div class="source">${esc(state.data.source||'Upbit Open API · KRW spot')}</div><div class="fresh">${labelStamp(state.data.updated_at)} <span class="dot ${state.data.stale?'stale':''}"></span></div></div></div>`}
async function load(){try{const r=await fetch('./cryptocurrency-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);state.data={...FALLBACK,...await r.json()};state.filter=state.data.activeFilter||state.filter;state.range=state.data.activeRange||state.range}catch{state.data=FALLBACK}renderAll()}$('#refreshBtn').onclick=load;$('#copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(location.href)}catch{}};load();
</script><script src="./assets/life-town-controls-v2.js"></script>
</body></html>
