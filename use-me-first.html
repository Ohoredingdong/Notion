function localToday(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}function addDaysISO(n){const d=localToday();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parseISO(v){const[y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d)}function daysLeft(v){return Math.ceil((parseISO(v)-localToday())/86400000)}function sampleItems(){return[{name:'두부',expiry:addDaysISO(1)},{name:'시금치',expiry:addDaysISO(2)},{name:'닭가슴살',expiry:addDaysISO(3)},{name:'김치',expiry:addDaysISO(4)},{name:'우유',expiry:addDaysISO(6)},{name:'양파',expiry:addDaysISO(7)}]}function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)&&v.length?v:sampleItems()}catch(e){return sampleItems()}}let items=load();function save(){localStorage.setItem(KEY,JSON.stringify(items))}function tone(d){if(d<=1)return{a:'#ed6a61',t:'#fff0ef'};if(d<=2)return{a:'#ef8d32',t:'#fff3e8'};if(d<=4)return{a:'#eeba43',t:'#fff8e7'};if(d<=6)return{a:'#5cae9e',t:'#eaf7f4'};return{a:'#5f8c67',t:'#eef5ee'}}function fmt(v){const d=parseISO(v);return `${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}까지`}function dText(d){if(d<0)return`D+${Math.abs(d)}`;if(d===0)return'D-DAY';return`D-${d}`}function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt',"'":'&#39;','"':'&quot;'}[c]))}
function canon(n){return n.replace(/플레인/g,'').replace(/요구르트/g,'요거트').replace(/달걀/g,'계란').trim()}
function hasIngredient(target){const t=canon(target);return items.some(i=>{const n=canon(i.name);return n.includes(t)||t.includes(n)})}
function findItem(target){const t=canon(target);return items.find(i=>{const n=canon(i.name);return n.includes(t)||t.includes(n)})}
function renderItems(){items.sort((a,b)=>daysLeft(a.expiry)-daysLeft(b.expiry));const view=showAll?items:items.slice(0,6),box=$('#list');box.innerHTML='';if(!view.length)box.innerHTML='<div class="empty">재료를 추가하면 여기에 임박순으로 정리돼요.</div>';view.forEach(it=>{const d=daysLeft(it.expiry),c=tone(d),urg=Math.max(14,Math.min(96,96-Math.max(0,d)*10)),m=iconMeta(it.name),idx=items.indexOf(it),row=document.createElement('div');row.className='row';row.style.setProperty('--a',c.a);row.style.setProperty('--b',c.t);row.style.setProperty('--ibg',m.bg);row.innerHTML=`<div class="ic">${iconSvg(it.name)}</div><div><div class="nm">${esc(it.name)}</div><div class="ex">${fmt(it.expiry)}</div></div><div class="bar"><span style="width:${urg}%"></span></div><div class="day">${dText(d)}</div><button class="rm" data-i="${idx}">×</button>`;box.appendChild(row)});$('#summary').textContent=`재료 ${items.length}개 · 가장 임박 ${items.length?dText(daysLeft(items[0].expiry)):'—'}`;$('#toggleAll').textContent=showAll?'접어두기 ↑':`전체 재료 ${items.length}개 보기 ›`;document.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.i,1);save();renderAll()})}
function rankRecipes(){return OFFICIAL.filter(r=>r.required.every(hasIngredient)).map(r=>{const used=r.ingredients.filter(hasIngredient);const score=used.reduce((s,n)=>{const i=findItem(n);return s+(i?Math.max(1,12-Math.max(0,daysLeft(i.expiry))):0)},0)+used.length*4+r.required.length*6;return{...r,used,score}}).sort((a,b)=>b.score-a.score)}
function showFallback(msg){$('#recipeImage').style.display='none';$('#fallback').style.display='flex';$('#fallbackText').textContent=msg;$('#sourceTag').style.display='none'}
function showPhoto(r){const img=$('#recipeImage');$('#fallback').style.display='none';$('#sourceTag').style.display='block';img.style.display='block';img.onerror=()=>showFallback('공식 이미지가 일시적으로 열리지 않아요');img.src=r.image;img.alt=r.name}
function renderRecipe(){eligible=rankRecipes();if(!eligible.length){$('#recipeName').textContent='지금 재료로 바로 만들 공식 레시피가 없어요';$('#recipeDesc').textContent='핵심 재료가 빠진 메뉴는 추천에서 제외했어요.';$('#useCount').textContent='';$('#recipeTime').textContent='—';$('#recipeServing').textContent='—';$('#recipeLevel').textContent='—';$('#chips').innerHTML='';$('#detail').innerHTML='<div class="dt">추천 기준</div><div style="font-size:8.7px;line-height:1.55;color:#6c716b">메뉴 이름을 결정하는 핵심 재료가 냉장고에 모두 있을 때만 추천합니다. 예를 들어 딸기가 없으면 딸기소스 메뉴는 나오지 않아요.</div>';showFallback('핵심 재료가 맞는 공식 레시피가 없어요');$('#detailBtn').disabled=false;$('#nextRecipe').disabled=true;return}recipeIndex%=eligible.length;const r=eligible[recipeIndex];$('#recipeName').textContent=r.name;$('#recipeDesc').textContent=r.desc;$('#useCount').textContent=`내 재료 ${r.used.length}개 사용`;$('#recipeTime').textContent=r.time;$('#recipeServing').textContent=r.serving;$('#recipeLevel').textContent=r.level;$('#chips').innerHTML=r.used.map(n=>`<span class="chip">${iconSvg(n)}${esc(n)}</span>`).join('');$('#detail').innerHTML=`<div class="dt">조리 순서</div><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="official"><span>출처 · 식품안전나라</span><a href="${r.source}" target="_blank" rel="noopener">공식 원문 보기 ↗</a></div>`;showPhoto(r);$('#detailBtn').disabled=false;$('#nextRecipe').disabled=eligible.length<2}
function renderAll(){renderItems();renderRecipe()}
$('#toggleAll').onclick=()=>{showAll=!showAll;renderItems()};$('#nextRecipe').onclick=()=>{if(eligible.length>1){recipeIndex=(recipeIndex+1)%eligible.length;$('#detail').classList.remove('open');$('#detailBtn').textContent='레시피 보기';renderRecipe()}};$('#detailBtn').onclick=()=>{const d=$('#detail');d.classList.toggle('open');$('#detailBtn').textContent=d.classList.contains('open')?'레시피 접기':'레시피 보기'};
const modal=$('#modalbg');function openModal(){modal.classList.add('on');$('#itemName').value='';$('#itemExpiry').value=addDaysISO(3);setTimeout(()=>$('#itemName').focus(),50)}function closeModal(){modal.classList.remove('on')}$('#openAdd').onclick=openModal;$('#closeAdd').onclick=closeModal;$('#cancelAdd').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};$('#saveItem').onclick=()=>{const name=$('#itemName').value.trim(),expiry=$('#itemExpiry').value;if(!name||!expiry)return;items.push({name,expiry});save();showAll=false;recipeIndex=0;closeModal();renderAll()};renderAll();
</script></body></html>
