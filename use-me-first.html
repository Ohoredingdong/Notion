<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Use Me First</title><style>:root{--ink:#242720;--sub:#777d76;--mut:#9ca19a;--line:#e7eae4;--sage:#668668;--cream:#fffaf4}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:5px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}button,input{font:inherit}.w{width:min(100%,430px);margin:auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 14px 13px;box-shadow:0 6px 22px rgba(43,49,43,.045)}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 2px 16px}.title{font-size:26px;font-weight:770;letter-spacing:-.045em;line-height:1}.sub{margin-top:7px;font-size:11px;color:var(--sub)}button{cursor:pointer}.add{border:1px solid #d9e5d8;background:#f2f7f1;color:#52795a;border-radius:10px;padding:8px 10px;font-size:10px;font-weight:720}.sec+.sec{margin-top:17px}.sh{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:0 2px 8px}.st{font-size:12px;font-weight:730}.ss{font-size:8.8px;color:var(--mut);margin-top:3px}.sort{font-size:8.5px;color:#687169;background:#f6f7f4;border:1px solid #e7e9e3;padding:4px 7px;border-radius:999px}.card{border:1px solid var(--line);border-radius:14px;overflow:hidden}.row{--a:#668668;--b:#eef5ee;display:grid;grid-template-columns:34px 92px minmax(52px,1fr) 48px 18px;align-items:center;gap:7px;min-height:48px;padding:7px 9px;border-bottom:1px solid #eff0ed}.row:last-child{border-bottom:0}.row:hover{background:#fcfcfa}.ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--ibg,#f6f7f3);border:1px solid var(--ibd,#e7e8e1)}.ic svg{width:21px;height:21px}.nm{font-size:11.5px;font-weight:690;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ex{margin-top:2px;font-size:8.4px;color:#9a9e98}.bar{height:6px;background:#eff0ed;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:var(--a);border-radius:inherit}.day{justify-self:end;min-width:44px;padding:5px 6px;border-radius:9px;text-align:center;font-size:9.5px;font-weight:760;color:var(--a);background:var(--b)}.rm{border:0;background:transparent;color:#c0c3be;padding:0;font-size:15px;opacity:0}.row:hover .rm{opacity:1}.foot{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-top:1px solid #eff0ed;background:#fcfcfa;font-size:8.8px;color:#8b9089}.link{border:0;background:transparent;color:#667c68;font-size:8.8px;font-weight:650;padding:0}.recipe{border:1px solid #efdfca;border-radius:15px;background:var(--cream);overflow:hidden}.rt{display:grid;grid-template-columns:138px 1fr;min-height:132px}.visual{position:relative;background:#f4eee6;overflow:hidden}.photo{width:100%;height:100%;min-height:132px;display:block;object-fit:cover}.source-tag{position:absolute;left:7px;bottom:7px;padding:3px 6px;border-radius:999px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.65);font-size:7.5px;color:#6b706a;backdrop-filter:blur(5px)}.fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:5px;background:#f7efe4;color:#81867f;font-size:8px}.fallback svg{width:36px;height:36px}.copy{padding:11px 11px 9px;display:flex;flex-direction:column;justify-content:center;min-width:0}.labels{display:flex;align-items:center;gap:5px}.rec{font-size:8.5px;font-weight:750;color:#d88e16;background:#fff7e7;border:1px solid #f1d59e;border-radius:999px;padding:3px 6px}.use{font-size:8px;color:#858a82}.rname{margin-top:6px;font-size:15px;font-weight:760;line-height:1.24;letter-spacing:-.04em;word-break:keep-all}.rdesc{margin-top:4px;font-size:8.8px;color:var(--sub);line-height:1.42}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.meta span{padding:4px 6px;border-radius:7px;background:#fff;border:1px solid #eee7de;font-size:8.4px;color:#626761}.rb{padding:9px 10px 10px;border-top:1px solid #f0e3d2;background:rgba(255,255,255,.42)}.ul{font-size:8px;color:#8b8d87;margin-bottom:6px}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:999px;background:#fff;border:1px solid #ece9e2;font-size:8.5px;color:#5d625c}.chip svg{width:13px;height:13px}.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.act{border-radius:9px;padding:7px 8px;font-size:9px;font-weight:680;border:1px solid #e7e5df;background:#fff;color:#5e645e}.act.primary{background:#657f64;border-color:#657f64;color:#fff}.detail{display:none;border-top:1px solid #eee4d7;padding:10px;background:#fffdf9}.detail.open{display:block}.dt{font-size:9px;font-weight:730;margin-bottom:5px}.detail ol{margin:0;padding-left:15px;font-size:8.7px;line-height:1.55;color:#6c716b}.official{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:8px;padding-top:7px;border-top:1px dashed #eee7df;font-size:8.2px;color:#92968f}.official a{color:#607e62;text-decoration:none;font-weight:700}.tip{margin-top:10px;padding:9px 10px;border-radius:11px;background:#f4f7f1;border:1px solid #e2e9dd;color:#697166;font-size:8.7px}.modalbg{position:fixed;inset:0;background:rgba(24,30,26,.18);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modalbg.on{display:flex}.modal{width:min(100%,360px);background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 18px 50px rgba(30,36,31,.16)}.mh{display:flex;justify-content:space-between;align-items:center}.mt{font-size:14px;font-weight:750}.close{border:0;background:transparent;font-size:20px;color:#939790}.field{margin-top:11px}.field label{display:block;font-size:8.8px;color:#7b8079;margin-bottom:5px}.field input{width:100%;border:1px solid #e2e5df;border-radius:10px;padding:9px 10px;font-size:11px;outline:none}.ma{display:grid;grid-template-columns:1fr 1.3fr;gap:7px;margin-top:13px}.ma button{padding:8px;border-radius:9px;border:1px solid #e3e6e0;background:#fff;font-size:9.5px;font-weight:680}.ma .save{background:#628564;border-color:#628564;color:#fff}.empty{padding:20px;text-align:center;color:#969a94;font-size:9px}@media(max-width:390px){body{padding:3px}.w{padding:14px 10px 11px;border-radius:14px}.title{font-size:24px}.row{grid-template-columns:31px 82px minmax(42px,1fr) 44px 16px;gap:5px;padding:6px 7px;min-height:45px}.ic{width:28px;height:28px}.ic svg{width:19px;height:19px}.rt{grid-template-columns:122px 1fr}.rname{font-size:14px}}@media(max-width:330px){.rt{grid-template-columns:1fr}.photo{height:135px}.acts{grid-template-columns:1fr}.ss{display:none}}</style></head><body><main class="w"><header class="head"><div><div class="title">Use Me First</div><div class="sub">먼저 써야 할 재료부터, 가볍게 정리해요.</div></div><button class="add" id="openAdd">＋ 재료 추가</button></header><section class="sec"><div class="sh"><div><div class="st">냉장고 속 재료</div><div class="ss">소비 기한이 가까운 순서로 보여줘요</div></div><div class="sort">임박순</div></div><div class="card"><div id="list"></div><div class="foot"><span id="summary">재료 0개</span><button class="link" id="toggleAll">전체 재료 보기 ›</button></div></div></section><section class="sec"><div class="sh"><div><div class="st">오늘의 추천 메뉴</div><div class="ss">식품안전나라 공식 레시피 중 임박 재료와 잘 맞는 메뉴를 추천해요</div></div></div><div class="recipe"><div class="rt"><div class="visual"><img class="photo" id="recipeImage" alt="추천 메뉴"><div class="fallback" id="fallback"><svg viewBox="0 0 24 24" fill="none"><path d="M4 17h16M6 17c0-5 3-9 6-9s6 4 6 9" stroke="#758176" stroke-width="1.5"/><path d="M10 7h4" stroke="#758176" stroke-width="1.5"/></svg><span>공식 이미지 준비 중</span></div><span class="source-tag">식품안전나라</span></div><div class="copy"><div class="labels"><span class="rec">★ 추천</span><span class="use" id="useCount"></span></div><div class="rname" id="recipeName">—</div><div class="rdesc" id="recipeDesc">—</div><div class="meta"><span id="recipeTime">—</span><span id="recipeServing">—</span><span id="recipeLevel">—</span></div></div></div><div class="rb"><div class="ul">내 냉장고에서 사용되는 재료</div><div class="chips" id="chips"></div><div class="acts"><button class="act primary" id="detailBtn">레시피 보기</button><button class="act" id="nextRecipe">다른 메뉴 ↻</button></div></div><div class="detail" id="detail"></div></div><div class="tip">공식 이미지·레시피 출처: 식품의약품안전처 식품안전나라</div></section></main><div class="modalbg" id="modalbg"><div class="modal"><div class="mh"><div class="mt">재료 추가</div><button class="close" id="closeAdd">×</button></div><div class="field"><label>재료명</label><input id="itemName" type="text" placeholder="예: 계란"></div><div class="field"><label>소비 기한</label><input id="itemExpiry" type="date"></div><div class="ma"><button id="cancelAdd">취소</button><button class="save" id="saveItem">추가하기</button></div></div></div><script>const KEY='use-me-first-v2';const OFFICIAL=[{name:'달래두부김치무침',need:['두부','김치'],time:'15분',serving:'1~2인분',level:'쉬움',desc:'구운 두부에 김치와 달래무침을 곁들이는 담백한 메뉴',image:'https://www.foodsafetykorea.go.kr/uploadimg/20141118/20141118102130_1416273690241.jpg',source:'https://www.foodsafetykorea.go.kr/popup/sensuousmenuView.do?rcp_menu_no=94',steps:['두부를 먹기 좋은 크기로 썰어 기름 없이 노릇하게 구워요.','달래를 짧게 썰어요.','배추김치는 물기를 적당히 짜고 가늘게 채 썰어요.','김치와 달래, 양념을 가볍게 무쳐요.','구운 두부에 김치달래무침을 곁들여요.']},{name:'딸기소스닭가슴살채소무침',need:['닭가슴살','토마토','요거트'],time:'20분',serving:'1~2인분',level:'쉬움',desc:'닭가슴살과 생채소에 상큼한 딸기 드레싱을 곁들이는 메뉴',image:'https://www.foodsafetykorea.go.kr/uploadimg/20141118/20141118102131_1416273691583.jpg',source:'https://www.foodsafetykorea.go.kr/popup/sensuousmenuView.do?rcp_menu_no=98',steps:['닭가슴살을 삶고 브로콜리를 살짝 데쳐요.','닭가슴살을 결대로 잘게 찢어요.','채소와 방울토마토를 먹기 좋은 크기로 손질해요.','딸기와 요거트로 드레싱을 만들어요.','접시에 담아 드레싱을 곁들여요.']},{name:'누룽지 두부 계란죽',need:['두부','계란','당근','버섯'],time:'25분',serving:'1인분',level:'보통',desc:'누룽지와 순두부, 달걀을 부드럽게 끓이는 따뜻한 한 끼',image:'https://www.foodsafetykorea.go.kr/uploadimg/cook/10_00016_1.png',source:'https://www.foodsafetykorea.go.kr/api/newDatasetDetail.do?svc_no=COOKRCP01',steps:['애호박과 당근, 버섯을 잘게 썰어요.','누룽지를 잘게 부숴요.','채소를 볶다가 누룽지와 물을 넣고 끓여요.','순두부를 넣고 간을 해요.','달걀을 풀어 넣고 한소끔 끓여요.']},{name:'오색지라시 스시',need:['양파','계란','버섯','새우'],time:'30분',serving:'1인분',level:'보통',desc:'밥 위에 달걀과 버섯, 양파, 새우를 다채롭게 올리는 메뉴',image:'https://www.foodsafetykorea.go.kr/uploadimg/cook/10_00009_1.png',source:'https://www.foodsafetykorea.go.kr/api/newDatasetDetail.do?svc_no=COOKRCP01',steps:['배합초를 만들고 뜨거운 밥에 섞어요.','버섯을 손질해 볶아요.','달걀지단을 부쳐 채 썰어요.','양파와 채소를 손질해 볶아요.','밥 위에 준비한 재료를 가지런히 올려요.']},{name:'칼륨 듬뿍 고구마죽',need:['고구마'],time:'30분',serving:'1인분',level:'쉬움',desc:'고구마를 곱게 으깨 부드럽게 끓이는 담백한 죽',image:'https://www.foodsafetykorea.go.kr/uploadimg/cook/10_00017_1.png',source:'https://www.foodsafetykorea.go.kr/api/newDatasetDetail.do?svc_no=COOKRCP01',steps:['고구마를 깨끗이 씻어 껍질을 벗겨요.','고구마를 충분히 익혀 곱게 으깨요.','물과 섞어 끓여요.','찹쌀가루로 농도를 맞춰요.','볶은 잣을 곁들여 마무리해요.']}];const ICONS={tofu:['#fff8e9','#f0e2c7',`<svg viewBox="0 0 24 24"><path d="M5 8.5 12 5l7 3.5v7L12 19l-7-3.5v-7Z" fill="#f5ead1" stroke="#c4a567" stroke-width="1.4"/><path d="m5 8.5 7 3.5 7-3.5M12 12v7" fill="none" stroke="#c4a567" stroke-width="1.2"/></svg>`],leaf:['#f1f7ef','#dce9da',`<svg viewBox="0 0 24 24"><path d="M19 5C12 5 7 8 6 13c-1 4 2 6 5 5 5-1 7-6 8-13Z" fill="#dfeedd" stroke="#6f9c67" stroke-width="1.4"/><path d="M6 20c3-5 7-8 11-10" fill="none" stroke="#6f9c67" stroke-width="1.4"/></svg>`],chicken:['#fff2ed','#f0ddd6',`<svg viewBox="0 0 24 24"><path d="M7 8c3-3 8-2 10 1 2 3 0 7-3 9-3 2-7 1-8-2-1-2-1-5 1-8Z" fill="#f7d6ca" stroke="#d8896e" stroke-width="1.4"/><circle cx="6" cy="7" r="2" fill="#fff" stroke="#d8896e" stroke-width="1.3"/></svg>`],kimchi:['#fff1ea','#f0ddd3',`<svg viewBox="0 0 24 24"><path d="M5 9h14l-1 9H6L5 9Z" fill="#fff" stroke="#df7047" stroke-width="1.4"/><path d="M7 10c2 0 2-2 4-1s2 3 4 2 2-1 3 0v5H7v-6Z" fill="#f1a07c" stroke="#df7047" stroke-width="1"/></svg>`],milk:['#eef8f7','#dbeae8',`<svg viewBox="0 0 24 24"><path d="M9 4h6v3l2 3v9H7v-9l2-3V4Z" fill="#f8fbfa" stroke="#75a9aa" stroke-width="1.4"/><path d="M9 7h6M8 12h8" stroke="#75a9aa" stroke-width="1.3"/></svg>`],onion:['#faf4ee','#eadfd4',`<svg viewBox="0 0 24 24"><path d="M12 6c-4 3-6 5-6 8a6 6 0 0 0 12 0c0-3-2-5-6-8Z" fill="#f2e3d3" stroke="#b78d66" stroke-width="1.4"/><path d="M12 6c-1-2 0-3 1-4M12 6c1-2 3-2 4-2" fill="none" stroke="#b78d66" stroke-width="1.3"/></svg>`],egg:['#fff9e8','#eee5c9',`<svg viewBox="0 0 24 24"><path d="M12 4c-3 0-6 5-6 9a6 6 0 0 0 12 0c0-4-3-9-6-9Z" fill="#fffaf0" stroke="#e5ae43" stroke-width="1.4"/><circle cx="12" cy="13" r="2.5" fill="#f6cf70"/></svg>`],tomato:['#fff0ef','#f0dddd',`<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="6" fill="#ef9a92" stroke="#d95e55" stroke-width="1.4"/><path d="m12 7 2-3M12 7 9 5m3 2 3 1" fill="none" stroke="#678d65" stroke-width="1.4"/></svg>`],basket:['#f4f6f3','#e5e8e3',`<svg viewBox="0 0 24 24"><path d="M5 10h14l-2 9H7l-2-9Z" fill="#eef2ec" stroke="#7b8c7d" stroke-width="1.4"/><path d="M8 10c1-4 7-4 8 0" fill="none" stroke="#7b8c7d" stroke-width="1.2"/></svg>`]};const $=s=>document.querySelector(s);let showAll=false,recipeIndex=0,scored=[];function today(){const d=new Date;return new Date(d.getFullYear(),d.getMonth(),d.getDate())}function iso(n){const d=today();d.setDate(d.getDate()+n);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function pd(v){const[y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d)}function dl(v){return Math.ceil((pd(v)-today())/86400000)}function fmt(v){const d=pd(v);return`${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}까지`}function dtext(d){return d<0?`D+${Math.abs(d)}`:d===0?'D-DAY':`D-${d}`}function sample(){return[{name:'두부',expiry:iso(1)},{name:'시금치',expiry:iso(2)},{name:'닭가슴살',expiry:iso(3)},{name:'김치',expiry:iso(4)},{name:'우유',expiry:iso(6)},{name:'양파',expiry:iso(7)}]}function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)&&v.length?v:sample()}catch(e){return sample()}}let items=load();function save(){localStorage.setItem(KEY,JSON.stringify(items))}function tone(d){return d<=1?['#ed6a61','#fff0ef']:d<=2?['#ef8d32','#fff3e8']:d<=4?['#eeba43','#fff8e7']:d<=6?['#5cae9e','#eaf7f4']:['#5f8c67','#eef5ee']}function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function iconFor(n){let k='basket';if(n.includes('두부'))k='tofu';else if(/시금치|상추|깻잎|배추|채소|야채/.test(n))k='leaf';else if(/닭가슴살|닭고기|치킨/.test(n))k='chicken';else if(n.includes('김치'))k='kimchi';else if(/우유|두유|요거트|요구르트/.test(n))k='milk';else if(/양파|적양파/.test(n))k='onion';else if(/계란|달걀/.test(n))k='egg';else if(/토마토|방울토마토/.test(n))k='tomato';return ICONS[k]}function renderItems(){items.sort((a,b)=>dl(a.expiry)-dl(b.expiry));const v=showAll?items:items.slice(0,6),box=$('#list');box.innerHTML='';if(!v.length)box.innerHTML='<div class="empty">재료를 추가하면 여기에 임박순으로 정리돼요.</div>';v.forEach(it=>{const d=dl(it.expiry),t=tone(d),urg=Math.max(14,Math.min(96,96-Math.max(0,d)*10)),ic=iconFor(it.name),idx=items.indexOf(it),r=document.createElement('div');r.className='row';r.style.setProperty('--a',t[0]);r.style.setProperty('--b',t[1]);r.style.setProperty('--ibg',ic[0]);r.style.setProperty('--ibd',ic[1]);r.innerHTML=`<div class="ic">${ic[2]}</div><div><div class="nm">${esc(it.name)}</div><div class="ex">${fmt(it.expiry)}</div></div><div class="bar"><span style="width:${urg}%"></span></div><div class="day">${dtext(d)}</div><button class="rm" data-i="${idx}">×</button>`;box.appendChild(r)});$('#summary').textContent=`재료 ${items.length}개 · 가장 임박 ${items.length?dtext(dl(items[0].expiry)):'—'}`;$('#toggleAll').textContent=showAll?'접어두기 ↑':`전체 재료 ${items.length}개 보기 ›`;document.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.i,1);save();renderAll()})}function scoreRecipes(){const map=new Map(items.map(i=>[i.name,dl(i.expiry)]));return OFFICIAL.map(r=>{const matched=r.need.filter(n=>map.has(n));const score=matched.reduce((s,n)=>s+Math.max(1,10-Math.max(0,map.get(n))),0)+matched.length*6;return{...r,matched,score}}).filter(r=>r.matched.length>=1).sort((a,b)=>b.score-a.score)}function showImage(r){const im=$('#recipeImage'),fb=$('#fallback');fb.style.display='none';im.style.display='block';im.onerror=()=>{im.style.display='none';fb.style.display='flex'};im.src=r.image;im.alt=r.name}function renderRecipe(){scored=scoreRecipes();if(!scored.length){$('#recipeName').textContent='재료를 조금 더 등록해 주세요';$('#recipeDesc').textContent='공식 레시피와 맞는 재료가 생기면 추천해요.';$('#useCount').textContent='';$('#recipeTime').textContent=$('#recipeServing').textContent=$('#recipeLevel').textContent='—';$('#chips').innerHTML='';$('#recipeImage').style.display='none';$('#fallback').style.display='flex';$('#detail').innerHTML='';return}recipeIndex%=scored.length;const r=scored[recipeIndex];$('#recipeName').textContent=r.name;$('#recipeDesc').textContent=r.desc;$('#useCount').textContent=`내 재료 ${r.matched.length}개 사용`;$('#recipeTime').textContent=r.time;$('#recipeServing').textContent=r.serving;$('#recipeLevel').textContent=r.level;$('#chips').innerHTML=r.matched.map(n=>`<span class="chip">${iconFor(n)[2]}${esc(n)}</span>`).join('');$('#detail').innerHTML=`<div class="dt">식품안전나라 조리 순서</div><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="official"><span>출처 · 식품의약품안전처 식품안전나라</span><a href="${r.source}" target="_blank" rel="noopener">원문 보기 ↗</a></div>`;showImage(r)}function renderAll(){renderItems();renderRecipe()}$('#toggleAll').onclick=()=>{showAll=!showAll;renderItems()};$('#nextRecipe').onclick=()=>{if(scored.length){recipeIndex=(recipeIndex+1)%scored.length;$('#detail').classList.remove('open');$('#detailBtn').textContent='레시피 보기';renderRecipe()}};$('#detailBtn').onclick=()=>{const d=$('#detail');d.classList.toggle('open');$('#detailBtn').textContent=d.classList.contains('open')?'레시피 접기':'레시피 보기'};const modal=$('#modalbg');function openModal(){modal.classList.add('on');$('#itemName').value='';$('#itemExpiry').value=iso(3);setTimeout(()=>$('#itemName').focus(),50)}function closeModal(){modal.classList.remove('on')}$('#openAdd').onclick=openModal;$('#closeAdd').onclick=closeModal;$('#cancelAdd').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};$('#saveItem').onclick=()=>{const name=$('#itemName').value.trim(),expiry=$('#itemExpiry').value;if(!name||!expiry)return;items.push({name,expiry});save();showAll=false;recipeIndex=0;closeModal();renderAll()};$('#itemName').addEventListener('keydown',e=>{if(e.key==='Enter')$('#saveItem').click()});renderAll();</script></body></html>
