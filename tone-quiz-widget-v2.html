<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중국어 성조 퀴즈 · Life Town v2</title>
<link rel="stylesheet" href="./assets/life-town-v2.css" />
<style>
:root{--bg:#fff;--text:#111113;--sub:#6e6e73;--muted:#a1a1a6;--line:#e7e7ea;--soft:#f7f7f8;--green:#34c759;--red:#ff3b30;--blue:#007aff;--shadow:0 12px 32px rgba(0,0,0,.055),0 1px 2px rgba(0,0,0,.035)}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:6px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}.shell{container-type:inline-size;width:min(100%,420px);margin:0 auto}.card{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:17px;box-shadow:var(--shadow);overflow:hidden}.card:before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,#b8b8bd 25%,#f6f6f8 50%,#b8b8bd 75%,transparent);opacity:.8}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.title{font-size:18px;font-weight:760;letter-spacing:-.045em}.sub{font-size:10px;color:var(--muted);margin-top:5px}.progressBox{min-width:78px;text-align:right}.progressTxt{font-size:10px;color:var(--sub);font-weight:650}.bar{margin-top:7px;width:78px;height:4px;border-radius:999px;background:#ececef;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);width:5%;border-radius:inherit;transition:width .2s ease}.prompt{text-align:center;font-size:11px;font-weight:650;color:var(--sub);margin:20px 0 10px}.target{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:17px}.base{font-size:52px;font-weight:720;line-height:.95;letter-spacing:-.055em}.speaker{width:34px;height:34px;border:1px solid var(--line);background:var(--soft);border-radius:11px;display:grid;place-items:center;color:var(--sub);cursor:pointer}.speaker:hover{color:var(--blue);border-color:#bdd8ff}.speaker svg{width:17px;height:17px}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.choice{min-width:0;min-height:82px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:10px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.14s ease}.choice:hover{background:var(--soft);transform:translateY(-1px)}.choice-num{font-size:23px;font-weight:760;line-height:1}.choice-pinyin{margin-top:8px;font-size:15px;font-weight:650;white-space:nowrap}.choice.correct{border-color:rgba(52,199,89,.6);background:rgba(52,199,89,.09);box-shadow:inset 0 0 0 1px rgba(52,199,89,.2)}.choice.wrong{border-color:rgba(255,59,48,.6);background:rgba(255,59,48,.08);box-shadow:inset 0 0 0 1px rgba(255,59,48,.16)}.choice:disabled{cursor:default;transform:none}.result{margin-top:12px;min-height:42px;border:1px solid var(--line);border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px;font-size:11px;font-weight:700;color:var(--sub)}.result.ok{background:rgba(52,199,89,.08);border-color:rgba(52,199,89,.25);color:#218a3d}.result.no{background:rgba(255,59,48,.07);border-color:rgba(255,59,48,.22);color:#c02c25}.char-note{text-align:center;margin-top:7px;min-height:14px;font-size:10px;color:var(--muted)}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:9px;color:var(--muted)}.streakDot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px}@container(max-width:330px){.card{padding:14px 12px;border-radius:19px}.title{font-size:16px}.base{font-size:46px}.choices{gap:5px}.choice{min-height:72px;border-radius:13px}.choice-num{font-size:21px}.choice-pinyin{font-size:13px}.progressBox{min-width:68px}.bar{width:68px}}
</style></head><body>
<div class="shell"><main class="card"><header class="head"><div><div class="title">성조 퀴즈</div><div class="sub">발음을 듣고 맞는 성조를 골라보세요.</div></div><div class="progressBox"><div class="progressTxt" id="progress">1 / 20</div><div class="bar"><i id="progressBar"></i></div></div></header><div class="prompt">소리를 듣고 선택하세요</div><section class="target"><div class="base" id="base">ma</div><button class="speaker" id="play" aria-label="발음 듣기"><svg viewBox="0 0 24 24" fill="none"><path d="M5 9.5v5h3l4 3.5V6L8 9.5H5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M15 9c1.2 1.1 1.2 4.9 0 6M17.8 6.8c2.4 2.5 2.4 7.9 0 10.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></section><section class="choices" id="choices"></section><div class="result" id="result">스피커를 눌러 듣고 골라보세요.</div><div class="char-note" id="note"></div><div class="meta"><span><span class="streakDot"></span><span id="streak">연속 정답 0</span></span><span id="score">정답 0</span></div></main></div>
<script>
const BANK=[{hanzi:'妈',base:'ma',pinyin:'mā',tone:1,ko:'엄마'},{hanzi:'花',base:'hua',pinyin:'huā',tone:1,ko:'꽃'},{hanzi:'书',base:'shu',pinyin:'shū',tone:1,ko:'책'},{hanzi:'天',base:'tian',pinyin:'tiān',tone:1,ko:'하늘/날'},{hanzi:'吃',base:'chi',pinyin:'chī',tone:1,ko:'먹다'},{hanzi:'喝',base:'he',pinyin:'hē',tone:1,ko:'마시다'},{hanzi:'家',base:'jia',pinyin:'jiā',tone:1,ko:'집'},{hanzi:'三',base:'san',pinyin:'sān',tone:1,ko:'3'},{hanzi:'猫',base:'mao',pinyin:'māo',tone:1,ko:'고양이'},{hanzi:'高',base:'gao',pinyin:'gāo',tone:1,ko:'높다'},{hanzi:'麻',base:'ma',pinyin:'má',tone:2,ko:'삼/저리다'},{hanzi:'茶',base:'cha',pinyin:'chá',tone:2,ko:'차'},{hanzi:'人',base:'ren',pinyin:'rén',tone:2,ko:'사람'},{hanzi:'学',base:'xue',pinyin:'xué',tone:2,ko:'배우다'},{hanzi:'钱',base:'qian',pinyin:'qián',tone:2,ko:'돈'},{hanzi:'来',base:'lai',pinyin:'lái',tone:2,ko:'오다'},{hanzi:'没',base:'mei',pinyin:'méi',tone:2,ko:'없다/않다'},{hanzi:'白',base:'bai',pinyin:'bái',tone:2,ko:'희다'},{hanzi:'十',base:'shi',pinyin:'shí',tone:2,ko:'10'},{hanzi:'忙',base:'mang',pinyin:'máng',tone:2,ko:'바쁘다'},{hanzi:'马',base:'ma',pinyin:'mǎ',tone:3,ko:'말'},{hanzi:'水',base:'shui',pinyin:'shuǐ',tone:3,ko:'물'},{hanzi:'小',base:'xiao',pinyin:'xiǎo',tone:3,ko:'작다'},{hanzi:'买',base:'mai',pinyin:'mǎi',tone:3,ko:'사다'},{hanzi:'走',base:'zou',pinyin:'zǒu',tone:3,ko:'걷다/가다'},{hanzi:'请',base:'qing',pinyin:'qǐng',tone:3,ko:'부탁하다'},{hanzi:'早',base:'zao',pinyin:'zǎo',tone:3,ko:'이르다/아침'},{hanzi:'狗',base:'gou',pinyin:'gǒu',tone:3,ko:'개'},{hanzi:'很',base:'hen',pinyin:'hěn',tone:3,ko:'매우'},{hanzi:'九',base:'jiu',pinyin:'jiǔ',tone:3,ko:'9'},{hanzi:'骂',base:'ma',pinyin:'mà',tone:4,ko:'욕하다'},{hanzi:'大',base:'da',pinyin:'dà',tone:4,ko:'크다'},{hanzi:'去',base:'qu',pinyin:'qù',tone:4,ko:'가다'},{hanzi:'坐',base:'zuo',pinyin:'zuò',tone:4,ko:'앉다'},{hanzi:'见',base:'jian',pinyin:'jiàn',tone:4,ko:'보다/만나다'},{hanzi:'饭',base:'fan',pinyin:'fàn',tone:4,ko:'밥'},{hanzi:'话',base:'hua',pinyin:'huà',tone:4,ko:'말'},{hanzi:'贵',base:'gui',pinyin:'guì',tone:4,ko:'비싸다'},{hanzi:'累',base:'lei',pinyin:'lèi',tone:4,ko:'피곤하다'},{hanzi:'六',base:'liu',pinyin:'liù',tone:4,ko:'6'}];
const VOWEL_MAP={a:['ā','á','ǎ','à'],e:['ē','é','ě','è'],i:['ī','í','ǐ','ì'],o:['ō','ó','ǒ','ò'],u:['ū','ú','ǔ','ù'],ü:['ǖ','ǘ','ǚ','ǜ']};function markTone(base,tone){let s=base.toLowerCase().replace('v','ü');const order=s.includes('a')?'a':s.includes('e')?'e':s.includes('ou')?'o':null;let idx=-1,vowel=null;if(order){idx=s.indexOf(order);vowel=order}else{for(let i=s.length-1;i>=0;i--){if('aeiouü'.includes(s[i])){idx=i;vowel=s[i];break}}}if(idx<0)return s;const marked=VOWEL_MAP[vowel][tone-1];return s.slice(0,idx)+marked+s.slice(idx+1)}
let q=1,streak=0,correctTotal=0,locked=false,current=null,previous=-1;const $=s=>document.querySelector(s);function nextItem(){let i;do{i=Math.floor(Math.random()*BANK.length)}while(i===previous&&BANK.length>1);previous=i;current=BANK[i];locked=false;$('#base').textContent=current.base;$('#progress').textContent=`${q} / 20`;$('#progressBar').style.width=`${q/20*100}%`;$('#streak').textContent=`연속 정답 ${streak}`;$('#score').textContent=`정답 ${correctTotal}`;$('#result').className='result';$('#result').textContent='스피커를 눌러 듣고 골라보세요.';$('#note').textContent='';$('#choices').innerHTML=[1,2,3,4].map(t=>`<button class="choice" data-tone="${t}"><div class="choice-num">${t}</div><div class="choice-pinyin">${markTone(current.base,t)}</div></button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(Number(b.dataset.tone),b))}
function speak(){if(!current||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(current.hanzi);u.lang='zh-CN';u.rate=.78;const vs=speechSynthesis.getVoices();const zh=vs.find(v=>/zh-CN|cmn-Hans/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang));if(zh)u.voice=zh;speechSynthesis.speak(u)}
function answer(tone,btn){if(locked)return;locked=true;const all=[...document.querySelectorAll('.choice')];all.forEach(b=>b.disabled=true);const correct=all[current.tone-1];if(tone===current.tone){streak++;correctTotal++;btn.classList.add('correct');$('#result').className='result ok';$('#result').textContent=`정답 · ${current.hanzi} ${current.pinyin}`}else{streak=0;btn.classList.add('wrong');correct.classList.add('correct');$('#result').className='result no';$('#result').textContent=`정답은 ${current.tone}성 · ${current.hanzi} ${current.pinyin}`}$('#note').textContent=`${current.hanzi} = ${current.ko}`;$('#streak').textContent=`연속 정답 ${streak}`;$('#score').textContent=`정답 ${correctTotal}`;setTimeout(()=>{q=q>=20?1:q+1;nextItem()},1400)}
$('#play').onclick=speak;nextItem();
</script><script src="./assets/life-town-controls-v2.js"></script></body></html>
