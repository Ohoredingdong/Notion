<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Loan Planner</title>
<style>
:root{--bg:#ffffff;--text:#24251f;--sub:#75766f;--muted:#a2a49b;--line:#e9eae4;--soft:#f7f8f3;--accent:#667b3f;--accent2:#7e9252;--result:#f4f6ed;--shadow:0 1px 4px rgba(36,37,31,.035)}
html[data-theme="dark"]{--bg:#191a18;--text:#f0f1eb;--sub:#b8baaf;--muted:#85887e;--line:#30322d;--soft:#22241f;--accent:#a7bb78;--accent2:#8fa364;--result:#25291f;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent}body{padding:4px;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif}
.widget{width:min(100%,488px);margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 13px 11px;box-shadow:var(--shadow)}
.header{display:flex;align-items:center;gap:9px;margin-bottom:13px}.badge{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;background:linear-gradient(145deg,#78884d,#536a34);color:#fff;font-size:12px;font-weight:800}.title{font-size:12px;font-weight:750;letter-spacing:-.02em}.sub{font-size:8px;color:var(--sub);margin-top:1px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{min-width:0;border:1px solid var(--line);border-radius:8px;padding:12px 12px 9px;background:var(--bg)}.label{font-size:8px;font-weight:700;color:var(--sub);margin-bottom:5px}.value{font-size:16px;line-height:1.1;font-weight:560;letter-spacing:-.035em;font-variant-numeric:tabular-nums;white-space:nowrap}.unit{font-size:9px;margin-left:2px;color:var(--sub);font-weight:500}
.range{margin-top:13px}.track{position:relative;height:15px}.track input{position:absolute;inset:0;width:100%;height:15px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer}.track input::-webkit-slider-runnable-track{height:3px;border-radius:999px;background:linear-gradient(90deg,var(--accent) 0 var(--fill),var(--line) var(--fill) 100%)}.track input::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--accent);margin-top:-6px;box-shadow:0 1px 2px rgba(0,0,0,.08)}.track input::-moz-range-track{height:3px;border-radius:999px;background:var(--line)}.track input::-moz-range-progress{height:3px;border-radius:999px;background:var(--accent)}.track input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.ends{display:flex;justify-content:space-between;font-size:7px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.result{margin-top:12px;border:1px solid #e3e7d9;border-radius:8px;background:linear-gradient(100deg,var(--result),var(--bg));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px}.result-left{display:flex;align-items:center;gap:10px;min-width:0}.calc-icon{width:25px;height:25px;border-radius:5px;border:1px solid var(--accent2);display:grid;place-items:center;color:var(--accent);font-size:14px}.result-label{font-size:9px;font-weight:760}.result-note{font-size:7px;color:var(--sub);margin-top:2px}.monthly{font-size:18px;font-weight:760;color:var(--accent);letter-spacing:-.025em;white-space:nowrap;font-variant-numeric:tabular-nums}
.footer{display:flex;justify-content:space-between;gap:10px;margin-top:11px;font-size:7px;color:var(--muted)}.footer span{white-space:nowrap}
@media(max-width:430px){.widget{padding:12px 10px 10px}.controls{gap:7px}.card{padding:10px 9px 8px}.value{font-size:13px}.monthly{font-size:16px}}
@media(max-width:340px){.controls{grid-template-columns:1fr}.result{padding:11px 12px}.footer{flex-direction:column;gap:3px}}
</style>
</head>
<body>
<main class="widget" aria-label="대출 플래너">
  <header class="header">
    <div class="badge">2</div>
    <div><div class="title">Loan Planner</div><div class="sub">대출 플래너</div></div>
  </header>

  <section class="controls">
    <div class="card">
      <div class="label">대출 금액</div>
      <div class="value" id="amountValue">₩380,000,000</div>
      <div class="range"><div class="track"><input id="amount" type="range" min="100000000" max="1000000000" step="10000000" value="380000000" aria-label="대출 금액"></div><div class="ends"><span>1억</span><span>10억</span></div></div>
    </div>

    <div class="card">
      <div class="label">금리</div>
      <div class="value"><span id="rateValue">4.20</span><span class="unit">%</span></div>
      <div class="range"><div class="track"><input id="rate" type="range" min="2" max="7" step="0.05" value="4.20" aria-label="금리"></div><div class="ends"><span>2%</span><span>7%</span></div></div>
    </div>

    <div class="card">
      <div class="label">대출 기간</div>
      <div class="value"><span id="yearsValue">30</span><span class="unit">년</span></div>
      <div class="range"><div class="track"><input id="years" type="range" min="10" max="40" step="1" value="30" aria-label="대출 기간"></div><div class="ends"><span>10년</span><span>40년</span></div></div>
    </div>
  </section>

  <section class="result" aria-live="polite">
    <div class="result-left">
      <div class="calc-icon">▤</div>
      <div><div class="result-label">예상 월 상환액</div><div class="result-note">원리금 균등</div></div>
    </div>
    <div class="monthly" id="monthly">₩1,858,265</div>
  </section>

  <footer class="footer"><span>대출 상품: 변동금리</span><span id="asOf">기준일: —</span></footer>
</main>
<script>
const q=new URLSearchParams(location.search),forced=q.get('theme'),dark=matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.dataset.theme=(forced==='light'||forced==='dark')?forced:(dark?'dark':'light');
const amount=document.getElementById('amount'),rate=document.getElementById('rate'),years=document.getElementById('years');
const won=n=>'₩'+Math.round(n).toLocaleString('ko-KR');
function fill(el){const min=+el.min,max=+el.max,val=+el.value;el.style.setProperty('--fill',((val-min)/(max-min)*100)+'%')}
function calc(){
  const p=+amount.value,a=+rate.value/100,n=+years.value*12,r=a/12;
  const payment=r===0?p/n:p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  document.getElementById('amountValue').textContent=won(p);
  document.getElementById('rateValue').textContent=(+rate.value).toFixed(2);
  document.getElementById('yearsValue').textContent=years.value;
  document.getElementById('monthly').textContent=won(payment);
  [amount,rate,years].forEach(fill);
}
[amount,rate,years].forEach(el=>el.addEventListener('input',calc));
const parts=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
const get=t=>parts.find(x=>x.type===t)?.value||'';document.getElementById('asOf').textContent=`기준일: ${get('year')}.${get('month')}.${get('day')}`;
calc();
</script>
</body>
</html>
