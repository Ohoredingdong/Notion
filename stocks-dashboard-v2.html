<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>주식 시장 · Life Town v2</title>
<link rel="stylesheet" href="./assets/life-town-v2.css">
<style>
:root{--panel:#fff;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--line:#e5e5e8;--line2:#f0f0f2;--soft:#f7f7f8;--blue:#007aff;--green:#34c759;--yellow:#ffcc00;--yellow-ink:#8d7000;--red:#ff3b30;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}
html[data-lt-theme="dark"]{--panel:#1c1c1e;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--line:#38383a;--line2:#2c2c2e;--soft:#2c2c2e;--blue:#0a84ff;--green:#30d158;--yellow:#ffd60a;--yellow-ink:#ffd60a;--red:#ff453a;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}.root{width:100%;max-width:560px;margin:auto;container-type:inline-size}.widget{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px 14px 11px;box-shadow:var(--shadow);overflow:hidden}.widget:before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:linear-gradient(90deg,transparent,#b8b8bd 22%,#f5f5f7 50%,#b8b8bd 78%,transparent);opacity:.52}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.title{font-size:18px;font-weight:760;letter-spacing:-.04em;line-height:1.08}.sub{margin-top:4px;font-size:10px;color:var(--muted)}.refresh{width:28px;height:28px;border:1px solid var(--line);border-radius:9px;background:var(--panel);display:grid;place-items:center;color:var(--sub);cursor:pointer}.refresh:hover{background:var(--soft);color:var(--text)}.refresh svg{width:13px;height:13px}.market-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:11px;padding:3px;border-radius:11px;background:var(--soft)}.market-tab,.range-tab{border:0;background:transparent;cursor:pointer;font-weight:680;color:var(--sub)}.market-tab{height:29px;border-radius:8px;font-size:10px}.market-tab.active{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.05)}.market-tab[data-market="US"].active{color:var(--blue)}.market-tab[data-market="KOR"].active{color:var(--red)}.market-tab[data-market="EU"].active{color:var(--yellow-ink)}.market-tab[data-market="ASIA"].active{color:var(--green)}.range-tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:8px;padding-bottom:9px;border-bottom:1px solid var(--line)}.range-tab{height:24px;border-radius:7px;font-size:9px}.range-tab.active{background:rgba(0,122,255,.08);color:var(--blue)}.layout{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px;align-items:center;padding:12px 0 8px}.main-name{font-size:10px;font-weight:690;color:var(--sub)}.main-price{margin-top:7px;font-size:25px;font-weight:770;letter-spacing:-.045em;line-height:1}.main-change{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:10.5px;font-weight:720;color:var(--green)}.main-change.down{color:var(--red)}.main-change small{font-size:9px;color:inherit}.chart-box{height:94px}.chart{width:100%;height:100%;display:block}.table{border-top:1px solid var(--line)}.thead,.row{display:grid;grid-template-columns:1.55fr .92fr .75fr .62fr;gap:9px;align-items:center}.thead{padding:8px 0 6px;font-size:8.8px;font-weight:700;color:var(--muted)}.row{position:relative;padding:8px 0 8px 8px;border-top:1px solid var(--line2)}.row:before{content:"";position:absolute;left:0;top:50%;width:3px;height:18px;border-radius:999px;transform:translateY(-50%)}.row:nth-child(2):before{background:var(--blue)}.row:nth-child(3):before{background:var(--yellow)}.row:nth-child(4):before{background:var(--green)}.row:nth-child(5):before{background:var(--red)}.row:nth-child(6):before{background:var(--blue)}.sym-main{display:flex;align-items:baseline;gap:6px;min-width:0}.sym{font-size:11px;font-weight:760;white-space:nowrap}.company{font-size:9px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell-price{font-size:10px;font-weight:700;white-space:nowrap}.cell-change,.cell-pct{font-size:9.4px;font-weight:700;white-space:nowrap;text-align:right}.up{color:var(--green)}.down{color:var(--red)}.footer{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-top:8px;margin-top:1px;border-top:1px solid var(--line);font-size:8.8px;color:var(--muted)}.source{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fresh{display:flex;align-items:center;gap:5px;white-space:nowrap}.dot{width:6px;height:6px;border-radius:50%;background:var(--green)}.dot.stale{background:var(--yellow)}.loading,.error{padding:34px 8px;text-align:center;font-size:10px;color:var(--muted)}
@container(max-width:470px){.layout{grid-template-columns:1fr}.chart-box{height:80px}.company{display:none}.thead,.row{grid-template-columns:1.15fr .92fr .78fr .62fr;gap:6px}.title{font-size:17px}}
</style>
</head>
<body>
<div class="root"><main class="widget" data-widget-control-root data-control-sizes="500,530,560">
<header class="header"><div><div class="title">주식 시장</div><div class="sub">주요 시장 · 지수 · 종목 흐름</div></div><button class="refresh" id="refreshBtn" aria-label="새로고침"><svg viewBox="0 0 24 24" fill="none"><path d="M20 7v5h-5M4 17v-5h5M17.5 9A6.5 6.5 0 0 0 6.6 7L4 12M6.5 15A6.5 6.5 0 0 0 17.4 17L20 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></header>
<div class="market-tabs" id="marketTabs"></div><div class="range-tabs" id="rangeTabs"></div><div id="content" class="loading">데이터를 불러오는 중...</div>
</main></div>
<script>
const FALLBACK={updated_at:'2026-08-20T21:10:33-04:00',source_label:'Yahoo Finance · delayed',stale:true,activeMarket:'US',activeRange:'1D',markets:['US','KOR','EU','ASIA'],ranges:['1D','1W','1M','3M','YTD','1Y'],datasets:{US:{main:{name:'S&P 500',display:'7,641.16',change_pct:-0.87,change_abs:'66.82',series:{'1D':[7690,7682,7675,7668,7661,7658,7653,7648,7642,7641],'1W':[7708,7692,7679,7655,7641],'1M':[7443,7501,7568,7611,7641],'3M':[6890,7042,7270,7488,7641],'YTD':[6845,7010,7240,7470,7641],'1Y':[6390,6680,7060,7380,7641]}},rows:[{symbol:'AAPL',company:'Apple Inc.',price:'—',change:0,pct:0},{symbol:'TSLA',company:'Tesla Inc.',price:'—',change:0,pct:0},{symbol:'NVDA',company:'NVIDIA Corp.',price:'—',change:0,pct:0},{symbol:'MSFT',company:'Microsoft Corp.',price:'—',change:0,pct:0},{symbol:'AMZN',company:'Amazon.com Inc.',price:'—',change:0,pct:0}]},KOR:{main:{name:'KOSPI',display:'—',change_pct:0,change_abs:'—',series:{'1D':[0,0],'1W':[0,0],'1M':[0,0],'3M':[0,0],'YTD':[0,0],'1Y':[0,0]}},rows:[]},EU:{main:{name:'STOXX Europe 600',display:'—',change_pct:0,change_abs:'—',series:{'1D':[0,0],'1W':[0,0],'1M':[0,0],'3M':[0,0],'YTD':[0,0],'1Y':[0,0]}},rows:[]},ASIA:{main:{name:'Nikkei 225',display:'—',change_pct:0,change_abs:'—',series:{'1D':[0,0],'1W':[0,0],'1M':[0,0],'3M':[0,0],'YTD':[0,0],'1Y':[0,0]}},rows:[]}}};
let state={market:FALLBACK.activeMarket,range:FALLBACK.activeRange,data:FALLBACK};const $=s=>document.querySelector(s);function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function stamp(iso){try{const d=new Date(iso);return d.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return'최신 기준'}}function fmtSigned(v){const n=Math.abs(Number(v));return`${Number(v)>=0?'▲':'▼'} ${n.toFixed(Number.isInteger(n)?0:2)}`}function cls(n){return Number(n)>=0?'up':'down'}function linePath(values,w,h,p=2){const min=Math.min(...values),max=Math.max(...values),span=max-min||1;return values.map((v,i)=>{const x=p+i*(w-p*2)/(values.length-1||1),y=p+(max-v)*(h-p*2)/span;return`${i?'L':'M'}${x.toFixed(2)},${y.toFixed(2)}`}).join(' ')}function lineSvg(values,positive){const w=330,h=94,path=linePath(values,w,h,2);return`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="${positive?'var(--green)':'var(--red)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function renderTabs(){$('#marketTabs').innerHTML=state.data.markets.map(m=>`<button class="market-tab ${m===state.market?'active':''}" data-market="${m}">${m}</button>`).join('');$('#rangeTabs').innerHTML=state.data.ranges.map(r=>`<button class="range-tab ${r===state.range?'active':''}" data-range="${r}">${r}</button>`).join('');document.querySelectorAll('.market-tab').forEach(b=>b.onclick=()=>{state.market=b.dataset.market;renderAll()});document.querySelectorAll('.range-tab').forEach(b=>b.onclick=()=>{state.range=b.dataset.range;renderAll()})}
function renderAll(){renderTabs();const ds=(state.data.datasets||{})[state.market]||state.data.datasets.US,main=ds.main,rows=ds.rows||[],series=(main.series||{})[state.range]||Object.values(main.series||{})[0]||[];const table=rows.length?rows.map(r=>`<div class="row"><div class="sym-main"><span class="sym">${esc(r.symbol)}</span><span class="company">${esc(r.company)}</span></div><div class="cell-price">${esc(r.price)}</div><div class="cell-change ${cls(r.change)}">${fmtSigned(r.change)}</div><div class="cell-pct ${cls(r.pct)}">${Number(r.pct).toFixed(2)}%</div></div>`).join(''):`<div class="loading">해당 시장 종목 데이터를 준비 중입니다.</div>`;$('#content').outerHTML=`<div id="content"><div class="layout"><section><div class="main-name">${esc(main.name)}</div><div class="main-price">${esc(main.display)}</div><div class="main-change ${cls(main.change_pct)}"><span>${fmtSigned(main.change_pct)}%</span><small>(${esc(main.change_abs)})</small></div></section><section><div class="chart-box">${lineSvg(series,Number(main.change_pct)>=0)}</div></section></div><div class="table"><div class="thead"><div>종목</div><div>가격</div><div style="text-align:right">변동</div><div style="text-align:right">%</div></div>${table}</div><div class="footer"><div class="source">${esc(state.data.source_label||'Yahoo Finance · delayed')}</div><div class="fresh"><span>${stamp(state.data.updated_at)}</span><span class="dot ${state.data.stale?'stale':''}"></span></div></div></div>`}
async function load(){try{const r=await fetch('./stocks-dashboard-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);state.data={...FALLBACK,...await r.json()};state.market=state.data.activeMarket||state.market;state.range=state.data.activeRange||state.range}catch{state.data=FALLBACK}renderAll()}$('#refreshBtn').onclick=load;load();
</script>
<script src="./assets/life-town-controls-v2.js"></script>
</body></html>
