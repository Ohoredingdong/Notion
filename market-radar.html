<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Market Radar</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:transparent;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#242424}
    .wrap{width:100%;padding:8px 0}
    .panel{background:#fbfbfa;border:1px solid #ecebe7;border-radius:16px;overflow:hidden}
    .head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px}
    .title{font-size:13px;font-weight:700;letter-spacing:.02em}
    .note{font-size:10px;color:#8b8b86;white-space:nowrap}
    .ticker{min-height:82px}
    .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:6px 16px 12px;border-top:1px solid #f0efec;font-size:10px;color:#77736d}
    .legend b{font-weight:650;color:#46433f}
    @media(max-width:700px){
      .head{padding:10px 12px 6px}.note{display:none}.legend{padding:6px 12px 10px;gap:5px 10px}.panel{border-radius:12px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="head">
        <div class="title">📡 LIVE MARKET STRIP</div>
        <div class="note">시장별 실시간/지연 데이터가 다를 수 있음</div>
      </div>
      <div class="ticker tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
        {
          "symbols": [
            {"proName":"KRX:KOSPI","title":"KOSPI"},
            {"proName":"KRX:KOSDAQ","title":"KOSDAQ"},
            {"proName":"TVC:SPX","title":"S&P 500"},
            {"proName":"NASDAQ:IXIC","title":"NASDAQ"},
            {"proName":"TVC:US10Y","title":"US 10Y"},
            {"proName":"FX_IDC:USDKRW","title":"USD/KRW"},
            {"proName":"TVC:DXY","title":"DXY"},
            {"proName":"OANDA:XAUUSD","title":"GOLD"},
            {"proName":"BITSTAMP:BTCUSD","title":"BITCOIN"},
            {"proName":"NYMEX:CL1!","title":"WTI"}
          ],
          "showSymbolLogo": false,
          "isTransparent": true,
          "displayMode": "adaptive",
          "colorTheme": "light",
          "locale": "kr"
        }
        </script>
      </div>
      <div class="legend">
        <span><b>INDEX</b> KOSPI · KOSDAQ · S&P500 · Nasdaq</span>
        <span><b>MACRO</b> US10Y · USD/KRW · DXY</span>
        <span><b>ASSET</b> Gold · Bitcoin · WTI</span>
      </div>
    </div>
  </div>
</body>
</html>
