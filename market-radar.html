<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Market Radar</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#242424}.wrap{padding:8px 0}.panel{background:#fbfbfa;border:1px solid #ecebe7;border-radius:16px;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 10px}.title{font-size:13px;font-weight:750}.note{font-size:10px;color:#8b8b86}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:0 12px 12px}.card{background:#fff;border:1px solid #efeee9;border-radius:12px;padding:10px;min-height:76px;display:flex;flex-direction:column;justify-content:space-between}.label{font-size:11px;font-weight:700;color:#47433f}.value{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.change{font-size:11px;font-weight:700}.pos{color:#0f9d58}.neg{color:#d93025}.neu{color:#7a756e}.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 16px 12px;border-top:1px solid #f0efec;font-size:10px;color:#77736d}.legend b{color:#46433f}.sub{padding:0 16px 12px;font-size:9px;color:#9a9690}@media(max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:640px){.note{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:0 10px 10px}.value{font-size:16px}.panel{border-radius:12px}}
</style>
</head>
<body>
<div class="wrap"><div class="panel">
<div class="head"><div class="title">📡 LIVE MARKET</div><div class="note">10개 항목 전체 표시 · 약 5분마다 갱신</div></div>
<div class="grid" id="grid"></div>
<div class="legend"><span><b>INDEX</b> KOSPI · KOSDAQ · S&amp;P500 · Nasdaq</span><span><b>MACRO</b> US10Y · USD/KRW · DXY</span><span><b>ASSET</b> Gold · Bitcoin · WTI</span></div>
<div class="sub">무료 외부 시세를 서버에서 중계해 표시합니다. 일부 항목은 지연 시세일 수 있습니다.</div>
</div></div>
<script>
const ENDPOINT='https://dfklyngtjqvlirgrtdfb.supabase.co/functions/v1/market-radar-quotes';
const KEY='sb_publishable_UOucR8YcmGFQRxL2GjvgnA_2so7ZpSC';
const ORDER=['KOSPI','KOSDAQ','S&P500','Nasdaq','US10Y','USD/KRW','DXY','Gold','Bitcoin','WTI'];
const grid=document.getElementById('grid');
const id=s=>s.replace(/[^a-zA-Z0-9]/g,'');
grid.innerHTML=ORDER.map(k=>`<div class="card" id="c-${id(k)}"><div class="label">${k}</div><div class="value">—</div><div class="change neu">불러오는 중…</div></div>`).join('');
const fmt=(v,d=2)=>new Intl.NumberFormat('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}).format(v);
function draw(q){const el=document.getElementById('c-'+id(q.key));if(!el)return;if(!q.ok){el.querySelector('.value').textContent='—';el.querySelector('.change').textContent='일시적 오류';return;}const cls=q.diff>0?'pos':q.diff<0?'neg':'neu';const sign=q.diff>0?'+':'';el.querySelector('.value').textContent=fmt(q.price,q.decimals)+(q.suffix||'');const ch=el.querySelector('.change');ch.className='change '+cls;ch.textContent=`${sign}${fmt(q.diff,q.decimals)}${q.suffix||''} (${sign}${fmt(q.pct,2)}%)`;}
async function load(){try{const r=await fetch(ENDPOINT,{cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();(data.quotes||[]).forEach(draw);}catch(e){document.querySelectorAll('.change').forEach(x=>{x.className='change neu';x.textContent='연결 재시도 중…';});}}
load();setInterval(load,300000);
</script>
</body></html>
