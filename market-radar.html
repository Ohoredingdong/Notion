<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Market Radar</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:transparent;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#242424}
    .wrap{width:100%;padding:8px 0}
    .panel{background:#fbfbfa;border:1px solid #ecebe7;border-radius:16px;overflow:hidden}
    .head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 10px}
    .title{font-size:13px;font-weight:750;letter-spacing:.02em}
    .note{font-size:10px;color:#8b8b86;white-space:nowrap}
    .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid #f0efec;border-left:1px solid #f0efec}
    .cell{min-width:0;padding:5px;border-right:1px solid #f0efec;border-bottom:1px solid #f0efec;background:#fff}
    tv-single-ticker{display:block;width:100%;min-width:0}
    .legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 16px 10px;font-size:10px;color:#77736d}
    .legend b{font-weight:650;color:#46433f}
    .subnote{padding:0 16px 10px;font-size:9px;color:#9a9690}
    @media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:620px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.head{padding:10px 12px 8px}.note{display:none}.legend{padding:7px 12px 9px;gap:5px 10px}.subnote{padding:0 12px 9px}.panel{border-radius:12px}}
  </style>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-single-ticker.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="head">
        <div class="title">📡 LIVE MARKET</div>
        <div class="note">전체 항목 · 가격 · 등락률 자동 표시</div>
      </div>
      <div class="grid">
        <div class="cell"><tv-single-ticker symbol="INDEX:KSIC" theme="light" locale="kr" transparent></tv-single-ticker></div>
        <div class="cell"><tv-single-ticker symbol="KRX:KOSDAQ" theme="light" locale="kr" transparent></tv-single-ticker></div>
        <div class="cell"><tv-single-ticker symbol="FOREXCOM:SPXUSD" theme="light" locale="kr" transparent></tv-single-ticker></div>
        <div class="cell"><tv-single-ticker symbol="FOREXCOM:NSXUSD" theme="light" locale="kr" transparent></tv-single-ticker></div>
        <div class="cell"><tv-single-ticker symbol="TVC:US10Y" theme="light" locale="kr" transparent></tv-single-ticker></div>
        <div class="cell"><tv-single-ticker symbol="FX_IDC:USDKRW" theme="light" locale="kr" transparent></tv-single-ticker></div>
        <div class="cell"><tv-single-ticker symbol="TVC:DXY" theme="light" locale="kr" transparent></tv-single-ticker></div>
        <div class="cell"><tv-single-ticker symbol="CMCMARKETS:GOLD" theme="light" locale="kr" transparent></tv-single-ticker></div>
        <div class="cell"><tv-single-ticker symbol="BITSTAMP:BTCUSD" theme="light" locale="kr" transparent></tv-single-ticker></div>
        <div class="cell"><tv-single-ticker symbol="TVC:USOIL" theme="light" locale="kr" transparent></tv-single-ticker></div>
      </div>
      <div class="legend">
        <span><b>INDEX</b> KOSPI · KOSDAQ · S&amp;P500 · Nasdaq</span>
        <span><b>MACRO</b> US10Y · USD/KRW · DXY</span>
        <span><b>ASSET</b> Gold · Bitcoin · WTI</span>
      </div>
      <div class="subnote">TradingView Single Ticker를 각각 독립적으로 배치해 옆 화살표 없이 모든 항목이 한 화면에 보이도록 구성했습니다. 일부 거래소 데이터는 지연될 수 있습니다.</div>
    </div>
  </div>
</body>
</html>
