/* Visual hierarchy: category colors identify metrics; they are not ratings. */
:root{
  --bg:#f3f4f6;--line:#dfe4e9;--ink:#243140;--muted:#5f6b79;
  --blue:#285fa9;--blue-soft:#edf4ff;--green:#1d6749;--green-soft:#edf7f0;
  --amber:#96500e;--amber-soft:#fff5e5;--red:#a44842;
  --focus-blue:#285fa9;--focus-purple:#7150a2;--focus-teal:#176e70;
  font-size:13px;line-height:1.65;
}
body{background:var(--bg)}
main{color:var(--ink)}
.sidebar{background:#f7f8fa;border-right-color:#dfe4e9}
.company-item.selected{background:#edf3fd;border-color:#c5d5ee;box-shadow:none}
.company-item.selected:before{background:#285fa9;width:3px}
.company-text strong{font-size:12px;color:#26384b}
.company-text small,.brand small,.sidebar-bottom p,.tiny-label,.list-top,
.eyebrow,.breadcrumb,.snapshot-badge,.company-heading h1 span,.company-meta>span:not(.pill){color:#637082;font-size:11px}
.market-filters button{color:#596677;font-size:11px}
.market-filters button.active{color:#244f90;background:#e2ebfb}
.company-business{font-size:13px;color:#4b596a;line-height:1.7}
.secondary{color:#3f5066;border-color:#d2dbe6;font-size:12px}
.primary{background:#2b64b5;font-size:12px}
.text-button{color:#365e91;font-size:11px}
.icon-button{color:#5c6f86;border-color:#d7dfe9}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #407fc6;outline-offset:3px}
.search-box input{color:#26384b;font-size:12px}
.search-box input::placeholder,.notes-form textarea::placeholder{color:#68768a;opacity:1}
.tabbar{border-bottom-color:#cfd7e2}
.tabbar button{color:#5e6d80;font-size:12px}
.tabbar button.active{color:#234f8c;font-weight:750}
.tabbar button.active:after{height:3px;background:#386bbb}
.data-basis{padding:10px 15px;background:#fafbfc;border-color:#dce3eb}
.data-basis>div>span:not(.pill),.data-basis small,.data-basis .pill{color:#5e6d7e;font-size:11px}
.data-basis strong{color:#2e435e;font-size:13px}
.data-status{border-color:#dce3eb}
.section-header{margin-top:20px;margin-bottom:10px}
.section-header h2{font-size:14px;color:#283b50;font-weight:750}

/* The legend uses both words and dots; no meaning depends on color alone. */
.color-legend{display:flex;align-items:center;flex-wrap:wrap;gap:5px 15px;font-size:11px;color:#526174;line-height:1.55;margin:8px 0 10px}
.color-legend>span,.color-legend>div{display:inline-flex;align-items:center;gap:5px}
.legend-dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:0 0 7px;margin-right:4px;vertical-align:middle}
.legend-dot.green{background:#2f825b}.legend-dot.amber{background:#bc6b1e}.legend-dot.blue{background:#4177b9}
.summary-panel{padding:18px 21px;border-color:#dce3eb;background:#fff;box-shadow:0 2px 7px #20344e04}
.summary-top{margin-bottom:5px}
.summary-top .subtle{font-size:11px;color:#647083}
.summary-title{font-size:18px;line-height:1.5;margin:6px 0 12px;color:#25384b;letter-spacing:-.4px}
.summary-line{grid-template-columns:40px minmax(0,1fr);gap:9px;align-items:baseline;margin:7px 0;padding:8px 10px;border-radius:9px;border:1px solid transparent;font-size:13px;line-height:1.65;color:#34465a}
.summary-line p{margin:0;min-width:0;overflow-wrap:break-word;word-break:keep-all}
.summary-tag{font-size:11px;font-weight:750;line-height:1.5;padding:3px 5px;border-radius:6px;color:#485b72;background:#e8edf3}
.summary-line.tone-growth{background:#f0f8f3;border-color:#dbece0}
.summary-line.tone-growth .summary-tag{background:#dceee1;color:#1c6141}
.summary-line.tone-watch{background:#fff7eb;border-color:#f1dfc5}
.summary-line.tone-watch .summary-tag{background:#f8e6c9;color:#8a450a}
.summary-line.tone-info{background:#f0f5fd;border-color:#dce7f6}
.summary-line.tone-info .summary-tag{background:#deebfd;color:#2a5997}
.summary-line.tone-neutral{background:#f4f6f8;border-color:#e4e8ed}

.summary-line.tone-growth .number-emphasis{color:#1a6244}
.summary-line.tone-watch .number-emphasis{color:#8d470b}
.summary-line.tone-info .number-emphasis{color:#285c9d}

.summary-bottom .text-button{color:#2d5c9f;font-size:11px}

/* One short, explicit review priority. */
.focus-callout{display:flex;align-items:center;gap:12px;margin:12px 0 16px;padding:11px 14px;border:1px solid #e9cda7;border-left:4px solid #c47728;border-radius:11px;background:#fff6e8;color:#66451f;min-width:0}
.focus-callout>div{flex:1;min-width:0}

.focus-title{display:block;color:#6d3f12;font-size:13px;font-weight:750;line-height:1.6;margin:2px 0}
.focus-description{font-size:12px;line-height:1.65;color:#725534;margin:2px 0 0;word-break:keep-all;overflow-wrap:break-word}
.focus-callout>button,.focus-callout>a{flex:0 0 auto;align-self:center;font-size:11px;font-weight:700;color:#85450e;border:1px solid #dfbd90;border-radius:8px;background:#fffdf8;padding:7px 10px;white-space:nowrap}
.focus-callout button:hover,.focus-callout>a:hover{background:#ffefcf;border-color:#ca985c}

/* Blue, purple and teal describe PER / PBR / ROE, not investment suitability. */
.metrics-grid{gap:11px}
.metric-card{position:relative;padding:14px 16px 12px;border-radius:13px;border-color:#dbe3ed;border-top:3px solid var(--metric-color,#63758d);background:#fff;box-shadow:none;min-width:0;transition:border-color .15s,box-shadow .15s}

.metric-card.metric-pbr{--metric-color:#7150a2;--metric-soft:#f3edfa;border-color:#ddd1ec;border-top-color:#8061ad;background:linear-gradient(180deg,#faf7fd 0%,#fff 65%)}
.metric-card.metric-roe{--metric-color:#176e70;--metric-soft:#e9f6f5;border-color:#c7e2df;border-top-color:#2e8583;background:linear-gradient(180deg,#f2faf9 0%,#fff 65%)}
.metric-card:hover{transform:none;box-shadow:0 3px 12px #253b5610;border-color:var(--metric-color,#63758d)}

.metric-topic{display:block;font-size:11px;font-weight:650;color:#526176;line-height:1.5;margin-top:3px}
.metric-value{font-size:29px;line-height:1.25;margin:8px 0 5px;color:var(--metric-color,#304e73);font-weight:800;letter-spacing:-.7px;font-variant-numeric:tabular-nums;overflow-wrap:normal!important;word-break:keep-all}
.help-circle{width:17px;height:17px;flex-shrink:0;font-size:10px;background:#fff;color:var(--metric-color,#536d8f);border-color:currentColor;opacity:1}
.metric-meaning{display:block;color:#42556d;font-size:12px;line-height:1.6;min-height:0}
.metric-hint{display:block;font-size:11px;line-height:1.55;color:var(--metric-color,#4f6582);font-weight:650;margin-top:7px;word-break:keep-all;overflow-wrap:break-word}
.metric-period{font-size:11px;line-height:1.55;color:#617083;border-color:#dfe5ed;margin-top:9px;padding-top:8px;min-height:0}
.action-tile{min-height:74px;padding:13px 16px;border-color:#dce3ec}
.action-tile strong{color:#344e6e;font-size:13px}.action-tile small{color:#617288;font-size:11px}
.tile-symbol{background:#eaf1fc;color:#3265a7}
.latest-note{border-color:#dbe4ef;background:#f7f9fc;color:#536c89;padding:12px 15px}
.latest-note summary,.latest-note small,.coverage-note{font-size:11px;color:#596c84}
.latest-note p{font-size:12px;color:#405773}

/* Real financial rows receive priority, while movement labels remain explicit. */
.financial-table{font-size:12px}
.financial-table thead th{background:#edf1f6;color:#4b6079;font-size:11px}

      netGrowth: growth(a.netIncome, p.netIncome),
      operatingMargin: percent(a.operatingIncome, a.revenue),
      previousMargin: percent(p.operatingIncome, p.revenue),
      fcf,
      previousFcf: subtract(p.cfo, p.capex),
      debtRatio: percent(a.totalLiabilities, a.equity),
      roe: percent(roeInputs.netIncome, average),
      per: positive(price) ? divide(price, v.eps) : null,
      pbr: positive(price) ? divide(price, v.bps) : null,
      averageEquity: average,
      cfoToNetIncome: percent(a.cfo, a.netIncome),
      fcfMargin: percent(fcf, a.revenue)
    };
  }

  function scenario(company, priceChange, profitChange, inputPrice) {
    const c = object(company);
    const v = object(c.valuation);
    const base = metrics(c);
    const priceFactor = valid(priceChange) && priceChange >= -50 && priceChange <= 50
      ? 1 + priceChange / 100 : null;
    const profitFactor = valid(profitChange) && profitChange >= -150 && profitChange <= 100
      ? 1 + profitChange / 100 : null;

    // An omitted override uses the quote. Explicitly invalid input must not
    // produce apparently valid ratios from a different, silently reused price.
    const rawPrice = inputPrice === undefined ? object(c.quote).price : inputPrice;
    const basePrice = positive(rawPrice) ? rawPrice : null;
    const price = multiply(basePrice, priceFactor);
    const adjustedEps = positive(v.eps) ? multiply(v.eps, profitFactor) : null;

    return {
      price,
      per: positive(price) ? divide(price, adjustedEps) : null,
      pbr: positive(price) ? divide(price, v.bps) : null,
      roe: multiply(base.roe, profitFactor),
      priceFactor,
      profitFactor
    };
  }

  return { valid, divide, growth, metrics, scenario };
});

function calculationInputs(c,k){const a=c.annual||{},v=c.valuation||{},m=math.metrics(c),r=v.roeInputs||{netIncome:a.netIncome,openingEquity:a.previousEquity??c.previous?.equity,closingEquity:a.equity};if(k==='roe')return `<p class="basis-label">${esc(roeBasis(c))} · 단위 ${esc(c.unit)}</p><dl class="quick-stats"><div><dt>연간 순이익</dt><dd>${num(r.netIncome,2)}</dd></div><div><dt>기초 자본</dt><dd>${num(r.openingEquity,2)}</dd></div><div><dt>기말 자본</dt><dd>${num(r.closingEquity,2)}</dd></div><div><dt>평균 자본</dt><dd>${num(m.averageEquity,2)}</dd></div></dl>${v.roeInputs?'<p class="dialog-footnote">지배주주에게 속한 순이익과 자본을 함께 사용했습니다. 재무제표 탭의 연결 전체 금액과 구별됩니다.</p>':''}`;return `<dl class="quick-stats"><div><dt>기준 주가</dt><dd>${money(c.quote?.price,c)}</dd></div><div><dt>${k==='per'?'주당순이익 EPS':'주당순자산 BPS'}</dt><dd>${num(v[k==='per'?'eps':'bps'],c.currency==='KRW'?0:4)}${c.currency==='KRW'?'원':'달러'}</dd></div></dl>${k==='pbr'&&v.bpsInputs?`<p class="dialog-footnote">BPS = 기말 자본 ${num(v.bpsInputs.equity)}백만 달러 ÷ 실제 유통주식 ${num(v.bpsInputs.shares)}백만 주</p>`:''}<p class="dialog-footnote">${c.currency==='KRW'?'국내 기업은 FnGuide 완료 연간 EPS·BPS 기준입니다. 공시 기본 EPS와 제공사 산식은 다를 수 있습니다.':'완료 연간 기본 EPS·기말 BPS 기준입니다.'} 최근 12개월·예상 실적 기준 값과는 다를 수 있습니다.</p>`;}
function contextCard(r,c){const x=r.context;if(!x)return '';return `<details class="fold-panel context-card"><summary>기록할 때 참고한 숫자 <span>${esc((r.updatedAt||x.capturedAt||'').slice(0,10))}</span></summary><p>${esc(x.period)} · 주가 ${money(x.price,c)} (${esc(x.priceAsOf)})</p><p>PER ${ratio(x.per,'per')} · PBR ${ratio(x.pbr,'pbr')} · ROE ${ratio(x.roe,'roe')}</p><small>마지막으로 기록을 수정할 때 화면에 있던 자료입니다.</small></details>`;}
function scenarioSavedCard(x,c){return `<section class="saved-scenario"><span class="section-label">저장한 가정 · 실제 전망 아님</span><h3>주가 ${signed(x.priceChange)} · 이익 ${signed(x.profitChange)}</h3><p>가정한 주가 ${money(x.price,c)} · PER ${math.valid(x.per)?ratio(x.per,'per'):'계산 불가'} · PBR ${ratio(x.pbr,'pbr')} · ROE ${ratio(x.roe,'roe')}</p><small>${esc(x.period)} · 저장 ${esc((x.savedAt||'').slice(0,10))}</small><button class="text-button" data-scenario>새 가정으로 바꿔 보기 →</button></section>`;}
function saveScenario(){if(!scenarioDraft||!math.valid(scenarioDraft.price))return;updateRecord({savedScenario:{...scenarioDraft,savedAt:new Date().toISOString(),period:period(current()),quoteAsOf:current().quote?.asOf||''}});$('detail-dialog').close();setTab('notes');toast('이 기업의 내 기록에 가정을 저장했어요.');}
function importDialog(){pendingBackup=null;openDialog('다른 기기에서도 이어서 기록하세요',`<h2 class="dialog-title" id="dialog-title">백업 불러오기</h2><p class="dialog-intro">기업 노트에서 받은 JSON 백업 파일을 선택해 주세요. 기존 기록은 유지하고 빈 항목만 채웁니다.</p><label class="note-label" for="backup-file">백업 파일 선택</label><input type="file" id="backup-file" accept=".json,application/json"><div id="import-preview" role="status"></div><div class="dialog-actions"><button class="secondary" data-close>닫기</button><button class="primary" id="apply-backup" disabled>빈 항목에 기록 추가</button></div>`);}
async function inspectBackup(file){pendingBackup=null;$('apply-backup').disabled=true;if(!file)return;try{if(file.size>10*1024*1024)throw new Error('10MB 이하의 백업 파일을 선택해 주세요.');const parsed=window.NotebookRecords.parseBackup(await file.text(),companies.map(c=>c.id));pendingBackup=parsed;$('import-preview').innerHTML=`<div class="import-summary"><strong>${parsed.records.length}개 기업 기록을 확인했어요.</strong><p>${parsed.records.map(r=>esc(companies.find(c=>c.id===r.companyId)?.name||r.companyId)).join(' · ')||'불러올 수 있는 기업 기록이 없습니다.'}</p><small>${parsed.skipped?'알 수 없는 기업 '+parsed.skipped+'개는 제외했습니다. ':''}이미 작성한 내용과 상태는 덮어쓰지 않습니다.</small></div>`;$('apply-backup').disabled=!parsed.records.length;}catch(e){$('import-preview').textContent=e.message||'백업 파일을 읽지 못했습니다.';}}
function applyBackup(){if(!pendingBackup)return;const merged=window.NotebookRecords.mergeBackup(state.records,[...state.favorites],pendingBackup);state.records=merged.records;state.favorites=new Set(merged.favorites);pendingBackup=null;persist();$('detail-dialog').close();render();toast(persistence?merged.restoredCount+'개 기업에 비어 있던 기록을 추가했어요.':'이 화면에 기록을 불러왔지만 브라우저 저장은 제한되어 있어요.');}
function progress(){const n=companies.filter(c=>record(c.id).read).length;$('progress-label').textContent=n+' / '+companies.length+'개 기업 읽었어요';$('progress-fill').style.width=(companies.length?n/companies.length*100:0)+'%';const r=record(state.id);$('note-dot').textContent=[r.learned,r.reason,r.concern,r.condition,r.nextCheck].some(t=>typeof t==='string'&&t.trim())?'•':'';}
function renderList(){const q=state.query.trim().toLowerCase(),list=companies.filter(c=>(state.market==='all'||c.market===state.market)&&(!state.onlyFavorites||state.favorites.has(c.id))&&[c.name,c.symbol,c.sector,c.description].some(t=>String(t||'').toLowerCase().includes(q)));$('list-count').textContent='기업 노트 '+list.length;
$('company-list').innerHTML=list.length?list.map(c=>'<div class="company-item '+(c.id===state.id?'selected':'')+'"><button class="company-select" data-select="'+esc(c.id)+'" aria-current="'+(c.id===state.id)+'" aria-label="'+esc(c.name)+' 노트 열기"><span class="company-monogram" style="--company-color:'+(/^#[a-f\d]{3,8}$/i.test(c.color||'')?c.color:'#426653')+'">'+esc(c.monogram||c.name?.slice(0,1))+'</span><span class="company-text"><strong>'+esc(c.name)+'</strong><small>'+esc(c.symbol)+' · '+esc(market(c.market))+'</small></span></button><button class="icon-button favorite-star" data-favorite="'+esc(c.id)+'" aria-label="'+esc(c.name)+' 관심 기업 '+(state.favorites.has(c.id)?'해제':'등록')+'" aria-pressed="'+state.favorites.has(c.id)+'">'+(state.favorites.has(c.id)?'★':'☆')+'</button></div>').join(''):'<p class="empty-state">조건에 맞는 기업이 없습니다.<br>검색어나 필터를 바꿔 주세요.</p>';
document.querySelectorAll('[data-market]').forEach(b=>{b.classList.toggle('active',b.dataset.market===state.market);b.setAttribute('aria-pressed',String(b.dataset.market===state.market));});$('favorite-filter').setAttribute('aria-pressed',String(state.onlyFavorites));$('favorite-filter').textContent=state.onlyFavorites?'★ 관심만':'☆ 관심만';progress();}
function header(c){
 const r=record(c.id),q=c.quote||{},a=c.annual||{};
 $('company-header').innerHTML=`<div class="company-heading"><div><div class="eyebrow">${esc(market(c.market))} · ${esc(c.symbol)} · ${esc(c.sector)}</div><h1>${esc(c.name)} <span>기업 노트</span></h1></div><div class="heading-actions"><button class="secondary" data-copy>노트 복사</button><button class="icon-button" data-favorite="${esc(c.id)}" aria-label="관심 기업 ${state.favorites.has(c.id)?'해제':'등록'}" aria-pressed="${state.favorites.has(c.id)}">${state.favorites.has(c.id)?'★':'☆'}</button></div></div><p class="company-business">${esc(c.description)}</p><div class="data-basis"><div><span>기준 주가</span><strong>${money(q.price,c)}</strong><small>${esc(q.asOf||'미확인')}</small></div><div><span>계산에 쓴 실적</span><strong>${esc(a.label)}</strong><small>결산 ${esc(a.end)}</small></div><div class="data-status"><span class="pill">저장 자료 · 자동 갱신 안 됨</span><small>${c.latest?'최근 분기·반기 자료는 아래에서 별도 확인':'최근 분기 자료는 아직 확인하지 못했어요'}</small></div></div>`;
}
const info={
per:{name:'PER',title:'이익과 비교한 주식 가격',intro:'회사가 벌어들이는 이익에 비해 주가가 몇 배인지 보는 숫자입니다.',formula:'PER = 주가 ÷ 주당순이익(EPS)',high:'같은 업종보다 PER가 높다면 성장을 기대하는 가격일 수 있습니다. 기대만큼 이익이 늘지 않으면 부담이 됩니다.',low:'PER가 낮으면 이익에 비해 저렴할 수 있습니다. 다만 일시적으로 이익이 컸거나 앞으로 이익이 줄어들 것으로 예상되는 경우도 있습니다.',note:'적자이거나 EPS가 0 이하이면 일반적인 PER 비교를 하지 않습니다. 과거 실적인지 예상 실적인지도 맞춰 비교합니다.'},
pbr:{name:'PBR',title:'회사 자본과 비교한 주식 가격',intro:'회계상 자기자본에 비해 주가가 몇 배인지 보는 숫자입니다. 자기자본은 자산에서 부채를 뺀 금액입니다.',formula:'PBR = 주가 ÷ 주당순자산(BPS)',high:'PBR가 높으면 자본으로 이익을 잘 내거나 브랜드·기술을 높게 평가받을 수 있습니다. 성장 기대가 지나치게 반영됐는지도 살펴봅니다.',low:'PBR가 1배보다 낮으면 장부상 자본보다 낮은 가격일 수 있습니다. 수익성이 낮거나 자산의 실제 가치가 줄어들 위험이 있을 수도 있습니다.',note:'장부상 자기자본은 회사를 팔거나 청산할 때 받는 금액을 보장하지 않습니다. 업종과 ROE를 함께 보셔야 합니다.'},
roe:{name:'ROE',title:'주주의 자본으로 얼마나 벌었나요?',intro:'주주에게 속한 자본에 비해 1년 동안 순이익을 얼마나 냈는지 보여 줍니다.',formula:'ROE = 연간 순이익 ÷ 평균 자기자본 × 100\n평균 자기자본 = (기초 자기자본 + 기말 자기자본) ÷ 2',high:'ROE가 높으면 자본 대비 이익을 잘 낸 것입니다. 다만 많은 부채나 자사주 매입으로 자본이 줄어도 높아질 수 있어 원인을 확인해야 합니다.',low:'ROE가 낮으면 자본에 비해 이익이 적은 상태입니다. 수익성이 약해졌을 수도 있고, 새 사업에 투자한 자본이 아직 이익을 내기 전일 수도 있습니다.',note:'기초·기말 자기자본이 0 이하이면 일반적인 해석을 제한합니다. 일회성 이익과 자본 변동도 함께 확인합니다.'}};
function meaning(k,v){const currency=current()?.currency==='USD'?'달러':'원';if(!math.valid(v))return k==='roe'?'순이익과 평균 자본 확인이 필요해요':'가격 또는 계산 자료가 부족해요';return k==='per'?'주당순이익의 '+num(v,1)+'배인 가격':k==='pbr'?'주당 장부상 자본의 '+num(v,1)+'배':'평균 자본 100'+currency+'당 순이익 약 '+num(v,1)+currency;}

const focusMessages={
 'samsung-electronics':'다음 확정 실적에서 순이익과 영업현금을 함께 확인하세요.',
 'sk-hynix':'순이익 증가에 본업 외 이익이 얼마나 섞였는지 확인하세요.',
 leeno:'매출 성장과 높은 영업이익률이 함께 이어지는지 보세요.',
 'park-systems':'외상대금·재고 부담이 줄고 영업현금이 회복되는지 보세요.',
 msft:'늘어난 AI 투자가 매출과 현금으로 이어지는지 보세요.',
 nvda:'다음 분기에 외상대금이 실제 현금으로 들어오는지 보세요.'
};
const emphasize=t=>esc(t).replace(/([+−-]?\d[\d,]*(?:\.\d+)?\s*(?:%|배|억원|백만 달러))/g,'<strong class="number-emphasis">$1</strong>');
function cashNeedsReview(c){const m=math.metrics(c);return (math.valid(m.fcf)&&m.fcf<0)||(math.valid(m.cfoToNetIncome)&&m.cfoToNetIncome<100)||(math.valid(m.fcf)&&math.valid(m.previousFcf)&&m.fcf<m.previousFcf);}
function summaryTone(c,i){const m=math.metrics(c);if(i===2)return 'info';if(i===0){if(!math.valid(m.revenueGrowth)||!math.valid(m.operatingGrowth))return 'neutral';return m.revenueGrowth>0&&m.operatingGrowth>0?'growth':m.revenueGrowth<0||m.operatingGrowth<0?'watch':'neutral';}if(!math.valid(m.fcf)||!math.valid(c.annual?.cfo))return 'neutral';return cashNeedsReview(c)?'watch':'growth';}
function focusCallout(c){return `<div class="focus-callout"><div><span class="focus-label">다음 실적에서 꼭 볼 것</span><p class="focus-title">${esc(focusMessages[c.id]||c.analysis?.nextChecks?.[0]||'다음 실적의 이익과 영업현금을 함께 확인해 주세요.')}</p></div><button class="text-button" data-open-tab="reasoning">이유 보기 →</button></div>`;}
function financialRow(k,l,t,a,p){const core=['operatingIncome','cfo','totalLiabilities'].includes(k),isChange=math.valid(a[k])&&math.valid(p[k]),direction=isChange?(a[k]>p[k]?'up':a[k]<p[k]?'down':'flat'):'unknown',flow=['revenue','operatingIncome','netIncome','cfo'].includes(k),tone=flow&&['up','down'].includes(direction)?direction:'neutral',arrow={up:'↑ ',down:'↓ ',flat:'',unknown:''}[direction];return `<tr${core?' class="row-core"':''}><th scope="row">${l}${core?' <span class="row-important">핵심</span>':''}<small>${t}</small></th><td>${num(p[k])}</td><td><strong>${num(a[k])}</strong></td><td><span class="table-delta ${tone}">${arrow}${esc(change(a[k],p[k]))}</span></td></tr>`;}
function cards(c){const m=math.metrics(c),topics={per:'이익 대비 가격',pbr:'자본 대비 가격',roe:'자본으로 버는 힘'},hints={per:'이익이 계속 유지되는지 보세요',pbr:'ROE와 업종을 함께 보세요',roe:'부채와 일회성 이익도 보세요'};return '<div class="metrics-grid">'+['per','pbr','roe'].map(k=>`<button class="metric-card metric-${k}" data-metric="${k}" aria-label="${info[k].name} ${ratio(m[k],k)}, 뜻과 해석 보기"><span class="metric-label">${info[k].name}<span class="help-circle" aria-hidden="true">?</span></span><span class="metric-topic">${topics[k]}</span><strong class="metric-value">${ratio(m[k],k)}</strong><span class="metric-meaning">${esc(meaning(k,m[k]))}</span><span class="metric-hint">${hints[k]}</span><span class="metric-period">${k==='roe'?esc(roeBasis(c)):'주가 '+esc((c.quote?.asOf||'미확인').slice(0,10))+' ÷ 연간 '+(k==='per'?'EPS':'BPS')}<br>${esc(period(c))}</span></button>`).join('')+'</div>';}
function overview(c){
 const summary=(c.analysis?.summary||[]).slice(0,3),r=record(c.id);
 return `<section class="summary-panel panel"><div class="summary-top"><span class="section-label">이 회사, 세 줄로 이해하기</span><span class="subtle">${esc(c.annual?.label)}</span></div><h2 class="summary-title">${esc(c.analysis?.headline)}</h2>${summary.map((t,i)=>`<div class="summary-line tone-${summaryTone(c,i)}"><span class="summary-tag">${['사업','현금','가격'][i]}</span><p class="text">${emphasize(t)}</p></div>`).join('')}${focusCallout(c)}<div class="color-legend"><span>요약 표시</span><span><i class="legend-dot green" aria-hidden="true"></i>확인된 개선</span><span><i class="legend-dot amber" aria-hidden="true"></i>추가 확인</span><span><i class="legend-dot blue" aria-hidden="true"></i>가격 정보</span></div></section><div class="section-header"><h2>이 3개 숫자를 함께 보세요</h2><span>카드를 누르면 뜻과 계산 근거가 나와요</span></div>${cards(c)}<div class="overview-bottom action-tiles"><button class="mini-panel action-tile" data-scenario><span class="tile-symbol" aria-hidden="true">↕</span><span><strong>이익이 절반으로 줄면?</strong><small>주가·이익을 바꿔서 가정해 보세요</small></span><span aria-hidden="true">↗</span></button><button class="mini-panel action-tile" data-open-tab="notes"><span class="tile-symbol" aria-hidden="true">✓</span><span><strong>내 검토 조건 남기기</strong><small>${r.reviewDate?'다음 확인 '+esc(r.reviewDate):'무엇을 확인하면 생각이 달라질까요?'}</small></span><span aria-hidden="true">→</span></button></div>${latestSection(c)}`;
}

const rows=[['revenue','매출','물건·서비스를 팔아 번 전체 금액'],['operatingIncome','영업이익','본업에서 비용을 빼고 남긴 이익'],['netIncome','순이익','이자·세금 등을 반영한 최종 이익'],['cfo','영업현금흐름','영업활동으로 실제 들어오고 나간 현금의 차이'],['capex','설비투자','설비·무형자산 등에 사용한 현금'],['totalAssets','자산','회사가 가진 자원'],['totalLiabilities','부채','회사가 갚거나 이행해야 할 의무'],['equity','자기자본','자산에서 부채를 뺀 주주의 몫']];
function change(a,b){if(!math.valid(a)||!math.valid(b))return '확인 필요';if(b<0&&a>0)return '흑자 전환';if(b>0&&a<0)return '적자 전환';return b<=0?'비교 어려움':signed(math.growth(a,b));}
function charts(c){return '<div class="charts-grid">'+[['revenue','매출'],['operatingIncome','영업이익'],['cfo','영업현금흐름']].map(([k,title])=>{const p=c.previous?.[k],a=c.annual?.[k],max=Math.max(math.valid(p)?Math.abs(p):0,math.valid(a)?Math.abs(a):0,1);return '<section class="mini-panel"><h3>'+title+'</h3>'+[[p,c.previous?.label||'전년',''],[a,c.annual?.label||'당년','current']].map(([v,l,cls])=>'<div class="bar-row"><div class="bar-label"><span>'+esc(l)+'</span><strong>'+num(v)+'</strong></div><div class="bar-track" aria-hidden="true"><span class="bar-fill '+cls+(math.valid(v)&&v<0?' negative':'')+'" style="width:'+(math.valid(v)?Math.abs(v)/max*100:0)+'%"></span></div></div>').join('')+'<small>'+esc(c.unit)+' · 각 항목 안에서 비교'+([p,a].some(v=>math.valid(v)&&v<0)?' · 막대 길이는 절댓값, 음수는 수치와 색으로 표시':'')+'</small></section>';}).join('')+'</div>';}
function sources(c){return '<details class="sources-panel"><summary>출처와 계산에 사용한 기준 보기 <span>'+(c.sources?.length||0)+'개 자료</span></summary><ul class="source-list">'+(c.sources||[]).map(s=>'<li>'+(url(s.url)?'<a href="'+esc(url(s.url))+'" target="_blank" rel="noopener noreferrer">'+esc(s.title)+' ↗</a>':'<span>'+esc(s.title)+'</span>')+'<small>'+esc(s.period||'')+(s.kind?' · '+esc(s.kind):'')+'</small></li>').join('')+'</ul>'+((c.notes||[]).length?'<ul class="source-notes">'+lines(c.notes,'')+'</ul>':'')+'<p class="dialog-footnote">자료 확인일 '+esc(dataset.asOf||'확인 필요')+' · 저장된 자료이며 자동 갱신되지 않습니다.</p></details>';}
function financials(c){const a=c.annual||{},p=c.previous||{},m=math.metrics(c);return `<div class="section-header"><div><span class="section-label">숫자를 읽는 순서</span><h2>이익 → 현금 → 부채를 확인해 보세요</h2></div><span>단위: ${esc(c.unit)}</span></div><div class="table-wrap"><table class="financial-table"><caption class="sr-only">${esc(c.name)} 전년과 당년 재무제표 비교, 단위 ${esc(c.unit)}</caption><thead><tr><th scope="col">무엇을 보나요?</th><th scope="col">${esc(p.label||'전년')}<small>${esc(p.end||'')}</small></th><th scope="col">${esc(a.label||'당년')}<small>${esc(a.end||'')}</small></th><th scope="col">전년 대비</th></tr></thead><tbody>${rows.map(([k,l,t])=>financialRow(k,l,t,a,p)).join('')}</tbody></table></div><p class="table-note">자산·부채·자기자본은 결산일의 금액이고, 나머지는 해당 연간의 합계입니다. ${esc(a.statementBasis||'원자료 기준')}. ${c.valuation?.roeInputs?'ROE는 위 표의 전체 자본과 구별한 지배주주 기준입니다.':''}</p>${cashExplanation(c)}<div class="finance-checks"><section class="mini-panel"><span class="section-label">본업의 수익성</span><h3>100을 팔면 본업에서 얼마나 남나요?</h3><strong class="check-value">${pct(m.operatingMargin)}</strong><p>${math.valid(m.operatingMargin)?'매출 100'+(c.currency==='KRW'?'원':'달러')+'당 영업이익 약 '+num(m.operatingMargin,1)+(c.currency==='KRW'?'원':'달러')+'입니다.':'매출과 영업이익 확인이 필요합니다.'}</p></section><section class="mini-panel"><span class="section-label">부채와 자본</span><h3>총부채 ÷ 자기자본</h3><strong class="check-value">${pct(m.debtRatio)}</strong><p>낮을수록 자본 대비 총부채가 적습니다. 실제 부담은 차입금·만기·이자도 보셔야 합니다.</p></section></div><details class="fold-panel"><summary>전년과 비교한 그래프 보기</summary>${charts(c)}</details>${sources(c)}`;}
function reasoning(c){return '<div class="section-header"><div><span class="section-label">판단의 이유를 함께 봐요</span><h2>좋은 점과 걱정되는 점</h2></div></div><div class="analysis-grid"><section class="analysis-card good"><span class="pill green">좋은 점</span><h3>이 부분은 긍정적으로 볼 수 있어요</h3><ul>'+lines(c.analysis?.positives,'추가 자료 확인이 필요합니다.')+'</ul></section><section class="analysis-card risk"><span class="pill amber">주의할 점</span><h3>이 부분은 한 번 더 확인해 주세요</h3><ul>'+lines(c.analysis?.risks,'추가 자료 확인이 필요합니다.')+'</ul></section></div><section class="next-checks"><h3>다음 실적에서 확인할 것</h3><ol>'+lines(c.analysis?.nextChecks,'새로운 공시가 나오면 실적과 현금흐름을 확인합니다.')+'</ol></section><p class="table-note">위 내용은 공시 숫자에 대한 해석입니다. '+esc(c.analysis?.priceComment||'')+'</p>'+sources(c);}
const saveText=()=>persistence?'이 브라우저에 자동 저장됩니다.':'브라우저 저장이 제한되어 현재 화면에만 보관됩니다. 내 기록 백업을 이용해 주세요.';
function notes(c){const r=record(c.id),oldHas=[r.learned,r.reason,r.concern].some(t=>typeof t==='string'&&t.trim());return `<div class="section-header"><div><span class="section-label">나중의 제가 다시 볼 수 있도록</span><h2>내 생각과 확인할 조건</h2></div><span class="save-status" id="save-status" role="status">${esc(saveText())}</span></div><form class="notes-form"><div class="decision-fields"><div><label class="note-label" for="note-status">지금의 검토 상태</label><select id="note-status" data-note="status">${Object.entries(statusLabels).map(([v,t])=>`<option value="${v}"${(r.status||'')===v?' selected':''}>${t}</option>`).join('')}</select></div><div><label class="note-label" for="note-reviewDate">다음 확인 날짜</label><input type="date" id="note-reviewDate" data-note="reviewDate" value="${esc(r.reviewDate||'')}"><small>노트에 날짜만 저장되며 알림은 보내지 않습니다.</small></div></div><label class="note-label" for="note-condition">어떤 변화가 생기면 다시 판단할까요?</label><textarea maxlength="20000" id="note-condition" data-note="condition" rows="2" placeholder="예: 다음 실적에서도 이익은 늘지만 영업현금이 줄면 다시 살펴보겠습니다.">${esc(r.condition||'')}</textarea><label class="note-label" for="note-nextCheck">다음에 확인할 자료</label><textarea maxlength="20000" id="note-nextCheck" data-note="nextCheck" rows="2" placeholder="예: 다음 분기 실적발표에서 영업현금·설비투자·차입금 만기를 확인하겠습니다.">${esc(r.nextCheck||'')}</textarea><button type="button" class="text-button" data-use-checks>이 기업의 확인 항목을 불러오기</button><details class="fold-panel record-details"${oldHas?' open':''}><summary>자유 메모 · 알게 된 점과 관심 이유</summary>${[['learned','새롭게 알게 된 점','예: 이 회사의 주력 사업과 돈을 버는 방식을 정리해 보세요.'],['reason','관심을 유지하는 이유','예: 매출이 늘면서 현금 유입도 늘어 관심을 갖고 있습니다.'],['concern','걱정되는 점 · 더 확인할 것','예: 최근 이익에 일회성 이익이 포함됐는지 궁금합니다.']].map(([k,l,t])=>`<label class="note-label" for="note-${k}">${l}</label><textarea maxlength="20000" id="note-${k}" data-note="${k}" rows="3" placeholder="${t}">${esc(r[k]||'')}</textarea>`).join('')}</details><div class="note-toolbar"><label class="checkbox-label"><input type="checkbox" id="note-read"${r.read?' checked':''}> 이 기업 노트를 읽었어요</label><span>내용을 바꾸면 자동으로 저장됩니다.</span></div></form><div id="saved-context">${contextCard(r,c)}</div>${r.savedScenario?scenarioSavedCard(r.savedScenario,c):''}<div class="dialog-actions record-actions"><button class="secondary" data-export-current>이 기업 기록 백업</button><button class="secondary" data-import>백업 불러오기</button><button class="primary" data-copy>분석과 내 기록 복사</button></div><p class="dialog-footnote">기록은 이 브라우저에 저장되며 기기 사이에 동기화되지 않습니다. 백업 파일은 다른 기기에서 불러올 수 있습니다.</p>`;}
function content(){const c=current();if(!c){$('tab-content').innerHTML='<p>기업 자료를 불러오지 못했습니다.</p>';return;}document.querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===state.tab;b.classList.toggle('active',on);b.setAttribute('aria-selected',String(on));b.setAttribute('tabindex',on?'0':'-1');b.id='tab-'+b.dataset.tab;b.setAttribute('aria-controls','tab-content');});$('tab-content').setAttribute('aria-labelledby','tab-'+state.tab);$('tab-content').innerHTML=({overview,financials,reasoning,notes}[state.tab]||overview)(c);progress();}
function render(){renderList();if(current())header(current());content();}
function setTab(t){if(!['overview','financials','reasoning','notes'].includes(t))return;state.tab=t;content();}
function openDialog(eyebrow,html){$('dialog-eyebrow').textContent=eyebrow;$('dialog-content').innerHTML=html;if(!$('detail-dialog').open)$('detail-dialog').showModal();}
function metricDialog(k){const i=info[k],c=current();if(!i||!c)return;const v=math.metrics(c)[k];openDialog('숫자가 쉬워지는 설명',`<h2 class="dialog-title" id="dialog-title">${i.name} · ${i.title}</h2><p class="dialog-intro">${i.intro}</p><div class="formula-box">${esc(i.formula).replace(/\n/g,'<br>')}</div><div class="case-row"><span class="pill blue">높을 때</span><p>${i.high}</p></div><div class="case-row"><span class="pill blue">낮을 때</span><p>${i.low}</p></div><section class="calculation-inputs"><h3>${esc(c.name)}는 이렇게 계산했어요</h3>${calculationInputs(c,k)}<strong class="calculation-total">${i.name} ${ratio(v,k)}</strong></section><p class="dialog-footnote">${esc(period(c))} 실적 기준 · ${k==='roe'?esc(roeBasis(c)):esc(priceDate(c))}<br>${i.note}</p><button class="primary full-width" data-scenario>숫자를 바꿔 보며 이해하기</button>`);}
function scenarioDialog(){const c=current(),q=math.valid(c.quote?.price)&&c.quote.price>0?c.quote.price:'',cur=c.currency==='KRW'?'원':'달러';openDialog('이익이 없어지는 상황도 살펴봐요',`<h2 class="dialog-title" id="dialog-title">가격과 이익, 가정해 보기</h2><p class="dialog-intro">${esc(c.name)} · ${esc(period(c))}을 바탕으로 한 연습입니다. 전망이나 목표주가가 아닙니다.</p><div class="scenario-presets" role="group" aria-label="상황 빠르게 선택"><button class="secondary" data-preset="price-low">주가 −20%</button><button class="secondary" data-preset="profit-half">이익 절반</button><button class="secondary" data-preset="profit-zero">이익 0원</button><button class="secondary" data-preset="profit-loss">적자 전환</button></div><div class="scenario-fields"><label class="input-group scenario-base-field" for="scenario-base"><span>기준 주가 (${cur})</span><input id="scenario-base" type="number" inputmode="decimal" min="0.01" step="any" value="${q}" placeholder="가격을 직접 입력해 주세요"><small>${esc(priceDate(c))} · 이 계산에만 사용합니다.</small></label><div class="input-group"><div class="range-header"><label for="scenario-price">주가가 달라진다면</label><output id="price-output" for="scenario-price">0%</output></div><input id="scenario-price" type="range" min="-50" max="50" step="1" value="0"><div class="range-labels"><span>−50%</span><span>+50%</span></div></div><div class="input-group"><div class="range-header"><label for="scenario-profit">순이익이 달라진다면</label><output id="profit-output" for="scenario-profit">0%</output></div><input id="scenario-profit" type="range" min="-150" max="100" step="1" value="0"><div class="range-labels"><span>−150% · 적자</span><span>+100%</span></div></div></div><div class="scenario-results" id="scenario-results" aria-live="polite"></div><p class="scenario-description" id="scenario-description"></p><p class="dialog-footnote">자기자본·주식수는 고정하고, 순이익과 EPS가 같은 비율로 변한다고 가정합니다. −100%는 이익 0원, −150%는 원래 이익 절반만큼의 손실입니다.</p><div class="dialog-actions"><button class="secondary" id="reset-scenario">처음 값으로</button><button class="primary" id="save-scenario">이 가정을 내 기록에 저장</button></div>`);updateScenario();}
function updateScenario(){if(!$('scenario-base'))return;const c=current(),pc=Number($('scenario-price').value),ec=Number($('scenario-profit').value),raw=$('scenario-base').value.trim(),typed=raw!==''?Number(raw):null,r=math.scenario(c,pc,ec,typed),zero=ec===-100,loss=ec < -100;scenarioDraft={basePrice:typed,priceChange:pc,profitChange:ec,price:r.price,per:r.per,pbr:r.pbr,roe:r.roe};$('price-output').textContent=(pc>0?'+':'')+pc+'%';$('profit-output').textContent=(ec>0?'+':'')+ec+'%';$('scenario-results').innerHTML=[['가정한 주가',math.valid(r.price)?money(r.price,c):'직접 입력'],['PER',zero?'이익 0':loss?'적자':ratio(r.per,'per')],['PBR',ratio(r.pbr,'pbr')],['ROE',ratio(r.roe,'roe')]].map(([l,v])=>`<div class="scenario-result"><span>${l}</span><strong>${v}</strong>${l==='PER'&&(zero||loss)?'<small>일반적인 PER 계산 불가</small>':''}</div>`).join('');$('scenario-description').textContent=zero?'이익이 0이면 PER은 계산할 수 없고 ROE는 0%가 됩니다. 주가와 자본이 그대로라면 PBR은 변하지 않습니다.':loss?'적자에서는 일반적인 PER로 싼지 판단하지 않습니다. 평균 자본이 양수이면 손실에 따라 ROE도 음수가 됩니다.':!math.valid(r.price)?'양수인 주가를 입력해 주세요. ROE는 주가와 관계없이 이익 변화에 따라 움직입니다.':pc===-20&&ec===0?'이익이 그대로인데 주가만 20% 내리면 PER·PBR도 20% 낮아집니다. 회사가 돈 버는 능력을 보는 ROE는 그대로입니다.':pc===0&&ec===-50?'주가는 그대로인데 이익이 절반이면 PER은 두 배, ROE는 절반이 됩니다. 주가가 오르지 않아도 PER이 높아질 수 있습니다.':'주가 변화는 PER·PBR에, 이익 변화는 PER·ROE에 반영됩니다. 한 숫자의 높고 낮음보다 바뀐 이유를 확인해 주세요.';$('save-scenario').disabled=!math.valid(r.price);}
function methodDialog(){const c=current();openDialog('같은 기준으로 비교하기','<h2 class="dialog-title" id="dialog-title">이 노트의 계산 기준</h2><p class="dialog-intro">기업별 결산일과 재무제표 기준을 표시합니다. 아래 값은 저장된 자료이며 자동으로 갱신되지 않습니다.</p><div class="formula-box">PER = 주가 ÷ EPS<br>PBR = 주가 ÷ BPS<br>ROE = 연간 순이익 ÷ 평균 자기자본 × 100<br>평균 자기자본 = (기초 자본 + 기말 자본) ÷ 2<br>영업이익률 = 영업이익 ÷ 매출 × 100<br>부채비율 = 총부채 ÷ 자기자본 × 100<br>증감률 = (당년 값 ÷ 전년 값 − 1) × 100<br>단순 FCF = 영업현금흐름 − 현금 설비투자</div><ul class="method-list"><li>한국 기업의 금액은 억원, 미국 기업은 백만 달러입니다. 서로 다른 단위의 절대 금액을 그대로 비교하지 마세요.</li><li>PER·PBR는 표시된 주가 시점과 실적 기간의 조합입니다. ROE는 표시된 완료 연간 순이익과 평균 자본을 사용합니다.</li><li>전년 값이 0 또는 음수이면 성장률을 표시하지 않습니다. EPS·BPS·기초 또는 기말 자본이 0 이하인 지표도 일반적인 배수 비교를 하지 않습니다.</li><li>총부채에는 매입채무 등도 들어 있습니다. 총부채와 이자가 붙는 차입금은 다릅니다.</li><li>설비투자의 포함 항목과 회사별 FCF 정의는 다를 수 있습니다. 이 노트는 영업현금에서 명시된 현금 설비투자를 빼서 보여 드립니다.</li><li>분기와 연간, 잠정 발표와 확정 자료를 구분합니다. 다른 기업과 비교할 때도 기간·업종·계산 기준을 맞춰 주세요.</li></ul><section class="mini-panel"><h3>'+esc(c.name)+'에 적용한 기준</h3><p>연간 실적: '+esc(c.annual?.label)+' ('+esc(c.annual?.start||'')+' ~ '+esc(c.annual?.end||'')+')</p><p>재무제표: '+esc(c.annual?.statementBasis||'출처 기준')+'</p><p>설비투자: '+esc(c.annual?.capexDefinition||'출처의 현금 지출 기준')+'</p><p>지표 산식·이익 기준: '+esc(c.valuation?.basis||'완료 연간 실적과 평균 자기자본 사용')+'</p><p>'+esc(priceDate(c))+'</p></section>'+sources(c));}
function markdown(c){const a=c.annual||{},p=c.previous||{},m=math.metrics(c),r=record(c.id);return '# '+c.name+' 기업 노트\n\n'+c.symbol+' · '+market(c.market)+'\n\n'+(c.description||'')+'\n\n자료 확인일: '+(dataset.asOf||'확인 필요')+'\n연간 실적: '+(a.label||'')+' ('+(a.start||'')+' ~ '+(a.end||'')+')\n금액 단위: '+c.unit+'\n\n## 세 줄 요약\n\n'+(c.analysis?.summary||[]).map(t=>'- '+t).join('\n')+'\n\n## 주요 지표\n\n'+['per','pbr','roe'].map(k=>'- '+info[k].name+': '+ratio(m[k],k)).join('\n')+'\n\n실적 기준: '+period(c)+'\n'+priceDate(c)+'\n\n## 재무제표\n\n| 항목 | '+(p.label||'전년')+' | '+(a.label||'당년')+' |\n|---|---:|---:|\n'+rows.map(([k,l])=>'| '+l+' | '+num(p[k])+' | '+num(a[k])+' |').join('\n')+'\n\n설비투자 기준: '+(a.capexDefinition||'원자료 기준')+'\n재무제표 기준: '+(a.statementBasis||'원자료 기준')+'\n\n## 좋은 점\n\n'+(c.analysis?.positives||[]).map(t=>'- '+t).join('\n')+'\n\n## 주의할 점\n\n'+(c.analysis?.risks||[]).map(t=>'- '+t).join('\n')+'\n\n## 다음에 확인할 것\n\n'+(c.analysis?.nextChecks||[]).map(t=>'- '+t).join('\n')+'\n\n'+(c.analysis?.priceComment||'')+'\n\n## 내 기록\n\n### 새롭게 알게 된 점\n'+(r.learned||'(아직 기록하지 않았습니다.)')+'\n\n### 관심을 유지하는 이유\n'+(r.reason||'(아직 기록하지 않았습니다.)')+'\n\n### 걱정과 확인할 것\n'+(r.concern||'(아직 기록하지 않았습니다.)')+'\n\n### 검토 조건\n'+(r.condition||'(미작성)')+'\n\n### 다음 확인 자료\n'+(r.nextCheck||'(미작성)')+'\n\n상태: '+(statusLabels[r.status]||statusLabels[''])+'\n다음 확인 날짜: '+(r.reviewDate||'(미정)')+'\n\n'+(r.savedScenario?'저장한 가정 (전망 아님): 주가 '+signed(r.savedScenario.priceChange)+' · 이익 '+signed(r.savedScenario.profitChange)+'\n가정한 가격 '+money(r.savedScenario.price,c)+' · PER '+ratio(r.savedScenario.per,'per')+' · PBR '+ratio(r.savedScenario.pbr,'pbr')+' · ROE '+ratio(r.savedScenario.roe,'roe')+'\n기준 실적 '+r.savedScenario.period+'\n':'')+'\n읽음: '+(r.read?'예':'아니요')+'\n\n## 출처\n\n'+(c.sources||[]).map(s=>'- '+s.title+' · '+(s.period||'')+'\n  '+url(s.url)).join('\n')+'\n\n'+(c.notes||[]).map(t=>'- '+t).join('\n')+'\n\n저장된 자료이며 자동 갱신되지 않습니다. 분석은 공시 자료에 대한 해석입니다.\n';}
async function copyNote(){const c=current();if(!c)return;const text=markdown(c);try{if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(text);toast('분석과 내 기록을 함께 복사했어요.');}catch(_){download(c.symbol+'-기업노트.md',text,'text/markdown;charset=utf-8');toast('복사 권한이 없어 노트를 파일로 내려받았어요.');}}
function exportRecords(single){const selected=single?companies.filter(c=>c.id===state.id):companies,out={type:'기업 노트 개인 기록 백업',version:2,exportedAt:new Date().toISOString(),records:selected.map(c=>({...record(c.id),companyId:c.id,companyName:c.name,symbol:c.symbol,favorite:state.favorites.has(c.id)}))},text=JSON.stringify(out,null,2);try{window.NotebookRecords.parseBackup(text,companies.map(c=>c.id));}catch(e){download('기업노트-원본복구.json',text,'application/json;charset=utf-8');toast('원본 기록을 보관했어요. 자동 복원 형식 확인이 필요합니다: '+e.message);return;}download((single?current().symbol+'-':'')+'기업노트-내기록.json',text,'application/json;charset=utf-8');toast('다시 불러올 수 있는 백업 파일을 만들었어요.');}
document.addEventListener('click',e=>{const b=e.target.closest('button,a.brand');if(!b)return;if(b.dataset.select){state.id=b.dataset.select;persist();render();}else if(b.dataset.favorite){const id=b.dataset.favorite;state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);persist();renderList();if(current())header(current());}else if(b.dataset.market){state.market=b.dataset.market;renderList();}else if(b.dataset.tab)setTab(b.dataset.tab);else if(b.dataset.openTab)setTab(b.dataset.openTab);else if(b.dataset.metric)metricDialog(b.dataset.metric);else if(b.hasAttribute('data-scenario'))scenarioDialog();else if(b.hasAttribute('data-copy'))copyNote();else if(b.hasAttribute('data-export-current'))exportRecords(true);else if(b.hasAttribute('data-import'))importDialog();else if(b.hasAttribute('data-close')||b.id==='close-dialog')$('detail-dialog').close();else if(b.id==='favorite-filter'){state.onlyFavorites=!state.onlyFavorites;renderList();}else if(b.id==='method-button')methodDialog();else if(b.id==='export-all')exportRecords(false);else if(b.id==='apply-backup')applyBackup();else if(b.id==='save-scenario')saveScenario();else if(b.hasAttribute('data-use-checks')){const input=$('note-nextCheck');if(input.value.trim()){toast('이미 작성한 확인 항목이 있어 그대로 두었어요.');return;}input.value=(current().analysis?.nextChecks||[]).join('\n');updateRecord({nextCheck:input.value});toast('다음에 확인할 항목을 가져왔어요.');}else if(b.dataset.preset){const values={'price-low':[-20,0],'profit-half':[0,-50],'profit-zero':[0,-100],'profit-loss':[0,-150]};const [pc,ec]=values[b.dataset.preset]||[0,0];$('scenario-price').value=pc;$('scenario-profit').value=ec;updateScenario();}else if(b.id==='reset-scenario'){const c=current();$('scenario-base').value=math.valid(c.quote?.price)&&c.quote.price>0?c.quote.price:'';$('scenario-price').value=0;$('scenario-profit').value=0;updateScenario();}else if(b.classList.contains('brand')){e.preventDefault();state.query='';state.market='all';state.onlyFavorites=false;$('search').value='';state.tab='overview';render();}});
$('search').addEventListener('input',e=>{state.query=e.target.value;renderList();});
document.addEventListener('input',e=>{if(e.target.matches('[data-note]')){updateRecord({[e.target.dataset.note]:e.target.value});}else if(['scenario-price','scenario-profit','scenario-base'].includes(e.target.id))updateScenario();});
document.addEventListener('change',e=>{if(e.target.id==='note-read')updateRecord({read:e.target.checked});else if(e.target.id==='backup-file')inspectBackup(e.target.files?.[0]);});
document.addEventListener('submit',e=>{if(e.target.classList.contains('notes-form'))e.preventDefault();});
document.querySelector('.tabbar').addEventListener('keydown',e=>{const tabs=[...document.querySelectorAll('[data-tab]')],i=tabs.indexOf(document.activeElement);if(i<0||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;setTab(tabs[n].dataset.tab);tabs[n].focus();});
$('detail-dialog').addEventListener('click',e=>{if(e.target!==$('detail-dialog'))return;const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();});
render();
})();

</script>
</body></html>
