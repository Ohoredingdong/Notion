function cards(c){const m=math.metrics(c);return '<div class="metrics-grid">'+['per','pbr','roe'].map(k=>'<button class="metric-card" data-metric="'+k+'" aria-label="'+info[k].name+' '+ratio(m[k],k)+', 뜻과 해석 보기"><span class="metric-label">'+info[k].name+'<span class="help-circle" aria-hidden="true">?</span></span><strong class="metric-value">'+ratio(m[k],k)+'</strong><span class="metric-meaning">'+esc(meaning(k,m[k]))+'</span><span class="metric-period">실적 '+esc(period(c))+'<br>'+(k==='roe'?'연간 · 평균 자기자본 기준':esc(priceDate(c)))+'</span></button>').join('')+'</div>';}
function overview(c){const a=c.annual||{},m=math.metrics(c),summary=Array.isArray(c.analysis?.summary)?c.analysis.summary.slice(0,3):['분석 자료를 확인해 주세요.'];return '<div class="summary-panel panel"><div class="summary-top"><span class="section-label">이 회사, 세 줄로 이해하기</span></div><h2 class="summary-title">'+esc(c.analysis?.headline||'숫자가 말해 주는 회사의 모습')+'</h2>'+summary.map((t,i)=>'<div class="summary-line"><span class="number">0'+(i+1)+'</span><p class="text">'+esc(t)+'</p></div>').join('')+'<div class="summary-bottom">공시 자료에 대한 해석 · 판단 근거 탭에서 이유와 출처를 보실 수 있어요.</div></div><div class="section-header"><h2>주요 지표</h2><span>카드를 누르면 뜻을 쉽게 설명해 드려요</span></div>'+cards(c)+'<div class="overview-bottom"><section class="mini-panel"><span class="section-label">본업과 현금</span><h3>잘 팔고, 현금도 들어오나요?</h3><dl class="quick-stats"><div><dt>매출 · 전년 대비</dt><dd>'+signed(m.revenueGrowth)+'</dd></div><div><dt>영업이익률</dt><dd>'+pct(m.operatingMargin)+'</dd></div><div><dt>영업현금흐름</dt><dd>'+num(a.cfo)+' <small>'+esc(c.unit)+'</small></dd></div></dl><button class="text-button" data-open-tab="financials">재무제표 자세히 보기 →</button></section><section class="mini-panel"><span class="section-label">직접 움직여 보세요</span><h3>가격이 오르면 PER도 오를까요?</h3><p>주가와 이익을 바꿔 보면서<br>PER · PBR · ROE의 변화를 확인해 보세요.</p><button class="scenario-link" data-scenario>가정해 보기 <span aria-hidden="true">↗</span></button></section></div>'+(c.latest?'<section class="latest-note"><span class="section-label">더 최근에 나온 실적</span><p><strong>'+esc(c.latest.label||c.latest.end)+(c.latest.preliminary?' · 잠정':'')+'</strong> '+esc(Array.isArray(c.latest.notes)?c.latest.notes.join(' '):c.latest.notes||'')+'</p><small>위 주요 지표는 완료 연간 실적으로 계산합니다. 최근 분기와 기간이 다릅니다.</small></section>':'');}
const rows=[['revenue','매출','물건·서비스를 팔아 번 전체 금액'],['operatingIncome','영업이익','본업에서 비용을 빼고 남긴 이익'],['netIncome','순이익','이자·세금 등을 반영한 최종 이익'],['cfo','영업현금흐름','영업활동으로 실제 들어오고 나간 현금의 차이'],['capex','설비투자','설비·무형자산 등에 사용한 현금'],['totalAssets','자산','회사가 가진 자원'],['totalLiabilities','부채','회사가 갚거나 이행해야 할 의무'],['equity','자기자본','자산에서 부채를 뺀 주주의 몫']];
function change(a,b){if(!math.valid(a)||!math.valid(b))return '확인 필요';if(b<0&&a>0)return '흑자 전환';if(b>0&&a<0)return '적자 전환';return b<=0?'비교 어려움':signed(math.growth(a,b));}
function charts(c){return '<div class="charts-grid">'+[['revenue','매출'],['operatingIncome','영업이익'],['cfo','영업현금흐름']].map(([k,title])=>{const p=c.previous?.[k],a=c.annual?.[k],max=Math.max(math.valid(p)?Math.abs(p):0,math.valid(a)?Math.abs(a):0,1);return '<section class="mini-panel"><h3>'+title+'</h3>'+[[p,c.previous?.label||'전년',''],[a,c.annual?.label||'당년','current']].map(([v,l,cls])=>'<div class="bar-row"><div class="bar-label"><span>'+esc(l)+'</span><strong>'+num(v)+'</strong></div><div class="bar-track" aria-hidden="true"><span class="bar-fill '+cls+(math.valid(v)&&v<0?' negative':'')+'" style="width:'+(math.valid(v)?Math.abs(v)/max*100:0)+'%"></span></div></div>').join('')+'<small>'+esc(c.unit)+' · 각 항목 안에서 비교'+([p,a].some(v=>math.valid(v)&&v<0)?' · 막대 길이는 절댓값, 음수는 수치와 색으로 표시':'')+'</small></section>';}).join('')+'</div>';}
function sources(c){return '<details class="sources-panel"><summary>출처와 계산에 사용한 기준 보기 <span>'+(c.sources?.length||0)+'개 자료</span></summary><ul class="source-list">'+(c.sources||[]).map(s=>'<li>'+(url(s.url)?'<a href="'+esc(url(s.url))+'" target="_blank" rel="noopener noreferrer">'+esc(s.title)+' ↗</a>':'<span>'+esc(s.title)+'</span>')+'<small>'+esc(s.period||'')+(s.kind?' · '+esc(s.kind):'')+'</small></li>').join('')+'</ul>'+((c.notes||[]).length?'<ul class="source-notes">'+lines(c.notes,'')+'</ul>':'')+'<p class="dialog-footnote">자료 확인일 '+esc(dataset.asOf||'확인 필요')+' · 저장된 자료이며 자동 갱신되지 않습니다.</p></details>';}
function financials(c){const a=c.annual||{},p=c.previous||{},m=math.metrics(c);return '<div class="section-header"><div><span class="section-label">숫자를 읽는 순서</span><h2>이익 → 현금 → 부채를 확인해 보세요</h2></div><span>단위: '+esc(c.unit)+'</span></div><div class="table-wrap"><table class="financial-table"><caption class="sr-only">'+esc(c.name)+' 전년과 당년 재무제표 비교, 단위 '+esc(c.unit)+'</caption><thead><tr><th scope="col">무엇을 보나요?</th><th scope="col">'+esc(p.label||'전년')+'<small>'+esc(p.end||'')+'</small></th><th scope="col">'+esc(a.label||'당년')+'<small>'+esc(a.end||'')+'</small></th><th scope="col">전년 대비</th></tr></thead><tbody>'+rows.map(([k,l,t])=>'<tr><th scope="row">'+l+'<small>'+t+'</small></th><td>'+num(p[k])+'</td><td><strong>'+num(a[k])+'</strong></td><td>'+esc(change(a[k],p[k]))+'</td></tr>').join('')+'</tbody></table></div><p class="table-note">자산·부채·자기자본은 결산일의 금액이고, 나머지는 해당 연간의 합계입니다. 전년 값이 0 또는 음수이면 단순 성장률을 계산하지 않습니다.</p>'+charts(c)+'<section class="mini-panel"><h3>두 숫자를 더 살펴보세요</h3><dl class="quick-stats"><div><dt>총부채 ÷ 자기자본</dt><dd>'+pct(m.debtRatio)+'</dd></div><div><dt>영업현금 − 설비투자</dt><dd>'+num(m.fcf)+' <small>'+esc(c.unit)+'</small></dd></div></dl><p>부채는 차입금보다 넓은 개념입니다. 현금에서 설비투자를 뺀 값은 단순 계산이며, 회사가 발표하는 FCF와 다를 수 있습니다.</p><small>설비투자 기준: '+esc(a.capexDefinition||'원자료의 현금 지출 기준')+'<br>재무제표 기준: '+esc(a.statementBasis||'원자료 기준')+'</small></section>'+sources(c);}
function reasoning(c){return '<div class="section-header"><div><span class="section-label">판단의 이유를 함께 봐요</span><h2>좋은 점과 걱정되는 점</h2></div></div><div class="analysis-grid"><section class="analysis-card good"><span class="pill green">좋은 점</span><h3>이 부분은 긍정적으로 볼 수 있어요</h3><ul>'+lines(c.analysis?.positives,'추가 자료 확인이 필요합니다.')+'</ul></section><section class="analysis-card risk"><span class="pill amber">주의할 점</span><h3>이 부분은 한 번 더 확인해 주세요</h3><ul>'+lines(c.analysis?.risks,'추가 자료 확인이 필요합니다.')+'</ul></section></div><section class="next-checks"><h3>다음 실적에서 확인할 것</h3><ol>'+lines(c.analysis?.nextChecks,'새로운 공시가 나오면 실적과 현금흐름을 확인합니다.')+'</ol></section><p class="table-note">위 내용은 공시 숫자에 대한 해석입니다. '+esc(c.analysis?.priceComment||'')+'</p>'+sources(c);}
const saveText=()=>persistence?'이 브라우저에 자동 저장됩니다.':'브라우저 저장이 제한되어 현재 화면에만 보관됩니다. 내 기록 백업을 이용해 주세요.';
function notes(c){const r=record(c.id);return '<div class="section-header"><div><span class="section-label">나의 생각을 남겨 두세요</span><h2>'+esc(c.name)+', 저는 이렇게 이해했어요</h2></div></div><form class="notes-form">'+[['learned','새롭게 알게 된 점','예: 이 회사는 제품 판매보다 구독 매출이 중요하네요.'],['reason','제가 이 기업을 사고 싶은 이유','예: 현금흐름이 꾸준하고, 주가가 제 기준에 맞을 때 검토하고 싶어요.'],['concern','걱정되는 점 · 더 확인할 것','예: 이익은 늘었지만 현금이 적게 들어온 이유를 확인해 보고 싶어요.']].map(([k,l,p])=>'<label class="note-label" for="note-'+k+'">'+l+'</label><textarea id="note-'+k+'" data-note="'+k+'" rows="4" placeholder="'+esc(p)+'">'+esc(typeof r[k]==='string'?r[k]:'')+'</textarea>').join('')+'<div class="note-toolbar"><label class="checkbox-label"><input type="checkbox" id="note-read"'+(r.read?' checked':'')+'> 이 기업 노트를 읽었어요</label><span class="save-status" id="save-status" role="status">'+esc(saveText())+'</span></div></form><div class="dialog-actions"><button class="secondary" data-export-current>이 기업 기록 다운로드</button><button class="primary" data-copy>분석과 내 기록 함께 복사</button></div><p class="dialog-footnote">기록은 다른 기기와 동기화되지 않습니다. 브라우저 데이터를 지우기 전에 백업해 주세요.</p>';}
function content(){const c=current();if(!c){$('tab-content').innerHTML='<p>기업 자료를 불러오지 못했습니다.</p>';return;}document.querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===state.tab;b.classList.toggle('active',on);b.setAttribute('aria-selected',String(on));b.setAttribute('tabindex',on?'0':'-1');b.id='tab-'+b.dataset.tab;b.setAttribute('aria-controls','tab-content');});$('tab-content').setAttribute('aria-labelledby','tab-'+state.tab);$('tab-content').innerHTML=({overview,financials,reasoning,notes}[state.tab]||overview)(c);progress();}
function render(){renderList();if(current())header(current());content();}
function setTab(t){if(!['overview','financials','reasoning','notes'].includes(t))return;state.tab=t;content();}
function openDialog(eyebrow,html){$('dialog-eyebrow').textContent=eyebrow;$('dialog-content').innerHTML=html;if(!$('detail-dialog').open)$('detail-dialog').showModal();}
function metricDialog(k){const i=info[k],c=current();if(!i||!c)return;const v=math.metrics(c)[k];openDialog('숫자가 쉬워지는 설명','<h2 class="dialog-title" id="dialog-title">'+i.name+' · '+i.title+'</h2><p class="dialog-intro">'+i.intro+'</p><div class="formula-box">'+esc(i.formula).replace(/\n/g,'<br>')+'</div><div class="case-row"><span class="pill blue">높을 때</span><p>'+i.high+'</p></div><div class="case-row"><span class="pill amber">낮을 때</span><p>'+i.low+'</p></div><div class="scenario-result"><span>'+esc(c.name)+'의 '+i.name+'</span><strong>'+ratio(v,k)+'</strong><p>'+esc(meaning(k,v))+'</p></div><p class="dialog-footnote">'+esc(period(c))+' 실적 기준 · '+(k==='roe'?'평균 자기자본 사용':esc(priceDate(c)))+'<br>'+i.note+'</p><button class="primary full-width" data-scenario>숫자를 바꿔 보며 이해하기</button>');}
function scenarioDialog(){const c=current(),q=math.valid(c.quote?.price)&&c.quote.price>0?c.quote.price:'',cur=c.currency==='KRW'?'원':'달러';openDialog('값을 바꾸면 지표도 달라져요','<h2 class="dialog-title" id="dialog-title">가격과 이익, 가정해 보기</h2><p class="dialog-intro">'+esc(c.name)+'의 완료 연간 실적을 바탕으로 단순 계산합니다. 전망이나 목표주가가 아닙니다.</p><div class="scenario-fields"><label class="input-group" for="scenario-base"><span>기준 주가 ('+cur+')</span><input id="scenario-base" type="number" inputmode="decimal" min="0.01" step="any" value="'+q+'" placeholder="가격을 직접 입력해 주세요"><small>'+(q!==''?esc(priceDate(c))+' · 입력한 값은 이 계산에만 사용합니다.':'검증된 가격이 없어 비워 두었습니다. 비교할 가격을 직접 입력해 주세요.')+'</small></label><div class="input-group"><div class="range-header"><label for="scenario-price">주가가 달라진다면</label><output id="price-output" for="scenario-price">0%</output></div><input id="scenario-price" type="range" min="-50" max="50" step="1" value="0"><div class="range-labels"><span>−50%</span><span>+50%</span></div></div><div class="input-group"><div class="range-header"><label for="scenario-profit">순이익이 달라진다면</label><output id="profit-output" for="scenario-profit">0%</output></div><input id="scenario-profit" type="range" min="-80" max="100" step="1" value="0"><div class="range-labels"><span>−80%</span><span>+100%</span></div></div></div><div class="scenario-results" id="scenario-results" aria-live="polite"></div><p class="scenario-description" id="scenario-description"></p><p class="dialog-footnote">자기자본과 주식수는 고정하고, 순이익 변화가 EPS에 같은 비율로 반영된다고 가정합니다. 실제로는 이익·자본·주식수가 함께 달라질 수 있습니다. 실적 기준: '+esc(period(c))+'.</p><div class="dialog-actions"><button class="secondary" id="reset-scenario">처음 값으로</button><button class="primary" data-close>확인했어요</button></div>');updateScenario();}
function updateScenario(){if(!$('scenario-base'))return;const c=current(),pc=Number($('scenario-price').value),ec=Number($('scenario-profit').value),raw=$('scenario-base').value.trim(),typed=raw!==''?Number(raw):null,valid=math.valid(typed)&&typed>0,r=math.scenario(c,pc,ec,valid?typed:undefined);if(!valid){r.price=null;r.per=null;r.pbr=null;}if(!math.valid(c.valuation?.eps)||c.valuation.eps<=0)r.per=null;if(!math.valid(c.valuation?.bps)||c.valuation.bps<=0)r.pbr=null;$('price-output').textContent=(pc>0?'+':'')+pc+'%';$('profit-output').textContent=(ec>0?'+':'')+ec+'%';$('scenario-results').innerHTML=[['가정한 주가',math.valid(r.price)?num(r.price,c.currency==='KRW'?0:2)+(c.currency==='KRW'?'원':'달러'):'직접 입력'],['PER',ratio(r.per,'per')],['PBR',ratio(r.pbr,'pbr')],['ROE',ratio(r.roe,'roe')]].map(([l,v])=>'<div class="scenario-result"><span>'+l+'</span><strong>'+v+'</strong></div>').join('');$('scenario-description').textContent=!valid?'주가를 입력하면 가격이 필요한 지표를 계산합니다. ROE는 주가와 관계없이 이익 변화에 따라 움직입니다.':'주가 변화는 PER·PBR에, 이익 변화는 PER·ROE에 반영됩니다. EPS나 BPS가 없거나 0 이하이면 해당 배수는 계산하지 않습니다.';}
function methodDialog(){const c=current();openDialog('같은 기준으로 비교하기','<h2 class="dialog-title" id="dialog-title">이 노트의 계산 기준</h2><p class="dialog-intro">기업별 결산일과 재무제표 기준을 표시합니다. 아래 값은 저장된 자료이며 자동으로 갱신되지 않습니다.</p><div class="formula-box">PER = 주가 ÷ EPS<br>PBR = 주가 ÷ BPS<br>ROE = 연간 순이익 ÷ 평균 자기자본 × 100<br>평균 자기자본 = (기초 자본 + 기말 자본) ÷ 2<br>영업이익률 = 영업이익 ÷ 매출 × 100<br>부채비율 = 총부채 ÷ 자기자본 × 100<br>증감률 = (당년 값 ÷ 전년 값 − 1) × 100<br>단순 FCF = 영업현금흐름 − 현금 설비투자</div><ul class="method-list"><li>한국 기업의 금액은 억원, 미국 기업은 백만 달러입니다. 서로 다른 단위의 절대 금액을 그대로 비교하지 마세요.</li><li>PER·PBR는 표시된 주가 시점과 실적 기간의 조합입니다. ROE는 표시된 완료 연간 순이익과 평균 자본을 사용합니다.</li><li>전년 값이 0 또는 음수이면 성장률을 표시하지 않습니다. EPS·BPS·평균 자본이 0 이하인 지표도 일반적인 배수 비교를 하지 않습니다.</li><li>총부채에는 매입채무 등도 들어 있습니다. 총부채와 이자가 붙는 차입금은 다릅니다.</li><li>설비투자의 포함 항목과 회사별 FCF 정의는 다를 수 있습니다. 이 노트는 영업현금에서 명시된 현금 설비투자를 빼서 보여 드립니다.</li><li>분기와 연간, 잠정 발표와 확정 자료를 구분합니다. 다른 기업과 비교할 때도 기간·업종·계산 기준을 맞춰 주세요.</li></ul><section class="mini-panel"><h3>'+esc(c.name)+'에 적용한 기준</h3><p>연간 실적: '+esc(c.annual?.label)+' ('+esc(c.annual?.start||'')+' ~ '+esc(c.annual?.end||'')+')</p><p>재무제표: '+esc(c.annual?.statementBasis||'출처 기준')+'</p><p>설비투자: '+esc(c.annual?.capexDefinition||'출처의 현금 지출 기준')+'</p><p>지표 산식·이익 기준: '+esc(c.valuation?.basis||'완료 연간 실적과 평균 자기자본 사용')+'</p><p>'+esc(priceDate(c))+'</p></section>'+sources(c));}
function markdown(c){const a=c.annual||{},p=c.previous||{},m=math.metrics(c),r=record(c.id);return '# '+c.name+' 기업 노트\n\n'+c.symbol+' · '+market(c.market)+'\n\n'+(c.description||'')+'\n\n자료 확인일: '+(dataset.asOf||'확인 필요')+'\n연간 실적: '+(a.label||'')+' ('+(a.start||'')+' ~ '+(a.end||'')+')\n금액 단위: '+c.unit+'\n\n## 세 줄 요약\n\n'+(c.analysis?.summary||[]).map(t=>'- '+t).join('\n')+'\n\n## 주요 지표\n\n'+['per','pbr','roe'].map(k=>'- '+info[k].name+': '+ratio(m[k],k)).join('\n')+'\n\n실적 기준: '+period(c)+'\n'+priceDate(c)+'\n\n## 재무제표\n\n| 항목 | '+(p.label||'전년')+' | '+(a.label||'당년')+' |\n|---|---:|---:|\n'+rows.map(([k,l])=>'| '+l+' | '+num(p[k])+' | '+num(a[k])+' |').join('\n')+'\n\n설비투자 기준: '+(a.capexDefinition||'원자료 기준')+'\n재무제표 기준: '+(a.statementBasis||'원자료 기준')+'\n\n## 좋은 점\n\n'+(c.analysis?.positives||[]).map(t=>'- '+t).join('\n')+'\n\n## 주의할 점\n\n'+(c.analysis?.risks||[]).map(t=>'- '+t).join('\n')+'\n\n## 다음에 확인할 것\n\n'+(c.analysis?.nextChecks||[]).map(t=>'- '+t).join('\n')+'\n\n'+(c.analysis?.priceComment||'')+'\n\n## 내 기록\n\n### 새롭게 알게 된 점\n'+(r.learned||'(아직 기록하지 않았습니다.)')+'\n\n### 사고 싶은 이유\n'+(r.reason||'(아직 기록하지 않았습니다.)')+'\n\n### 걱정과 확인할 것\n'+(r.concern||'(아직 기록하지 않았습니다.)')+'\n\n읽음: '+(r.read?'예':'아니요')+'\n\n## 출처\n\n'+(c.sources||[]).map(s=>'- '+s.title+' · '+(s.period||'')+'\n  '+url(s.url)).join('\n')+'\n\n'+(c.notes||[]).map(t=>'- '+t).join('\n')+'\n\n저장된 자료이며 자동 갱신되지 않습니다. 분석은 공시 자료에 대한 해석입니다.\n';}
async function copyNote(){const c=current();if(!c)return;const text=markdown(c);try{if(!navigator.clipboard?.writeText)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(text);toast('분석과 내 기록을 함께 복사했어요.');}catch(_){download(c.symbol+'-기업노트.md',text,'text/markdown;charset=utf-8');toast('복사 권한이 없어 노트를 파일로 내려받았어요.');}}
function exportRecords(single){const selected=single?companies.filter(c=>c.id===state.id):companies,out={type:'기업 노트 개인 기록 백업',version:1,exportedAt:new Date().toISOString(),records:selected.map(c=>({companyId:c.id,companyName:c.name,symbol:c.symbol,favorite:state.favorites.has(c.id),...record(c.id)}))};download((single?current().symbol+'-':'')+'기업노트-내기록.json',JSON.stringify(out,null,2),'application/json;charset=utf-8');toast('개인 기록 백업 파일을 만들었어요.');}
document.addEventListener('click',e=>{const b=e.target.closest('button,a.brand');if(!b)return;if(b.dataset.select){state.id=b.dataset.select;persist();render();}else if(b.dataset.favorite){const id=b.dataset.favorite;state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);persist();renderList();if(current())header(current());}else if(b.dataset.market){state.market=b.dataset.market;renderList();}else if(b.dataset.tab)setTab(b.dataset.tab);else if(b.dataset.openTab)setTab(b.dataset.openTab);else if(b.dataset.metric)metricDialog(b.dataset.metric);else if(b.hasAttribute('data-scenario'))scenarioDialog();else if(b.hasAttribute('data-copy'))copyNote();else if(b.hasAttribute('data-export-current'))exportRecords(true);else if(b.hasAttribute('data-close')||b.id==='close-dialog')$('detail-dialog').close();else if(b.id==='favorite-filter'){state.onlyFavorites=!state.onlyFavorites;renderList();}else if(b.id==='method-button')methodDialog();else if(b.id==='export-all')exportRecords(false);else if(b.id==='reset-scenario'){const c=current();$('scenario-base').value=math.valid(c.quote?.price)&&c.quote.price>0?c.quote.price:'';$('scenario-price').value=0;$('scenario-profit').value=0;updateScenario();}else if(b.classList.contains('brand')){e.preventDefault();state.query='';state.market='all';state.onlyFavorites=false;$('search').value='';state.tab='overview';render();}});
$('search').addEventListener('input',e=>{state.query=e.target.value;renderList();});
document.addEventListener('input',e=>{if(e.target.matches('[data-note]')){state.records[state.id]={...record(state.id),[e.target.dataset.note]:e.target.value,updatedAt:new Date().toISOString()};persist();if($('save-status'))$('save-status').textContent=saveText();progress();}else if(['scenario-price','scenario-profit','scenario-base'].includes(e.target.id))updateScenario();});
document.addEventListener('change',e=>{if(e.target.id==='note-read'){state.records[state.id]={...record(state.id),read:e.target.checked,updatedAt:new Date().toISOString()};persist();if($('save-status'))$('save-status').textContent=saveText();progress();}});
document.addEventListener('submit',e=>{if(e.target.classList.contains('notes-form'))e.preventDefault();});
document.querySelector('.tabbar').addEventListener('keydown',e=>{const tabs=[...document.querySelectorAll('[data-tab]')],i=tabs.indexOf(document.activeElement);if(i<0||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;setTab(tabs[n].dataset.tab);tabs[n].focus();});
$('detail-dialog').addEventListener('click',e=>{if(e.target!==$('detail-dialog'))return;const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();});
render();
})();

</script>
</body></html>
