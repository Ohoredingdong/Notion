<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Sentiment</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}iframe{display:block;width:100%;height:100%;border:0;background:transparent}</style></head><body><iframe id="app" title="Market Sentiment"></iframe><script>const q=new URLSearchParams(location.search);const theme=q.get('theme')||'light';const frame=document.getElementById('app');frame.src='./fear-greed-dashboard.html?theme='+encodeURIComponent(theme)+'&v=20260820-1821';frame.addEventListener('load',()=>{try{const d=frame.contentDocument||frame.contentWindow.document;const score=d.querySelector('.score-block');if(score)score.style.top='77.6%';const needle=d.querySelector('#needle');if(needle)needle.setAttribute('y2','82');const zones=[...d.querySelectorAll('.zone-label')];if(zones[0])zones[0].setAttribute('x','8');if(zones[1])zones[1].setAttribute('x','8');if(zones[5])zones[5].setAttribute('x','292');if(zones[6])zones[6].setAttribute('x','292');const forceNote=()=>{const note=d.querySelector('#note');if(!note)return;const active=d.querySelector('.tab.active');const market=active?active.dataset.market:'korea';const rating=((d.querySelector('#rating')||{}).textContent||'').trim().toLowerCase();let text='현재 시장 심리 상태를 확인하세요.';if(market==='us'){if(rating.includes('extreme greed'))text='미국 증시는 극도의 탐욕 구간입니다. 과도한 낙관과 쏠림 여부를 함께 확인하세요.';else if(rating.includes('greed'))text='미국 증시는 탐욕 구간입니다. 투자자들의 위험 선호가 높아지고 있습니다.';else if(rating.includes('extreme fear'))text='미국 증시는 극도의 공포 구간입니다. 위험 회피 심리가 매우 강한 상태입니다.';else if(rating.includes('fear'))text='미국 증시는 공포 구간입니다. 투자자들의 위험 회피 성향이 높아지고 있습니다.';else text='미국 증시는 중립 구간입니다. 공포와 탐욕 어느 한쪽으로 크게 치우치지 않았습니다.';}else if(market==='crypto'){if(rating.includes('extreme greed'))text='암호화폐 시장은 극도의 탐욕 구간입니다. 단기 과열과 급격한 변동에 유의하세요.';else if(rating.includes('greed'))text='암호화폐 시장은 탐욕 구간입니다. 위험 선호 확대와 단기 변동성을 함께 확인하세요.';else if(rating.includes('extreme fear'))text='암호화폐 시장은 극도의 공포 구간입니다. 변동성 확대에 특히 유의하세요.';else if(rating.includes('fear'))text='암호화폐 시장은 공포 구간입니다. 위험 회피 심리와 변동성 확대에 유의하세요.';else text='암호화폐 시장은 중립 구간입니다. 방향성 확인이 필요한 상태입니다.';}else{if(rating.includes('extreme greed'))text='한국 시장은 극도의 탐욕 구간입니다. 단기 과열과 쏠림 여부를 함께 확인하세요.';else if(rating.includes('greed'))text='한국 시장은 탐욕 구간입니다. 위험 선호 확대와 단기 과열 여부를 함께 확인하세요.';else if(rating.includes('extreme fear'))text='한국 시장은 극도의 공포 구간입니다. 환율과 수급 변화를 함께 확인하세요.';else if(rating.includes('fear'))text='한국 시장은 공포 구간입니다. 위험 회피와 외국인 수급 변화를 함께 확인하세요.';else text='한국 시장은 중립 구간입니다. 환율과 단기 모멘텀 변화를 함께 확인하세요.';}if(note.textContent.trim()!==text)note.textContent=text;};d.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>setTimeout(forceNote,120)));const root=d.body||d.documentElement;new MutationObserver(()=>forceNote()).observe(root,{childList:true,characterData:true,subtree:true,attributes:true,attributeFilter:['class']});forceNote();setTimeout(forceNote,300);setTimeout(forceNote,1000);setInterval(forceNote,750);}catch(e){console.warn(e);}});</script></body></html>
