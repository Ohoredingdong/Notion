<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Life Town · v2</title><link rel="stylesheet" href="./assets/life-town-v2.css"><style>
:root{--panel:#fff;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--line:#e5e5e8;--soft:#f7f7f8;--blue:#007aff;--green:#34c759;--yellow:#ffcc00;--red:#ff3b30;--shadow:0 12px 28px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.03)}html[data-lt-theme="dark"]{--panel:#1c1c1e;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--line:#38383a;--soft:#2c2c2e;--blue:#0a84ff;--green:#30d158;--yellow:#ffd60a;--red:#ff453a;--shadow:none}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}.root{width:100%;max-width:720px;margin:auto;container-type:inline-size}.widget{position:relative;border:1px solid var(--line);border-radius:24px;padding:10px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}.widget:before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:linear-gradient(90deg,transparent,#b8b8bd 22%,#f5f5f7 50%,#b8b8bd 78%,transparent);opacity:.52}.scene{position:relative;height:360px;overflow:hidden;border-radius:18px;background-image:linear-gradient(180deg,rgba(8,12,24,.02),rgba(8,12,24,.04) 48%,rgba(8,12,24,.50)),url('./assets/life-town-office.webp');background-size:cover;background-position:center}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,12,20,.08),transparent 22% 78%,rgba(10,12,20,.04));pointer-events:none}.rain{position:absolute;inset:0;opacity:0;pointer-events:none;background-image:repeating-linear-gradient(110deg,transparent 0 18px,rgba(215,239,255,.38) 19px 20px,transparent 21px 40px);background-size:60px 60px;animation:rain .72s linear infinite;transition:.3s}.scene.is-rain .rain{opacity:.22}@keyframes rain{to{background-position:-60px 60px}}.clock{position:absolute;left:18px;bottom:16px;z-index:2;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.7)}.date{font-size:14px;font-weight:690}.time{margin-top:2px;font-size:21px;font-weight:780;letter-spacing:-.03em}.weather-badge{position:absolute;right:14px;bottom:14px;z-index:2;display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:rgba(28,28,30,.42);color:#fff;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:9.5px;font-weight:680}.controlbar{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(130px,190px);gap:10px;align-items:center;margin-top:9px;padding:8px 9px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.actions{display:flex;gap:6px}.action{--accent:var(--blue);width:31px;height:31px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:grid;place-items:center;color:var(--sub);font-size:13px;font-weight:760;cursor:pointer;transition:.12s}.action:hover{background:var(--soft);color:var(--text)}.action.active{color:#fff;background:var(--accent);border-color:var(--accent)}#timerBtn{--accent:var(--yellow);color:#7d6800}#playBtn{--accent:var(--green)}#refreshBtn{--accent:var(--blue)}#weatherBtn{--accent:var(--red)}.status{min-width:0;font-size:9.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timer{display:none;margin-left:6px;padding:3px 7px;border-radius:999px;background:rgba(255,204,0,.12);color:#7f6900;font-size:8.8px;font-weight:720}.timer.show{display:inline-flex}.volume{display:flex;align-items:center;gap:7px}.volume span{font-size:8.8px;color:var(--muted)}input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:5px;border-radius:999px;outline:0;background:linear-gradient(90deg,var(--blue) 0 var(--vol),var(--line) var(--vol) 100%)}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--panel);border:2px solid var(--blue)}input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--panel);border:2px solid var(--blue)}@container(max-width:560px){.scene{height:310px}.controlbar{grid-template-columns:1fr}.actions{justify-content:center}.status{text-align:center}.volume{max-width:220px;margin:auto;width:100%}.root{max-width:500px}}@container(max-width:400px){.scene{height:260px}.date{font-size:11px}.time{font-size:18px}}
</style></head><body><div class="root"><main class="widget" data-widget-control-root data-control-sizes="500,620,720"><section class="scene" id="scene"><div class="rain"></div><div class="clock"><div class="date" id="dateText"></div><div class="time" id="timeText"></div></div><div class="weather-badge" id="tempBadge">Life Town</div></section><section class="controlbar"><div class="actions"><button class="action" id="timerBtn" title="25분 타이머">◷</button><button class="action" id="playBtn" title="ASMR 재생" disabled>…</button><button class="action" id="refreshBtn" title="서울 날씨 새로고침">↻</button><button class="action" id="weatherBtn" title="현재 위치 날씨">☁</button></div><div class="status"><span id="statusText">사무실에서 조용히 일하는 시간이에요.</span><span class="timer" id="timerChip">25:00</span></div><div class="volume"><span>볼륨</span><input id="volume" type="range" min="0" max="100" value="58"></div></section></main></div><audio id="bgm" loop preload="metadata" playsinline></audio><script>
const $=id=>document.getElementById(id),scene=$('scene'),statusText=$('statusText'),tempBadge=$('tempBadge'),volume=$('volume'),playBtn=$('playBtn'),bgm=$('bgm');const AUDIO_URL='https://drive.google.com/uc?export=download&id=1V8LUQd72xjLCoQSA-uL_btnQZMeXcHOO';let weatherMessage='오늘의 날씨를 불러오는 중…',timerSeconds=1500,timerInterval=null,isPlaying=false;function updateClock(){const n=new Date(),h=n.getHours();$('dateText').textContent=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(n);$('timeText').textContent=`${h<12?'오전':'오후'} ${h%12||12}:${String(n.getMinutes()).padStart(2,'0')}`}function weatherLabel(c,p){if(p>0||(c>=51&&c<=67)||(c>=80&&c<=82))return['🌧','비가 내리는 조용한 날이에요.','rain'];if(c>=71&&c<=77)return['❄️','눈이 소복소복 내리고 있어요.','snow'];if(c>=95)return['⛈','천둥이 치는 날이에요.','storm'];if(c===45||c===48)return['🌫','옅은 안개가 낀 날이에요.','fog'];if(c===0)return['☀️','햇살이 맑게 들어오는 날이에요.','clear'];return['☁️','구름이 천천히 흘러가는 날이에요.','cloud']}async function fetchWeather(useGeo=false){statusText.textContent='날씨를 확인하는 중…';let lat=37.5665,lon=126.9780;if(useGeo&&navigator.geolocation)try{const p=await new Promise((r,j)=>navigator.geolocation.getCurrentPosition(r,j,{timeout:7000,maximumAge:900000}));lat=p.coords.latitude;lon=p.coords.longitude}catch{}try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,weather_code&timezone=auto`);if(!r.ok)throw 0;const d=await r.json(),c=d.current||{},[i,m,k]=weatherLabel(+c.weather_code||0,+c.precipitation||0);weatherMessage=m;tempBadge.textContent=`${i} ${Math.round(+c.temperature_2m||0)}°C`;scene.classList.toggle('is-rain',k==='rain'||k==='storm');if(!isPlaying&&!timerInterval)statusText.textContent=weatherMessage}catch{weatherMessage='사무실에서 조용히 일하는 시간이에요.';tempBadge.textContent='Life Town';if(!isPlaying&&!timerInterval)statusText.textContent=weatherMessage}}function toggleTimer(){const b=$('timerBtn'),c=$('timerChip');if(timerInterval){clearInterval(timerInterval);timerInterval=null;timerSeconds=1500;b.classList.remove('active');c.classList.remove('show');c.textContent='25:00';statusText.textContent=isPlaying?'고양이 사무실 ASMR을 재생 중이에요.':weatherMessage;return}b.classList.add('active');c.classList.add('show');statusText.textContent='25분 집중 모드가 시작됐어요.';timerInterval=setInterval(()=>{timerSeconds--;c.textContent=`${String(Math.floor(timerSeconds/60)).padStart(2,'0')}:${String(timerSeconds%60).padStart(2,'0')}`;if(timerSeconds<=0){clearInterval(timerInterval);timerInterval=null;timerSeconds=1500;b.classList.remove('active');c.textContent='00:00';statusText.textContent='집중 시간이 끝났어요.';setTimeout(()=>c.classList.remove('show'),5000)}},1000)}function prepareAudio(){bgm.src=AUDIO_URL;bgm.volume=+volume.value/100;bgm.load();playBtn.disabled=false;playBtn.textContent='▶'}async function startMusic(){try{bgm.volume=+volume.value/100;await bgm.play();isPlaying=true;playBtn.textContent='Ⅱ';playBtn.classList.add('active');if(!timerInterval)statusText.textContent='고양이 사무실 ASMR을 재생 중이에요.'}catch{isPlaying=false;playBtn.textContent='▶';playBtn.classList.remove('active');statusText.textContent='오디오를 불러오지 못했어요.'}}function stopMusic(){bgm.pause();isPlaying=false;playBtn.textContent='▶';playBtn.classList.remove('active');if(!timerInterval)statusText.textContent=weatherMessage}function updateVolume(){const v=+volume.value;volume.style.setProperty('--vol',v+'%');bgm.volume=v/100}$('timerBtn').onclick=toggleTimer;playBtn.onclick=()=>isPlaying?stopMusic():startMusic();$('refreshBtn').onclick=()=>fetchWeather(false);$('weatherBtn').onclick=()=>fetchWeather(true);volume.oninput=updateVolume;bgm.addEventListener('error',()=>{isPlaying=false;playBtn.textContent='▶';playBtn.classList.remove('active');statusText.textContent='ASMR 파일을 불러오지 못했어요.'});updateClock();setInterval(updateClock,1000);updateVolume();fetchWeather(false);prepareAudio();</script><script src="./assets/life-town-controls-v2.js"></script></body></html>
