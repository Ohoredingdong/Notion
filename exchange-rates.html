<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Exchange Rates</title><style>:root{--panel:#fff;--line:#e9e6df;--line2:#f2f0eb;--soft:#f8f7f3;--text:#2d3134;--sub:#777c80;--muted:#a5aaad;--green:#5f9b63;--green-soft:#edf5ee;--red:#d77770;--red-soft:#faeeee;--ink:#4a4d4f;--ctrl:rgba(255,255,255,.95);--shadow:0 8px 22px rgba(25,24,20,.035)}html[data-theme="dark"]{--panel:#202120;--line:#383733;--line2:#2c2c29;--soft:#282926;--text:#efefeb;--sub:#c2c4bf;--muted:#8e928e;--green:#84b985;--green-soft:#263426;--red:#e28a83;--red-soft:#392725;--ink:#d6d7d2;--ctrl:rgba(35,35,33,.95);--shadow:none}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}.root{position:relative;width:min(100%,560px);margin:0 auto;transition:width .18s ease}.root[data-size=compact]{width:min(100%,520px)}.root[data-size=normal]{width:min(100%,560px)}.root[data-size=large]{width:min(100%,620px)}.widget{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;box-shadow:var(--shadow)}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:790;letter-spacing:-.02em}.coinmark{position:relative;width:20px;height:18px}.coin{position:absolute;width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:8px;font-weight:800;color:var(--ink);background:var(--panel)}.coin.a{left:0;top:0}.coin.b{right:0;bottom:0}.actions{display:flex;gap:10px;align-items:center;color:var(--sub)}.iconbtn{width:18px;height:18px;border:0;background:transparent;padding:0;display:grid;place-items:center;cursor:pointer;color:inherit}.iconbtn svg{width:15px;height:15px}.iconbtn.active{color:var(--green)}.table{border-top:1px solid var(--line)}.thead,.row{display:grid;grid-template-columns:1.32fr 1fr .82fr .66fr;gap:10px;align-items:center}.thead{padding:10px 0 7px;font-size:9px;font-weight:780;color:var(--muted)}.row{padding:8px 0;border-top:1px solid var(--line2)}.currency{display:flex;align-items:baseline;gap:8px;min-width:0}.code{font-size:12px;font-weight:800;white-space:nowrap}.name{font-size:9.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:12px;font-weight:760;text-align:right;white-space:nowrap}.change,.pct{font-size:10.5px;font-weight:720;text-align:right;white-space:nowrap}.up{color:var(--green)}.down{color:var(--red)}.chart-head{display:flex;justify-content:space-between;align-items:flex-start;margin-top:16px}.pair{font-size:12px;font-weight:760}.chart-value{text-align:right}.chart-price{font-size:18px;font-weight:790;line-height:1;letter-spacing:-.03em}.chart-change{margin-top:4px;font-size:10.5px;font-weight:740}.chart-wrap{height:116px;margin-top:5px}.chart-svg{width:100%;height:100%;display:block}.grid line{stroke:var(--line2);stroke-width:1}.grid text{fill:var(--muted);font-size:8.5px}.dates{display:flex;justify-content:space-between;padding-left:30px;margin-top:4px;font-size:8.5px;color:var(--muted)}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:12px;padding-top:8px;border-top:1px solid var(--line2)}.viewall{font-size:9.5px;font-weight:650;color:var(--sub);text-decoration:none}.stamp{font-size:9px;color:var(--muted);white-space:nowrap}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--green);margin-left:4px;vertical-align:1px}.controls{position:absolute;top:10px;right:-36px;display:flex;flex-direction:column;gap:7px;opacity:0;transform:translateX(6px);pointer-events:none;transition:opacity .18s ease,transform .18s ease}.controls:before{content:"";position:absolute;left:-10px;top:0;width:10px;height:100%}.root:hover .controls,.root:focus-within .controls{opacity:1;transform:none;pointer-events:auto}.ctrl{position:relative;width:28px;height:28px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--ctrl);cursor:pointer;box-shadow:0 2px 8px rgba(20,20,20,.05)}.ctrl:hover{background:var(--soft)}.ctrl[disabled]{opacity:.42;cursor:not-allowed}.ctrl svg{width:14px;height:14px}.ctrl:after{content:attr(data-tip);position:absolute;right:35px;top:50%;transform:translateY(-50%);padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-size:9px;color:var(--sub);white-space:nowrap;opacity:0;pointer-events:none}.ctrl:hover:after{opacity:1}.loading,.error{padding:36px 10px;text-align:center;font-size:11px;color:var(--muted)}@media(max-width:470px){.root{width:100%!important}.thead,.row{grid-template-columns:1.18fr .9fr .72fr .62fr;gap:7px}.name{display:none}}@media(max-width:430px){.controls{right:7px;top:7px;opacity:1;transform:none;pointer-events:auto;flex-direction:row}.ctrl:after{display:none}.header{padding-right:126px}}@media(hover:none),(pointer:coarse){.controls{opacity:1;transform:none;pointer-events:auto}}</style></head><body><div class="root" id="root" data-size="normal"><div class="widget"><header class="header"><div class="brand"><span class="coinmark"><span class="coin a">$</span><span class="coin b">₩</span></span><span>EXCHANGE RATES</span></div><div class="actions"><button class="iconbtn" id="pinBtn" aria-label="Pin"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m15.8 3 5.2 5.2-3 1.2-2.8 5.2-2.1-2.1-4.4 4.4-1.1-1.1 4.4-4.4-2.1-2.1 5.2-2.8L15.8 3Z"/></svg></button><button class="iconbtn" id="copyBtn" aria-label="Copy"><svg viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><rect x="5" y="5" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/></svg></button><button class="iconbtn" id="refreshBtn" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none"><path d="M20 7v5h-5M4 17v-5h5M17.5 9A6.5 6.5 0 0 0 6.6 7L4 12M6.5 15A6.5 6.5 0 0 0 17.4 17L20 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></header><div id="content" class="loading">환율 데이터를 불러오는 중...</div></div><div class="controls" aria-label="Widget controls"><button class="ctrl" id="sizeBtn" data-tip="Size"><svg viewBox="0 0 24 24" fill="none"><path d="M6 8h12M6 12h9M6 16h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><button class="ctrl" id="themeBtn" data-tip="Dark Mode"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3.7a8.3 8.3 0 1 0 8.3 8.3A6.5 6.5 0 1 1 12 3.7Z" stroke="currentColor" stroke-width="1.8"/></svg></button><button class="ctrl" id="lockBtn" data-tip="Lock"><svg id="lockSvg" viewBox="0 0 24 24" fill="none"><path d="M7 11V8.5a5 5 0 0 1 10 0V11" stroke="currentColor" stroke-width="1.8"/><rect x="5" y="11" width="14" height="9" rx="2.5" stroke="currentColor" stroke-width="1.8"/></svg></button><button class="ctrl" id="resetBtn" data-tip="Reset"><svg viewBox="0 0 24 24" fill="none"><path d="M19 7v4h-4M5 17v-4h4M17.5 9A6.5 6.5 0 0 0 6.6 7L5 11M6.5 15A6.5 6.5 0 0 0 17.4 17L19 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div></div><script>const FALLBACK={"generated_at":"2026-08-21T23:34:00+09:00","reference_date":"2026-08-20","source":"European Central Bank reference rates","source_url":"https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html","stale":false,"rows":[{"code":"USD","name":"US Dollar","price_krw":1396.35,"previous_krw":1391.48,"change":4.88,"change_pct":0.35},{"code":"JPY","name":"Japanese Yen (100)","price_krw":879.53,"previous_krw":874.67,"change":4.86,"change_pct":0.56},{"code":"EUR","name":"Euro","price_krw":1631.08,"previous_krw":1614.81,"change":16.27,"change_pct":1.01},{"code":"CNY","name":"Chinese Yuan","price_krw":207.68,"previous_krw":206.51,"change":1.17,"change_pct":0.57}],"usdkrw":{"price":1396.35,"previous":1391.48,"change":4.88,"change_pct":0.35,"history":[{"date":"2026-08-14","value":1411.27},{"date":"2026-08-17","value":1411.91},{"date":"2026-08-18","value":1410.07},{"date":"2026-08-19","value":1391.48},{"date":"2026-08-20","value":1396.35}]},"note":"ECB daily reference rates; informational, not transaction quotes."};const KEY='widget.exchangeRates.controls.v1',PIN='widget.exchangeRates.pinned.v1';const root=document.getElementById('root'),q=new URLSearchParams(location.search),os=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';let cfg={theme:q.get('theme')||os,size:'normal',locked:false};try{cfg={...cfg,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}function save(){localStorage.setItem(KEY,JSON.stringify(cfg))}function theme(v){document.documentElement.dataset.theme=v;cfg.theme=v;save()}function size(v){root.dataset.size=v;cfg.size=v;save();sizeBtn.disabled=cfg.locked}function lock(v){cfg.locked=v;save();sizeBtn.disabled=v;lockBtn.dataset.tip=v?'Unlock':'Lock'}const sizeBtn=document.getElementById('sizeBtn'),themeBtn=document.getElementById('themeBtn'),lockBtn=document.getElementById('lockBtn'),resetBtn=document.getElementById('resetBtn');theme(cfg.theme);size(cfg.size);lock(cfg.locked);themeBtn.onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');sizeBtn.onclick=()=>{if(cfg.locked)return;let a=['compact','normal','large'];size(a[(a.indexOf(cfg.size)+1)%3])};lockBtn.onclick=()=>lock(!cfg.locked);resetBtn.onclick=()=>{cfg={theme:q.get('theme')||os,size:'normal',locked:false};theme(cfg.theme);size('normal');lock(false)};const pinBtn=document.getElementById('pinBtn');let pinned=localStorage.getItem(PIN)==='1';pinBtn.classList.toggle('active',pinned);pinBtn.onclick=()=>{pinned=!pinned;localStorage.setItem(PIN,pinned?'1':'0');pinBtn.classList.toggle('active',pinned)};document.getElementById('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(location.href)}catch{}};document.getElementById('refreshBtn').onclick=()=>load();function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function cls(n){return Number(n)>=0?'up':'down'}function arrow(n){return Number(n)>=0?'▲':'▼'}function fmt(n){return Number(n).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2})}function dateLabel(s){const d=new Date(s+'T00:00:00Z');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'})}function lineChart(points){const vals=points.map(x=>Number(x.value)),w=520,h=112,l=34,r=4,t=8,b=14,min=Math.min(...vals),max=Math.max(...vals),pad=(max-min)*.25||1,lo=min-pad,hi=max+pad,uh=h-t-b;const y=v=>t+(hi-v)/(hi-lo)*uh,x=i=>l+i*(w-l-r)/(vals.length-1||1);const path=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');const ticks=[hi,(hi+lo)/2,lo],grid=ticks.map(v=>`<line x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}"/><text x="0" y="${y(v)+3}">${Math.round(v).toLocaleString()}</text>`).join('');return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><g class="grid">${grid}</g><path d="${path}" fill="none" stroke="var(--green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}function render(d){const rows=(d.rows||[]).map(r=>`<div class="row"><div class="currency"><span class="code">${esc(r.code)}</span><span class="name">${esc(r.name)}</span></div><div class="price">${fmt(r.price_krw)}</div><div class="change ${cls(r.change)}">${arrow(r.change)} ${fmt(Math.abs(r.change))}</div><div class="pct ${cls(r.change_pct)}">${Number(r.change_pct)>=0?'+':''}${Number(r.change_pct).toFixed(2)}%</div></div>`).join('');const u=d.usdkrw||{},history=u.history||[];const html=`<div class="table"><div class="thead"><div>CURRENCY</div><div style="text-align:right">PRICE (KRW)</div><div style="text-align:right">CHANGE</div><div style="text-align:right">%</div></div>${rows}</div><div class="chart-head"><div class="pair">USD/KRW</div><div class="chart-value"><div class="chart-price">${fmt(u.price)}</div><div class="chart-change ${cls(u.change_pct)}">${Number(u.change_pct)>=0?'+':''}${Number(u.change_pct).toFixed(2)}%</div></div></div><div class="chart-wrap">${lineChart(history)}</div><div class="dates">${history.map(p=>`<span>${dateLabel(p.date)}</span>`).join('')}</div><div class="footer"><a class="viewall" href="${esc(d.source_url)}" target="_blank" rel="noopener">View all rates →</a><div class="stamp">As of ${dateLabel(d.reference_date)} · ECB${d.stale?' · cached':''}<span class="dot"></span></div></div>`;document.getElementById('content').outerHTML=`<div id="content">${html}</div>`}async function load(){try{const r=await fetch('./exchange-rates-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){render(FALLBACK)}}load();</script></body></html>
