name: Update Cryptocurrency Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update-cryptocurrency.py"
      - ".github/workflows/update-cryptocurrency.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update-cryptocurrency.py
      - name: Commit data if changed
        run: |
          if git diff --quiet -- cryptocurrency-data.json; then
            echo "No data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cryptocurrency-data.json
          git commit -m "data: update cryptocurrency dashboard"
          git push
