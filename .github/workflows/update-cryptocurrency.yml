name: Update Cryptocurrency Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update-bitcoin-korea-premium.py"
      - "scripts/market_data_utils.py"
      - "scripts/update-cryptocurrency.py"
      - ".github/workflows/update-cryptocurrency.yml"
permissions:
  contents: write
concurrency:
  group: update-cryptocurrency-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update-cryptocurrency.py
      - run: python scripts/update-bitcoin-korea-premium.py
      - name: Publish data on current main
        run: >-
          python scripts/publish_widget_data.py --message "data: update cryptocurrency and Korea premium" cryptocurrency-data.json bitcoin-korea-premium-data.json
