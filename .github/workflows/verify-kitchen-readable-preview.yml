name: Verify readable kitchen public previews
on:
  push:
    branches: [delivery/verify-kitchen-readable-20261101]
    paths:
      - '.github/workflows/verify-kitchen-readable-preview.yml'
      - 'scripts/verify_kitchen_readable_public.py'
permissions:
  contents: write
concurrency:
  group: kitchen-readable-public-verification
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Install browser driver
        run: python -m pip install 'playwright==1.56.0'
      - name: Verify real HTTPS app and widget at desktop, phone and small-phone sizes
        run: python scripts/verify_kitchen_readable_public.py --source f855795d25144b3674ffb1c1961bb9ff5f9925e6 --publish-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitchen-readable-public-browser
          path: /tmp/kitchen-readable-public/
          retention-days: 3
