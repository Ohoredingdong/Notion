name: Verify Investment Desk UI Preview
on:
  workflow_dispatch:
  push:
    branches: [main, 'design/investment-desk-20261029']
    paths:
      - 'stock-radar-ui-preview.html'
      - 'assets/stock-radar-desk*'
      - 'scripts/install_stock_radar_desk_preview.py'
      - 'scripts/test_stock_radar_desk_preview.py'
      - '.github/workflows/test-stock-radar-ui-preview.yml'
permissions:
  contents: write
concurrency:
  group: radar-desk-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated design preview
        run: |
          python scripts/install_stock_radar_desk_preview.py
          node --check /tmp/radar-desk-preview.js
          cp stock-radar-ui-preview.html /tmp/desk-once.html
          python scripts/install_stock_radar_desk_preview.py
          cmp stock-radar-ui-preview.html /tmp/desk-once.html
      - name: Install browser verifier
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify desktop, tablet and mobile flows
        run: |
          python -m http.server 8768 >/tmp/desk-http.log 2>&1 &
          python scripts/test_stock_radar_desk_preview.py
      - name: Save generated preview on design branch only
        if: github.ref_name == 'design/investment-desk-20261029'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock-radar-ui-preview.html
          if ! git diff --cached --quiet; then
            git commit -m 'design: generate tested content-first investment desk preview'
            git push origin HEAD:design/investment-desk-20261029
          fi
      - name: Verify exact public preview
        if: github.ref_name == 'main'
        run: |
          git diff --exit-code -- stock-radar-ui-preview.html
          python - <<'PY'
          import hashlib,time,urllib.request
          from pathlib import Path
          expected=hashlib.sha256(Path('stock-radar-ui-preview.html').read_bytes()).hexdigest()
          for i in range(24):
              try:
                  req=urllib.request.Request('https://ohoredingdong.github.io/Notion/stock-radar-ui-preview.html?desk='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      assert r.status==200
                      actual=r.read()
                  assert hashlib.sha256(actual).hexdigest()==expected
                  print('PUBLIC_DESK_HTML_EXACTLY_VERIFIED',expected)
                  break
              except Exception:
                  if i==23:raise
                  time.sleep(5)
          PY
          python scripts/test_stock_radar_desk_preview.py --url 'https://ohoredingdong.github.io/Notion/stock-radar-ui-preview.html'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investment-desk-preview-evidence
          retention-days: 7
          path: |
            desk-preview-evidence/
            stock-radar-ui-preview.html
