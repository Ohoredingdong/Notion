name: Validate and publish auction widget

on:
  push:
    paths:
      - '_auction/**'
      - 'auction-study.html'
      - 'assets/auction-study*'
      - 'assets/auction-practice/**'
      - 'auction-release.json'
      - 'tests/auction-study*.test.cjs'
      - 'tests/test_auction_release.py'
      - 'scripts/test_auction_*.py'
      - 'scripts/auction_release.py'
      - '.github/workflows/auction-widget.yml'
  pull_request:
    branches: [main]
    paths:
      - '_auction/**'
      - 'auction-study.html'
      - 'assets/auction-study*'
      - 'assets/auction-practice/**'
      - 'auction-release.json'
      - 'tests/auction-study*.test.cjs'
      - 'tests/test_auction_release.py'
      - 'scripts/test_auction_*.py'
      - 'scripts/auction_release.py'
      - '.github/workflows/auction-widget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auction-widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the published copy and release safeguards
        run: |
          python scripts/auction_release.py check-public --root .
          python -m unittest discover -s tests -p test_auction_release.py
      - name: Calculator, evidence and process regressions
        run: |
          node tests/auction-study-model.test.cjs
          node tests/auction-study-format.test.cjs
          node tests/auction-study-lessons.test.cjs
          node tests/auction-study-simulation-data.test.cjs
          node tests/auction-study-process.test.cjs
          node tests/auction-study-course.test.cjs
      - name: Prepare the browser already installed on the runner
        shell: bash
        run: |
          python -m pip install 'playwright==1.56.0'
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [[ -n "$browser_path" ]]; then
            "$browser_path" --version
            echo "BROWSER_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Test the development source in isolated browsers
        shell: bash
        env:
          AUCTION_STUDY_URL: http://127.0.0.1:8765/_auction/auction-study.html
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/auction-http.log 2>&1 &
          python -B scripts/test_auction_study_browser.py | tee /tmp/auction-functional.log
          python -B scripts/test_auction_rights_layout.py | tee /tmp/auction-layout.log
          python -B scripts/test_auction_learning_browser.py | tee /tmp/auction-learning.log
          python -B scripts/test_auction_simulation_browser.py --artifacts /tmp/auction-simulation-browser | tee /tmp/auction-simulation.log
          python -B scripts/test_auction_review_browser.py --artifacts /tmp/auction-review-browser | tee /tmp/auction-review.log
          python -B scripts/test_auction_accessibility_browser.py --artifacts /tmp/auction-accessibility-browser | tee /tmp/auction-accessibility.log
          python -B scripts/test_auction_polish_browser.py --artifacts /tmp/auction-polish-browser | tee /tmp/auction-polish.log
          python -B scripts/test_auction_course_browser.py --artifacts /tmp/auction-course-browser | tee /tmp/auction-course.log
      - name: Package only the verified auction files
        run: python scripts/auction_release.py package --source _auction --output /tmp/auction-validated --source-sha '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: validated-auction-${{ github.sha }}
          path: /tmp/auction-validated/
          if-no-files-found: error
      - name: Record browser results
        if: always()
        run: |
          python - <<'REPORT'
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for name in ['functional', 'layout', 'learning', 'simulation', 'review', 'accessibility', 'polish', 'course']:
                  log = Path('/tmp/auction-' + name + '.log')
                  summary.write('### Auction ' + name + '\n\n```text\n' + (log.read_text() if log.exists() else 'Not run\n') + '```\n\n')
          REPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auction-widget-browser-evidence
          if-no-files-found: warn
          path: |
            /tmp/auction-study-*.png
            /tmp/auction-study-learning-report.json
            /tmp/auction-simulation-browser/
            /tmp/auction-review-browser/
            /tmp/auction-accessibility-browser/
            /tmp/auction-polish-browser/
            /tmp/auction-course-browser/

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: validated-auction-${{ github.sha }}
          path: /tmp/auction-validated
      - name: Promote verified files while preserving current main data
        shell: bash
        run: |
          git fetch origin main
          git checkout -B auction-publish origin/main
          python scripts/auction_release.py promote --bundle /tmp/auction-validated --root .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- auction-study.html 'assets/auction-study*' assets/auction-practice auction-release.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified auction release ${{ github.sha }}'
            pushed=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              git fetch origin main
              git rebase origin/main
              python scripts/auction_release.py check-source --bundle /tmp/auction-validated --root .
            done
            if [[ "$pushed" != true ]]; then
              echo 'Main changed repeatedly; the verified auction release was not pushed.' >&2
              exit 1
            fi
          fi
          python scripts/auction_release.py check-public --root .
      - name: Build the existing Pages site after promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
      - name: Prepare the public browser checks
        shell: bash
        run: |
          python -m pip install 'playwright==1.56.0'
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [[ -n "$browser_path" ]]; then
            "$browser_path" --version
            echo "BROWSER_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Verify the public release and every runtime asset
        run: python scripts/auction_release.py verify-public --bundle /tmp/auction-validated --url https://ohoredingdong.github.io/Notion/ --attempts 72 --delay 10 --max-seconds 900
      - name: Test the actual public auction app
        shell: bash
        env:
          AUCTION_STUDY_URL: https://ohoredingdong.github.io/Notion/auction-study.html?release=${{ github.sha }}
        run: |
          python -B scripts/test_auction_study_browser.py | tee /tmp/auction-public-functional.log
          python -B scripts/test_auction_rights_layout.py | tee /tmp/auction-public-layout.log
          python -B scripts/test_auction_learning_browser.py | tee /tmp/auction-public-learning.log
          python -B scripts/test_auction_simulation_browser.py --artifacts /tmp/auction-public-simulation | tee /tmp/auction-public-simulation.log
          python -B scripts/test_auction_review_browser.py --artifacts /tmp/auction-public-review | tee /tmp/auction-public-review.log
          python -B scripts/test_auction_accessibility_browser.py --artifacts /tmp/auction-public-accessibility | tee /tmp/auction-public-accessibility.log
          python -B scripts/test_auction_polish_browser.py --artifacts /tmp/auction-public-polish | tee /tmp/auction-public-polish.log
          python -B scripts/test_auction_course_browser.py --artifacts /tmp/auction-public-course | tee /tmp/auction-public-course.log
      - name: Record public browser results
        if: always()
        run: |
          python - <<'REPORT'
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for name in ['functional', 'layout', 'learning', 'simulation', 'review', 'accessibility', 'polish', 'course']:
                  log = Path('/tmp/auction-public-' + name + '.log')
                  summary.write('### Public auction ' + name + '\n\n```text\n' + (log.read_text() if log.exists() else 'Not run\n') + '```\n\n')
          REPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auction-public-browser-evidence
          if-no-files-found: warn
          path: |
            /tmp/auction-study-*.png
            /tmp/auction-study-learning-report.json
            /tmp/auction-public-simulation/
            /tmp/auction-public-review/
            /tmp/auction-public-accessibility/
            /tmp/auction-public-polish/
            /tmp/auction-public-course/
