name: Verify Public Full Universe AI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['stock-extended-direction-forecast.json']
permissions:
  contents: read
concurrency:
  group: public-full-universe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe exact public forecast, catalogue and UI bytes
        run: python scripts/verify_stock_universe_public.py --commit "$GITHUB_SHA" --output universe-evidence/publication.json --attempts 36 --interval 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-full-universe-verification
          path: universe-evidence/publication.json
          retention-days: 7
          if-no-files-found: warn
