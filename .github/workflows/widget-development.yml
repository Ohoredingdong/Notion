name: Widget development checks

on:
  pull_request:
    branches: [main]
  push:
    branches: ['codex/**', 'feature/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widget-development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install checksum-verified Actions validator
        run: |
          bash scripts/install_actionlint.sh "$RUNNER_TEMP/actionlint-tools"
          echo "$RUNNER_TEMP/actionlint-tools" >> "$GITHUB_PATH"
      - name: Install hash-locked development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          npm ci --ignore-scripts --no-audit --no-fund
          python -m playwright install --with-deps chromium
      - name: Validate the proposed changes in an isolated source copy
        # Test the event checkout (PR merge result), not a hardcoded main checkout.
        env:
          CHECK_ARTIFACTS: ${{ runner.temp }}/widget-checks
        run: python -B scripts/check_changed.py --base origin/main --head HEAD --browser --artifacts "$CHECK_ARTIFACTS"
      - name: Preserve actual results, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-development-evidence
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/widget-checks/
