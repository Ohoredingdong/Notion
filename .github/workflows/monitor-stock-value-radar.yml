name: Monitor Stock Radar Health
on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"
  workflow_run:
    workflows: ['Update Stock Opportunities', 'Stock Investment Cases', 'Stock Official Financial Coverage']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "scripts/monitor-stock-value-radar.py"
      - "scripts/market_data_utils.py"
      - "scripts/test_stock_data_pipeline.py"
      - ".github/workflows/monitor-stock-value-radar.yml"
permissions:
  contents: write
  issues: write
concurrency:
  group: monitor-stock-radar
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exchange session calendar
        run: pip install 'exchange-calendars==4.13.1'
      - name: Test stale sources, missing feeds and closed-market handling
        run: python -m unittest discover -s scripts -p 'test_stock_data_pipeline.py' -v
      - name: Inspect canonical feeds and actual source sessions
        run: python scripts/monitor-stock-value-radar.py
      - name: Write independent health heartbeat
        run: >-
          python scripts/publish_widget_data.py --message 'ops: inspect canonical radar feeds and completed sessions' stock-radar-health.json
      - name: Open or close actionable GitHub alert issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          issue=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "[Stock Radar] 자동 데이터 이상 감지") | .number' | head -n 1)
          required=$(python -c 'import json;d=json.load(open("stock-radar-health.json"));print("yes" if d.get("notification_required") else "no")')
          if [ "$required" = "yes" ]; then
            summary=$(python -c 'import json;d=json.load(open("stock-radar-health.json"));print("\n".join("- "+x for x in d.get("issues",[])))')
            if [ -z "$issue" ]; then
              gh issue create --assignee "$GITHUB_REPOSITORY_OWNER" --title "[Stock Radar] 자동 데이터 이상 감지" --body "자동 데이터 감시가 연속 2회 이상 이상을 감지했습니다.\n\n${summary}\n\n상태: https://ohoredingdong.github.io/Notion/stock-value-radar.html\n\n재실행: https://github.com/Ohoredingdong/Notion/actions/workflows/update-stock-value-radar.yml"
            else
              gh issue comment "$issue" --body "이상 지속: ${summary}"
            fi
          elif [ -n "$issue" ]; then
            level=$(python -c 'import json;print(json.load(open("stock-radar-health.json")).get("status"))')
            if [ "$level" != "error" ]; then
              gh issue close "$issue" --comment "데이터 갱신 경보가 해제되었습니다. 품질경고는 위젯에서 계속 확인하세요."
            fi
          fi
      - name: Fail when required canonical data remains broken
        run: |
          python - <<'PY'
          import json
          report=json.load(open('stock-radar-health.json'))
          if report['status']=='error':
              raise SystemExit('Canonical feed health failed; published report and source-specific issues are available.')
          PY

