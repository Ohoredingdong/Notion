name: Update Real Estate Pulse

on:
  workflow_dispatch:
  schedule:
    # 16:20 KST daily. REB weekly releases are normally available before this window.
    - cron: '20 7 * * *'
  push:
    branches:
      - main
      - fix/real-estate-pulse-post-merger-auto
    paths:
      - 'scripts/update_real_estate_pulse.py'
      - 'scripts/run_real_estate_pulse_update.py'
      - '.github/workflows/update-real-estate-pulse.yml'

permissions:
  contents: write

concurrency:
  group: real-estate-pulse-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install official-data parser dependencies
        run: pip install requests beautifulsoup4

      - name: Check official REB release safely
        id: refresh
        continue-on-error: true
        shell: bash
        run: timeout 7m python scripts/run_real_estate_pulse_update.py

      - name: Publish verified dataset and collection health
        run: >-
          python scripts/publish_widget_data.py --message 'data: update verified REB weekly statistics' real-estate-pulse-data.json real-estate-pulse-health.json

      - name: Report official collection failure
        if: steps.refresh.outcome == 'failure'
        run: exit 1
