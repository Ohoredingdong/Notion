name: Validate Real Estate Pulse

on:
  push:
    branches:
      - main
    paths:
      - 'real-estate-pulse-data.json'
      - '.github/workflows/update-real-estate-pulse.yml'
  pull_request:
    paths:
      - 'real-estate-pulse-data.json'
      - '.github/workflows/update-real-estate-pulse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate all 17 Korean regions
        shell: python
        run: |
          import json
          from pathlib import Path

          expected = [
              '서울','부산','대구','인천','광주','대전','울산','세종','경기',
              '강원','충북','충남','전북','전남','경북','경남','제주'
          ]
          data = json.loads(Path('real-estate-pulse-data.json').read_text(encoding='utf-8'))
          rows = data.get('regions', [])
          by_name = {row.get('name'): row for row in rows}

          assert set(by_name) == set(expected), f'17개 시도 구성 오류: {sorted(set(expected) ^ set(by_name))}'
          assert len(rows) == 17, f'지역 행 수 오류: {len(rows)}'

          missing = []
          for name in expected:
              row = by_name[name]
              for field in ('sale', 'lease'):
                  value = row.get(field)
                  if value is None or isinstance(value, bool) or not isinstance(value, (int, float)):
                      missing.append(f'{name}:{field}')
          assert not missing, '미확인 값(null/비숫자)이 있습니다: ' + ', '.join(missing)

          print('OK: 17개 시도 × 매매/전세 34개 값 모두 확인됨')
