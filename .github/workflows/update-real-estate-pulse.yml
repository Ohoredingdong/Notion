name: Update Real Estate Pulse

on:
  workflow_dispatch:
  schedule:
    # 16:20 KST daily. REB weekly releases are normally available before this window.
    - cron: '20 7 * * *'
  push:
    branches:
      - main
      - fix/real-estate-pulse-17-auto-v2
    paths:
      - 'scripts/update_real_estate_pulse.py'
      - 'scripts/run_real_estate_pulse_update.py'
      - '.github/workflows/update-real-estate-pulse.yml'

permissions:
  contents: write

concurrency:
  group: real-estate-pulse-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install official-data parser dependencies
        run: pip install requests beautifulsoup4 pypdf openpyxl

      - name: Check official REB release safely
        id: refresh
        continue-on-error: true
        shell: bash
        run: timeout 7m python scripts/run_real_estate_pulse_update.py

      - name: Detect verified data change
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- real-estate-pulse-data.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No newer complete official dataset was published.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'A newer complete official dataset is ready.'
          fi

      - name: Validate current 16 regions and official provenance
        if: steps.diff.outputs.changed == 'true'
        run: python scripts/run_real_estate_pulse_update.py --validate-only

      - name: Commit only the verified dataset
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- real-estate-pulse-data.json
          git commit -m 'chore: update Real Estate Pulse official data'
          git push
