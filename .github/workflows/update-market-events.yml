name: Update Market Events

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update-market-events.py"
      - "scripts/ensure-bok-market-events.py"
      - ".github/workflows/update-market-events.yml"
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: update-market-events-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update-market-events.py
      - run: python scripts/ensure-bok-market-events.py
      - name: Publish data on current main
        run: >-
          python scripts/publish_widget_data.py --message "data: update market events" market-events-data.json
