name: Update Bond Yields

on:
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update-bond-yields.py"
      - ".github/workflows/update-bond-yields.yml"

permissions:
  contents: write

concurrency:
  group: update-bond-yields-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update-bond-yields.py
      - name: Publish data on current main
        run: >-
          python scripts/publish_widget_data.py --message "data: update bond yields" bond-yields-data.json
