name: Update Bond Yields

on:
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update-bond-yields.py"
      - ".github/workflows/update-bond-yields.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update-bond-yields.py
      - name: Commit data if changed
        run: |
          if git diff --quiet -- bond-yields-data.json; then
            echo "No data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bond-yields-data.json
          git commit -m "data: update bond yields"
          git push
