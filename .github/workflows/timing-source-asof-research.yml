name: Research Source-Time As-Of Audit (temporary)
on:
  workflow_dispatch:
  push:
    branches: [research/timing-source-asof-20261030]
    paths:
      - 'scripts/audit_stock_forecast_independent.py'
      - 'scripts/test_stock_timing_source_asof.py'
      - 'docs/experiments/timing-source-asof-20261030.md'
      - '.github/workflows/timing-source-asof-research.yml'
permissions:
  contents: read
concurrency:
  group: research-source-asof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic prospective time RED/GREEN
        run: PYTHONPATH=scripts python scripts/test_stock_timing_source_asof.py -v
      - name: Existing independent forecast and learning integrity tests
        run: |
          python scripts/audit_stock_forecast_independent.py --self-test
          python scripts/audit_stock_forecast_independent.py
          python scripts/audit_stock_learning_evidence.py --self-test
          python scripts/audit_stock_learning_evidence.py
      - name: Existing core prospective and source regression
        run: |
          pip install 'yfinance==0.2.66' 'exchange-calendars==4.13.1' 'scikit-learn==1.8.0' 'numpy>=2,<3' 'pandas>=2.2,<3' 'scipy>=1.11,<2'
          PYTHONPATH=scripts python -m unittest discover -s scripts -p test_stock_forecasts.py -v
          PYTHONPATH=scripts python -m unittest test_stock_forecast_learning test_stock_forecast_learning_display test_stock_forecast_directions test_stock_autopilot -v
          python scripts/stock_forecast_sources.py
          node scripts/test_stock_forecast_ui.cjs
          node scripts/stock_autopilot_recovery.cjs
