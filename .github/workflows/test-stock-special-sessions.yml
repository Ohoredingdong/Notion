name: Test Stock Special Sessions (Read Only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/stock_exchange_calendar.py'
      - 'scripts/test_stock_special_sessions.py'
      - 'scripts/market_data_utils.py'
      - 'scripts/stock_entry_inputs.py'
      - 'scripts/stock_forecast_model.py'
      - 'scripts/build_stock_world_flow.py'
      - 'scripts/build_stock_radar_chart_cache.py'
      - 'scripts/update_stock_decisions.py'
      - '.github/workflows/test-stock-special-sessions.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/stock_exchange_calendar.py'
      - 'scripts/test_stock_special_sessions.py'
      - '.github/workflows/test-stock-special-sessions.yml'
permissions:
  contents: read
jobs:
  offline-session-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: pip install 'exchange-calendars==4.13.1' scikit-learn scipy beautifulsoup4
      - name: Verify session boundaries and dependent pipeline regressions
        run: |
          PYTHONPATH=scripts python -m unittest scripts.test_stock_special_sessions scripts.test_stock_data_pipeline scripts.test_stock_price_evidence scripts.test_stock_forecasts scripts.test_stock_world_flow scripts.test_stock_universe_forecasts scripts.test_market_context -v
