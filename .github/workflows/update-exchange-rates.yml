name: Update Exchange Rates
on:
  workflow_dispatch:
  schedule:
    - cron: "37 14,15,16 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/update-exchange-rates.py"
      - ".github/workflows/update-exchange-rates.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update-exchange-rates.py
      - name: Commit data if changed
        run: |
          if git diff --quiet -- exchange-rates-data.json; then
            echo "No data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exchange-rates-data.json
          git commit -m "data: update exchange rates"
          git push
