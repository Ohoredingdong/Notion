name: Update Exchange Rates
on:
  workflow_dispatch:
  schedule:
    - cron: "37 14,15,16 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/update-exchange-rates.py"
      - ".github/workflows/update-exchange-rates.yml"
permissions:
  contents: write
concurrency:
  group: update-exchange-rates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update-exchange-rates.py
      - name: Publish data on current main
        run: >-
          python scripts/publish_widget_data.py --message "data: update exchange rates" exchange-rates-data.json
