name: Research Shadow Probability Evidence Guard
on:
  push:
    branches: ['research/timing-shadow-distribution-audit-20261030']
    paths:
      - 'scripts/audit_stock_forecast_independent.py'
      - '.github/workflows/test-timing-shadow-audit-20261030.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-shadow-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent synthetic red-green test
        run: python scripts/audit_stock_forecast_independent.py --self-test
      - name: Audit actual immutable records without writing production data
        run: |
          python scripts/audit_stock_forecast_independent.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('stock-forecast-independent-audit.json').read_text())
          assert r['status']=='ledger_arithmetic_consistent', r['errors']
          assert r['outcome_rows_seen']==21 and r['outcome_rows_verified']==21
          assert r['scored']==6 and r['correct']==3
          assert r['directions']['down']['actual']==3
          assert r['directions']['down']['missed']==3
          assert r['directions']['up']['actual']==0
          assert r['externally_verified_candles'] is False
          assert r['human_push_delivery_verified'] is False
          assert r['proven_predictive_edge'] is False
          print('PINNED_INTERNAL_AUDIT_UNCHANGED',r['prediction_rows'],r['scored'],r['correct'])
          PY
      - name: Install forecast test dependencies
        run: pip install 'yfinance==0.2.66' 'exchange-calendars==4.13.1' 'scikit-learn==1.8.0' 'numpy>=2,<3' 'pandas>=2.2,<3' 'scipy>=1.11,<2'
      - name: Existing forecast, direction, learning and bounded-controller regressions
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_stock_forecasts.py' -v
          PYTHONPATH=scripts python -m unittest test_stock_forecast_learning test_stock_forecast_learning_display test_stock_forecast_directions test_stock_autopilot -v
          python scripts/stock_forecast_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-probability-integrity-research
          retention-days: 10
          path: stock-forecast-independent-audit.json
