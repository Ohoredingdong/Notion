name: MUSE functional validation

on:
  pull_request:
    paths:
      - 'editorial-studio.html'
      - 'assets/editorial-*'
      - 'assets/editorial-studio/**'
      - 'services/editorial-studio/**'
      - 'tests/editorial-*.py'
      - '.github/workflows/test-editorial-studio.yml'
      - 'render.yaml'
  push:
    branches: [main, 'codex/muse-*']
    paths:
      - 'editorial-studio.html'
      - 'assets/editorial-*'
      - 'assets/editorial-studio/**'
      - 'services/editorial-studio/**'
      - 'tests/editorial-*.py'
      - '.github/workflows/test-editorial-studio.yml'
      - 'render.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STUDIO_IMAGE_API_KEY: ''
      OPENAI_API_KEY: ''
      STUDIO_URL: http://127.0.0.1:8787/editorial-studio.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print('STUDIO_BROWSER=' + p.chromium.executable_path)
          PY
      - name: Validate shared contract and server
        run: node --test --test-isolation=none services/editorial-studio/*.test.mjs
      - name: Build the private generation service image
        run: docker build -f services/editorial-studio/Dockerfile -t muse-studio-validation .
      - name: Check production container startup and authentication
        run: |
          docker run -d --name muse-runtime-check -p 127.0.0.1:8825:10000 -e STUDIO_IMAGE_API_KEY=fixture-not-an-api-key -e STUDIO_ACCESS_PASSWORD=fixture-owner-password-for-container muse-studio-validation
          trap 'docker rm -f muse-runtime-check >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          base = 'http://127.0.0.1:8825'
          for attempt in range(40):
              try:
                  with urllib.request.urlopen(base + '/healthz', timeout=2) as response:
                      assert json.load(response) == {'ok': True}
                  break
              except OSError:
                  if attempt == 39:
                      raise
                  time.sleep(0.25)
          try:
              urllib.request.urlopen(base + '/api/studio/status', timeout=2)
              raise AssertionError('Private generation status must require login')
          except urllib.error.HTTPError as error:
              assert error.code == 401
          body = json.dumps({'password': 'fixture-owner-password-for-container'}).encode()
          request = urllib.request.Request(base + '/api/studio/session', data=body, headers={'Content-Type': 'application/json', 'Origin': base.replace('http:', 'https:')})
          with urllib.request.urlopen(request, timeout=2) as response:
              assert json.load(response)['authenticated'] is True
              assert 'HttpOnly' in response.headers['Set-Cookie'] and 'Secure' in response.headers['Set-Cookie']
          print('Production image starts as non-root and requires an owner session; no image provider request was made')
          PY
      - name: Exercise static Pages and large photo uploads
        run: |
          mkdir -p /tmp/notion-muse-function-fix
          python tests/editorial-static-browser.py --browser-executable "$STUDIO_BROWSER" --output /tmp/notion-muse-function-fix/static > /tmp/notion-muse-function-fix/static.log 2>&1
          python tests/editorial-image-upload-browser.py > /tmp/notion-muse-function-fix/uploads.log 2>&1
          python tests/editorial-auth-browser.py > /tmp/notion-muse-function-fix/auth.log 2>&1
      - name: Exercise editorial, model, and local preparation flows
        run: |
          mkdir -p /tmp/notion-muse-function-fix
          node services/editorial-studio/server.mjs > /tmp/notion-muse-function-fix/server.log 2>&1 &
          studio_pid=$!
          trap 'kill "$studio_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8787/api/studio/status', timeout=2) as response:
                      assert response.status == 200
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(0.2)
          PY
          python tests/editorial-studio-browser.py > /tmp/notion-muse-function-fix/studio.log 2>&1
          python tests/editorial-model-browser.py > /tmp/notion-muse-function-fix/model.log 2>&1
          python tests/editorial-manual-browser.py > /tmp/notion-muse-function-fix/manual.log 2>&1
      - name: Summarize functional failures
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('/tmp/notion-muse-function-fix')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('## MUSE validation evidence\n\nAll images and credentials used in these tests are synthetic fixtures. No live provider is called.\n\n')
              for path in sorted(root.glob('*.log')):
                  summary.write('### ' + path.name + '\n\n```text\n' + path.read_text(errors='replace')[-9000:] + '\n```\n\n')
              for path in sorted(root.glob('*/report.json')):
                  report = json.loads(path.read_text())
                  summary.write('### ' + str(path.relative_to(root)) + '\n\n')
                  for check in report.get('checks', []):
                      if isinstance(check, dict) and (check.get('pass') is False):
                          summary.write('```text\n' + json.dumps(check, ensure_ascii=False)[:7000] + '\n```\n\n')
          PY
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-functional-${{ github.run_id }}
          path: /tmp/notion-muse-function-fix
          if-no-files-found: warn
          retention-days: 7
