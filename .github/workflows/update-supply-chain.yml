name: Update Supply Chain Pulse
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update-supply-chain.py"
      - ".github/workflows/update-supply-chain.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/update-supply-chain.py
      - name: Commit data if changed
        run: |
          if git diff --quiet -- supply-chain-data.json; then
            echo "No data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supply-chain-data.json
          git commit -m "data: update supply chain pulse"
          git push
