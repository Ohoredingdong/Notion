name: Update Supply Chain Pulse
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update-supply-chain.py"
      - ".github/workflows/update-supply-chain.yml"
permissions:
  contents: write
concurrency:
  group: update-supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/update-supply-chain.py
      - name: Publish data on current main
        run: >-
          python scripts/publish_widget_data.py --message "data: update supply chain" supply-chain-data.json
