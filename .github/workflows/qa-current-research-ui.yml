name: QA Current Research UI Branch
on:
  push:
    branches: [qa/current-research-ui-20261117]
    paths: ['.github/workflows/qa-current-research-ui.yml', 'scripts/test_stock_radar_*browser.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-research-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Serve saved repository snapshot
        run: python -m http.server 8765 >/tmp/current-research-ui.log 2>&1 &
      - name: Canonical redirect and desktop geometry
        run: python scripts/test_stock_radar_canonical_browser.py
      - name: Current research interactions and responsive layout
        if: '!cancelled()'
        run: python scripts/test_stock_radar_flow_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-research-ui-evidence
          path: decision-browser-tests/
          retention-days: 3
