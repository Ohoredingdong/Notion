name: Test Stock Radar Integrated UI
on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/radar-feature-audit-20261030']
    paths:
      - 'stock-value-radar.html'
      - 'stock-radar-dashboard.html'
      - 'stock-value-radar-advanced.html'
      - 'assets/stock-radar-clean-bridge.js'
      - 'assets/stock-radar-flow-v2.js'
      - 'scripts/test_stock_radar_flow_browser.py'
      - 'scripts/publish_stock_opportunities.py'
      - 'scripts/publish_stock_market_groups.py'
      - 'scripts/publish_stock_investment_cases.py'
      - 'scripts/install_stock_radar_v8.py'
      - 'scripts/install_stock_decision_ui.py'
      - 'scripts/install_stock_audit_ui.py'
      - 'scripts/test_stock_radar_publish_protection.py'
      - 'assets/stock-radar-neutral.js'
      - 'assets/stock-radar-neutral.css'
      - 'assets/stock-radar-v8.js'
      - 'assets/stock-radar-v8.css'
      - 'assets/stock-radar-v9.js'
      - 'assets/stock-forecast.js'
      - 'assets/stock-recommendations.js'
      - 'assets/stock-investment-cases.js'
      - 'tests/stock-entry-browser.cjs'
      - 'scripts/test_stock_decision_browser.py'
      - 'scripts/test_market_context.py'
      - 'scripts/update_market_context.py'
      - '.github/workflows/test-stock-radar-integration.yml'
permissions:
  contents: read
jobs:
  integrated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          pip install 'playwright==1.56.0' beautifulsoup4
          python -m playwright install --with-deps chromium
          npm install --no-save --package-lock=false @playwright/test@1.56.0
      - name: Syntax checks
        run: |
          node --check assets/stock-radar-neutral.js
          node --check assets/stock-radar-clean-bridge.js
          node --check assets/stock-radar-flow-v2.js
          python -m py_compile scripts/test_stock_radar_flow_browser.py
          python scripts/test_stock_radar_publish_protection.py
          node --check assets/stock-recommendations.js
          node --check assets/stock-investment-cases.js
          node --check assets/stock-forecast.js
          python -m py_compile scripts/test_stock_decision_browser.py
          python -m unittest scripts.test_market_context -v
      - name: Start local radar
        run: |
          python -m http.server 8765 >/tmp/integrated-radar-http.log 2>&1 &
      - name: Verify neutral home, legacy research and entry-plan navigation
        run: |
          node tests/stock-entry-browser.cjs
          python scripts/test_stock_decision_browser.py
          python scripts/test_stock_radar_flow_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-radar-integrated-ui-evidence
          retention-days: 5
          path: |
            entry-*.png
            decision-browser-tests/
