name: Update Korea Fear Greed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_korea_fear_greed.py
      - .github/workflows/update-korea-fear-greed.yml
  schedule:
    # KST 15:55 and 18:25 after the Korean regular-session close.
    - cron: "55 6 * * 1-5"
    - cron: "25 9 * * 1-5"
permissions:
  contents: write
concurrency:
  group: update-korean-sentiment-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate updater
        run: python -m py_compile scripts/update_korea_fear_greed.py
      - name: Read attributed after-close Korean market sentiment API
        run: python scripts/update_korea_fear_greed.py
      - name: Publish Korea reading only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- stock-korea-fear-greed.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: refresh attributed Korean KOSPI/KOSDAQ fear-greed reading"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
