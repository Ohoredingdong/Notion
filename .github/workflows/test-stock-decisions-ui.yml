name: Test Stock Decision UI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/test_stock_decision_browser.py'
      - '.github/workflows/test-stock-decisions-ui.yml'
      - 'stock-value-radar.html'
      - 'assets/stock-radar-v8.js'
      - 'assets/stock-radar-v8.css'
      - 'assets/stock-radar-v9.js'
      - 'assets/stock-radar-neutral.js'
      - 'assets/stock-radar-neutral.css'
  workflow_run:
    workflows: ['Update Stock Decisions']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: stock-decision-ui-qa
  cancel-in-progress: false
jobs:
  browser:
    # Scheduled/manual/push recovery remains independent; chained work requires a successful same-repository producer.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser
        run: |
          pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Test full widget interaction and layout
        run: python scripts/test_stock_radar_canonical_browser.py --output /tmp/stock-decision-current-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-decision-browser-tests
          path: /tmp/stock-decision-current-browser/
          retention-days: 3
