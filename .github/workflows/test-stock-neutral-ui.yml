name: Verify Neutral Production Radar
on:
  workflow_dispatch:
  push:
    branches: [main, 'design/neutral-production-20261030']
    paths:
      - '.github/workflows/test-stock-neutral-ui.yml'
      - 'assets/stock-radar-neutral.*'
      - 'scripts/install_stock_radar_neutral.py'
      - 'scripts/test_stock_radar_neutral.py'
permissions:
  contents: read
concurrency:
  group: neutral-radar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build neutral production UI if present
        run: |
          if [ -f scripts/install_stock_radar_neutral.py ]; then
            python scripts/install_stock_radar_neutral.py
            node --check assets/stock-radar-neutral.js
          fi
      - name: Inspect source schemas without publishing or changing data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          names=['stock-opportunity-data.json','stocks-dashboard-data.json','stock-market-context.json','stock-investment-cases.json']
          for name in names:
              if not Path(name).exists(): continue
              obj=json.loads(Path(name).read_text())
              print(name, 'top keys:',list(obj))
              if isinstance(obj.get('companies'),list) and obj['companies']:
                  c=obj['companies'][0]
                  print('company keys:',list(c))
                  print('technical keys:',list(c.get('technical') or {}))
          PY
      - name: Browser regression
        run: |
          if [ -f scripts/test_stock_radar_neutral.py ]; then
            pip install playwright
            python -m playwright install --with-deps chromium
            python -m http.server 8770 >/tmp/neutral-http.log 2>&1 &
            python scripts/test_stock_radar_neutral.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neutral-production-evidence
          retention-days: 3
          path: |
            stock-value-radar.html
            assets/stock*.js
            assets/stock*.css
            assets/stock-radar-v8.html
            stock-opportunity-data.json
            stock-opportunity-summary.json
            stock-market-context.json
            stocks-dashboard-data.json
            stock-investment-cases.json
            stock-investment-cases-summary.json
            stock-green-review.json
            stock-green-review-summary.json
            stock-entry-plan-summary.json
            stock-forecast-learning.json
            stock-event-risks.json
            neutral-ui-evidence/
