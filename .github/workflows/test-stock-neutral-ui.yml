name: Verify Canonical Production Radar
on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/radar-integrity-20261105']
    paths:
      - '.github/workflows/test-stock-neutral-ui.yml'
      - 'assets/stock-radar-clean-bridge.js'
      - 'assets/stock-radar-flow-v2.js'
      - 'assets/stock-catalog-ui.js'
      - 'assets/stock-world-brief.js'
      - 'stock-value-radar.html'
      - 'scripts/install_stock_radar_neutral.py'
      - 'scripts/test_stock_radar_neutral.py'
  schedule:
    - cron: '41 */2 * * 1-5'
permissions:
  contents: read
concurrency:
  group: canonical-radar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the legacy installer cannot alter the canonical UI
        run: |
          sha256sum stock-value-radar.html assets/stock-radar-v8.html assets/stock-radar-v8.js stock-opportunity-data.json stock-investment-cases.json stock-green-review.json stock-forecast-learning.json > /tmp/radar-before.sha
          python scripts/install_stock_radar_neutral.py
          python scripts/install_stock_radar_neutral.py
          sha256sum -c /tmp/radar-before.sha
          python scripts/test_stock_radar_publish_protection.py
          node --check assets/stock-radar-clean-bridge.js
          node --check assets/stock-radar-flow-v2.js
          node scripts/test_stock_catalog_integrity.cjs
          node scripts/test_stock_radar_freshness.cjs
      - name: Browser regression with actual repository snapshots
        run: |
          pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
          python -m http.server 8770 >/tmp/canonical-http.log 2>&1 &
          python scripts/test_stock_radar_neutral.py
      - name: Verify the public canonical page on main
        if: github.ref_name == 'main'
        run: |
          python - <<'PY'
          import hashlib,time,urllib.request
          from pathlib import Path
          names=['stock-value-radar.html','assets/stock-radar-clean-bridge.js','assets/stock-radar-flow-v2.js','assets/stock-catalog-ui.js','assets/stock-world-brief.js']
          expected={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in names}
          for attempt in range(36):
              try:
                  for name,want in expected.items():
                      req=urllib.request.Request('https://ohoredingdong.github.io/Notion/'+name+'?canonical-verify='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=15) as response:
                          assert response.status==200
                          assert hashlib.sha256(response.read()).hexdigest()==want,name
                  print('EXACT_PUBLIC_CANONICAL_UI_VERIFIED',expected)
                  break
              except Exception:
                  if attempt==35:raise
                  time.sleep(6)
          PY
          python scripts/test_stock_radar_neutral.py --url 'https://ohoredingdong.github.io/Notion/stock-value-radar.html' --public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-production-evidence
          retention-days: 5
          path: neutral-ui-evidence/
