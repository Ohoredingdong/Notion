name: Verify kitchen full flow storyboard image delivery
on:
  push:
    branches: [delivery/verify-kitchen-full-flow-20261104]
    paths:
      - '.github/workflows/verify-kitchen-full-flow-preview.yml'
      - 'scripts/verify_kitchen_storyboards_public.py'
permissions:
  contents: write
concurrency:
  group: kitchen-full-flow-public-verification-20261104
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Install browser driver
        run: python -m pip install 'playwright==1.56.0'
      - name: Verify actual HTTPS viewer and five unchanged original PNGs
        run: python scripts/verify_kitchen_storyboards_public.py --source 9c509c90d4aa7a699b48e484f431b78fb0094049 --images-source 64ad8fd93e131985e71f8338076ec898153e6a8e --publish-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitchen-full-flow-public-browser
          path: /tmp/kitchen-full-flow-public/
          retention-days: 3
