name: Build Market v2 widgets
on:
  push:
    paths:
      - '.github/workflows/build-market-v2.yml'
      - 'scripts/build_market_v2.py'
      - 'market-events.html'
      - 'commodities-dashboard.html'
      - 'fear-greed-dashboard.html'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v2 copies
        run: python scripts/build_market_v2.py
      - name: Commit generated v2 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-events-v2.html commodities-dashboard-v2.html market-mood-v2.html
          git diff --cached --quiet || git commit -m "Update Life Town v2 market widgets"
          git push
