name: Update Stocks Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update-stocks-dashboard.py"
      - ".github/workflows/update-stocks-dashboard.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - run: python scripts/update-stocks-dashboard.py
      - name: Commit data if changed
        run: |
          if git diff --quiet -- stocks-dashboard-data.json; then
            echo "No data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks-dashboard-data.json
          git commit -m "data: update stocks dashboard"
          git push
