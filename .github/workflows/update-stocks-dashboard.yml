name: Update Stocks Dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update-market-radar.py"
      - "scripts/market_data_utils.py"
      - "scripts/update-stocks-dashboard.py"
      - ".github/workflows/update-stocks-dashboard.yml"
permissions:
  contents: write
concurrency:
  group: update-stocks-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - run: python scripts/update-stocks-dashboard.py
      - run: python scripts/update-market-radar.py
      - name: Publish data on current main
        run: >-
          python scripts/publish_widget_data.py --message "data: update stocks and market radar" stocks-dashboard-data.json market-radar-data.json
