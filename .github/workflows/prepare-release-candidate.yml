name: Prepare Site Candidate for Review

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact 40-character commit SHA to test and prepare; never deploys'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-site-candidate-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate the requested commit before checkout
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          python - <<'PY'
          import os, re
          sha = os.environ['REQUESTED_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Use an exact lowercase 40-character commit SHA')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the isolated development tools
        run: bash scripts/setup_dev.sh --state "$RUNNER_TEMP/notion-dev" --install-browser
      - name: Test every required scope at the requested commit
        run: |
          source "$RUNNER_TEMP/notion-dev/activate.sh"
          python scripts/dev_check.py --all --output "$RUNNER_TEMP/release-check"
      - name: Prepare the tested site archive for review
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          source "$RUNNER_TEMP/notion-dev/activate.sh"
          python scripts/prepare_release.py \
            --sha "$REQUESTED_SHA" \
            --report "$RUNNER_TEMP/release-check/report.json" \
            --output "$RUNNER_TEMP/site-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-site-candidate-${{ inputs.sha }}
          path: ${{ runner.temp }}/site-candidate/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-candidate-check-results-${{ inputs.sha }}
          path: ${{ runner.temp }}/release-check/
          if-no-files-found: warn
          retention-days: 7
