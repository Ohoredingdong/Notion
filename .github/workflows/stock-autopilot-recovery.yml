name: Stock Autopilot Bounded Recovery
on:
  workflow_run:
    workflows: ['Stock Prospective Forecasts']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  recover-once:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Retry only allowlisted infrastructure failures once
        uses: actions/github-script@v7
        with:
          script: |
            const {plan}=require('./scripts/stock_autopilot_recovery.cjs');
            const run=context.payload.workflow_run;
            const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,{owner:context.repo.owner,repo:context.repo.repo,run_id:run.id,per_page:100});
            const decision=plan(run,jobs,`${context.repo.owner}/${context.repo.repo}`);
            core.info(JSON.stringify(decision));
            if(decision.retry){
              await github.rest.actions.reRunWorkflowFailedJobs({owner:context.repo.owner,repo:context.repo.repo,run_id:run.id});
              core.info('One infrastructure retry requested; this is not evidence of recovery success.');
            }
