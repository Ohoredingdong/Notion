name: Audit Stock Radar Accuracy
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Stock Prospective Forecasts', 'Update Stock Opportunities', 'Stock Investment Cases', 'Stock Entry Plan', 'Update World Market Flow', 'Stock Official Financial Coverage']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "stock-forecast-learning.json"
      - "stock-direction-forecast.json"
      - "stock-forecast-outcomes.jsonl"
      - "stock-market-context.json"
      - "stock-radar-chart-data.json"
      - "stock-opportunity-summary.json"
      - "stock-investment-cases-summary.json"
      - "stock-entry-plan-summary.json"
      - "stock-world-flow.json"
      - "stock-financial-coverage.json"
      - "stock-extended-direction-forecast.json"
      - "scripts/audit_stock_display_numbers.py"
      - "scripts/test_stock_audit_publication.py"
      - "scripts/test_stock_display_number_audit.py"
      - "scripts/audit_stock_radar_accuracy.py"
      - "scripts/publish_stock_radar_audit.py"
      - "scripts/test_stock_data_pipeline.py"
      - ".github/workflows/audit-stock-radar-accuracy.yml"
  schedule:
    # Local Seoul 09:15 and 17:30 KST; audit only, no trade decisions.
    - cron: "15 0 * * 1-5"
    - cron: "30 8 * * 1-5"
permissions:
  contents: write
  pages: write
concurrency:
  group: stock-radar-independent-accuracy-audit
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify audit source syntax
        run: |
          pip install 'exchange-calendars==4.13.1'
          python -m py_compile scripts/audit_stock_radar_accuracy.py scripts/publish_stock_radar_audit.py
          python -m py_compile scripts/audit_stock_display_numbers.py
          python -m unittest discover -s scripts -p 'test_stock_data_pipeline.py' -v
          PYTHONPATH=scripts python -m unittest scripts.test_stock_audit_publication -v
          python -m unittest scripts.test_stock_display_number_audit -v
      - name: Recompute independent model audit and integrity gates
        run: python scripts/audit_stock_radar_accuracy.py
      - name: Recompute and publish against latest main on every retry
        run: python scripts/publish_stock_radar_audit.py --include-display-numbers
      - name: Publish the source-aligned audit through the existing Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-display-number-audit-evidence
          path: |
            stock-radar-accuracy-audit.json
            stock-display-number-audit.json
          retention-days: 7

