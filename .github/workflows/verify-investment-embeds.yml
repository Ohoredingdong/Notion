name: Verify investment widget embeds
on:
  workflow_dispatch:
    inputs:
      check_public:
        description: 'Read-only comparison of published files against this checkout'
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - 'stock-paper-investing.html'
      - 'property-paper-investing.html'
      - 'assets/investment-labs-20261016/**'
      - 'assets/investment-labs-20261019/**'
      - 'scripts/verify_investment_embeds.py'
      - 'tests/test_investment_embeds.py'
      - '.github/workflows/verify-investment-embeds.yml'
  push:
    branches: [main]
    paths:
      - 'stock-paper-investing.html'
      - 'property-paper-investing.html'
      - 'assets/investment-labs-20261016/**'
      - 'assets/investment-labs-20261019/**'
      - 'scripts/verify_investment_embeds.py'
      - 'tests/test_investment_embeds.py'
      - '.github/workflows/verify-investment-embeds.yml'
permissions:
  contents: read
concurrency:
  group: investment-embeds-verify
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test source and public-response validation
        run: python -m unittest discover -s tests -p 'test_investment_embeds.py' -v
      - name: Verify candidate files, references and JavaScript syntax
        run: python scripts/verify_investment_embeds.py
      - name: Explicit read-only public comparison
        if: github.event_name == 'workflow_dispatch' && inputs.check_public
        run: python scripts/verify_investment_embeds.py --public-base https://ohoredingdong.github.io/Notion/
