name: Verify investment widget embeds
on:
  workflow_dispatch:
  push:
    paths:
      - 'stock-paper-investing.html'
      - 'property-paper-investing.html'
      - 'assets/investment-labs-20261016/**'
      - 'assets/investment-labs-20261019/**'
      - '.github/workflows/verify-investment-embeds.yml'
permissions:
  contents: read
concurrency:
  group: investment-embeds-verify
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify published v2 files, syntax and iframe headers
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, time, urllib.request, tempfile, subprocess, pathlib
          base = 'https://ohoredingdong.github.io/Notion/'
          expected = {
              'stock-paper-investing.html': '5e6afaba39679e67ace90e2c09be5aac582ffed750a8bec26fa15e96522d3b14',
              'property-paper-investing.html': '9a8944d8706e1ea1de95968d2ea77d198906263877987008869ec85ed206a274',
              'assets/investment-labs-20261016/common.js': '2cc34ff9ae1f466edf4f149f4dec7f7c1e6beddd323386e8250a9e52199c5304',
              'assets/investment-labs-20261016/lab.css': '8c37f79943771a27c3bbb6040a6b27070f7f17c2eaaddc2d53ec2a7e6bbb2d2c',
              'assets/investment-labs-20261016/stock.js': 'b94da928241d656d58c29dec534dc84ff251e4b2af0ce7c7331957ec69baf567',
              'assets/investment-labs-20261016/property.js': 'd06379d93e56964327f3ad479804be1f246d5212ada8d9813dd927b224a20358',
              'assets/investment-labs-20261019/curriculum.js': '2b2a32d37e281ce7b31279db444801d5302c761c41ed6041844c8e5b3299b57e',
              'assets/investment-labs-20261019/trainer.js': 'e640294a55ca4269720fd8b3d6388746a6c442007378e759d84717b7e7b99c44',
              'assets/investment-labs-20261019/trainer.css': '317b95558c1f15389e42659c57889c20b4d3ab17f3b71c087404c6b2c67ad98c',
          }
          with tempfile.TemporaryDirectory() as tmp:
              for path, digest in expected.items():
                  for attempt in range(16):
                      try:
                          request = urllib.request.Request(base + path + '?verify=v2-' + str(int(time.time())), headers={'User-Agent': 'Investment-Widget-Deployment-Check/2.0'})
                          with urllib.request.urlopen(request, timeout=12) as response:
                              data = response.read()
                              assert response.status == 200, response.status
                              assert hashlib.sha256(data).hexdigest() == digest, 'Deployed file differs from tested source'
                              if path.endswith('.html'):
                                  assert response.headers.get_content_type() == 'text/html'
                                  assert response.headers.get('X-Frame-Options', '').upper() not in ('DENY', 'SAMEORIGIN')
                                  csp = response.headers.get('Content-Security-Policy', '').lower()
                                  assert "frame-ancestors 'none'" not in csp
                                  assert "frame-ancestors 'self'" not in csp
                                  assert b'investment-labs-20261019/trainer.js' in data
                              if path.endswith('.js'):
                                  target = pathlib.Path(tmp) / path.rsplit('/', 1)[-1]
                                  target.write_bytes(data)
                                  subprocess.run(['node', '--check', str(target)], check=True)
                              print('PASS', path, 'HTTP 200', len(data), 'bytes', 'sha256=' + digest, flush=True)
                          break
                      except Exception as error:
                          if attempt == 15:
                              raise
                          print('Retry', path, str(error), flush=True)
                          time.sleep(5)
          print('All nine published files match the locally tested source. Both HTML pages pass iframe header checks. Live Notion UI has not been tested.', flush=True)
          PY
