name: Verify Stock Value Radar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "stock-value-radar.html"
      - "assets/stock-radar-clean-bridge.js"
      - "assets/stock-radar-flow-v2.js"
      - "scripts/update-news-link-hub.py"
      - "scripts/build-stock-investment-intelligence.py"
      - "scripts/monitor-stock-value-radar.py"
      - "scripts/update-stock-value-radar.py"
      - ".github/workflows/verify-stock-value-radar.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax and data quality unit checks
        run: |
          python -m py_compile scripts/update-stock-value-radar.py scripts/build-stock-investment-intelligence.py scripts/monitor-stock-value-radar.py
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          def module(file):
            spec=importlib.util.spec_from_file_location("module",file)
            mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod);return mod
          m=module("scripts/build-stock-investment-intelligence.py")
          data=json.loads(Path("stock-value-radar-data.json").read_text())
          assert len(data["rows"])>=5
          test=dict(data["rows"][0])
          test["revenue"]=-100
          assert m.validate(test,None)["status"]=="error"
          test["revenue"]=100
          test["price"]=-1
          assert m.validate(test,None)["status"]=="error"
          assert m.scenarios({"price":100,"eps":-1,"annual_per":10}) is None
          assert m.rank({"revenue_growth":None,"operating_margin":20})["score"] is None
          print("PASS data validation and negative test cases")
          PY
      - name: Verify deployed V5 UI, data provenance and script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          html=Path("stock-value-radar.html").read_text(encoding="utf-8")
          bridge=Path("assets/stock-radar-clean-bridge.js").read_text(encoding="utf-8")
          flow=Path("assets/stock-radar-flow-v2.js").read_text(encoding="utf-8")
          rss=Path("scripts/update-news-link-hub.py").read_text(encoding="utf-8")
          sources=re.findall(r'<script(?:\s+defer)?\s+src="([^"]+)"',html)
          assert len(sources)==len(set(x.split("?")[0] for x in sources)), "duplicate runtime scripts"
          for name in ("stock-radar-clean-bridge.js","stock-radar-flow-v2.js"):
              assert sum(name in x for x in sources)==1, name
          for required in ('id="nr-home-content"','id="view-home"','class="fx-root"','v9: one isolated fear/greed component'):
              assert required in html, required
          assert "function fxHome(ctx)" in flow and 'fx-v5-markets nr-market-grid' in flow
          assert "function fxV5StockNews(ctx,c)" in flow and 'ctx.data?.newsLink' in flow
          assert 'newsLink:"news-link-data.json"' in bridge
          assert "function policyDigest()" in bridge and "function autoRefreshIfDue()" in bridge
          assert "실시간 호가 아님" in bridge
          assert "politics_policy" in rss and "midterms" in rss
          data=json.loads(Path("news-link-data.json").read_text(encoding="utf-8"))
          assert isinstance(data.get("items"),list) and data.get("generated_at")
          for x in data["items"][:20]:
              assert x.get("url","").startswith("https://")
              assert x.get("source") and x.get("published_at")
          print("V5 radar current UI, policy data, time metadata, 5-minute refresh PASS")
          PY
          node --check assets/stock-radar-clean-bridge.js
          node --check assets/stock-radar-flow-v2.js
          python -m py_compile scripts/update-news-link-hub.py
          echo "Updated radar script syntax PASS"
