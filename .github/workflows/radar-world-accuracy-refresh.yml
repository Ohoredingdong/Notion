name: Refresh Radar Numerical Evidence
on:
  workflow_dispatch:
  push:
    branches: [feat/radar-world-flow-20261106]
    paths: ['.github/radar-number-refresh-request.json']
permissions:
  contents: write
concurrency:
  group: radar-numerical-refresh-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the explicitly requested preview refresh
        run: |
          python - <<'PY'
          import json,os
          request=json.load(open('.github/radar-number-refresh-request.json'))
          assert request['branch'] == os.environ['GITHUB_REF_NAME'] == 'feat/radar-world-flow-20261106'
          assert request['operation'] == 'refresh-and-audit-radar-numbers'
          PY
      - name: Install source readers and exchange calendars
        run: pip install 'yfinance==0.2.66' 'exchange-calendars==4.13.1' 'beautifulsoup4==4.14.3' 'requests>=2.32,<3'
      - name: Check original and new numerical source gates
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest discover -s scripts -p 'test_stock_data_pipeline.py' -v
          PYTHONPATH=scripts python -m unittest scripts.test_market_context scripts.test_stock_world_flow scripts.test_stock_price_evidence -v
          PYTHONPATH=scripts python -m unittest scripts.test_stock_audit_publication -v
          python -m unittest scripts.test_stock_display_number_audit -v
          python scripts/test_stock_opportunities.py
          python scripts/test_stock_opportunity_filings.py
          python scripts/test_stock_opportunity_dates.py
          python scripts/test_stock_discovery_v9.py
          python scripts/test_stock_investment_cases.py
          python scripts/test_stock_strict_green.py
          python -m unittest scripts.test_stock_recommendations -v
          python scripts/verify_stock_canonical_pipeline.py
      - name: Withhold inconsistent official accounts without changing their reported basis
        run: |
          python -m scripts.build_stock_financial_coverage --repair-existing
          python -m scripts.validate_stock_financial_coverage
      - name: Collect the actual completed-session company snapshot and charts
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python scripts/run_stock_research_v9.py
          python scripts/finalize_stock_opportunities.py
          python scripts/validate_stock_opportunity_dates.py
          python scripts/curate_stock_decisions_v9.py
          python scripts/build_stock_radar_chart_cache.py
      - name: Refresh market observations and sourced news
        run: |
          python scripts/run_market_context.py
          python scripts/update-news-link-hub.py
          python scripts/update-market-events.py
          python scripts/build_stock_event_outlook.py
          python scripts/build_stock_world_flow.py --output stock-world-flow.json --news news-link-data.json --request-delay 0.75 --timeout 20 --max-seconds 240
          PYTHONPATH=scripts python - <<'PY'
          import update_fear_greed as us
          import update_korea_fear_greed as kr
          us.safe_update('fear-greed-data.json',us.us)
          try:
              kr.run()
          except Exception as exc:
              print('KOREAN_SENTIMENT_SOURCE_UNAVAILABLE',type(exc).__name__,'existing observation date preserved')
          PY
      - name: Rebuild all price-bound research and entry displays
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python scripts/build_stock_investment_cases.py
          python scripts/check_stock_investment_cases.py
          python scripts/stock_reading_depth.py
          python scripts/stock_strict_green.py
          python scripts/build_stock_decision_guide.py
          python scripts/update_stock_event_risks.py
          python scripts/build_stock_recommendations.py
          python scripts/build_stock_entry_plan.py
      - name: Independently recalculate published values and coverage
        run: |
          python scripts/audit_stock_display_numbers.py --check
          python scripts/audit_stock_radar_accuracy.py --check
          python scripts/monitor-stock-value-radar.py
      - name: Publish the coherent corrected bundle to the preview branch
        run: >-
          python scripts/publish_widget_data.py --branch "$GITHUB_REF_NAME"
          --message 'data: refresh and audit source-aligned radar display numbers'
          --append-ledger stock-entry-ledger.jsonl
          stock-opportunity-data.json stock-opportunity-summary.json
          stock-opportunity-tests.json stock-opportunity-filing-tests.json
          stock-opportunity-date-tests.json stock-opportunity-extension-audit.json
          stock-opportunity-discovery.json stock-opportunity-discovery-tests.json
          stock-radar-chart-data.json stock-market-context.json news-link-data.json
          market-events-data.json stock-event-outlook.json stock-world-flow.json
          fear-greed-data.json stock-korea-fear-greed.json
          stock-investment-cases.json stock-investment-cases-summary.json
          stock-reading-depth.json stock-reading-depth-summary.json
          stock-green-review.json stock-green-review-summary.json stock-green-tests.json
          stock-decision-guide.json stock-decision-guide-summary.json
          stock-event-risks.json stock-recommendations.json stock-recommendations-summary.json
          stock-entry-plan.json stock-entry-plan-summary.json
          stock-financial-coverage.json data-quarantine/stock-financial-accounts.json
          stock-display-number-audit.json stock-radar-accuracy-audit.json stock-radar-health.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-corrected-number-evidence
          retention-days: 14
          path: |
            stock-display-number-audit.json
            stock-radar-accuracy-audit.json
            stock-radar-health.json
            stock-opportunity-*.json
            stock-radar-chart-data.json
            stock-market-context.json
            stock-world-flow.json
            fear-greed-data.json
            stock-korea-fear-greed.json
            stock-investment-cases*.json
            stock-reading-depth*.json
            stock-green-*.json
            stock-decision-guide*.json
            stock-recommendations*.json
            stock-entry-plan*.json
            stock-financial-coverage.json
            data-quarantine/stock-financial-accounts.json
