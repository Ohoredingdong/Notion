name: Research-only forecast schedule launch coverage
on:
  push:
    branches: [research/timing-forecast-schedule-gap-20261104]
    paths:
      - 'scripts/audit_stock_schedule_coverage.py'
      - 'scripts/test_stock_schedule_coverage.py'
      - 'docs/experiments/timing-forecast-schedule-gap-20261104.md'
      - '.github/workflows/research-forecast-schedule-gap.yml'
permissions:
  contents: read
  actions: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic scheduled-launch negative controls
        run: PYTHONPATH=scripts python -m unittest scripts/test_stock_schedule_coverage.py -v
      - name: Fixed UTC public Actions metadata snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/audit_stock_schedule_coverage.py --as-of 2026-11-03T15:30:00Z --window-start 2026-11-03T12:30:00Z --grace 30 --output forecast-schedule-gap-research.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forecast-schedule-gap-readonly
          retention-days: 7
          path: forecast-schedule-gap-research.json
