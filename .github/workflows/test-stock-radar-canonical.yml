name: Verify Canonical Stock Radar Layout
on:
  pull_request:
    branches: [main]
    paths:
      - 'stock-radar-dashboard.html'
      - 'stock-value-radar.html'
      - 'assets/stock-radar-flow-v2.js'
      - 'assets/stock-radar-clean-bridge.js'
      - 'scripts/test_stock_radar_canonical_browser.py'
      - '.github/workflows/test-stock-radar-canonical.yml'
  push:
    branches: [main]
    paths:
      - 'stock-radar-dashboard.html'
      - 'stock-value-radar.html'
      - 'scripts/test_stock_radar_canonical_browser.py'
      - '.github/workflows/test-stock-radar-canonical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Verify current layout, interactions and data preservation
        run: python scripts/test_stock_radar_canonical_browser.py --output /tmp/radar-canonical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-radar-browser-${{ github.run_id }}
          path: /tmp/radar-canonical/
          if-no-files-found: error
          retention-days: 14
