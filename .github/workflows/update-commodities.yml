name: Update commodities data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'commodities-matrix.html'
      - 'scripts/update_commodities.py'
      - '.github/workflows/update-commodities.yml'
permissions:
  contents: write
concurrency:
  group: update-commodities-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update data
        run: python scripts/update_commodities.py
      - name: Publish data on current main
        run: >-
          python scripts/publish_widget_data.py --message "data: update commodities" commodities-data.json
