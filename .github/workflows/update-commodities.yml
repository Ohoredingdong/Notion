name: Update commodities data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'commodities-matrix.html'
      - 'scripts/update_commodities.py'
      - '.github/workflows/update-commodities.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update data
        run: python scripts/update_commodities.py
      - name: Commit data
        run: |
          if git diff --quiet -- commodities-data.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add commodities-data.json
          git commit -m 'chore: update commodities data'
          git push
