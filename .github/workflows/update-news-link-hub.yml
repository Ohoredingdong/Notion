name: Update News Link Hub
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update-news-link-hub.py"
      - ".github/workflows/update-news-link-hub.yml"
  schedule:
    - cron: "7,37 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update-news-link-hub.py
      - name: Commit data if changed
        run: |
          if git diff --quiet -- news-link-data.json; then
            echo "No data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-link-data.json
          git commit -m "data: update news link hub"
          git push
