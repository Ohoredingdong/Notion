name: Update News Link Hub
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update-news-link-hub.py"
      - ".github/workflows/update-news-link-hub.yml"
  schedule:
    # About every 15 minutes; GitHub Actions schedules may be delayed.
    - cron: "7,22,37,52 * * * *"
permissions:
  contents: write
concurrency:
  group: update-news-link-hub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update-news-link-hub.py
      - name: Publish data on current main
        run: >-
          python scripts/publish_widget_data.py --message "data: update news link hub" news-link-data.json
