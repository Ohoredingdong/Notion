name: Research-only bounded public verification lag
on:
  push:
    branches: [research/timing-public-verify-lag-20261103]
    paths:
      - 'scripts/verify_stock_forecast_public.py'
      - 'scripts/test_stock_public_verification.py'
      - 'docs/experiments/stock-public-verification-lag-20261103.md'
      - '.github/workflows/research-stock-public-verifier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-verifier-research:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded public-evidence synthetic regression, RED or GREEN
        run: python -m unittest discover -s scripts -p 'test_stock_public_verification.py' -v
      - name: Independent arithmetic and timing acceptance regression
        if: success()
        run: |
          python scripts/audit_stock_forecast_independent.py --self-test
          python scripts/audit_stock_forecast_independent.py
          python scripts/audit_stock_timing_acceptance_guard.py
      - name: Install read-only verifier dependencies
        if: success()
        run: pip install 'scikit-learn==1.8.0' 'numpy>=2,<3' 'pandas>=2.2,<3' 'scipy>=1.11,<2'
      - name: Compare exact PUBLIC forecast JSON and JS, without writing delivery proof
        if: success()
        run: python scripts/verify_stock_forecast_public.py --probe-only
