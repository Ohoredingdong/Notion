name: Research-only Independent Learning Evidence Gate
on:
  push:
    branches: [research/timing-learning-evidence-20261030]
    paths:
      - 'scripts/audit_stock_learning_evidence.py'
      - '.github/workflows/research-learning-evidence-20261030.yml'
      - 'docs/experiments/timing-learning-event-audit-20261030.md'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify producer-independent synthetic red/green fixtures
        run: |
          python scripts/audit_stock_forecast_independent.py --self-test
          python scripts/audit_stock_learning_evidence.py --self-test
      - name: Regression-test unchanged forecast and bounded controller
        run: |
          pip install 'yfinance==0.2.66' 'exchange-calendars==4.13.1' 'scikit-learn==1.8.0' 'numpy>=2,<3' 'pandas>=2.2,<3' 'scipy>=1.11,<2'
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_stock_forecasts.py'
          PYTHONPATH=scripts python -m unittest test_stock_forecast_learning test_stock_forecast_learning_display test_stock_forecast_directions test_stock_autopilot
          python scripts/stock_forecast_sources.py
      - name: Verify frozen actual learning history read-only
        run: |
          python scripts/audit_stock_forecast_independent.py --cutoff 2026-10-29T17:40:00Z
          python scripts/audit_stock_learning_evidence.py --cutoff 2026-10-29T17:40:00Z
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('stock-forecast-independent-audit.json').read_text())
          b=json.loads(Path('stock-forecast-learning-evidence.json').read_text())
          assert a['prediction_rows']==53 and a['scored']==6 and a['correct']==3
          assert a['outcome_rows_verified']==21 and not a['errors']
          assert b['status']=='learning_evidence_consistent'
          assert b['learning_event_rows']==6 and b['learning_updates_recorded']==6
          assert b['frozen_scored_results']==a['scored']
          print('PINNED_RESEARCH_EVIDENCE_INTEGRITY_VERIFIED')
          PY
      - name: Verify no source records or model settings changed
        run: |
          git diff --exit-code -- stock-forecast-ledger.jsonl stock-forecast-outcomes.jsonl stock-forecast-deliveries.jsonl stock-forecast-learning-state.json stock-forecast-learning-events.jsonl stock-forecast-autopilot.json stock-forecast-source-state.json stock-direction-forecast.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-independent-learning-evidence
          retention-days: 7
          path: |
            stock-forecast-independent-audit.json
            stock-forecast-learning-evidence.json
