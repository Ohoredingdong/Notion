name: Verify implemented kitchen full-flow HTTPS previews
on:
  push:
    branches: [delivery/verify-kitchen-fullflow-implementation-20261104]
    paths:
      - '.github/workflows/verify-kitchen-fullflow-implementation.yml'
      - 'scripts/verify_kitchen_fullflow_public.py'
permissions:
  contents: write
concurrency:
  group: kitchen-fullflow-implementation-verification-20261104
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Install browser driver
        run: python -m pip install 'playwright==1.56.0'
      - name: Verify six actual HTTPS app/widget profiles
        run: python scripts/verify_kitchen_fullflow_public.py --source e982abf6062a28938a40a47c90e3f80b99dbc95e --publish-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitchen-fidelity-public-browser
          path: /tmp/kitchen-fullflow-implementation-public/
          retention-days: 3
