name: Research-only KR closing-auction timing preflight
on:
  push:
    branches:
      - research/timing-kr-auction-preflight-20261103
    paths:
      - scripts/stock_forecast_model.py
      - scripts/test_stock_forecasts.py
      - docs/experiments/timing-kr-auction-preflight-20261103.md
      - .github/workflows/research-timing-kr-auction-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-auction-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing pinned research dependencies
        run: pip install 'yfinance==0.2.66' 'exchange-calendars==4.13.1' 'scikit-learn==1.8.0' 'numpy>=2,<3' 'pandas>=2.2,<3' 'scipy>=1.11,<2'
      - name: Assert frozen-calendar preflight and original forecast regression
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_stock_forecasts.py' -v
      - name: Retest directional, autonomous and learning behavior
        run: |
          PYTHONPATH=scripts python -m unittest test_stock_forecast_learning test_stock_forecast_directions test_stock_autopilot -v
      - name: Independent audit with adversarial controls and pinned data
        run: |
          python scripts/audit_stock_forecast_independent.py --self-test
          python scripts/audit_stock_forecast_independent.py
          PYTHONPATH=scripts python -m unittest test_stock_timing_acceptance_guard -v
          python scripts/audit_stock_timing_acceptance_guard.py
      - name: Verify no public/source artifacts changed by test
        run: git diff --exit-code -- stock-forecast-ledger.jsonl stock-forecast-outcomes.jsonl stock-forecast-learning-state.json stock-forecast-learning-events.jsonl stock-forecast-deliveries.jsonl
