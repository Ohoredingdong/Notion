name: Verify kitchen storyboard widget previews
on:
  push:
    branches: [delivery/verify-kitchen-storyboard-apply-20261102]
    paths:
      - '.github/workflows/verify-kitchen-storyboard-apply-preview.yml'
      - 'scripts/verify_kitchen_storyboard_apply_public.py'
      - 'scripts/fixtures/kitchen-flow-ocr/**'
permissions:
  contents: write
concurrency:
  group: kitchen-storyboard-apply-public-verification
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Install browser driver
        run: python -m pip install 'playwright==1.56.0'
      - name: Verify real HTTPS app and widget at desktop, phone and small-phone sizes
        run: python scripts/verify_kitchen_storyboard_apply_public.py --source 3faf53841239e812a62ad8ca5091f3638bc54c41 --publish-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitchen-storyboard-apply-public-browser
          path: /tmp/kitchen-storyboard-apply-public/
          retention-days: 3
