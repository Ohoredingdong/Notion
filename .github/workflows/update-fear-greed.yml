name: Update Fear Greed Data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'fear-greed-dashboard.html'
      - 'scripts/update_fear_greed.py'
      - '.github/workflows/update-fear-greed.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch CNN Fear & Greed data
        run: python scripts/update_fear_greed.py
      - name: Commit data if changed
        run: |
          if git diff --quiet -- fear-greed-data.json && git ls-files --error-unmatch fear-greed-data.json >/dev/null 2>&1; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- fear-greed-data.json
          git commit -m "chore: update fear greed data"
          git push
