name: Update Market Sentiment Data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'fear-greed-dashboard-v3.html'
      - 'market-mood-v3.html'
      - 'scripts/update_fear_greed.py'
      - 'scripts/market_data_utils.py'
      - '.github/workflows/update-fear-greed.yml'

permissions:
  contents: write

concurrency:
  group: update-fear-greed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install curl_cffi
      - name: Fetch US Korea Crypto sentiment data
        run: python scripts/update_fear_greed.py
      - name: Publish data on current main
        run: >-
          python scripts/publish_widget_data.py --message "data: update market sentiment" fear-greed-data.json korea-market-sentiment.json crypto-fear-greed-data.json
