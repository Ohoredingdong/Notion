<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Daily English Word</title>
<style>
:root{--panel:#fff;--text:#171717;--sub:#737373;--muted:#a3a3a3;--line:#e7e5e4;--soft:#f7f7f5}html[data-theme="dark"]{--panel:#20201f;--text:#f2f2ef;--sub:#b8b8b2;--muted:#8b8b85;--line:#343432;--soft:#272725}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:0;color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}button,select{font:inherit;color:inherit}.widget{width:min(100%,360px);margin:0 auto;background:var(--panel);border:1px solid var(--line);padding:12px 14px 9px;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.label{font-size:7px;font-weight:700;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}.navs{display:flex;gap:4px}.nav{width:18px;height:18px;padding:0;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}.wordrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.word{font-family:Georgia,"Times New Roman",serif;font-size:24px;line-height:1;font-weight:700;letter-spacing:-.035em}.speaker{width:24px;height:24px;border:0;border-radius:8px;background:var(--soft);color:var(--sub);display:grid;place-items:center;cursor:pointer}.speaker svg,.mini svg{width:11px;height:11px}.ipa{margin-top:4px;font-size:8px;color:var(--muted)}.meaning{margin-top:9px;font-size:11px;font-weight:700;line-height:1.45}.nuance{margin-top:3px;font-size:8.5px;color:var(--sub);line-height:1.45;min-height:12px}.divider{height:1px;background:var(--line);margin:9px 0 7px}.examples{display:grid;gap:7px}.example{position:relative;padding-right:18px}.en{font-size:8.8px;line-height:1.4;font-weight:700}.ko{margin-top:1px;font-size:8px;line-height:1.4;color:var(--sub)}.mini{position:absolute;right:0;top:0;width:17px;height:17px;border:0;background:transparent;color:var(--muted);padding:0;display:grid;place-items:center;cursor:pointer}.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}.status{font-size:7px;color:var(--muted)}.select{max-width:125px;border:0;background:transparent;outline:0;color:var(--muted);font-size:8px;text-align:right}.loading{opacity:.55}
</style></head><body><main class="widget" id="widget"><div class="top"><div class="label">Word of the day</div><div class="navs"><button class="nav" id="prev">‹</button><button class="nav" id="next">›</button></div></div><div class="wordrow"><div><div class="word" id="word">loading</div><div class="ipa" id="ipa">—</div></div><button class="speaker" id="speak" aria-label="발음 듣기"><svg viewBox="0 0 24 24" fill="none"><path d="M5 9.5v5h3l4 3.5V6L8 9.5H5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 9c1.2 1.1 1.2 4.9 0 6M17.8 6.8c2.4 2.5 2.4 7.9 0 10.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div><div class="meaning" id="meaning">단어 정보를 불러오는 중…</div><div class="nuance" id="nuance"></div><div class="divider"></div><section class="examples" id="examples"></section><div class="footer"><div class="status" id="status">100 words · auto</div><select class="select" id="select"></select></div></main>
<script>
const WORD_LIST=["reckon","keen","plausible","worthwhile","subtle","concise","allocate","resilient","fancy","viable","refine","overlook","notion","tentative","disrupt","coherent","prompt","scope","offset","versatile","compelling","steady","clarify","retain","assess","attain","bolster","cautious","derive","distinguish","elaborate","enhance","grasp","highlight","hinder","imply","incentive","justify","maintain","obtain","persistent","prioritise","rational","relevant","reliable","scrutinise","significant","substantial","transparent","trigger","underlying","yield","adapt","anticipate","coordinate","alleviate","ambiguous","articulate","benchmark","coincide","compromise","constraint","credible","deliberate","diminish","efficient","facilitate","feasible","fluctuate","foster","implement","inevitable","mitigate","nuanced","optimise","perceive","pragmatic","prevalent","reinforce","reluctant","robust","scarce","streamline","sustain","tangible","thorough","undertake","validate","advocate","adverse","aggregate","arbitrary","broaden","calibrate","contextualise","deteriorate","diversify","emerge","emphasise","encounter"];
const qs=new URLSearchParams(location.search),theme=qs.get('theme');document.documentElement.dataset.theme=theme==='dark'||theme==='light'?theme:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');const $=s=>document.querySelector(s);let index=0,current=null;const icon=`<svg viewBox="0 0 24 24" fill="none"><path d="M5 9.5v5h3l4 3.5V6L8 9.5H5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 9c1.2 1.1 1.2 4.9 0 6M17.8 6.8c2.4 2.5 2.4 7.9 0 10.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`;
function todayIndex(){const d=new Date(),base=Date.UTC(2026,0,1),now=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());return Math.abs(Math.floor((now-base)/86400000))%WORD_LIST.length}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.92;const v=speechSynthesis.getVoices().find(x=>/en-GB/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}async function getjson(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status);return r.json()}async function translate(text){if(!text)return'';try{const d=await getjson('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,450))+'&langpair=en%7Cko');return d?.responseData?.translatedText||''}catch{return''}}async function dictionary(word){const d=await getjson('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word));const e=d[0]||{},m=(e.meanings||[])[0]||{},def=(m.definitions||[])[0]||{},ph=(e.phonetics||[]).find(x=>x.text&&/gb|uk/i.test(x.audio||''))||(e.phonetics||[]).find(x=>x.text)||{};return{ipa:ph.text||e.phonetic||'',definition:def.definition||'',example:def.example||'',pos:m.partOfSpeech||''}}function kor(trs){for(const t of(trs||[]))if(t?.lang==='kor'&&t.text)return t.text;return''}async function tatoeba(word){try{const p=new URLSearchParams();p.set('lang','eng');p.set('q','='+word);p.set('trans:lang','kor');p.set('sort','relevance');p.set('limit','8');const d=await getjson('https://api.tatoeba.org/v1/sentences?'+p.toString());return(d.data||[]).slice(0,4).map(x=>[x.text,kor(x.translations)])}catch{return[]}}async function loadWord(word){const key='ew3:'+word;try{const c=JSON.parse(localStorage.getItem(key)||'null');if(c&&Date.now()-c.ts<1209600000)return c.data}catch{}let dict={ipa:'',definition:'',example:'',pos:''},examples=[];try{[dict,examples]=await Promise.all([dictionary(word),tatoeba(word)])}catch{try{dict=await dictionary(word)}catch{}}const meaning=await translate(dict.definition);if(examples.length<4&&dict.example)examples.push([dict.example,'']);for(let i=0;i<examples.length;i++)if(!examples[i][1])examples[i][1]=await translate(examples[i][0]);const data={word,ipa:dict.ipa,meaning:meaning||dict.definition,nuance:dict.pos?(dict.pos+' · '+dict.definition):dict.definition,examples:examples.slice(0,4)};try{localStorage.setItem(key,JSON.stringify({ts:Date.now(),data}))}catch{}return data}async function render(){const w=WORD_LIST[index];$('#widget').classList.add('loading');$('#select').value=String(index);$('#word').textContent=w;$('#ipa').textContent='—';$('#meaning').textContent='단어 정보를 불러오는 중…';$('#nuance').textContent='';$('#examples').innerHTML='';try{current=await loadWord(w);$('#word').textContent=current.word;$('#ipa').textContent=current.ipa||'';$('#meaning').textContent=current.meaning||'뜻 정보를 불러오지 못했습니다.';$('#nuance').textContent=current.nuance||'';$('#examples').innerHTML=current.examples.length?current.examples.map((x,i)=>`<div class="example"><div class="en">${esc(x[0])}</div><div class="ko">${esc(x[1])}</div><button class="mini" data-i="${i}">${icon}</button></div>`).join(''):'<div class="ko">예문을 불러오지 못했습니다.</div>';document.querySelectorAll('.mini').forEach(b=>b.onclick=()=>say(current.examples[+b.dataset.i][0]));$('#status').textContent=WORD_LIST.length+' words · live data'}catch{$('#meaning').textContent='잠시 후 다시 불러와 주세요.';$('#status').textContent='API retry'}finally{$('#widget').classList.remove('loading')}}$('#select').innerHTML=WORD_LIST.map((w,i)=>`<option value="${i}">${w}</option>`).join('');index=todayIndex();render();$('#prev').onclick=()=>{index=(index-1+WORD_LIST.length)%WORD_LIST.length;render()};$('#next').onclick=()=>{index=(index+1)%WORD_LIST.length;render()};$('#select').onchange=e=>{index=+e.target.value;render()};$('#speak').onclick=()=>say(current?.word||WORD_LIST[index]);
</script></body></html>
