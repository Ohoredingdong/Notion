<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Daily English Word</title>
<style>
:root{
  --bg:#f7f7f5;
  --panel:#ffffff;
  --text:#232321;
  --sub:#676762;
  --muted:#9a9993;
  --line:#e8e7e2;
  --soft:#f6f6f3;
  --accent:#687b91;
  --accent-soft:#edf1f5;
  --accent-deep:#46566a;
  --shadow:0 10px 30px rgba(30,31,28,.035), 0 1px 2px rgba(30,31,28,.025);
}
html[data-theme="dark"]{
  --bg:#191918;
  --panel:#20201f;
  --text:#efefec;
  --sub:#b9b9b4;
  --muted:#8e8f8a;
  --line:#31312f;
  --soft:#252523;
  --accent:#9cafc6;
  --accent-soft:#2a3037;
  --accent-deep:#c6d2df;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{
  padding:8px;
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,select{font:inherit;color:inherit}
.widget{
  width:min(100%,760px);
  margin:0 auto;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.header{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 20px 14px;
}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.title{font-size:19px;font-weight:760;letter-spacing:-.035em;margin-top:3px}
.date{font-size:10px;color:var(--muted);white-space:nowrap}
.controls{
  display:grid;grid-template-columns:1fr auto auto;gap:8px;
  padding:0 20px 15px;
}
.select{
  height:38px;border:1px solid var(--line);background:var(--soft);border-radius:10px;
  padding:0 12px;outline:none;font-size:11px;font-weight:650;
}
.nav{
  width:38px;height:38px;border:1px solid var(--line);background:var(--panel);
  border-radius:10px;display:grid;place-items:center;cursor:pointer;
  font-size:18px;color:var(--sub);transition:.16s ease;
}
.nav:hover{background:var(--soft);color:var(--text)}
.hero{
  margin:0 20px;
  border:1px solid var(--line);
  border-radius:15px;
  background:linear-gradient(180deg,var(--panel),var(--soft));
  padding:18px 18px 16px;
}
.word-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.word{font-size:35px;line-height:1;font-weight:800;letter-spacing:-.055em}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{
  display:inline-flex;align-items:center;height:23px;padding:0 8px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent-deep);font-size:9.5px;font-weight:720;
}
.speak{
  width:35px;height:35px;border:1px solid var(--line);background:var(--panel);border-radius:10px;
  display:grid;place-items:center;cursor:pointer;color:var(--accent-deep);flex:0 0 auto;
}
.speak svg{width:16px;height:16px}
.ipa{font-size:12px;color:var(--sub);margin-top:10px}
.meaning{font-size:16px;font-weight:720;margin-top:13px;letter-spacing:-.025em}
.nuance{font-size:11.5px;line-height:1.65;color:var(--sub);margin-top:6px}
.meta-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 20px 0;
}
.meta{
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--panel);
}
.meta-k{font-size:9px;font-weight:750;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.meta-v{font-size:11px;line-height:1.5;margin-top:4px;font-weight:620}
.section{padding:17px 20px 4px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.section-title{font-size:12px;font-weight:760;letter-spacing:-.02em}
.section-note{font-size:9.5px;color:var(--muted)}
.examples{display:grid;gap:8px}
.example{
  display:grid;grid-template-columns:25px 1fr auto;gap:9px;align-items:start;
  border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 9px;background:var(--panel);
}
.num{
  width:25px;height:25px;border-radius:8px;background:var(--accent-soft);
  color:var(--accent-deep);display:grid;place-items:center;font-size:9.5px;font-weight:800;
}
.en{font-size:11.5px;font-weight:650;line-height:1.5}
.ko{font-size:10px;color:var(--sub);line-height:1.5;margin-top:3px}
.mini-speak{
  width:28px;height:28px;border:0;background:transparent;border-radius:8px;
  display:grid;place-items:center;cursor:pointer;color:var(--muted)
}
.mini-speak:hover{background:var(--soft);color:var(--text)}
.mini-speak svg{width:14px;height:14px}
.example.extra{display:none}
.examples.expanded .example.extra{display:grid}
.more{
  width:100%;height:36px;margin-top:8px;border:1px dashed var(--line);border-radius:10px;
  background:var(--soft);cursor:pointer;font-size:10px;font-weight:700;color:var(--sub)
}
.footer{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 20px 18px;color:var(--muted);font-size:9px;
}
.progress{display:flex;align-items:center;gap:7px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--line)}
.dot.active{background:var(--accent)}
@media(max-width:520px){
  body{padding:4px}.widget{border-radius:14px}.header{padding:15px 14px 12px}
  .controls{padding:0 14px 12px}.hero{margin:0 14px;padding:15px}
  .word{font-size:30px}.meta-grid{margin:8px 14px 0;grid-template-columns:1fr}
  .section{padding:14px 14px 4px}.footer{padding:13px 14px 15px}
  .date{display:none}
}
</style>
</head>

    <div class="ipa" id="ipa">—</div>
    <div class="meaning" id="meaning">—</div>

  </section>

  <div class="meta-grid">
    <div class="meta">
      <div class="meta-k">Common pairing</div>
      <div class="meta-v" id="collocations">—</div>

    <div class="meta">

  <section class="section">
    <div class="section-head">
      <div class="section-title">예문</div>
      <div class="section-note">문맥이 다른 예문 4개</div>
    </div>
    <div class="examples" id="examples"></div>
    <button class="more" id="moreBtn">예문 2개 더 보기</button>
  </section>

  <footer class="footer">
    <div>날짜에 따라 오늘의 단어가 자동 선택됩니다.</div>
    <div class="progress" id="progress"></div>
  </footer>
</main>

const qs = new URLSearchParams(location.search);
const theme = qs.get("theme");
document.documentElement.dataset.theme = theme==="dark" || theme==="light"
  ? theme
  : (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");

const $ = s => document.querySelector(s);
const els = {
  select:$("#wordSelect"), prev:$("#prevBtn"), next:$("#nextBtn"),
  word:$("#word"), pos:$("#pos"), level:$("#level"), category:$("#category"),
  ipa:$("#ipa"), meaning:$("#meaning"), nuance:$("#nuance"),
  collocations:$("#collocations"), synonyms:$("#synonyms"), examples:$("#examples"),
  more:$("#moreBtn"), speak:$("#wordSpeak"), date:$("#dateLabel"), progress:$("#progress")
};

let index = 0;
let expanded = false;

function dailyIndex(){
  const now = new Date();
  const base = Date.UTC(2026,0,1);
  const today = Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.abs(Math.floor((today-base)/86400000)) % WORDS.length;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}
function icon(){
  return `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 9.5v5h3l4 3.5V6L8 9.5H5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 9c1.2 1.1 1.2 4.9 0 6M17.8 6.8c2.4 2.5 2.4 7.9 0 10.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`;
}
function say(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB";
  u.rate = 0.92;
  const voices = speechSynthesis.getVoices();
  const uk = voices.find(v=>/en-GB/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
  if(uk) u.voice = uk;
  speechSynthesis.speak(u);
}
function renderOptions(){
  els.select.innerHTML = WORDS.map((w,i)=>`<option value="${i}">${String(i+1).padStart(2,"0")} · ${escapeHtml(w.word)}</option>`).join("");
}
function renderProgress(){
  const group = Math.min(5,WORDS.length);
  els.progress.innerHTML = Array.from({length:group},(_,i)=>`<span class="dot ${i===index%group?"active":""}"></span>`).join("");
}
function render(){
  const w = WORDS[index];
  expanded = false;
  els.examples.classList.remove("expanded");
  els.more.textContent = "예문 2개 더 보기";
  els.select.value = index;
  els.word.textContent = w.word;
  els.pos.textContent = w.pos;
  els.level.textContent = w.level;
  els.category.textContent = w.category;
  els.ipa.textContent = w.ipa;
  els.meaning.textContent = w.meaning;
  els.nuance.textContent = w.nuance;
  els.collocations.textContent = w.collocations;
  els.synonyms.textContent = w.synonyms;
  els.examples.innerHTML = w.examples.map((ex,i)=>`
    <article class="example ${i>1?"extra":""}">
      <div class="num">${i+1}</div>
      <div><div class="en">${escapeHtml(ex[0])}</div><div class="ko">${escapeHtml(ex[1])}</div></div>
      <button class="mini-speak" data-sentence="${encodeURIComponent(ex[0])}" aria-label="예문 발음 듣기">${icon()}</button>
    </article>
  `).join("");
  els.examples.querySelectorAll(".mini-speak").forEach(btn=>{
    btn.addEventListener("click",()=>say(decodeURIComponent(btn.dataset.sentence)));
  });
  renderProgress();
  postHeight();
}
function postHeight(){
  requestAnimationFrame(()=> {
    const h = document.documentElement.scrollHeight;
    try{ parent.postMessage({type:"notion-widget-resize",height:h},"*"); }catch(e){}
  });
}
function move(delta){
  index = (index + delta + WORDS.length) % WORDS.length;
  render();
}
renderOptions();
index = dailyIndex();
const now = new Date();
els.date.textContent = new Intl.DateTimeFormat("ko-KR",{month:"long",day:"numeric",weekday:"short"}).format(now);
render();

els.select.addEventListener("change",e=>{index=Number(e.target.value);render();});
els.prev.addEventListener("click",()=>move(-1));
els.next.addEventListener("click",()=>move(1));
els.speak.addEventListener("click",()=>say(WORDS[index].word));
els.more.addEventListener("click",()=>{
  expanded = !expanded;
  els.examples.classList.toggle("expanded",expanded);
  els.more.textContent = expanded ? "예문 접기" : "예문 2개 더 보기";
  postHeight();
});
window.addEventListener("resize",postHeight);
</script>
</body>
</html>
