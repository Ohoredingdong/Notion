<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Daily English Word</title>
<style>
:root{--panel:#fff;--text:#171717;--sub:#737373;--muted:#a3a3a3;--line:#e7e5e4;--soft:#f7f7f5}html[data-theme="dark"]{--panel:#20201f;--text:#f2f2ef;--sub:#b8b8b2;--muted:#8b8b85;--line:#343432;--soft:#272725}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:0;color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}button,select{font:inherit;color:inherit}.widget{width:min(100%,360px);margin:0 auto;background:var(--panel);border:1px solid var(--line);padding:12px 14px 9px;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.label{font-size:7px;font-weight:700;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}.navs{display:flex;gap:4px}.nav{width:18px;height:18px;padding:0;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}.wordrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.word{font-family:Georgia,"Times New Roman",serif;font-size:24px;line-height:1;font-weight:700;letter-spacing:-.035em}.speaker{width:24px;height:24px;border:0;border-radius:8px;background:var(--soft);color:var(--sub);display:grid;place-items:center;cursor:pointer}.speaker svg,.mini svg{width:11px;height:11px}.ipa{margin-top:4px;font-size:8px;color:var(--muted)}.meaning{margin-top:9px;font-size:11px;font-weight:700;line-height:1.45}.nuance{margin-top:3px;font-size:8.5px;color:var(--sub);line-height:1.45}.divider{height:1px;background:var(--line);margin:9px 0 7px}.examples{display:grid;gap:7px}.example{position:relative;padding-right:18px}.en{font-size:8.8px;line-height:1.4;font-weight:700}.ko{margin-top:1px;font-size:8px;line-height:1.4;color:var(--sub)}.mini{position:absolute;right:0;top:0;width:17px;height:17px;border:0;background:transparent;color:var(--muted);padding:0;display:grid;place-items:center;cursor:pointer}.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}.status{font-size:7px;color:var(--muted)}.select{max-width:125px;border:0;background:transparent;outline:0;color:var(--muted);font-size:8px;text-align:right}.loading{opacity:.55}
</style></head><body><main class="widget" id="widget"><div class="top"><div class="label">Word of the day</div><div class="navs"><button class="nav" id="prev">‹</button><button class="nav" id="next">›</button></div></div><div class="wordrow"><div><div class="word" id="word">loading</div><div class="ipa" id="ipa">—</div></div><button class="speaker" id="speak" aria-label="발음 듣기"><svg viewBox="0 0 24 24" fill="none"><path d="M5 9.5v5h3l4 3.5V6L8 9.5H5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 9c1.2 1.1 1.2 4.9 0 6M17.8 6.8c2.4 2.5 2.4 7.9 0 10.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div><div class="meaning" id="meaning">단어 데이터를 불러오는 중…</div><div class="nuance" id="nuance"></div><div class="divider"></div><section class="examples" id="examples"></section><div class="footer"><div class="status" id="status">stored data</div><select class="select" id="select"></select></div></main>
<script>
const DATA_FILES=['english-words-1.json','english-words-2.json','english-words-3.json','english-words-4.json','english-words-5.json','english-words-extra.json'];
const qs=new URLSearchParams(location.search),theme=qs.get('theme');document.documentElement.dataset.theme=theme==='dark'||theme==='light'?theme:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');const $=s=>document.querySelector(s);let WORDS=[],index=0;const icon=`<svg viewBox="0 0 24 24" fill="none"><path d="M5 9.5v5h3l4 3.5V6L8 9.5H5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 9c1.2 1.1 1.2 4.9 0 6M17.8 6.8c2.4 2.5 2.4 7.9 0 10.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`;
function todayIndex(){const d=new Date(),base=Date.UTC(2026,0,1),now=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());return WORDS.length?Math.abs(Math.floor((now-base)/86400000))%WORDS.length:0}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.92;const voices=speechSynthesis.getVoices();const v=voices.find(x=>/en-GB/i.test(x.lang))||voices.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
function render(){if(!WORDS.length)return;const w=WORDS[index];$('#select').value=String(index);$('#word').textContent=w.word;$('#ipa').textContent=w.ipa||'';$('#meaning').textContent=w.meaning||'';$('#nuance').textContent=w.nuance||'';$('#examples').innerHTML=(w.examples||[]).slice(0,4).map((x,i)=>`<div class="example"><div class="en">${esc(x[0])}</div><div class="ko">${esc(x[1])}</div><button class="mini" data-i="${i}">${icon}</button></div>`).join('');document.querySelectorAll('.mini').forEach(b=>b.onclick=()=>say(w.examples[+b.dataset.i][0]));$('#status').textContent=WORDS.length+' words · stored'}
async function loadData(){const results=await Promise.allSettled(DATA_FILES.map(async f=>{const r=await fetch('./'+f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);const d=await r.json();return Array.isArray(d)?d:[]}));WORDS=results.filter(x=>x.status==='fulfilled').flatMap(x=>x.value);const seen=new Set();WORDS=WORDS.filter(w=>w&&w.word&&!seen.has(w.word)&&(seen.add(w.word),true));if(!WORDS.length)throw new Error('no data');$('#select').innerHTML=WORDS.map((w,i)=>`<option value="${i}">${w.word}</option>`).join('');index=todayIndex();render()}
async function boot(){try{await loadData()}catch(e){$('#word').textContent='retry';$('#meaning').textContent='데이터 배포 중입니다. 잠시 후 새로고침해 주세요.';$('#status').textContent='retry'}}boot();$('#prev').onclick=()=>{if(!WORDS.length)return;index=(index-1+WORDS.length)%WORDS.length;render()};$('#next').onclick=()=>{if(!WORDS.length)return;index=(index+1)%WORDS.length;render()};$('#select').onchange=e=>{index=+e.target.value;render()};$('#speak').onclick=()=>{if(WORDS.length)say(WORDS[index].word)};
</script></body></html>
