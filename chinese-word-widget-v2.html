<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Daily Chinese Word · Life Town v2</title>
<link rel="stylesheet" href="./assets/life-town-v2.css" />
<style>
:root{--panel:#fff;--text:#111113;--sub:#6e6e73;--muted:#a1a1a6;--line:#e7e7ea;--soft:#f7f7f8;--accent:#007aff;--shadow:0 12px 32px rgba(0,0,0,.055),0 1px 2px rgba(0,0,0,.035);--card-w:360px}
html[data-theme="dark"]{--panel:#1c1c1e;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--line:#38383a;--soft:#2c2c2e;--accent:#0a84ff;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:6px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:auto}button,select{font:inherit;color:inherit}.stage{width:calc(var(--card-w) + 44px);margin:0 auto;transition:width .18s ease}.shell{position:relative;width:var(--card-w);transition:width .18s ease;container-type:inline-size}.widget{position:relative;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:17px 17px 13px;overflow:hidden;box-shadow:var(--shadow)}.widget:before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,#b8b8bd 25%,#f6f6f8 50%,#b8b8bd 75%,transparent);opacity:.8}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.label{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:var(--sub)}.label:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(0,122,255,.08)}.navs{display:flex;gap:3px}.nav{width:28px;height:28px;padding:0;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;border-radius:9px}.nav:hover{background:var(--soft);color:var(--text)}.wordrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.word{font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:39px;line-height:.95;font-weight:720;letter-spacing:.01em}.speaker{width:34px;height:34px;border:1px solid var(--line);border-radius:11px;background:var(--soft);color:var(--sub);display:grid;place-items:center;cursor:pointer}.speaker:hover{color:var(--accent);border-color:#bdd8ff}.speaker svg,.mini svg{width:14px;height:14px}.pinyin{margin-top:7px;font-size:12px;color:var(--accent);font-weight:650;letter-spacing:.01em}.meaning{margin-top:16px;font-size:14px;font-weight:720;line-height:1.5;letter-spacing:-.025em}.nuance{margin-top:4px;font-size:10.5px;color:var(--sub);line-height:1.5}.divider{height:1px;background:var(--line);margin:14px 0 11px}.examples{display:grid;gap:10px}.example{position:relative;padding-right:25px}.zh{font-size:12px;line-height:1.45;font-weight:650}.ko{margin-top:2px;font-size:10px;line-height:1.45;color:var(--sub)}.mini{position:absolute;right:0;top:0;width:22px;height:22px;border:0;background:transparent;color:var(--muted);padding:0;display:grid;place-items:center;cursor:pointer;border-radius:7px}.mini:hover{background:var(--soft);color:var(--accent)}.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.status{font-size:9px;color:var(--muted)}.select{max-width:150px;border:0;background:transparent;outline:0;color:var(--sub);font-size:9px;text-align:right}@container(max-width:320px){.widget{padding:14px 13px 11px;border-radius:19px}.top{margin-bottom:14px}.word{font-size:34px}.meaning{font-size:12.5px;margin-top:13px}.examples{gap:8px}.zh{font-size:11px}.ko{font-size:9px}}
</style></head><body>
<div class="stage"><div class="shell"><main class="widget" id="widget"><div class="top"><div class="label">오늘의 중국어 단어</div><div class="navs"><button class="nav" id="prev" aria-label="이전 단어">‹</button><button class="nav" id="next" aria-label="다음 단어">›</button></div></div><div class="wordrow"><div><div class="word" id="word">加载中</div><div class="pinyin" id="pinyin">—</div></div><button class="speaker" id="speak" aria-label="발음 듣기"><svg viewBox="0 0 24 24" fill="none"><path d="M5 9.5v5h3l4 3.5V6L8 9.5H5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 9c1.2 1.1 1.2 4.9 0 6M17.8 6.8c2.4 2.5 2.4 7.9 0 10.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div><div class="meaning" id="meaning">단어 데이터를 불러오는 중…</div><div class="nuance" id="nuance"></div><div class="divider"></div><section class="examples" id="examples"></section><div class="footer"><div class="status" id="status">loading</div><select class="select" id="select" aria-label="단어 선택"></select></div></main></div></div>
<script>
const DATA_FILES=['chinese-words-1.json','chinese-words-2.json','chinese-words-3.json','chinese-words-4.json','chinese-words-5.json','chinese-words-extra.json'];const STORAGE_KEY='chinese-word-widget-v2-state',$=s=>document.querySelector(s);let WORDS=[],index=0,current=null;const icon=`<svg viewBox="0 0 24 24" fill="none"><path d="M5 9.5v5h3l4 3.5V6L8 9.5H5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 9c1.2 1.1 1.2 4.9 0 6M17.8 6.8c2.4 2.5 2.4 7.9 0 10.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`;
function loadState(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch{return{}}}const state=loadState();function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({index}))}catch{}}
function daySeed(){const d=new Date();return Number(`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`)}function todayIndex(){if(!WORDS.length)return 0;let x=Math.sin(daySeed()*12.9898)*43758.5453;return Math.floor((x-Math.floor(x))*WORDS.length)}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function say(t){if(!('speechSynthesis'in window)||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;const voices=speechSynthesis.getVoices(),v=voices.find(x=>/zh-CN|cmn-Hans/i.test(x.lang))||voices.find(x=>/^zh/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
async function loadData(){const results=await Promise.allSettled(DATA_FILES.map(async f=>{const r=await fetch(new URL(f,location.href),{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);const d=await r.json();return Array.isArray(d)?d:[]}));WORDS=results.filter(x=>x.status==='fulfilled').flatMap(x=>x.value);const seen=new Set();WORDS=WORDS.filter(w=>w&&w.word&&!seen.has(w.word)&&(seen.add(w.word),true));if(!WORDS.length)throw new Error('no data')}
function renderOptions(){$('#select').innerHTML=WORDS.map((w,i)=>`<option value="${i}">${w.word} · ${w.pinyin||''}</option>`).join('')}function render(){const w=WORDS[index];current=w;$('#select').value=String(index);$('#word').textContent=w.word;$('#pinyin').textContent=w.pinyin||'';$('#meaning').textContent=w.meaning||'';$('#nuance').textContent=w.nuance||'';$('#examples').innerHTML=(w.examples||[]).slice(0,4).map((x,i)=>`<div class="example"><div class="zh">${esc(x[0])}</div><div class="ko">${esc(x[1])}</div><button class="mini" data-i="${i}" aria-label="예문 발음 듣기">${icon}</button></div>`).join('');document.querySelectorAll('.mini').forEach(b=>b.onclick=()=>say(w.examples[+b.dataset.i][0]));$('#status').textContent=WORDS.length+' words';saveState()}
function move(d){index=(index+d+WORDS.length)%WORDS.length;render()}
(async function boot(){try{await loadData();renderOptions();index=Number.isInteger(state.index)&&state.index>=0&&state.index<WORDS.length?state.index:todayIndex();render()}catch(e){$('#word').textContent='错误';$('#meaning').textContent='단어 데이터를 불러오지 못했습니다.';$('#status').textContent='data error'}})();$('#prev').onclick=()=>WORDS.length&&move(-1);$('#next').onclick=()=>WORDS.length&&move(1);$('#select').onchange=e=>{index=+e.target.value;render()};$('#speak').onclick=()=>say(current?.word);
</script><script src="./assets/life-town-controls-v2.js"></script></body></html>
