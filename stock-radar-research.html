/* Research home only: neutral surfaces, with color limited to small accents. */
html:has([data-rc-page="home"]) {
  --rc-bg: #f4f4f5;
  --rc-ink: #1c2025;
  --rc-muted: #515963;

html:has([data-rc-page="home"]) #rc-header {
  background: #fdfdfd;
  box-shadow: 0 2px 7px #2027310f;
}
html:has([data-rc-page="home"]) .rc-indices {
  border-color: #ebedf0;
  column-gap: 8px;
}
html:has([data-rc-page="home"]) .rc-indices .rc-index {

  border-left-color: transparent;

}

  color: #fff;
  border-color: transparent;
  background: #0e672e;
}
html:has([data-rc-page="home"]) .rc-country button[aria-pressed="true"] {

  background: #ebecef;
  color: #232a32;
}
html:has([data-rc-page="home"]) :focus-visible { outline-color: #645283; }

.rc-home .rc-card {
  background: #fff;
  border-color: var(--rc-border);
  box-shadow: 0 1px 3px #2027310e;
}
.rc-home .rc-card-head .rc-bar {
  background: #687481;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  vertical-align: 1px;
  box-shadow: 0 0 0 2px #eff0f2;
}
.rc-home .rc-candidate .rc-card-head .rc-bar,
.rc-home-side > .rc-card:first-child .rc-card-head .rc-bar {
  background: #946514;
  box-shadow: 0 0 0 2px #fff3de;
}
.rc-home-bottom > .rc-card:has(.rc-headline-list) .rc-card-head .rc-bar {
  background: #765a9c;
  box-shadow: 0 0 0 2px #f1edf7;
}
.rc-home .rc-table thead th,
.rc-home .rc-macro-card .rc-macro-table thead th {
  background: #f0f1f3;
  color: #303740;
}
.rc-home .rc-table tbody :is(th, td), .rc-home .rc-stockrow, .rc-home .rc-brief-row {
  border-color: #e9eaed;
}
.rc-home .rc-macro-head .rc-macro-icon {
  background: #f8f8f9;
  border-color: #e6e8eb;
}
.rc-home .rc-macro-row-icon, .rc-home .rc-macro-card .rc-macro-arrow { color: #5c6571; }
.rc-home .rc-macro-label a { color: inherit; text-decoration-color: #89919b; }
.rc-home :is(.rc-formrow input, .rc-formrow select) { border-color: #d6d8dd; }
.rc-home :is(.rc-formrow input, .rc-empty, .rc-region-details > div, .rc-region-econ-rows > div) {
  background: #f8f8f9;
}
.rc-home .rc-empty { border-color: #dcdde1; }
html:has([data-rc-page="home"]) .rc-footer a,
.rc-home a:not(.rc-macro-label a) { color: #404a5b; }
.rc-home .rc-headline-list .rc-brief-title a { color: #222a32; }
.rc-home :is(.rc-prevnext button, .rc-candidate-footer button, [data-rc-search-focus], [data-rc-tab="market"]) {
  background-color: #f6f6f7;
  border-color: #dbdde1;
  color: #343d48;
}
.rc-home :is(.rc-prevnext button, .rc-candidate-footer button, [data-rc-search-focus], [data-rc-tab="market"]):hover {
  background-color: #eceef1;
  border-color: #caccd2;
}
html:has([data-rc-page="home"]) .rc-compare-up,
.rc-home .rc-industry-median[aria-label^="등락률 중앙값 +"] { color: #ba242b; }
html:has([data-rc-page="home"]) .rc-compare-down,
.rc-home .rc-industry-median[aria-label^="등락률 중앙값 -"] { color: #1755ac; }
@media (max-width: 700px) {
  html:has([data-rc-page="home"]) .rc-indices { column-gap: 4px; }
