<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Cycle Notes · Life Town v2</title>
<link rel="stylesheet" href="./assets/life-town-v2.css" />
<style>
:root{--card-w:430px;--text:#111113;--sub:#6e6e73;--muted:#a1a1a6;--line:#e7e7ea;--soft:#f7f7f8;--blue:#007aff;--green:#34c759;--red:#ff3b30;--yellow:#ffcc00;--shadow:0 12px 32px rgba(0,0,0,.055),0 1px 2px rgba(0,0,0,.035)}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:6px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:auto}.stage{width:var(--card-w);margin:0 auto;transition:width .18s}.shell{position:relative;width:100%;container-type:inline-size}.card{position:relative;width:100%;background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px 17px 15px;box-shadow:var(--shadow);overflow:hidden}.card:before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,#b8b8bd 25%,#f6f6f8 50%,#b8b8bd 75%,transparent);opacity:.8}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.title{font-size:19px;font-weight:760;letter-spacing:-.045em;line-height:1}.sub{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);margin-top:6px}.sub:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(255,59,48,.08)}.nav{display:grid;grid-template-columns:34px 1fr 34px;height:35px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}.nav button{width:34px;height:34px;border:0;background:#fff;color:var(--sub);font-size:20px;cursor:pointer}.nav button:hover{background:var(--soft);color:var(--text)}.nav button:first-child{border-right:1px solid var(--line)}.nav button:last-child{border-left:1px solid var(--line)}.month{min-width:92px;display:grid;place-items:center;font-size:11px;font-weight:720}.week,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week{margin-top:16px;font-size:9.5px;color:var(--muted);font-weight:650;text-align:center}.week div{padding:3px 0 7px}.cal{row-gap:4px}.day{position:relative;height:32px;border:0;background:transparent;display:grid;place-items:center;font-size:11px;color:var(--text);cursor:pointer;z-index:1;border-radius:50%}.day.out{color:#d1d1d6}.day.today{font-weight:720}.day.today:after{content:'';position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--blue);z-index:3}.day.sel:after{content:'';position:absolute;width:31px;height:31px;border:1.5px solid var(--blue);border-radius:50%;z-index:-1}.day.period:before{content:'';position:absolute;top:4px;bottom:4px;left:-1px;right:-1px;background:rgba(255,59,48,.11);z-index:-2}.day.period.ps:before{left:4px;border-radius:999px 0 0 999px}.day.period.pe:before{right:4px;border-radius:0 999px 999px 0}.day.period.single:before{left:4px;right:4px;border-radius:999px}.section{margin-top:16px}.label{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:730;margin-bottom:9px;letter-spacing:-.02em}.label small{font-size:9px;color:var(--muted);font-weight:600}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{height:30px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:0 10px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:650;color:var(--sub);cursor:pointer;white-space:nowrap;transition:.14s ease}.chip:before{content:'[ ';color:var(--muted)}.chip:after{content:' ]';color:var(--muted)}.chip:hover{background:var(--soft);color:var(--text)}.chip.on{background:rgba(0,122,255,.07);border-color:rgba(0,122,255,.22);color:var(--blue)}.chip.on:before,.chip.on:after{color:var(--blue)}.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden}.flowBtn{min-width:0;height:59px;padding:7px 2px 6px;border:0;border-right:1px solid var(--line);background:#fff;cursor:pointer;font-size:8.5px;font-weight:650;color:var(--sub)}.flowBtn:last-child{border-right:0}.flowBtn:hover{background:var(--soft)}.flowBtn.on{background:rgba(255,59,48,.06);box-shadow:inset 0 0 0 1px rgba(255,59,48,.32);color:#c72d26}.drops{height:22px;display:flex;align-items:flex-end;justify-content:center;gap:1px;margin-bottom:3px;color:var(--red)}.drops.none{color:#d1d1d6}.drops svg{width:10px;height:15px;fill:currentColor}.memoBox{border:1px solid var(--line);border-radius:15px;padding:11px;background:#fff}.memoHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.memoTitle{font-size:12px;font-weight:730}.date{font-size:9px;color:var(--muted)}.memo{width:100%;height:58px;border:0;border-radius:11px;background:var(--soft);padding:11px;font:inherit;font-size:10.5px;line-height:1.45;resize:none;outline:0;color:var(--text)}.memo:focus{box-shadow:0 0 0 1.5px rgba(0,122,255,.22);background:#fff}.status{height:1px}.tip{margin-top:10px;border:1px solid var(--line);background:#fafafa;border-radius:12px;padding:9px 10px;display:flex;align-items:flex-start;gap:7px;font-size:9px;line-height:1.45;color:var(--sub)}.tip i{width:7px;height:7px;border-radius:50%;background:var(--green);margin-top:3px;flex:0 0 7px}.settings{position:absolute;right:12px;top:56px;z-index:20;display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 14px 30px rgba(0,0,0,.10)}.settings.open{display:block}.settings button{border:0;background:transparent;color:var(--red);height:32px;padding:0 9px;border-radius:8px;font-size:10px;cursor:pointer}.settings button:hover{background:rgba(255,59,48,.06)}.more{position:absolute;right:14px;top:15px;width:28px;height:28px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:17px;cursor:pointer;display:none}.more:hover{background:var(--soft);color:var(--text)}@container(max-width:390px){.card{padding:16px 13px 13px;border-radius:21px}.title{font-size:17px}.nav{grid-template-columns:31px 1fr 31px;height:32px}.nav button{width:31px;height:31px}.month{min-width:80px;font-size:10px}.week{margin-top:13px}.day{height:29px;font-size:10px}.day.sel:after{width:28px;height:28px}.flowBtn{height:54px;font-size:7.7px}.chip{height:28px;font-size:9px}.memo{height:54px}}
</style></head><body><div class="stage"><div class="shell"><main class="card"><header class="top"><div><div class="title">Cycle Notes</div><div class="sub">주기 로그</div></div><div class="nav"><button id="prev">‹</button><div class="month" id="month"></div><button id="next">›</button></div></header><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="cal" id="cal"></div><section class="section"><div class="label"><span>주요 증상</span><small>복수 선택</small></div><div class="chips" id="chips"></div></section><section class="section"><div class="label"><span>흐름 강도</span><small>선택한 날짜 기준</small></div><div class="flow" id="flow"></div></section><section class="section memoBox"><div class="memoHead"><div class="memoTitle">오늘 메모</div><div class="date" id="date"></div></div><textarea class="memo" id="memo" placeholder="오늘의 증상이나 컨디션을 기록해보세요."></textarea></section><div class="status" id="status"></div><div class="tip"><i></i><span>증상과 흐름을 꾸준히 기록하면 달력에서 패턴을 더 쉽게 확인할 수 있어요.</span></div></main></div></div>
<script>
const SYM=['복통','붓기','피로','예민함','두통','허리통증'],FLOW=['없음','아주 적음','적음','보통','많음','아주 많음'],K='cycle-notes-v5',CK='cycle-notes-sync-code-v1',SYNC_URL='https://dfklyngtjqvlirgrtdfb.supabase.co/functions/v1/cycle-notes-sync';let data=JSON.parse(localStorage.getItem(K)||'{}'),cur=new Date(),sel=iso(new Date()),ss=new Set(),sf='없음',timer=null;cur=new Date(cur.getFullYear(),cur.getMonth(),1);const $=q=>document.querySelector(q);function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function getSyncCode(){let c=localStorage.getItem(CK);if(!c){const a=new Uint8Array(32);crypto.getRandomValues(a);c=Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem(CK,c)}return c}async function cloud(action,state){try{const r=await fetch(SYNC_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,code:getSyncCode(),state})});if(!r.ok)throw new Error('sync_failed');return await r.json()}catch(e){console.warn('Cycle Notes sync:',e);return null}}async function save(){data[sel]={period:sf!=='없음',symptoms:[...ss],flow:sf,memo:$('#memo').value.trim()};localStorage.setItem(K,JSON.stringify(data));renderCal();cloud('save',data)}async function loadCloud(){const remote=await cloud('load');if(remote&&remote.state&&typeof remote.state==='object'){data=remote.state;localStorage.setItem(K,JSON.stringify(data));loadEditor();renderCal()}else if(Object.keys(data).length){cloud('save',data)}}function loadEditor(){const r=data[sel]||{};ss=new Set(r.symptoms||[]);sf=r.flow||'없음';$('#memo').value=r.memo||'';$('#date').textContent=sel;renderChips();renderFlow()}function renderChips(){$('#chips').innerHTML=SYM.map(n=>`<button class="chip ${ss.has(n)?'on':''}" data-s="${n}">${n}</button>`).join('');document.querySelectorAll('.chip[data-s]').forEach(b=>b.onclick=()=>{ss.has(b.dataset.s)?ss.delete(b.dataset.s):ss.add(b.dataset.s);renderChips();save()})}function dropSvg(n){const s='<svg viewBox="0 0 16 20"><path d="M8 1C6.8 4.8 2.2 8.7 2.2 13.1A5.8 5.8 0 0 0 13.8 13C13.8 8.7 9.2 4.8 8 1Z"/></svg>';if(n===0)return `<span class="drops none">${s}</span>`;const c=n===4?2:n===5?3:1;return `<span class="drops">${s.repeat(c)}</span>`}function renderFlow(){$('#flow').innerHTML=FLOW.map((n,i)=>`<button class="flowBtn ${sf===n?'on':''}" data-f="${n}">${dropSvg(i)}${n}</button>`).join('');document.querySelectorAll('.flowBtn').forEach(b=>b.onclick=()=>{sf=b.dataset.f;renderFlow();save()})}function renderCal(){const y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());$('#month').textContent=`${y}년 ${m+1}월`;$('#cal').innerHTML='';const dates=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);dates.push({d,k:iso(d)})}dates.forEach(({d,k},i)=>{const r=data[k],prev=data[dates[i-1]?.k],next=data[dates[i+1]?.k],period=!!r?.period,ps=period&&!prev?.period,pe=period&&!next?.period,single=ps&&pe,b=document.createElement('button');b.className='day'+(d.getMonth()!=m?' out':'')+(k===sel?' sel':'')+(k===iso(new Date())?' today':'')+(period?' period':'')+(ps?' ps':'')+(pe?' pe':'')+(single?' single':'');b.textContent=d.getDate();b.onclick=()=>{sel=k;loadEditor();renderCal()};$('#cal').appendChild(b)})}$('#prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);renderCal()};$('#next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);renderCal()};$('#memo').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(save,500)});loadEditor();renderCal();loadCloud();
</script><script src="./assets/life-town-controls-v2.js"></script></body></html>
