<!doctype html>

<head>

<title>News Link Hub</title>
<style>
:root{--panel:#fff;--line:#ebe9e5;--line2:#f1efeb;--soft:#faf9f7;--soft2:#f6f7f4;--text:#2e3235;--sub:#75797d;--muted:#a6aaad;--green:#69a06a;--green2:#4f8653;--green-soft:#edf5ec;--shadow:0 8px 24px rgba(28,28,24,.035);--ctrl:rgba(255,255,255,.95);--tag-blue:#eef3fb;--tag-blue-t:#718eb9;--tag-amber:#faf3e6;--tag-amber-t:#b79048;--tag-purple:#f2eef9;--tag-purple-t:#7c6aa3}html[data-theme=dark]{--panel:#202120;--line:#373733;--line2:#2c2c29;--soft:#262725;--soft2:#292a27;--text:#efefeb;--sub:#c3c5c0;--muted:#8f918e;--green:#89bb87;--green2:#9dcc9a;--green-soft:#263427;--shadow:none;--ctrl:rgba(35,35,33,.95);--tag-blue:#222d3a;--tag-blue-t:#9ab1d3;--tag-amber:#39301f;--tag-amber-t:#dec170;--tag-purple:#30293d;--tag-purple-t:#b7a7d7}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}button,select{font:inherit;color:inherit}.root{position:relative;width:min(100%,510px);margin:0 auto;transition:width .18s ease}.root[data-size=compact]{width:min(100%,470px)}.root[data-size=normal]{width:min(100%,510px)}.root[data-size=large]{width:min(100%,570px)}.widget{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 14px 13px;box-shadow:var(--shadow)}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:19px;font-weight:760;letter-spacing:-.03em;line-height:1.06}.subtitle{margin-top:5px;font-size:11.5px;color:var(--sub)}.settings-btn{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--sub);cursor:pointer}.settings-btn svg{width:13px;height:13px}.settings-pop{position:absolute;right:14px;top:48px;width:156px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 10px 28px rgba(0,0,0,.08);z-index:5;display:none}.settings-pop.open{display:block}.setting-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 6px;border-radius:8px;font-size:10px;color:var(--sub)}.setting-row button{border:0;background:var(--soft);border-radius:7px;padding:4px 7px;font-size:9px;cursor:pointer}.tabs{display:flex;gap:0;margin-top:15px}.tab{height:32px;min-width:72px;padding:0 12px;border:1px solid var(--line);border-right:0;background:var(--panel);font-size:10.5px;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}.tab:first-child{border-radius:10px 0 0 10px}.tab:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}.tab svg{width:13px;height:13px}.tab.active{background:var(--green-soft);color:var(--green2);font-weight:700}.filters{display:flex;justify-content:flex-end;gap:8px;margin:14px 0 8px}.select-wrap{position:relative}.select-wrap select{height:28px;padding:0 26px 0 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:10px;color:var(--sub);appearance:none;cursor:pointer}.select-wrap:after{content:'⌄';position:absolute;right:9px;top:50%;transform:translateY(-56%);font-size:10px;color:var(--muted);pointer-events:none}.newsbox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}.newsrow{display:grid;grid-template-columns:48px minmax(0,1fr) 46px 48px;gap:10px;align-items:center;padding:12px 10px;border-bottom:1px solid var(--line2);min-height:68px}.newsrow:last-child{border-bottom:0}.topic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:4px;font-size:8.5px;font-weight:720;line-height:1.15;background:var(--green-soft);color:var(--green2)}.topic.market{background:var(--tag-blue);color:var(--tag-blue-t)}.topic.daily{background:var(--tag-amber);color:var(--tag-amber-t)}.topic.invest{background:var(--tag-purple);color:var(--tag-purple-t)}.copy{min-width:0}.headline{font-size:11px;font-weight:720;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.snippet{margin-top:4px;font-size:9.5px;color:var(--sub);line-height:1.32;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timeago{font-size:9px;color:var(--muted);text-align:right;white-space:nowrap}.open-btn{height:28px;border:1px solid color-mix(in srgb,var(--green) 18%,var(--line));border-radius:8px;background:var(--green-soft);color:var(--green2);font-size:9.5px;font-weight:680;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}.open-btn svg{width:10px;height:10px}.empty{padding:36px 12px;text-align:center;color:var(--muted);font-size:10.5px}.trend{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px;background:linear-gradient(180deg,var(--soft),var(--panel))}.trend-title{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:720;color:var(--green2);margin-bottom:10px}.trend-title svg{width:13px;height:13px}.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.quick{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:10px;display:grid;grid-template-columns:27px minmax(0,1fr) 12px;gap:7px;align-items:center;cursor:pointer;text-decoration:none;color:inherit}.quick-icon{width:27px;height:27px;border-radius:8px;background:var(--green-soft);display:grid;place-items:center;color:var(--green2)}.quick-icon svg{width:14px;height:14px}.quick-title{font-size:9.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quick-sub{margin-top:2px;font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{font-size:13px;color:var(--muted)}.footer{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:9px;font-size:8.8px;color:var(--muted)}.source{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.retry{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 7px;font-size:8.5px;cursor:pointer}.controls{position:absolute;top:10px;right:-36px;display:flex;flex-direction:column;gap:7px;opacity:0;transform:translateX(6px);pointer-events:none;transition:opacity .18s ease,transform .18s ease}.controls:before{content:'';position:absolute;left:-10px;top:0;width:10px;height:100%}.root:hover .controls,.root:focus-within .controls{opacity:1;transform:none;pointer-events:auto}.ctrl{position:relative;width:28px;height:28px;border:1px solid var(--line);border-radius:50%;background:var(--ctrl);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(20,20,20,.05)}.ctrl svg{width:14px;height:14px}.ctrl[disabled]{opacity:.4;cursor:not-allowed}.ctrl:after{content:attr(data-tip);position:absolute;right:35px;top:50%;transform:translateY(-50%);padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-size:9px;color:var(--sub);white-space:nowrap;opacity:0;pointer-events:none}.ctrl:hover:after{opacity:1}@media(max-width:520px){.root{width:100%!important}.headline,.snippet{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}.headline{-webkit-line-clamp:2}.snippet{-webkit-line-clamp:1}.quick-grid{grid-template-columns:1fr}.quick{min-height:48px}}@media(max-width:430px){.newsrow{grid-template-columns:44px minmax(0,1fr) 42px}.timeago{display:none}.controls{right:7px;top:7px;opacity:1;transform:none;pointer-events:auto;flex-direction:row}.ctrl:after{display:none}.top{padding-right:125px}.settings-btn{display:none}.tabs{overflow-x:auto}.tab{min-width:68px}}@media(hover:none),(pointer:coarse){.controls{opacity:1;transform:none;pointer-events:auto}}
</style>
</head>
<body>
<div class="root" id="root" data-size="normal"><div class="widget" id="widget"><header class="top"><div><div class="title">News Link Hub</div><div class="subtitle">기사와 실시간 뉴스를 빠르게 연결하는 관문</div></div><button class="settings-btn" id="settingsBtn" type="button"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19 13.5v-3l-2-.7a7 7 0 0 0-.7-1.7l.9-1.9-2.1-2.1-1.9.9a7 7 0 0 0-1.7-.7L10.5 2h-3l-.7 2.3a7 7 0 0 0-1.7.7l-1.9-.9-2.1 2.1.9 1.9a7 7 0 0 0-.7 1.7L0 10.5v3l2.3.7a7 7 0 0 0 .7 1.7l-.9 1.9 2.1 2.1 1.9-.9a7 7 0 0 0 1.7.7l.7 2.3h3l.7-2.3a7 7 0 0 0 1.7-.7l1.9.9 2.1-2.1-.9-1.9a7 7 0 0 0 .7-1.7L19 13.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>설정</button></header><div class="settings-pop" id="settingsPop"><div class="setting-row"><span>Theme</span><button id="popTheme">전환</button></div><div class="setting-row"><span>Size</span><button id="popSize">변경</button></div><div class="setting-row"><span>Lock</span><button id="popLock">잠금</button></div></div><nav class="tabs" aria-label="news tabs"><button class="tab active" data-tab="news">뉴스</button><button class="tab" data-tab="article">기사</button><button class="tab" data-tab="realtime">실시간</button><button class="tab" data-tab="opinion">오피니언</button></nav><div class="filters"><div class="select-wrap"><select id="region"><option value="all">● 전체</option><option value="kr">국내</option><option value="us">미국</option><option value="global">글로벌</option></select></div><div class="select-wrap"><select id="sort"><option value="new">최신순</option><option value="old">오래된순</option></select></div></div><section class="newsbox" id="newsbox"><div class="empty">뉴스를 불러오는 중...</div></section><section class="trend"><div class="trend-title">지금 많이 보는 기사</div><div class="quick-grid"><a class="quick" href="./market-events.html?theme=light" target="_blank"><div class="quick-icon">◫</div><div><div class="quick-title">오늘의 주요 일정</div><div class="quick-sub">경제 캘린더 바로가기</div></div><div class="arrow">›</div></a><a class="quick" href="./commodities-dashboard.html?theme=light" target="_blank"><div class="quick-icon">↗</div><div><div class="quick-title">지표 발표 요약</div><div class="quick-sub">핵심 지표 한눈에 보기</div></div><div class="arrow">›</div></a><a class="quick" href="./fear-greed-dashboard.html?theme=light" target="_blank"><div class="quick-icon">▥</div><div><div class="quick-title">시장 브리핑</div><div class="quick-sub">오늘의 시장 정리</div></div><div class="arrow">›</div></a></div></section><div class="footer"><div class="source" id="source">Source · Google News RSS</div><button class="retry" id="retry" hidden>Retry</button></div></div><div class="controls" aria-label="widget controls"><button class="ctrl" id="sizeBtn" data-tip="Size">≡</button><button class="ctrl" id="themeBtn" data-tip="Dark Mode">◐</button><button class="ctrl" id="lockBtn" data-tip="Lock">□</button><button class="ctrl" id="resetBtn" data-tip="Reset">↺</button></div></div>
<script>
const FALLBACK={generated_at:new Date().toISOString(),source:'Google News RSS',stale:false,items:[{tab:'news',region:'kr',topic:'미 연준',topic_class:'',title:'한은 부총재, 금리 인상 부작용도 균형 있게 판단',snippet:'성장·물가·금융안정을 함께 고려해야 한다는 통화정책 메시지',url:'https://www.yna.co.kr/view/AKR20260821039952002',published_at:'2026-08-21T10:43:00+09:00',source:'연합뉴스'},{tab:'news',region:'kr',topic:'마켓\n인사이트',topic_class:'market',title:'증권가, 다음 금통위 기준금리 연속 인상 전망 우세',snippet:'성장률과 물가 지표 변화로 인상 전망에 무게가 실리는 흐름',url:'https://www.yna.co.kr/view/AKR20260821054700008',published_at:'2026-08-21T10:22:00+09:00',source:'연합뉴스'},{tab:'news',region:'kr',topic:'데일리\n이코',topic_class:'daily',title:'삼성전자·SK하이닉스 강세에 코스피 낙폭 만회',snippet:'미 국채 금리 상승에도 반도체 대형주의 주주환원 기대가 지수 방어',url:'https://www.yna.co.kr/view/AKR20260821084800008',published_at:'2026-08-21T11:47:00+09:00',source:'연합뉴스'},{tab:'article',region:'kr',topic:'투자\n프리뷰',topic_class:'invest',title:'국고채 금리 일제히 상승…3년물 장중 3.844%',snippet:'국내 채권시장에서 주요 만기 국고채 금리가 전반적으로 상승',url:'https://www.yna.co.kr/amp/view/AKR20260821084700008',published_at:'2026-08-21T11:40:00+09:00',source:'연합뉴스'}]};const KEY='widget.newsLinkHub.controls.v1',root=document.getElementById('root'),q=new URLSearchParams(location.search),os=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';let settings={theme:q.get('theme')||os,size:'normal',locked:false};try{settings={...settings,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{};let state={tab:'news',region:'all',sort:'new',data:FALLBACK};function save(){localStorage.setItem(KEY,JSON.stringify(settings))}function applyTheme(v){document.documentElement.dataset.theme=v;settings.theme=v;save()}function applySize(v){root.dataset.size=v;settings.size=v;save();document.getElementById('sizeBtn').disabled=settings.locked}function applyLock(v){settings.locked=v;save();document.getElementById('sizeBtn').disabled=v;document.getElementById('lockBtn').dataset.tip=v?'Unlock':'Lock'}applyTheme(settings.theme);applySize(settings.size);applyLock(settings.locked);const themeToggle=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');const sizeToggle=()=>{if(settings.locked)return;const a=['compact','normal','large'];applySize(a[(a.indexOf(settings.size)+1)%a.length])};document.getElementById('themeBtn').onclick=themeToggle;document.getElementById('sizeBtn').onclick=sizeToggle;document.getElementById('lockBtn').onclick=()=>applyLock(!settings.locked);document.getElementById('resetBtn').onclick=()=>{settings={theme:q.get('theme')||os,size:'normal',locked:false};applyTheme(settings.theme);applySize('normal');applyLock(false)};document.getElementById('settingsBtn').onclick=()=>document.getElementById('settingsPop').classList.toggle('open');document.getElementById('popTheme').onclick=themeToggle;document.getElementById('popSize').onclick=sizeToggle;document.getElementById('popLock').onclick=()=>applyLock(!settings.locked);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('region').onchange=e=>{state.region=e.target.value;render()};document.getElementById('sort').onchange=e=>{state.sort=e.target.value;render()};function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function ago(iso){const ms=Date.now()-new Date(iso).getTime();const m=Math.max(0,Math.round(ms/60000));if(m<1)return'방금';if(m<60)return`${m}분 전`;const h=Math.floor(m/60);if(h<24)return`${h}시간 전`;return`${Math.floor(h/24)}일 전`}function render(){let arr=(state.data.items||[]).filter(x=>x.tab===state.tab||state.tab==='realtime'&&x.tab!=='opinion');if(state.region!=='all')arr=arr.filter(x=>x.region===state.region);arr.sort((a,b)=>(new Date(b.published_at)-new Date(a.published_at))*(state.sort==='new'?1:-1));arr=arr.slice(0,4);const box=document.getElementById('newsbox');if(!arr.length){box.innerHTML='<div class="empty">현재 표시할 뉴스가 없어요.</div>';return}box.innerHTML=arr.map(x=>`<article class="newsrow"><div class="topic ${esc(x.topic_class||'')}">${esc(x.topic||'뉴스').replace(/\n/g,'<br>')}</div><div class="copy"><div class="headline">${esc(x.title)}</div><div class="snippet">${esc(x.snippet||x.source||'')}</div></div><div class="timeago">${ago(x.published_at)}</div><button class="open-btn" data-url="${esc(x.url)}">열기 ↗</button></article>`).join('');box.querySelectorAll('.open-btn').forEach(b=>b.onclick=()=>window.open(b.dataset.url,'_blank','noopener,noreferrer'))}async function load(){document.getElementById('retry').hidden=true;try{const r=await fetch(`./news-link-data.json?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(r.status);const d=await r.json();state.data={...FALLBACK,...d,items:(d.items&&d.items.length)?d.items:FALLBACK.items};document.getElementById('source').textContent=`Source · ${d.source||'Google News RSS'} · ${ago(d.generated_at)}`;document.getElementById('retry').hidden=!d.stale}catch(e){state.data=FALLBACK;document.getElementById('source').textContent='Source · cached fallback';document.getElementById('retry').hidden=false}render()}document.getElementById('retry').onclick=load;load();
</script>
