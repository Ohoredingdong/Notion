<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>News Link Hub</title><style>
:root{--panel:#fff;--line:#ebe9e5;--line2:#f1efeb;--soft:#faf9f7;--text:#2e3235;--sub:#75797d;--muted:#a6aaad;--green:#69a06a;--green2:#4f8653;--green-soft:#edf5ec;--blue:#eef3fb;--bluet:#718eb9;--amber:#faf3e6;--ambert:#b79048;--purple:#f2eef9;--purplet:#7c6aa3;--ctrl:rgba(255,255,255,.95)}html[data-theme=dark]{--panel:#202120;--line:#373733;--line2:#2c2c29;--soft:#282927;--text:#efefeb;--sub:#c3c5c0;--muted:#8f918e;--green:#89bb87;--green2:#9dcc9a;--green-soft:#263427;--blue:#222d3a;--bluet:#9ab1d3;--amber:#39301f;--ambert:#dec170;--purple:#30293d;--purplet:#b7a7d7;--ctrl:rgba(35,35,33,.95)}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;color:var(--text)}button,select{font:inherit;color:inherit}.root{position:relative;width:min(100%,510px);margin:auto}.root[data-size=compact]{width:min(100%,470px)}.root[data-size=large]{width:min(100%,570px)}.widget{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 14px 13px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:19px;font-weight:760;letter-spacing:-.03em}.subtitle{margin-top:5px;font-size:11.5px;color:var(--sub)}.settings{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:10.5px;color:var(--sub)}.tabs{display:flex;margin-top:15px}.tab{height:32px;min-width:72px;padding:0 12px;border:1px solid var(--line);border-right:0;background:var(--panel);font-size:10.5px;color:var(--sub);cursor:pointer}.tab:first-child{border-radius:10px 0 0 10px}.tab:last-child{border-right:1px solid var(--line);border-radius:0 10px 10px 0}.tab.active{background:var(--green-soft);color:var(--green2);font-weight:700}.filters{display:flex;justify-content:flex-end;gap:8px;margin:14px 0 8px}.filters select{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:10px;color:var(--sub)}.newsbox{border:1px solid var(--line);border-radius:14px;overflow:hidden}.row{display:grid;grid-template-columns:48px minmax(0,1fr) 46px 48px;gap:10px;align-items:center;padding:11px 10px;border-bottom:1px solid var(--line2);min-height:76px}.row:last-child{border-bottom:0}.topic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:4px;font-size:8.5px;font-weight:720;line-height:1.15;background:var(--green-soft);color:var(--green2)}.topic.market{background:var(--blue);color:var(--bluet)}.topic.daily{background:var(--amber);color:var(--ambert)}.topic.invest{background:var(--purple);color:var(--purplet)}.copy{min-width:0}.headline{font-size:11px;font-weight:720;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;align-items:center;gap:4px;margin-top:4px;height:16px;min-width:0}.publisher{max-width:92px;font-size:8.8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:999px;font-size:7.8px;font-weight:720;white-space:nowrap;border:1px solid var(--line)}.badge.official{background:var(--green-soft);color:var(--green2)}.badge.a{background:var(--blue);color:var(--bluet)}.badge.b{background:var(--purple);color:var(--purplet)}.badge.c{background:var(--soft);color:var(--muted)}.badge.cross{background:var(--amber);color:var(--ambert)}.snippet{margin-top:3px;font-size:9.2px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ago{font-size:9px;color:var(--muted);text-align:right;white-space:nowrap}.open{height:28px;border:1px solid var(--line);border-radius:8px;background:var(--green-soft);color:var(--green2);font-size:9.5px;font-weight:680;cursor:pointer}.empty{padding:34px;text-align:center;color:var(--muted);font-size:10.5px}.trend{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px;background:linear-gradient(180deg,var(--soft),var(--panel))}.trend-title{font-size:11px;font-weight:720;color:var(--green2);margin-bottom:10px}.quickgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.quick{border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:10px;text-decoration:none;color:inherit}.qt{font-size:9.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qs{margin-top:2px;font-size:8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footer{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-size:8.8px;color:var(--muted)}.source{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.retry{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 7px;font-size:8.5px}.controls{position:absolute;top:10px;right:-36px;display:flex;flex-direction:column;gap:7px;opacity:0;transform:translateX(6px);pointer-events:none;transition:.18s}.controls:before{content:"";position:absolute;left:-10px;top:0;width:10px;height:100%}.root:hover .controls,.root:focus-within .controls{opacity:1;transform:none;pointer-events:auto}.ctrl{position:relative;width:28px;height:28px;border:1px solid var(--line);border-radius:50%;background:var(--ctrl);display:grid;place-items:center;cursor:pointer}.ctrl svg{width:14px;height:14px}.ctrl[disabled]{opacity:.4}.ctrl:after{content:attr(data-tip);position:absolute;right:35px;top:50%;transform:translateY(-50%);padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-size:9px;color:var(--sub);white-space:nowrap;opacity:0;pointer-events:none}.ctrl:hover:after{opacity:1}@media(max-width:520px){.root{width:100%!important}.headline,.snippet{white-space:normal;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}.headline{-webkit-line-clamp:2}.snippet{-webkit-line-clamp:1}.quickgrid{grid-template-columns:1fr}}@media(max-width:430px){.row{grid-template-columns:44px minmax(0,1fr) 42px}.ago{display:none}.controls{right:7px;top:7px;opacity:1;transform:none;pointer-events:auto;flex-direction:row}.ctrl:after{display:none}.top{padding-right:126px}.settings{display:none}.tabs{overflow-x:auto}.tab{min-width:68px}}@media(hover:none),(pointer:coarse){.controls{opacity:1;transform:none;pointer-events:auto}}
</style></head><body><div class="root" id="root" data-size="normal"><div class="widget"><header class="top"><div><div class="title">News Link Hub</div><div class="subtitle">기사와 실시간 뉴스를 빠르게 연결하는 관문</div></div><button class="settings" id="settingsBtn">설정</button></header><nav class="tabs"><button class="tab active" data-tab="news">뉴스</button><button class="tab" data-tab="article">기사</button><button class="tab" data-tab="realtime">실시간</button><button class="tab" data-tab="opinion">오피니언</button></nav><div class="filters"><select id="region"><option value="all">● 전체</option><option value="kr">국내</option><option value="us">미국</option><option value="global">글로벌</option></select><select id="sort"><option value="trust">신뢰순</option><option value="new">최신순</option><option value="old">오래된순</option></select></div><section class="newsbox" id="newsbox"><div class="empty">뉴스를 불러오는 중...</div></section><section class="trend"><div class="trend-title">지금 많이 보는 기사</div><div class="quickgrid"><a class="quick" href="./market-events.html?theme=light" target="_blank"><div class="qt">오늘의 주요 일정</div><div class="qs">경제 캘린더 바로가기</div></a><a class="quick" href="./commodities-dashboard.html?theme=light" target="_blank"><div class="qt">지표 발표 요약</div><div class="qs">핵심 지표 한눈에 보기</div></a><a class="quick" href="./fear-greed-dashboard.html?theme=light" target="_blank"><div class="qt">시장 브리핑</div><div class="qs">오늘의 시장 정리</div></a></div></section><div class="footer"><div class="source" id="source">Source · Google News RSS · 신뢰필터 ON</div><button class="retry" id="retry" hidden>Retry</button></div></div><div class="controls"><button class="ctrl" id="sizeBtn" data-tip="Size"><svg viewBox="0 0 24 24" fill="none"><path d="M6 8h12M6 12h9M6 16h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><button class="ctrl" id="themeBtn" data-tip="Dark Mode"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3.7a8.3 8.3 0 1 0 8.3 8.3A6.5 6.5 0 1 1 12 3.7Z" stroke="currentColor" stroke-width="1.8"/></svg></button><button class="ctrl" id="lockBtn" data-tip="Lock"><svg viewBox="0 0 24 24" fill="none"><path d="M7 11V8.5a5 5 0 0 1 10 0V11" stroke="currentColor" stroke-width="1.8"/><rect x="5" y="11" width="14" height="9" rx="2.5" stroke="currentColor" stroke-width="1.8"/></svg></button><button class="ctrl" id="resetBtn" data-tip="Reset"><svg viewBox="0 0 24 24" fill="none"><path d="M19 7v4h-4M5 17v-4h4M17.5 9A6.5 6.5 0 0 0 6.6 7L5 11M6.5 15A6.5 6.5 0 0 0 17.4 17L19 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div></div><script>
const F={generated_at:new Date().toISOString(),source:'Google News RSS',stale:false,items:[{tab:'news',region:'kr',topic:'미 연준',topic_class:'',title:'연합뉴스 주요 경제 뉴스',snippet:'신뢰도 필터가 적용된 뉴스 데이터가 곧 표시됩니다.',url:'https://www.yna.co.kr/',published_at:new Date().toISOString(),source:'연합뉴스',source_tier:'A',source_score:90,official_source:false,trusted_source:true,cross_confirmed:false,cross_count:1,ranking_score:90}]};const K='widget.newsLinkHub.controls.v2',R=document.getElementById('root'),Q=new URLSearchParams(location.search),OS=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';let cfg={theme:Q.get('theme')||OS,size:'normal',locked:false};try{cfg={...cfg,...JSON.parse(localStorage.getItem(K)||'{}')}}catch{}let st={tab:'news',region:'all',sort:'trust',data:F};const $=id=>document.getElementById(id);function save(){localStorage.setItem(K,JSON.stringify(cfg))}function theme(v){document.documentElement.dataset.theme=v;cfg.theme=v;save()}function size(v){R.dataset.size=v;cfg.size=v;save();$('sizeBtn').disabled=cfg.locked}function lock(v){cfg.locked=v;save();$('sizeBtn').disabled=v;$('lockBtn').dataset.tip=v?'Unlock':'Lock'}theme(cfg.theme);size(cfg.size);lock(cfg.locked);$('themeBtn').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');$('sizeBtn').onclick=()=>{if(cfg.locked)return;let a=['compact','normal','large'];size(a[(a.indexOf(cfg.size)+1)%3])};$('lockBtn').onclick=()=>lock(!cfg.locked);$('resetBtn').onclick=()=>{cfg={theme:Q.get('theme')||OS,size:'normal',locked:false};theme(cfg.theme);size('normal');lock(false)};$('settingsBtn').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});$('region').onchange=e=>{st.region=e.target.value;render()};$('sort').onchange=e=>{st.sort=e.target.value;render()};function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function ago(i){let m=Math.max(0,Math.round((Date.now()-new Date(i))/60000));if(m<1)return'방금';if(m<60)return m+'분 전';let h=Math.floor(m/60);return h<24?h+'시간 전':Math.floor(h/24)+'일 전'}function score(x){if(Number.isFinite(Number(x.ranking_score)))return Number(x.ranking_score);let n=Number(x.source_score||0);if(x.official_source)n+=35;if(x.cross_confirmed)n+=28+Math.min(12,4*Math.max(0,Number(x.cross_count||2)-2));return n}function badges(x){let a=[];if(x.official_source)a.push('<span class="badge official">공식</span>');else if(x.source_tier==='A')a.push('<span class="badge a">A</span>');else if(x.source_tier==='B')a.push('<span class="badge b">B</span>');else a.push('<span class="badge c">C</span>');if(x.cross_confirmed)a.push(`<span class="badge cross" title="${esc((x.cross_sources||[]).join(' · '))}">교차확인 ${Number(x.cross_count||2)}</span>`);return a.join('')}function render(){let a=(st.data.items||[]).filter(x=>x.tab===st.tab);if(st.region!=='all')a=a.filter(x=>x.region===st.region);if(st.sort==='trust')a.sort((x,y)=>score(y)-score(x)||new Date(y.published_at)-new Date(x.published_at));else a.sort((x,y)=>(new Date(y.published_at)-new Date(x.published_at))*(st.sort==='new'?1:-1));a=a.slice(0,4);if(!a.length){$('newsbox').innerHTML='<div class="empty">현재 표시할 뉴스가 없어요.</div>';return}$('newsbox').innerHTML=a.map(x=>`<article class="row"><div class="topic ${esc(x.topic_class||'')}">${esc(x.topic||'뉴스').replace(/\n/g,'<br>')}</div><div class="copy"><div class="headline">${esc(x.title)}</div><div class="meta"><span class="publisher">${esc(x.source||'출처 미상')}</span>${badges(x)}</div><div class="snippet">${esc(x.snippet||'')}</div></div><div class="ago">${ago(x.published_at)}</div><button class="open" data-url="${esc(x.url)}">열기 ↗</button></article>`).join('');document.querySelectorAll('.open').forEach(b=>b.onclick=()=>window.open(b.dataset.url,'_blank','noopener,noreferrer'))}async function load(){try{let r=await fetch('./news-link-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);let d=await r.json();st.data={...F,...d,items:d.items?.length?d.items:F.items};let q=d.quality||{},n=[];if(q.official)n.push('공식 '+q.official);if(q.cross_confirmed)n.push('교차확인 '+q.cross_confirmed);$('source').textContent=`Source · ${d.source||'Google News RSS'} · 신뢰필터 ON${n.length?' · '+n.join(' · '):''} · ${ago(d.generated_at)}`;$('retry').hidden=!d.stale}catch(e){st.data=F;$('source').textContent='Source · cached fallback · 신뢰필터 대기';$('retry').hidden=false}render()}$('retry').onclick=load;load();
</script></body></html>
