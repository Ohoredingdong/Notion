<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Daily French Word</title>
<style>
:root{--panel:#fff;--text:#171717;--sub:#737373;--muted:#a3a3a3;--line:#e7e5e4;--soft:#f7f7f5;--accent:#7b768f;--shadow:0 8px 24px rgba(17,24,39,.08);--card-w:360px}
html[data-theme="dark"]{--panel:#20201f;--text:#f2f2ef;--sub:#b8b8b2;--muted:#8b8b85;--line:#343432;--soft:#292927;--accent:#bcb6d0;--shadow:0 8px 24px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:6px;color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:auto}button,select{font:inherit;color:inherit}
.stage{width:calc(var(--card-w) + 42px);margin:0 auto;transition:width .18s ease}.shell{position:relative;width:var(--card-w);transition:width .18s ease}.widget{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px 9px;overflow:hidden;box-shadow:var(--shadow)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.label{font-size:7px;font-weight:700;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}.navs{display:flex;gap:4px}.nav{width:18px;height:18px;padding:0;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;border-radius:6px}.nav:hover{background:var(--soft);color:var(--text)}.wordrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.word{font-family:Georgia,"Times New Roman",serif;font-size:24px;line-height:1;font-weight:700;letter-spacing:-.035em}.speaker{width:24px;height:24px;border:0;border-radius:8px;background:var(--soft);color:var(--sub);display:grid;place-items:center;cursor:pointer}.speaker svg,.mini svg,.ctrl svg{width:11px;height:11px}.ipa{margin-top:4px;font-size:8px;color:var(--muted)}.meaning{margin-top:9px;font-size:11px;font-weight:700;line-height:1.45}.nuance{margin-top:3px;font-size:8.5px;color:var(--sub);line-height:1.45}.divider{height:1px;background:var(--line);margin:9px 0 7px}.examples{display:grid;gap:7px}.example{position:relative;padding-right:18px}.fr{font-size:8.8px;line-height:1.4;font-weight:700}.ko{margin-top:1px;font-size:8px;line-height:1.4;color:var(--sub)}.mini{position:absolute;right:0;top:0;width:17px;height:17px;border:0;background:transparent;color:var(--muted);padding:0;display:grid;place-items:center;cursor:pointer;border-radius:5px}.mini:hover{background:var(--soft);color:var(--text)}.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}.status{font-size:7px;color:var(--muted)}.select{max-width:135px;border:0;background:transparent;outline:0;color:var(--muted);font-size:8px;text-align:right}
.tools{position:absolute;top:10px;left:calc(100% + 8px);display:flex;flex-direction:column;gap:8px;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-4px);transition:opacity .16s ease,transform .16s ease,visibility .16s ease}.stage:hover .tools,.stage:focus-within .tools{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0)}.ctrl{width:28px;height:28px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--sub);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);padding:0}.ctrl:hover{background:var(--soft);color:var(--text)}.ctrl.active{border-color:var(--accent);color:var(--accent);background:var(--soft)}.ctrl[disabled]{opacity:.4;cursor:not-allowed}
@media(hover:none){.tools{opacity:1;visibility:visible;pointer-events:auto;transform:none}}@media(max-width:420px){body{padding:4px}.stage{margin-left:0}}
</style></head><body>
<div class="stage"><div class="shell"><main class="widget" id="widget"><div class="top"><div class="label">French word of the day</div><div class="navs"><button class="nav" id="prev" aria-label="이전 단어">‹</button><button class="nav" id="next" aria-label="다음 단어">›</button></div></div><div class="wordrow"><div><div class="word" id="word">chargement</div><div class="ipa" id="ipa">—</div></div><button class="speaker" id="speak" aria-label="발음 듣기"><svg viewBox="0 0 24 24" fill="none"><path d="M5 9.5v5h3l4 3.5V6L8 9.5H5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 9c1.2 1.1 1.2 4.9 0 6M17.8 6.8c2.4 2.5 2.4 7.9 0 10.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div><div class="meaning" id="meaning">단어 데이터를 불러오는 중…</div><div class="nuance" id="nuance"></div><div class="divider"></div><section class="examples" id="examples"></section><div class="footer"><div class="status" id="status">loading</div><select class="select" id="select" aria-label="단어 선택"></select></div></main>
<aside class="tools"><button class="ctrl" id="sizeBtn" aria-label="크기 변경" title="크기 변경"><svg viewBox="0 0 24 24" fill="none"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="ctrl" id="themeBtn" aria-label="다크 모드" title="다크 모드"><svg viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="ctrl" id="lockBtn" aria-label="크기 잠금" title="크기 잠금"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 11V8a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button><button class="ctrl" id="resetBtn" aria-label="초기화" title="초기화"><svg viewBox="0 0 24 24" fill="none"><path d="M20 11a8 8 0 1 1-2.34-5.66L20 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 4v4h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></aside></div></div>
<script>
const DATA_FILES=['french-words-1.json','french-words-2.json','french-words-3.json','french-words-4.json','french-words-5.json','french-words-extra.json'];const STORAGE_KEY='french-word-widget-v1',SIZE_STEPS=[360,320,280],qs=new URLSearchParams(location.search),$=s=>document.querySelector(s);let WORDS=[],index=0,current=null;const icon=`<svg viewBox="0 0 24 24" fill="none"><path d="M5 9.5v5h3l4 3.5V6L8 9.5H5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 9c1.2 1.1 1.2 4.9 0 6M17.8 6.8c2.4 2.5 2.4 7.9 0 10.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`;let prefs=loadPrefs();
function loadPrefs(){try{return Object.assign({theme:'light',sizeIndex:0,locked:false},JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'))}catch{return{theme:'light',sizeIndex:0,locked:false}}}function savePrefs(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(prefs))}catch{}}
function applyPrefs(){const q=qs.get('theme');if((q==='light'||q==='dark')&&!localStorage.getItem(STORAGE_KEY))prefs.theme=q;document.documentElement.dataset.theme=prefs.theme;document.documentElement.style.setProperty('--card-w',SIZE_STEPS[prefs.sizeIndex]+'px');$('#themeBtn').classList.toggle('active',prefs.theme==='dark');$('#lockBtn').classList.toggle('active',prefs.locked);$('#sizeBtn').disabled=!!prefs.locked}
function daySeed(){const d=new Date();return Number(`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`)}function todayIndex(){if(!WORDS.length)return 0;let x=Math.sin(daySeed()*12.9898)*43758.5453;return Math.floor((x-Math.floor(x))*WORDS.length)}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function say(t){if(!('speechSynthesis'in window)||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.88;const voices=speechSynthesis.getVoices(),v=voices.find(x=>/fr-FR/i.test(x.lang))||voices.find(x=>/^fr/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
async function loadData(){const results=await Promise.allSettled(DATA_FILES.map(async f=>{const r=await fetch(new URL(f,location.href),{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);const d=await r.json();return Array.isArray(d)?d:[]}));WORDS=results.filter(x=>x.status==='fulfilled').flatMap(x=>x.value);const seen=new Set();WORDS=WORDS.filter(w=>w&&w.word&&!seen.has(w.word)&&(seen.add(w.word),true));if(!WORDS.length)throw new Error('no data')}
function renderOptions(){$('#select').innerHTML=WORDS.map((w,i)=>`<option value="${i}">${w.word}</option>`).join('')}function render(){const w=WORDS[index];current=w;$('#select').value=String(index);$('#word').textContent=w.word;$('#ipa').textContent=w.ipa||'';$('#meaning').textContent=w.meaning||'';$('#nuance').textContent=w.nuance||'';$('#examples').innerHTML=(w.examples||[]).slice(0,4).map((x,i)=>`<div class="example"><div class="fr">${esc(x[0])}</div><div class="ko">${esc(x[1])}</div><button class="mini" data-i="${i}" aria-label="예문 발음 듣기">${icon}</button></div>`).join('');document.querySelectorAll('.mini').forEach(b=>b.onclick=()=>say(w.examples[+b.dataset.i][0]));$('#status').textContent=WORDS.length+' words'}
function move(d){index=(index+d+WORDS.length)%WORDS.length;render()}function cycleSize(){if(prefs.locked)return;prefs.sizeIndex=(prefs.sizeIndex+1)%SIZE_STEPS.length;applyPrefs();savePrefs()}function toggleTheme(){prefs.theme=prefs.theme==='dark'?'light':'dark';applyPrefs();savePrefs()}function toggleLock(){prefs.locked=!prefs.locked;applyPrefs();savePrefs()}function resetAll(){prefs={theme:'light',sizeIndex:0,locked:false};applyPrefs();index=todayIndex();render();savePrefs()}
(async function boot(){applyPrefs();try{await loadData();renderOptions();index=todayIndex();render()}catch(e){$('#word').textContent='erreur';$('#meaning').textContent='단어 데이터를 불러오지 못했습니다.';$('#status').textContent='data error'}})();$('#prev').onclick=()=>WORDS.length&&move(-1);$('#next').onclick=()=>WORDS.length&&move(1);$('#select').onchange=e=>{index=+e.target.value;render()};$('#speak').onclick=()=>say(current?.word);$('#sizeBtn').onclick=cycleSize;$('#themeBtn').onclick=toggleTheme;$('#lockBtn').onclick=toggleLock;$('#resetBtn').onclick=()=>WORDS.length&&resetAll();
</script></body></html>
