<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Supply Chain Pulse</title>
<style>
:root{
  --panel:#fff;--line:#ece9e3;--line2:#f3f1ec;--soft:#faf9f6;
  --text:#31363a;--sub:#7b7f84;--muted:#a6aaae;
  --green:#6d9d6d;--green2:#518154;--green-soft:#eef5ee;
  --amber:#d9ad52;--amber-soft:#fbf3df;--red:#d98a86;--red-soft:#fbeeee;
  --blue:#7f98c4;--blue-soft:#eef2f9;--ctrl:rgba(255,255,255,.95)
}
html[data-theme="dark"]{
  --panel:#202120;--line:#383733;--line2:#2c2c29;--soft:#282926;
  --text:#efefeb;--sub:#c2c4bf;--muted:#8d908d;
  --green:#8abc89;--green2:#9ccc98;--green-soft:#273426;
  --amber:#e0c470;--amber-soft:#3a3020;--red:#e6948f;--red-soft:#392726;
  --blue:#9ab0d5;--blue-soft:#222d3a;--ctrl:rgba(35,35,33,.95)
}
*{box-sizing:border-box}html,body{margin:0;background:transparent}
body{padding:8px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.root{position:relative;width:min(100%,560px);margin:auto}.root[data-size=compact]{width:min(100%,520px)}.root[data-size=large]{width:min(100%,620px)}
.widget{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 16px 12px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.title{font-size:19px;font-weight:770;letter-spacing:-.03em}.subtitle{margin-top:4px;font-size:11.5px;color:var(--sub)}.update{font-size:10px;color:var(--muted);white-space:nowrap;padding-top:2px}
.topgrid{display:grid;grid-template-columns:1fr 1.06fr;gap:10px;margin-top:14px}
.card,.mini{border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.card{padding:14px}.ct{font-size:11.5px;font-weight:730;margin-bottom:12px}
.metricrow{display:flex;justify-content:space-between;gap:10px;align-items:center}.metric{display:flex;align-items:flex-end;gap:4px}
.metric .n{font-size:25px;font-weight:790;line-height:1;letter-spacing:-.04em}.metric .u{font-size:10.5px;color:var(--sub);padding-bottom:3px}
.badge{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:9.5px;font-weight:720;white-space:nowrap}
.badge.good{background:var(--green-soft);color:var(--green2)}.badge.warn{background:var(--amber-soft);color:#b1842e}.badge.bad{background:var(--red-soft);color:var(--red)}.badge.info{background:var(--blue-soft);color:var(--blue)}
.subline{margin-top:8px;font-size:9.5px;color:var(--muted);line-height:1.35}
.spark{height:126px}.spark svg{width:100%;height:100%;display:block}.grid line{stroke:var(--line2);stroke-width:1}.grid text{fill:var(--muted);font-size:8.5px}
.labels{display:flex;justify-content:space-between;margin-top:6px;font-size:8.5px;color:var(--muted)}
.bottom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}.mini{padding:11px 12px 10px}
.mt{font-size:10.8px;font-weight:720}.big{margin-top:10px;font-size:18px;font-weight:780;letter-spacing:-.03em;line-height:1.05}.unit{font-size:9.5px;color:var(--sub);font-weight:550}
.mrow{display:flex;justify-content:space-between;gap:8px;align-items:flex-end;margin-top:8px}.note{font-size:8.8px;color:var(--muted);line-height:1.25}.delta{font-size:9.5px;font-weight:720;white-space:nowrap}.delta.good{color:var(--green2)}.delta.bad{color:var(--red)}
.sources{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:8.8px;color:var(--muted)}
.sources a{color:inherit;text-decoration:none}.sources a:hover{text-decoration:underline}
.controls{position:absolute;top:10px;right:-36px;display:flex;flex-direction:column;gap:7px;opacity:0;transform:translateX(6px);pointer-events:none;transition:.18s}.controls:before{content:"";position:absolute;left:-10px;top:0;width:10px;height:100%}
.root:hover .controls,.root:focus-within .controls{opacity:1;transform:none;pointer-events:auto}
.ctrl{position:relative;width:28px;height:28px;border:1px solid var(--line);border-radius:50%;background:var(--ctrl);display:grid;place-items:center;cursor:pointer}.ctrl svg{width:14px;height:14px}.ctrl[disabled]{opacity:.42}
.ctrl:after{content:attr(data-tip);position:absolute;right:35px;top:50%;transform:translateY(-50%);padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-size:9px;color:var(--sub);white-space:nowrap;opacity:0;pointer-events:none}.ctrl:hover:after{opacity:1}
.loading,.error{padding:36px 8px;text-align:center;color:var(--muted);font-size:11px}
@media(max-width:560px){.root{width:100%!important}.topgrid,.bottom{grid-template-columns:1fr}}
@media(max-width:430px){.controls{right:7px;top:7px;opacity:1;transform:none;pointer-events:auto;flex-direction:row}.ctrl:after{display:none}.top{padding-right:126px}}
@media(hover:none),(pointer:coarse){.controls{opacity:1;transform:none;pointer-events:auto}}
</style>
</head>
<body>
<div class="root" id="root" data-size="normal">
  <div class="widget">
    <header class="top">
      <div><div class="title">Supply Chain Pulse</div><div class="subtitle">공식·검증 가능한 공급망 지표만 표시합니다.</div></div>
      <div class="update" id="updated">업데이트 확인 중</div>
    </header>
    <div id="content" class="loading">데이터를 불러오는 중...</div>
  </div>
  <div class="controls">
    <button class="ctrl" id="sizeBtn" data-tip="Size"><svg viewBox="0 0 24 24" fill="none"><path d="M6 8h12M6 12h9M6 16h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button class="ctrl" id="themeBtn" data-tip="Dark Mode"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3.7a8.3 8.3 0 1 0 8.3 8.3A6.5 6.5 0 1 1 12 3.7Z" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button class="ctrl" id="lockBtn" data-tip="Lock"><svg viewBox="0 0 24 24" fill="none"><path d="M7 11V8.5a5 5 0 0 1 10 0V11" stroke="currentColor" stroke-width="1.8"/><rect x="5" y="11" width="14" height="9" rx="2.5" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button class="ctrl" id="resetBtn" data-tip="Reset"><svg viewBox="0 0 24 24" fill="none"><path d="M19 7v4h-4M5 17v-4h4M17.5 9A6.5 6.5 0 0 0 6.6 7L5 11M6.5 15A6.5 6.5 0 0 0 17.4 17L19 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div>
</div>
<script>
const KEY='widget.supplyChainPulse.controls.v3',root=document.getElementById('root'),q=new URLSearchParams(location.search),os=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
let cfg={theme:q.get('theme')||os,size:'normal',locked:false};try{cfg={...cfg,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}
function save(){localStorage.setItem(KEY,JSON.stringify(cfg))}function theme(v){document.documentElement.dataset.theme=v;cfg.theme=v;save()}function size(v){root.dataset.size=v;cfg.size=v;save();sizeBtn.disabled=cfg.locked}function lock(v){cfg.locked=v;save();sizeBtn.disabled=v;lockBtn.dataset.tip=v?'Unlock':'Lock'}
const sizeBtn=document.getElementById('sizeBtn'),themeBtn=document.getElementById('themeBtn'),lockBtn=document.getElementById('lockBtn'),resetBtn=document.getElementById('resetBtn');theme(cfg.theme);size(cfg.size);lock(cfg.locked);
themeBtn.onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');sizeBtn.onclick=()=>{if(cfg.locked)return;let a=['compact','normal','large'];size(a[(a.indexOf(cfg.size)+1)%3])};lockBtn.onclick=()=>lock(!cfg.locked);resetBtn.onclick=()=>{cfg={theme:q.get('theme')||os,size:'normal',locked:false};theme(cfg.theme);size('normal');lock(false)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function badge(s,t){return `<span class="badge ${t}">${esc(s)}</span>`}
function rel(iso){let m=Math.max(0,Math.round((Date.now()-new Date(iso))/60000));if(m<60)return m<2?'방금 전':m+'분 전';let h=Math.floor(m/60);return h<24?h+'시간 전':Math.floor(h/24)+'일 전'}
function chart(vals){let w=232,h=118,l=23,b=17,t=8,max=2,min=0,uw=h-b-t;let y=v=>t+(max-v)/(max-min)*uw;let bars='',lines='';[0,1,2].forEach(v=>{lines+=`<line x1="${l}" x2="${w-4}" y1="${y(v)}" y2="${y(v)}"/><text x="2" y="${y(v)+3}">${v.toFixed(0)}</text>`});vals.forEach((v,i)=>{let bw=18,g=13,x=l+i*(bw+g),yy=y(Math.max(0,v)),bh=h-b-yy;bars+=`<rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(2,bh)}" rx="2" fill="${i===vals.length-1?'var(--amber)':'rgba(109,157,109,.25)'}"/>`});return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><g class="grid">${lines}</g>${bars}</svg>`}
function render(d){
  updated.textContent=`업데이트 · ${rel(d.generated_at)}`;
  let g=d.gscpi,s=d.supplier_deliveries,w=d.wci,p=d.ism_prices;
  let gChange=(g.value-g.previous).toFixed(2), gTone=g.value<g.previous?'good':'bad', gText=g.value<g.previous?'압력 완화':'압력 확대';
  content.outerHTML=`<div id="content">
    <div class="topgrid">
      <section class="card">
        <div class="ct">글로벌 공급망 압력 (GSCPI)</div>
        <div class="metricrow"><div class="metric"><span class="n">${g.value.toFixed(2)}</span><span class="u">표준편차</span></div>${badge(gText,gTone)}</div>
        <div class="subline">전월 ${g.previous.toFixed(2)} · 변화 ${Number(gChange)>0?'+':''}${gChange}<br>0 = 장기 평균, 양수 = 평균보다 높은 압력</div>
      </section>
      <section class="card">
        <div class="ct">최근 6개월 GSCPI 추이</div>
        <div class="spark">${chart(g.history.map(x=>x.value))}</div>
        <div class="labels">${g.history.map(x=>`<span>${esc(x.label)}</span>`).join('')}</div>
      </section>
    </div>
    <div class="bottom">
      <section class="mini"><div class="mt">공급 납기 · ISM</div><div class="big">${s.value.toFixed(1)} <span class="unit">index</span></div><div class="mrow"><div class="note">전월 ${s.previous.toFixed(1)}<br>50 초과 = 납기 지연</div><div class="delta bad">▲ ${s.change.toFixed(1)}p</div></div></section>
      <section class="mini"><div class="mt">해상운임 · Drewry WCI</div><div class="big">$${Number(w.value).toLocaleString()} <span class="unit">/40ft</span></div><div class="mrow"><div class="note">${esc(w.reference_date)}<br>주간 변화</div><div class="delta ${w.change_pct<=0?'good':'bad'}">${w.change_pct<=0?'▼':'▲'} ${Math.abs(w.change_pct).toFixed(0)}%</div></div></section>
      <section class="mini"><div class="mt">원가 부담 · ISM Prices</div><div class="big">${p.value.toFixed(1)} <span class="unit">index</span></div><div class="mrow"><div class="note">전월 ${p.previous.toFixed(1)}<br>50 초과 = 가격 상승</div><div class="delta ${p.change<=0?'good':'bad'}">${p.change<=0?'▼':'▲'} ${Math.abs(p.change).toFixed(1)}p</div></div></section>
    </div>
    <div class="sources"><div><a href="${esc(d.sources.nyfed)}" target="_blank">NY Fed</a> · <a href="${esc(d.sources.ism)}" target="_blank">ISM</a> · <a href="${esc(d.sources.drewry)}" target="_blank">Drewry</a></div><div>${esc(d.data_as_of)}</div></div>
  </div>`;
}
async function load(){try{let r=await fetch('./supply-chain-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){document.getElementById('content').className='error';document.getElementById('content').textContent='데이터를 불러오지 못했습니다.'}}
load();
</script>
</body>
</html>
