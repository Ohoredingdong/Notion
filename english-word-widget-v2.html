<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Daily English Word · Life Town v2</title>
<link rel="stylesheet" href="./assets/life-town-v2.css" />
<style>
:root{--panel:#fff;--text:#111113;--sub:#6e6e73;--muted:#a1a1a6;--line:#e7e7ea;--soft:#f7f7f8;--accent:#007aff;--green:#34c759;--shadow:0 12px 32px rgba(0,0,0,.055),0 1px 2px rgba(0,0,0,.035);--card-w:360px}
html[data-theme="dark"]{--panel:#1c1c1e;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--line:#38383a;--soft:#2c2c2e;--accent:#0a84ff;--green:#30d158;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:6px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:auto}button,select{font:inherit;color:inherit}.stage{width:calc(var(--card-w) + 44px);margin:0 auto;transition:width .18s ease}.shell{position:relative;width:var(--card-w);transition:width .18s ease;container-type:inline-size}.widget{position:relative;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:17px 17px 13px;overflow:hidden;box-shadow:var(--shadow)}.widget:before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,#b8b8bd 25%,#f6f6f8 50%,#b8b8bd 75%,transparent);opacity:.8}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.label{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:var(--sub);letter-spacing:-.01em}.label:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 9%,transparent)}.navs{display:flex;gap:3px}.nav{width:28px;height:28px;padding:0;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;border-radius:9px}.nav:hover{background:var(--soft);color:var(--text)}.wordrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.word{font-size:34px;line-height:.98;font-weight:720;letter-spacing:-.055em}.speaker{width:34px;height:34px;border:1px solid var(--line);border-radius:11px;background:var(--soft);color:var(--sub);display:grid;place-items:center;cursor:pointer}.speaker:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 24%,var(--line))}.speaker svg,.mini svg,.ctrl svg{width:14px;height:14px}.ipa{margin-top:7px;font-size:11px;color:var(--muted);letter-spacing:.01em}.meaning{margin-top:16px;font-size:14px;font-weight:720;line-height:1.5;letter-spacing:-.025em}.nuance{margin-top:4px;font-size:10.5px;color:var(--sub);line-height:1.5}.divider{height:1px;background:var(--line);margin:14px 0 11px}.examples{display:grid;gap:10px}.example{position:relative;padding-right:25px}.en{font-size:11.5px;line-height:1.45;font-weight:650}.ko{margin-top:2px;font-size:10px;line-height:1.45;color:var(--sub)}.mini{position:absolute;right:0;top:0;width:22px;height:22px;border:0;background:transparent;color:var(--muted);padding:0;display:grid;place-items:center;cursor:pointer;border-radius:7px}.mini:hover{background:var(--soft);color:var(--accent)}.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.status{font-size:9px;color:var(--muted)}.select{max-width:145px;border:0;background:transparent;outline:0;color:var(--sub);font-size:9px;text-align:right}.tools{position:absolute;top:10px;left:calc(100% + 8px);display:flex;flex-direction:column;gap:7px;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-4px);transition:.16s ease}.stage:hover .tools,.stage:focus-within .tools{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0)}.ctrl{width:30px;height:30px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--sub);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);padding:0}.ctrl:hover{background:var(--soft);color:var(--text)}.ctrl.active{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent);background:var(--soft)}.ctrl[disabled]{opacity:.4;cursor:not-allowed}@media(hover:none){.tools{opacity:1;visibility:visible;pointer-events:auto;transform:none}}@media(max-width:420px){body{padding:4px}.stage{margin-left:0}}@container(max-width:320px){.widget{padding:14px 13px 11px;border-radius:19px}.top{margin-bottom:15px}.word{font-size:29px}.meaning{font-size:12.5px;margin-top:13px}.examples{gap:8px}.en{font-size:10.5px}.ko{font-size:9px}}
</style></head><body>
<div class="stage"><div class="shell"><main class="widget" id="widget"><div class="top"><div class="label">오늘의 영어 단어</div><div class="navs"><button class="nav" id="prev" aria-label="이전 단어">‹</button><button class="nav" id="next" aria-label="다음 단어">›</button></div></div><div class="wordrow"><div><div class="word" id="word">loading</div><div class="ipa" id="ipa">—</div></div><button class="speaker" id="speak" aria-label="발음 듣기"><svg viewBox="0 0 24 24" fill="none"><path d="M5 9.5v5h3l4 3.5V6L8 9.5H5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 9c1.2 1.1 1.2 4.9 0 6M17.8 6.8c2.4 2.5 2.4 7.9 0 10.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button></div><div class="meaning" id="meaning">단어 데이터를 불러오는 중…</div><div class="nuance" id="nuance"></div><div class="divider"></div><section class="examples" id="examples"></section><div class="footer"><div class="status" id="status">loading</div><select class="select" id="select" aria-label="단어 선택"></select></div></main>
<aside class="tools"><button class="ctrl" id="sizeBtn" aria-label="크기 변경" title="크기 변경"><svg viewBox="0 0 24 24" fill="none"><path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="ctrl" id="themeBtn" aria-label="다크 모드" title="다크 모드"><svg viewBox="0 0 24 24" fill="none"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="ctrl" id="lockBtn" aria-label="크기 잠금" title="크기 잠금"><svg viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 11V8a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button><button class="ctrl" id="resetBtn" aria-label="초기화" title="초기화"><svg viewBox="0 0 24 24" fill="none"><path d="M20 11a8 8 0 1 1-2.34-5.66L20 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 4v4h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></aside></div></div>
<script>
const DATA_FILES=['english-words-1.json','english-words-2.json','english-words-3.json','english-words-4.json','english-words-5.json','english-words-extra.json'];const STORAGE_KEY='english-word-widget-controls-v4',SIZE_STEPS=[360,320,280];const qs=new URLSearchParams(location.search),$=s=>document.querySelector(s);let WORDS=[],index=0,current=null;const icon=`<svg viewBox="0 0 24 24" fill="none"><path d="M5 9.5v5h3l4 3.5V6L8 9.5H5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15 9c1.2 1.1 1.2 4.9 0 6M17.8 6.8c2.4 2.5 2.4 7.9 0 10.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`;let prefs=loadPrefs();
function loadPrefs(){try{return Object.assign({theme:'light',sizeIndex:0,locked:false,index:null},JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'))}catch{return{theme:'light',sizeIndex:0,locked:false,index:null}}}function savePrefs(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(prefs))}catch{}}
function applyPrefs(){const q=qs.get('theme');if((q==='light'||q==='dark')&&!localStorage.getItem(STORAGE_KEY))prefs.theme=q;document.documentElement.dataset.theme=prefs.theme;document.documentElement.style.setProperty('--card-w',SIZE_STEPS[prefs.sizeIndex]+'px');$('#themeBtn').classList.toggle('active',prefs.theme==='dark');$('#lockBtn').classList.toggle('active',prefs.locked);$('#sizeBtn').disabled=!!prefs.locked}
function todayIndex(){const d=new Date(),base=Date.UTC(2026,0,1),now=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());return WORDS.length?Math.abs(Math.floor((now-base)/86400000))%WORDS.length:0}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function say(t){if(!('speechSynthesis'in window)||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.92;const voices=speechSynthesis.getVoices(),v=voices.find(x=>/en-GB/i.test(x.lang))||voices.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
async function loadData(){const results=await Promise.allSettled(DATA_FILES.map(async f=>{const r=await fetch(new URL(f,location.href),{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);const d=await r.json();return Array.isArray(d)?d:[]}));WORDS=results.filter(x=>x.status==='fulfilled').flatMap(x=>x.value);const seen=new Set();WORDS=WORDS.filter(w=>w&&w.word&&!seen.has(w.word)&&(seen.add(w.word),true));if(!WORDS.length)throw new Error('no data')}
function renderOptions(){$('#select').innerHTML=WORDS.map((w,i)=>`<option value="${i}">${w.word}</option>`).join('')}function render(){const w=WORDS[index];current=w;$('#select').value=String(index);$('#word').textContent=w.word;$('#ipa').textContent=w.ipa||'';$('#meaning').textContent=w.meaning||'';$('#nuance').textContent=w.nuance||'';$('#examples').innerHTML=(w.examples||[]).slice(0,4).map((x,i)=>`<div class="example"><div class="en">${esc(x[0])}</div><div class="ko">${esc(x[1])}</div><button class="mini" data-i="${i}" aria-label="예문 발음 듣기">${icon}</button></div>`).join('');document.querySelectorAll('.mini').forEach(b=>b.onclick=()=>say(w.examples[+b.dataset.i][0]));$('#status').textContent=WORDS.length+' words';prefs.index=index;savePrefs()}
function move(d){index=(index+d+WORDS.length)%WORDS.length;render()}function cycleSize(){if(prefs.locked)return;prefs.sizeIndex=(prefs.sizeIndex+1)%SIZE_STEPS.length;applyPrefs();savePrefs()}function toggleTheme(){prefs.theme=prefs.theme==='dark'?'light':'dark';applyPrefs();savePrefs()}function toggleLock(){prefs.locked=!prefs.locked;applyPrefs();savePrefs()}function resetAll(){prefs={theme:'light',sizeIndex:0,locked:false,index:null};applyPrefs();index=todayIndex();render();savePrefs()}
(async function boot(){applyPrefs();try{await loadData();renderOptions();index=Number.isInteger(prefs.index)&&prefs.index>=0&&prefs.index<WORDS.length?prefs.index:todayIndex();render()}catch(e){$('#word').textContent='error';$('#meaning').textContent='단어 데이터를 불러오지 못했습니다.';$('#status').textContent='data error'}})();$('#prev').onclick=()=>WORDS.length&&move(-1);$('#next').onclick=()=>WORDS.length&&move(1);$('#select').onchange=e=>{index=+e.target.value;render()};$('#speak').onclick=()=>say(current?.word);$('#sizeBtn').onclick=cycleSize;$('#themeBtn').onclick=toggleTheme;$('#lockBtn').onclick=toggleLock;$('#resetBtn').onclick=()=>WORDS.length&&resetAll();
</script></body></html>
