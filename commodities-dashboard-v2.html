<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>원자재 · 원료 시세</title><style>
:root{--bg:#fff;--panel:#fff;--line:#eceae6;--soft:#f7f6f3;--soft2:#fbfbf9;--text:#242421;--sub:#70716c;--muted:#a1a19b;--green:#2f8f59;--greenbg:#eef8f1;--red:#d9625d;--redbg:#fceeed;--accent:#b68b53;--shadow:0 8px 24px rgba(20,20,18,.03)}html[data-theme=dark]{--bg:#1d1d1b;--panel:#20201e;--line:#34342f;--soft:#272724;--soft2:#232321;--text:#f2f2ed;--sub:#c0c2bb;--muted:#90918b;--green:#7bc697;--greenbg:#28382f;--red:#ef8a80;--redbg:#3c2b2a;--accent:#dfbd86;--shadow:none}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}.widget{width:min(100%,840px);margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:13px}.title{font-size:19px;font-weight:780;letter-spacing:-.035em}.subtitle{margin-top:5px;font-size:10px;color:var(--muted)}.meta{font-size:9px;color:var(--muted);white-space:nowrap;margin-top:2px}.layout{display:grid;grid-template-columns:250px 1fr;gap:12px}.list-panel,.detail{border:1px solid var(--line);border-radius:15px;background:var(--panel)}.list-panel{padding:10px}.section-head{display:flex;justify-content:space-between;align-items:center;padding:2px 3px 8px}.section-title{font-size:11px;font-weight:750}.section-sub{font-size:8.5px;color:var(--muted)}.asset-list{display:grid;gap:4px}.asset{width:100%;border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 9px;display:grid;grid-template-columns:1fr auto;gap:8px;text-align:left;cursor:pointer;color:inherit}.asset:hover{background:var(--soft2)}.asset.active{background:var(--soft);border-color:var(--line)}.asset-main{min-width:0}.asset-name{font-size:10px;font-weight:680;white-space:nowrap}.asset-meta{margin-top:3px;font-size:8px;color:var(--muted);white-space:nowrap}.asset-side{text-align:right}.asset-price{font-size:10px;font-weight:760;font-variant-numeric:tabular-nums}.asset-change{display:inline-block;margin-top:4px;padding:2px 5px;border-radius:999px;font-size:8px;font-weight:720}.up{color:var(--green);background:var(--greenbg)}.down{color:var(--red);background:var(--redbg)}.detail{padding:14px 15px 12px}.detail-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.detail-kicker{font-size:8px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}.detail-name{margin-top:4px;font-size:15px;font-weight:760;letter-spacing:-.025em}.quote{text-align:right}.quote-price{font-size:24px;font-weight:790;letter-spacing:-.045em;font-variant-numeric:tabular-nums}.quote-change{margin-top:4px;font-size:9px;font-weight:740}.chart-head{display:flex;justify-content:space-between;align-items:center;margin-top:14px;margin-bottom:7px}.chart-label{font-size:9px;color:var(--sub);font-weight:680}.chart-range{font-size:8px;color:var(--muted)}.chart-wrap{height:132px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0 5px;position:relative}.chart{width:100%;height:100%;display:block;overflow:visible}.gridline{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}.line{fill:none;stroke:var(--accent);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}.area{fill:url(#areaFade)}.last-dot{fill:var(--accent);stroke:var(--panel);stroke-width:2}.axis{font-size:8px;fill:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:11px;border:1px solid var(--line);border-radius:11px;overflow:hidden}.stat{padding:9px 10px;border-right:1px solid var(--line)}.stat:last-child{border-right:0}.stat-label{font-size:8px;color:var(--muted)}.stat-value{margin-top:4px;font-size:10px;font-weight:720;font-variant-numeric:tabular-nums}.detail-footer{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:8px;color:var(--muted)}.stale{color:var(--red)}.global-footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:8.5px;color:var(--muted)}.loading{opacity:.55}@media(max-width:700px){.layout{grid-template-columns:1fr}.asset-list{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}}@media(max-width:460px){body{padding:4px}.widget{padding:12px;border-radius:13px}.asset-list{grid-template-columns:1fr}.quote-price{font-size:21px}.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}}
</style><link rel="stylesheet" href="./assets/life-town-v2.css" />

<style id="lt-v2-overrides">
:root{--bg:#fff;--panel:#fff;--line:#e7e7ea;--soft:#f7f7f8;--soft2:#fafafa;--text:#111113;--sub:#6e6e73;--muted:#a1a1a6;--green:#34c759;--greenbg:rgba(52,199,89,.08);--red:#ff3b30;--redbg:rgba(255,59,48,.07);--accent:#007aff;--shadow:0 12px 32px rgba(0,0,0,.055),0 1px 2px rgba(0,0,0,.035)}
body{padding:6px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.widget{position:relative;width:min(100%,840px);border-radius:24px;padding:18px;box-shadow:var(--shadow);overflow:hidden}.widget:before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,#b8b8bd 25%,#f6f6f8 50%,#b8b8bd 75%,transparent);opacity:.8}.title{font-size:19px;font-weight:760;letter-spacing:-.045em}.subtitle{font-size:10px;color:var(--muted)}.layout{gap:10px}.list-panel,.detail{border-radius:16px}.asset{border-radius:12px}.asset.active{background:rgba(0,122,255,.055);border-color:rgba(0,122,255,.16)}.asset-change{padding:3px 6px}.detail-kicker{color:var(--blue)}.chart-wrap{height:140px}.stats{border-radius:13px}.line{stroke:var(--blue)}.last-dot{fill:var(--blue)}
</style>
</head><body><main class="widget" id="widget"><header class="top"><div><div class="title">원자재 · 원료 시세</div><div class="subtitle">주요 원자재를 선택해 가격과 최근 7거래일 흐름을 확인하세요.</div></div><div class="meta" id="updated">Data 불러오는 중</div></header><section class="layout"><aside class="list-panel"><div class="section-head"><div class="section-title">Market</div><div class="section-sub">6 assets</div></div><div class="asset-list" id="assetList"></div></aside><article class="detail"><div class="detail-top"><div><div class="detail-kicker" id="detailGroup">—</div><div class="detail-name" id="detailName">—</div></div><div class="quote"><div class="quote-price" id="detailPrice">—</div><div class="quote-change" id="detailChange">—</div></div></div><div class="chart-head"><div class="chart-label">Price trend</div><div class="chart-range">최근 7거래일</div></div><div class="chart-wrap"><svg class="chart" id="chart" viewBox="0 0 560 132" preserveAspectRatio="none"></svg></div><div class="stats"><div class="stat"><div class="stat-label">전일 종가</div><div class="stat-value" id="prevClose">—</div></div><div class="stat"><div class="stat-label">7D 고가</div><div class="stat-value" id="weekHigh">—</div></div><div class="stat"><div class="stat-label">7D 저가</div><div class="stat-value" id="weekLow">—</div></div><div class="stat"><div class="stat-label">단위</div><div class="stat-value" id="unit">—</div></div></div><div class="detail-footer"><span id="symbolInfo">Symbol · —</span><span id="sourceInfo">Source · Yahoo Finance</span></div></article></section><footer class="global-footer"><span id="fxInfo">통화 USD · 환율 —</span><span id="timeInfo">Source · Yahoo Finance · Hourly</span></footer></main><script>
const theme=new URLSearchParams(location.search).get('theme');document.documentElement.dataset.theme=theme==='dark'?'dark':theme==='light'?'light':(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
const order=['금','은','구리','브렌트유','WTI 원유','천연가스'];const groups={'금':'Precious metal','은':'Precious metal','구리':'Industrial metal','브렌트유':'Energy','WTI 원유':'Energy','천연가스':'Energy'};let state={items:[],selected:'금',fx:0,sourceUpdated:null};
const $=s=>document.querySelector(s);function fmtPrice(v){return '$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}function fmtChange(v){const n=Number(v)||0;return `${n>=0?'▲':'▼'} ${Math.abs(n).toFixed(2)}%`}function fmtDateTime(v){const d=new Date(v);if(isNaN(d))return '—';return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function chartSvg(values){const a=(values||[]).slice(-7).map(Number).filter(Number.isFinite);if(a.length<2)return '';const W=560,H=132,l=8,r=8,t=10,b=20,min=Math.min(...a),max=Math.max(...a),range=max-min||1,pw=W-l-r,ph=H-t-b;const pts=a.map((v,i)=>({x:l+pw*i/(a.length-1),y:t+(max-v)/range*ph,v}));const d=pts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');const area=`${d} L ${pts.at(-1).x.toFixed(1)} ${H-b} L ${pts[0].x.toFixed(1)} ${H-b} Z`;let out=`<defs><linearGradient id="areaFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="currentColor" stop-opacity=".16"/><stop offset="100%" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>`;[0,.5,1].forEach(q=>{const y=t+q*ph;out+=`<line class="gridline" x1="${l}" y1="${y}" x2="${W-r}" y2="${y}"/>`});out+=`<path class="area" d="${area}"/><path class="line" d="${d}"/><circle class="last-dot" cx="${pts.at(-1).x}" cy="${pts.at(-1).y}" r="3.6"/>`;out+=`<text class="axis" x="${l}" y="${H-5}">7D ago</text><text class="axis" x="${W-r}" y="${H-5}" text-anchor="end">Latest</text>`;return out}
function renderList(){const list=$('#assetList');list.innerHTML=state.items.map(i=>`<button class="asset ${i.name===state.selected?'active':''}" data-name="${i.name}"><div class="asset-main"><div class="asset-name">${i.name}</div><div class="asset-meta">${groups[i.name]||''}</div></div><div class="asset-side"><div class="asset-price">${fmtPrice(i.price)}</div><div class="asset-change ${Number(i.change_pct)>=0?'up':'down'}">${fmtChange(i.change_pct)}</div></div></button>`).join('');list.querySelectorAll('.asset').forEach(btn=>btn.addEventListener('click',()=>{state.selected=btn.dataset.name;renderList();renderDetail()}))}
function renderDetail(){const i=state.items.find(x=>x.name===state.selected)||state.items[0];if(!i)return;const h=(i.history||[]).slice(-7).map(Number).filter(Number.isFinite);const prev=h.length>1?h[h.length-2]:i.price;const hi=h.length?Math.max(...h):i.price;const lo=h.length?Math.min(...h):i.price;$('#detailGroup').textContent=groups[i.name]||'Commodity';$('#detailName').textContent=i.name;$('#detailPrice').textContent=fmtPrice(i.price);$('#detailChange').textContent=fmtChange(i.change_pct);$('#detailChange').className='quote-change '+(Number(i.change_pct)>=0?'up':'down');$('#chart').innerHTML=chartSvg(h);$('#prevClose').textContent=fmtPrice(prev);$('#weekHigh').textContent=fmtPrice(hi);$('#weekLow').textContent=fmtPrice(lo);$('#unit').textContent=i.unit||'—';$('#symbolInfo').textContent=`Symbol · ${i.symbol||'—'}`;const ts=i.source_timestamp?new Date(i.source_timestamp*1000):state.sourceUpdated;$('#sourceInfo').innerHTML=`Source · Yahoo Finance · ${fmtDateTime(ts)}${i.stale?' · <span class="stale">stale</span>':''}`}
function renderAll(data){state.items=order.map(n=>(data.items||[]).find(i=>i.name===n)).filter(Boolean);state.fx=Number(data.fx||0);state.sourceUpdated=new Date(data.source_updated_at||data.updated_at||Date.now());if(!state.items.some(i=>i.name===state.selected)&&state.items[0])state.selected=state.items[0].name;renderList();renderDetail();$('#fxInfo').textContent=`통화 USD · 환율 ₩${state.fx.toLocaleString('ko-KR',{maximumFractionDigits:2})}`;$('#updated').textContent=`Data ${fmtDateTime(state.sourceUpdated)}`;$('#timeInfo').textContent=`Source · Yahoo Finance · Data ${fmtDateTime(state.sourceUpdated)} KST · Hourly`}
function placeholders(){state.items=order.map(name=>({name,price:0,change_pct:0,history:[],unit:'—',symbol:'—'}));renderList();$('#detailName').textContent='데이터 불러오는 중';$('#detailPrice').textContent='—'}
async function load(){placeholders();$('#widget').classList.add('loading');try{const r=await fetch('./commodities-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();renderAll(await r.json())}catch(e){$('#updated').textContent='데이터 불러오기 실패';$('#timeInfo').textContent='Source · Yahoo Finance · 재시도 필요'}$('#widget').classList.remove('loading')}load();
</script><script src="./assets/life-town-controls-v2.js"></script>
</body></html>
