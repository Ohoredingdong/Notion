<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Work Today · Life Town</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@700;800;900&display=swap');
  :root{--ink:#654631;--muted:#9b806b;--cream:#fffaf0;--paper:#f8f0df;--line:#e7d4b7;--yellow:#ffe9a8;--pink:#f8d8d2;--sage:#dfeacb;--wood:#c99a64;--wood-dark:#9a6843;--green:#8eae64;--blue:#cfe9f5;--shadow:0 10px 24px rgba(111,79,49,.12)}
  *{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink)}body{font-family:'Nunito',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:14px}button,input{font:inherit;color:inherit}button{cursor:pointer}
  .widget{max-width:980px;margin:0 auto;position:relative;overflow:hidden;background:linear-gradient(180deg,#fffdf8 0%,#fffaf1 100%);border:2px solid #ead9bc;border-radius:30px;padding:24px 26px 26px;box-shadow:0 12px 28px rgba(99,77,49,.10),inset 0 0 0 5px rgba(255,255,255,.65)}
  .widget:before{content:"";position:absolute;inset:10px;border:1px dashed rgba(163,124,83,.22);border-radius:22px;pointer-events:none}.cloud{position:absolute;font-size:30px;opacity:.75;filter:saturate(.75)}.cloud.left{left:34px;top:29px}.cloud.right{right:35px;top:30px}
  .header{position:relative;text-align:center;margin-bottom:20px;z-index:1}.brand-chip{display:inline-flex;align-items:center;gap:5px;background:#f9ecd2;border:1px solid #e7d1a9;border-radius:999px;padding:4px 10px;font-family:'Gaegu',cursive;font-size:16px;font-weight:700;box-shadow:0 3px 8px rgba(110,80,46,.08);margin-bottom:8px}
  .title-plaque{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:345px;padding:13px 36px 14px;border-radius:25px;background:#f7ead4;border:1px solid #e2c9a6;box-shadow:0 6px 13px rgba(115,85,55,.10),inset 0 0 0 4px rgba(255,255,255,.42)}
  .title-plaque:after{content:"";position:absolute;inset:7px;border:1.5px dashed #d9bd95;border-radius:18px;pointer-events:none}.title{position:relative;z-index:1;font-size:36px;font-weight:900;letter-spacing:-1.2px;text-shadow:0 2px 0 rgba(255,255,255,.75)}.plaque-flower{position:absolute;right:14px;top:7px;font-size:22px;z-index:2}.plaque-leaf{position:absolute;left:16px;bottom:8px;font-size:20px;z-index:2}.date-row{display:flex;justify-content:center;margin-top:8px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .top-area{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:10px}.sticky{position:relative;border-radius:22px;padding:18px 18px 16px;min-height:280px;box-shadow:var(--shadow);border:1px solid rgba(133,95,57,.10)}.sticky.today{background:linear-gradient(160deg,#fff2bd,#ffe6a0);transform:rotate(-.35deg)}.sticky.tomorrow{background:linear-gradient(160deg,#fbe4df,#f6d1cb);transform:rotate(.35deg)}.sticky.week{background:linear-gradient(160deg,#e8f0d8,#dbe8c8);margin-top:22px;min-height:150px;padding:20px 20px 18px}
  .sticky-curl{position:absolute;right:0;bottom:0;width:54px;height:54px;border-radius:0 0 22px 0;background:linear-gradient(135deg,rgba(255,255,255,.15) 0 47%,rgba(169,122,76,.13) 49% 53%,rgba(255,255,255,.63) 55% 100%);clip-path:polygon(100% 0,100% 100%,0 100%)}
  .tape{position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-1deg);width:105px;height:28px;border-radius:3px;opacity:.92;box-shadow:0 2px 4px rgba(90,64,36,.08)}.today .tape{background:repeating-linear-gradient(0deg,#f7d77f 0 11px,#fff0bd 11px 14px),repeating-linear-gradient(90deg,transparent 0 11px,rgba(255,255,255,.48) 11px 14px)}.tomorrow .tape{background:repeating-linear-gradient(0deg,#eeb9b0 0 11px,#fce7e2 11px 14px),repeating-linear-gradient(90deg,transparent 0 11px,rgba(255,255,255,.5) 11px 14px)}.week .tape{background:repeating-linear-gradient(0deg,#bcd0a4 0 11px,#edf3e2 11px 14px),repeating-linear-gradient(90deg,transparent 0 11px,rgba(255,255,255,.5) 11px 14px)}
  .sticky-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;padding:3px 5px 0}.sticky-title-wrap{display:flex;align-items:center;gap:8px}.sticky-title{font-family:'Gaegu',cursive;font-size:34px;font-weight:700;line-height:1}.sticky-date{font-size:11px;color:var(--muted);font-weight:900;background:rgba(255,255,255,.38);padding:6px 9px;border-radius:999px}.doodle{font-size:19px;opacity:.75}.divider{height:1px;border-top:2px dashed rgba(111,76,48,.30);margin:0 7px 10px}
  .task-list{display:flex;flex-direction:column;gap:8px;min-height:155px}.task{display:grid;grid-template-columns:28px minmax(0,1fr) 24px;align-items:center;gap:9px;padding:6px 7px;border-radius:11px;transition:.15s}.task:focus-within,.task:hover{background:rgba(255,255,255,.22)}.check{width:23px;height:23px;border-radius:50%;border:2px solid rgba(101,70,49,.67);background:rgba(255,255,255,.35);display:grid;place-items:center;padding:0;font-size:13px;font-weight:900;line-height:1}.check.done{background:var(--green);border-color:#7f9d5d;color:white}.task-input{border:0;outline:0;background:transparent;width:100%;min-width:0;font-family:'Gaegu',cursive;font-weight:700;font-size:22px;line-height:1.2;padding:2px 0}.task-input::placeholder{color:rgba(101,70,49,.35)}.task.done .task-input{text-decoration:line-through;opacity:.55}.remove{border:0;background:transparent;padding:0;font-size:20px;opacity:.38}.remove:hover{opacity:.75}
  .sticky-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:0 5px}.count{font-size:11px;color:var(--muted);font-weight:900}.add{border:0;background:rgba(255,255,255,.48);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:900;box-shadow:0 2px 0 rgba(101,70,49,.06)}.add:hover{background:rgba(255,255,255,.68)}
  .tip{position:absolute;top:48%;transform:translateY(-50%);width:125px;background:#fff7e8;border:1px solid #e7d1af;border-radius:13px;padding:10px 10px 11px;font-family:'Gaegu',cursive;font-weight:700;font-size:16px;line-height:1.2;box-shadow:0 7px 13px rgba(91,66,44,.08);z-index:2}.tip.left{left:-148px;transform:translateY(-50%) rotate(-3deg)}.tip.right{right:-148px;transform:translateY(-50%) rotate(3deg)}.tip small{display:block;font-family:'Nunito',sans-serif;font-size:17px;margin-top:6px}
  .week-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;padding:0 4px}.week .task-list{min-height:75px;display:contents}.week .task{padding:4px 6px}.week .task-input{font-size:20px}.week-deco{position:absolute;right:15px;bottom:10px;font-size:26px;opacity:.8}
  .archive{position:relative;margin-top:22px;background:linear-gradient(#d6ad7b,#bf8c5b);border:1px solid #aa774c;border-radius:22px 22px 27px 27px;padding:17px 18px 18px;box-shadow:0 9px 18px rgba(91,59,33,.18),inset 0 2px 0 rgba(255,255,255,.34)}.archive:before{content:"";position:absolute;left:12px;right:12px;top:47px;bottom:12px;background:#ead4b3;border-radius:16px;box-shadow:inset 0 7px 12px rgba(105,72,43,.18)}.archive-head{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.archive-label{position:absolute;left:50%;transform:translateX(-50%);top:-31px;min-width:210px;text-align:center;background:#f2dfbf;border:2px solid #b7895d;border-radius:15px;padding:6px 22px;font-family:'Gaegu',cursive;font-size:30px;font-weight:700;box-shadow:0 5px 8px rgba(91,58,34,.12)}.archive-actions{margin-left:auto;display:flex;gap:7px;position:relative;z-index:4}.archive-btn{border:1px solid rgba(113,76,46,.2);background:rgba(255,249,236,.74);border-radius:999px;padding:6px 10px;font-size:10px;font-weight:900}.archive-btn:hover{background:#fff8e9}
  .archive-list{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-height:135px;align-items:end}.archive-card{position:relative;background:#fffaf0;border:1px solid #dec9aa;border-radius:13px 13px 8px 8px;padding:17px 12px 12px;min-height:122px;box-shadow:0 5px 8px rgba(84,58,36,.10);overflow:hidden}.archive-card:nth-child(3n+2){background:#fbeee6}.archive-card:nth-child(3n+3){background:#eaf2f3}.paperclip{position:absolute;top:-5px;left:20px;width:12px;height:31px;border:3px solid #b57d4a;border-radius:8px;transform:rotate(9deg);background:transparent}.archive-card:nth-child(3n+2) .paperclip{border-color:#c8716d}.archive-card:nth-child(3n+3) .paperclip{border-color:#5c8fa5}.archive-date{font-size:10px;color:var(--muted);font-weight:900;margin:3px 0 7px}.archive-text{font-family:'Gaegu',cursive;font-size:20px;font-weight:700;line-height:1.08;word-break:break-word;padding-right:20px}.archive-status{margin-top:7px;font-size:9px;font-weight:900;color:#7d9b5d;text-transform:uppercase;letter-spacing:.06em}.archive-delete{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;border:1px solid rgba(101,70,49,.35);background:rgba(255,255,255,.45);font-size:13px;font-weight:900;display:grid;place-items:center;padding:0;opacity:.7}.archive-empty{grid-column:1/-1;align-self:center;justify-self:center;position:relative;z-index:2;background:rgba(255,249,238,.62);border:1px dashed rgba(101,70,49,.22);border-radius:13px;padding:15px 20px;font-family:'Gaegu',cursive;font-size:20px;text-align:center;max-width:480px}.grass{position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(180deg,transparent 0 10%,#91b365 45%,#73994e 100%);border-radius:0 0 25px 25px;opacity:.75;pointer-events:none}.flowers{position:absolute;bottom:2px;left:24px;right:24px;display:flex;justify-content:space-between;font-size:15px;pointer-events:none}
  @media (max-width:1260px){.tip{display:none}}@media (max-width:760px){body{padding:8px}.widget{padding:20px 14px 23px;border-radius:23px}.cloud{display:none}.title-plaque{min-width:0;width:min(100%,350px)}.title{font-size:31px}.top-area{grid-template-columns:1fr;gap:22px}.sticky.today,.sticky.tomorrow{transform:none}.week-grid{grid-template-columns:1fr}.archive-list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:440px){.archive-list{grid-template-columns:1fr}.sticky-title{font-size:31px}.task-input{font-size:20px}.title{font-size:28px}}
</style>
</head>
<body>
<div class="widget">
  <div class="cloud left">☁️</div><div class="cloud right">☁️</div>
  <header class="header"><div class="brand-chip">🌿 Life town 🌼</div><br /><div class="title-plaque"><span class="plaque-leaf">🌿</span><div class="title">Work Today</div><span class="plaque-flower">🌸</span></div><div class="date-row" id="headerDate"></div></header>
  <div class="top-area">
    <div class="tip left">Tomorrow's notes move here!<small>↪</small></div>
    <section class="sticky today"><div class="tape"></div><div class="sticky-curl"></div><div class="sticky-head"><div class="sticky-title-wrap"><span class="doodle">🌿</span><div class="sticky-title">Today</div></div><div class="sticky-date" id="todayDate"></div></div><div class="divider"></div><div class="task-list" id="todayList"></div><div class="sticky-footer"><span class="count" id="todayCount"></span><button class="add" data-add="today">＋ Add note</button></div></section>
    <section class="sticky tomorrow"><div class="tape"></div><div class="sticky-curl"></div><div class="sticky-head"><div class="sticky-title-wrap"><div class="sticky-title">Tomorrow</div><span class="doodle">♡</span></div><div class="sticky-date" id="tomorrowDate"></div></div><div class="divider"></div><div class="task-list" id="tomorrowList"></div><div class="sticky-footer"><span class="count" id="tomorrowCount"></span><button class="add" data-add="tomorrow">＋ Add note</button></div></section>
    <div class="tip right">Finished Today notes go to Archive!<small>↩</small></div>
  </div>
  <section class="sticky week"><div class="tape"></div><div class="week-deco">🌳🌼</div><div class="sticky-head"><div class="sticky-title-wrap"><span class="doodle">🌱</span><div class="sticky-title">This Week</div></div><div class="sticky-date" id="weekRange"></div></div><div class="divider"></div><div class="week-grid"><div class="task-list" id="weekList"></div></div><div class="sticky-footer"><span class="count" id="weekCount"></span><button class="add" data-add="week">＋ Add note</button></div></section>
  <section class="archive"><div class="archive-label">🌿 Archive 🌿</div><div class="archive-head"><span></span><div class="archive-actions"><button class="archive-btn" id="clearArchive">Clear all</button></div></div><div class="archive-list" id="archiveList"></div><div class="grass"></div><div class="flowers"><span>🌼</span><span>🌷</span><span>🌼</span><span>🌸</span></div></section>
</div>
<script>
(() => {
  const KEY='lifetown_work_today_v3';
  const uid=()=> (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`);
  const blank=()=>({id:uid(),text:'',done:false});
  const defaultState=()=>({lastDate:dateKey(new Date()),today:[blank()],tomorrow:[blank()],week:[blank()],archive:[]});
  let state=load();
  function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  function fromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
  function addDaysKey(k,n){const d=fromKey(k);d.setDate(d.getDate()+n);return dateKey(d)}
  function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.lastDate)return normalize(x)}catch(e){}return defaultState()}
  function normalize(x){for(const k of ['today','tomorrow','week','archive']) if(!Array.isArray(x[k])) x[k]=[];if(!x.today.length)x.today=[blank()];if(!x.tomorrow.length)x.tomorrow=[blank()];if(!x.week.length)x.week=[blank()];return x}
  function save(){localStorage.setItem(KEY,JSON.stringify(state))}
  function archiveDay(items,day){items.filter(t=>t.text.trim()).forEach(t=>state.archive.unshift({id:uid(),text:t.text.trim(),done:!!t.done,date:day}))}
  function rollover(){const now=dateKey(new Date());if(state.lastDate===now)return false;let guard=0;while(state.lastDate!==now&&guard<370){archiveDay(state.today,state.lastDate);state.today=state.tomorrow.filter(t=>t.text.trim()).map(t=>({id:uid(),text:t.text,done:t.done}));if(!state.today.length)state.today=[blank()];state.tomorrow=[blank()];state.lastDate=addDaysKey(state.lastDate,1);guard++}save();return true}
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function fmt(d,opt){return new Intl.DateTimeFormat('en-US',opt).format(d)}
  function renderDates(){const now=new Date(),tom=new Date(now);tom.setDate(now.getDate()+1);document.getElementById('headerDate').textContent=fmt(now,{weekday:'long',month:'long',day:'numeric'});document.getElementById('todayDate').textContent=fmt(now,{month:'short',day:'numeric'});document.getElementById('tomorrowDate').textContent=fmt(tom,{month:'short',day:'numeric'});const start=new Date(now);start.setDate(now.getDate()-now.getDay());const end=new Date(start);end.setDate(start.getDate()+6);document.getElementById('weekRange').textContent=`${fmt(start,{month:'short',day:'numeric'})} – ${fmt(end,{month:'short',day:'numeric'})}`}
  function taskRow(kind,t){const row=document.createElement('div');row.className=`task${t.done?' done':''}`;row.dataset.id=t.id;row.innerHTML=`<button class="check ${t.done?'done':''}" aria-label="Toggle task">${t.done?'✓':''}</button><input class="task-input" value="${esc(t.text)}" placeholder="Write a note..." /><button class="remove" aria-label="Delete task">×</button>`;row.querySelector('.check').onclick=()=>{t.done=!t.done;save();renderList(kind)};row.querySelector('.remove').onclick=()=>{state[kind]=state[kind].filter(x=>x.id!==t.id);if(!state[kind].length)state[kind]=[blank()];save();renderList(kind)};row.querySelector('.task-input').addEventListener('input',e=>{t.text=e.target.value;save();updateCount(kind)});return row}
  function renderList(kind){const root=document.getElementById(`${kind}List`);root.innerHTML='';state[kind].forEach(t=>root.appendChild(taskRow(kind,t)));updateCount(kind)}
  function updateCount(kind){const filled=state[kind].filter(t=>t.text.trim());const done=filled.filter(t=>t.done).length;document.getElementById(`${kind}Count`).textContent=filled.length?`${done} / ${filled.length} done`:'No notes yet'}
  function renderArchive(){const root=document.getElementById('archiveList');root.innerHTML='';if(!state.archive.length){const e=document.createElement('div');e.className='archive-empty';e.textContent='Today’s notes will be stored here when the date changes.';root.appendChild(e);document.getElementById('clearArchive').style.visibility='hidden';return}document.getElementById('clearArchive').style.visibility='visible';state.archive.forEach(a=>{const c=document.createElement('article');c.className='archive-card';c.innerHTML=`<span class="paperclip"></span><button class="archive-delete" aria-label="Delete archived note">×</button><div class="archive-date">${fmt(fromKey(a.date),{month:'short',day:'numeric',weekday:'short'})}</div><div class="archive-text">${esc(a.text)}</div>${a.done?'<div class="archive-status">Completed</div>':''}`;c.querySelector('.archive-delete').onclick=()=>{state.archive=state.archive.filter(x=>x.id!==a.id);save();renderArchive()};root.appendChild(c)})}
  function add(kind){state[kind].push(blank());save();renderList(kind);requestAnimationFrame(()=>{const inputs=document.querySelectorAll(`#${kind}List .task-input`);inputs[inputs.length-1]?.focus()})}
  function renderAll(){renderDates();renderList('today');renderList('tomorrow');renderList('week');renderArchive()}
  document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>add(b.dataset.add)));
  document.getElementById('clearArchive').onclick=()=>{if(!state.archive.length)return;if(confirm('Delete every archived note?')){state.archive=[];save();renderArchive()}};
  rollover();renderAll();setInterval(()=>{if(rollover())renderAll();else renderDates()},60000);
})();
</script>
</body>
</html>
