<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Work Today · Life Town</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap');
:root{
  --ink:#654631;--muted:#967963;--line:#ead7ba;
  --yellow:#f6e3a0;--pink:#f2d7d2;--sage:#dbe7c7;
  --wood:#cf9863;--wood-dark:#9a6339;--green:#88a966;
  --shadow:0 8px 20px rgba(103,74,47,.11)
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink)}
body{padding:5px;font-family:'Inter',system-ui,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.widget{
  width:100%;max-width:458px;margin:auto;position:relative;overflow:hidden;
  padding:15px 12px 11px;border:1px solid var(--line);border-radius:24px;
  background:
    radial-gradient(circle at 18% 10%,rgba(255,255,255,.72),transparent 31%),
    linear-gradient(180deg,#fffdf8 0%,#fff8ee 100%);
  box-shadow:var(--shadow),inset 0 0 0 3px rgba(255,255,255,.68)
}
.widget:before{
  content:"";position:absolute;inset:7px;border:1px dashed rgba(163,125,82,.22);border-radius:18px;pointer-events:none
}
.widget:after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.19;mix-blend-mode:multiply;
  background-image:
    radial-gradient(circle at 20% 20%,rgba(89,59,33,.18) 0 .45px,transparent .6px),
    radial-gradient(circle at 70% 35%,rgba(89,59,33,.12) 0 .45px,transparent .6px),
    repeating-linear-gradient(7deg,rgba(125,91,57,.035) 0 1px,transparent 1px 5px);
  background-size:7px 7px,11px 11px,100% 100%;
}
.header{position:relative;z-index:3;text-align:center;margin:2px 0 12px}
.plaque{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:230px;
  padding:10px 17px 11px;border:1px solid #e1c7a3;border-radius:18px;
  background:
    repeating-linear-gradient(0deg,rgba(136,99,64,.025) 0 1px,transparent 1px 4px),
    linear-gradient(#fbf1df,#f4e6cf);
  box-shadow:0 5px 12px rgba(100,70,43,.10),inset 0 0 0 3px rgba(255,255,255,.42);position:relative
}
.plaque:after{content:"";position:absolute;inset:5px;border:1px dashed rgba(174,136,91,.40);border-radius:13px}
.title{position:relative;z-index:2;font-family:'Nunito',sans-serif;font-size:24px;font-weight:900;letter-spacing:-.045em;text-shadow:0 1px 0 rgba(255,255,255,.78)}
.icon{width:18px;height:18px;position:relative;z-index:2;display:block}
.headDate{margin-top:6px;font-size:9px;font-weight:700;letter-spacing:.10em;color:var(--muted)}
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;position:relative;z-index:3}
.sticky{
  position:relative;min-width:0;border:1px solid rgba(151,108,66,.20);border-radius:17px 17px 20px 17px;
  padding:13px 9px 9px;box-shadow:0 8px 15px rgba(106,76,48,.11),inset 0 0 0 1px rgba(255,255,255,.18);overflow:visible
}
.sticky:before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.27;mix-blend-mode:multiply;
  background-image:
    radial-gradient(circle at 20% 25%,rgba(95,67,44,.18) 0 .45px,transparent .7px),
    radial-gradient(circle at 76% 55%,rgba(95,67,44,.13) 0 .4px,transparent .65px),
    repeating-linear-gradient(0deg,rgba(95,67,44,.035) 0 1px,transparent 1px 4px);
  background-size:7px 7px,11px 11px,100% 100%;
}
.today{background:linear-gradient(160deg,#faedb6 0%,#f4dc8f 100%);transform:rotate(-.25deg)}
.tomorrow{background:linear-gradient(160deg,#f7e2dd 0%,#efcec7 100%);transform:rotate(.25deg)}
.week{background:linear-gradient(160deg,#e6eed8 0%,#d5e2bd 100%);margin-top:10px;transform:rotate(-.08deg)}
.tape{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:61px;height:15px;border-radius:2px;opacity:.96;box-shadow:0 2px 3px rgba(70,50,34,.09)}
.tape:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.20) 0 5px,rgba(115,83,52,.05) 5px 6px);mix-blend-mode:multiply}
.today .tape{background:repeating-linear-gradient(0deg,#f2ce68 0 6px,#fff0b4 6px 9px)}
.tomorrow .tape{background:repeating-linear-gradient(0deg,#e9aca6 0 6px,#f8ded9 6px 9px)}
.week .tape{background:repeating-linear-gradient(0deg,#b8ca9f 0 6px,#e9f0db 6px 9px)}
.curl{position:absolute;right:-1px;bottom:-1px;width:38px;height:38px;border-radius:0 0 18px 0;clip-path:polygon(100% 0,100% 100%,0 100%);background:linear-gradient(135deg,transparent 0 46%,rgba(113,78,45,.14) 47% 51%,rgba(255,255,255,.80) 53% 100%);filter:drop-shadow(-2px -2px 2px rgba(92,62,36,.08));pointer-events:none}
.cardHead,.weekHead{display:flex;align-items:center;justify-content:space-between;gap:5px;position:relative;z-index:2}
.cardTitle{font:700 21px/1 'Gaegu',cursive;display:flex;align-items:center;gap:5px;letter-spacing:-.01em}
.decoSvg{width:14px;height:14px;opacity:.78;display:block}
.chip{flex:0 0 auto;border-radius:999px;background:rgba(255,249,237,.72);border:1px solid rgba(255,255,255,.45);padding:3px 6px;font-size:8px;font-weight:700;color:#997a64}
.dash{border-top:1.5px dashed rgba(115,79,52,.28);margin:6px 0 7px;position:relative;z-index:2}
.list{display:flex;flex-direction:column;gap:5px;min-height:73px;position:relative;z-index:2}.week .list{min-height:0}
.task{display:grid;grid-template-columns:16px minmax(0,1fr) 12px;align-items:center;gap:6px;padding:1px 0}
.check{width:16px;height:16px;padding:0;border-radius:50%;border:1.3px solid rgba(101,70,49,.70);background:rgba(255,255,255,.48);display:grid;place-items:center;font-size:9px}
.check.done{background:var(--green);border-color:#789653;color:white}
.task input{
  width:100%;min-width:0;border:0;outline:0;background:transparent;
  font:500 12.5px/1.35 'Inter',sans-serif;letter-spacing:-.01em;padding:2px 0;color:#5f4636
}
.task input::placeholder{color:rgba(101,70,49,.36);font-weight:400}
.task.done input{text-decoration:line-through;opacity:.58}
.x{border:0;background:transparent;padding:0;color:rgba(101,70,49,.34);font-size:12px;line-height:1}
.foot{display:flex;justify-content:flex-end;margin-top:5px;position:relative;z-index:2}.add{border:0;border-radius:999px;background:rgba(255,249,237,.68);border:1px solid rgba(255,255,255,.38);padding:4px 8px;font-size:8px;font-weight:700;color:#77543a}
.week .task input{font-size:12px}
.cornerDecor{position:absolute;right:9px;bottom:4px;width:30px;height:22px;opacity:.72;pointer-events:none;z-index:2}
.archive{
  position:relative;z-index:3;margin-top:13px;padding:14px 8px 8px;border-radius:14px 14px 19px 19px;border:1px solid #9f693d;
  background:
    repeating-linear-gradient(0deg,rgba(85,49,23,.055) 0 1px,transparent 1px 5px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 12px,rgba(92,56,28,.035) 12px 13px),
    linear-gradient(180deg,#d5a06d 0%,#b97943 100%);
  box-shadow:0 8px 16px rgba(93,57,31,.20),inset 0 2px 0 rgba(255,255,255,.23)
}
.archive:before{content:"";position:absolute;left:7px;right:7px;top:36px;bottom:7px;border-radius:10px 10px 14px 14px;background:linear-gradient(#ebd2af,#d4aa7a);box-shadow:inset 0 7px 11px rgba(91,58,34,.18)}
.archiveLabel{position:absolute;top:-13px;left:50%;transform:translateX(-50%);min-width:136px;text-align:center;padding:5px 14px;border-radius:11px;border:1.5px solid #9f7048;background:linear-gradient(#f6e8cf,#e8cba5);box-shadow:0 4px 7px rgba(90,57,33,.14);font:700 19px/1 'Gaegu',cursive;z-index:4}
.archiveTop{position:relative;z-index:4;display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-bottom:8px;min-height:13px}.small,.count{border:0;border-radius:999px;background:rgba(255,249,237,.74);padding:3px 6px;font-size:8px;font-weight:700;color:#704d34}.count{background:rgba(110,67,31,.18);color:#fff8ef}
.archiveViewport{position:relative;z-index:3;overflow-x:auto;overflow-y:hidden;padding:3px 1px 2px}.archiveList{display:none;gap:7px;min-height:82px;align-items:end}.archive.open .archiveList{display:flex}
.archItem{position:relative;flex:0 0 104px;min-height:76px;padding:13px 19px 8px 8px;border:1px solid rgba(132,94,59,.25);border-radius:9px 9px 5px 5px;background:linear-gradient(#fff9ef,#f8ead5);box-shadow:0 5px 8px rgba(85,58,37,.12)}
.archItem:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.20;background-image:repeating-linear-gradient(0deg,rgba(95,67,44,.04) 0 1px,transparent 1px 4px)}
.archItem:nth-child(3n+2){background:linear-gradient(#fcefe8,#f4ded7)}.archItem:nth-child(3n+3){background:linear-gradient(#eef4f3,#dfe9eb)}
.clip{position:absolute;left:11px;top:-6px;width:8px;height:23px;border:2px solid #b67742;border-radius:6px;transform:rotate(8deg);z-index:2}.archItem:nth-child(3n+2) .clip{border-color:#c36c69}.archItem:nth-child(3n+3) .clip{border-color:#5d879c}
.archMeta{position:relative;z-index:2;font-size:7px;font-weight:700;color:#98745a;margin-bottom:5px}.archText{position:relative;z-index:2;font:500 11px/1.25 'Inter',sans-serif;letter-spacing:-.01em;word-break:break-word;color:#5d4638}.archDel{position:absolute;right:5px;top:5px;width:15px;height:15px;padding:0;border-radius:50%;border:1px solid rgba(107,74,48,.35);background:rgba(255,255,255,.45);font-size:9px;line-height:1;z-index:3}.empty{flex:1;text-align:center;border:1px dashed rgba(111,75,45,.20);border-radius:9px;background:rgba(255,250,240,.45);color:#7c5b43;padding:10px 5px;font:700 13px/1.1 'Gaegu',cursive}
.drawerFront{position:relative;z-index:3;margin:5px -2px -3px;height:14px;border-radius:3px 3px 12px 12px;background:repeating-linear-gradient(0deg,rgba(77,44,20,.055) 0 1px,transparent 1px 4px),linear-gradient(#bd804a,#a76a39);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.knob{position:absolute;left:50%;top:3px;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8bb7f,#8b522d 68%);border:1px solid #7c4727}
.footerDecor{position:relative;z-index:3;height:14px;margin-top:3px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 4px}.footerDecor svg{width:36px;height:14px;opacity:.78}
@media(max-width:330px){.widget{padding:11px 9px 9px}.top{gap:6px}.sticky{padding:12px 6px 8px}.cardTitle{font-size:18px}.task input{font-size:11.5px}.chip{display:none}.plaque{min-width:190px}.title{font-size:21px}}
</style>
</head>
<body>
<div class="widget">
  <header class="header">
    <div class="plaque">
      <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M5 17c5-7 8-10 14-11-1 6-4 11-10 12" stroke="#759653" stroke-width="1.6" stroke-linecap="round"/><path d="M8 14c2 .4 4 .2 6-.7" stroke="#759653" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="title">Work Today</span>
      <svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="2.5" fill="#e7a3a3"/><path d="M12 4c2 0 3.3 2.8 1.5 4.2C15.7 6.6 18.6 8 18 10.2c-.5 2-3.5 1.8-4.4.3.5 2.4-2.4 4-4 2.3-1.5-1.6.2-4.1 2-4.2C9.2 8.4 8.3 5.4 10.4 4.5c.5-.2 1-.5 1.6-.5Z" fill="#f1b6b6" opacity=".9"/></svg>
    </div>
    <div class="headDate" id="headDate"></div>
  </header>

  <div class="top">
    <section class="sticky today">
      <div class="tape"></div><div class="curl"></div>
      <div class="cardHead"><div class="cardTitle"><svg class="decoSvg" viewBox="0 0 20 20" fill="none"><path d="M3 16c4-5 7-8 13-10-1 5-4 9-9 10" stroke="#6f8e51" stroke-width="1.4" stroke-linecap="round"/></svg>Today</div><div class="chip" id="todayDate"></div></div>
      <div class="dash"></div><div class="list" id="todayList"></div><div class="foot"><button class="add" data-add="today">+ Add</button></div>
    </section>

    <section class="sticky tomorrow">
      <div class="tape"></div><div class="curl"></div>
      <div class="cardHead"><div class="cardTitle">Tomorrow<svg class="decoSvg" viewBox="0 0 20 20" fill="none"><path d="M10 16S3.5 12 3.5 7.8C3.5 4.8 7 4 10 7c3-3 6.5-2.2 6.5.8C16.5 12 10 16 10 16Z" stroke="#c7817f" stroke-width="1.25"/></svg></div><div class="chip" id="tomorrowDate"></div></div>
      <div class="dash"></div><div class="list" id="tomorrowList"></div><div class="foot"><button class="add" data-add="tomorrow">+ Add</button></div>
    </section>
  </div>

  <section class="sticky week">
    <div class="tape"></div><div class="curl"></div>
    <div class="weekHead"><div class="cardTitle"><svg class="decoSvg" viewBox="0 0 20 20" fill="none"><path d="M10 17V8M10 11C7 11 5 9 5 6c3 0 5 2 5 5Zm0 2c3 0 5-2 5-5-3 0-5 2-5 5Z" stroke="#6e8f53" stroke-width="1.35" stroke-linecap="round"/></svg>This Week</div><div class="chip" id="weekDate"></div></div>
    <div class="dash"></div><div class="list" id="weekList"></div><div class="foot"><button class="add" data-add="week">+ Add</button></div>
    <svg class="cornerDecor" viewBox="0 0 40 30" fill="none"><path d="M5 27c8-11 15-16 28-20" stroke="#789a58" stroke-width="1.4"/><circle cx="29" cy="7" r="2" fill="#e7b2a3"/><circle cx="34" cy="10" r="1.6" fill="#e5c26f"/><path d="M12 19c3 0 5-1 7-3M18 16c0 3-1 5-3 7" stroke="#789a58" stroke-width="1.2"/></svg>
  </section>

  <section class="archive open" id="archiveBox">
    <div class="archiveLabel">Archive</div>
    <div class="archiveTop"><span class="count" id="archiveCount">0 saved</span><button class="small" id="toggleArchive">Hide</button><button class="small" id="clearArchive">Clear</button></div>
    <div class="archiveViewport"><div class="archiveList" id="archiveList"></div></div>
    <div class="drawerFront"><div class="knob"></div></div>
  </section>

  <div class="footerDecor">
    <svg viewBox="0 0 50 20" fill="none"><path d="M2 18c9-7 18-8 28-4 7 2 12 1 18-2" stroke="#7ca052" stroke-width="2"/><circle cx="12" cy="13" r="2" fill="#f0c66e"/><circle cx="20" cy="15" r="1.7" fill="#e8a5a5"/></svg>
    <svg viewBox="0 0 50 20" fill="none"><path d="M48 18c-9-7-18-8-28-4-7 2-12 1-18-2" stroke="#7ca052" stroke-width="2"/><circle cx="38" cy="13" r="2" fill="#f0c66e"/><circle cx="30" cy="15" r="1.7" fill="#e8a5a5"/></svg>
  </div>
</div>

<script>
const KEYS=['lifetown_work_today_compact_v5','lifetown_work_today_compact_v4','lifetown_work_today_compact_v3','lifetown_work_today_postit_v1','lifetown_work_today_v1'];
const KEY=KEYS[0];
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36).slice(-4);
const blank=()=>({id:uid(),text:'',done:false});
const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
function load(){for(const k of KEYS){try{const v=JSON.parse(localStorage.getItem(k)||'null');if(v&&typeof v==='object')return v}catch{}}return{lastDate:dkey(new Date()),today:[blank()],tomorrow:[blank()],week:[blank()],archive:[],archiveOpen:true,sampleSeeded:false}}
const s=load();
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function seedSample(){if(s.sampleSeeded)return;if(!Array.isArray(s.archive)||!s.archive.length){const d=new Date();d.setDate(d.getDate()-2);s.archive=[{id:uid(),text:'Client follow-up',done:true,date:dkey(d),sample:true}];s.archiveOpen=true}s.sampleSeeded=true;save()}
function norm(){['today','tomorrow','week'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];s[k]=s[k].map(x=>({id:x.id||uid(),text:String(x.text||''),done:!!x.done}));if(!s[k].length)s[k]=[blank()]});if(!Array.isArray(s.archive))s.archive=[];if(typeof s.archiveOpen!=='boolean')s.archiveOpen=true;save()}
function archiveToday(date){(s.today||[]).filter(x=>x.text.trim()).reverse().forEach(x=>s.archive.unshift({id:uid(),text:x.text.trim(),done:!!x.done,date}))}
function rollover(){const now=dkey(new Date());if(!s.lastDate){s.lastDate=now;save();return}if(s.lastDate===now)return;let gap=Math.floor((fromKey(now)-fromKey(s.lastDate))/86400000);if(!Number.isFinite(gap)||gap<1)gap=1;for(let i=0;i<gap;i++){archiveToday(s.lastDate);const mv=(s.tomorrow||[]).filter(x=>x.text.trim()||x.done).map(x=>({id:uid(),text:x.text,done:!!x.done}));s.today=mv.length?mv:[blank()];s.tomorrow=[blank()];const n=fromKey(s.lastDate);n.setDate(n.getDate()+1);s.lastDate=dkey(n)}s.lastDate=now;save()}
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function section(k){const root=document.getElementById(k+'List');root.innerHTML='';s[k].forEach(t=>{const r=document.createElement('div');r.className='task'+(t.done?' done':'');r.innerHTML=`<button class="check ${t.done?'done':''}">${t.done?'✓':''}</button><input value="${esc(t.text)}" placeholder="Write a note..."><button class="x">×</button>`;r.querySelector('.check').onclick=()=>{t.done=!t.done;save();section(k)};const inp=r.querySelector('input');inp.oninput=e=>{t.text=e.target.value;save()};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add(k)}};r.querySelector('.x').onclick=()=>{s[k]=s[k].filter(x=>x.id!==t.id);if(!s[k].length)s[k]=[blank()];save();section(k)};root.appendChild(r)})}
function add(k){s[k].push(blank());save();section(k);const xs=document.querySelectorAll('#'+k+'List input');xs[xs.length-1]?.focus()}
function arch(){const box=document.getElementById('archiveBox'),root=document.getElementById('archiveList');box.classList.toggle('open',s.archiveOpen);document.getElementById('toggleArchive').textContent=s.archiveOpen?'Hide':'Show';document.getElementById('archiveCount').textContent=s.archive.length+' saved';root.innerHTML='';if(!s.archive.length){root.innerHTML='<div class="empty">Finished Today notes will be saved here</div>';return}s.archive.forEach(a=>{const c=document.createElement('div');c.className='archItem';c.innerHTML=`<div class="clip"></div><button class="archDel">×</button><div class="archMeta">${a.date}${a.done?' · done':''}</div><div class="archText">${esc(a.text)}</div>`;c.querySelector('.archDel').onclick=()=>{s.archive=s.archive.filter(x=>x.id!==a.id);save();arch()};root.appendChild(c)})}
function dates(){const n=new Date(),tm=new Date(n);tm.setDate(n.getDate()+1);document.getElementById('headDate').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();document.getElementById('todayDate').textContent=n.toLocaleDateString('en-US',{month:'short',day:'numeric'});document.getElementById('tomorrowDate').textContent=tm.toLocaleDateString('en-US',{month:'short',day:'numeric'});const st=new Date(n),df=(st.getDay()+6)%7;st.setDate(st.getDate()-df);const en=new Date(st);en.setDate(st.getDate()+6);const f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});document.getElementById('weekDate').textContent=f(st)+' – '+f(en)}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));
document.getElementById('toggleArchive').onclick=()=>{s.archiveOpen=!s.archiveOpen;save();arch()};
document.getElementById('clearArchive').onclick=()=>{s.archive=[];save();arch()};
rollover();norm();seedSample();dates();section('today');section('tomorrow');section('week');arch();
</script>
</body>
</html>
