.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;position:relative;z-index:3}.sticky{position:relative;min-width:0;border:1px solid rgba(149,105,64,.20);border-radius:17px 17px 20px 17px;padding:14px 9px 9px;box-shadow:0 2px 0 rgba(255,255,255,.20) inset,0 9px 17px rgba(105,74,46,.12),0 2px 3px rgba(105,74,46,.07);overflow:visible}.sticky:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.34;mix-blend-mode:multiply;background-image:radial-gradient(circle at 17% 20%,rgba(95,67,44,.18) 0 .42px,transparent .72px),radial-gradient(circle at 76% 58%,rgba(95,67,44,.12) 0 .4px,transparent .67px),repeating-linear-gradient(1deg,rgba(95,67,44,.032) 0 1px,transparent 1px 4px);background-size:7px 7px,11px 11px,100% 100%}.today{background:linear-gradient(155deg,#fbedb7,#f2d681);transform:rotate(-.12deg)}.tomorrow{background:linear-gradient(155deg,#f8e1dd,#ecc5be);transform:rotate(.12deg)}.week{background:linear-gradient(155deg,#e7efda,#ceddb1);margin-top:10px;padding-bottom:12px}

.cardHead,.weekHead{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;min-height:24px;padding:0 30px}.cardTitle{width:100%;text-align:center;font:800 18px/1.05 'Nunito',sans-serif;letter-spacing:-.025em;color:#604531}.chip{position:absolute;right:0;top:50%;transform:translateY(-50%);border-radius:999px;background:rgba(255,249,237,.79);border:1px solid rgba(255,255,255,.54);padding:3px 6px;font-size:7.4px;font-weight:700;color:#987861;white-space:nowrap}.titleUnderline{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);width:49px;border-top:1px dashed rgba(104,72,46,.38)}.dash{border-top:1.2px dashed rgba(115,79,52,.18);margin:9px 0 7px;position:relative;z-index:2}.list{display:flex;flex-direction:column;gap:5px;min-height:61px;position:relative;z-index:2}.week .list{min-height:48px}.task{display:grid;grid-template-columns:16px minmax(0,1fr) 12px;align-items:center;gap:6px;padding:1px 0}.check{width:16px;height:16px;padding:0;border-radius:50%;border:1.3px solid rgba(101,70,49,.70);background:rgba(255,255,255,.51);display:grid;place-items:center;font-size:9px}.check.done{background:var(--green);border-color:#73914e;color:white}.task input{width:100%;min-width:0;border:0;outline:0;background:transparent;font:500 12.2px/1.35 'Inter',sans-serif;padding:2px 0;color:#594233}.task input::placeholder{color:rgba(101,70,49,.37);font-weight:400}.task.done input{text-decoration:line-through;opacity:.58}.x{border:0;background:transparent;padding:0;color:rgba(101,70,49,.34);font-size:12px;line-height:1}.foot{display:flex;justify-content:flex-end;margin-top:5px;position:relative;z-index:4}.add{border:0;border-radius:999px;background:rgba(255,249,237,.82);border:1px solid rgba(255,255,255,.50);padding:4px 9px;font-size:8px;font-weight:700;color:#755138}

3){background:linear-gradient(#eef4f3,#dfe9eb);transform:rotate(-.2deg)}.clip{position:absolute;left:11px;top:-6px;width:8px;height:23px;border:2px solid #b67742;border-radius:6px;transform:rotate(8deg)}.archMeta{font-size:6.4px;font-weight:700;color:#98745a;margin-bottom:5px}.archText{font:500 9.8px/1.22 'Inter',sans-serif;word-break:break-word;color:#5d4638}.deleteArch{position:absolute;right:5px;top:5px;border:0;background:transparent;padding:0;color:#9b7b66;font-size:10px}.knob{position:absolute;left:50%;transform:translateX(-50%);bottom:5px;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#ebcb92 0 20%,#b2743e 55%,#89522c 100%);box-shadow:0 2px 3px rgba(74,43,23,.25);z-index:5}
.syncOverlay{position:fixed;inset:0;background:rgba(82,58,40,.20);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}.syncOverlay.open{display:flex}.syncPanel{width:min(330px,92vw);position:relative;border:1px solid #dec19a;border-radius:22px;padding:18px 16px 15px;background:repeating-linear-gradient(0deg,rgba(121,86,52,.025) 0 1px,transparent 1px 4px),linear-gradient(180deg,#fffaf1,#f5e6d0);box-shadow:0 18px 45px rgba(83,56,36,.25),inset 0 0 0 3px rgba(255,255,255,.52);color:#674934}.syncPanel:before{content:"";position:absolute;inset:6px;border:1px dashed rgba(164,123,79,.32);border-radius:16px;pointer-events:none}.syncTitle{position:relative;text-align:center;font:900 20px/1 'Nunito',sans-serif;margin:1px 0 5px}.syncDesc{position:relative;text-align:center;font:500 10px/1.45 'Inter',sans-serif;color:#987861;margin:0 8px 13px}.syncField{position:relative;display:flex;gap:6px;align-items:center;margin-bottom:8px}.syncInput{min-width:0;flex:1;border:1px solid rgba(151,111,75,.25);border-radius:11px;background:rgba(255,255,255,.66);padding:8px 9px;outline:none;font:600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;color:#5e4434}.syncAction{border:1px solid rgba(151,111,75,.23);border-radius:10px;background:#fff8ed;padding:8px 10px;font:700 9px/1 'Inter',sans-serif;color:#725139;white-space:nowrap}.syncActions{position:relative;display:flex;gap:6px;justify-content:center;margin-top:9px;flex-wrap:wrap}.syncHint{position:relative;font:500 8.5px/1.45 'Inter',sans-serif;color:#9a7b64;text-align:center;margin-top:9px}.syncStatusText{position:relative;min-height:14px;text-align:center;font:600 9px/1.4 'Inter',sans-serif;color:#78925c;margin-top:7px}.syncClose{position:absolute;right:11px;top:10px;border:0;background:transparent;font:500 18px/1 'Inter',sans-serif;color:#9b7b63;padding:2px 5px;z-index:2}

<script>
const STORAGE_KEY='lifetown_work_today_compact_v3',SYNC_CODE_KEY='lifetown_work_today_sync_code_v1',SYNC_ENDPOINT='https://dfklyngtjqvlirgrtdfb.supabase.co/functions/v1/work-today-sync';
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36).slice(-4),blank=()=>({id:uid(),text:'',done:false}),dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
let syncCode=localStorage.getItem(SYNC_CODE_KEY)||'',lastRemoteAt='',cloudReady=false,applyingRemote=false,cloudSaveTimer=null;
function load(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(v&&typeof v==='object')return v}catch{}return{lastDate:dateKey(new Date()),today:[blank()],tomorrow:[blank()],week:[blank()],archive:[],archiveOpen:true,sampleSeeded:false}}
const s=load();
function saveLocal(){localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}
function save(){saveLocal();if(!applyingRemote&&cloudReady&&syncCode)scheduleCloudSave()}
function normalize(){['today','tomorrow','week'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];s[k]=s[k].map(x=>({id:x.id||uid(),text:String(x.text||''),done:!!x.done}));if(!s[k].length)s[k]=[blank()]});if(!Array.isArray(s.archive))s.archive=[];if(typeof s.archiveOpen!=='boolean')s.archiveOpen=true;saveLocal()}
function archiveToday(k){(s.today||[]).filter(x=>x.text.trim()).reverse().forEach(x=>s.archive.unshift({id:uid(),text:x.text.trim(),done:!!x.done,date:k}))}
function rollover(){const now=dateKey(new Date());if(!s.lastDate){s.lastDate=now;save();return}if(s.lastDate===now)return;let gap=Math.floor((fromKey(now)-fromKey(s.lastDate))/86400000);if(!Number.isFinite(gap)||gap<1)gap=1;for(let i=0;i<gap;i++){archiveToday(s.lastDate);const moved=(s.tomorrow||[]).filter(x=>x.text.trim()||x.done).map(x=>({id:uid(),text:x.text,done:!!x.done}));s.today=moved.length?moved:[blank()];s.tomorrow=[blank()];const n=fromKey(s.lastDate);n.setDate(n.getDate()+1);s.lastDate=dateKey(n)}s.lastDate=now;save()}
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function renderSection(k){const root=document.getElementById(k+'List');root.innerHTML='';s[k].forEach(t=>{const r=document.createElement('div');r.className='task'+(t.done?' done':'');r.innerHTML=`<button class="check ${t.done?'done':''}">${t.done?'✓':''}</button><input value="${esc(t.text)}" placeholder="Write a note..."><button class="x">×</button>`;r.querySelector('.check').onclick=()=>{t.done=!t.done;save();renderSection(k)};const inp=r.querySelector('input');inp.oninput=e=>{t.text=e.target.value;save()};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add(k)}};r.querySelector('.x').onclick=()=>{s[k]=s[k].filter(x=>x.id!==t.id);if(!s[k].length)s[k]=[blank()];save();renderSection(k)};root.appendChild(r)})}
function add(k){s[k].push(blank());save();renderSection(k);const xs=document.querySelectorAll('#'+k+'List input');xs[xs.length-1]?.focus()}
function renderArchive(){const box=document.getElementById('archiveBox'),root=document.getElementById('archiveList');box.classList.toggle('open',s.archiveOpen);document.getElementById('toggleArchive').textContent=s.archiveOpen?'Hide':'Show';document.getElementById('archiveCount').textContent=s.archive.length+' saved';root.innerHTML='';if(!s.archiveOpen)return;if(!s.archive.length){root.innerHTML='<div style="position:relative;z-index:4;color:#7d5c43;font-size:9px;padding:12px">Finished Today notes will be saved here.</div>';return}s.archive.forEach(a=>{const c=document.createElement('div');c.className='archItem';c.innerHTML=`<div class="clip"></div><button class="deleteArch">×</button><div class="archMeta">${a.date}${a.done?' · done':''}</div><div class="archText">${esc(a.text)}</div>`;c.querySelector('.deleteArch').onclick=()=>{s.archive=s.archive.filter(x=>x.id!==a.id);save();renderArchive()};root.appendChild(c)})}
function renderDates(){const n=new Date(),tm=new Date(n);tm.setDate(n.getDate()+1);document.getElementById('headDate').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();document.getElementById('todayDate').textContent=n.toLocaleDateString('en-US',{month:'short',day:'numeric'});document.getElementById('tomorrowDate').textContent=tm.toLocaleDateString('en-US',{month:'short',day:'numeric'});const st=new Date(n),diff=(st.getDay()+6)%7;st.setDate(st.getDate()-diff);const en=new Date(st);en.setDate(st.getDate()+6),f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});document.getElementById('weekDate').textContent=f(st)+' – '+f(en)}
function renderAll(){renderDates();renderSection('today');renderSection('tomorrow');renderSection('week');renderArchive()}
function setSyncStatus(mode,label){const b=document.getElementById('syncBtn'),t=document.getElementById('syncStatusText');b.classList.remove('online','syncing','offline');b.classList.add(mode);b.textContent=label||'Sync';if(t&&label)t.textContent=label}
function genCode(){const a=new Uint8Array(18);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,28).toUpperCase()}
async function syncReq(action,payload={}){const r=await fetch(SYNC_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,code:syncCode,...payload}),cache:'no-store'});if(!r.ok)throw new Error('sync_failed');return r.json()}
function scheduleCloudSave(){clearTimeout(cloudSaveTimer);setSyncStatus('syncing','Syncing…');cloudSaveTimer=setTimeout(cloudSave,450)}
async function cloudSave(){if(!syncCode)return;try{await syncReq('save',{state:JSON.parse(JSON.stringify(s))});lastRemoteAt=new Date().toISOString();setSyncStatus('online','Synced')}catch{setSyncStatus('offline','Offline')}}
async function cloudLoad(initial=false){if(!syncCode)return false;try{setSyncStatus('syncing','Syncing…');const d=await syncReq('load');if(d.state){applyingRemote=true;Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,d.state);normalize();applyingRemote=false;saveLocal();lastRemoteAt=d.updated_at||'';renderAll();setSyncStatus('online','Synced');return true}if(initial)await cloudSave();else setSyncStatus('online','Synced');return false}catch{setSyncStatus('offline','Offline');return false}}
async function pollCloud(){if(!cloudReady||!syncCode)return;try{const d=await syncReq('load');if(d.state&&d.updated_at&&(!lastRemoteAt||new Date(d.updated_at)>new Date(lastRemoteAt))){applyingRemote=true;Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,d.state);normalize();applyingRemote=false;saveLocal();lastRemoteAt=d.updated_at;renderAll();setSyncStatus('online','Synced')}}catch{setSyncStatus('offline','Offline')}}
function openSync(){document.getElementById('syncCodeInput').value=syncCode;document.getElementById('syncOverlay').classList.add('open');document.getElementById('syncStatusText').textContent='Use this same code on every device.'}
function closeSync(){document.getElementById('syncOverlay').classList.remove('open')}
async function useCode(){const v=document.getElementById('syncCodeInput').value.trim().toUpperCase().replace(/\s+/g,'');if(v.length<16){document.getElementById('syncStatusText').textContent='Code is too short.';return}syncCode=v;localStorage.setItem(SYNC_CODE_KEY,syncCode);cloudReady=true;const found=await cloudLoad(false);if(!found)await cloudSave();document.getElementById('syncCodeInput').value=syncCode}
async function newCode(){syncCode=genCode();localStorage.setItem(SYNC_CODE_KEY,syncCode);cloudReady=true;document.getElementById('syncCodeInput').value=syncCode;await cloudSave();document.getElementById('syncStatusText').textContent='New sync space created.'}
async function copyCode(){try{await navigator.clipboard.writeText(syncCode);document.getElementById('syncStatusText').textContent='Sync code copied.'}catch{const i=document.getElementById('syncCodeInput');i.select();document.execCommand('copy');document.getElementById('syncStatusText').textContent='Sync code copied.'}}
async function initSync(){if(!syncCode){syncCode=genCode();localStorage.setItem(SYNC_CODE_KEY,syncCode)}cloudReady=true;await cloudLoad(true);setInterval(pollCloud,5000)}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));document.getElementById('toggleArchive').onclick=()=>{s.archiveOpen=!s.archiveOpen;save();renderArchive()};document.getElementById('clearArchive').onclick=()=>{s.archive=[];save();renderArchive()};document.getElementById('syncBtn').onclick=openSync;document.getElementById('syncClose').onclick=closeSync;document.getElementById('syncOverlay').onclick=e=>{if(e.target.id==='syncOverlay')closeSync()};document.getElementById('useSyncCode').onclick=useCode;document.getElementById('newSyncCode').onclick=newCode;document.getElementById('copySyncCode').onclick=copyCode;
rollover();normalize();renderAll();initSync();
</script>
</body>
</html>
