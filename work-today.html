.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;position:relative;z-index:3}.sticky{position:relative;min-width:0;border:1px solid rgba(151,108,66,.20);border-radius:16px 16px 20px 16px;padding:13px 9px 9px;box-shadow:0 7px 15px rgba(106,76,48,.12),inset 0 0 0 1px rgba(255,255,255,.22);overflow:visible}.sticky:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.42;background:radial-gradient(circle at 20% 30%,rgba(113,81,48,.07) 0 1px,transparent 1.5px) 0 0/15px 14px,repeating-linear-gradient(13deg,rgba(102,72,43,.035) 0 1px,transparent 1px 6px)}.today{background:linear-gradient(158deg,#fbedb6 0%,#f5dc90 100%);transform:rotate(-.28deg)}.tomorrow{background:linear-gradient(158deg,#f7e1dc 0%,#efcbc4 100%);transform:rotate(.28deg)}.week{background:linear-gradient(158deg,#e4ecd6,#d5e2bc);margin-top:10px;transform:rotate(-.08deg)}

.curl{position:absolute;right:-1px;bottom:-1px;width:38px;height:38px;border-radius:0 0 18px 0;clip-path:polygon(100% 0,100% 100%,0 100%);background:linear-gradient(135deg,transparent 0 46%,rgba(105,71,40,.16) 47% 52%,rgba(255,255,255,.76) 53% 100%);filter:drop-shadow(-2px -1px 1px rgba(91,61,36,.06));pointer-events:none}.cardHead{display:flex;align-items:center;justify-content:space-between;gap:5px}.cardTitle{font:700 21px/1 'Gaegu',cursive;display:flex;align-items:center;gap:5px;position:relative;z-index:1}.miniLeaf{width:14px;height:14px}.spark{width:12px;height:12px}.chip{flex:0 0 auto;border-radius:999px;background:rgba(255,249,237,.75);border:1px solid rgba(255,255,255,.38);padding:3px 6px;font-size:8px;font-weight:900;color:#997a64;position:relative;z-index:1}.dash{border-top:1.5px dashed rgba(115,79,52,.30);margin:6px 0 7px;position:relative;z-index:1}.list{display:flex;flex-direction:column;gap:5px;min-height:73px;position:relative;z-index:1}.week .list{min-height:0}.task{display:grid;grid-template-columns:16px minmax(0,1fr) 12px;align-items:center;gap:5px;padding:1px 0}.check{width:16px;height:16px;padding:0;border-radius:50%;border:1.3px solid rgba(101,70,49,.72);background:rgba(255,255,255,.48);display:grid;place-items:center;font-size:9px}.check.done{background:var(--green);border-color:#789653;color:white}.task input{width:100%;min-width:0;border:0;outline:0;background:transparent;font:700 15px/1.08 'Gaegu',cursive;padding:1px 0}.task input::placeholder{color:rgba(101,70,49,.37)}.task.done input{text-decoration:line-through;opacity:.58}.x{border:0;background:transparent;padding:0;color:rgba(101,70,49,.35);font-size:12px;line-height:1}.foot{display:flex;justify-content:flex-end;margin-top:5px;position:relative;z-index:1}.add{border:0;border-radius:999px;background:rgba(255,249,237,.70);padding:4px 8px;font-size:8px;font-weight:900;color:#77543a}.weekHead{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}.week .task input{font-size:14px}.weekScene{position:absolute;right:8px;bottom:4px;width:45px;height:33px;opacity:.84;z-index:0}
.archive{position:relative;z-index:3;margin-top:13px;padding:14px 8px 8px;border-radius:14px 14px 19px 19px;border:1px solid #9b6336;background:repeating-linear-gradient(7deg,rgba(84,46,22,.09) 0 1px,transparent 1px 7px),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 8px),linear-gradient(180deg,var(--wood1) 0%,var(--wood2) 70%,#ae7040 100%);box-shadow:0 9px 17px rgba(93,57,31,.20),inset 0 2px 0 rgba(255,255,255,.24),inset 0 -4px 8px rgba(91,50,25,.12)}.archive:before{content:"";position:absolute;left:7px;right:7px;top:37px;bottom:7px;border-radius:10px 10px 14px 14px;background:repeating-linear-gradient(8deg,rgba(96,57,29,.055) 0 1px,transparent 1px 7px),linear-gradient(#e9cda7,#d3a978);box-shadow:inset 0 7px 12px rgba(91,58,34,.20),inset 0 -2px 0 rgba(255,255,255,.15)}.archiveLabel{position:absolute;top:-14px;left:50%;transform:translateX(-50%);min-width:136px;text-align:center;padding:5px 15px 6px;border-radius:11px;border:1.5px solid #966341;background:repeating-linear-gradient(0deg,rgba(123,80,42,.035) 0 1px,transparent 1px 4px),linear-gradient(#f5e5ca,#e6c79f);box-shadow:0 5px 8px rgba(90,57,33,.15),inset 0 0 0 2px rgba(255,255,255,.20);font:700 19px/1 'Gaegu',cursive;z-index:5}.archiveLabel svg{display:inline-block;width:13px;height:13px;vertical-align:-2px;margin:0 4px}.archiveTop{position:relative;z-index:5;display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-bottom:8px;min-height:13px}.small,.count{border:0;border-radius:999px;background:rgba(255,249,237,.76);padding:3px 6px;font-size:8px;font-weight:900;color:#704d34}.count{background:rgba(110,67,31,.20);color:#fff8ef}.archiveViewport{position:relative;z-index:4;overflow-x:auto;overflow-y:hidden;padding:4px 1px 2px}.archiveList{display:flex;gap:7px;min-height:84px;align-items:end}.archItem{position:relative;flex:0 0 100px;min-height:79px;padding:13px 19px 8px 8px;border:1px solid rgba(132,94,59,.24);border-radius:9px 9px 5px 5px;background:radial-gradient(circle at 20% 30%,rgba(105,70,44,.045) 0 1px,transparent 1.5px) 0 0/12px 11px,linear-gradient(#fff9ef,#f7e7d0);box-shadow:0 4px 8px rgba(85,58,37,.12),inset 0 0 0 1px rgba(255,255,255,.32)}.archItem:nth-child(3n+2){background:radial-gradient(circle at 30% 40%,rgba(130,72,68,.04) 0 1px,transparent 1.5px) 0 0/13px 13px,linear-gradient(#fbeee7,#f3dbd3)}.archItem:nth-child(3n+3){background:radial-gradient(circle at 30% 40%,rgba(64,99,111,.04) 0 1px,transparent 1.5px) 0 0/13px 13px,linear-gradient(#eef5f3,#dce9ea)}.clip{position:absolute;left:11px;top:-6px;width:8px;height:23px;border:2px solid #b67742;border-radius:6px;transform:rotate(8deg)}.archItem:nth-child(3n+2) .clip{border-color:#c36c69}.archItem:nth-child(3n+3) .clip{border-color:#5d879c}.archMeta{font-size:7px;font-weight:900;color:#98745a;margin-bottom:3px}.archText{font:700 13px/1.03 'Gaegu',cursive;word-break:break-word}.archStatus{margin-top:4px;font-size:6px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#789157}.archDel{position:absolute;right:5px;top:5px;width:15px;height:15px;padding:0;border-radius:50%;border:1px solid rgba(107,74,48,.36);background:rgba(255,255,255,.42);font-size:9px;line-height:1}.drawerFront{position:relative;z-index:4;margin:5px -2px -3px;height:15px;border-radius:3px 3px 12px 12px;background:repeating-linear-gradient(5deg,rgba(78,41,19,.08) 0 1px,transparent 1px 6px),linear-gradient(#bc7b45,#a76538);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 4px rgba(70,35,16,.18)}.knob{position:absolute;left:50%;top:3px;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e6b777,#8b522d 68%);border:1px solid #754323;box-shadow:0 1px 2px rgba(50,25,12,.25)}.grass{position:relative;z-index:4;height:13px;margin:3px 2px -2px}.grass svg{width:100%;height:100%}
@media(max-width:330px){.widget{padding:11px 9px 10px}.top{gap:6px}.sticky{padding:12px 6px 8px}.cardTitle{font-size:18px}.task input{font-size:13px}.chip{display:none}.plaque{min-width:188px}.title{font-size:20px}.village,.path{display:none}}

tomorrow">+ Add</button></div></section></div><section class="sticky week"><div class="tape"></div><div class="curl"></div><div class="weekHead"><div class="cardTitle"><svg class="miniLeaf"><use href="#leaf"/></svg>This Week <svg class="spark"><use href="#spark"/></svg></div><div class="chip" id="weekDate"></div></div><div class="dash"></div><div class="list" id="weekList"></div><div class="foot"><button class="add" data-add="week">+ Add</button></div><svg class="weekScene" viewBox="0 0 55 40"><path d="M36 36V18" stroke="#74543b" stroke-width="2.2"/><circle cx="36" cy="13" r="9" fill="#89aa62" stroke="#638045"/><circle cx="29" cy="17" r="7" fill="#93b56a"/><circle cx="43" cy="19" r="7" fill="#7fa35b"/><path d="M5 35c5-8 10-8 15 0" fill="#9dbc72"/><circle cx="14" cy="30" r="2" fill="#f0b2ad"/><circle cx="19" cy="32" r="2" fill="#f4d06c"/></svg></section><section class="archive open" id="archiveBox"><div class="archiveLabel"><svg><use href="#leaf"/></svg>Archive<svg><use href="#leaf"/></svg></div><div class="archiveTop"><span class="count" id="archiveCount">0 saved</span><button class="small" id="toggleArchive">Hide</button><button class="small" id="clearArchive">Clear</button></div><div class="archiveViewport"><div class="archiveList" id="archiveList"></div></div><div class="drawerFront"><div class="knob"></div></div></section><div class="grass"><svg viewBox="0 0 430 16"><path d="M0 15C35 5 74 11 112 10c46-2 76-9 120-4 38 4 75 9 111 2 33-6 57-2 87 7z" fill="#8eaf65"/><g fill="#f0b0a8"><circle cx="50" cy="9" r="1.8"/><circle cx="54" cy="11" r="1.8"/><circle cx="58" cy="9" r="1.8"/></g><g fill="#f2ce66"><circle cx="370" cy="9" r="1.8"/><circle cx="374" cy="11" r="1.8"/><circle cx="378" cy="9" r="1.8"/></g></svg></div></div>
<script>
const KEYS=['lifetown_work_today_compact_v5','lifetown_work_today_compact_v4','lifetown_work_today_compact_v3','lifetown_work_today_postit_v1','lifetown_work_today_v1'];const KEY=KEYS[0],SAMPLE_ID='demo-archive-sample-aug15';const id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36).slice(-4);const blank=()=>({id:id(),text:'',done:false});const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};function load(){for(const k of KEYS){try{const v=JSON.parse(localStorage.getItem(k)||'null');if(v&&typeof v==='object')return v}catch{}}return{lastDate:dkey(new Date()),today:[blank()],tomorrow:[blank()],week:[blank()],archive:[],archiveOpen:true}}const s=load();function save(){localStorage.setItem(KEY,JSON.stringify(s))}function norm(){['today','tomorrow','week'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];s[k]=s[k].map(x=>({id:x.id||id(),text:String(x.text||''),done:!!x.done}));if(!s[k].length)s[k]=[blank()]});if(!Array.isArray(s.archive))s.archive=[];s.archiveOpen=true;seedSample();save()}function seedSample(){if(!s.archive.some(a=>a.id===SAMPLE_ID)){const d=new Date();d.setDate(d.getDate()-2);s.archive.unshift({id:SAMPLE_ID,text:'Client follow-up',done:true,date:dkey(d),sample:true})}}function archiveToday(date){(s.today||[]).filter(x=>x.text.trim()).reverse().forEach(x=>s.archive.unshift({id:id(),text:x.text.trim(),done:!!x.done,date}))}function rollover(){const now=dkey(new Date());if(!s.lastDate){s.lastDate=now;save();return}if(s.lastDate===now)return;let gap=Math.floor((fromKey(now)-fromKey(s.lastDate))/86400000);if(!Number.isFinite(gap)||gap<1)gap=1;for(let i=0;i<gap;i++){archiveToday(s.lastDate);const mv=(s.tomorrow||[]).filter(x=>x.text.trim()||x.done).map(x=>({id:id(),text:x.text,done:!!x.done}));s.today=mv.length?mv:[blank()];s.tomorrow=[blank()];const n=fromKey(s.lastDate);n.setDate(n.getDate()+1);s.lastDate=dkey(n)}s.lastDate=now;save()}const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');function section(k){const root=document.getElementById(k+'List');root.innerHTML='';s[k].forEach(t=>{const r=document.createElement('div');r.className='task'+(t.done?' done':'');r.innerHTML=`<button class="check ${t.done?'done':''}">${t.done?'✓':''}</button><input value="${esc(t.text)}" placeholder="Write a note..."><button class="x">×</button>`;r.querySelector('.check').onclick=()=>{t.done=!t.done;save();section(k)};const inp=r.querySelector('input');inp.oninput=e=>{t.text=e.target.value;save()};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add(k)}};r.querySelector('.x').onclick=()=>{s[k]=s[k].filter(x=>x.id!==t.id);if(!s[k].length)s[k]=[blank()];save();section(k)};root.appendChild(r)})}function add(k){s[k].push(blank());save();section(k);const xs=document.querySelectorAll('#'+k+'List input');xs[xs.length-1]?.focus()}function formatArchiveDate(key){const d=fromKey(key);return d.toLocaleDateString('en-US',{month:'short',day:'2-digit',weekday:'short'})}function arch(){const box=document.getElementById('archiveBox'),root=document.getElementById('archiveList');box.classList.add('open');document.getElementById('toggleArchive').textContent='Hide';document.getElementById('archiveCount').textContent=s.archive.length+' saved';root.innerHTML='';s.archive.forEach(a=>{const c=document.createElement('div');c.className='archItem';c.innerHTML=`<div class="clip"></div><button class="archDel">×</button><div class="archMeta">${formatArchiveDate(a.date)}</div><div class="archText">${esc(a.text)}</div>${a.done?'<div class="archStatus">Done</div>':''}`;c.querySelector('.archDel').onclick=()=>{s.archive=s.archive.filter(x=>x.id!==a.id);save();arch()};root.appendChild(c)})}function dates(){const n=new Date(),tm=new Date(n);tm.setDate(n.getDate()+1);document.getElementById('headDate').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();document.getElementById('todayDate').textContent=n.toLocaleDateString('en-US',{month:'short',day:'numeric'});document.getElementById('tomorrowDate').textContent=tm.toLocaleDateString('en-US',{month:'short',day:'numeric'});const st=new Date(n),df=(st.getDay()+6)%7;st.setDate(st.getDate()-df);const en=new Date(st);en.setDate(st.getDate()+6);const f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});document.getElementById('weekDate').textContent=f(st)+' – '+f(en)}document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));document.getElementById('toggleArchive').onclick=()=>{const box=document.getElementById('archiveBox');box.classList.toggle('open');document.getElementById('toggleArchive').textContent=box.classList.contains('open')?'Hide':'Show'};document.getElementById('clearArchive').onclick=()=>{s.archive=[];save();arch()};rollover();norm();dates();section('today');section('tomorrow');section('week');arch();
</script>
