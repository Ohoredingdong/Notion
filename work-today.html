<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Work Today · Life Town</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@700;800;900&display=swap');
:root{--ink:#654631;--muted:#967963;--cream:#fffaf0;--line:#ead7ba;--yellow:#f9e8a7;--pink:#f3d9d4;--sage:#dce8c9;--wood:#d4a06c;--wood2:#b97c48;--green:#8bab65;--shadow:0 8px 19px rgba(103,74,47,.10)}
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink)}body{padding:5px;font-family:'Nunito',system-ui,sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}
.widget{width:100%;max-width:458px;margin:auto;position:relative;overflow:hidden;padding:14px 12px 11px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,#fffdf9 0%,#fff9ef 100%);box-shadow:var(--shadow),inset 0 0 0 3px rgba(255,255,255,.68)}
.widget:before{content:"";position:absolute;inset:7px;border:1px dashed rgba(163,125,82,.22);border-radius:18px;pointer-events:none}
.cloud{position:absolute;font-size:17px;opacity:.72;filter:saturate(.75)}.cloud.a{top:18px;left:25px}.cloud.b{top:20px;right:27px}.village{position:absolute;right:23px;top:63px;font-size:12px;letter-spacing:-2px;opacity:.72}.dotted{position:absolute;left:30px;top:70px;width:70px;border-top:1.5px dashed rgba(126,87,55,.45);transform:rotate(-8deg)}
.header{position:relative;z-index:2;text-align:center;margin:2px 0 11px}.plaque{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:224px;padding:9px 16px 10px;border:1px solid #e1c7a3;border-radius:17px;background:linear-gradient(#fbf1df,#f5e8d2);box-shadow:0 5px 11px rgba(100,70,43,.09),inset 0 0 0 3px rgba(255,255,255,.42);position:relative}.plaque:after{content:"";position:absolute;inset:5px;border:1px dashed rgba(174,136,91,.38);border-radius:12px}.plaque .title{position:relative;z-index:1;font-size:23px;font-weight:900;letter-spacing:-.04em;text-shadow:0 1px 0 rgba(255,255,255,.7)}.plaque .deco{position:relative;z-index:1;font-size:14px}.headDate{margin-top:5px;font-size:9px;font-weight:900;letter-spacing:.09em;color:var(--muted)}
.flow{position:relative;z-index:2;display:flex;justify-content:center;align-items:center;gap:6px;margin:-2px 0 8px;font:700 11px 'Gaegu',cursive;color:#8d6d54}.flow span{background:#fff6e7;border:1px solid #ead4b3;border-radius:9px;padding:3px 7px;box-shadow:0 2px 4px rgba(102,71,45,.05)}.flow b{font-size:14px;font-weight:700;color:#a17753}
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;position:relative;z-index:2}.sticky{position:relative;min-width:0;border:1px solid rgba(151,108,66,.16);border-radius:16px 16px 19px 16px;padding:13px 9px 9px;box-shadow:0 7px 14px rgba(106,76,48,.09),inset 0 0 0 1px rgba(255,255,255,.20);overflow:visible}.today{background:linear-gradient(160deg,#fbedb6 0%,#f7e19a 100%);transform:rotate(-.3deg)}.tomorrow{background:linear-gradient(160deg,#f6e0dc 0%,#f1d2cc 100%);transform:rotate(.3deg)}.week{background:linear-gradient(160deg,#e4ecd5,#d8e5c2);margin-top:10px;transform:rotate(-.1deg)}
.tape{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:59px;height:15px;border-radius:2px;opacity:.95;box-shadow:0 1px 2px rgba(70,50,34,.08)}.today .tape{background:repeating-linear-gradient(0deg,#f5d474 0 6px,#fff0b7 6px 9px),repeating-linear-gradient(90deg,transparent 0 7px,rgba(255,255,255,.45) 7px 10px)}.tomorrow .tape{background:repeating-linear-gradient(0deg,#e9aea9 0 6px,#f9dfdc 6px 9px),repeating-linear-gradient(90deg,transparent 0 7px,rgba(255,255,255,.46) 7px 10px)}.week .tape{background:repeating-linear-gradient(0deg,#b7cc9c 0 6px,#e9f0dc 6px 9px),repeating-linear-gradient(90deg,transparent 0 7px,rgba(255,255,255,.46) 7px 10px)}
.curl{position:absolute;right:-1px;bottom:-1px;width:36px;height:36px;border-radius:0 0 18px 0;clip-path:polygon(100% 0,100% 100%,0 100%);background:linear-gradient(135deg,transparent 0 47%,rgba(118,82,47,.12) 48% 52%,rgba(255,255,255,.72) 53% 100%);pointer-events:none}.cardHead{display:flex;align-items:center;justify-content:space-between;gap:5px}.cardTitle{font:700 21px/1 'Gaegu',cursive;display:flex;align-items:center;gap:4px}.chip{flex:0 0 auto;border-radius:999px;background:rgba(255,249,237,.72);padding:3px 6px;font-size:8px;font-weight:900;color:#997a64}.dash{border-top:1.5px dashed rgba(115,79,52,.28);margin:6px 0 7px}.doodle{font-size:12px;opacity:.72}.list{display:flex;flex-direction:column;gap:5px;min-height:73px}.week .list{min-height:0}.task{display:grid;grid-template-columns:16px minmax(0,1fr) 12px;align-items:center;gap:5px;padding:1px 0}.check{width:16px;height:16px;padding:0;border-radius:50%;border:1.3px solid rgba(101,70,49,.70);background:rgba(255,255,255,.46);display:grid;place-items:center;font-size:9px}.check.done{background:var(--green);border-color:#789653;color:white}.task input{width:100%;min-width:0;border:0;outline:0;background:transparent;font:700 15px/1.08 'Gaegu',cursive;padding:1px 0}.task input::placeholder{color:rgba(101,70,49,.36)}.task.done input{text-decoration:line-through;opacity:.57}.x{border:0;background:transparent;padding:0;color:rgba(101,70,49,.34);font-size:12px;line-height:1}.foot{display:flex;justify-content:flex-end;margin-top:5px}.add{border:0;border-radius:999px;background:rgba(255,249,237,.66);padding:4px 8px;font-size:8px;font-weight:900;color:#77543a}.weekHead{display:flex;align-items:center;justify-content:space-between}.week .task input{font-size:14px}.weekTree{position:absolute;right:11px;bottom:5px;font-size:21px;opacity:.76;pointer-events:none}
.archive{position:relative;z-index:2;margin-top:12px;padding:14px 8px 8px;border-radius:14px 14px 19px 19px;border:1px solid #a56d3e;background:linear-gradient(180deg,#d5a472 0%,#bc7d46 100%);box-shadow:0 8px 15px rgba(93,57,31,.17),inset 0 2px 0 rgba(255,255,255,.26)}.archive:before{content:"";position:absolute;left:7px;right:7px;top:36px;bottom:7px;border-radius:10px 10px 14px 14px;background:linear-gradient(#e9cfaa,#d5ad80);box-shadow:inset 0 6px 10px rgba(91,58,34,.17)}.archiveLabel{position:absolute;top:-13px;left:50%;transform:translateX(-50%);min-width:132px;text-align:center;padding:5px 14px;border-radius:11px;border:1.5px solid #9f7048;background:linear-gradient(#f6e8cf,#e9cfaa);box-shadow:0 4px 7px rgba(90,57,33,.13);font:700 19px/1 'Gaegu',cursive;z-index:4}.archiveLabel:before,.archiveLabel:after{content:"🌿";font-size:10px;margin:0 5px}.archiveTop{position:relative;z-index:4;display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-bottom:8px;min-height:13px}.small,.count{border:0;border-radius:999px;background:rgba(255,249,237,.73);padding:3px 6px;font-size:8px;font-weight:900;color:#704d34}.count{background:rgba(110,67,31,.18);color:#fff8ef}.archiveViewport{position:relative;z-index:3;overflow-x:auto;overflow-y:hidden;padding:3px 1px 2px}.archiveList{display:none;gap:7px;min-height:79px;align-items:end}.archive.open .archiveList{display:flex}.archItem{position:relative;flex:0 0 100px;min-height:74px;padding:12px 19px 7px 8px;border:1px solid rgba(132,94,59,.22);border-radius:9px 9px 5px 5px;background:linear-gradient(#fff9ef,#f9ead4);box-shadow:0 4px 7px rgba(85,58,37,.10)}.archItem:nth-child(3n+2){background:linear-gradient(#fcefe8,#f5dfd8)}.archItem:nth-child(3n+3){background:linear-gradient(#edf4f3,#dfeaec)}.clip{position:absolute;left:11px;top:-6px;width:8px;height:22px;border:2px solid #b67742;border-radius:6px;transform:rotate(8deg)}.archItem:nth-child(3n+2) .clip{border-color:#c36c69}.archItem:nth-child(3n+3) .clip{border-color:#5d879c}.archMeta{font-size:7px;font-weight:900;color:#98745a;margin-bottom:3px}.archText{font:700 13px/1.02 'Gaegu',cursive;word-break:break-word}.archDel{position:absolute;right:5px;top:5px;width:15px;height:15px;padding:0;border-radius:50%;border:1px solid rgba(107,74,48,.35);background:rgba(255,255,255,.38);font-size:9px;line-height:1}.empty{flex:1;text-align:center;border:1px dashed rgba(111,75,45,.20);border-radius:9px;background:rgba(255,250,240,.45);color:#7c5b43;padding:9px 5px;font:700 13px/1.1 'Gaegu',cursive}.drawerFront{position:relative;z-index:3;margin:4px -2px -3px;height:13px;border-radius:3px 3px 12px 12px;background:linear-gradient(#bd804a,#a96b39);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}.knob{position:absolute;left:50%;top:3px;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e6b777,#8b522d 68%);border:1px solid #7c4727}.grass{position:relative;z-index:3;display:flex;justify-content:space-between;margin:3px 2px -1px;font-size:10px;opacity:.86}
@media(max-width:330px){.widget{padding:11px 9px 9px}.top{gap:6px}.sticky{padding:12px 6px 8px}.cardTitle{font-size:18px}.task input{font-size:13px}.chip{display:none}.plaque{min-width:185px}.plaque .title{font-size:20px}.flow{font-size:10px}.flow span{padding:2px 5px}.village,.dotted{display:none}}
</style>
</head>
<body>
<div class="widget">
  <div class="cloud a">☁️</div><div class="cloud b">☁️</div><div class="dotted"></div><div class="village">🌳🏠🌳🏡🌳</div>
  <header class="header"><div class="plaque"><span class="deco">🌿</span><span class="title">Work Today</span><span class="deco">🌸</span></div><div class="headDate" id="headDate"></div></header>
  <div class="flow"><span>Tomorrow</span><b>→</b><span>Today</span><b>→</b><span>Archive</span></div>
  <div class="top">
    <section class="sticky today"><div class="tape"></div><div class="curl"></div><div class="cardHead"><div class="cardTitle"><span class="doodle">🌿</span>Today <span class="doodle">✦</span></div><div class="chip" id="todayDate"></div></div><div class="dash"></div><div class="list" id="todayList"></div><div class="foot"><button class="add" data-add="today">+ Add</button></div></section>
    <section class="sticky tomorrow"><div class="tape"></div><div class="curl"></div><div class="cardHead"><div class="cardTitle">Tomorrow <span class="doodle">♡</span></div><div class="chip" id="tomorrowDate"></div></div><div class="dash"></div><div class="list" id="tomorrowList"></div><div class="foot"><button class="add" data-add="tomorrow">+ Add</button></div></section>
  </div>
  <section class="sticky week"><div class="tape"></div><div class="curl"></div><div class="weekHead"><div class="cardTitle"><span class="doodle">🌱</span>This Week <span class="doodle">✦</span></div><div class="chip" id="weekDate"></div></div><div class="dash"></div><div class="list" id="weekList"></div><div class="foot"><button class="add" data-add="week">+ Add</button></div><div class="weekTree">🌳🌼</div></section>
  <section class="archive" id="archiveBox"><div class="archiveLabel">Archive</div><div class="archiveTop"><span class="count" id="archiveCount">0 saved</span><button class="small" id="toggleArchive">Show</button><button class="small" id="clearArchive">Clear</button></div><div class="archiveViewport"><div class="archiveList" id="archiveList"></div></div><div class="drawerFront"><div class="knob"></div></div></section>
  <div class="grass"><span>🌿🌼🌱</span><span>🌱🌷🌿</span></div>
</div>
<script>
const KEYS=['lifetown_work_today_compact_v4','lifetown_work_today_compact_v3','lifetown_work_today_postit_v1','lifetown_work_today_v1'];const KEY=KEYS[0];
const id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36).slice(-4);const blank=()=>({id:id(),text:'',done:false});const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
function load(){for(const k of KEYS){try{const v=JSON.parse(localStorage.getItem(k)||'null');if(v&&typeof v==='object')return v}catch{}}return{lastDate:dkey(new Date()),today:[blank()],tomorrow:[blank()],week:[blank()],archive:[],archiveOpen:false}}
const s=load();function save(){localStorage.setItem(KEY,JSON.stringify(s))}function norm(){['today','tomorrow','week'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];s[k]=s[k].map(x=>({id:x.id||id(),text:String(x.text||''),done:!!x.done}));if(!s[k].length)s[k]=[blank()]});if(!Array.isArray(s.archive))s.archive=[];if(typeof s.archiveOpen!=='boolean')s.archiveOpen=false;save()}
function archiveToday(date){(s.today||[]).filter(x=>x.text.trim()).reverse().forEach(x=>s.archive.unshift({id:id(),text:x.text.trim(),done:!!x.done,date}))}function rollover(){const now=dkey(new Date());if(!s.lastDate){s.lastDate=now;save();return}if(s.lastDate===now)return;let gap=Math.floor((fromKey(now)-fromKey(s.lastDate))/86400000);if(!Number.isFinite(gap)||gap<1)gap=1;for(let i=0;i<gap;i++){archiveToday(s.lastDate);const mv=(s.tomorrow||[]).filter(x=>x.text.trim()||x.done).map(x=>({id:id(),text:x.text,done:!!x.done}));s.today=mv.length?mv:[blank()];s.tomorrow=[blank()];const n=fromKey(s.lastDate);n.setDate(n.getDate()+1);s.lastDate=dkey(n)}s.lastDate=now;save()}
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');function section(k){const root=document.getElementById(k+'List');root.innerHTML='';s[k].forEach(t=>{const r=document.createElement('div');r.className='task'+(t.done?' done':'');r.innerHTML=`<button class="check ${t.done?'done':''}">${t.done?'✓':''}</button><input value="${esc(t.text)}" placeholder="Write a note..."><button class="x">×</button>`;r.querySelector('.check').onclick=()=>{t.done=!t.done;save();section(k)};const inp=r.querySelector('input');inp.oninput=e=>{t.text=e.target.value;save()};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add(k)}};r.querySelector('.x').onclick=()=>{s[k]=s[k].filter(x=>x.id!==t.id);if(!s[k].length)s[k]=[blank()];save();section(k)};root.appendChild(r)})}function add(k){s[k].push(blank());save();section(k);const xs=document.querySelectorAll('#'+k+'List input');xs[xs.length-1]?.focus()}
function arch(){const box=document.getElementById('archiveBox'),root=document.getElementById('archiveList');box.classList.toggle('open',s.archiveOpen);document.getElementById('toggleArchive').textContent=s.archiveOpen?'Hide':'Show';document.getElementById('archiveCount').textContent=s.archive.length+' saved';root.innerHTML='';if(!s.archive.length){root.innerHTML='<div class="empty">Finished Today notes will be saved here ✿</div>';return}s.archive.forEach(a=>{const c=document.createElement('div');c.className='archItem';c.innerHTML=`<span class="clip"></span><button class="archDel">×</button><div class="archMeta">${a.date}${a.done?' · done':''}</div><div class="archText">${esc(a.text)}</div>`;c.querySelector('.archDel').onclick=()=>{s.archive=s.archive.filter(x=>x.id!==a.id);save();arch()};root.appendChild(c)})}
function dates(){const n=new Date(),tm=new Date(n);tm.setDate(n.getDate()+1);document.getElementById('headDate').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();document.getElementById('todayDate').textContent=n.toLocaleDateString('en-US',{month:'short',day:'numeric'});document.getElementById('tomorrowDate').textContent=tm.toLocaleDateString('en-US',{month:'short',day:'numeric'});const st=new Date(n),df=(st.getDay()+6)%7;st.setDate(st.getDate()-df);const en=new Date(st);en.setDate(st.getDate()+6);const f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});document.getElementById('weekDate').textContent=f(st)+' – '+f(en)}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));document.getElementById('toggleArchive').onclick=()=>{s.archiveOpen=!s.archiveOpen;save();arch()};document.getElementById('clearArchive').onclick=()=>{s.archive=[];save();arch()};rollover();norm();dates();section('today');section('tomorrow');section('week');arch();
</script>
</body></html>
