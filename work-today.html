<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Work Today · Life Town</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap');
:root{
  --ink:#624532;--muted:#987a62;--line:#ead6b7;
  --yellow:#f5df96;--pink:#efd0cb;--sage:#d8e5c2;
  --green:#84a75f;--wood1:#d7a773;--wood2:#b97843;--wood3:#8e572f;
  --cream:#fbf2e1;--shadow:0 8px 20px rgba(94,67,43,.12)
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink)}
body{padding:5px;font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.widget{
  width:100%;max-width:458px;margin:auto;position:relative;overflow:hidden;
  padding:12px 11px 10px;border:1px solid var(--line);border-radius:25px;
  background:
    radial-gradient(circle at 12% 8%,rgba(255,255,255,.94),transparent 25%),
    radial-gradient(circle at 86% 14%,rgba(248,230,199,.40),transparent 32%),
    repeating-linear-gradient(4deg,rgba(111,79,49,.024) 0 1px,transparent 1px 5px),
    linear-gradient(180deg,#fffdfa 0%,#fff7eb 100%);
  box-shadow:var(--shadow),inset 0 0 0 3px rgba(255,255,255,.72)
}
.widget:before{content:"";position:absolute;inset:7px;border:1px dashed rgba(162,124,82,.23);border-radius:18px;pointer-events:none}
.widget:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.23;mix-blend-mode:multiply;background-image:radial-gradient(circle at 15% 28%,rgba(98,69,42,.13) 0 .42px,transparent .65px),radial-gradient(circle at 74% 61%,rgba(98,69,42,.09) 0 .4px,transparent .62px);background-size:8px 8px,12px 12px}

/* HEADER */
.header{position:relative;z-index:4;display:grid;grid-template-columns:92px minmax(0,1fr) 92px;gap:5px;align-items:end;min-height:94px;margin:0 0 10px}
.headerSide{position:relative;height:88px;overflow:visible}
.headerCenter{text-align:center;position:relative;z-index:4;padding-bottom:1px}
.headerPath{position:absolute;top:26px;width:76px;height:30px;fill:none;stroke:#b88754;stroke-width:1.45;stroke-linecap:round;stroke-dasharray:2 5;opacity:.75;pointer-events:none}
.headerPath.left{right:-19px}.headerPath.right{left:-19px;transform:scaleX(-1)}
.cloud{position:absolute;width:37px;height:23px;filter:drop-shadow(0 2px 2px rgba(87,95,101,.12));opacity:.92}
.cloud.left{left:1px;top:10px}.cloud.right{right:0;top:9px}
.lifeBadge{position:absolute;left:18px;bottom:1px;width:68px;height:61px;transform:rotate(-7deg);filter:drop-shadow(0 4px 4px rgba(92,64,38,.12));z-index:2}
.village{position:absolute;right:1px;bottom:3px;width:89px;height:50px;filter:drop-shadow(0 3px 2px rgba(78,61,41,.10));z-index:2}
.spark{position:absolute;width:11px;height:11px;z-index:3;opacity:.88}.spark.left{right:3px;top:35px}.spark.right{left:3px;top:36px}

.plaqueWrap{display:inline-block;position:relative;padding:3px}
.plaqueShadow{position:absolute;left:18px;right:18px;bottom:0;height:11px;border-radius:50%;background:rgba(112,79,46,.12);filter:blur(4px)}
.plaque{
  min-width:228px;position:relative;display:flex;align-items:center;justify-content:center;
  padding:12px 31px 13px;border:1px solid #dec19a;border-radius:21px;
  background:
    repeating-linear-gradient(0deg,rgba(121,86,52,.031) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.11) 0 2px,transparent 2px 7px),
    radial-gradient(ellipse at 16% 14%,rgba(255,255,255,.75),transparent 34%),
    linear-gradient(180deg,#fcf3e4 0%,#f1dfc5 100%);
  box-shadow:0 6px 13px rgba(97,67,41,.13),inset 0 0 0 3px rgba(255,255,255,.46),inset 0 -4px 8px rgba(183,145,100,.13)
}
.plaque:before{content:"";position:absolute;inset:5px;border:1.4px dashed rgba(164,123,79,.44);border-radius:15px;pointer-events:none}
.plaque:after{content:"";position:absolute;left:22px;right:22px;bottom:5px;height:4px;border-radius:50%;background:rgba(156,114,70,.08);filter:blur(1.5px)}
.plaqueTitle{position:relative;z-index:3;font:900 25px/1 'Nunito',sans-serif;letter-spacing:-.045em;color:#68472f;text-shadow:0 1px 0 #fffaf0,0 2px 3px rgba(91,61,37,.09)}
.plaqueLeaf{position:absolute;left:10px;bottom:7px;width:29px;height:26px;z-index:3}.plaqueFlower{position:absolute;right:9px;top:7px;width:29px;height:29px;z-index:3}
.headDate{margin-top:4px;font-size:8.5px;font-weight:700;letter-spacing:.105em;color:var(--muted)}

/* NOTES */
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;position:relative;z-index:3}
.sticky{position:relative;min-width:0;border:1px solid rgba(149,105,64,.20);border-radius:17px 17px 20px 17px;padding:14px 9px 9px;box-shadow:0 8px 16px rgba(105,74,46,.11),inset 0 0 0 1px rgba(255,255,255,.20);overflow:visible}
.sticky:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.35;mix-blend-mode:multiply;background-image:radial-gradient(circle at 17% 20%,rgba(95,67,44,.20) 0 .42px,transparent .72px),radial-gradient(circle at 76% 58%,rgba(95,67,44,.14) 0 .4px,transparent .67px),repeating-linear-gradient(1deg,rgba(95,67,44,.034) 0 1px,transparent 1px 4px);background-size:7px 7px,11px 11px,100% 100%}
.sticky:after{content:"";position:absolute;left:7px;right:7px;top:4px;height:7px;border-radius:50%;background:rgba(255,255,255,.15);filter:blur(2px);pointer-events:none}
.today{background:linear-gradient(155deg,#fbedb7 0%,#f2d681 100%);transform:rotate(-.20deg)}
.tomorrow{background:linear-gradient(155deg,#f8e1dd 0%,#ecc5be 100%);transform:rotate(.20deg)}
.week{background:linear-gradient(155deg,#e7efda 0%,#ceddb1 100%);margin-top:10px;transform:rotate(-.06deg)}
.tape{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:62px;height:15px;border-radius:2px;opacity:.96;box-shadow:0 2px 3px rgba(70,50,34,.10)}
.tape:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 6px,rgba(107,76,46,.055) 6px 7px);mix-blend-mode:multiply}
.tape:after{content:"";position:absolute;left:-2px;right:-2px;top:2px;bottom:2px;clip-path:polygon(0 13%,3% 0,7% 16%,11% 2%,17% 14%,23% 0,31% 13%,38% 0,47% 13%,57% 0,67% 12%,77% 0,87% 13%,96% 0,100% 14%,100% 86%,96% 100%,89% 85%,80% 100%,71% 87%,61% 100%,51% 87%,42% 100%,31% 86%,21% 100%,12% 87%,4% 100%,0 87%);border:1px solid rgba(255,255,255,.11)}
.today .tape{background:repeating-linear-gradient(0deg,#efc95c 0 6px,#fff0b3 6px 9px)}
.tomorrow .tape{background:repeating-linear-gradient(0deg,#e6a5a0 0 6px,#f9ddd9 6px 9px)}
.week .tape{background:repeating-linear-gradient(0deg,#b3c895 0 6px,#e9efd8 6px 9px)}
.curl{position:absolute;right:-1px;bottom:-1px;width:40px;height:40px;border-radius:0 0 18px 0;clip-path:polygon(100% 0,100% 100%,0 100%);background:linear-gradient(135deg,transparent 0 44%,rgba(103,70,41,.16) 47% 51%,rgba(255,255,255,.84) 53% 100%);filter:drop-shadow(-2px -2px 2px rgba(91,61,35,.10));pointer-events:none}
.cardHead,.weekHead{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;min-height:24px;padding:0 30px}
.cardTitle{width:100%;text-align:center;font:800 18px/1.05 'Nunito',sans-serif;letter-spacing:-.025em;color:#604531}
.chip{position:absolute;right:0;top:50%;transform:translateY(-50%);border-radius:999px;background:rgba(255,249,237,.78);border:1px solid rgba(255,255,255,.52);padding:3px 6px;font-size:7.4px;font-weight:700;color:#987861;white-space:nowrap;box-shadow:0 1px 2px rgba(94,65,38,.05)}
.titleUnderline{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);width:49px;border-top:1px dashed rgba(104,72,46,.38)}
.dash{border-top:1.2px dashed rgba(115,79,52,.18);margin:9px 0 7px;position:relative;z-index:2}
.list{display:flex;flex-direction:column;gap:5px;min-height:73px;position:relative;z-index:2}.week .list{min-height:0}
.task{display:grid;grid-template-columns:16px minmax(0,1fr) 12px;align-items:center;gap:6px;padding:1px 0}
.check{width:16px;height:16px;padding:0;border-radius:50%;border:1.3px solid rgba(101,70,49,.70);background:rgba(255,255,255,.50);display:grid;place-items:center;font-size:9px;box-shadow:inset 0 1px 1px rgba(255,255,255,.52),0 1px 2px rgba(83,57,36,.06)}
.check.done{background:var(--green);border-color:#73914e;color:white;box-shadow:inset 0 1px 1px rgba(255,255,255,.24)}
.task input{width:100%;min-width:0;border:0;outline:0;background:transparent;font:500 12.2px/1.35 'Inter',sans-serif;letter-spacing:-.012em;padding:2px 0;color:#594233}
.task input::placeholder{color:rgba(101,70,49,.37);font-weight:400}.task.done input{text-decoration:line-through;opacity:.58}
.x{border:0;background:transparent;padding:0;color:rgba(101,70,49,.34);font-size:12px;line-height:1}.foot{display:flex;justify-content:flex-end;margin-top:5px;position:relative;z-index:2}.add{border:0;border-radius:999px;background:rgba(255,249,237,.72);border:1px solid rgba(255,255,255,.42);padding:4px 8px;font-size:8px;font-weight:700;color:#755138;box-shadow:0 1px 2px rgba(96,66,39,.05)}
.week .task input{font-size:12px}.cornerDecor{position:absolute;right:8px;bottom:4px;width:34px;height:22px;opacity:.75;pointer-events:none;z-index:2}

/* ARCHIVE */
.archive{position:relative;z-index:3;margin-top:14px;padding:16px 8px 8px;border-radius:15px 15px 20px 20px;border:1px solid #965f36;background:radial-gradient(ellipse at 17% 34%,rgba(94,53,23,.18) 0 3px,transparent 4px),radial-gradient(ellipse at 77% 58%,rgba(94,53,23,.14) 0 2px,transparent 3px),repeating-linear-gradient(1deg,rgba(73,42,20,.075) 0 1px,transparent 1px 5px),linear-gradient(180deg,var(--wood1) 0%,var(--wood2) 100%);box-shadow:0 10px 18px rgba(89,52,27,.23),inset 0 2px 0 rgba(255,255,255,.24)}
.archive:before{content:"";position:absolute;left:7px;right:7px;top:39px;bottom:7px;border-radius:10px 10px 14px 14px;background:repeating-linear-gradient(1deg,rgba(94,61,34,.038) 0 1px,transparent 1px 5px),linear-gradient(#edd4b1,#d0a273);box-shadow:inset 0 8px 13px rgba(83,51,28,.20),inset 0 -2px 0 rgba(255,255,255,.16)}
.archive:after{content:"";position:absolute;left:4px;right:4px;top:34px;height:8px;border-radius:4px;background:linear-gradient(#b87943,#985c31);box-shadow:0 2px 3px rgba(69,39,20,.20);z-index:2}
.archiveLabel{position:absolute;top:-14px;left:50%;transform:translateX(-50%);min-width:146px;text-align:center;padding:6px 16px;border-radius:12px;border:1.5px solid #9b6b44;background:repeating-linear-gradient(0deg,rgba(112,80,48,.035) 0 1px,transparent 1px 4px),linear-gradient(#f7e9d0,#e5c69b);box-shadow:0 5px 8px rgba(88,55,32,.16),inset 0 0 0 2px rgba(255,255,255,.27);font:800 17px/1 'Nunito',sans-serif;letter-spacing:-.02em;z-index:6;color:#62462f}
.archiveLabel:before,.archiveLabel:after{content:"";position:absolute;top:50%;width:18px;border-top:1px solid rgba(114,78,46,.26)}.archiveLabel:before{left:10px}.archiveLabel:after{right:10px}
.archiveTop{position:relative;z-index:5;display:flex;justify-content:flex-end;align-items:center;gap:4px;margin-bottom:9px;min-height:13px}.small,.count{border:0;border-radius:999px;background:rgba(255,249,237,.78);padding:3px 6px;font-size:8px;font-weight:700;color:#704d34}.count{background:rgba(101,59,26,.19);color:#fff8ef}
.archiveViewport{position:relative;z-index:4;overflow-x:auto;overflow-y:hidden;padding:5px 1px 2px}.archiveList{display:none;gap:7px;min-height:86px;align-items:end}.archive.open .archiveList{display:flex}
.archItem{position:relative;flex:0 0 106px;min-height:78px;padding:13px 19px 8px 8px;border:1px solid rgba(132,94,59,.25);border-radius:9px 9px 5px 5px;background:repeating-linear-gradient(0deg,rgba(95,67,44,.028) 0 1px,transparent 1px 4px),linear-gradient(#fff9ef,#f8ead5);box-shadow:0 6px 9px rgba(85,58,37,.13);transform:rotate(-.4deg)}
.archItem:nth-child(3n+2){background:repeating-linear-gradient(0deg,rgba(95,67,44,.026) 0 1px,transparent 1px 4px),linear-gradient(#fcefe8,#f4ded7);transform:rotate(.5deg)}.archItem:nth-child(3n+3){background:repeating-linear-gradient(0deg,rgba(95,67,44,.025) 0 1px,transparent 1px 4px),linear-gradient(#eef4f3,#dfe9eb);transform:rotate(-.2deg)}
.clip{position:absolute;left:11px;top:-6px;width:8px;height:23px;border:2px solid #b67742;border-radius:6px;transform:rotate(8deg);z-index:2;box-shadow:0 1px 1px rgba(87,55,32,.12)}.archItem:nth-child(3n+2) .clip{border-color:#c36c69}.archItem:nth-child(3n+3) .clip{border-color:#5d879c}
.archMeta{position:relative;z-index:2;font-size:7px;font-weight:700;color:#98745a;margin-bottom:5px}.archText{position:relative;z-index:2;font:500 10.8px/1.25 'Inter',sans-serif;letter-spacing:-.01em;word-break:break-word;color:#5d4638}.archDel{position:absolute;right:5px;top:5px;width:15px;height:15px;padding:0;border-radius:50%;border:1px solid rgba(107,74,48,.35);background:rgba(255,255,255,.48);font-size:9px;line-height:1;z-index:3}.empty{flex:1;text-align:center;border:1px dashed rgba(111,75,45,.20);border-radius:9px;background:rgba(255,250,240,.46);color:#7c5b43;padding:10px 5px;font:600 10.5px/1.3 'Inter',sans-serif}
.drawerFront{position:relative;z-index:4;margin:5px -2px -3px;height:15px;border-radius:3px 3px 12px 12px;background:repeating-linear-gradient(1deg,rgba(77,44,20,.08) 0 1px,transparent 1px 4px),linear-gradient(#bc7c46,#a36434);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 -2px 3px rgba(74,42,22,.10)}
.knob{position:absolute;left:50%;top:3px;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#eabd7e,#83502d 67%);border:1px solid #724022;box-shadow:0 1px 2px rgba(70,42,22,.27)}
.footerDecor{position:relative;z-index:3;height:15px;margin-top:3px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 5px}.footerDecor svg{width:42px;height:15px;opacity:.82}

@media(max-width:390px){.header{grid-template-columns:72px minmax(0,1fr) 72px;gap:2px;min-height:86px}.lifeBadge{width:58px;height:52px;left:10px}.village{width:72px;height:42px}.headerPath{width:58px}.headerPath.left{right:-15px}.headerPath.right{left:-15px}.cloud{width:31px}.plaque{min-width:204px;padding:11px 26px 12px}.plaqueTitle{font-size:22px}.plaqueLeaf,.plaqueFlower{transform:scale(.86)}.top{gap:6px}.sticky{padding:13px 6px 8px}.cardHead,.weekHead{padding:0 24px}.cardTitle{font-size:16px}.task input{font-size:11.2px}.chip{display:none}}
</style>
</head>
<body>
<div class="widget">
  <header class="header">
    <div class="headerSide">
      <svg class="cloud left" viewBox="0 0 60 38" fill="none"><path d="M13 30h32c7 0 11-4 11-9 0-5-4-9-10-9-2-6-7-9-13-9-7 0-13 5-14 11-1-1-3-1-5-1-6 0-10 4-10 9 0 5 4 8 9 8Z" fill="#F8FBFC" stroke="#B7C8CB" stroke-width="2"/><path d="M9 27c8 2 30 2 40 0" stroke="#E8EFEF" stroke-width="1.4" stroke-linecap="round"/></svg>
      <svg class="lifeBadge" viewBox="0 0 82 72" fill="none"><path d="M14 8h52c6 0 10 5 9 11l-4 38c-1 5-5 8-10 8H21c-5 0-9-3-10-8L5 20C4 13 8 8 14 8Z" fill="#F6E5C8" stroke="#D9B88B" stroke-width="1.4"/><path d="M15 13h48c4 0 7 3 7 7l-4 34c0 4-3 6-7 6H23c-4 0-7-2-8-6l-4-34c0-4 1-7 4-7Z" stroke="#D8B98E" stroke-width="1" stroke-dasharray="2 3"/><path d="M25 40 38 28l13 12v14H25V40Z" fill="#F0D39B" stroke="#A66E47" stroke-width="1.2"/><path d="m35 28 7-7 13 12-4 4-9-8-10 9-5-4 8-6Z" fill="#B56F4D"/><rect x="36" y="42" width="6" height="12" rx="1.2" fill="#98603F"/><rect x="45" y="41" width="5" height="5" rx="1" fill="#9CC5D0"/><path d="M18 51c3-9 7-13 12-15-1 8-4 14-10 18M57 51c0-7 3-12 8-16 1 8-1 14-6 18" stroke="#739A58" stroke-width="2" stroke-linecap="round"/><text x="41" y="18" text-anchor="middle" font-family="Nunito, sans-serif" font-size="8" font-weight="900" fill="#7A593E">Life town</text><circle cx="61" cy="22" r="2.1" fill="#EAA5A0"/><circle cx="65" cy="25" r="1.7" fill="#EFC17F"/></svg>
      <svg class="spark left" viewBox="0 0 14 14"><path d="m7 1 1.2 4L12 7 8.2 8.2 7 13 5.8 8.2 2 7l3.8-2L7 1Z" fill="#EFC17F" stroke="#C58D4D" stroke-width=".7"/></svg>
      <svg class="headerPath left" viewBox="0 0 80 30"><path d="M2 24C15 4 35 8 44 17c8 8 20 9 33-2"/></svg>
    </div>

    <div class="headerCenter">
      <div class="plaqueWrap">
        <div class="plaqueShadow"></div>
        <div class="plaque">
          <svg class="plaqueLeaf" viewBox="0 0 32 28" fill="none"><path d="M5 25C8 16 14 8 26 4c-1 10-7 18-18 20" stroke="#739456" stroke-width="2" stroke-linecap="round"/><path d="M10 19c4 0 8-2 11-6" stroke="#739456" stroke-width="1.5" stroke-linecap="round"/><path d="M9 21c-3-3-3-6-2-9 4 1 6 4 6 7" fill="#9FC17B" stroke="#739456" stroke-width="1"/></svg>
          <span class="plaqueTitle">Work Today</span>
          <svg class="plaqueFlower" viewBox="0 0 30 30"><g fill="#E6A3A1" stroke="#C98785" stroke-width=".6"><ellipse cx="15" cy="7" rx="4.4" ry="6.3"/><ellipse cx="23" cy="15" rx="6.3" ry="4.4"/><ellipse cx="15" cy="23" rx="4.4" ry="6.3"/><ellipse cx="7" cy="15" rx="6.3" ry="4.4"/></g><circle cx="15" cy="15" r="3.5" fill="#EFC17F"/><circle cx="24" cy="6" r="2.1" fill="#F0C581"/><circle cx="27" cy="10" r="1.6" fill="#92B76D"/></svg>
        </div>
      </div>
      <div class="headDate" id="headDate"></div>
    </div>

    <div class="headerSide">
      <svg class="cloud right" viewBox="0 0 60 38" fill="none"><path d="M13 30h32c7 0 11-4 11-9 0-5-4-9-10-9-2-6-7-9-13-9-7 0-13 5-14 11-1-1-3-1-5-1-6 0-10 4-10 9 0 5 4 8 9 8Z" fill="#F8FBFC" stroke="#B7C8CB" stroke-width="2"/><path d="M9 27c8 2 30 2 40 0" stroke="#E8EFEF" stroke-width="1.4" stroke-linecap="round"/></svg>
      <svg class="spark right" viewBox="0 0 14 14"><path d="m7 1 1.2 4L12 7 8.2 8.2 7 13 5.8 8.2 2 7l3.8-2L7 1Z" fill="#EFC17F" stroke="#C58D4D" stroke-width=".7"/></svg>
      <svg class="headerPath right" viewBox="0 0 80 30"><path d="M2 24C15 4 35 8 44 17c8 8 20 9 33-2"/></svg>
      <svg class="village" viewBox="0 0 104 57" fill="none"><path d="M2 50h100" stroke="#B78B5A" stroke-width="1" stroke-dasharray="2 3"/><g stroke="#976141" stroke-width="1"><path d="M18 31 27 22l9 9v17H18V31Z" fill="#F0D19D"/><path d="m16 31 11-12 11 12" fill="#B86F4C"/><rect x="24" y="38" width="5" height="10" rx="1" fill="#96603F"/><path d="M43 28 52 18l10 10v20H43V28Z" fill="#F5DEB5"/><path d="m41 28 11-13 12 13" fill="#A76945"/><rect x="49" y="37" width="6" height="11" rx="1" fill="#8F5A3C"/><path d="M69 33 77 25l9 8v15H69V33Z" fill="#EDD0A6"/><path d="m67 33 10-11 11 11" fill="#B5764B"/><rect x="75" y="39" width="5" height="9" rx="1" fill="#935E3E"/></g><g fill="#89AD66" stroke="#6E9452" stroke-width=".8"><circle cx="9" cy="38" r="6"/><circle cx="94" cy="38" r="6"/><circle cx="39" cy="42" r="4"/><circle cx="65" cy="42" r="4"/></g><g stroke="#8B6645" stroke-width="1.2"><path d="M9 43v7M94 43v7M39 45v5M65 45v5"/></g><rect x="47" y="29" width="4" height="4" rx=".7" fill="#9CC3CE"/><rect x="54" y="29" width="4" height="4" rx=".7" fill="#9CC3CE"/><rect x="22" y="32" width="4" height="4" rx=".7" fill="#9CC3CE"/><rect x="80" y="34" width="4" height="4" rx=".7" fill="#9CC3CE"/></svg>
    </div>
  </header>

  <div class="top">
    <section class="sticky today">
      <div class="tape"></div><div class="curl"></div>
      <div class="cardHead"><div class="cardTitle">Today</div><div class="chip" id="todayDate"></div><div class="titleUnderline"></div></div>
      <div class="dash"></div><div class="list" id="todayList"></div>
      <div class="foot"><button class="add" data-add="today">+ Add</button></div>
    </section>
    <section class="sticky tomorrow">
      <div class="tape"></div><div class="curl"></div>
      <div class="cardHead"><div class="cardTitle">Tomorrow</div><div class="chip" id="tomorrowDate"></div><div class="titleUnderline"></div></div>
      <div class="dash"></div><div class="list" id="tomorrowList"></div>
      <div class="foot"><button class="add" data-add="tomorrow">+ Add</button></div>
    </section>
  </div>

  <section class="sticky week">
    <div class="tape"></div><div class="curl"></div>
    <div class="weekHead"><div class="cardTitle">This Week</div><div class="chip" id="weekDate"></div><div class="titleUnderline"></div></div>
    <div class="dash"></div><div class="list" id="weekList"></div>
    <div class="foot"><button class="add" data-add="week">+ Add</button></div>
    <svg class="cornerDecor" viewBox="0 0 38 24" fill="none"><path d="M5 22c4-7 9-12 17-16M14 15c-2-5-1-8 2-10 4 4 4 7 1 11M23 10c1-4 4-7 7-7 0 5-2 7-6 9" stroke="#789759" stroke-width="1.3" stroke-linecap="round"/><circle cx="31" cy="18" r="2.4" fill="#E5AB9F"/><circle cx="35" cy="15" r="2" fill="#EFC27F"/></svg>
  </section>

  <section class="archive open" id="archiveBox">
    <div class="archiveLabel">Archive</div>
    <div class="archiveTop"><span class="count" id="archiveCount">0 saved</span><button class="small" id="toggleArchive">Hide</button><button class="small" id="clearArchive">Clear</button></div>
    <div class="archiveViewport"><div class="archiveList" id="archiveList"></div></div>
    <div class="drawerFront"><div class="knob"></div></div>
  </section>

  <div class="footerDecor">
    <svg viewBox="0 0 48 16" fill="none"><path d="M2 15c5-6 10-9 15-11M12 10c-2-4-1-6 1-8 4 3 4 6 2 9M25 15c3-6 7-9 12-11" stroke="#799657" stroke-width="1.3" stroke-linecap="round"/><circle cx="39" cy="10" r="2.2" fill="#E4A9A2"/><circle cx="43" cy="12" r="1.8" fill="#EFC27F"/></svg>
    <svg viewBox="0 0 48 16" fill="none"><path d="M46 15c-5-6-10-9-15-11M36 10c2-4 1-6-1-8-4 3-4 6-2 9M23 15c-3-6-7-9-12-11" stroke="#799657" stroke-width="1.3" stroke-linecap="round"/><circle cx="9" cy="10" r="2.2" fill="#E4A9A2"/><circle cx="5" cy="12" r="1.8" fill="#EFC27F"/></svg>
  </div>
</div>

<script>
const KEYS=['lifetown_work_today_v9','lifetown_work_today_v8','lifetown_work_today_v7','lifetown_work_today_v6','lifetown_work_today_compact_v4','lifetown_work_today_compact_v3','lifetown_work_today_postit_v1','lifetown_work_today_v1'];
const KEY=KEYS[0];
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36).slice(-4);
const blank=()=>({id:uid(),text:'',done:false});
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
function load(){for(const k of KEYS){try{const v=JSON.parse(localStorage.getItem(k)||'null');if(v&&typeof v==='object')return v}catch{}}return{lastDate:dateKey(new Date()),today:[blank()],tomorrow:[blank()],week:[blank()],archive:[],archiveOpen:true,sampleSeeded:false}}
const s=load();
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function normalize(){['today','tomorrow','week'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];s[k]=s[k].map(x=>({id:x.id||uid(),text:String(x.text||''),done:!!x.done}));if(!s[k].length)s[k]=[blank()]});if(!Array.isArray(s.archive))s.archive=[];if(typeof s.archiveOpen!=='boolean')s.archiveOpen=true;if(typeof s.sampleSeeded!=='boolean')s.sampleSeeded=false;save()}
function seedSample(){if(s.sampleSeeded)return;if(!s.archive.length){const d=new Date();d.setDate(d.getDate()-2);s.archive.push({id:uid(),text:'Client follow-up',done:true,date:dateKey(d),sample:true});s.archiveOpen=true}s.sampleSeeded=true;save()}
function archiveToday(k){(s.today||[]).filter(x=>x.text.trim()).reverse().forEach(x=>s.archive.unshift({id:uid(),text:x.text.trim(),done:!!x.done,date:k}))}
function rollover(){const now=dateKey(new Date());if(!s.lastDate){s.lastDate=now;save();return}if(s.lastDate===now)return;let gap=Math.floor((fromKey(now)-fromKey(s.lastDate))/86400000);if(!Number.isFinite(gap)||gap<1)gap=1;for(let i=0;i<gap;i++){archiveToday(s.lastDate);const moved=(s.tomorrow||[]).filter(x=>x.text.trim()||x.done).map(x=>({id:uid(),text:x.text,done:!!x.done}));s.today=moved.length?moved:[blank()];s.tomorrow=[blank()];const n=fromKey(s.lastDate);n.setDate(n.getDate()+1);s.lastDate=dateKey(n)}s.lastDate=now;save()}
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function renderSection(k){const root=document.getElementById(k+'List');root.innerHTML='';s[k].forEach(t=>{const r=document.createElement('div');r.className='task'+(t.done?' done':'');r.innerHTML=`<button class="check ${t.done?'done':''}">${t.done?'✓':''}</button><input value="${esc(t.text)}" placeholder="Write a note..."><button class="x">×</button>`;r.querySelector('.check').onclick=()=>{t.done=!t.done;save();renderSection(k)};const inp=r.querySelector('input');inp.oninput=e=>{t.text=e.target.value;save()};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add(k)}};r.querySelector('.x').onclick=()=>{s[k]=s[k].filter(x=>x.id!==t.id);if(!s[k].length)s[k]=[blank()];save();renderSection(k)};root.appendChild(r)})}
function add(k){s[k].push(blank());save();renderSection(k);const xs=document.querySelectorAll('#'+k+'List input');xs[xs.length-1]?.focus()}
function renderArchive(){const box=document.getElementById('archiveBox'),root=document.getElementById('archiveList');box.classList.toggle('open',s.archiveOpen);document.getElementById('toggleArchive').textContent=s.archiveOpen?'Hide':'Show';document.getElementById('archiveCount').textContent=s.archive.length+' saved';root.innerHTML='';if(!s.archive.length){root.innerHTML='<div class="empty">Finished Today notes will be saved here.</div>';return}s.archive.forEach(a=>{const c=document.createElement('div');c.className='archItem';c.innerHTML=`<div class="clip"></div><button class="archDel">×</button><div class="archMeta">${a.date}${a.done?' · done':''}</div><div class="archText">${esc(a.text)}</div>`;c.querySelector('.archDel').onclick=()=>{s.archive=s.archive.filter(x=>x.id!==a.id);save();renderArchive()};root.appendChild(c)})}
function renderDates(){const n=new Date(),tm=new Date(n);tm.setDate(n.getDate()+1);document.getElementById('headDate').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();document.getElementById('todayDate').textContent=n.toLocaleDateString('en-US',{month:'short',day:'numeric'});document.getElementById('tomorrowDate').textContent=tm.toLocaleDateString('en-US',{month:'short',day:'numeric'});const st=new Date(n),diff=(st.getDay()+6)%7;st.setDate(st.getDate()-diff);const en=new Date(st);en.setDate(st.getDate()+6);const f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});document.getElementById('weekDate').textContent=f(st)+' – '+f(en)}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));
document.getElementById('toggleArchive').onclick=()=>{s.archiveOpen=!s.archiveOpen;save();renderArchive()};
document.getElementById('clearArchive').onclick=()=>{s.archive=[];save();renderArchive()};
rollover();normalize();seedSample();renderDates();renderSection('today');renderSection('tomorrow');renderSection('week');renderArchive();
</script>
</body>
</html>
