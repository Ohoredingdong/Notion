<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Work Today · Life Town</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@700;800;900&display=swap');
:root{--ink:#684833;--muted:#9c7d67;--line:#ead5b4;--yellow:#f8e7a8;--pink:#f3d8d3;--sage:#dce8c8;--wood:#d4a270;--green:#8cab65;--shadow:0 7px 17px rgba(103,74,47,.09)}
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--ink)}body{padding:5px;font-family:'Nunito',system-ui,sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}
.widget{width:100%;max-width:452px;margin:auto;position:relative;overflow:hidden;padding:12px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,#fffdf8,#fff8ee);box-shadow:var(--shadow),inset 0 0 0 3px #ffffffa8}
.widget:before{content:"";position:absolute;inset:7px;border:1px dashed #b995662b;border-radius:16px;pointer-events:none}
.header{text-align:center;position:relative;z-index:1;margin:1px 0 9px}.plaque{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:210px;padding:8px 16px;border:1px solid #e4cba6;border-radius:15px;background:linear-gradient(#fbf3e5,#f5ead7);box-shadow:0 4px 10px #72543713,inset 0 0 0 2px #ffffff8c;position:relative}.plaque:after{content:"";position:absolute;inset:4px;border:1px dashed #af8a613f;border-radius:11px}.plaque span{position:relative;z-index:1}.title{font-size:22px;font-weight:900;letter-spacing:-.04em}.headDate{margin-top:5px;font-size:9px;font-weight:900;letter-spacing:.08em;color:var(--muted)}
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;position:relative;z-index:1}.card{position:relative;min-width:0;border:1px solid #cba87c73;border-radius:16px;padding:12px 9px 8px;box-shadow:0 5px 11px #76553512,inset 0 0 0 2px #ffffff24}.today{background:linear-gradient(#f9eab2,#f6e2a0)}.tomorrow{background:linear-gradient(#f4ddd9,#f1d3ce)}.week{background:linear-gradient(#dfe9cd,#d9e5c3);margin-top:8px}.archive{background:linear-gradient(#e3c297,#d09d69);margin-top:8px;border-color:#9b683b55;padding:8px}
.tape{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:49px;height:13px;border-radius:2px;opacity:.93}.today .tape{background:#f3ce72}.tomorrow .tape{background:#eab0ad}.week .tape{background:#b7cb9e}
.cardHead{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:5px}.cardTitle{font-family:'Gaegu',cursive;font-size:20px;font-weight:700;line-height:1;display:flex;gap:4px;align-items:center}.chip{flex:0 0 auto;border-radius:999px;background:#fff9ed9c;padding:3px 6px;font-size:8px;font-weight:900;color:#997b66}.dash{border-top:1px dashed #7d5c433d;margin:5px 0 7px}
.list{display:flex;flex-direction:column;gap:5px;min-height:75px}.week .list{min-height:0}.task{display:grid;grid-template-columns:16px minmax(0,1fr) 12px;gap:5px;align-items:center}.check{width:16px;height:16px;padding:0;border-radius:50%;border:1.3px solid #694a36b8;background:#ffffff73;display:grid;place-items:center;font-size:10px}.check.done{background:var(--green);border-color:#789653;color:white}.task input{width:100%;min-width:0;border:0;outline:0;background:transparent;font:700 15px/1.08 'Gaegu',cursive;padding:1px 0}.task input::placeholder{color:#704e386b}.task.done input{text-decoration:line-through;opacity:.6}.x{border:0;background:transparent;padding:0;color:#72513a63;font-size:12px;line-height:1}.foot{display:flex;justify-content:flex-end;margin-top:6px}.add,.small{border:0;border-radius:999px;background:#fff9edc9;padding:4px 7px;font-size:8px;font-weight:900;color:#78553b}
.weekHead{display:flex;align-items:center;justify-content:space-between;gap:6px}.week .task input{font-size:14px}
.archiveHead{display:flex;align-items:center;justify-content:space-between;gap:5px}.archiveLabel{display:inline-flex;align-items:center;gap:4px;border:1px solid #93613b61;border-radius:11px;background:linear-gradient(#f9f0df,#efddbf);padding:5px 9px;font:700 18px/1 'Gaegu',cursive}.archiveBtns{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end}.count{border-radius:999px;background:#70451f1b;color:#fff8ef;padding:3px 5px;font-size:8px;font-weight:900}.archiveBody{margin-top:6px;border:1px solid #73451f24;border-radius:12px;background:#fff7e733;padding:6px}.archiveList{display:none;flex-direction:column;gap:5px;max-height:155px;overflow:auto}.archive.open .archiveList{display:flex}.archItem{position:relative;border:1px solid #9c75502b;border-radius:11px;background:linear-gradient(#fffaf2,#f9ebd8);padding:8px 23px 7px 9px}.archMeta{font-size:8px;font-weight:900;color:#9b775b;margin-bottom:2px}.archText{font:700 15px/1.08 'Gaegu',cursive;word-break:break-word}.archDel{position:absolute;right:7px;top:6px;width:17px;height:17px;border:1px solid #855f4140;border-radius:50%;background:#ffffff5e;padding:0;font-size:10px}.empty{text-align:center;border:1px dashed #ffffff35;border-radius:10px;background:#ffffff18;color:#fff8ed;padding:9px 5px;font:700 14px/1.1 'Gaegu',cursive}.grass{display:flex;justify-content:space-between;margin-top:4px;padding:0 3px;font-size:11px;opacity:.8}
@media(max-width:330px){.widget{padding:9px}.top{gap:5px}.card{padding:11px 6px 7px}.cardTitle{font-size:18px}.task input{font-size:13px}.chip{display:none}.plaque{min-width:180px}.title{font-size:20px}}
</style>
</head>
<body>
<div class="widget">
  <header class="header">
    <div class="plaque"><span>🌿</span><span class="title">Work Today</span><span>🌸</span></div>
    <div class="headDate" id="headDate"></div>
  </header>

  <div class="top">
    <section class="card today"><div class="tape"></div><div class="cardHead"><div class="cardTitle">🌿 Today</div><div class="chip" id="todayDate"></div></div><div class="dash"></div><div class="list" id="todayList"></div><div class="foot"><button class="add" data-add="today">+ Add</button></div></section>
    <section class="card tomorrow"><div class="tape"></div><div class="cardHead"><div class="cardTitle">Tomorrow ♡</div><div class="chip" id="tomorrowDate"></div></div><div class="dash"></div><div class="list" id="tomorrowList"></div><div class="foot"><button class="add" data-add="tomorrow">+ Add</button></div></section>
  </div>

  <section class="card week"><div class="tape"></div><div class="weekHead"><div class="cardTitle">🌱 This Week</div><div class="chip" id="weekDate"></div></div><div class="dash"></div><div class="list" id="weekList"></div><div class="foot"><button class="add" data-add="week">+ Add</button></div></section>

  <section class="card archive" id="archiveBox"><div class="archiveHead"><div class="archiveLabel">🌿 Archive</div><div class="archiveBtns"><span class="count" id="archiveCount">0 saved</span><button class="small" id="toggleArchive">Show</button><button class="small" id="clearArchive">Clear</button></div></div><div class="archiveBody"><div class="archiveList" id="archiveList"></div></div></section>
  <div class="grass"><span>🌼🌿</span><span>🌿🌷</span></div>
</div>

<script>
const KEYS=['lifetown_work_today_compact_v3','lifetown_work_today_postit_v1','lifetown_work_today_v1'];
const KEY=KEYS[0];
const id=()=>Math.random().toString(36).slice(2)+Date.now().toString(36).slice(-4);
const blank=()=>({id:id(),text:'',done:false});
const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
function load(){for(const k of KEYS){try{const v=JSON.parse(localStorage.getItem(k)||'null');if(v&&typeof v==='object')return v}catch{}}return{lastDate:dkey(new Date()),today:[blank()],tomorrow:[blank()],week:[blank()],archive:[],archiveOpen:false}}
const s=load();
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function norm(){['today','tomorrow','week'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];s[k]=s[k].map(x=>({id:x.id||id(),text:String(x.text||''),done:!!x.done}));if(!s[k].length)s[k]=[blank()]});if(!Array.isArray(s.archive))s.archive=[];if(typeof s.archiveOpen!=='boolean')s.archiveOpen=false;save()}
function archiveToday(date){(s.today||[]).filter(x=>x.text.trim()).reverse().forEach(x=>s.archive.unshift({id:id(),text:x.text.trim(),done:!!x.done,date}))}
function rollover(){const now=dkey(new Date());if(!s.lastDate){s.lastDate=now;save();return}if(s.lastDate===now)return;let gap=Math.floor((fromKey(now)-fromKey(s.lastDate))/86400000);if(!Number.isFinite(gap)||gap<1)gap=1;for(let i=0;i<gap;i++){archiveToday(s.lastDate);const mv=(s.tomorrow||[]).filter(x=>x.text.trim()||x.done).map(x=>({id:id(),text:x.text,done:!!x.done}));s.today=mv.length?mv:[blank()];s.tomorrow=[blank()];const n=fromKey(s.lastDate);n.setDate(n.getDate()+1);s.lastDate=dkey(n)}s.lastDate=now;save()}
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function section(k){const root=document.getElementById(k+'List');root.innerHTML='';s[k].forEach(t=>{const r=document.createElement('div');r.className='task'+(t.done?' done':'');r.innerHTML=`<button class="check ${t.done?'done':''}">${t.done?'✓':''}</button><input value="${esc(t.text)}" placeholder="Write a note..."><button class="x">×</button>`;r.querySelector('.check').onclick=()=>{t.done=!t.done;save();section(k)};const inp=r.querySelector('input');inp.oninput=e=>{t.text=e.target.value;save()};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add(k)}};r.querySelector('.x').onclick=()=>{s[k]=s[k].filter(x=>x.id!==t.id);if(!s[k].length)s[k]=[blank()];save();section(k)};root.appendChild(r)})}
function add(k){s[k].push(blank());save();section(k);const xs=document.querySelectorAll('#'+k+'List input');xs[xs.length-1]?.focus()}
function arch(){const box=document.getElementById('archiveBox'),root=document.getElementById('archiveList');box.classList.toggle('open',s.archiveOpen);document.getElementById('toggleArchive').textContent=s.archiveOpen?'Hide':'Show';document.getElementById('archiveCount').textContent=s.archive.length+' saved';root.innerHTML='';if(!s.archive.length){root.innerHTML='<div class="empty">Finished Today notes will be saved here ✿</div>';return}s.archive.forEach(a=>{const c=document.createElement('div');c.className='archItem';c.innerHTML=`<button class="archDel">×</button><div class="archMeta">${a.date}${a.done?' · done':''}</div><div class="archText">${esc(a.text)}</div>`;c.querySelector('.archDel').onclick=()=>{s.archive=s.archive.filter(x=>x.id!==a.id);save();arch()};root.appendChild(c)})}
function dates(){const n=new Date(),tm=new Date(n);tm.setDate(n.getDate()+1);document.getElementById('headDate').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();document.getElementById('todayDate').textContent=n.toLocaleDateString('en-US',{month:'short',day:'numeric'});document.getElementById('tomorrowDate').textContent=tm.toLocaleDateString('en-US',{month:'short',day:'numeric'});const st=new Date(n),df=(st.getDay()+6)%7;st.setDate(st.getDate()-df);const en=new Date(st);en.setDate(st.getDate()+6);const f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});document.getElementById('weekDate').textContent=f(st)+' – '+f(en)}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));document.getElementById('toggleArchive').onclick=()=>{s.archiveOpen=!s.archiveOpen;save();arch()};document.getElementById('clearArchive').onclick=()=>{s.archive=[];save();arch()};
rollover();norm();dates();section('today');section('tomorrow');section('week');arch();
</script>
</body>
</html>
