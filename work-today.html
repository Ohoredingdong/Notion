ort"><div class="archiveList" id="archiveList"></div></div><div class="drawerFront"><div class="knob"></div></div></section><div class="footerDecor"><svg viewBox="0 0 48 16" fill="none"><path d="M2 15c5-6 10-9 15-11M12 10c-2-4-1-6 1-8 4 3 4 6 2 9M25 15c3-6 7-9 12-11" stroke="#799657" stroke-width="1.3"/><circle cx="39" cy="10" r="2.2" fill="#E4A9A2"/></svg><svg viewBox="0 0 48 16" fill="none"><path d="M46 15c-5-6-10-9-15-11M36 10c2-4 1-6-1-8-4 3-4 6-2 9M23 15c-3-6-7-9-12-11" stroke="#799657" stroke-width="1.3"/><circle cx="9" cy="10" r="2.2" fill="#E4A9A2"/></svg></div></div><script>const KEYS=['lifetown_work_today_v12','lifetown_work_today_v11','lifetown_work_today_v10','lifetown_work_today_v9','lifetown_work_today_v8','lifetown_work_today_v7','lifetown_work_today_v6','lifetown_work_today_compact_v4','lifetown_work_today_compact_v3','lifetown_work_today_postit_v1','lifetown_work_today_v1'],KEY=KEYS[0],uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36).slice(-4),blank=()=>({id:uid(),text:'',done:false}),dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};function load(){for(const k of KEYS){try{const v=JSON.parse(localStorage.getItem(k)||'null');if(v&&typeof v==='object')return v}catch{}}return{lastDate:dateKey(new Date()),today:[blank()],tomorrow:[blank()],week:[blank()],archive:[],archiveOpen:true,sampleSeeded:false}}const s=load();function save(){localStorage.setItem(KEY,JSON.stringify(s))}function normalize(){['today','tomorrow','week'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[];s[k]=s[k].map(x=>({id:x.id||uid(),text:String(x.text||''),done:!!x.done}));if(!s[k].length)s[k]=[blank()]});if(!Array.isArray(s.archive))s.archive=[];if(typeof s.archiveOpen!=='boolean')s.archiveOpen=true;if(typeof s.sampleSeeded!=='boolean')s.sampleSeeded=false;save()}function seedSample(){if(s.sampleSeeded)return;if(!s.archive.length){const d=new Date();d.setDate(d.getDate()-2);s.archive.push({id:uid(),text:'Client follow-up',done:true,date:dateKey(d),sample:true});s.archiveOpen=true}s.sampleSeeded=true;save()}function archiveToday(k){(s.today||[]).filter(x=>x.text.trim()).reverse().forEach(x=>s.archive.unshift({id:uid(),text:x.text.trim(),done:!!x.done,date:k}))}function rollover(){const now=dateKey(new Date());if(!s.lastDate){s.lastDate=now;save();return}if(s.lastDate===now)return;let gap=Math.floor((fromKey(now)-fromKey(s.lastDate))/86400000);if(!Number.isFinite(gap)||gap<1)gap=1;for(let i=0;i<gap;i++){archiveToday(s.lastDate);const moved=(s.tomorrow||[]).filter(x=>x.text.trim()||x.done).map(x=>({id:uid(),text:x.text,done:!!x.done}));s.today=moved.length?moved:[blank()];s.tomorrow=[blank()];const n=fromKey(s.lastDate);n.setDate(n.getDate()+1);s.lastDate=dateKey(n)}s.lastDate=now;save()}const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');function renderSection(k){const root=document.getElementById(k+'List');root.innerHTML='';s[k].forEach(t=>{const r=document.createElement('div');r.className='task'+(t.done?' done':'');r.innerHTML=`<button class="check ${t.done?'done':''}">${t.done?'✓':''}</button><input value="${esc(t.text)}" placeholder="Write a note..."><button class="x">×</button>`;r.querySelector('.check').onclick=()=>{t.done=!t.done;save();renderSection(k)};const inp=r.querySelector('input');inp.oninput=e=>{t.text=e.target.value;save()};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add(k)}};r.querySelector('.x').onclick=()=>{s[k]=s[k].filter(x=>x.id!==t.id);if(!s[k].length)s[k]=[blank()];save();renderSection(k)};root.appendChild(r)})}function add(k){s[k].push(blank());save();renderSection(k);const xs=document.querySelectorAll('#'+k+'List input');xs[xs.length-1]?.focus()}function renderArchive(){const box=document.getElementById('archiveBox'),root=document.getElementById('archiveList');box.classList.toggle('open',s.archiveOpen);document.getElementById('toggleArchive').textContent=s.archiveOpen?'Hide':'Show';document.getElementById('archiveCount').textContent=s.archive.length+' saved';root.innerHTML='';if(!s.archive.length){root.innerHTML='<div class="empty">Finished Today notes will be saved here.</div>';return}s.archive.forEach(a=>{const c=document.createElement('div');c.className='archItem';c.innerHTML=`<div class="clip"></div><button class="archDel">×</button><div class="archMeta">${a.date}${a.done?' · done':''}</div><div class="archText">${esc(a.text)}</div>`;c.querySelector('.archDel').onclick=()=>{s.archive=s.archive.filter(x=>x.id!==a.id);save();renderArchive()};root.appendChild(c)})}function renderDates(){const n=new Date(),tm=new Date(n);tm.setDate(n.getDate()+1);document.getElementById('headDate').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();document.getElementById('todayDate').textContent=n.toLocaleDateString('en-US',{month:'short',day:'numeric'});document.getElementById('tomorrowDate').textContent=tm.toLocaleDateString('en-US',{month:'short',day:'numeric'});const st=new Date(n),diff=(st.getDay()+6)%7;st.setDate(st.getDate()-diff);const en=new Date(st);en.setDate(st.getDate()+6),f=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});document.getElementById('weekDate').textContent=f(st)+' – '+f(en)}document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));document.getElementById('toggleArchive').onclick=()=>{s.archiveOpen=!s.archiveOpen;save();renderArchive()};document.getElementById('clearArchive').onclick=()=>{s.archive=[];save();renderArchive()};rollover();normalize();seedSample();renderDates();renderSection('today');renderSection('tomorrow');renderSection('week');renderArchive();</script></body></html>
