<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Bond Yields v2</title><link rel="stylesheet" href="./assets/life-town-v2.css">
<style>
:root{--panel:#fff;--soft:#f7f7f8;--line:#e5e5e8;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--blue:#007aff;--red:#d92d27;--green:#248a3d;--yellow:#9a7200;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}
html[data-theme="dark"],html[data-lt-theme="dark"]{--panel:#1c1c1e;--soft:#2c2c2e;--line:#38383a;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--blue:#0a84ff;--red:#ff453a;--green:#30d158;--yellow:#ffd60a;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px!important;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}.shell{width:100%;max-width:500px;margin:0 auto;container-type:inline-size}.widget{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:13px;box-shadow:var(--shadow)}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.title{font-size:17.5px;font-weight:760;letter-spacing:-.04em}.subtitle{margin-top:4px;font-size:10px;color:var(--muted)}.refresh{width:28px;height:28px;border:1px solid var(--line);border-radius:9px;background:var(--panel);display:grid;place-items:center;cursor:pointer}.refresh svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.segment{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:11px;padding:3px;background:var(--soft);border-radius:11px}.segment button{height:29px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:10px;cursor:pointer}.segment button.active{background:var(--panel);color:var(--text);font-weight:720;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.hero{display:grid;grid-template-columns:145px minmax(0,1fr);gap:10px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}.kicker{font-size:9px;color:var(--sub);font-weight:700}.country{margin-top:3px;font-size:8.6px;color:var(--muted)}.main-rate{margin-top:7px;font-size:27px;font-weight:790;letter-spacing:-.045em}.main-change{margin-top:5px;font-size:9.3px;font-weight:720}.up{color:var(--red)}.down{color:var(--blue)}.chartbox{height:84px;border-bottom:1px solid var(--line);padding:3px 0 4px}.chart{width:100%;height:100%;display:block}.line{fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dot{fill:var(--blue);stroke:var(--panel);stroke-width:2}
.table{margin-top:7px}.thead,.row{display:grid;grid-template-columns:1fr .8fr .72fr;gap:8px;align-items:center}.thead{padding:4px 1px 5px;font-size:8.6px;color:var(--muted)}.row{padding:8px 1px;border-top:1px solid var(--line)}.term{font-size:10.5px;font-weight:720}.num{text-align:right;font-size:10.3px;font-weight:720}.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px;padding-top:8px;border-top:1px solid var(--line)}.spread-title{font-size:9.4px;font-weight:700}.spread-state{margin-top:2px;font-size:8.5px;color:var(--muted)}.spread-value{font-size:11.2px;font-weight:760}.footer{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:8.5px;color:var(--muted)}.loading{padding:34px;text-align:center;font-size:10px;color:var(--muted)}
@container(max-width:460px){.hero{grid-template-columns:132px minmax(0,1fr)}.main-rate{font-size:25px}.footer{font-size:8.2px}}
</style></head><body><div class="shell"><main class="widget" data-widget-control-root data-control-sizes="440,470,500"><header class="header"><div><div class="title">Bond Yields</div><div class="subtitle">한국 · 미국 국채 수익률과 장단기 금리차</div></div><button class="refresh" id="refreshBtn" aria-label="새로고침"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M17.5 9A6.5 6.5 0 0 0 6.6 7L4 12M6.5 15A6.5 6.5 0 0 0 17.4 17L20 12"/></svg></button></header><div class="segment"><button class="active" data-country="KR">한국</button><button data-country="US">미국</button></div><div id="content" class="loading">국채 금리 데이터를 불러오는 중...</div></main></div>
<script>
let state={country:'KR',data:null};const $=s=>document.querySelector(s),fmt=v=>Number(v||0).toFixed(2)+'%',bp=v=>`${Number(v)>=0?'▲':'▼'} ${Math.abs(Number(v||0)).toFixed(1)}bp`,cls=v=>Number(v)>=0?'up':'down';function term(t){return t==='3M'?'3개월물':t.replace('Y','년물')}function spreadState(v){return v<0?'역전 구간':v<25?'평탄 구간':'정상 기울기'}
function spark(h){const vals=(h||[]).map(x=>Number(x[1])).filter(Number.isFinite);if(vals.length<2)return'';const W=330,H=80,p=5,mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1,pts=vals.map((v,i)=>({x:p+i*(W-p*2)/(vals.length-1),y:p+(mx-v)*(H-p*2)/rg})),d=pts.map((q,i)=>`${i?'L':'M'}${q.x.toFixed(1)} ${q.y.toFixed(1)}`).join(' ');return `<path class="line" d="${d}"/><circle class="dot" cx="${pts.at(-1).x}" cy="${pts.at(-1).y}" r="3"/>`}
function render(){const d=state.data,c=d?.countries?.[state.country];if(!c){$('#content').innerHTML='<div class="loading">데이터 없음</div>';return}const main=c.yields?.[c.main]||{},rows=Object.entries(c.yields||{}).map(([t,v])=>`<div class="row"><div class="term">${term(t)}</div><div class="num">${fmt(v.yield)}</div><div class="num ${cls(v.change_bp)}">${bp(v.change_bp)}</div></div>`).join(''),sp=Number(c.spread?.value_bp)||0;$('#content').className='';$('#content').innerHTML=`<section class="hero"><div><div class="kicker">10년물 국채 수익률</div><div class="country">${c.label} · ${c.main}</div><div class="main-rate">${fmt(main.yield)}</div><div class="main-change ${cls(main.change_bp)}">${bp(main.change_bp)} · 전일 대비</div></div><div class="chartbox"><svg class="chart" viewBox="0 0 330 80" preserveAspectRatio="none">${spark(c.history)}</svg></div></section><div class="table"><div class="thead"><span>만기</span><span style="text-align:right">수익률</span><span style="text-align:right">변동</span></div>${rows}</div><div class="spread"><div><div class="spread-title">${c.spread?.label||'장단기 금리차'}</div><div class="spread-state">${spreadState(sp)}</div></div><div class="spread-value ${sp<0?'down':'up'}">${sp>=0?'+':''}${sp.toFixed(1)}bp</div></div><div class="footer"><span>${d.generated_at?new Date(d.generated_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'—'}</span><span>시장 데이터 · ${d.stale?'지연':'업데이트'}</span></div>`;document.querySelectorAll('.segment button').forEach(b=>b.classList.toggle('active',b.dataset.country===state.country))}
document.querySelectorAll('.segment button').forEach(b=>b.onclick=()=>{state.country=b.dataset.country;render()});async function load(){try{const r=await fetch('./bond-yields-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;state.data=await r.json();render()}catch{$('#content').innerHTML='<div class="loading">데이터를 불러오지 못했습니다.</div>'}}$('#refreshBtn').onclick=load;load();
</script><script src="./assets/life-town-controls-v2.js"></script></body></html>
