<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="light only" />
<title>Habit Tracker</title>
<style>
:root{--ink:#2e2e2e;--muted:#b9b9b9;--soft:#ededed;--card:#fff;--line:#f2f2f2}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:transparent}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.card{width:100%;background:var(--card);border-radius:22px;padding:14px 15px 13px;box-shadow:0 0 0 1px rgba(0,0,0,.02)}
.top{display:grid;grid-template-columns:minmax(0,1fr) 84px 55px;align-items:start;column-gap:8px}.title{font-size:13px;font-weight:800;letter-spacing:-.045em;margin-bottom:7px}.label{font-size:8px;color:#b8b8b8;font-weight:600;line-height:1.1}.count{margin-top:2px;display:flex;align-items:flex-end;gap:3px;line-height:1}.count .done{font-size:20px;font-weight:800;letter-spacing:-.06em}.count .slash{font-size:13px;color:#d1d1d1;font-weight:700;margin-bottom:2px}.count .total{font-size:13px;color:#c4c4c4;font-weight:700;margin-bottom:1px}
.spark{display:flex;justify-content:center;align-items:center;padding-top:14px}.spark svg{width:78px;height:34px;overflow:visible}.percent{text-align:right;padding-top:1px}.percent .label{text-align:right}.percent-row{display:flex;align-items:flex-end;justify-content:flex-end;gap:1px;line-height:1;margin-top:1px}.percent-row strong{font-size:20px;font-weight:800;letter-spacing:-.06em}.percent-row span{font-size:10px;font-weight:700;margin-bottom:1px;color:#747474}
.divider{height:1px;background:var(--line);margin:10px 0 9px}
.days,.habit-row{display:grid;grid-template-columns:52px repeat(7,1fr);column-gap:3px;align-items:center}.days{margin-bottom:7px}.day{font-size:8px;color:#bcbcbc;text-align:center;font-weight:500}.habit-row{min-height:21px;margin-bottom:1px}
.name-cell{min-width:0;padding-right:3px}.name-editor{display:block;width:100%;height:20px;border:0;outline:0;background:transparent;border-radius:6px;padding:0 3px;font:inherit;font-size:9px;font-weight:750;letter-spacing:-.035em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name-editor:hover{background:#f8f8f8}.name-editor:focus{background:#f2f2f2}
.dot{width:10px;height:10px;border:0;border-radius:50%;padding:0;margin:auto;background:var(--soft);cursor:pointer;transition:transform .12s ease,background .12s ease}.dot:hover{transform:scale(1.13)}.dot.active{background:#343434}
.add-area{margin-top:10px;padding-top:9px;border-top:1px solid #f3f3f3;display:flex;gap:6px;align-items:center}.add-input{flex:1;min-width:0;height:28px;border:0;outline:0;border-radius:8px;background:#f6f6f6;padding:0 9px;font-size:9px;color:var(--ink)}.add-input::placeholder{color:#b8b8b8}.add-btn{height:28px;min-width:42px;border:0;border-radius:8px;background:#333;color:#fff;font-size:9px;font-weight:800;padding:0 10px;cursor:pointer}.add-btn:hover{opacity:.9}.tip{margin-top:6px;font-size:8px;color:#c2c2c2;letter-spacing:-.02em}
@media(max-width:320px){.top{grid-template-columns:minmax(0,1fr) 72px 50px}.spark svg{width:68px}.days,.habit-row{grid-template-columns:46px repeat(7,1fr)}.card{padding:13px 12px 12px}}
</style>
</head>
<body>
<section class="card" aria-label="Habit Tracker">
  <div class="top">
    <div><div class="title">루틴 트래커</div><div class="label">이번 주</div><div class="count"><span class="done" id="doneCount">0</span><span class="slash">/</span><span class="total" id="totalCount">0</span></div></div>
    <div class="spark" aria-hidden="true"><svg viewBox="0 0 78 34"><polyline id="sparkLine" fill="none" stroke="#9d9d9d" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><circle id="sparkDot" r="2.15" fill="#313131"/></svg></div>
    <div class="percent"><div class="label">달성률</div><div class="percent-row"><strong id="percent">0</strong><span>%</span></div></div>
  </div>

  <div class="divider"></div>
  <div class="days"><div></div><div class="day">월</div><div class="day">화</div><div class="day">수</div><div class="day">목</div><div class="day">금</div><div class="day">토</div><div class="day">일</div></div>
  <div id="habitRows"></div>

  <div class="add-area">
    <input class="add-input" id="newHabit" maxlength="12" placeholder="새 항목 추가" aria-label="새 습관 이름" />
    <button class="add-btn" id="addBtn" type="button">추가</button>
  </div>
  <div class="tip">습관 이름은 눌러서 바로 수정할 수 있어요.</div>
</section>
<script>
const DAYS=['월','화','수','목','금','토','일'];
const KEY='lifeTownHabitTracker.v2';
const OLD_KEY='lifeTownHabitTracker.v1';
const DEFAULT=[{name:'운동',checks:[0,1,1,1,1,1,1]},{name:'독서',checks:[1,0,1,1,1,1,0]},{name:'명상',checks:[1,1,0,0,0,0,0]}];
const copy=v=>JSON.parse(JSON.stringify(v));
function normalize(v){if(!Array.isArray(v)||!v.length)return null;const out=v.filter(x=>x&&typeof x.name==='string'&&Array.isArray(x.checks)).map(x=>({name:(x.name.trim().slice(0,12)||'새 습관'),checks:DAYS.map((_,d)=>x.checks[d]?1:0)}));return out.length?out:null}
function load(){for(const k of [KEY,OLD_KEY]){try{const v=normalize(JSON.parse(localStorage.getItem(k)||'null'));if(v)return v}catch(e){}}return copy(DEFAULT)}
let state=load();
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function updateSummary(){const done=state.reduce((s,r)=>s+r.checks.reduce((a,b)=>a+b,0),0),total=state.length*7,pct=total?Math.round(done/total*100):0;document.getElementById('doneCount').textContent=done;document.getElementById('totalCount').textContent=total;document.getElementById('percent').textContent=pct;updateSpark()}
function updateSpark(){const counts=DAYS.map((_,d)=>state.reduce((s,r)=>s+r.checks[d],0));const max=Math.max(1,state.length),xs=[3,15,28,40,51,63,73],pts=counts.map((c,i)=>`${xs[i]},${(27-(c/max)*15).toFixed(1)}`);document.getElementById('sparkLine').setAttribute('points',pts.join(' '));const [x,y]=pts[6].split(',');document.getElementById('sparkDot').setAttribute('cx',x);document.getElementById('sparkDot').setAttribute('cy',y)}
function render(){const rows=document.getElementById('habitRows');rows.innerHTML='';state.forEach((item,r)=>{const row=document.createElement('div');row.className='habit-row';const cell=document.createElement('div');cell.className='name-cell';const input=document.createElement('input');input.className='name-editor';input.value=item.name;input.maxLength=12;input.setAttribute('aria-label',`${item.name} 이름 수정`);input.addEventListener('change',()=>{const v=input.value.trim().slice(0,12);state[r].name=v||item.name;save();input.value=state[r].name});input.addEventListener('keydown',e=>{if(e.key==='Enter')input.blur();if(e.key==='Escape'){input.value=state[r].name;input.blur()}});cell.appendChild(input);row.appendChild(cell);DAYS.forEach((day,d)=>{const dot=document.createElement('button');dot.className='dot'+(item.checks[d]?' active':'');dot.type='button';dot.setAttribute('aria-label',`${item.name} ${day} 체크`);dot.onclick=()=>{state[r].checks[d]=state[r].checks[d]?0:1;save();render()};row.appendChild(dot)});rows.appendChild(row)});updateSummary()}
function addHabit(){const input=document.getElementById('newHabit'),name=input.value.trim().slice(0,12);if(!name)return;state.push({name,checks:[0,0,0,0,0,0,0]});input.value='';save();render();input.focus()}
document.getElementById('addBtn').onclick=addHabit;document.getElementById('newHabit').addEventListener('keydown',e=>{if(e.key==='Enter')addHabit()});
render();
</script>
</body>
</html>
