<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>공포·탐욕 지수 · Life Town v2</title>
<link rel="stylesheet" href="./assets/life-town-v2.css">
<style>
:root{--panel:#fff;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--line:#e5e5e8;--soft:#f7f7f8;--blue:#007aff;--green:#34c759;--yellow:#ffcc00;--red:#ff3b30;--state:#ffcc00;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}
html[data-lt-theme="dark"]{--panel:#1c1c1e;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--line:#38383a;--soft:#2c2c2e;--blue:#0a84ff;--green:#30d158;--yellow:#ffd60a;--red:#ff453a;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}.root{width:100%;max-width:420px;margin:auto;container-type:inline-size}.widget{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px 14px 11px;box-shadow:var(--shadow);overflow:hidden}.widget:before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:linear-gradient(90deg,transparent,#b8b8bd 22%,#f5f5f7 50%,#b8b8bd 78%,transparent);opacity:.52}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.title{font-size:18px;font-weight:760;letter-spacing:-.04em;line-height:1.08}.sub{margin-top:4px;font-size:10px;color:var(--muted)}.updated{font-size:8.8px;color:var(--muted);white-space:nowrap;margin-top:2px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:11px 0 10px;padding:3px;border-radius:11px;background:var(--soft)}.tab{height:29px;border:0;border-radius:8px;background:transparent;color:var(--sub);font-size:10px;font-weight:680;cursor:pointer}.tab.active{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.05)}.tab[data-market="korea"].active{color:var(--blue)}.tab[data-market="us"].active{color:var(--red)}.tab[data-market="crypto"].active{color:#8d7000}.section-label{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.section-title{font-size:10.5px;font-weight:700}.error-badge{display:none;font-size:8.8px;color:var(--red)}.error .error-badge{display:inline}.score-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:8px}.score-wrap{display:flex;align-items:flex-end;gap:5px}.score{font-size:40px;line-height:1;font-weight:770;letter-spacing:-.055em;color:var(--state)}.unit{font-size:13px;color:var(--sub);font-weight:650;margin-bottom:3px}.delta{text-align:right}.delta-title{font-size:9.2px;color:var(--sub);font-weight:650}.delta-sub{margin-top:2px;font-size:8.8px;color:var(--muted)}.gauge{margin-top:10px}.track{position:relative;height:7px;border-radius:999px;background:linear-gradient(90deg,var(--red) 0%,#ff8a3d 24%,var(--yellow) 49%,#75cf5a 74%,var(--green) 100%)}.thumb{position:absolute;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);border-radius:50%;background:var(--panel);border:3px solid var(--state);box-shadow:0 1px 2px rgba(0,0,0,.08)}.scale,.zones{display:grid;grid-template-columns:repeat(5,1fr)}.scale{margin-top:6px;font-size:8.4px;color:var(--muted)}.zones{margin-top:4px;font-size:8.8px;color:var(--sub)}.scale span:nth-child(1),.zones span:nth-child(1){text-align:left}.scale span:nth-child(n+2):nth-child(-n+4),.zones span:nth-child(n+2):nth-child(-n+4){text-align:center}.scale span:last-child,.zones span:last-child{text-align:right}.chart-wrap{margin-top:12px}.chart-title{font-size:10.5px;font-weight:700}.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;align-items:end;min-height:104px;margin-top:8px}.bar-col{display:flex;flex-direction:column;align-items:center;gap:5px}.bar-value{font-size:9px;font-weight:680}.bar-shell{width:100%;max-width:22px;height:66px;border-radius:7px;background:var(--soft);display:flex;align-items:flex-end}.bar{width:100%;border-radius:7px;background:color-mix(in srgb,var(--state) 28%,var(--soft))}.bar.current{background:var(--state)}.bar-date{font-size:8.8px;color:var(--muted)}.footer{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}.source{font-size:8.8px;color:var(--muted);line-height:1.35;min-width:0}.state{font-size:8.8px;color:var(--muted);white-space:nowrap}.state button{height:22px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:8.8px;cursor:pointer}
@container(max-width:360px){.zones{font-size:8.3px}.score{font-size:36px}.widget{padding:13px 12px 10px}.title{font-size:17px}}
</style>
</head>
<body><div class="root"><main class="widget" id="widget" data-widget-control-root data-control-sizes="360,390,420">
<header class="top"><div><div class="title">공포·탐욕 지수</div><div class="sub">한국 · 미국 · Crypto</div></div><div class="updated" id="updated">오늘 기준</div></header>
<div class="tabs" role="tablist"><button class="tab active" data-market="korea">한국</button><button class="tab" data-market="us">미국</button><button class="tab" data-market="crypto">Crypto</button></div>
<div class="section-label"><div class="section-title" id="sectionTitle">한국 시장 지수</div><div class="error-badge" id="errorBadge">업데이트 지연</div></div>
<div class="score-row"><div class="score-wrap"><div class="score" id="score">—</div><div class="unit">/ 100</div></div><div class="delta"><div class="delta-title" id="deltaTitle">어제: —</div><div class="delta-sub" id="deltaSub">변화 없음</div></div></div>
<div class="gauge"><div class="track"><div class="thumb" id="thumb"></div></div><div class="scale"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div><div class="zones"><span>극공포</span><span>공포</span><span>중립</span><span>탐욕</span><span>극탐욕</span></div></div>
<div class="chart-wrap"><div class="chart-title">최근 7일 흐름</div><div class="chart" id="chart"></div></div>
<div class="footer"><div class="source" id="source">출처 확인 중</div><div class="state"><span id="widgetState"></span><button id="retryBtn" hidden>재시도</button></div></div>
</main></div>
<script>
const fallback={korea:{market:'korea',updated_at:'2026-08-20T09:30:00+09:00',headline:{score:52,rating:'neutral',previous_close:49},history:[46,48,47,50,49,51,52].map((v,i)=>({timestamp:new Date(Date.now()-(6-i)*86400000).toISOString(),value:v}))},us:{market:'us',updated_at:'2026-08-21T00:00:00+00:00',headline:{score:52.46,rating:'neutral',previous_close:57.03},history:[48,51,54,55,57,58,52.46].map((v,i)=>({timestamp:new Date(Date.now()-(6-i)*86400000).toISOString(),value:v}))},crypto:{market:'crypto',updated_at:'2026-08-21T00:00:00+00:00',headline:{score:72,rating:'greed',previous_close:68},history:[59,60,62,63,67,69,72].map((v,i)=>({timestamp:new Date(Date.now()-(6-i)*86400000).toISOString(),value:v}))}};
const meta={korea:{section:'한국 시장 지수',source:'Custom Korea Model · KOSPI · KOSDAQ · USD/KRW'},us:{section:'미국 시장 지수',source:'CNN Fear & Greed Index'},crypto:{section:'암호화폐 시장 지수',source:'Alternative.me · Crypto Fear & Greed'}};const ko={'extreme fear':'극심한 공포',fear:'공포',neutral:'중립',greed:'탐욕','extreme greed':'극심한 탐욕'};const app={market:'korea',data:{...fallback},loaded:{},status:'loading'};const $=s=>document.querySelector(s);function classify(x){x=Number(x);if(x<25)return'extreme fear';if(x<45)return'fear';if(x<55)return'neutral';if(x<75)return'greed';return'extreme greed'}function color(r){r=(r||'neutral').toLowerCase();if(r==='extreme fear'||r==='fear')return'var(--red)';if(r==='neutral')return'var(--yellow)';return'var(--green)'}function fmt(n){return Number.isFinite(Number(n))?Math.round(Number(n)):'—'}function chip(s){const d=new Date(s);return isNaN(d)?'오늘 기준':`${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}function short(s){const d=new Date(s);return isNaN(d)?'':`${d.getMonth()+1}.${d.getDate()}`}function norm(m,d){d.market=m;d.headline=d.headline||{};d.history=Array.isArray(d.history)?d.history.map(x=>({...x,value:Number(x.value)})).filter(x=>Number.isFinite(x.value)).slice(-7):[];return d}async function loadOne(m,p){try{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(r.status);app.data[m]=norm(m,await r.json());app.loaded[m]=true;return true}catch{app.data[m]=fallback[m];app.loaded[m]=false;return false}}async function refresh(){app.status='loading';render();const r=await Promise.all([loadOne('korea','./korea-market-sentiment.json'),loadOne('us','./fear-greed-data.json'),loadOne('crypto','./crypto-fear-greed-data.json')]);app.status=r.every(Boolean)?'ready':'error';render()}function renderTabs(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.market===app.market))}function render(){renderTabs();const d=app.data[app.market]||fallback[app.market],h=d.headline||{},score=Number(h.score)||0,r=(h.rating||classify(score)).toString().toLowerCase();document.documentElement.style.setProperty('--state',color(r));$('#sectionTitle').textContent=meta[app.market].section;$('#score').textContent=fmt(score);$('#score').style.color=color(r);$('#thumb').style.left=`${Math.max(0,Math.min(100,score))}%`;$('#updated').textContent=chip(d.updated_at||d.source_timestamp);const prev=Number(h.previous_close),delta=Number.isFinite(prev)?score-prev:null;$('#deltaTitle').textContent=`어제: ${Number.isFinite(prev)?fmt(prev):'—'} (${Number.isFinite(prev)?ko[classify(prev)]:'—'})`;$('#deltaSub').textContent=delta==null?'변화 없음':delta>0?`${Math.abs(Math.round(delta))} 상승`:delta<0?`${Math.abs(Math.round(delta))} 하락`:'변화 없음';const rows=(d.history||[]).slice(-7);$('#chart').innerHTML=rows.map((x,i)=>`<div class="bar-col"><div class="bar-value">${fmt(x.value)}</div><div class="bar-shell"><div class="bar ${i===rows.length-1?'current':''}" style="height:${Math.max(14,(x.value/100)*66)}px"></div></div><div class="bar-date">${short(x.timestamp)}</div></div>`).join('');$('#source').textContent=meta[app.market].source;const ok=!!app.loaded[app.market];document.querySelector('.root').classList.toggle('error',!ok);$('#widgetState').textContent=app.status==='loading'?'불러오는 중':ok?'':'업데이트 지연';$('#retryBtn').hidden=ok||app.status==='loading'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{app.market=b.dataset.market;render()});$('#retryBtn').onclick=refresh;render();refresh();
</script><script src="./assets/life-town-controls-v2.js"></script>
</body></html>
