<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Real Estate Pulse</title><link rel="stylesheet" href="./assets/life-town-v2.css">
<style>
:root{--panel:#fff;--soft:#f7f7f8;--line:#e5e5e8;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--blue:#007aff;--red:#d92d27;--green:#248a3d;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}
html[data-theme="dark"],html[data-lt-theme="dark"]{--panel:#1c1c1e;--soft:#2c2c2e;--line:#38383a;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--blue:#0a84ff;--red:#ff453a;--green:#30d158;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px!important;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}
.shell{width:100%;max-width:440px;margin:0 auto;container-type:inline-size}.widget{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:13px 13px 10px;box-shadow:var(--shadow)}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.kicker{font-size:8.7px;color:var(--muted);font-weight:650}.title{margin-top:3px;font-size:17.5px;font-weight:760;letter-spacing:-.04em}.subtitle{margin-top:4px;font-size:10px;color:var(--muted)}.rate{text-align:right}.rate-label{font-size:8.7px;color:var(--muted)}.rate-value{margin-top:3px;font-size:20px;font-weight:760;line-height:1}.rate-date{margin-top:4px;font-size:8.3px;color:var(--muted)}
.segment{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:12px;padding:3px;background:var(--soft);border-radius:11px}.segment button{height:29px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:10px;cursor:pointer}.segment button.active{background:var(--panel);color:var(--text);font-weight:720;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.summary{display:grid;grid-template-columns:1fr repeat(3,auto);gap:7px;align-items:center;margin-top:10px;padding:7px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:8.8px;color:var(--muted)}.summary strong{color:var(--text);font-weight:700;white-space:nowrap}.s-up{color:var(--red)!important}.s-down{color:var(--blue)!important}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;padding:3px 2px 1px}.item{height:30px;display:flex;align-items:center;justify-content:space-between;gap:7px;border-bottom:1px solid var(--line)}.item:nth-last-child(-n+2){border-bottom:0}.name{font-size:10.3px;font-weight:650}.value{font-size:10.5px;font-weight:720;font-variant-numeric:tabular-nums}.up{color:var(--red)}.down{color:var(--blue)}.flat{color:var(--muted)}.arrow{font-size:7.2px;margin-right:2px}
.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;padding-top:8px;border-top:1px solid var(--line);font-size:8.5px;color:var(--muted)}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--green);margin-right:4px}
@container(max-width:420px){.grid{column-gap:10px}.name{font-size:10px}.value{font-size:10.2px}.summary{gap:5px;font-size:8.5px}}
</style><style id="finish-v3">body{padding:6px!important}.shell{max-width:430px!important}.widget{border-radius:20px!important;padding:14px 14px 10px!important;box-shadow:none!important}.kicker{font-size:8.9px!important}.title{font-size:18.5px!important}.subtitle{font-size:10.2px!important}.rate-label{font-size:8.9px!important}.rate-value{font-size:21px!important}.rate-date{font-size:8.5px!important}.segment{margin-top:10px!important;border:1px solid var(--line)!important;box-shadow:none!important}.segment button{height:28px!important;font-size:10px!important}.segment button.active{box-shadow:none!important}.summary{margin-top:9px!important;padding:7px 8px!important;font-size:8.9px!important}.grid{column-gap:10px!important}.item{height:29px!important}.name{font-size:10.4px!important}.value{font-size:10.6px!important}.footer{font-size:8.6px!important;margin-top:5px!important}</style></head>
<body><div class="shell"><main class="widget" id="widget" data-widget-control-root data-control-sizes="380,410,440">
<header class="header"><div><div class="kicker">전국 주간 아파트</div><div class="title">Real Estate Pulse</div><div class="subtitle">시·도별 주간 가격 변동률</div></div><div class="rate"><div class="rate-label">한국 기준금리</div><div class="rate-value" id="baseRate">—</div><div class="rate-date" id="rateDate">BOK</div></div></header>
<div class="segment"><button class="active" data-mode="sale">매매</button><button data-mode="lease">전세</button></div>
<div class="summary"><span id="metric">매매 주간</span><strong class="s-up" id="upCount">↑ —</strong><strong class="s-down" id="downCount">↓ —</strong><strong id="flatCount">— —</strong></div>
<section class="grid" id="grid"></section>
<footer class="footer"><span><i class="dot"></i>한국부동산원 · 한국은행</span><span id="asOf">기준일 —</span></footer>
<div id="refreshStatus" role="status" aria-live="polite" style="padding:8px 13px;border-top:1px solid var(--line);font-size:9px;line-height:1.5;color:var(--muted)">공식 자료를 확인하고 있습니다.</div></main></div>
<script>
let mode='sale',data=null;const $=s=>document.querySelector(s);const fmt=v=>`${Number(v)>0?'+':''}${Number(v).toFixed(2)}%`;const cls=v=>Number(v)>0?'up':Number(v)<0?'down':'flat';const arrow=v=>Number(v)>0?'▲':Number(v)<0?'▼':'•';const date=s=>s?String(s).replaceAll('-','.'):'—';
function render(){if(!data)return;const vals=data.regions.map(r=>Number(r[mode]));$('#grid').replaceChildren(...data.regions.map(r=>{const v=Number(r[mode]),row=document.createElement('div'),name=document.createElement('span'),value=document.createElement('span');row.className='item';name.className='name';name.textContent=r.name;value.className='value '+cls(v);value.textContent=arrow(v)+' '+fmt(v);row.append(name,value);return row}));$('#metric').textContent=mode==='sale'?'매매 주간':'전세 주간';$('#upCount').textContent=`↑ ${vals.filter(v=>v>0).length}`;$('#downCount').textContent=`↓ ${vals.filter(v=>v<0).length}`;$('#flatCount').textContent=`— ${vals.filter(v=>v===0).length}`}
document.querySelectorAll('.segment button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.segment button').forEach(x=>x.classList.toggle('active',x===b));render()});
async function json(path){const response=await fetch(path+'?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(20000)});if(!response.ok)throw new Error('HTTP '+response.status);return response.json()}
async function load(){
 try{
  const [result,healthResult]=await Promise.allSettled([json('./real-estate-pulse-data.json'),json('./real-estate-pulse-health.json')]);
  if(result.status!=='fulfilled')throw result.reason;
  const next=result.value;
  if(!Array.isArray(next.regions)||next.regions.length!==16||next.regions.some(r=>!Number.isFinite(r.sale)||!Number.isFinite(r.lease))||!Number.isFinite(next.baseRate?.value))throw new Error('필수 통계 누락');
  data=next;$('#baseRate').textContent=fmt(data.baseRate.value).replace('+','');$('#rateDate').textContent=date(data.baseRate.changedAt)+' 변경';$('#asOf').textContent=date(data.asOf)+' 기준';render();
  const health=healthResult.status==='fulfilled'?healthResult.value:null;
  const checked=new Date(health?.checked_at),age=Date.now()-checked.getTime(),publicationAge=Date.now()-new Date(data.published+'T00:00:00+09:00').getTime();
  const stale=!health||health.status!=='ok'||!Number.isFinite(age)||age>72*3600000||publicationAge>12*86400000;
  const status=$('#refreshStatus');status.replaceChildren();status.style.color=stale?'#b06512':'var(--muted)';
  const source=document.createElement('a');source.textContent='공식 발표 '+date(data.published);source.href=data.releaseUrl;source.target='_blank';source.rel='noopener noreferrer';source.style.color='inherit';
  status.append(source,document.createTextNode(' · '+(stale?'갱신 확인 지연 · 마지막 검증 자료 표시':'16개 지역 검증 · 매일 발표 확인')));
  if(Number.isFinite(checked.getTime()))status.append(document.createElement('br'),document.createTextNode('확인 '+checked.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})+' KST'));
 }catch(error){$('#refreshStatus').textContent=data?'새로 불러오지 못했습니다. 마지막 표시 자료를 유지합니다.':'공식 자료를 불러오지 못했습니다. 잠시 후 다시 시도합니다.';$('#refreshStatus').style.color='#b06512';}
}
load();setInterval(load,300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script><script src="./assets/life-town-controls-v2.js"></script></body></html>
