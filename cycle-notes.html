<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Cycle Notes</title><style>:root{--card-w:430px;--bg:#fff;--text:#2b2926;--sub:#6c6761;--line:#e9e5df;--pink:#f58ea6;--pinksoft:#fff4f7;--green:#93b176;--greensoft:#f2f7ee;--memo:#f7f8f2;--shadow:0 6px 18px rgba(24,23,21,.05)}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:4px;font-family:Inter,Arial,"Noto Sans KR",sans-serif;color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}.stage{width:var(--card-w);margin:0 auto;transition:width .18s}.shell{position:relative;width:100%}.card{width:100%;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 17px 14px;box-shadow:var(--shadow);overflow:hidden}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.title{font-size:21px;font-weight:800;letter-spacing:-.04em;line-height:1}.sub{font-size:12px;color:#65615c;margin-top:6px;font-weight:500}.nav{display:grid;grid-template-columns:38px 1fr 38px;height:39px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}.nav button{width:38px;height:38px;border:0;background:#fff;color:#57524d;font-size:22px;cursor:pointer}.nav button:first-child{border-right:1px solid #f0ece7}.nav button:last-child{border-left:1px solid #f0ece7}.month{min-width:92px;display:grid;place-items:center;font-size:12.5px;font-weight:800;white-space:nowrap}.week,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week{margin-top:18px;font-size:10.5px;color:#5d5954;font-weight:700;text-align:center}.week div{padding:3px 0 8px}.cal{row-gap:5px}.day{position:relative;height:32px;border:0;background:transparent;display:grid;place-items:center;font-size:11.8px;font-weight:500;color:#2f2c29;cursor:pointer;z-index:1}.day.out{color:#c6c1bb}.day.today{font-weight:700}.day.today:after{content:'';position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#78a050;z-index:3}.day.sel:before{content:'';position:absolute;width:33px;height:33px;border:1.3px solid var(--green);border-radius:50%;background:rgba(242,247,237,.82);z-index:-1}.day.period:before{content:'';position:absolute;top:3px;bottom:3px;left:-1px;right:-1px;background:linear-gradient(90deg,#f9d7df,#f4c3cf);z-index:-2}.day.period.ps:before{left:3px;border-radius:999px 0 0 999px}.day.period.pe:before{right:3px;border-radius:0 999px 999px 0}.day.period.single:before{left:3px;right:3px;border-radius:999px}.section{margin-top:17px}.label{font-size:13.5px;font-weight:800;margin-bottom:8px;letter-spacing:-.02em}.chips{display:grid;grid-template-columns:1fr 1fr 1fr 1.08fr 1fr 1.34fr 36px;align-items:center;gap:6px;width:100%}.chip{min-width:0;height:35px;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 8px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:9.5px;font-weight:700;color:#45413d;cursor:pointer;white-space:nowrap;overflow:hidden}.chip .txt{display:inline-block;min-width:0;padding:0 1px;white-space:nowrap}.chip .ico{width:17px;height:17px;flex:0 0 17px;border-radius:5px;display:grid;place-items:center;font-size:9px;background:#f7f6f4}.chip[data-s="복통"] .ico{background:#fff0f3;color:#e58096}.chip[data-s="붓기"] .ico{background:#f1f7ed;color:#7ea05f}.chip[data-s="피로"] .ico{background:#f3f0fb;color:#8477b5}.chip[data-s="예민함"] .ico{background:#fff8e9;color:#d39b38}.chip[data-s="두통"] .ico{background:#fff1f3;color:#e17f92}.chip[data-s="허리통증"] .ico{background:#eef4ff;color:#6d8ec2}.chip.on{background:var(--pinksoft);border-color:#efc6d0}.chip.plus{width:36px;padding:0;font-size:19px}.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}.flowBtn{min-width:0;height:62px;padding:6px 1px 5px;border:0;border-right:1px solid var(--line);background:#fff;cursor:pointer;font-size:8.9px;font-weight:700;color:#514d48}.flowBtn:last-child{border-right:0}.flowBtn.on{background:#fbfdf9;box-shadow:inset 0 0 0 1.4px var(--green)}.drops{height:24px;display:flex;align-items:flex-end;justify-content:center;gap:1px;margin-bottom:4px;color:var(--pink)}.drops.none{color:#c8c4be}.drops svg{width:11px;height:16px;fill:currentColor}.memoBox{border:1px solid var(--line);border-radius:13px;padding:10px}.memoHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.memoTitle{font-size:13.5px;font-weight:800}.date{font-size:8.5px;color:#8f8983}.memoWrap{position:relative}.memo{width:100%;height:56px;border:1px solid #e8e8df;border-radius:10px;background:var(--memo);padding:11px 31px 9px 10px;font:inherit;font-size:10px;line-height:1.4;color:#403c38;resize:none;outline:0}.memo::placeholder{color:#827e79}.pencil{position:absolute;right:9px;top:11px;color:#6f6a64;font-size:13px}.status{height:3px;font-size:0}.tip{margin-top:10px;border:1px solid var(--line);background:#fbfbf8;border-radius:11px;padding:9px 10px;display:flex;align-items:center;gap:6px;font-size:9px;color:#6f6a65;line-height:1.25}.tip .leaf{font-size:14px;color:#6e9452}.tip b{color:#6e9452}.tools{position:absolute;top:54px;right:7px;display:flex;flex-direction:column;gap:5px;opacity:0;visibility:hidden;pointer-events:none;transition:.15s}.stage:hover .tools,.stage:focus-within .tools{opacity:1;visibility:visible;pointer-events:auto}.ctrl{width:23px;height:23px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#777;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.07);font-size:9px}.ctrl.active{border-color:var(--green);color:#6f8d55;background:var(--greensoft)}.ctrl[disabled]{opacity:.4}@media(max-width:410px){.card{padding-left:12px;padding-right:12px}.chips{grid-template-columns:.93fr .93fr .93fr 1fr .93fr 1.25fr 31px;gap:3px}.chip{height:32px;font-size:8.2px;gap:3px;padding:0 4px}.chip .ico{width:14px;height:14px;flex-basis:14px;font-size:7px}.chip.plus{width:31px;font-size:17px}.tip{font-size:8.3px}}</style></head><body><div class="stage"><div class="shell"><main class="card"><header class="top"><div><div class="title">Cycle Notes</div><div class="sub">주기 로그</div></div><div class="nav"><button id="prev">‹</button><div class="month" id="month"></div><button id="next">›</button></div></header><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="cal" id="cal"></div><section class="section"><div class="label">주요 증상</div><div class="chips" id="chips"></div></section><section class="section"><div class="label">흐름 강도</div><div class="flow" id="flow"></div></section><section class="section memoBox"><div class="memoHead"><div class="memoTitle">오늘 메모</div><div class="date" id="date"></div></div><div class="memoWrap"><textarea class="memo" id="memo" placeholder="오늘의 증상이나 컨디션을 기록해보세요."></textarea><span class="pencil">✎</span></div></section><div class="status" id="status"></div><div class="tip"><span class="leaf">♧</span><b>TIP</b><span>증상과 흐름을 꾸준히 기록하면 패턴 파악에 도움이 돼요!</span></div></main><aside class="tools"><button class="ctrl" id="sizeBtn">↔</button><button class="ctrl" id="lockBtn">⌁</button><button class="ctrl" id="resetBtn">↻</button></aside></div></div><script>const SYM=[['복통','◔'],['붓기','♧'],['피로','▣'],['예민함','☹'],['두통','◎'],['허리통증','⌁']],FLOW=['없음','아주 적음','적음','보통','많음','아주 많음'],K='cycle-notes-v5',PK='cycle-notes-prefs-v3',SIZE=[430,400,370];let data=JSON.parse(localStorage.getItem(K)||'{}'),prefs=Object.assign({size:0,locked:false},JSON.parse(localStorage.getItem(PK)||'{}')),cur=new Date(),sel=iso(new Date()),ss=new Set(),sf='없음',timer=null;cur=new Date(cur.getFullYear(),cur.getMonth(),1);const $=q=>document.querySelector(q);function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function savePrefs(){localStorage.setItem(PK,JSON.stringify(prefs))}function flash(t='자동 저장됨'){$('#status').textContent=t;clearTimeout(timer);timer=setTimeout(()=>$('#status').textContent='',1200)}function save(){data[sel]={period:sf!=='없음',symptoms:[...ss],flow:sf,memo:$('#memo').value.trim()};localStorage.setItem(K,JSON.stringify(data));renderCal();flash()}function applyPrefs(){document.documentElement.style.setProperty('--card-w',SIZE[prefs.size]+'px');$('#lockBtn').classList.toggle('active',prefs.locked);$('#sizeBtn').disabled=prefs.locked}function loadEditor(){const r=data[sel]||{};ss=new Set(r.symptoms||[]);sf=r.flow||'없음';$('#memo').value=r.memo||'';$('#date').textContent=sel;renderChips();renderFlow()}function renderChips(){$('#chips').innerHTML=SYM.map(([n,i])=>`<button class="chip ${ss.has(n)?'on':''}" data-s="${n}"><span class="ico">${i}</span><span class="txt">${n}</span></button>`).join('')+'<button class="chip plus" title="기타">＋</button>';document.querySelectorAll('.chip[data-s]').forEach(b=>b.onclick=()=>{ss.has(b.dataset.s)?ss.delete(b.dataset.s):ss.add(b.dataset.s);renderChips();save()})}function dropSvg(n){const s='<svg viewBox="0 0 16 20"><path d="M8 1C6.8 4.8 2.2 8.7 2.2 13.1A5.8 5.8 0 0 0 13.8 13C13.8 8.7 9.2 4.8 8 1Z"/></svg>';if(n===0)return `<span class="drops none">${s}</span>`;const c=n===4?2:n===5?3:1;return `<span class="drops">${s.repeat(c)}</span>`}function renderFlow(){$('#flow').innerHTML=FLOW.map((n,i)=>`<button class="flowBtn ${sf===n?'on':''}" data-f="${n}">${dropSvg(i)}${n}</button>`).join('');document.querySelectorAll('.flowBtn').forEach(b=>b.onclick=()=>{sf=b.dataset.f;renderFlow();save()})}function renderCal(){const y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());$('#month').textContent=`${y}년 ${m+1}월`;$('#cal').innerHTML='';const dates=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);dates.push({d,k:iso(d)})}dates.forEach(({d,k},i)=>{const r=data[k],prev=data[dates[i-1]?.k],next=data[dates[i+1]?.k],period=!!r?.period,ps=period&&!prev?.period,pe=period&&!next?.period,single=ps&&pe,b=document.createElement('button');b.className='day'+(d.getMonth()!=m?' out':'')+(k===sel?' sel':'')+(k===iso(new Date())?' today':'')+(period?' period':'')+(ps?' ps':'')+(pe?' pe':'')+(single?' single':'');b.textContent=d.getDate();b.onclick=()=>{sel=k;loadEditor();renderCal()};$('#cal').appendChild(b)})}$('#prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);renderCal()};$('#next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);renderCal()};$('#memo').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(save,500)});$('#sizeBtn').onclick=()=>{if(prefs.locked)return;prefs.size=(prefs.size+1)%SIZE.length;applyPrefs();savePrefs()};$('#lockBtn').onclick=()=>{prefs.locked=!prefs.locked;applyPrefs();savePrefs()};$('#resetBtn').onclick=()=>{if(!confirm('위젯 기록과 설정을 초기화할까요?'))return;localStorage.removeItem(K);localStorage.removeItem(PK);location.reload()};applyPrefs();loadEditor();renderCal();</script></body></html>
