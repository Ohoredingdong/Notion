<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Cycle Notes</title><style>:root{--card-w:360px;--p:#fff;--t:#262523;--s:#85817b;--muted:#b9b5af;--l:#e9e5df;--pink:#f6ccd5;--pink-deep:#e98fa5;--pink-soft:#fff3f6;--green:#9fb78a;--green2:#f2f6ee;--soft:#faf9f7;--memo:#f5f7ef;--shadow:0 8px 24px rgba(17,24,39,.07)}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:6px;font-family:Arial,"Noto Sans KR",sans-serif;color:var(--t);overflow-x:auto;-webkit-font-smoothing:antialiased}.stage{width:calc(var(--card-w) + 42px);margin:0 auto;transition:width .18s ease}.shell{position:relative;width:var(--card-w);transition:width .18s ease}.w{width:100%;background:var(--p);border:1px solid var(--l);border-radius:20px;padding:16px 16px 14px;box-shadow:var(--shadow)}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.title{font-size:16px;font-weight:800;letter-spacing:-.025em;line-height:1.1}.sub{font-size:11px;color:#696661;margin-top:4px;font-weight:600}.nav{height:34px;display:grid;grid-template-columns:34px 1fr 34px;align-items:center;border:1px solid var(--l);border-radius:11px;overflow:hidden;background:#fff}.nav button{width:34px;height:34px;border:0;background:#fff;font-size:20px;color:#55524f;cursor:pointer}.nav button:first-child{border-right:1px solid #f0ede8}.nav button:last-child{border-left:1px solid #f0ede8}.nav button:hover{background:var(--soft)}.month{font-size:11px;font-weight:800;min-width:80px;text-align:center;white-space:nowrap}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr)}.week{margin-top:16px;font-size:10px;color:#625f5b;text-align:center;font-weight:800}.week div{padding:5px 0}.cal{row-gap:4px}.d{position:relative;height:31px;display:grid;place-items:center;border:0;background:transparent;font-size:11px;cursor:pointer;color:var(--t);z-index:1}.d.out{color:#c7c3bd}.d.today{font-weight:800}.d.today:after{content:'';position:absolute;bottom:0;width:4px;height:4px;border-radius:50%;background:#76a14f}.d.sel:before{content:'';position:absolute;inset:2px;border:1.5px solid var(--green);border-radius:999px;background:rgba(242,246,238,.75);z-index:-1}.d.period:before{content:'';position:absolute;left:0;right:0;top:3px;bottom:3px;background:linear-gradient(90deg,#f8d7de,#f4c2cd);z-index:-2}.d.period.ps:before{left:3px;border-radius:999px 0 0 999px}.d.period.pe:before{right:3px;border-radius:0 999px 999px 0}.d.period.single:before{left:3px;right:3px;border-radius:999px}.d.period{font-weight:800;color:#4d3b3f}.d.record:after{content:'';position:absolute;right:5px;top:4px;width:4px;height:4px;border-radius:50%;background:#aa9aba}.d.today.record:after{top:4px;right:5px}.sec{margin-top:14px}.st{font-size:12px;font-weight:800;margin-bottom:8px;letter-spacing:-.01em}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:5px;border:1px solid var(--l);background:#fff;border-radius:10px;padding:7px 9px;font-size:10px;cursor:pointer;font-weight:700;min-height:31px}.chip .ico{font-size:12px;line-height:1}.chip.on{background:var(--pink-soft);border-color:#efc4ce}.chip.on .ico{filter:saturate(1.2)}.flow{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--l);border-radius:12px;overflow:hidden;background:#fff}.f{border:0;border-right:1px solid var(--l);background:#fff;padding:7px 2px 6px;font-size:8.7px;cursor:pointer;min-height:58px;font-weight:700;color:#56534f}.f:last-child{border-right:0}.f.on{background:#fbfdf9;box-shadow:inset 0 0 0 1.5px var(--green)}.drop{display:flex;align-items:flex-end;justify-content:center;gap:1px;height:22px;margin-bottom:5px;color:#e68fa4}.drop svg{width:13px;height:17px;fill:currentColor;opacity:.88}.drop.none{color:#cbc7c1}.memoBox{border:1px solid var(--l);border-radius:13px;padding:10px;background:#fff}.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.date{font-size:8.5px;color:var(--s);font-weight:700}.memoWrap{position:relative}.memo{width:100%;height:54px;border:1px solid #e8e8df;background:var(--memo);border-radius:10px;padding:10px 30px 9px 10px;font:inherit;font-size:10px;line-height:1.45;resize:none;outline:0;color:#34312e}.memo:focus{border-color:#c5d1b8;box-shadow:0 0 0 2px rgba(159,183,138,.12)}.pencil{position:absolute;right:9px;top:9px;font-size:13px;color:#706c67;pointer-events:none}.actions{display:grid;grid-template-columns:.9fr 1.15fr;gap:7px;margin-top:9px}.actions button{height:33px;border-radius:10px;font-size:9.5px;font-weight:800;cursor:pointer}.periodBtn{border:1px solid var(--l);background:#fff}.periodBtn.on{background:#fff1f4;border-color:#efbdc9;color:#bd5d73}.save{border:0;background:#292826;color:#fff}.status{height:16px;padding-top:4px;font-size:8px;color:var(--s)}.tip{margin-top:8px;border:1px solid var(--l);background:#fbfbf8;border-radius:11px;padding:8px 9px;font-size:8.2px;color:#73706b;line-height:1.4;display:flex;align-items:center;gap:5px}.leaf{color:#739253;font-size:13px}.tip b{color:#739253}.tools{position:absolute;top:8px;left:calc(100% + 7px);display:flex;flex-direction:column;gap:7px;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-4px);transition:.16s}.stage:hover .tools,.stage:focus-within .tools{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0)}.ctrl{width:27px;height:27px;border:1px solid var(--l);border-radius:999px;background:#fff;color:#777;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);padding:0;font-size:12px}.ctrl:hover{background:var(--soft)}.ctrl.active{border-color:var(--green);color:#6f8d55;background:#f3f7ef}.ctrl[disabled]{opacity:.4;cursor:not-allowed}@media(hover:none){.tools{opacity:1;visibility:visible;pointer-events:auto;transform:none}}@media(max-width:420px){body{padding:4px}.stage{margin-left:0}}</style></head><body><div class="stage"><div class="shell"><main class="w"><div class="top"><div><div class="title">Cycle Notes</div><div class="sub">주기 로그</div></div><div class="nav"><button id="prev" aria-label="이전 달">‹</button><div class="month" id="month"></div><button id="next" aria-label="다음 달">›</button></div></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="cal" id="cal"></div><section class="sec"><div class="st">주요 증상</div><div class="chips" id="chips"></div></section><section class="sec"><div class="st">흐름 강도</div><div class="flow" id="flow"></div></section><section class="sec memoBox"><div class="meta"><div class="st" style="margin:0">오늘 메모</div><div class="date" id="date"></div></div><div class="memoWrap"><textarea class="memo" id="memo" placeholder="오늘의 증상이나 컨디션을 기록해보세요."></textarea><span class="pencil">✎</span></div></section><div class="actions"><button class="periodBtn" id="periodBtn">생리일 표시</button><button class="save" id="save">저장</button></div><div class="status" id="status"></div><div class="tip"><span class="leaf">♧</span><b>TIP</b><span>증상과 흐름을 꾸준히 기록하면 패턴 파악에 도움이 돼요.</span></div></main><aside class="tools"><button class="ctrl" id="sizeBtn" title="크기 변경">↔</button><button class="ctrl" id="lockBtn" title="크기 잠금">⌁</button><button class="ctrl" id="resetBtn" title="초기화">↻</button></aside></div></div><script>const S=[['복통','◔'],['붓기','♧'],['피로','▣'],['예민함','☹'],['두통','◒'],['허리통증','⌁'],['기타','＋']],F=['없음','아주 적음','적음','보통','많음','아주 많음'],K='cycle-notes-v3',PK='cycle-notes-prefs-v1',SIZE=[360,330,300];let data=JSON.parse(localStorage.getItem(K)||'{}'),prefs=Object.assign({size:0,locked:false},JSON.parse(localStorage.getItem(PK)||'{}')),cur=new Date(),sel=iso(new Date()),ss=new Set(),sf='없음',draftPeriod=false;cur=new Date(cur.getFullYear(),cur.getMonth(),1);const $=x=>document.querySelector(x);function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function saveLocal(){localStorage.setItem(K,JSON.stringify(data))}function savePrefs(){localStorage.setItem(PK,JSON.stringify(prefs))}function applyPrefs(){document.documentElement.style.setProperty('--card-w',SIZE[prefs.size]+'px');$('#lockBtn').classList.toggle('active',prefs.locked);$('#sizeBtn').disabled=prefs.locked}function editor(){let r=data[sel]||{};ss=new Set(r.symptoms||[]);sf=r.flow||'없음';draftPeriod=!!r.period;$('#memo').value=r.memo||'';$('#date').textContent=sel;$('#periodBtn').classList.toggle('on',draftPeriod);$('#periodBtn').textContent=draftPeriod?'생리일 선택됨':'생리일 표시';chips();flows()}function chips(){$('#chips').innerHTML=S.map(([x,i])=>`<button class="chip ${ss.has(x)?'on':''}" data-s="${x}"><span class="ico">${i}</span>${x}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ss.has(b.dataset.s)?ss.delete(b.dataset.s):ss.add(b.dataset.s);chips()})}function dropSvg(n){const svg='<svg viewBox="0 0 16 20"><path d="M8 1C6.8 4.8 2.2 8.7 2.2 13.1A5.8 5.8 0 0 0 13.8 13C13.8 8.7 9.2 4.8 8 1Z"/></svg>';if(n===0)return `<span class="drop none">${svg.replace('fill:currentColor','')}</span>`;if(n===1)return `<span class="drop">${svg}</span>`;if(n===2)return `<span class="drop">${svg}${svg}</span>`;return `<span class="drop">${svg}${svg}${svg}</span>`}function flows(){$('#flow').innerHTML=F.map((x,i)=>`<button class="f ${sf===x?'on':''}" data-f="${x}">${dropSvg(i===0?0:i<4?1:i===4?2:3)}${x}</button>`).join('');document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{sf=b.dataset.f;flows()})}function cal(){let y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());$('#month').textContent=`${y}년 ${m+1}월`;$('#cal').innerHTML='';let dates=[];for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);dates.push({d,k:iso(d)})}dates.forEach(({d,k},i)=>{let r=data[k],prev=data[dates[i-1]?.k],next=data[dates[i+1]?.k],b=document.createElement('button'),period=!!r?.period,ps=period&&!prev?.period,pe=period&&!next?.period,single=ps&&pe;b.className='d'+(d.getMonth()!=m?' out':'')+(k===sel?' sel':'')+(k===iso(new Date())?' today':'')+(period?' period':'')+(ps?' ps':'')+(pe?' pe':'')+(single?' single':'')+(r?' record':'');b.textContent=d.getDate();b.onclick=()=>{sel=k;editor();cal()};$('#cal').appendChild(b)})}$('#prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);cal()};$('#next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);cal()};$('#periodBtn').onclick=()=>{draftPeriod=!draftPeriod;$('#periodBtn').classList.toggle('on',draftPeriod);$('#periodBtn').textContent=draftPeriod?'생리일 선택됨':'생리일 표시'};$('#save').onclick=()=>{data[sel]={period:draftPeriod,symptoms:[...ss],flow:sf,memo:$('#memo').value.trim()};saveLocal();cal();$('#status').textContent='이 브라우저에 저장했어요';setTimeout(()=>$('#status').textContent='',1600)};$('#sizeBtn').onclick=()=>{if(prefs.locked)return;prefs.size=(prefs.size+1)%SIZE.length;applyPrefs();savePrefs()};$('#lockBtn').onclick=()=>{prefs.locked=!prefs.locked;applyPrefs();savePrefs()};$('#resetBtn').onclick=()=>{if(!confirm('위젯 기록과 설정을 초기화할까요?'))return;localStorage.removeItem(K);localStorage.removeItem(PK);location.reload()};applyPrefs();editor();cal();</script></body></html>
