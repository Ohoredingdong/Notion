<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cycle Notes</title><style>:root{--p:#fff;--t:#262523;--s:#85817b;--l:#ebe7e2;--pink:#f7cbd4;--pink2:#efa9b9;--green:#a9bd91;--soft:#faf9f7}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:6px;font-family:Arial,"Noto Sans KR",sans-serif;color:var(--t)}.w{max-width:620px;margin:auto;background:var(--p);border:1px solid var(--l);border-radius:20px;padding:18px;box-shadow:0 8px 24px #11182712}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:18px;font-weight:800}.sub{font-size:10px;color:var(--s);margin-top:3px}.nav{display:flex;align-items:center;gap:8px}.nav button{border:0;background:transparent;font-size:20px;color:var(--s);cursor:pointer}.month{font-size:13px;font-weight:700;min-width:92px;text-align:center}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr)}.week{margin-top:16px;font-size:9px;color:var(--s);text-align:center}.week div{padding:6px}.cal{gap:4px}.d{position:relative;aspect-ratio:1;display:grid;place-items:center;border:0;background:transparent;border-radius:50%;font-size:11px;cursor:pointer;color:var(--t)}.d.out{color:#ccc}.d.today:after{content:'';position:absolute;bottom:4px;width:3px;height:3px;border-radius:50%;background:var(--green)}.d.sel{outline:2px solid var(--green);background:#f3f7ef}.d.period{background:var(--pink);color:#7c3f4d;font-weight:700}.d.record:before{content:'';position:absolute;right:4px;top:4px;width:4px;height:4px;border-radius:50%;background:#a899bd}.sec{margin-top:15px}.st{font-size:11px;font-weight:800;margin-bottom:8px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--l);background:#fff;border-radius:9px;padding:7px 10px;font-size:9px;cursor:pointer}.chip.on{background:#fff3f6;border-color:#efc3cd}.flow{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--l);border-radius:12px;overflow:hidden}.f{border:0;border-right:1px solid var(--l);background:#fff;padding:8px 2px;font-size:8px;cursor:pointer;min-height:52px}.f:last-child{border:0}.f.on{background:#f3f7ef;box-shadow:inset 0 0 0 1px var(--green)}.drop{display:block;font-size:15px;margin-bottom:5px;color:#df8fa2}.memo{width:100%;height:60px;border:1px solid var(--l);background:var(--soft);border-radius:11px;padding:9px;font:inherit;font-size:10px;resize:none;outline:0}.actions{display:grid;grid-template-columns:1fr 1.3fr;gap:7px;margin-top:10px}.actions button{height:35px;border-radius:10px;font-size:10px;font-weight:800;cursor:pointer}.periodBtn{border:1px solid var(--l);background:#fff}.periodBtn.on{background:#fff1f4;border-color:#efbdc9;color:#bd5d73}.save{border:0;background:#292826;color:#fff}.status{height:18px;padding-top:6px;font-size:8px;color:var(--s)}.tip{margin-top:10px;border:1px solid var(--l);background:#fbfbf8;border-radius:11px;padding:9px 10px;font-size:8px;color:#777}.tip b{color:#78975f;margin-right:5px}@media(max-width:480px){.w{padding:14px}.flow{grid-template-columns:repeat(3,1fr)}.f:nth-child(3){border-right:0}}</style></head><body><main class="w"><div class="top"><div><div class="title">Cycle Notes</div><div class="sub">주기 로그</div></div><div class="nav"><button id="prev">‹</button><div class="month" id="month"></div><button id="next">›</button></div></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="cal" id="cal"></div><section class="sec"><div class="st">주요 증상</div><div class="chips" id="chips"></div></section><section class="sec"><div class="st">흐름 강도</div><div class="flow" id="flow"></div></section><section class="sec"><div class="st">오늘 메모 · <span id="date"></span></div><textarea class="memo" id="memo" placeholder="오늘의 증상이나 컨디션을 기록해보세요."></textarea></section><div class="actions"><button class="periodBtn" id="periodBtn">생리일 표시</button><button class="save" id="save">저장</button></div><div class="status" id="status"></div><div class="tip"><b>TIP</b> 증상과 흐름을 꾸준히 기록하면 내 주기 패턴을 보기 쉬워져요.</div></main><script>const S=['복통','붓기','피로','예민함','두통','허리통증','기타'],F=['없음','아주 적음','적음','보통','많음','아주 많음'],K='cycle-notes-v2';let data=JSON.parse(localStorage.getItem(K)||'{}'),cur=new Date(),sel=iso(new Date()),ss=new Set(),sf='없음',pm=false;cur=new Date(cur.getFullYear(),cur.getMonth(),1);const $=x=>document.querySelector(x);function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function saveLocal(){localStorage.setItem(K,JSON.stringify(data))}function editor(){let r=data[sel]||{};ss=new Set(r.symptoms||[]);sf=r.flow||'없음';$('#memo').value=r.memo||'';$('#date').textContent=sel;chips();flows()}function chips(){$('#chips').innerHTML=S.map(x=>`<button class="chip ${ss.has(x)?'on':''}" data-s="${x}">${x}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ss.has(b.dataset.s)?ss.delete(b.dataset.s):ss.add(b.dataset.s);chips()})}function flows(){$('#flow').innerHTML=F.map((x,i)=>`<button class="f ${sf===x?'on':''}" data-f="${x}"><span class="drop">${i?'●':'○'}</span>${x}</button>`).join('');document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{sf=b.dataset.f;flows()})}function cal(){let y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());$('#month').textContent=`${y}년 ${m+1}월`;$('#cal').innerHTML='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let k=iso(d),r=data[k],b=document.createElement('button');b.className='d'+(d.getMonth()!=m?' out':'')+(k===sel?' sel':'')+(k===iso(new Date())?' today':'')+(r?.period?' period':'')+(r?' record':'');b.textContent=d.getDate();b.onclick=()=>{sel=k;if(pm){data[k]={...(data[k]||{}),period:!data[k]?.period};saveLocal()}editor();cal()};$('#cal').appendChild(b)}}$('#prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);cal()};$('#next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);cal()};$('#periodBtn').onclick=()=>{pm=!pm;$('#periodBtn').classList.toggle('on',pm);$('#periodBtn').textContent=pm?'생리일 선택 중':'생리일 표시'};$('#save').onclick=()=>{data[sel]={...(data[sel]||{}),symptoms:[...ss],flow:sf,memo:$('#memo').value.trim()};saveLocal();cal();$('#status').textContent='저장했어요';setTimeout(()=>$('#status').textContent='',1600)};editor();cal();</script></body></html>
