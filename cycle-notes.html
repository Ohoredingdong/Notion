<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Cycle Notes</title><style>:root{--card-w:390px;--bg:#fff;--text:#2c2a27;--sub:#6d6964;--muted:#aaa59f;--line:#ebe7e1;--soft:#fbfaf8;--pink:#f8cdd7;--pink2:#ef9aae;--pinksoft:#fff5f7;--green:#98b27f;--greensoft:#f1f6ec;--memo:#f6f8f1;--shadow:0 8px 24px rgba(24,23,21,.065)}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:6px;font-family:Inter,Arial,"Noto Sans KR",sans-serif;color:var(--text);overflow-x:auto;-webkit-font-smoothing:antialiased}.stage{width:calc(var(--card-w) + 44px);margin:0 auto;transition:width .18s ease}.shell{position:relative;width:var(--card-w);transition:width .18s ease}.card{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:22px 21px 18px;box-shadow:var(--shadow)}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.title{font-size:20px;font-weight:800;letter-spacing:-.035em;line-height:1}.sub{font-size:12px;color:#65615c;margin-top:7px;font-weight:500;letter-spacing:-.01em}.nav{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;height:39px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.025)}.nav button{width:38px;height:39px;border:0;background:#fff;color:#57524d;font-size:23px;line-height:1;cursor:pointer}.nav button:first-child{border-right:1px solid #f0ece7}.nav button:last-child{border-left:1px solid #f0ece7}.nav button:hover{background:#faf9f7}.month{min-width:88px;text-align:center;font-size:13px;font-weight:800;white-space:nowrap;letter-spacing:-.01em}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr)}.week{margin-top:24px;font-size:11px;color:#5d5954;font-weight:700;text-align:center}.week div{padding:4px 0 10px}.cal{row-gap:10px}.day{position:relative;height:34px;border:0;background:transparent;display:grid;place-items:center;font-size:12.5px;font-weight:500;color:#2f2c29;cursor:pointer;z-index:1}.day.out{color:#c6c1bb}.day.today{font-weight:700}.day.today:after{content:'';position:absolute;bottom:-2px;width:5px;height:5px;border-radius:50%;background:#78a050}.day.sel:before{content:'';position:absolute;inset:0 3px;border:1.4px solid var(--green);border-radius:50%;background:rgba(242,247,237,.82);z-index:-1}.day.period:before{content:'';position:absolute;top:4px;bottom:4px;left:-1px;right:-1px;background:linear-gradient(90deg,#f9d7df,#f4c3cf);z-index:-2}.day.period.ps:before{left:3px;border-radius:999px 0 0 999px}.day.period.pe:before{right:3px;border-radius:0 999px 999px 0}.day.period.single:before{left:3px;right:3px;border-radius:999px}.day.period{font-weight:700}.section{margin-top:21px}.label{font-size:13.5px;font-weight:800;margin-bottom:9px;letter-spacing:-.02em}.chips{display:flex;gap:7px;flex-wrap:nowrap;align-items:center}.chip{height:35px;display:flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:10.5px;font-weight:700;color:#45413d;cursor:pointer;white-space:nowrap}.chip .ico{width:21px;height:21px;border-radius:7px;display:grid;place-items:center;font-size:12px;line-height:1;background:#f7f6f4}.chip[data-s="복통"] .ico{background:#fff0f3;color:#e58096}.chip[data-s="붓기"] .ico{background:#f1f7ed;color:#7ea05f}.chip[data-s="피로"] .ico{background:#f3f0fb;color:#8477b5}.chip[data-s="예민함"] .ico{background:#fff8e9;color:#d39b38}.chip[data-s="두통"] .ico{background:#fff1f3;color:#e17f92}.chip[data-s="허리통증"] .ico{background:#eef4ff;color:#6d8ec2}.chip.on{background:var(--pinksoft);border-color:#efc6d0}.chip.plus{width:35px;padding:0;justify-content:center;font-size:20px;color:#59554f}.flow{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}.flowBtn{min-height:66px;padding:8px 2px 7px;border:0;border-right:1px solid var(--line);background:#fff;cursor:pointer;font-size:9px;font-weight:700;color:#514d48}.flowBtn:last-child{border-right:0}.flowBtn.on{background:#fbfdf9;box-shadow:inset 0 0 0 1.5px var(--green)}.drops{height:27px;display:flex;align-items:flex-end;justify-content:center;gap:1px;margin-bottom:5px;color:#eb91a5}.drops.none{color:#c8c4be}.drops svg{width:13px;height:18px;fill:currentColor}.memoBox{border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff}.memoHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.memoTitle{font-size:13.5px;font-weight:800;letter-spacing:-.02em}.date{font-size:9px;color:#8f8983;font-weight:600}.memoWrap{position:relative}.memo{width:100%;height:60px;border:1px solid #e8e8df;border-radius:11px;background:var(--memo);padding:13px 36px 11px 12px;font:inherit;font-size:10.5px;line-height:1.45;color:#403c38;resize:none;outline:0}.memo::placeholder{color:#827e79}.memo:focus{border-color:#c6d3b9;box-shadow:0 0 0 2px rgba(157,183,135,.12)}.pencil{position:absolute;right:12px;top:13px;color:#6f6a64;font-size:16px}.tip{margin-top:14px;border:1px solid var(--line);background:#fbfbf8;border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:7px;font-size:10px;color:#6f6a65;line-height:1.35}.tip .leaf{font-size:17px;color:#6e9452}.tip b{color:#6e9452}.status{margin-top:6px;min-height:11px;font-size:8.5px;color:#9a948e;text-align:right}.tools{position:absolute;top:10px;left:calc(100% + 8px);display:flex;flex-direction:column;gap:7px;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-4px);transition:.16s}.stage:hover .tools,.stage:focus-within .tools{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0)}.ctrl{width:28px;height:28px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#777;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);font-size:12px}.ctrl:hover{background:#faf9f7}.ctrl.active{border-color:var(--green);color:#6f8d55;background:var(--greensoft)}.ctrl[disabled]{opacity:.4;cursor:not-allowed}@media(hover:none){.tools{opacity:1;visibility:visible;pointer-events:auto;transform:none}}@media(max-width:430px){body{padding:4px}.stage{margin-left:0}.card{padding:20px 18px 17px}.chips{gap:5px}.chip{padding:0 7px;font-size:9.8px}.chip .ico{width:19px;height:19px}}</style></head><body><div class="stage"><div class="shell"><main class="card"><header class="top"><div><div class="title">Cycle Notes</div><div class="sub">주기 로그</div></div><div class="nav"><button id="prev" aria-label="이전 달">‹</button><div class="month" id="month"></div><button id="next" aria-label="다음 달">›</button></div></header><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="cal" id="cal"></div><section class="section"><div class="label">주요 증상</div><div class="chips" id="chips"></div></section><section class="section"><div class="label">흐름 강도</div><div class="flow" id="flow"></div></section><section class="section memoBox"><div class="memoHead"><div class="memoTitle">오늘 메모</div><div class="date" id="date"></div></div><div class="memoWrap"><textarea class="memo" id="memo" placeholder="오늘의 증상이나 컨디션을 기록해보세요."></textarea><span class="pencil">✎</span></div></section><div class="status" id="status"></div><div class="tip"><span class="leaf">♧</span><b>TIP</b><span>증상과 흐름을 꾸준히 기록하면 패턴 파악에 도움이 돼요!</span></div></main><aside class="tools"><button class="ctrl" id="sizeBtn" title="크기 변경">↔</button><button class="ctrl" id="lockBtn" title="크기 잠금">⌁</button><button class="ctrl" id="resetBtn" title="초기화">↻</button></aside></div></div><script>const SYM=[['복통','◔'],['붓기','♧'],['피로','▣'],['예민함','☹'],['두통','◎'],['허리통증','⌁']],FLOW=['없음','아주 적음','적음','보통','많음','아주 많음'],K='cycle-notes-v5',PK='cycle-notes-prefs-v2',SIZE=[390,360,330];let data=JSON.parse(localStorage.getItem(K)||'{}'),prefs=Object.assign({size:0,locked:false},JSON.parse(localStorage.getItem(PK)||'{}')),cur=new Date(),sel=iso(new Date()),ss=new Set(),sf='없음',timer=null;cur=new Date(cur.getFullYear(),cur.getMonth(),1);const $=q=>document.querySelector(q);function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function savePrefs(){localStorage.setItem(PK,JSON.stringify(prefs))}function flash(t='자동 저장됨'){$('#status').textContent=t;clearTimeout(timer);timer=setTimeout(()=>$('#status').textContent='',1200)}function save(){data[sel]={period:sf!=='없음',symptoms:[...ss],flow:sf,memo:$('#memo').value.trim()};localStorage.setItem(K,JSON.stringify(data));renderCal();flash()}function applyPrefs(){document.documentElement.style.setProperty('--card-w',SIZE[prefs.size]+'px');$('#lockBtn').classList.toggle('active',prefs.locked);$('#sizeBtn').disabled=prefs.locked}function loadEditor(){const r=data[sel]||{};ss=new Set(r.symptoms||[]);sf=r.flow||'없음';$('#memo').value=r.memo||'';$('#date').textContent=sel;renderChips();renderFlow()}function renderChips(){$('#chips').innerHTML=SYM.map(([n,i])=>`<button class="chip ${ss.has(n)?'on':''}" data-s="${n}"><span class="ico">${i}</span>${n}</button>`).join('')+'<button class="chip plus" title="기타">＋</button>';document.querySelectorAll('.chip[data-s]').forEach(b=>b.onclick=()=>{ss.has(b.dataset.s)?ss.delete(b.dataset.s):ss.add(b.dataset.s);renderChips();save()})}function dropSvg(n){const s='<svg viewBox="0 0 16 20"><path d="M8 1C6.8 4.8 2.2 8.7 2.2 13.1A5.8 5.8 0 0 0 13.8 13C13.8 8.7 9.2 4.8 8 1Z"/></svg>';if(n===0)return `<span class="drops none">${s}</span>`;const c=n===4?2:n===5?3:1;return `<span class="drops">${s.repeat(c)}</span>`}function renderFlow(){$('#flow').innerHTML=FLOW.map((n,i)=>`<button class="flowBtn ${sf===n?'on':''}" data-f="${n}">${dropSvg(i)}${n}</button>`).join('');document.querySelectorAll('.flowBtn').forEach(b=>b.onclick=()=>{sf=b.dataset.f;renderFlow();save()})}function renderCal(){const y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());$('#month').textContent=`${y}년 ${m+1}월`;$('#cal').innerHTML='';const dates=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);dates.push({d,k:iso(d)})}dates.forEach(({d,k},i)=>{const r=data[k],prev=data[dates[i-1]?.k],next=data[dates[i+1]?.k],period=!!r?.period,ps=period&&!prev?.period,pe=period&&!next?.period,single=ps&&pe,b=document.createElement('button');b.className='day'+(d.getMonth()!=m?' out':'')+(k===sel?' sel':'')+(k===iso(new Date())?' today':'')+(period?' period':'')+(ps?' ps':'')+(pe?' pe':'')+(single?' single':'');b.textContent=d.getDate();b.onclick=()=>{sel=k;loadEditor();renderCal()};$('#cal').appendChild(b)})}$('#prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);renderCal()};$('#next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);renderCal()};$('#memo').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(save,500)});$('#sizeBtn').onclick=()=>{if(prefs.locked)return;prefs.size=(prefs.size+1)%SIZE.length;applyPrefs();savePrefs()};$('#lockBtn').onclick=()=>{prefs.locked=!prefs.locked;applyPrefs();savePrefs()};$('#resetBtn').onclick=()=>{if(!confirm('위젯 기록과 설정을 초기화할까요?'))return;localStorage.removeItem(K);localStorage.removeItem(PK);location.reload()};applyPrefs();loadEditor();renderCal();</script></body></html>
