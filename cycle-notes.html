<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Cycle Notes</title><style>:root{--card-w:360px;--p:#fff;--t:#242321;--s:#85817b;--l:#ebe7e2;--pink:#f8d3da;--pink2:#edafbd;--green:#9fb78a;--green2:#edf3e9;--soft:#faf9f7;--shadow:0 8px 24px rgba(17,24,39,.07)}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:6px;font-family:Arial,"Noto Sans KR",sans-serif;color:var(--t);overflow-x:auto}.stage{width:calc(var(--card-w) + 42px);margin:0 auto;transition:width .18s ease}.shell{position:relative;width:var(--card-w);transition:width .18s ease}.w{width:100%;background:var(--p);border:1px solid var(--l);border-radius:18px;padding:13px 14px 12px;box-shadow:var(--shadow)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:14px;font-weight:800;letter-spacing:-.02em}.sub{font-size:8px;color:var(--s);margin-top:2px}.nav{display:flex;align-items:center;gap:3px}.nav button{width:20px;height:20px;border:0;background:transparent;font-size:15px;color:var(--s);cursor:pointer;border-radius:6px}.nav button:hover{background:var(--soft)}.month{font-size:10px;font-weight:700;min-width:73px;text-align:center}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr)}.week{margin-top:10px;font-size:7px;color:var(--s);text-align:center}.week div{padding:4px}.cal{gap:2px}.d{position:relative;aspect-ratio:1;display:grid;place-items:center;border:0;background:transparent;border-radius:50%;font-size:9px;cursor:pointer;color:var(--t)}.d.out{color:#ccc}.d.today:after{content:'';position:absolute;bottom:3px;width:3px;height:3px;border-radius:50%;background:var(--green)}.d.sel{outline:1.5px solid var(--green);background:var(--green2)}.d.period{background:var(--pink);color:#7c3f4d;font-weight:700}.d.record:before{content:'';position:absolute;right:3px;top:3px;width:3px;height:3px;border-radius:50%;background:#9b8bab}.sec{margin-top:11px}.st{font-size:9px;font-weight:800;margin-bottom:6px}.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{border:1px solid var(--l);background:#fff;border-radius:8px;padding:5px 7px;font-size:7.5px;cursor:pointer}.chip.on{background:#fff4f6;border-color:#efc4ce}.flow{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--l);border-radius:10px;overflow:hidden}.f{border:0;border-right:1px solid var(--l);background:#fff;padding:5px 1px;font-size:6.8px;cursor:pointer;min-height:38px}.f:last-child{border-right:0}.f.on{background:#f3f7ef;box-shadow:inset 0 0 0 1px var(--green)}.drop{display:block;font-size:10px;margin-bottom:3px;color:#dc8ca0}.memo{width:100%;height:44px;border:1px solid var(--l);background:var(--soft);border-radius:9px;padding:7px 8px;font:inherit;font-size:8px;resize:none;outline:0}.memo:focus{border-color:#bdcdae;box-shadow:0 0 0 2px rgba(159,183,138,.12)}.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.date{font-size:7px;color:var(--s);font-weight:600}.actions{display:grid;grid-template-columns:.9fr 1.2fr;gap:6px;margin-top:8px}.actions button{height:30px;border-radius:9px;font-size:8px;font-weight:800;cursor:pointer}.periodBtn{border:1px solid var(--l);background:#fff}.periodBtn.on{background:#fff1f4;border-color:#efbdc9;color:#bd5d73}.save{border:0;background:#292826;color:#fff}.status{height:15px;padding-top:4px;font-size:7px;color:var(--s)}.tip{margin-top:7px;border:1px solid var(--l);background:#fbfbf8;border-radius:9px;padding:7px 8px;font-size:6.8px;color:#777;line-height:1.35}.tip b{color:#78975f;margin-right:4px}.tools{position:absolute;top:8px;left:calc(100% + 7px);display:flex;flex-direction:column;gap:7px;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-4px);transition:.16s}.stage:hover .tools,.stage:focus-within .tools{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0)}.ctrl{width:27px;height:27px;border:1px solid var(--l);border-radius:999px;background:#fff;color:#777;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);padding:0;font-size:12px}.ctrl:hover{background:var(--soft)}.ctrl.active{border-color:var(--green);color:#6f8d55;background:#f3f7ef}@media(hover:none){.tools{opacity:1;visibility:visible;pointer-events:auto;transform:none}}@media(max-width:420px){body{padding:4px}.stage{margin-left:0}} </style></head><body><div class="stage"><div class="shell"><main class="w"><div class="top"><div><div class="title">Cycle Notes</div><div class="sub">주기 로그</div></div><div class="nav"><button id="prev">‹</button><div class="month" id="month"></div><button id="next">›</button></div></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="cal" id="cal"></div><section class="sec"><div class="st">주요 증상</div><div class="chips" id="chips"></div></section><section class="sec"><div class="st">흐름 강도</div><div class="flow" id="flow"></div></section><section class="sec"><div class="meta"><div class="st" style="margin:0">메모</div><div class="date" id="date"></div></div><textarea class="memo" id="memo" placeholder="오늘의 증상이나 컨디션을 기록해보세요."></textarea></section><div class="actions"><button class="periodBtn" id="periodBtn">생리일 표시</button><button class="save" id="save">저장</button></div><div class="status" id="status"></div><div class="tip"><b>TIP</b> 날짜를 선택하고 생리일·증상·흐름·메모를 입력한 뒤 저장하세요.</div></main><aside class="tools"><button class="ctrl" id="sizeBtn" title="크기 변경">↔</button><button class="ctrl" id="lockBtn" title="크기 잠금">⌁</button><button class="ctrl" id="resetBtn" title="초기화">↻</button></aside></div></div><script>const S=['복통','붓기','피로','예민함','두통','허리통증','기타'],F=['없음','아주 적음','적음','보통','많음','아주 많음'],K='cycle-notes-v3',PK='cycle-notes-prefs-v1',SIZE=[360,330,300];let data=JSON.parse(localStorage.getItem(K)||'{}'),prefs=Object.assign({size:0,locked:false},JSON.parse(localStorage.getItem(PK)||'{}')),cur=new Date(),sel=iso(new Date()),ss=new Set(),sf='없음',draftPeriod=false;cur=new Date(cur.getFullYear(),cur.getMonth(),1);const $=x=>document.querySelector(x);function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function saveLocal(){localStorage.setItem(K,JSON.stringify(data))}function savePrefs(){localStorage.setItem(PK,JSON.stringify(prefs))}function applyPrefs(){document.documentElement.style.setProperty('--card-w',SIZE[prefs.size]+'px');$('#lockBtn').classList.toggle('active',prefs.locked);$('#sizeBtn').disabled=prefs.locked}function editor(){let r=data[sel]||{};ss=new Set(r.symptoms||[]);sf=r.flow||'없음';draftPeriod=!!r.period;$('#memo').value=r.memo||'';$('#date').textContent=sel;$('#periodBtn').classList.toggle('on',draftPeriod);$('#periodBtn').textContent=draftPeriod?'생리일 선택됨':'생리일 표시';chips();flows()}function chips(){$('#chips').innerHTML=S.map(x=>`<button class="chip ${ss.has(x)?'on':''}" data-s="${x}">${x}</button>`).join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ss.has(b.dataset.s)?ss.delete(b.dataset.s):ss.add(b.dataset.s);chips()})}function flows(){$('#flow').innerHTML=F.map((x,i)=>`<button class="f ${sf===x?'on':''}" data-f="${x}"><span class="drop">${i?'●':'○'}</span>${x}</button>`).join('');document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{sf=b.dataset.f;flows()})}function cal(){let y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());$('#month').textContent=`${y}년 ${m+1}월`;$('#cal').innerHTML='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let k=iso(d),r=data[k],b=document.createElement('button');b.className='d'+(d.getMonth()!=m?' out':'')+(k===sel?' sel':'')+(k===iso(new Date())?' today':'')+(r?.period?' period':'')+(r?' record':'');b.textContent=d.getDate();b.onclick=()=>{sel=k;editor();cal()};$('#cal').appendChild(b)}}$('#prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);cal()};$('#next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);cal()};$('#periodBtn').onclick=()=>{draftPeriod=!draftPeriod;$('#periodBtn').classList.toggle('on',draftPeriod);$('#periodBtn').textContent=draftPeriod?'생리일 선택됨':'생리일 표시'};$('#save').onclick=()=>{data[sel]={period:draftPeriod,symptoms:[...ss],flow:sf,memo:$('#memo').value.trim()};saveLocal();cal();$('#status').textContent='이 브라우저에 저장했어요';setTimeout(()=>$('#status').textContent='',1600)};$('#sizeBtn').onclick=()=>{if(prefs.locked)return;prefs.size=(prefs.size+1)%SIZE.length;applyPrefs();savePrefs()};$('#lockBtn').onclick=()=>{prefs.locked=!prefs.locked;applyPrefs();savePrefs()};$('#resetBtn').onclick=()=>{if(!confirm('위젯 기록과 설정을 초기화할까요?'))return;localStorage.removeItem(K);localStorage.removeItem(PK);location.reload()};applyPrefs();editor();cal();</script></body></html>
