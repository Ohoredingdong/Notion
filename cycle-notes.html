<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Cycle Notes</title><style>:root{--card-w:390px;--bg:#fff;--text:#242321;--sub:#6f6b66;--muted:#aaa59f;--line:#ece8e2;--soft:#fbfaf8;--pink:#f7cbd5;--pink2:#ef9fb2;--pinksoft:#fff4f6;--green:#9db787;--greensoft:#f3f7ef;--memo:#f7f8f2;--shadow:0 10px 30px rgba(25,24,22,.08)}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:7px;font-family:Arial,"Noto Sans KR",sans-serif;color:var(--text);overflow-x:auto;-webkit-font-smoothing:antialiased}.stage{width:calc(var(--card-w) + 44px);margin:0 auto;transition:width .18s ease}.shell{position:relative;width:var(--card-w);transition:width .18s ease}.card{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:23px;padding:22px 22px 18px;box-shadow:var(--shadow)}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.title{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1}.sub{font-size:13px;color:#58544f;margin-top:7px;font-weight:600}.nav{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;height:38px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.02)}.nav button{width:38px;height:38px;border:0;background:#fff;color:#504c47;font-size:25px;line-height:1;cursor:pointer}.nav button:first-child{border-right:1px solid #f0ece7}.nav button:last-child{border-left:1px solid #f0ece7}.nav button:hover{background:#faf9f7}.month{min-width:88px;text-align:center;font-size:13px;font-weight:800;white-space:nowrap}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr)}.week{margin-top:22px;font-size:11px;color:#66615c;font-weight:700;text-align:center}.week div{padding:5px 0 9px}.cal{row-gap:8px}.day{position:relative;height:34px;border:0;background:transparent;display:grid;place-items:center;font-size:12px;color:#282522;cursor:pointer;z-index:1}.day.out{color:#c4c0ba}.day.today{font-weight:800}.day.today:after{content:'';position:absolute;bottom:-1px;width:5px;height:5px;border-radius:50%;background:#79a251}.day.sel:before{content:'';position:absolute;inset:1px 4px;border:1.5px solid var(--green);border-radius:50%;background:rgba(244,248,240,.75);z-index:-1}.day.period:before{content:'';position:absolute;top:3px;bottom:3px;left:-1px;right:-1px;background:linear-gradient(90deg,#f9d8df,#f5c5cf);z-index:-2}.day.period.ps:before{left:4px;border-radius:999px 0 0 999px}.day.period.pe:before{right:4px;border-radius:0 999px 999px 0}.day.period.single:before{left:4px;right:4px;border-radius:999px}.day.period{font-weight:700}.section{margin-top:20px}.label{font-size:14px;font-weight:800;margin-bottom:10px;letter-spacing:-.015em}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{height:36px;display:flex;align-items:center;gap:7px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:11px;font-weight:700;color:#44403c;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.015)}.chip .ico{font-size:15px;line-height:1}.chip.on{background:var(--pinksoft);border-color:#efc7d0}.chip.plus{width:36px;padding:0;justify-content:center;font-size:20px;color:#59554f}.flow{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}.flowBtn{min-height:68px;padding:8px 2px 7px;border:0;border-right:1px solid var(--line);background:#fff;cursor:pointer;font-size:9.5px;font-weight:700;color:#504c47}.flowBtn:last-child{border-right:0}.flowBtn.on{background:#fbfdf9;box-shadow:inset 0 0 0 1.5px var(--green)}.drops{height:28px;display:flex;align-items:flex-end;justify-content:center;gap:2px;margin-bottom:5px;color:#ec92a7}.drops.none{color:#c7c4bf}.drops svg{width:14px;height:19px;fill:currentColor}.memoBox{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}.memoHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.memoTitle{font-size:14px;font-weight:800}.date{font-size:9px;color:#8a857f;font-weight:700}.memoWrap{position:relative}.memo{width:100%;height:64px;border:1px solid #e7e8de;border-radius:11px;background:var(--memo);padding:13px 34px 11px 12px;font:inherit;font-size:11px;line-height:1.45;color:#3f3b37;resize:none;outline:0}.memo:focus{border-color:#c6d3b9;box-shadow:0 0 0 2px rgba(157,183,135,.13)}.pencil{position:absolute;right:11px;top:12px;color:#69645f;font-size:16px}.tip{margin-top:14px;border:1px solid var(--line);background:#fbfbf8;border-radius:13px;padding:11px 12px;display:flex;align-items:center;gap:7px;font-size:10px;color:#6e6964;line-height:1.35}.tip .leaf{font-size:16px;color:#6f9453}.tip b{color:#6f9453}.status{margin-top:7px;min-height:12px;font-size:9px;color:#99938d;text-align:right}.tools{position:absolute;top:10px;left:calc(100% + 8px);display:flex;flex-direction:column;gap:7px;opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-4px);transition:.16s}.stage:hover .tools,.stage:focus-within .tools{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(0)}.ctrl{width:28px;height:28px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#777;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);font-size:12px}.ctrl:hover{background:#faf9f7}.ctrl.active{border-color:var(--green);color:#6f8d55;background:var(--greensoft)}.ctrl[disabled]{opacity:.4;cursor:not-allowed}@media(hover:none){.tools{opacity:1;visibility:visible;pointer-events:auto;transform:none}}@media(max-width:430px){body{padding:4px}.stage{margin-left:0}}</style></head><body><div class="stage"><div class="shell"><main class="card"><header class="top"><div><div class="title">Cycle Notes</div><div class="sub">주기 로그</div></div><div class="nav"><button id="prev" aria-label="이전 달">‹</button><div class="month" id="month"></div><button id="next" aria-label="다음 달">›</button></div></header><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="cal" id="cal"></div><section class="section"><div class="label">주요 증상</div><div class="chips" id="chips"></div></section><section class="section"><div class="label">흐름 강도</div><div class="flow" id="flow"></div></section><section class="section memoBox"><div class="memoHead"><div class="memoTitle">오늘 메모</div><div class="date" id="date"></div></div><div class="memoWrap"><textarea class="memo" id="memo" placeholder="오늘의 증상이나 컨디션을 기록해보세요."></textarea><span class="pencil">✎</span></div></section><div class="status" id="status"></div><div class="tip"><span class="leaf">♧</span><b>TIP</b><span>증상과 흐름을 꾸준히 기록하면 패턴 파악에 도움이 돼요!</span></div></main><aside class="tools"><button class="ctrl" id="sizeBtn" title="크기 변경">↔</button><button class="ctrl" id="lockBtn" title="크기 잠금">⌁</button><button class="ctrl" id="resetBtn" title="초기화">↻</button></aside></div></div><script>const SYM=[['복통','◔'],['붓기','♧'],['피로','▣'],['예민함','☹'],['두통','◉'],['허리통증','⌁']],FLOW=['없음','아주 적음','적음','보통','많음','아주 많음'],K='cycle-notes-v4',PK='cycle-notes-prefs-v2',SIZE=[390,360,330];let data=JSON.parse(localStorage.getItem(K)||'{}'),prefs=Object.assign({size:0,locked:false},JSON.parse(localStorage.getItem(PK)||'{}')),cur=new Date(),sel=iso(new Date()),ss=new Set(),sf='없음',timer=null;cur=new Date(cur.getFullYear(),cur.getMonth(),1);const $=q=>document.querySelector(q);function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function savePrefs(){localStorage.setItem(PK,JSON.stringify(prefs))}function flash(t='자동 저장됨'){$('#status').textContent=t;clearTimeout(timer);timer=setTimeout(()=>$('#status').textContent='',1200)}function save(){data[sel]={period:sf!=='없음',symptoms:[...ss],flow:sf,memo:$('#memo').value.trim()};localStorage.setItem(K,JSON.stringify(data));renderCal();flash()}function applyPrefs(){document.documentElement.style.setProperty('--card-w',SIZE[prefs.size]+'px');$('#lockBtn').classList.toggle('active',prefs.locked);$('#sizeBtn').disabled=prefs.locked}function loadEditor(){const r=data[sel]||{};ss=new Set(r.symptoms||[]);sf=r.flow||'없음';$('#memo').value=r.memo||'';$('#date').textContent=sel;renderChips();renderFlow()}function renderChips(){$('#chips').innerHTML=SYM.map(([n,i])=>`<button class="chip ${ss.has(n)?'on':''}" data-s="${n}"><span class="ico">${i}</span>${n}</button>`).join('')+'<button class="chip plus" title="기타">＋</button>';document.querySelectorAll('.chip[data-s]').forEach(b=>b.onclick=()=>{ss.has(b.dataset.s)?ss.delete(b.dataset.s):ss.add(b.dataset.s);renderChips();save()})}function dropSvg(n){const s='<svg viewBox="0 0 16 20"><path d="M8 1C6.8 4.8 2.2 8.7 2.2 13.1A5.8 5.8 0 0 0 13.8 13C13.8 8.7 9.2 4.8 8 1Z"/></svg>';if(n===0)return `<span class="drops none">${s}</span>`;const c=n===4?2:n===5?3:1;return `<span class="drops">${s.repeat(c)}</span>`}function renderFlow(){$('#flow').innerHTML=FLOW.map((n,i)=>`<button class="flowBtn ${sf===n?'on':''}" data-f="${n}">${dropSvg(i)}${n}</button>`).join('');document.querySelectorAll('.flowBtn').forEach(b=>b.onclick=()=>{sf=b.dataset.f;renderFlow();save()})}function renderCal(){const y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());$('#month').textContent=`${y}년 ${m+1}월`;$('#cal').innerHTML='';const dates=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);dates.push({d,k:iso(d)})}dates.forEach(({d,k},i)=>{const r=data[k],prev=data[dates[i-1]?.k],next=data[dates[i+1]?.k],period=!!r?.period,ps=period&&!prev?.period,pe=period&&!next?.period,single=ps&&pe,b=document.createElement('button');b.className='day'+(d.getMonth()!=m?' out':'')+(k===sel?' sel':'')+(k===iso(new Date())?' today':'')+(period?' period':'')+(ps?' ps':'')+(pe?' pe':'')+(single?' single':'');b.textContent=d.getDate();b.onclick=()=>{sel=k;loadEditor();renderCal()};$('#cal').appendChild(b)})}$('#prev').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);renderCal()};$('#next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);renderCal()};$('#memo').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(save,500)});$('#sizeBtn').onclick=()=>{if(prefs.locked)return;prefs.size=(prefs.size+1)%SIZE.length;applyPrefs();savePrefs()};$('#lockBtn').onclick=()=>{prefs.locked=!prefs.locked;applyPrefs();savePrefs()};$('#resetBtn').onclick=()=>{if(!confirm('위젯 기록과 설정을 초기화할까요?'))return;localStorage.removeItem(K);localStorage.removeItem(PK);location.reload()};applyPrefs();loadEditor();renderCal();</script></body></html>
