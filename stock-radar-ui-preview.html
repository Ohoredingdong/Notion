ow')}</div><small>방향과 근거를 함께 살펴보세요</small>${spark()}<small>곡선 예시 · 예측값 아님</small></button><button class="float-card two" data-go="alerts"><span class="ringcount">${state.alerts.length}</span><span><h3>나의 조건 알림</h3><small>조건을 눌러 설정하기</small></span></button></div><div class="rightcol"><section class="watch-section"><h2 class="sidehead">내 관심 기업 <button class="textlink" data-go="watchlist">전체 ${icon('arrow')}</button></h2>${companies.filter(c=>state.watch.includes(c.id)).slice(0,3).map(c=>`<button class="personrow" data-go="stock" data-symbol="${c.id}"><span class="avatar ${c.tone}">${c.mark}</span><span><b>${c.name}</b><small>${c.market} · 시세 미연결</small></span></button>`).join('')||'<p class="small muted">관심 기업을 추가해 보세요.</p>'}</section><section class="sideblock"><h3>예측 검증</h3><span class="tiny muted">상승 · 하락 포착률</span><div class="ghostnum">— / —</div><p>실제 성적은 연결 전입니다.</p><button data-go="results">검증 화면 보기 ${icon('arrow')}</button></section><section class="panel side-panel"><h3>오늘의 읽을거리</h3>${articles.slice(0,3).map((a,i)=>`<button class="readrow" data-article="${i}"><span class="bullet"></span>${a[1]}</button>`).join('')}</section></div></div><div class="quickmenu">${[['discover','종목 탐색','기업을 찾아보세요','search',''],['forecast','예측 시나리오','시간과 방향을 확인','globe','blue'],['alerts','조건 알림','기다리는 변화를 설정','bell','pink'],['results','예측 검증','실제 결과와 나란히','results','mint']].map(([r,t,s,i,c])=>`<button class="quick" data-go="${r}"><span class="tile ${c}">${icon(i)}</span><span><b>${t}</b><small>${s}</small></span>${icon('arrow')}</button>`).join('')}</div>`}
function discover(){return heading('어떤 기업이 궁금하세요?','시장을 고르고 종목을 누르면 기업 상세로 이동해요.')+`<div class="filterbar"><label class="searchbox">${icon('search')}<input id="stockSearch" aria-label="종목 검색" placeholder="종목명 또는 코드 검색" value="${esc(query)}"></label><select id="sort" aria-label="종목 정렬">${['기본 순','이름 순','관심 먼저'].map(t=>`<option ${sorting===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="chips">${['전체','코스피','코스닥','미국'].map(t=>`<button class="chip ${filter===t?'on':''}" data-filter="${t}">${t}</button>`).join('')}</div><section class="panel"><div class="sh"><h2>기업 목록</h2><span class="tiny muted" id="listCount"></span></div><div id="stockList"></div></section>`}
function updateList(){let list=companies.filter(c=>(filter==='전체'||c.market===filter)&&(c.name.toLowerCase().includes(query.toLowerCase())||c.id.toLowerCase().includes(query.toLowerCase())));if(sorting==='이름 순')list.sort((a,b)=>a.name.localeCompare(b.name,'ko'));if(sorting==='관심 먼저')list.sort((a,b)=>Number(state.watch.includes(b.id))-Number(state.watch.includes(a.id)));document.getElementById('listCount').textContent=list.length+'개 · 화면 예시';document.getElementById('stockList').innerHTML=list.map(row).join('')||'<div class="empty"><h3>검색 결과가 없어요</h3><p>검색어와 시장을 바꿔보세요.</p><button class="btn white" data-action="clear">검색 초기화</button></div>'}
function chart(p='1일'){const sets={'1일':[83,68,72,61,78,69,58,66,42,53,37,49,31,35,21,29,17,24,10,14],'1주':[78,86,71,80,62,64,52,61,72,61,42,44,33,48,43,22,30,18,27,22],'1개월':[70,78,83,65,72,58,62,70,55,42,53,42,35,46,40,28,35,26,19,25]};const pts=sets[p].map((v,i)=>`${i*500/19},${v+20}`).join(' ');return `<div class="chart"><div class="chartnote"><span>레이아웃용 곡선</span><span>실제 주가 아님</span></div><svg viewBox="0 0 500 150" preserveAspectRatio="none" role="img" aria-label="${p} 디자인용 예시 차트"><defs><linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c7b6f4" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="M0 35H500M0 75H500M0 115H500" stroke="#eee8f7" stroke-dasharray="3 5"/><polygon points="0,150 ${pts} 500,150" fill="url(#shade)"/><polyline points="${pts}" fill="none" stroke="#a18bd7" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><div class="chartnote"><span>${p} 구간 시작</span><span>구간 종료</span></div></div>`}
function stock(){const c=current(),liked=state.watch.includes(c.id);return heading('기업 상세','기업의 근거에서 예측과 알림까지 이어집니다.')+`<div class="detailgrid"><section class="panel"><div class="row between companytitle"><div class="row"><span class="avatar ${c.tone}">${c.mark}</span><div><h2>${c.name}</h2><small class="muted">${c.id} · ${c.market}</small></div></div><button class="ib star ${liked?'on':''}" data-action="star" aria-label="${liked?'관심 해제':'관심 등록'}" aria-pressed="${liked}">${icon('star')}</button></div><div class="blankprice">—<small>시세 연결 전</small></div><div class="chips">${['1일','1주','1개월'].map(t=>`<button class="chip ${period===t?'on':''}" data-period="${t}">${t}</button>`).join('')}</div>${chart(period)}<div class="tabs" aria-label="상세 내용">${['요약','투자 근거','위험 확인'].map(t=>`<button class="${detailTab===t?'on':''}" data-detailtab="${t}" aria-pressed="${detailTab===t}">${t}</button>`).join('')}</div><div class="copy"><h3>${detailTab==='요약'?'한눈에 보는 판단':detailTab==='투자 근거'?'원문과 함께 확인하는 근거':'변한 정보와 미확인 항목'}</h3><p>${detailTab==='요약'?'확인한 투자 근거, 기다리는 조건, 판단을 취소할 조건이 들어갈 자리입니다. 지금은 화면 이동을 체험하는 시안입니다.':detailTab==='투자 근거'?'공식 공시·재무·독립 가치평가의 확인 상태와 출처를 모아 보여주는 영역입니다. 이 시안은 실제 자료를 조회하거나 승인하지 않습니다.':'새 공시, 실적 전망 변화, 가격·기간의 불일치를 나누어 보여줍니다. 시안에서는 미확인 상태를 매수 적격으로 표시하지 않습니다.'}</p></div></section><div class="stack"><section class="panel">${sh('현재 판단')}${tag('투자 판정 미연결')}<div class="metrics"><div class="metric"><small>공식 근거</small><strong>대기</strong></div><div class="metric"><small>가치평가</small><strong>대기</strong></div><div class="metric"><small>진입 조건</small><strong>대기</strong></div></div><button class="flow" data-go="forecast" data-symbol="${c.id}"><span class="tile blue">${icon('globe')}</span><span><b>예측 시나리오</b><small>대상 구간과 방향 확인</small></span>${icon('arrow')}</button><button class="flow" data-go="alert" data-symbol="${c.id}"><span class="tile pink">${icon('bell')}</span><span><b>알림 조건 만들기</b><small>기다리는 변화 설정</small></span>${icon('arrow')}</button><div class="actions"><button class="btn ${liked?'soft':''}" data-action="star">${icon(liked?'check':'plus')}${liked?'관심 등록됨':'관심에 담기'}</button>${btn('내 관심','watchlist','','white')}</div></section><section class="panel">${sh('관련 읽을거리')}<button class="textlink" data-article="1">실적 발표 전 확인할 것들 ${icon('arrow')}</button></section></div></div>`}
function forecast(){const c=current();return heading('예측 시나리오','예측 대상 시간과 결과를 함께 보는 화면입니다.')+`<section class="panel"><div class="row between companytitle"><div><h2>${c.name}</h2><small class="muted">${c.id} · ${c.market}</small></div>${btn('기업 상세','stock',c.id,'white')}</div><div class="chips">${['30분','다음 정규장'].map(t=>`<button class="chip ${horizon===t?'on':''}" data-horizon="${t}">${t}</button>`).join('')}</div><div class="softbox"><b>${horizon==='30분'?'장중 30분':'다음 정규장'} 예측</b><p>대상 시간: 미연결 · 디자인 시안에서는 확률을 생성하지 않습니다.</p></div>${chart(horizon==='30분'?'1일':'1주')}<div class="forecastgrid">${['상승','횡보','하락'].map(t=>`<div class="fc"><b>${t}</b><strong>—</strong><small>예측값 미연결</small></div>`).join('')}</div><div class="actions">${btn('예측 검증 보기','results','','','results')}${btn('조건 만들기','alert',c.id,'white','bell')}</div></section>`}
function watchlist(){const cs=companies.filter(c=>state.watch.includes(c.id));return heading('내 관심 기업',`관심 ${cs.length}개 · 종목을 누르면 상세로 이동해요.`,btn('종목 추가','discover','','','plus'))+`<section class="panel">${cs.length?cs.map(c=>`<div class="watchrow">${row(c)}<button class="ib star on" data-remove-watch="${c.id}" aria-label="${c.name} 관심 해제">${icon('star')}</button></div>`).join(''):`<div class="empty"><span class="tile">${icon('star')}</span><h3>지켜볼 기업을 모아보세요</h3><p>기업 상세에서 별을 누르면 여기에 추가됩니다.</p>${btn('기업 둘러보기','discover')}</div>`}</section>`}
function alerts(){const all=state.alerts.filter(a=>alertFilter==='전체'||(alertFilter==='시안 켜짐'?a.on:!a.on));return heading('나의 조건 알림','이 브라우저의 시안 설정만 저장되며, 실제 감시는 실행되지 않아요.',btn('조건 만들기','alert','005930','','plus'))+`<div class="softbox"><b>인터랙션 체험 모드</b><p>실제 푸시·이메일·시세 감시는 연결하지 않습니다.</p></div><div class="chips">${['전체','시안 켜짐','시안 꺼짐'].map(t=>`<button class="chip ${alertFilter===t?'on':''}" data-alertfilter="${t}">${t}</button>`).join('')}</div>${all.length?all.map(a=>{const c=companies.find(c=>c.id===a.symbol);return `<article class="panel alertcard"><span class="tile pink">${icon('bell')}</span><div class="grow"><h3>${c.name}</h3><p>${esc(a.type)}${a.value?' · '+Number(a.value).toLocaleString('ko-KR'):''}</p>${tag('시안에만 저장')}<div class="row"><button class="textlink" data-edit="${a.id}">조건 수정</button><button class="textlink" data-go="stock" data-symbol="${c.id}">기업 보기</button></div></div><div class="stack" style="gap:14px"><button class="switch" role="switch" aria-label="${c.name} 시안 알림" aria-checked="${a.on}" data-toggle="${a.id}"><i></i></button><button class="ib" data-delete="${a.id}" aria-label="${c.name} 조건 삭제">${icon('trash')}</button></div></article>`}).join(''):`<section class="panel" style="margin-top:15px"><div class="empty"><span class="tile pink">${icon('bell')}</span><h3>어떤 변화를 기다리세요?</h3><p>종목을 고르고 조건을 저장하는 흐름을 체험하세요.</p>${btn('첫 조건 만들기','alert','005930','','plus')}</div></section>`}`}
function alertForm(){const a=state.alerts.find(x=>x.id===editId);return heading(a?'알림 조건 수정':'기다리는 변화를 정해볼까요?','입력하는 값은 실제 목표가나 매매 주문이 아닙니다.')+`<section class="panel" style="max-width:700px"><form id="alertForm"><label class="field"><span>살펴볼 종목</span><select name="symbol">${companies.map(c=>`<option value="${c.id}" ${(a?.symbol||symbol)===c.id?'selected':''}>${c.name} · ${c.id}</option>`).join('')}</select></label><div class="field"><span>조건 선택</span><div class="radios">${['가격 도달','근거 변화','실적 일정'].map((t,i)=>`<label><input type="radio" name="type" value="${t}" ${a?a.type===t?'checked':'':i===0?'checked':''}> ${t}</label>`).join('')}</div></div><label class="field" id="priceField" ${a&&a.type!=='가격 도달'?'hidden':''}><span>관찰할 가격 · 입력 체험용</span><input name="price" type="number" min="0.0001" step="any" inputmode="decimal" placeholder="예: 80000 (실제 목표가 아님)" value="${a?.value||''}"></label><div class="softbox"><b>시안 저장만 가능합니다</b><p>실제 시세 감시·알림 발송·자동 주문은 실행하지 않습니다.</p></div><p class="error" id="formError" role="alert"></p><div class="actions"><button class="btn" type="submit">${icon('check')}시안에 저장</button><button class="btn white" type="button" data-go="alerts">취소</button></div></form></section>`}
function news(){const list=articles.map((a,i)=>[a,i]).filter(([a])=>newsFilter==='전체'||a[0]===newsFilter);return heading('시장 브리핑','실제 뉴스가 아닌 콘텐츠 배치·열람 흐름을 확인하는 시안입니다.')+`<div class="chips">${['전체','시장','기업','읽는 방법'].map(t=>`<button class="chip ${newsFilter===t?'on':''}" data-newsfilter="${t}">${t}</button>`).join('')}</div><div class="newsgrid">${list.map(([a,i])=>`<button class="panel newsitem" data-article="${i}"><span class="tile ${i%2?'pink':'blue'}">${icon(a[3])}</span><h3>${a[1]}</h3><p>${a[2]}</p><span class="textlink">내용 보기 ${icon('arrow')}</span></button>`).join('')}</div>`}
function results(){return heading('예측, 결과로 확인하기','이 시안에는 실제 성과 숫자를 넣지 않았습니다.')+`<section class="panel">${sh('방향별 성적')}<div class="chips">${['전체','상승','하락'].map(t=>`<button class="chip ${resultFilter===t?'on':''}" data-resultfilter="${t}">${t}</button>`).join('')}</div><div class="metrics"><div class="metric"><small>${resultFilter} 평가 표본</small><strong>—</strong></div><div class="metric"><small>정답 / 놓침</small><strong>— / —</strong></div><div class="metric"><small>비교 기준 대비</small><strong>확인 전</strong></div></div><div class="softbox"><b>예측 → 실제 결과 → 다시 검토</b><p>발행 시각, 대상 구간, 최초 판단과 결과를 나란히 보는 영역입니다.</p></div><details style="margin:22px 0;font-size:12px"><summary>어떤 결과를 확인하나요?</summary><p class="muted">상승·하락 포착, 놓친 움직임, 잘못된 신호, 지연과 보류를 나눠 봅니다. 시안에서는 적중률이나 수익률을 만들지 않습니다.</p></details><a class="btn white" href="https://ohoredingdong.github.io/Notion/stock-forecast.html" target="_blank" rel="noopener">기존 운영 성적표 열기 ${icon('arrow')}</a><p class="tiny muted">별도의 운영 페이지로 이동합니다.</p></section>`}
function settings(){return heading('연결 · 설정','로그인이나 인증정보 없이 화면을 체험하세요.')+`<section class="panel"><div class="settingrow"><span class="tile blue">${icon('lock')}</span><div class="grow"><b>실시간 시세 연결</b><p>이 시안에서는 계좌·서버를 연결하지 않아요.</p></div>${tag('미연결')}<button class="ib" data-action="connection" aria-label="시세 연결 안내">${icon('arrow')}</button></div><div class="settingrow"><span class="tile pink">${icon('bell')}</span><div class="grow"><b>조건 알림 관리</b><p>시안에 저장한 조건 ${state.alerts.length}개</p></div><button class="ib" data-go="alerts" aria-label="알림 관리">${icon('arrow')}</button></div><div class="settingrow"><span class="tile">${icon('results')}</span><div class="grow"><b>목록 간결하게 보기</b><p>기업 목록의 행 간격을 줄여요.</p></div><button class="switch" role="switch" aria-label="목록 간결하게 보기" aria-checked="${state.compact}" data-action="compact"><i></i></button></div><div class="settingrow"><span class="tile mint">${icon('trash')}</span><div class="grow"><b>시안 데이터 초기화</b><p>이 브라우저의 관심·조건만 초기화해요.</p></div><button class="btn white" data-action="reset">초기화</button></div></section><section class="panel" style="margin-top:20px"><h2 style="font-size:15px">기존 위젯은 그대로 두었습니다</h2><p class="small muted">디자인과 화면 이동을 검토하는 별도 프로토타입입니다. 예측 모델·수집 데이터·자동화는 변경하지 않았습니다.</p><a class="btn white" href="https://ohoredingdong.github.io/Notion/stock-value-radar.html" target="_blank" rel="noopener">기존 투자 레이더 ${icon('arrow')}</a></section>`}
function render(navigate=false){globeCleanup();parse();nav();document.body.dataset.compact=String(state.compact);const screens={home,discover,stock,forecast,watchlist,alerts,alert:alertForm,news,results,settings};main.innerHTML='<div class="screen">'+screens[route]()+'</div>';if(route==='discover')updateList();if(route==='home')mountGlobe();document.title=names[route]+' · 투자 레이더 Globe 시안';if(navigate){window.scrollTo({top:0,behavior:'instant'});main.querySelector('h1')?.focus({preventScroll:true})}}
function modal(title,body,confirm){document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogBody').innerHTML=body;document.getElementById('dialogActions').innerHTML=confirm?'<button class="btn white" data-close>취소</button><button class="btn" data-confirm>초기화</button>':'<button class="btn" data-close>확인</button>';dialog.showModal();dialog.querySelector('[data-confirm]')?.addEventListener('click',()=>{confirm();dialog.close()})}
function toggleWatch(id=symbol){state.watch=state.watch.includes(id)?state.watch.filter(x=>x!==id):[...state.watch,id];save();render();toast(state.watch.includes(id)?'관심에 담았어요. 내 관심에서 확인하세요.':'관심 목록에서 해제했어요.')}
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;if(el.dataset.go){e.preventDefault();if(el.dataset.go==='alert')editId=null;go(el.dataset.go,el.dataset.symbol||'');return}if(el.dataset.market){filter=el.dataset.market;query='';go('discover');return}if(el.dataset.homemarket){market=el.dataset.homemarket;render();return}const mappings=[['filter',v=>{filter=v}],['period',v=>{period=v}],['detailtab',v=>{detailTab=v}],['horizon',v=>{horizon=v}],['newsfilter',v=>{newsFilter=v}],['resultfilter',v=>{resultFilter=v}],['alertfilter',v=>{alertFilter=v}]];for(const [key,set]of mappings){if(el.dataset[key]){set(el.dataset[key]);render();return}}if(el.dataset.removeWatch){toggleWatch(el.dataset.removeWatch);return}if(el.dataset.article!==undefined){const a=articles[Number(el.dataset.article)];modal(a[1],`<p>${a[2]}</p><div class="softbox"><b>콘텐츠 예시 화면</b><p>실제 기사나 공시가 아닙니다. 열기·닫기와 연결 흐름을 확인하는 시안입니다.</p></div>`);return}if(el.dataset.edit){editId=el.dataset.edit;go('alert',state.alerts.find(a=>a.id===editId).symbol);return}if(el.dataset.toggle){const a=state.alerts.find(a=>a.id===el.dataset.toggle);a.on=!a.on;save();render();toast('시안 표시만 변경했어요. 실제 감시는 실행되지 않습니다.');return}if(el.dataset.delete){state.alerts=state.alerts.filter(a=>a.id!==el.dataset.delete);save();render();toast('시안 조건을 삭제했어요.');return}if(el.hasAttribute('data-close')){dialog.close();return}switch(el.dataset.action){case'back':back();break;case'star':toggleWatch();break;case'clear':filter='전체';query='';render();break;case'compact':state.compact=!state.compact;save();render();break;case'reset':modal('시안 데이터를 초기화할까요?','<p>이 브라우저에 저장한 관심·조건만 초기화합니다. 실제 위젯과 계좌에는 영향을 주지 않습니다.</p>',()=>{state=structuredClone(initial);save();render();toast('시안 데이터를 초기화했어요.')});break;case'connection':modal('이 시안에서는 연결하지 않아요','<p>토스 API 키, 비밀번호, 서버 주소를 입력할 필요가 없습니다.</p><div class="softbox"><b>실시간 · 주문 · 푸시 모두 미연결</b><p>안전한 연결 기능은 별도의 검증이 필요한 영역입니다.</p></div>');break}});
document.addEventListener('input',e=>{if(e.target.id==='stockSearch'){query=e.target.value;updateList()}});document.addEventListener('change',e=>{if(e.target.id==='sort'){sorting=e.target.value;updateList()}if(e.target.name==='type')document.getElementById('priceField').hidden=e.target.value!=='가격 도달'});
document.addEventListener('submit',e=>{if(e.target.id!=='alertForm')return;e.preventDefault();const f=new FormData(e.target),type=f.get('type'),value=Number(f.get('price'));if(type==='가격 도달'&&(!Number.isFinite(value)||value<=0)){document.getElementById('formError').textContent='0보다 큰 관찰 가격을 입력해 주세요.';return}const a={id:editId||String(Date.now()),symbol:f.get('symbol'),type,value:type==='가격 도달'?value:null,on:true};state.alerts=state.alerts.filter(x=>x.id!==a.id);state.alerts.push(a);editId=null;save();alertFilter='전체';go('alerts');toast('시안에 저장했어요. 실제 알림은 발송되지 않습니다.')});
document.getElementById('closeDialog').innerHTML=icon('close');document.getElementById('closeDialog').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});

const land=[[[ -17,37],[8,37],[28,31],[33,20],[44,12],[51,11],[46,0],[40,-12],[35,-25],[25,-35],[18,-34],[10,-20],[8,-2],[-3,5],[-15,12],[-17,25]], [[-10,36],[-9,44],[0,49],[8,55],[5,59],[15,71],[30,71],[37,65],[49,59],[57,54],[49,44],[39,42],[29,36],[22,40],[12,43],[4,42]], [[30,71],[55,75],[100,77],[140,70],[170,61],[163,52],[144,47],[135,40],[130,32],[120,20],[110,18],[107,7],[100,2],[94,15],[89,23],[80,8],[73,18],[66,25],[55,26],[43,12],[35,28],[38,42],[55,52]], [[130,32],[136,35],[142,44],[145,44],[142,36],[135,31]], [[113,-23],[115,-33],[131,-35],[140,-38],[153,-28],[146,-16],[136,-12],[125,-15]], [[47,-13],[50,-16],[48,-25],[44,-26],[44,-18]], [[-168,71],[-143,70],[-130,58],[-122,50],[-125,41],[-116,31],[-108,24],[-101,17],[-91,16],[-84,9],[-78,9],[-86,20],[-80,25],[-81,32],[-69,45],[-54,50],[-63,61],[-84,71],[-111,74]], [[-81,12],[-70,10],[-60,8],[-48,0],[-35,-6],[-39,-18],[-48,-27],[-55,-35],[-65,-55],[-73,-51],[-72,-35],[-78,-15],[-81,0]], [[-52,59],[-42,62],[-24,75],[-30,82],[-53,83],[-65,75],[-58,64]], [[96,5],[108,1],[117,-8],[127,-9],[137,-4],[150,-8],[148,-3],[131,1],[115,5]], [[-8,50],[-7,58],[-3,59],[1,53]], [[166,-35],[178,-38],[172,-47],[167,-44]]];
function inside(x,y,p){let yes=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if(((a[1]>y)!==(b[1]>y))&&(x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]))yes=!yes}return yes}
const globeDots=[];for(let lat=-55;lat<82;lat+=2.05){const step=2.25/Math.max(.23,Math.cos(lat*Math.PI/180));for(let lon=-178+(Math.round(lat/2)%2)*step/2;lon<180;lon+=step)if(land.some(p=>inside(lon,lat,p)))globeDots.push([lon*Math.PI/180,lat*Math.PI/180])}
function mountGlobe(){const canvas=document.getElementById('globe');if(!canvas)return;const ctx=canvas.getContext('2d');if(!ctx)return;let lon=(market==='미국'?-90:market==='한국'?105:30)*Math.PI/180,drag=null,raf=null;const tilt=15*Math.PI/180;
 function draw(){const size=canvas.clientWidth;if(size<1)return;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(size*dpr);canvas.height=Math.round(size*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const c=size/2,R=size*.405;ctx.clearRect(0,0,size,size);ctx.save();ctx.shadowColor='#b5a7ee55';ctx.shadowBlur=30;ctx.shadowOffsetY=17;ctx.beginPath();ctx.arc(c,c,R,0,Math.PI*2);const g=ctx.createRadialGradient(c-R*.46,c-R*.62,R*.02,c+R*.18,c+R*.35,R*1.35);g.addColorStop(0,'#e7f6ff');g.addColorStop(.22,'#badcfb');g.addColorStop(.5,'#a9c4f7');g.addColorStop(.77,'#9f9aef');g.addColorStop(1,'#8c79e2');ctx.fillStyle=g;ctx.fill();ctx.restore();ctx.save();ctx.beginPath();ctx.arc(c,c,R,0,Math.PI*2);ctx.clip();for(const [lng,lat]of globeDots){const a=lng-lon,x=Math.cos(lat)*Math.sin(a),y=Math.sin(lat)*Math.cos(tilt)-Math.cos(lat)*Math.cos(a)*Math.sin(tilt),z=Math.cos(lat)*Math.cos(a)*Math.cos(tilt)+Math.sin(lat)*Math.sin(tilt);if(z<=.02)continue;const px=c+R*x,py=c-R*y,s=R*.009*(.45+.55*z);ctx.beginPath();for(let j=0;j<6;j++){const t=Math.PI/3*j;const hx=px+Math.cos(t)*s,hy=py+Math.sin(t)*s;if(j===0)ctx.moveTo(hx,hy);else ctx.lineTo(hx,hy)}ctx.closePath();ctx.fillStyle=`rgba(255,255,255,${.27+.53*z})`;ctx.fill()}const rim=ctx.createRadialGradient(c,c,R*.81,c,c,R);rim.addColorStop(0,'#ffffff00');rim.addColorStop(.85,'#ffffff08');rim.addColorStop(1,'#ffffffbb');ctx.fillStyle=rim;ctx.fillRect(0,0,size,size);ctx.restore()}
 const resize=new ResizeObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)});resize.observe(canvas);draw();const rotate=e=>{const b=e.target.closest('[data-rotate]');if(b){lon+=Number(b.dataset.rotate)*Math.PI/180;draw()}};main.addEventListener('click',rotate);canvas.onpointerdown=e=>{drag=e.clientX;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag===null)return;lon-=(e.clientX-drag)*.009;drag=e.clientX;draw()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();lon+=(e.key==='ArrowLeft'?-1:1)*.16;draw()}};globeCleanup=()=>{resize.disconnect();cancelAnimationFrame(raf);main.removeEventListener('click',rotate)};
}
window.addEventListener('popstate',()=>render(true));window.addEventListener('hashchange',()=>render(true));if(!location.hash.startsWith('#/'))history.replaceState({radarPreview:true,index:0},'','#/home');else history.replaceState({radarPreview:true,index:0},'',location.href);document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon));render();
