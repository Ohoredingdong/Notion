<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>마켓 이벤트 · Life Town</title>
<link rel="stylesheet" href="./assets/life-town-v2.css">
<style>
:root{
  --panel:#fff;--soft:#f7f7f8;--soft2:#fafafa;--line:#e7e7ea;--line2:#f0f0f2;
  --text:#111113;--sub:#6e6e73;--muted:#9a9aa0;
  --blue:#007aff;--blue-soft:rgba(0,122,255,.075);
  --green:#248a3d;--green-soft:rgba(52,199,89,.085);
  --red:#d92d27;--red-soft:rgba(255,59,48,.075);
  --yellow:#9a7200;--yellow-soft:rgba(255,204,0,.11)
}
html[data-theme="dark"],html[data-lt-theme="dark"]{
  --panel:#1c1c1e;--soft:#2c2c2e;--soft2:#242426;--line:#38383a;--line2:#2f3033;
  --text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;
  --blue:#0a84ff;--blue-soft:rgba(10,132,255,.13);
  --green:#30d158;--green-soft:rgba(48,209,88,.12);
  --red:#ff453a;--red-soft:rgba(255,69,58,.12);
  --yellow:#ffd60a;--yellow-soft:rgba(255,214,10,.12)
}
*{box-sizing:border-box}html,body{margin:0;background:transparent}
body{padding:7px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}.root{width:100%;max-width:680px;margin:auto;container-type:inline-size}
.widget{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:17px 16px 13px;box-shadow:none;overflow:hidden}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.title{font-size:19px;font-weight:780;letter-spacing:-.045em;line-height:1.05}.subtitle{margin-top:5px;font-size:10.3px;line-height:1.35;color:var(--muted)}
.update{height:29px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:8.9px;font-weight:650;color:var(--sub);white-space:nowrap;flex:0 0 auto}.update-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}.update.stale .update-dot{background:var(--yellow)}.update.error .update-dot{background:var(--red)}
.hero{margin-top:14px;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:14px 14px 13px}.hero-label{display:flex;align-items:center;gap:6px;font-size:9.2px;font-weight:720;color:var(--sub);margin-bottom:10px}.hero-label i{width:6px;height:6px;border-radius:50%;background:var(--red)}
.hero-main{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center}.hero-icon{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}.hero-icon svg{width:25px;height:25px}.hero-copy{min-width:0}.hero-title{font-size:16px;font-weight:780;letter-spacing:-.03em;line-height:1.25;word-break:keep-all}.hero-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.meta-chip{display:inline-flex;align-items:center;height:22px;padding:0 7px;border:1px solid var(--line);border-radius:8px;background:var(--soft2);font-size:8.6px;color:var(--sub);white-space:nowrap}.hero-desc{margin-top:8px;font-size:9.5px;line-height:1.45;color:var(--sub);word-break:keep-all}.impact{display:flex;flex-direction:column;align-items:flex-end;gap:7px}.impact-pill{height:25px;display:inline-flex;align-items:center;padding:0 9px;border-radius:999px;font-size:8.6px;font-weight:720;white-space:nowrap}.impact-pill.high{background:var(--red-soft);color:var(--red)}.impact-pill.medium{background:var(--yellow-soft);color:var(--yellow)}.impact-pill.low{background:var(--soft);color:var(--sub)}.impact-dots{display:flex;gap:4px}.impact-dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}.impact-dots i.on{background:var(--red)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:9px}.sum{min-width:0;border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:10px 9px 9px}.sum-top{display:flex;align-items:center;gap:7px}.sum-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}.sum-title{font-size:9.7px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sum-count{margin-top:7px;font-size:18px;line-height:1;font-weight:780;letter-spacing:-.04em}.sum-sub{margin-top:4px;font-size:8.2px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:10px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}.col{min-width:0;padding:12px 11px 10px}.col+.col{border-left:1px solid var(--line2)}.col-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding-bottom:9px;border-bottom:1px solid var(--line2)}.col-title{font-size:11.5px;font-weight:760}.col-count{font-size:8.5px;color:var(--muted)}.list{display:flex;flex-direction:column}.event{display:grid;grid-template-columns:39px minmax(0,1fr);gap:8px;padding:10px 0;border-bottom:1px solid var(--line2)}.event:last-child{border-bottom:0}.event[hidden]{display:none!important}.time{font-size:9px;line-height:1.3;color:var(--muted);font-weight:650;white-space:pre-line;font-variant-numeric:tabular-nums}.event-main{min-width:0}.event-title{font-size:9.8px;line-height:1.35;font-weight:680;word-break:keep-all}.country{font-weight:760;margin-right:3px}.event-info{margin-top:3px;font-size:8.3px;line-height:1.25;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag-row{display:flex;align-items:center;gap:4px;margin-top:5px;flex-wrap:wrap}.tag{height:17px;display:inline-flex;align-items:center;padding:0 5px;border-radius:999px;font-size:7.7px;font-weight:690}.tag.blue{background:var(--blue-soft);color:var(--blue)}.tag.green{background:var(--green-soft);color:var(--green)}.tag.red{background:var(--red-soft);color:var(--red)}.tag.yellow{background:var(--yellow-soft);color:var(--yellow)}.more{width:100%;height:27px;margin-top:6px;border:0;border-top:1px solid var(--line2);background:transparent;color:var(--sub);font-size:8.6px;font-weight:650;cursor:pointer}.more[hidden]{display:none}.empty{padding:18px 0 9px;text-align:center;font-size:8.7px;color:var(--muted)}
.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:9px 1px 0;border-top:1px solid var(--line2);font-size:8.3px;color:var(--muted)}.footer-left{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.retry{height:24px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:8.4px;color:var(--sub);cursor:pointer}.loading{padding:48px 10px;text-align:center;color:var(--muted);font-size:9.5px}.load-state{display:flex;align-items:center;justify-content:center;gap:7px}.load-state i{width:6px;height:6px;border-radius:50%;background:var(--blue)}
@container(max-width:600px){.widget{padding:15px 12px 11px}.title{font-size:17px}.summary{gap:5px}.sum{padding:9px 7px 8px}.hero-main{grid-template-columns:46px minmax(0,1fr) auto}.hero-icon{width:46px;height:46px;border-radius:13px}.hero-icon svg{width:22px;height:22px}.board{display:flex;overflow-x:auto;scroll-snap-type:x proximity}.board::-webkit-scrollbar{height:4px}.board::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}.col{flex:0 0 188px;scroll-snap-align:start}.col+.col{border-left:1px solid var(--line2)}}
@container(max-width:430px){.subtitle{max-width:230px}.update{padding:0 8px}.hero{padding:12px}.hero-main{grid-template-columns:42px minmax(0,1fr)}.hero-icon{width:42px;height:42px}.impact{grid-column:2;align-items:flex-start;flex-direction:row}.impact-dots{align-self:center}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.sum-count{font-size:16px}}
</style>
</head>
<body>
<div class="root"><main class="widget" data-widget-control-root data-control-sizes="560,620,680">
<header class="top"><div><div class="title">마켓 이벤트</div><div class="subtitle">한국·미국·일본·유럽 주요 경제 일정을 KST 기준으로 확인해요.</div></div><div class="update" id="updated"><i class="update-dot"></i><span>불러오는 중</span></div></header>
<div id="content"><div class="loading"><div class="load-state"><i></i><span>경제 일정을 불러오는 중...</span></div></div></div>
<footer class="footer"><div class="footer-left" id="source">모든 시간은 한국 시간(KST) 기준입니다.</div><button class="retry" id="retry" hidden>다시 불러오기</button></footer>
</main></div>
<script>
const $=s=>document.querySelector(s);
const icons={
  rate:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 10h16M6 10v8m4-8v8m4-8v8m4-8v8M3 20h18M4 8l8-4 8 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  inflation:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 18V6M4 18h16M7 14l3-4 4 3 3-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  jobs:'<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="9" r="3" stroke="currentColor" stroke-width="1.7"/><circle cx="17" cy="10" r="2.4" stroke="currentColor" stroke-width="1.7"/><path d="M4 18c0-2.4 2.2-4 5-4s5 1.6 5 4M15 17c.5-1.5 2-2.6 4-2.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  growth:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 19V6M5 19h14M8 14l3-4 3 2 3-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  other:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.7"/><path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>'
};
const flags={US:'🇺🇸',KR:'🇰🇷',JP:'🇯🇵',GB:'🇬🇧',DE:'🇩🇪',FR:'🇫🇷',CN:'🇨🇳',EU:'🇪🇺'};
const countryNames={US:'미국',KR:'한국',JP:'일본',GB:'영국',DE:'독일',FR:'프랑스',CN:'중국',EU:'유로존'};
const category={rate:{label:'금리',tone:'red'},inflation:{label:'물가',tone:'yellow'},jobs:{label:'고용',tone:'green'},growth:{label:'경기',tone:'blue'},other:{label:'기타',tone:'blue'}};
const summaryCats=[['rate','금리 결정','통화정책'],['inflation','물가 지표','CPI · PPI'],['jobs','고용 지표','고용 · 실업'],['growth','경기 지표','GDP · 생산']];
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function rel(iso){const d=new Date(iso);if(isNaN(d))return null;const m=Math.max(0,Math.round((Date.now()-d.getTime())/60000));if(m<1)return'방금 전';if(m<60)return`${m}분 전`;const h=Math.floor(m/60);if(h<24)return`${h}시간 전`;return`${Math.floor(h/24)}일 전`}
function valueInfo(e){if(e.actual!==null&&e.actual!==undefined)return`실제 ${esc(e.actual)}`;const a=[];if(e.forecast!==null&&e.forecast!==undefined)a.push(`예상 ${esc(e.forecast)}`);if(e.previous!==null&&e.previous!==undefined)a.push(`이전 ${esc(e.previous)}`);return a.join(' · ')||esc(category[e.category]?.label||'경제지표')}
function impactClass(n){return n>=3?'high':n===2?'medium':'low'}
function impactLabel(n){return n>=3?'높은 영향도':n===2?'중간 영향도':'낮은 영향도'}
function impactDots(n){return [1,2,3].map(i=>`<i class="${i<=Math.max(1,Math.min(3,n||1))?'on':''}"></i>`).join('')}
function eventHtml(e,hidden=false){const c=category[e.category]||category.other;return `<div class="event" ${hidden?'hidden':''}><div class="time">${esc(e.time_kst||'—')}</div><div class="event-main"><div class="event-title"><span class="country">${flags[e.country]||''} ${esc(countryNames[e.country]||e.country||'')}</span>${esc(e.title_ko||e.title||'')}</div><div class="event-info">${valueInfo(e)}</div><div class="tag-row"><span class="tag ${c.tone}">${c.label}</span>${Number(e.importance)>=3?'<span class="tag red">중요</span>':''}</div></div></div>`}
function renderColumn(key,title,items){const visible=items.slice(0,4),rest=items.slice(4);return `<section class="col"><div class="col-head"><div class="col-title">${title}</div><div class="col-count">${items.length}개</div></div><div class="list">${visible.map(x=>eventHtml(x)).join('')}${rest.map(x=>eventHtml(x,true)).join('')||(!items.length?'<div class="empty">예정 이벤트 없음</div>':'')}</div><button class="more" ${rest.length?'':'hidden'}>더 보기</button></section>`}
function render(d){const events=Array.isArray(d.events)?d.events:[],h=d.highlight||events[0];if(!h){renderError('표시할 경제 일정이 없습니다.');return}const hc=category[h.category]||category.other;const sums=summaryCats.map(([k,title,sub])=>{const arr=events.filter(e=>e.category===k),max=Math.max(0,...arr.map(e=>Number(e.importance)||0)),tone=category[k]?.tone||'blue';return `<div class="sum"><div class="sum-top"><i class="sum-dot" style="background:var(--${tone})"></i><div class="sum-title">${title}</div></div><div class="sum-count">${arr.length}</div><div class="sum-sub">${max>=3?'고영향 포함':sub}</div></div>`}).join('');const heroCountry=countryNames[h.country]||h.country||'';const heroTitle=`${heroCountry?heroCountry+' ':''}${h.title_ko||h.title||'주요 이벤트'}`;content.innerHTML=`<section class="hero"><div class="hero-label"><i></i><span>핵심 이벤트</span></div><div class="hero-main"><div class="hero-icon">${icons[h.category]||icons.other}</div><div class="hero-copy"><div class="hero-title">${esc(heroTitle)}</div><div class="hero-meta"><span class="meta-chip">${flags[h.country]||''} ${esc(heroCountry)}</span><span class="meta-chip">${esc(h.date_kst||'—')}</span><span class="meta-chip">${esc(h.time_kst||'—')}</span></div><div class="hero-desc">${esc(h.comment_ko||'시장에 영향을 줄 수 있는 주요 경제 일정입니다.')}</div></div><div class="impact"><span class="impact-pill ${impactClass(Number(h.importance)||1)}">${impactLabel(Number(h.importance)||1)}</span><span class="impact-dots">${impactDots(Number(h.importance)||1)}</span></div></div></section><section class="summary">${sums}</section><section class="board">${renderColumn('today','오늘',events.filter(e=>e.bucket==='today'))}${renderColumn('week','이번 주',events.filter(e=>e.bucket==='week'))}${renderColumn('later','이후',events.filter(e=>e.bucket==='later'))}</section>`;document.querySelectorAll('.more').forEach(btn=>btn.onclick=()=>{const col=btn.closest('.col'),extra=[...col.querySelectorAll('.event')].slice(4),open=extra.some(x=>x.hidden);extra.forEach(x=>x.hidden=!open);btn.textContent=open?'접기':'더 보기'});updated.className='update'+(d.stale?' stale':'');updated.querySelector('span').textContent=d.stale?'업데이트 지연':`업데이트 ${rel(d.generated_at)||d.updated_label||'완료'}`;source.textContent=`${d.source||'경제 캘린더'} · 모든 시간 KST`;retry.hidden=!d.stale}
function renderError(msg){content.innerHTML=`<div class="loading">${esc(msg)}</div>`;updated.className='update error';updated.querySelector('span').textContent='불러오기 실패';retry.hidden=false}
async function load(){updated.className='update';updated.querySelector('span').textContent='불러오는 중';retry.hidden=true;try{const r=await fetch('./market-events-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();render(await r.json())}catch{renderError('경제 일정을 불러오지 못했습니다.')}}
retry.onclick=load;load();
</script>
<script src="./assets/life-town-controls-v2.js"></script>
</body>
</html>
