<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>주택 예산 · Life Town v2</title><link rel="stylesheet" href="./assets/life-town-v2.css"><style>
:root{--panel:#fff;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--line:#e5e5e8;--line2:#f0f0f2;--soft:#f7f7f8;--blue:#007aff;--green:#34c759;--yellow:#ffcc00;--yellow-ink:#8d7000;--red:#ff3b30;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}html[data-lt-theme="dark"]{--panel:#1c1c1e;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--line:#38383a;--line2:#2c2c2e;--soft:#2c2c2e;--blue:#0a84ff;--green:#30d158;--yellow:#ffd60a;--yellow-ink:#ffd60a;--red:#ff453a;--shadow:none}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}.root{width:100%;max-width:720px;margin:auto;container-type:inline-size}.widget{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:15px 15px 12px;box-shadow:var(--shadow);overflow:hidden}.widget:before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:linear-gradient(90deg,transparent,#b8b8bd 22%,#f5f5f7 50%,#b8b8bd 78%,transparent);opacity:.52}.header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.title{font-size:18px;font-weight:760;letter-spacing:-.04em}.sub{margin-top:4px;font-size:10px;color:var(--muted)}.note{font-size:8.8px;color:var(--muted);white-space:nowrap;margin-top:2px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.control{--accent:var(--blue);position:relative;border:1px solid var(--line);border-radius:16px;padding:11px 11px 10px;overflow:hidden}.control:nth-child(1){--accent:var(--green)}.control:nth-child(2){--accent:var(--blue)}.control:nth-child(3){--accent:var(--yellow)}.control:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:999px;background:var(--accent)}.label{font-size:9.2px;font-weight:700;color:var(--sub);padding-left:7px}.value{margin-top:6px;font-size:17px;font-weight:760;letter-spacing:-.035em;white-space:nowrap;padding-left:7px}.track{position:relative;height:18px;margin-top:8px}.track input{position:absolute;inset:0;width:100%;height:18px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer}.track input::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:linear-gradient(90deg,var(--accent) 0 var(--fill),var(--line) var(--fill) 100%)}.track input::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);margin-top:-5.5px}.track input::-moz-range-track{height:4px;background:var(--line);border-radius:999px}.track input::-moz-range-progress{height:4px;background:var(--accent)}.track input::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}.ends{display:flex;justify-content:space-between;margin-top:2px;font-size:8.5px;color:var(--muted)}.main{display:grid;grid-template-columns:190px minmax(0,1fr);gap:9px;margin-top:9px}.panel{border:1px solid var(--line);border-radius:16px;background:var(--panel)}.gauge-panel{padding:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.gauge{width:104px;height:104px;border-radius:50%;position:relative;background:conic-gradient(from 220deg,var(--state) 0 calc(var(--pct)*.78%),var(--soft) 0 78%,transparent 78% 100%)}.gauge:after{content:"";position:absolute;inset:18px;border-radius:50%;background:var(--panel)}.house{position:absolute;z-index:2;inset:0;display:grid;place-items:center;color:var(--text)}.house svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.status{margin-top:8px;display:inline-flex;padding:4px 8px;border-radius:999px;background:var(--status-bg);color:var(--state);font-size:9.5px;font-weight:720}.gauge-note{margin-top:5px;font-size:8.8px;color:var(--sub)}.mini{margin-top:5px;font-size:8.8px;color:var(--muted);line-height:1.35}.detail{padding:0 12px}.stat{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2)}.stat:last-child{border-bottom:0}.bullet{width:8px;height:8px;border-radius:50%}.stat:nth-child(1) .bullet{background:var(--green)}.stat:nth-child(2) .bullet{background:var(--blue)}.stat:nth-child(3) .bullet{background:var(--yellow)}.stat-copy b{display:block;font-size:9.8px}.stat-copy span{display:block;margin-top:2px;font-size:8.8px;color:var(--muted)}.stat-value{font-size:13px;font-weight:740;white-space:nowrap}.calc{margin-top:9px;padding:12px}.section-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.section-title{font-size:10px;font-weight:720}.section-hint{font-size:8.8px;color:var(--muted)}.equation{display:grid;grid-template-columns:1fr 16px 1fr 16px 1fr;gap:5px;align-items:center;margin-top:9px}.eq{border:1px solid var(--line);border-radius:14px;padding:9px 8px;text-align:center}.eq:last-child{background:rgba(255,204,0,.08);border-color:rgba(255,204,0,.28)}.eq-label{font-size:8.8px;color:var(--muted)}.eq-value{margin-top:4px;font-size:12px;font-weight:720;white-space:nowrap}.op{text-align:center;color:var(--muted)}.schedule{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}.bar{display:grid;grid-template-columns:10fr 50fr 40fr;height:18px;margin-top:8px;border-radius:8px;overflow:hidden}.seg{display:grid;place-items:center;font-size:8px;font-weight:720;color:#fff}.seg:nth-child(1){background:var(--blue)}.seg:nth-child(2){background:var(--yellow);color:#5c4b00}.seg:nth-child(3){background:var(--green)}.sched{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.sched>div{position:relative;padding-left:9px}.sched>div:before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;border-radius:999px}.sched>div:nth-child(1):before{background:var(--blue)}.sched>div:nth-child(2):before{background:var(--yellow)}.sched>div:nth-child(3):before{background:var(--green)}.sched b{display:block;font-size:9px}.sched strong{display:block;margin-top:4px;font-size:11px}.sched span{display:block;margin-top:2px;font-size:8.5px;color:var(--muted)}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:8.8px;color:var(--muted)}.footer .short{color:var(--red);font-weight:700}@container(max-width:580px){.controls{grid-template-columns:1fr}.main{grid-template-columns:1fr}.equation{grid-template-columns:1fr}.op{display:none}.sched{grid-template-columns:1fr}.note{display:none}.root{max-width:500px}}
</style></head><body><div class="root"><main class="widget" data-widget-control-root data-control-sizes="500,620,720"><header class="header"><div><div class="title">주택 예산</div><div class="sub">보유 현금 · 대출 · 매매가로 필요 자금 계산</div></div><div class="note">예산 시뮬레이션</div></header><section class="controls"><div class="control"><div class="label">보유 현금</div><div class="value" id="cashValue"></div><div class="track"><input id="cash" type="range" min="30000000" max="500000000" step="10000000"></div><div class="ends"><span>3천만</span><span>5억</span></div></div><div class="control"><div class="label">가능 대출</div><div class="value" id="loanValue"></div><div class="track"><input id="loan" type="range" min="50000000" max="1200000000" step="10000000"></div><div class="ends"><span>5천만</span><span>12억</span></div></div><div class="control"><div class="label">매매가</div><div class="value" id="priceValue"></div><div class="track"><input id="price" type="range" min="100000000" max="1500000000" step="10000000"></div><div class="ends"><span>1억</span><span>15억</span></div></div></section><section class="main"><div class="panel gauge-panel"><div class="gauge" id="gauge"><div class="house"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"></path><path d="M6.5 10.5V20h11V10.5"></path><path d="M10 20v-5h4v5"></path></svg></div></div><div class="status" id="status"></div><div class="gauge-note" id="gaugeNote"></div><div class="mini" id="mini"></div></div><div class="panel detail"><div class="stat"><i class="bullet"></i><div class="stat-copy"><b>보유 현금</b><span>현재 사용 가능한 자기자금</span></div><div class="stat-value" id="cashStat"></div></div><div class="stat"><i class="bullet"></i><div class="stat-copy"><b>가능 대출</b><span>예상 대출 한도</span></div><div class="stat-value" id="loanStat"></div></div><div class="stat"><i class="bullet"></i><div class="stat-copy"><b>최대 예산</b><span>현금 + 대출</span></div><div class="stat-value" id="budgetStat"></div></div></div></section><section class="panel calc"><div class="section-head"><div class="section-title">필요 자금 계산</div><div class="section-hint">매매가 − 대출 = 자기자금</div></div><div class="equation"><div class="eq"><div class="eq-label">매매가</div><div class="eq-value" id="priceEq"></div></div><div class="op">−</div><div class="eq"><div class="eq-label">대출 금액</div><div class="eq-value" id="loanEq"></div></div><div class="op">=</div><div class="eq"><div class="eq-label">필요 자기자금</div><div class="eq-value" id="needEq"></div></div></div><div class="schedule"><div class="section-head"><div class="section-title">매매 대금 일정</div><div class="section-hint">예시 10% · 50% · 40%</div></div><div class="bar"><div class="seg">10%</div><div class="seg">50%</div><div class="seg">40%</div></div><div class="sched"><div><b>계약금</b><strong id="contractAmt"></strong><span>계약 시</span></div><div><b>중도금</b><strong id="middleAmt"></strong><span>중도금 납부 시</span></div><div><b>잔금</b><strong id="balanceAmt"></strong><span>입주·잔금 시</span></div></div></div></section><footer class="footer"><span id="footLeft"></span><span id="asOf"></span></footer></main></div><script>
const KEY='lifeTownHomeBudget.v2',ids=['cash','loan','price'];const defaults={cash:120000000,loan:380000000,price:500000000};let state={...defaults};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{};const $=id=>document.getElementById(id),won=n=>'₩'+Math.round(n).toLocaleString('ko-KR');ids.forEach(id=>{$(id).value=state[id];$(id).addEventListener('input',()=>{state[id]=+$(id).value;localStorage.setItem(KEY,JSON.stringify(state));render()})});function fill(el){const n=+el.value,min=+el.min,max=+el.max;el.style.setProperty('--fill',`${((n-min)/(max-min))*100}%`)}function render(){const {cash,loan,price}=state,budget=cash+loan,need=Math.max(0,price-loan),left=cash-need,ltv=price?loan/price*100:0,use=budget?price/budget*100:0,ok=left>=0;ids.forEach(id=>fill($(id)));$('cashValue').textContent=won(cash);$('loanValue').textContent=won(loan);$('priceValue').textContent=won(price);$('cashStat').textContent=won(cash);$('loanStat').textContent=won(loan);$('budgetStat').textContent=won(budget);$('priceEq').textContent=won(price);$('loanEq').textContent=won(loan);$('needEq').textContent=won(need);$('contractAmt').textContent=won(price*.1);$('middleAmt').textContent=won(price*.5);$('balanceAmt').textContent=won(price*.4);const gauge=$('gauge');gauge.style.setProperty('--pct',Math.min(100,use));gauge.style.setProperty('--state',ok?'var(--green)':'var(--red)');gauge.style.setProperty('--status-bg',ok?'rgba(52,199,89,.09)':'rgba(255,59,48,.08)');$('status').style.setProperty('--state',ok?'var(--green)':'var(--red)');$('status').style.setProperty('--status-bg',ok?'rgba(52,199,89,.09)':'rgba(255,59,48,.08)');$('status').textContent=ok?'구매 가능 범위':'현금 부족';$('gaugeNote').textContent=`예산 사용률 ${Math.round(use)}%`;$('mini').textContent=`현금 ${Math.round(cash/budget*100)}% · 대출 ${Math.round(loan/budget*100)}% · LTV ${Math.round(ltv)}%`;$('footLeft').className=left<0?'short':'';$('footLeft').textContent=left>=0?`예산 내 · 남는 현금 ${won(left)}`:`부족 자기자금 ${won(Math.abs(left))}`;$('asOf').textContent='기준일: '+new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}render();</script><script src="./assets/life-town-controls-v2.js"></script></body></html>
