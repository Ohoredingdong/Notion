<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>주택 예산 · Life Town v2</title><link rel="stylesheet" href="./assets/life-town-v2.css"><style>
:root{--panel:#fff;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--line:#e5e5e8;--line2:#f0f0f2;--soft:#f7f7f8;--blue:#007aff;--green:#34c759;--yellow:#ffcc00;--yellow-ink:#8d7000;--red:#ff3b30;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}html[data-lt-theme="dark"]{--panel:#1c1c1e;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--line:#38383a;--line2:#2c2c2e;--soft:#2c2c2e;--blue:#0a84ff;--green:#30d158;--yellow:#ffd60a;--yellow-ink:#ffd60a;--red:#ff453a;--shadow:none}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}.root{width:100%;max-width:660px;margin:auto;container-type:inline-size}.widget{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:15px 15px 12px;box-shadow:var(--shadow);overflow:hidden}.widget:before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:linear-gradient(90deg,transparent,#b8b8bd 22%,#f5f5f7 50%,#b8b8bd 78%,transparent);opacity:.52}.header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.title{font-size:18px;font-weight:760;letter-spacing:-.04em}.sub{margin-top:4px;font-size:10px;color:var(--muted)}.note{font-size:8.8px;color:var(--muted);white-space:nowrap;margin-top:2px}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.input-card{--accent:var(--blue);position:relative;border:1px solid var(--line);border-radius:16px;padding:11px 11px 10px;background:var(--panel);overflow:hidden}.input-card.cash{--accent:var(--green)}.input-card.loan{--accent:var(--blue)}.input-card.price{--accent:var(--yellow)}.input-card:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:999px;background:var(--accent)}.label{padding-left:7px;font-size:9.2px;font-weight:700;color:var(--sub)}.value{padding-left:7px;margin-top:6px;font-size:17px;font-weight:760;letter-spacing:-.035em;white-space:nowrap}.track{position:relative;height:18px;margin-top:8px}.track input{position:absolute;inset:0;width:100%;height:18px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer}.track input::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:linear-gradient(90deg,var(--accent) 0 var(--fill),var(--line) var(--fill) 100%)}.track input::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--panel);border:2px solid var(--accent);margin-top:-5.5px}.track input::-moz-range-track{height:4px;background:var(--line);border-radius:999px}.track input::-moz-range-progress{height:4px;background:var(--accent)}.track input::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}.ends{display:flex;justify-content:space-between;margin-top:2px;font-size:8.5px;color:var(--muted)}.summary{display:grid;grid-template-columns:1.12fr .94fr .94fr;gap:8px;margin-top:9px}.summary-card{position:relative;border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--panel);min-width:0}.summary-card:before{content:"";position:absolute;left:11px;top:0;width:26px;height:3px;border-radius:999px}.summary-card.status-card:before{background:var(--state)}.summary-card.need-card:before{background:var(--yellow)}.summary-card.ltv-card:before{background:var(--blue)}.summary-label{font-size:8.8px;color:var(--muted)}.summary-value{margin-top:5px;font-size:16px;font-weight:760;letter-spacing:-.035em}.status-value{color:var(--state)}.summary-sub{margin-top:4px;font-size:8.8px;color:var(--sub);line-height:1.35}.calc{margin-top:9px;border:1px solid var(--line);border-radius:16px;padding:12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.section-title{font-size:10px;font-weight:720}.section-hint{font-size:8.8px;color:var(--muted)}.equation{display:grid;grid-template-columns:1fr 16px 1fr 16px 1fr;gap:5px;align-items:center;margin-top:9px}.eq{border:1px solid var(--line);border-radius:14px;padding:9px 8px;text-align:center;background:var(--panel)}.eq.result{background:rgba(255,204,0,.07);border-color:rgba(255,204,0,.24)}.eq-label{font-size:8.8px;color:var(--muted)}.eq-value{margin-top:4px;font-size:12px;font-weight:720;white-space:nowrap}.op{text-align:center;color:var(--muted)}.schedule{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}.sched{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.sched-card{position:relative;border:1px solid var(--line);border-radius:13px;padding:9px 9px 8px}.sched-card:before{content:"";position:absolute;left:9px;right:9px;top:0;height:3px;border-radius:999px}.sched-card:nth-child(1):before{background:var(--blue)}.sched-card:nth-child(2):before{background:var(--yellow)}.sched-card:nth-child(3):before{background:var(--green)}.sched-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.sched-top b{font-size:9px}.pct{font-size:8.8px;color:var(--muted)}.sched-amount{margin-top:5px;font-size:12px;font-weight:730}.sched-note{margin-top:2px;font-size:8.5px;color:var(--muted)}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:8.8px;color:var(--muted)}.footer .short{color:var(--red);font-weight:700}@container(max-width:560px){.root{max-width:500px}.inputs,.summary{grid-template-columns:1fr}.equation{grid-template-columns:1fr}.op{display:none}.sched{grid-template-columns:1fr}.note{display:none}}
</style></head><body><div class="root"><main class="widget" data-widget-control-root data-control-sizes="500,580,660"><header class="header"><div><div class="title">주택 예산</div><div class="sub">보유 현금 · 대출 · 매매가로 실제 필요한 자기자금을 계산합니다.</div></div><div class="note">예산 시뮬레이션</div></header><section class="inputs"><div class="input-card cash"><div class="label">보유 현금</div><div class="value" id="cashValue"></div><div class="track"><input id="cash" type="range" min="30000000" max="500000000" step="10000000"></div><div class="ends"><span>3천만</span><span>5억</span></div></div><div class="input-card loan"><div class="label">가능 대출</div><div class="value" id="loanValue"></div><div class="track"><input id="loan" type="range" min="50000000" max="1200000000" step="10000000"></div><div class="ends"><span>5천만</span><span>12억</span></div></div><div class="input-card price"><div class="label">매매가</div><div class="value" id="priceValue"></div><div class="track"><input id="price" type="range" min="100000000" max="1500000000" step="10000000"></div><div class="ends"><span>1억</span><span>15억</span></div></div></section><section class="summary"><div class="summary-card status-card"><div class="summary-label">예산 상태</div><div class="summary-value status-value" id="status"></div><div class="summary-sub" id="statusSub"></div></div><div class="summary-card need-card"><div class="summary-label">필요 자기자금</div><div class="summary-value" id="needSummary"></div><div class="summary-sub" id="cashRemain"></div></div><div class="summary-card ltv-card"><div class="summary-label">예상 LTV</div><div class="summary-value" id="ltvSummary"></div><div class="summary-sub" id="budgetSummary"></div></div></section><section class="calc"><div class="section-head"><div class="section-title">필요 자금 계산</div><div class="section-hint">매매가 − 대출 = 자기자금</div></div><div class="equation"><div class="eq"><div class="eq-label">매매가</div><div class="eq-value" id="priceEq"></div></div><div class="op">−</div><div class="eq"><div class="eq-label">대출 금액</div><div class="eq-value" id="loanEq"></div></div><div class="op">=</div><div class="eq result"><div class="eq-label">필요 자기자금</div><div class="eq-value" id="needEq"></div></div></div><div class="schedule"><div class="section-head"><div class="section-title">매매 대금 일정</div><div class="section-hint">예시 10% · 50% · 40%</div></div><div class="sched"><div class="sched-card"><div class="sched-top"><b>계약금</b><span class="pct">10%</span></div><div class="sched-amount" id="contractAmt"></div><div class="sched-note">계약 시</div></div><div class="sched-card"><div class="sched-top"><b>중도금</b><span class="pct">50%</span></div><div class="sched-amount" id="middleAmt"></div><div class="sched-note">중도금 납부 시</div></div><div class="sched-card"><div class="sched-top"><b>잔금</b><span class="pct">40%</span></div><div class="sched-amount" id="balanceAmt"></div><div class="sched-note">입주·잔금 시</div></div></div></div></section><footer class="footer"><span id="footLeft"></span><span id="asOf"></span></footer></main></div><script>
const KEY='lifeTownHomeBudget.v2',ids=['cash','loan','price'],defaults={cash:120000000,loan:380000000,price:500000000};let state={...defaults};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{}const $=id=>document.getElementById(id),won=n=>'₩'+Math.round(n).toLocaleString('ko-KR');ids.forEach(id=>{$(id).value=state[id];$(id).addEventListener('input',()=>{state[id]=+$(id).value;localStorage.setItem(KEY,JSON.stringify(state));render()})});function fill(el){const n=+el.value,min=+el.min,max=+el.max;el.style.setProperty('--fill',`${((n-min)/(max-min))*100}%`)}function render(){const {cash,loan,price}=state,budget=cash+loan,need=Math.max(0,price-loan),left=cash-need,ltv=price?loan/price*100:0,use=budget?price/budget*100:0,ok=left>=0;ids.forEach(id=>fill($(id)));$('cashValue').textContent=won(cash);$('loanValue').textContent=won(loan);$('priceValue').textContent=won(price);$('priceEq').textContent=won(price);$('loanEq').textContent=won(loan);$('needEq').textContent=won(need);$('needSummary').textContent=won(need);$('ltvSummary').textContent=`${Math.round(ltv)}%`;$('budgetSummary').textContent=`최대 예산 ${won(budget)}`;$('contractAmt').textContent=won(price*.1);$('middleAmt').textContent=won(price*.5);$('balanceAmt').textContent=won(price*.4);const status=$('status'),card=document.querySelector('.status-card');card.style.setProperty('--state',ok?'var(--green)':'var(--red)');status.style.setProperty('--state',ok?'var(--green)':'var(--red)');status.textContent=ok?'구매 가능 범위':'현금 부족';$('statusSub').textContent=`예산 사용률 ${Math.round(use)}% · 총 예산 ${won(budget)}`;$('cashRemain').textContent=left>=0?`남는 현금 ${won(left)}`:`추가 필요 ${won(Math.abs(left))}`;$('footLeft').className=left<0?'short':'';$('footLeft').textContent=left>=0?`예산 내 · 남는 현금 ${won(left)}`:`부족 자기자금 ${won(Math.abs(left))}`;$('asOf').textContent=`기준일 ${new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit'}).format(new Date())}`}render();
</script><script src="./assets/life-town-controls-v2.js"></script></body></html>
