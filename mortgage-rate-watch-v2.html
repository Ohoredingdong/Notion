<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>주담대 금리</title>
<link rel="stylesheet" href="./assets/life-town-v2.css">
<style>
:root{--bg:#fff;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--line:#e5e5e8;--soft:#f7f7f8;--blue:#007aff;--blue-soft:rgba(0,122,255,.07);--red:#ff3b30;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}
html[data-lt-theme="dark"]{--bg:#1c1c1e;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--line:#38383a;--soft:#2c2c2e;--blue:#0a84ff;--blue-soft:rgba(10,132,255,.13);--red:#ff453a;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px!important;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}.w{width:100%;max-width:330px;margin:auto;border:1px solid var(--line);border-radius:22px;background:var(--bg);overflow:hidden;box-shadow:var(--shadow);container-type:inline-size}.head{padding:13px 13px 11px;border-bottom:1px solid var(--line)}.eyebrow{font-size:8.8px;letter-spacing:.02em;color:var(--muted);font-weight:700}.title{font-size:17px;font-weight:760;letter-spacing:-.04em;margin-top:3px}.sub{font-size:10px;color:var(--muted);margin-top:4px}.badge{display:inline-flex;align-items:center;gap:4px;margin-top:7px;padding:4px 7px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-size:8.8px;font-weight:700}.hero{display:flex;align-items:flex-end;justify-content:space-between;padding:12px 13px;background:var(--soft);border-bottom:1px solid var(--line)}.hero-label{font-size:9.5px;color:var(--sub);font-weight:650}.hero-rate{font-size:26px;font-weight:740;letter-spacing:-.04em}.hero-note{font-size:8.8px;color:var(--muted);text-align:right;line-height:1.4}.rows{padding:0 13px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.name{font-size:11px;font-weight:700;white-space:nowrap}.desc{font-size:8.8px;color:var(--muted);margin-top:2px}.val{font-size:17px;font-weight:720;white-space:nowrap;font-variant-numeric:tabular-nums}.chg{font-size:8.8px;text-align:right;margin-top:2px}.up{color:var(--red)}.foot{display:flex;justify-content:space-between;gap:8px;padding:9px 13px;background:var(--soft);border-top:1px solid var(--line);font-size:8.8px;color:var(--muted)}.foot span:last-child{text-align:right}
@container(max-width:300px){.title{font-size:16px}.hero-rate{font-size:23px}.name{font-size:10.5px}.val{font-size:16px}}
</style>
</head>
<body>
<main class="w" data-widget-control-root data-control-sizes="300,330,360">
<header class="head"><div class="eyebrow">공식 기준금리</div><div class="title">주담대 금리</div><div class="sub">한국은행 기준금리와 COFIX 체크</div><div class="badge">공식 발표 기준 · 실시간 은행 대출금리 아님</div></header>
<section class="hero"><div><div class="hero-label">한국은행 기준금리</div><div class="hero-rate">2.75%</div></div><div class="hero-note">2026.07.16<br>직전 대비 +0.25%p</div></section>
<section class="rows"><div class="row"><div><div class="name">신규취급액 COFIX</div><div class="desc">신규 조달비용 중심 기준</div></div><div><div class="val">3.18%</div><div class="chg up">▲ +0.13%p</div></div></div><div class="row"><div><div class="name">잔액기준 COFIX</div><div class="desc">기존 잔액의 조달비용 반영</div></div><div><div class="val">3.00%</div><div class="chg up">▲ +0.06%p</div></div></div><div class="row"><div><div class="name">신잔액기준 COFIX</div><div class="desc">포괄적 조달비용 반영</div></div><div><div class="val">2.65%</div><div class="chg up">▲ +0.11%p</div></div></div></section>
<footer class="foot"><span>BOK · 은행연합회</span><span>COFIX 기준월 2026.07<br>공시 2026.08.18</span></footer>
</main>
<script src="./assets/life-town-controls-v2.js"></script>
</body>
</html>
