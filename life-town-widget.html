<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Life Town Widget</title><style>:root{--aqua:#6cb3b2;--dark:#4e9697;--cream:#fbf8ec}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:transparent;color:#fff;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}.app{width:100vw;height:100vh;min-height:360px;padding:16px;display:grid;grid-template-rows:minmax(0,1fr) 64px 18px;gap:10px}.scene{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(39,51,57,.18)),radial-gradient(circle at 76% 24%,rgba(190,238,255,.95) 0 9%,transparent 10%),linear-gradient(90deg,transparent 0 61%,rgba(255,244,216,.28) 61% 64%,transparent 64%),linear-gradient(180deg,#b7dbdd 0 37%,#a88668 37% 71%,#6f8d82 71% 100%);background-position:center;background-size:cover}.scene.custom-bg{background-position:center;background-size:cover;background-repeat:no-repeat}.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(13,23,25,.22));pointer-events:none}.rain{position:absolute;inset:0;opacity:0;pointer-events:none;background-image:repeating-linear-gradient(110deg,transparent 0 17px,rgba(223,248,255,.54) 18px 19px,transparent 20px 38px);background-size:58px 58px;animation:rain .7s linear infinite}.scene.is-rain .rain{opacity:.34}@keyframes rain{to{background-position:-58px 58px}}.clock{position:absolute;left:22px;bottom:18px;text-shadow:0 2px 8px rgba(24,35,37,.45)}.date{font-size:clamp(14px,1.55vw,21px);font-weight:750}.time{margin-top:2px;font-size:clamp(15px,1.65vw,22px);font-weight:800}.badge{position:absolute;right:16px;bottom:14px;padding:7px 10px;border-radius:999px;background:rgba(41,61,62,.22);font-size:11px;font-weight:700}.settings{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.42);color:#fff;background:rgba(44,65,66,.22);opacity:.2;cursor:pointer}.scene:hover .settings{opacity:1}.panel{position:absolute;right:14px;top:58px;z-index:5;width:min(360px,calc(100% - 28px));padding:14px;border-radius:18px;background:rgba(251,248,236,.97);color:#465557;opacity:0;pointer-events:none;transform:translateY(-8px);transition:.18s}.panel.open{opacity:1;pointer-events:auto;transform:none}.panel h3{margin:0 0 10px;font-size:14px}.field{display:grid;gap:5px;margin:9px 0}.field label{font-size:11px;font-weight:800}.field input{height:36px;border:1px solid #dadccf;border-radius:10px;padding:0 10px}.actions{display:flex;gap:7px}.actions button{flex:1;height:34px;border:0;border-radius:10px;font-weight:800}.save{background:var(--aqua);color:white}.reset{background:#ece9de;color:#687071}.hint{font-size:10px;line-height:1.45;color:#858f90;margin-top:8px}.controls{display:flex;align-items:center;gap:10px;border-radius:24px;background:var(--aqua);padding:9px 14px}.round{width:36px;height:36px;flex:0 0 auto;border-radius:50%;border:3px solid rgba(255,255,255,.94);background:transparent;color:white;font-weight:900;font-size:16px;cursor:pointer}.round.active{background:white;color:var(--dark)}.status{min-width:0;flex:1;font-size:clamp(12px,1.25vw,17px);font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timer{display:none;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12px;font-weight:800}.timer.show{display:block}.vol{display:flex;align-items:center;gap:8px;flex:0 0 min(22vw,245px)}input[type=range]{appearance:none;width:100%;height:6px;border-radius:999px;outline:0}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:4px;background:var(--aqua);border:3px solid white}.foot{border-radius:999px;background:var(--cream);display:grid;place-items:center}.foot:after{content:"";width:min(46%,560px);height:7px;border-radius:999px;background:#ded8c9}@media(max-width:680px){.app{padding:10px;grid-template-rows:minmax(0,1fr) 56px 14px;gap:7px}.scene{border-radius:20px}.controls{gap:7px;padding:8px 10px}.round{width:31px;height:31px;border-width:2px}.vol{flex-basis:100px}}</style></head><body><main class="app"><section class="scene" id="scene"><div class="rain"></div><button class="settings" id="settingsBtn">⚙</button><div class="panel" id="panel"><h3>Life Town 설정</h3><div class="field"><label>배경 이미지 URL</label><input id="bgUrl" type="url" placeholder="https://...jpg 또는 ...gif"></div><div class="field"><label>상태 문구</label><input id="customText" maxlength="60"></div><div class="actions"><button class="save" id="saveBtn">저장</button><button class="reset" id="resetBtn">초기화</button></div><div class="hint">BGM은 ▶ 버튼을 직접 눌러 시작해요.</div></div><div class="clock"><div class="date" id="dateText"></div><div class="time" id="timeText"></div></div><div class="badge" id="tempBadge">Life Town</div></section><section class="controls"><button class="round" id="timerBtn">◷</button><button class="round" id="playBtn">▶</button><button class="round" id="refreshBtn">↻</button><button class="round" id="weatherBtn">☁</button><div class="status" id="statusText">Life Town에 오신 걸 환영해요.</div><div class="timer" id="timerChip">25:00</div><div class="vol"><span>▰</span><input id="volume" type="range" min="0" max="100" value="72"></div></section><div class="foot"></div></main><script>const $=id=>document.getElementById(id),scene=$('scene'),statusText=$('statusText'),tempBadge=$('tempBadge'),volume=$('volume'),STORE='lifeTownWidget.v1';let settings={bgUrl:'',customText:''},weatherMessage='오늘의 날씨를 불러오는 중…',timerSeconds=1500,timerInterval=null;let ctx=null,master=null,bus=null,noise=null,schedulerId=null,isPlaying=false,nextTime=0,bar=0;function load(){try{settings={...settings,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch(e){}$('bgUrl').value=settings.bgUrl||'';$('customText').value=settings.customText||'';apply()}function apply(){if(settings.bgUrl){scene.classList.add('custom-bg');scene.style.backgroundImage=`linear-gradient(180deg,rgba(255,255,255,.03),rgba(20,31,34,.22)),url("${settings.bgUrl}")`}else{scene.classList.remove('custom-bg');scene.style.backgroundImage=''}statusText.textContent=settings.customText||weatherMessage}function panel(force){const p=$('panel'),open=typeof force==='boolean'?force:!p.classList.contains('open');p.classList.toggle('open',open)}function clock(){const n=new Date(),h=n.getHours();$('dateText').textContent=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(n);$('timeText').textContent=`${h<12?'오전':'오후'} ${h%12||12}:${String(n.getMinutes()).padStart(2,'0')}`}function label(c,p){if(p>0||(c>=51&&c<=67)||(c>=80&&c<=82))return['🌧','비가 내리기 시작했다…','rain'];if(c>=71&&c<=77)return['❄️','눈이 소복소복 내리고 있어요.','snow'];if(c===0)return['☀️','햇살이 맑게 들어오는 날이에요.','clear'];return['☁️','구름이 천천히 흘러가는 날이에요.','cloud']}async function weather(geo=false){statusText.textContent='날씨를 확인하는 중…';let lat=37.5665,lon=126.9780;if(geo&&navigator.geolocation)try{const p=await new Promise((r,j)=>navigator.geolocation.getCurrentPosition(r,j,{timeout:7000}));lat=p.coords.latitude;lon=p.coords.longitude}catch(e){}try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,weather_code&timezone=auto`),d=await r.json(),c=d.current||{},[i,m,k]=label(Number(c.weather_code||0),Number(c.precipitation||0));weatherMessage=m;tempBadge.textContent=`${i} ${Math.round(Number(c.temperature_2m||0))}°C`;scene.classList.toggle('is-rain',k==='rain');statusText.textContent=settings.customText||weatherMessage}catch(e){weatherMessage='날씨 연결이 잠시 쉬고 있어요.';statusText.textContent=settings.customText||weatherMessage}}function timer(){const b=$('timerBtn'),chip=$('timerChip');if(timerInterval){clearInterval(timerInterval);timerInterval=null;timerSeconds=1500;b.classList.remove('active');chip.classList.remove('show');statusText.textContent=settings.customText||weatherMessage;return}b.classList.add('active');chip.classList.add('show');statusText.textContent='25분 집중 모드가 시작됐어요.';timerInterval=setInterval(()=>{timerSeconds--;chip.textContent=`${String(Math.floor(timerSeconds/60)).padStart(2,'0')}:${String(timerSeconds%60).padStart(2,'0')}`;if(timerSeconds<=0){clearInterval(timerInterval);timerInterval=null;b.classList.remove('active');statusText.textContent='집중 시간이 끝났어요.'}},1000)}const N={C3:130.81,E3:164.81,F3:174.61,G3:196,A3:220,B3:246.94,C4:261.63,D4:293.66,E4:329.63,G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,G5:783.99},CH=[['C3','E3','G3'],['A3','C4','E4'],['F3','A3','C4'],['G3','B3','D4']],ME=['E5','G5','E5','D5','C5','E5','D5','G4','A4','C5','E5','D5','G4','B4','D5','G5'];function tone(f,t,d,l=.1,type='sine'){const o=ctx.createOscillator(),g=ctx.createGain(),fil=ctx.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(f,t);fil.type='lowpass';fil.frequency.value=2200;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(l,t+.02);g.gain.setValueAtTime(l,t+Math.max(.04,d-.28));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(fil).connect(g).connect(bus);o.start(t);o.stop(t+d+.04)}function schedBar(t,i){const beat=.52,ch=CH[i%4];ch.forEach((n,j)=>tone(N[n],t,1.92,.045-j*.005));tone(N[ch[0]]/2,t,.85,.065,'triangle');tone(N[ch[0]]/2,t+1.04,.8,.05,'triangle');tone(N[ME[i%16]],t+.26,.55,.14);if(i%2)tone(N[i%4===1?'C5':'B4'],t+1.35,.42,.075)}function schedule(){if(!isPlaying)return;while(nextTime<ctx.currentTime+.35){schedBar(nextTime,bar++);nextTime+=2.08}}async function play(){try{if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();bus=ctx.createGain();bus.connect(master);master.connect(ctx.destination)}await ctx.resume();master.gain.setValueAtTime(Math.max(.08,Number(volume.value)/100*.7),ctx.currentTime);noise=ctx.createBufferSource();const len=ctx.sampleRate*2,b=ctx.createBuffer(1,len,ctx.sampleRate),data=b.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*.12;noise.buffer=b;noise.loop=true;const f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='lowpass';f.frequency.value=550;g.gain.value=.025;noise.connect(f).connect(g).connect(bus);noise.start();isPlaying=true;bar=0;nextTime=ctx.currentTime+.06;schedule();schedulerId=setInterval(schedule,100);$('playBtn').textContent='Ⅱ';$('playBtn').classList.add('active');statusText.textContent='포근한 Life Town BGM이 재생 중이에요.'}catch(e){statusText.textContent='소리가 차단됐어요. 페이지를 클릭한 뒤 ▶를 다시 눌러주세요.'}}function stop(){if(schedulerId)clearInterval(schedulerId);schedulerId=null;try{noise&&noise.stop()}catch(e){}noise=null;isPlaying=false;$('playBtn').textContent='▶';$('playBtn').classList.remove('active');statusText.textContent=settings.customText||weatherMessage}function vol(){const v=Number(volume.value);volume.style.background=`linear-gradient(90deg,#fff 0 ${v}%,rgba(255,255,255,.35) ${v}% 100%)`;if(master&&ctx)master.gain.setTargetAtTime(v/100*.7,ctx.currentTime,.03)}$('settingsBtn').onclick=()=>panel();$('saveBtn').onclick=()=>{settings.bgUrl=$('bgUrl').value.trim();settings.customText=$('customText').value.trim();localStorage.setItem(STORE,JSON.stringify(settings));apply();panel(false)};$('resetBtn').onclick=()=>{settings={bgUrl:'',customText:''};localStorage.removeItem(STORE);$('bgUrl').value='';$('customText').value='';apply();panel(false)};$('timerBtn').onclick=timer;$('playBtn').onclick=()=>isPlaying?stop():play();$('refreshBtn').onclick=()=>weather(false);$('weatherBtn').onclick=()=>weather(true);volume.oninput=vol;load();clock();setInterval(clock,1000);vol();weather(false);</script></body></html>
