<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light only" />
  <title>Life Town Widget</title>
  <style>
    :root{
      --aqua:#6cb3b2;
      --aqua-dark:#4e9697;
      --cream:#fbf8ec;
      --ink:#fff;
      --shadow:0 18px 50px rgba(48,55,58,.12);
      --radius:28px;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{
      overflow:hidden;
      background:transparent;
      color:var(--ink);
      font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button,input{font:inherit}
    button{border:0;cursor:pointer}
    .app{
      width:100vw;
      height:100vh;
      min-height:360px;
      padding:16px;
      display:grid;
      grid-template-rows:minmax(0,1fr) 64px 18px;
      gap:10px;
    }
    .scene{
      position:relative;
      min-height:0;
      overflow:hidden;
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      isolation:isolate;
      background:
        linear-gradient(180deg,rgba(255,255,255,.06),rgba(39,51,57,.18)),
        radial-gradient(circle at 76% 24%,rgba(190,238,255,.95) 0 9%,transparent 10%),
        linear-gradient(90deg,transparent 0 61%,rgba(255,244,216,.28) 61% 64%,transparent 64%),
        linear-gradient(180deg,#b7dbdd 0 37%,#a88668 37% 71%,#6f8d82 71% 100%);
      background-position:center;
      background-size:cover;
    }
    .scene.custom-bg{
      background-position:center;
      background-size:cover;
      background-repeat:no-repeat;
    }
    .scene::before{
      content:"";
      position:absolute;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(circle at 22% 78%,rgba(255,211,113,.26),transparent 24%),
        linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(13,23,25,.22));
    }
    .scene::after{
      content:"";
      position:absolute;inset:-30%;z-index:1;pointer-events:none;opacity:.18;
      background-image:radial-gradient(rgba(255,255,255,.9) 0 1px,transparent 1.3px);
      background-size:5px 5px;
      mix-blend-mode:soft-light;
      animation:grain 8s steps(6) infinite;
    }
    @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}100%{transform:translate(0,0)}}
    .rain{
      position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:.35s;
      background-image:repeating-linear-gradient(110deg,transparent 0 17px,rgba(223,248,255,.54) 18px 19px,transparent 20px 38px);
      background-size:58px 58px;
      animation:rain .7s linear infinite;
    }
    .scene.is-rain .rain{opacity:.34}
    @keyframes rain{to{background-position:-58px 58px}}
    .clock{
      position:absolute;left:22px;bottom:18px;z-index:4;
      text-shadow:0 2px 8px rgba(24,35,37,.45);
      letter-spacing:-.02em;
    }
    .date{font-size:clamp(14px,1.55vw,21px);font-weight:750;line-height:1.35}
    .time{margin-top:2px;font-size:clamp(15px,1.65vw,22px);font-weight:800}
    .micro-badge{
      position:absolute;right:16px;bottom:14px;z-index:4;
      padding:7px 10px;border-radius:999px;
      color:rgba(255,255,255,.86);font-size:11px;font-weight:700;
      background:rgba(41,61,62,.22);backdrop-filter:blur(8px);
      opacity:.75;
    }
    .settings-btn{
      position:absolute;right:14px;top:14px;z-index:6;
      width:36px;height:36px;border-radius:50%;
      display:grid;place-items:center;
      color:white;background:rgba(44,65,66,.22);
      border:1px solid rgba(255,255,255,.42);
      backdrop-filter:blur(10px);
      opacity:.16;transition:.2s;
    }
    .scene:hover .settings-btn,.settings-btn:focus-visible{opacity:1}
    .controls{
      display:flex;align-items:center;gap:10px;
      border-radius:24px;background:var(--aqua);
      padding:9px 14px;box-shadow:0 10px 30px rgba(55,124,126,.11);
      min-width:0;
    }
    .round{
      flex:0 0 auto;width:36px;height:36px;border-radius:50%;
      display:grid;place-items:center;
      color:white;background:transparent;border:3px solid rgba(255,255,255,.94);
      font-weight:900;font-size:16px;line-height:1;
      transition:.16s transform,.16s background;
    }
    .round:hover{transform:translateY(-1px);background:rgba(255,255,255,.12)}
    .round:active{transform:translateY(0) scale(.96)}
    .round.active{background:white;color:var(--aqua-dark)}
    .status{
      min-width:0;flex:1;
      padding-left:4px;
      font-size:clamp(12px,1.25vw,17px);font-weight:720;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      text-shadow:0 1px 2px rgba(55,105,107,.18);
    }
    .timer-chip{
      display:none;flex:0 0 auto;
      padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.18);
      font-size:12px;font-weight:800;letter-spacing:.02em;
    }
    .timer-chip.show{display:block}
    .volume-wrap{display:flex;align-items:center;gap:8px;flex:0 0 min(22vw,245px)}
    .volume-icon{font-size:16px;opacity:.95}
    input[type="range"]{
      appearance:none;-webkit-appearance:none;width:100%;height:6px;border-radius:999px;
      background:linear-gradient(90deg,#fff 0 60%,rgba(255,255,255,.35) 60% 100%);
      outline:none;
    }
    input[type="range"]::-webkit-slider-thumb{
      -webkit-appearance:none;width:20px;height:20px;border-radius:4px;
      background:var(--aqua);border:3px solid white;box-shadow:0 1px 4px rgba(0,0,0,.15)
    }
    input[type="range"]::-moz-range-thumb{
      width:15px;height:15px;border-radius:4px;background:var(--aqua);border:3px solid white
    }
    .footer-line{border-radius:999px;background:var(--cream);display:grid;place-items:center;overflow:hidden}
    .footer-line::after{content:"";display:block;width:min(46%,560px);height:7px;border-radius:999px;background:#ded8c9}
    .panel{
      position:absolute;right:14px;top:58px;z-index:10;width:min(360px,calc(100% - 28px));
      padding:14px;border-radius:18px;background:rgba(251,248,236,.96);color:#465557;
      box-shadow:0 16px 50px rgba(20,32,36,.24);backdrop-filter:blur(18px);
      opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:.18s;
    }
    .panel.open{opacity:1;transform:none;pointer-events:auto}
    .panel h3{margin:0 0 10px;font-size:14px;color:#35595b}
    .field{display:grid;gap:5px;margin:9px 0}
    .field label{font-size:11px;font-weight:800;color:#6c7a7b}
    .field input{
      width:100%;height:36px;border:1px solid #dadccf;border-radius:10px;padding:0 10px;
      background:white;color:#3f4c4e;outline:none;font-size:12px
    }
    .field input:focus{border-color:#76babb;box-shadow:0 0 0 3px rgba(108,179,178,.15)}
    .panel-actions{display:flex;gap:7px;margin-top:10px}
    .panel-actions button{flex:1;height:34px;border-radius:10px;font-weight:800;font-size:12px}
    .save{background:var(--aqua);color:white}.reset{background:#ece9de;color:#687071}
    .hint{font-size:10px;line-height:1.45;color:#858f90;margin-top:8px}
    @media(max-width:680px){
      .app{padding:10px;grid-template-rows:minmax(0,1fr) 56px 14px;gap:7px}
      .scene{border-radius:20px}.controls{border-radius:18px;padding:8px 10px;gap:7px}
      .round{width:31px;height:31px;border-width:2px;font-size:14px}
      .volume-wrap{flex-basis:100px}.clock{left:15px;bottom:14px}.micro-badge{display:none}
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="scene" id="scene" aria-label="Life Town scene">
      <div class="rain" aria-hidden="true"></div>
      <button class="settings-btn" id="settingsBtn" aria-label="위젯 설정" title="위젯 설정">⚙</button>
      <div class="panel" id="panel" aria-hidden="true">
        <h3>Life Town 설정</h3>
        <div class="field">
          <label for="bgUrl">배경 이미지 URL</label>
          <input id="bgUrl" type="url" placeholder="https://...jpg 또는 ...gif" />
        </div>
        <div class="field">
          <label for="customText">상태 문구 (비워두면 날씨 자동)</label>
          <input id="customText" type="text" maxlength="60" placeholder="오늘도 천천히, 하나씩." />
        </div>
        <div class="panel-actions">
          <button class="save" id="saveBtn">저장</button>
          <button class="reset" id="resetBtn">초기화</button>
        </div>
        <div class="hint">설정은 이 브라우저에만 저장돼요. 이미지 주소를 넣으면 노션에서도 같은 장면을 사용할 수 있어요.</div>
      </div>
      <div class="clock">
        <div class="date" id="dateText">날짜 불러오는 중…</div>
        <div class="time" id="timeText">--:--</div>
      </div>
      <div class="micro-badge" id="tempBadge">Life Town</div>
    </section>

    <section class="controls" aria-label="위젯 컨트롤">
      <button class="round" id="timerBtn" aria-label="25분 타이머" title="25분 타이머">◷</button>
      <button class="round" id="playBtn" aria-label="앰비언스 재생" title="앰비언스 재생">▶</button>
      <button class="round" id="refreshBtn" aria-label="날씨 새로고침" title="날씨 새로고침">↻</button>
      <button class="round" id="weatherBtn" aria-label="현재 위치 날씨" title="현재 위치 날씨">☁</button>
      <div class="status" id="statusText">Life Town에 오신 걸 환영해요.</div>
      <div class="timer-chip" id="timerChip">25:00</div>
      <div class="volume-wrap">
        <span class="volume-icon">▰</span>
        <input id="volume" type="range" min="0" max="100" value="60" aria-label="볼륨" />
      </div>
    </section>
    <div class="footer-line" aria-hidden="true"></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const scene = $('scene');
    const statusText = $('statusText');
    const tempBadge = $('tempBadge');
    const bgUrl = $('bgUrl');
    const customText = $('customText');
    const volume = $('volume');
    const STORE_KEY = 'lifeTownWidget.v1';

    let settings = { bgUrl:'', customText:'' };
    let weatherMessage = '오늘의 날씨를 불러오는 중…';
    let timerSeconds = 25 * 60;
    let timerInterval = null;
    let audioCtx = null;
    let masterGain = null;
    let rainSource = null;
    let ambienceOsc = null;
    let isPlaying = false;

    function loadSettings(){
      try{ settings = { ...settings, ...JSON.parse(localStorage.getItem(STORE_KEY) || '{}') }; }catch(e){}
      bgUrl.value = settings.bgUrl || '';
      customText.value = settings.customText || '';
      applySettings();
    }

    function applySettings(){
      if(settings.bgUrl){
        const safe = settings.bgUrl.replace(/["'()\\]/g, encodeURIComponent);
        scene.classList.add('custom-bg');
        scene.style.backgroundImage = `linear-gradient(180deg,rgba(255,255,255,.03),rgba(20,31,34,.22)),url("${safe}")`;
      }else{
        scene.classList.remove('custom-bg');
        scene.style.backgroundImage = '';
      }
      statusText.textContent = settings.customText || weatherMessage;
    }

    function saveSettings(){
      settings.bgUrl = bgUrl.value.trim();
      settings.customText = customText.value.trim();
      localStorage.setItem(STORE_KEY, JSON.stringify(settings));
      applySettings();
      togglePanel(false);
    }

    function resetSettings(){
      settings = { bgUrl:'', customText:'' };
      localStorage.removeItem(STORE_KEY);
      bgUrl.value='';customText.value='';
      applySettings();
      togglePanel(false);
    }

    function updateClock(){
      const now = new Date();
      const dateParts = new Intl.DateTimeFormat('ko-KR', {year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(now);
      const hour = now.getHours();
      const period = hour < 12 ? '오전' : '오후';
      const hour12 = hour % 12 || 12;
      const minute = String(now.getMinutes()).padStart(2,'0');
      $('dateText').textContent = dateParts;
      $('timeText').textContent = `${period} ${hour12}:${minute}`;
    }

    function weatherLabel(code, precip){
      if(precip > 0 || (code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return ['🌧','비가 내리기 시작했다…','rain'];
      if(code >= 71 && code <= 77) return ['❄️','눈이 소복소복 내리고 있어요.','snow'];
      if(code >= 95) return ['⛈','천둥 소리가 들려요. 실내가 좋겠네요.','storm'];
      if(code === 45 || code === 48) return ['🌫','옅은 안개가 낀 조용한 날이에요.','fog'];
      if(code === 0) return ['☀️','햇살이 맑게 들어오는 날이에요.','clear'];
      if(code >= 1 && code <= 3) return ['☁️','구름이 천천히 흘러가는 날이에요.','cloud'];
      return ['🌤','오늘도 차분한 하루예요.','mild'];
    }

    async function fetchWeather(forceGeo=false){
      statusText.textContent = '날씨를 확인하는 중…';
      let lat = 37.5665, lon = 126.9780;
      if(forceGeo && navigator.geolocation){
        try{
          const pos = await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{timeout:7000,maximumAge:900000}));
          lat = pos.coords.latitude; lon = pos.coords.longitude;
        }catch(e){}
      }
      try{
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,weather_code,is_day&timezone=auto`;
        const res = await fetch(url);
        if(!res.ok) throw new Error('weather');
        const data = await res.json();
        const cur = data.current || {};
        const [icon,msg,kind] = weatherLabel(Number(cur.weather_code||0), Number(cur.precipitation||0));
        weatherMessage = msg;
        tempBadge.textContent = `${icon} ${Math.round(Number(cur.temperature_2m||0))}°C`;
        scene.classList.toggle('is-rain', kind === 'rain' || kind === 'storm');
        statusText.textContent = settings.customText || weatherMessage;
      }catch(e){
        weatherMessage = '날씨 연결이 잠시 쉬고 있어요.';
        tempBadge.textContent = 'Life Town';
        statusText.textContent = settings.customText || weatherMessage;
      }
    }

    function togglePanel(force){
      const panel = $('panel');
      const open = typeof force === 'boolean' ? force : !panel.classList.contains('open');
      panel.classList.toggle('open',open);
      panel.setAttribute('aria-hidden',String(!open));
    }

    function formatTimer(s){
      const m = Math.floor(s/60); const sec = s%60;
      return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    function toggleTimer(){
      const btn = $('timerBtn'), chip = $('timerChip');
      if(timerInterval){
        clearInterval(timerInterval); timerInterval=null;
        btn.classList.remove('active');
        chip.classList.remove('show');
        timerSeconds = 25*60; chip.textContent='25:00';
        statusText.textContent = settings.customText || weatherMessage;
        return;
      }
      btn.classList.add('active'); chip.classList.add('show');
      statusText.textContent = '25분 집중 모드가 시작됐어요.';
      timerInterval = setInterval(()=>{
        timerSeconds--;
        chip.textContent = formatTimer(timerSeconds);
        if(timerSeconds <= 0){
          clearInterval(timerInterval);timerInterval=null;timerSeconds=25*60;
          btn.classList.remove('active');
          chip.textContent='00:00';
          statusText.textContent='집중 시간이 끝났어요. 잠깐 쉬어도 좋아요.';
          setTimeout(()=>chip.classList.remove('show'),5000);
        }
      },1000);
    }

    function makeNoiseBuffer(ctx){
      const length = ctx.sampleRate * 2;
      const buffer = ctx.createBuffer(1,length,ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<length;i++) data[i] = (Math.random()*2-1) * .32;
      return buffer;
    }

    async function startAmbience(){
      if(!audioCtx){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain(); masterGain.gain.value = Number(volume.value)/100 * .22;
        masterGain.connect(audioCtx.destination);
      }
      await audioCtx.resume();
      rainSource = audioCtx.createBufferSource();
      rainSource.buffer = makeNoiseBuffer(audioCtx); rainSource.loop = true;
      const filter = audioCtx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=900;
      const rainGain = audioCtx.createGain(); rainGain.gain.value=.23;
      rainSource.connect(filter).connect(rainGain).connect(masterGain);
      ambienceOsc = audioCtx.createOscillator(); ambienceOsc.type='sine'; ambienceOsc.frequency.value=174;
      const oscGain = audioCtx.createGain(); oscGain.gain.value=.018;
      ambienceOsc.connect(oscGain).connect(masterGain);
      rainSource.start(); ambienceOsc.start();
      isPlaying=true;
      $('playBtn').textContent='Ⅱ'; $('playBtn').classList.add('active');
    }

    function stopAmbience(){
      try{rainSource?.stop();ambienceOsc?.stop();}catch(e){}
      rainSource=null;ambienceOsc=null;isPlaying=false;
      $('playBtn').textContent='▶'; $('playBtn').classList.remove('active');
    }

    async function toggleAmbience(){
      if(isPlaying) stopAmbience(); else await startAmbience();
    }

    function updateVolume(){
      const v = Number(volume.value);
      volume.style.background = `linear-gradient(90deg,#fff 0 ${v}%,rgba(255,255,255,.35) ${v}% 100%)`;
      if(masterGain) masterGain.gain.value = v/100 * .22;
    }

    $('settingsBtn').addEventListener('click',()=>togglePanel());
    $('saveBtn').addEventListener('click',saveSettings);
    $('resetBtn').addEventListener('click',resetSettings);
    $('timerBtn').addEventListener('click',toggleTimer);
    $('playBtn').addEventListener('click',toggleAmbience);
    $('refreshBtn').addEventListener('click',()=>fetchWeather(false));
    $('weatherBtn').addEventListener('click',()=>fetchWeather(true));
    volume.addEventListener('input',updateVolume);
    document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') togglePanel(false); });

    loadSettings();
    updateClock(); setInterval(updateClock,1000);
    updateVolume();
    fetchWeather(false);
  </script>
</body>
</html>
