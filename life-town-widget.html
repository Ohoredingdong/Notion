<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Life Town Widget</title>
<style>
:root{--aqua:#68aeae;--aqua-dark:#4d9192;--cream:#fbf8ec;--white:#fff}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;background:transparent;color:#fff;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}.app{width:100vw;height:100vh;min-height:350px;padding:16px;display:grid;grid-template-rows:minmax(0,1fr) 64px 18px;gap:10px}
.scene{position:relative;min-height:0;overflow:hidden;border-radius:28px;background-image:linear-gradient(180deg,rgba(8,12,24,.02) 0%,rgba(8,12,24,.04) 48%,rgba(8,12,24,.48) 100%),url('./assets/life-town-office.webp');background-size:cover;background-position:center 50%;background-repeat:no-repeat;box-shadow:0 16px 42px rgba(34,38,52,.13);isolation:isolate}
.scene:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(20,22,35,.08),transparent 20% 78%,rgba(20,22,35,.05))}
.rain{position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;background-image:repeating-linear-gradient(110deg,transparent 0 18px,rgba(215,239,255,.4) 19px 20px,transparent 21px 40px);background-size:60px 60px;animation:rain .72s linear infinite;transition:opacity .3s}.scene.is-rain .rain{opacity:.23}@keyframes rain{to{background-position:-60px 60px}}
.clock{position:absolute;left:22px;bottom:18px;z-index:3;text-shadow:0 2px 9px rgba(0,0,0,.72);letter-spacing:-.02em}.date{font-size:clamp(14px,1.5vw,20px);font-weight:760;line-height:1.35}.time{margin-top:2px;font-size:clamp(15px,1.65vw,22px);font-weight:820}
.badge{position:absolute;right:16px;bottom:14px;z-index:3;padding:7px 10px;border-radius:999px;background:rgba(31,36,50,.42);backdrop-filter:blur(8px);font-size:11px;font-weight:750;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.controls{display:flex;align-items:center;gap:10px;border-radius:24px;background:var(--aqua);padding:9px 14px;box-shadow:0 10px 30px rgba(55,124,126,.11);min-width:0}.round{width:36px;height:36px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:transparent;color:#fff;font-weight:900;font-size:16px;line-height:1;cursor:pointer;transition:.16s transform,.16s background,.16s opacity}.round:hover:not(:disabled){transform:translateY(-1px);background:rgba(255,255,255,.11)}.round:active:not(:disabled){transform:scale(.96)}.round.active{background:#fff;color:var(--aqua-dark)}.round:disabled{opacity:.46;cursor:wait;transform:none}
.status{min-width:0;flex:1;padding-left:4px;font-size:clamp(12px,1.25vw,16px);font-weight:730;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(55,105,107,.18)}.timer{display:none;flex:0 0 auto;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12px;font-weight:800}.timer.show{display:block}.vol{display:flex;align-items:center;gap:8px;flex:0 0 min(22vw,245px)}.speaker{font-size:15px;opacity:.95}
input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:6px;border-radius:999px;outline:0;background:linear-gradient(90deg,#fff 0 72%,rgba(255,255,255,.34) 72% 100%)}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:4px;background:var(--aqua);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:4px;background:var(--aqua);border:3px solid #fff}
.foot{border-radius:999px;background:var(--cream);display:grid;place-items:center;overflow:hidden}.foot:after{content:"";display:block;width:min(46%,560px);height:7px;border-radius:999px;background:#ded8c9}
#bgm{display:none}
@media(max-width:680px){.app{padding:10px;grid-template-rows:minmax(0,1fr) 56px 14px;gap:7px}.scene{border-radius:20px}.controls{border-radius:18px;padding:8px 10px;gap:7px}.round{width:31px;height:31px;border-width:2px;font-size:14px}.vol{flex-basis:105px}.clock{left:15px;bottom:14px}.badge{right:12px;bottom:12px}}
</style>
</head>
<body>
<main class="app">
<section class="scene" id="scene" aria-label="Animal Crossing office scene">
<div class="rain" aria-hidden="true"></div>
<div class="clock"><div class="date" id="dateText">날짜 불러오는 중…</div><div class="time" id="timeText">--:--</div></div>
<div class="badge" id="tempBadge">Life Town</div>
</section>
<section class="controls" aria-label="위젯 컨트롤">
<button class="round" id="timerBtn" title="25분 타이머" aria-label="25분 타이머">◷</button>
<button class="round" id="playBtn" title="ASMR 준비 중" aria-label="ASMR 준비 중" disabled>…</button>
<button class="round" id="refreshBtn" title="서울 날씨 새로고침" aria-label="날씨 새로고침">↻</button>
<button class="round" id="weatherBtn" title="현재 위치 날씨" aria-label="현재 위치 날씨">☁</button>
<div class="status" id="statusText">사무실에서 조용히 일하는 시간이에요.</div>
<div class="timer" id="timerChip">25:00</div>
<div class="vol"><span class="speaker">▰</span><input id="volume" type="range" min="0" max="100" value="72" aria-label="볼륨"></div>
</section>
<div class="foot" aria-hidden="true"></div>
</main>
<audio id="bgm" loop preload="auto" playsinline></audio>
<script>
const $=id=>document.getElementById(id),scene=$('scene'),statusText=$('statusText'),tempBadge=$('tempBadge'),volume=$('volume'),playBtn=$('playBtn'),bgm=$('bgm');
let weatherMessage='오늘의 날씨를 불러오는 중…',timerSeconds=1500,timerInterval=null,isPlaying=false,audioUrl='';
function updateClock(){const n=new Date(),h=n.getHours();$('dateText').textContent=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(n);$('timeText').textContent=`${h<12?'오전':'오후'} ${h%12||12}:${String(n.getMinutes()).padStart(2,'0')}`}
function weatherLabel(code,precip){if(precip>0||(code>=51&&code<=67)||(code>=80&&code<=82))return['🌧','비가 내리는 조용한 날이에요.','rain'];if(code>=71&&code<=77)return['❄️','눈이 소복소복 내리고 있어요.','snow'];if(code>=95)return['⛈','천둥이 치는 날이에요.','storm'];if(code===45||code===48)return['🌫','옅은 안개가 낀 날이에요.','fog'];if(code===0)return['☀️','햇살이 맑게 들어오는 날이에요.','clear'];return['☁️','구름이 천천히 흘러가는 날이에요.','cloud']}
async function fetchWeather(useGeo=false){statusText.textContent='날씨를 확인하는 중…';let lat=37.5665,lon=126.9780;if(useGeo&&navigator.geolocation){try{const p=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{timeout:7000,maximumAge:900000}));lat=p.coords.latitude;lon=p.coords.longitude}catch(e){}}try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,weather_code&timezone=auto`);if(!r.ok)throw new Error('weather');const d=await r.json(),c=d.current||{},[icon,msg,kind]=weatherLabel(Number(c.weather_code||0),Number(c.precipitation||0));weatherMessage=msg;tempBadge.textContent=`${icon} ${Math.round(Number(c.temperature_2m||0))}°C`;scene.classList.toggle('is-rain',kind==='rain'||kind==='storm');if(!isPlaying&&!timerInterval)statusText.textContent=weatherMessage}catch(e){weatherMessage='사무실에서 조용히 일하는 시간이에요.';tempBadge.textContent='Life Town';if(!isPlaying&&!timerInterval)statusText.textContent=weatherMessage}}
function toggleTimer(){const btn=$('timerBtn'),chip=$('timerChip');if(timerInterval){clearInterval(timerInterval);timerInterval=null;timerSeconds=1500;btn.classList.remove('active');chip.classList.remove('show');chip.textContent='25:00';statusText.textContent=isPlaying?'고양이 사무실 ASMR을 재생 중이에요.':weatherMessage;return}btn.classList.add('active');chip.classList.add('show');statusText.textContent='25분 집중 모드가 시작됐어요.';timerInterval=setInterval(()=>{timerSeconds--;chip.textContent=`${String(Math.floor(timerSeconds/60)).padStart(2,'0')}:${String(timerSeconds%60).padStart(2,'0')}`;if(timerSeconds<=0){clearInterval(timerInterval);timerInterval=null;timerSeconds=1500;btn.classList.remove('active');chip.textContent='00:00';statusText.textContent='집중 시간이 끝났어요. 잠깐 쉬어도 좋아요.';setTimeout(()=>chip.classList.remove('show'),5000)}},1000)}
async function prepareAudio(){try{const r=await fetch('./assets/asmr-loop.txt',{cache:'force-cache'});if(!r.ok)throw new Error('audio');const b64=(await r.text()).trim(),bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const blob=new Blob([bytes],{type:'audio/webm; codecs=opus'});audioUrl=URL.createObjectURL(blob);bgm.src=audioUrl;bgm.volume=Number(volume.value)/100;bgm.load();playBtn.disabled=false;playBtn.textContent='▶';playBtn.title='고양이 사무실 ASMR 재생/일시정지';playBtn.setAttribute('aria-label','ASMR 재생')}catch(e){playBtn.textContent='!';statusText.textContent='오디오를 준비하지 못했어요. 새로고침해 주세요.'}}
async function startMusic(){try{bgm.volume=Number(volume.value)/100;await bgm.play();isPlaying=true;playBtn.textContent='Ⅱ';playBtn.classList.add('active');if(!timerInterval)statusText.textContent='고양이 사무실 ASMR을 재생 중이에요.'}catch(e){isPlaying=false;playBtn.textContent='▶';playBtn.classList.remove('active');statusText.textContent='재생이 잠시 막혔어요. ▶ 버튼을 한 번 더 눌러주세요.'}}
function stopMusic(){bgm.pause();isPlaying=false;playBtn.textContent='▶';playBtn.classList.remove('active');if(!timerInterval)statusText.textContent=weatherMessage}
function toggleMusic(){isPlaying?stopMusic():startMusic()}
function updateVolume(){const v=Number(volume.value);volume.style.background=`linear-gradient(90deg,#fff 0 ${v}%,rgba(255,255,255,.34) ${v}% 100%)`;bgm.volume=v/100}
bgm.addEventListener('play',()=>{isPlaying=true});bgm.addEventListener('pause',()=>{if(!bgm.ended)isPlaying=false});bgm.addEventListener('error',()=>{isPlaying=false;playBtn.textContent='▶';playBtn.classList.remove('active');statusText.textContent='오디오 재생 오류가 났어요. 새로고침해 주세요.'});
$('timerBtn').addEventListener('click',toggleTimer);playBtn.addEventListener('click',toggleMusic);$('refreshBtn').addEventListener('click',()=>fetchWeather(false));$('weatherBtn').addEventListener('click',()=>fetchWeather(true));volume.addEventListener('input',updateVolume);
updateClock();setInterval(updateClock,1000);updateVolume();fetchWeather(false);prepareAudio();
window.addEventListener('beforeunload',()=>{if(audioUrl)URL.revokeObjectURL(audioUrl)});
</script>
</body>
</html>
