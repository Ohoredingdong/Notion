<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5eee3">
<title>한끼의 부엌 · 미니어처 시안</title>
<!-- Source template. Generate the two self-contained previews with the builder. -->
<link rel="stylesheet" href="designs/miniature-kitchen/scene.css">
<link rel="stylesheet" href="designs/miniature-kitchen/neutral.css">
<link rel="stylesheet" href="designs/miniature-kitchen/journey.css">
<link rel="stylesheet" href="designs/miniature-kitchen/proportions.css">
<script defer src="use-me-first-kitchen-art.js"></script>
<script defer src="designs/miniature-kitchen/catalog.js"></script>
<script defer src="designs/miniature-kitchen/play-model.js"></script>
<script defer src="designs/miniature-kitchen/workflow-model.js"></script>
<script defer src="designs/miniature-kitchen/journey-model.js"></script>
<script defer src="designs/miniature-kitchen/photo-reader.js"></script>
<script defer src="designs/miniature-kitchen/scene.js"></script>
<script defer src="designs/miniature-kitchen/play-ui.js"></script>
<script defer src="designs/miniature-kitchen/workflows.js"></script>
<script defer src="designs/miniature-kitchen/home.js"></script>
</head>
<body data-mode="app" data-camera="fridge" data-home="fridge">
<a class="skip" href="#kitchen">부엌으로 이동</a>
<main class="shell">
  <header class="masthead">
    <div class="brand"><span class="brand-icon" data-icon="fridge" aria-hidden="true"></span><div><h1>한끼의 부엌</h1><p>나의 작은 부엌</p></div></div>
    <div class="header-actions"><button type="button" data-workflow="inventory" aria-label="재료 목록">재료 목록</button></div>
  </header>
  <button class="daily-balance" id="dailyBalance" type="button" data-workflow="nutrition" aria-label="오늘의 균형과 영양 기록"></button>
  <nav class="home-shortcuts" role="tablist" aria-label="부엌 메뉴">
    <button type="button" id="tab-fridge" role="tab" data-home-tab="fridge" aria-controls="panel-fridge" aria-selected="true">냉장고</button>
    <button type="button" id="tab-meals" role="tab" data-home-tab="meals" aria-controls="todayKitchen" aria-selected="false" tabindex="-1">식단</button>
    <button type="button" id="openRecords" role="tab" data-home-tab="records" aria-controls="panel-records" aria-selected="false" tabindex="-1">기록</button>
    <button type="button" id="tab-kitchen" role="tab" data-home-tab="kitchen" aria-controls="panel-kitchen" aria-selected="false" tabindex="-1">내 부엌</button>
  </nav>
  <div id="homeStorageNotice" class="home-storage-notice" hidden></div>
  <section id="panel-fridge" class="home-panel fridge-panel" role="tabpanel" aria-labelledby="tab-fridge">
  <div class="expiry-summary" id="expirySummary" aria-live="polite"></div>

  <div id="fridgeSceneHost"><div class="kitchen-view">
  <section class="room" id="kitchen" aria-label="직접 만지고 꾸미는 미니어처 부엌" tabindex="-1">
    <div class="room-caption"><span class="morning-dot" aria-hidden="true"></span><span id="roomMessage">냉장고 문을 열어, 우리 집 재료를 살펴봐요.</span><button type="button" data-camera="fridge">냉장고로</button></div>
    <div class="scene-world">
    <div class="fridge-stage" aria-label="위 두 칸 냉장 · 아래 두 칸 냉동">
      <div class="cabinet" id="cabinet" aria-hidden="true"></div>
      <div class="fridge-interiors" id="fridgeInteriors"></div>
      <div class="fridge-doors" id="fridgeDoors"></div>
    </div>
    <div class="seasoning-zone drop-zone" data-zone="seasoning" aria-label="양념 선반"></div>
    <div class="counter-zone drop-zone" data-zone="counter" aria-label="조리대"></div>
    </div>
    <div class="fridge-displays" id="fridgeDisplays" role="group" aria-label="냉장고 디스플레이"></div>
    <div class="scene-note" id="sceneNote">재료를 누르면 살펴볼 수 있어요</div>
  </section>
  <aside class="desktop-summary" id="desktopSummary" aria-label="오늘의 요리와 빠른 기능"></aside>
  <div class="kitchen-progress" id="kitchenProgress"><span>우리 집 냉장고</span><small id="selectedItemMeta">재료를 눌러 수량과 기한을 확인해요</small><button type="button" id="openJournal">재료 목록</button></div>
  </div>
  </div>
  <div class="worktop-actions" role="group" aria-label="부엌에서 하기">
    <button type="button" class="action primary" id="addFood"><span data-icon="plus" aria-hidden="true"></span>재료 추가</button>
    <button type="button" class="action" id="recipes"><span data-icon="recipes" aria-hidden="true"></span>요리 찾기</button>
  </div>
  </section>
  <section id="todayKitchen" class="home-panel today-kitchen" role="tabpanel" aria-labelledby="tab-meals" hidden>
    <nav class="panel-tabs" role="tablist" aria-label="식단 보기">
      <button type="button" id="sub-recommendation" role="tab" data-home-subtab="recommendation" aria-controls="homeRecommendation" aria-selected="true">추천 요리</button>
      <button type="button" id="sub-plans" role="tab" data-home-subtab="plans" aria-controls="homePlans" aria-selected="false" tabindex="-1">오늘의 식단</button>
    </nav>
    <section class="home-recommendation home-card" id="homeRecommendation" data-home-page="recommendation" role="tabpanel" aria-labelledby="sub-recommendation"></section>
    <section class="home-plans home-card" id="homePlans" data-home-page="plans" role="tabpanel" aria-labelledby="sub-plans" hidden></section>
  </section>
  <section id="panel-records" class="home-panel" role="tabpanel" aria-labelledby="openRecords" hidden>
    <nav class="panel-tabs" role="tablist" aria-label="기록 보기">
      <button type="button" id="sub-nutrition" role="tab" data-home-subtab="nutrition" aria-controls="homeNutrition" aria-selected="true">영양</button>
      <button type="button" id="sub-budget" role="tab" data-home-subtab="budget" aria-controls="homeBudget" aria-selected="false" tabindex="-1">식비</button>
      <button type="button" id="sub-supplements" role="tab" data-home-subtab="supplements" aria-controls="homeSupplements" aria-selected="false" tabindex="-1">영양제</button>
      <button type="button" id="sub-monthly" role="tab" data-home-subtab="monthly" aria-controls="homeMonthly" aria-selected="false" tabindex="-1">월간</button>
    </nav>
    <section id="homeNutrition" class="home-card" data-home-page="nutrition" role="tabpanel" aria-labelledby="sub-nutrition"></section>
    <section id="homeBudget" class="home-card" data-home-page="budget" role="tabpanel" aria-labelledby="sub-budget" hidden></section>
    <section id="homeSupplements" class="home-card" data-home-page="supplements" role="tabpanel" aria-labelledby="sub-supplements" hidden></section>
    <section id="homeMonthly" class="home-card" data-home-page="monthly" role="tabpanel" aria-labelledby="sub-monthly" hidden></section>
  </section>
  <section id="panel-kitchen" class="home-panel" role="tabpanel" aria-labelledby="tab-kitchen" hidden>
    <nav class="panel-tabs" role="tablist" aria-label="내 부엌 보기">
      <button type="button" id="sub-growth" role="tab" data-home-subtab="growth" aria-controls="homeGrowth" aria-selected="true">목표·도감</button>
      <button type="button" id="sub-decor" role="tab" data-home-subtab="decor" aria-controls="homeDecor" aria-selected="false" tabindex="-1">꾸미기</button>
      <button type="button" id="sub-connections" role="tab" data-home-subtab="connections" aria-controls="homeConnections" aria-selected="false" tabindex="-1">설정·백업</button>
    </nav>
    <section id="homeGrowth" class="home-card" data-home-page="growth" role="tabpanel" aria-labelledby="sub-growth"></section>
    <section id="homeDecor" class="decor-editor" data-home-page="decor" role="tabpanel" aria-labelledby="sub-decor" hidden>
      <header class="decor-heading"><div><h2>내 부엌 꾸미기</h2><p>소품을 골라 놓고, 끌어서 배치해요.</p></div><button type="button" data-decor-done>배치 완료</button></header>
      <div class="decor-actions"><button type="button" id="propList">소품 고르기</button><button type="button" data-workflow="decor">배경·정리함</button><button type="button" data-workflow="rewards">모은 소품</button></div>
      <div id="decorStage"></div>
      <div class="decoration-tools" id="decorationTools" hidden><span>소품을 누르면 앞뒤 순서도 바꿀 수 있어요.</span></div>
    </section>
    <section id="homeConnections" class="home-card" data-home-page="connections" role="tabpanel" aria-labelledby="sub-connections" hidden></section>
    <section id="kitchenMilestone" class="kitchen-milestone" aria-label="내 목표와 요리 도감" hidden></section>
    <div class="scene-tools" hidden><button type="button" id="decorate"><span>꾸미기</span></button></div>
    <div class="design-note" hidden><span>이 시안의 기록 · 저장 상태를 확인하고 있어요.</span></div>
  </section>
  <div class="live-message" id="liveMessage" role="status" aria-live="polite"></div>
</main>
<dialog class="tray" id="tray" aria-labelledby="trayTitle">
  <header class="tray-head"><div><span id="trayEyebrow">MY LITTLE KITCHEN</span><h2 id="trayTitle"></h2></div><button type="button" id="closeTray" aria-label="닫기">×</button></header>
  <div id="trayContent"></div>
</dialog>
</body>
</html>
