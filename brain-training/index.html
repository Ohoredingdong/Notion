/* Study Training / visual refinement v2 — same IA, improved hierarchy and balance */
:root{--bg:#faf8f5;--panel:#fffefd;--ink:#292623;--muted:#6f6864;--line:#ebe5e0;--accent:#d99284;--accentlight:#fff0e9;--good:#619176;--bad:#ca5c62;--side:#fffcfa;--shadow:0 10px 26px rgba(71,57,50,.065)}
body{background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.app{grid-template-columns:176px minmax(0,1fr);grid-template-rows:94px minmax(0,1fr)}
.sidebar{padding:22px 13px 16px;background:#fffcfa;border-right-color:#eae5df}
.study-logo{font-size:16px;letter-spacing:-.7px;padding:8px 7px 27px;font-weight:800;gap:9px}
.study-logo-mark{width:24px;height:24px;font-size:15px;background:#282728}
.side-list{gap:6px}.sidebtn{font-size:14px;min-height:46px;padding:11px 11px;gap:11px;font-weight:650;color:#605852}
.sidebtn .st-icon{width:19px;height:19px;stroke-width:1.8}
.sidebtn.active{background:#f3e9e3;color:#2d2522}
.sidebtn:focus-visible,.course-tile:focus-visible,.trend-start:focus-visible{outline:3px solid #8ba6d4;outline-offset:2px}
.siteheader{height:94px;padding:15px 24px 11px 25px;gap:20px}
.header-greeting{font-size:22px;line-height:1.25;letter-spacing:-.85px;margin-bottom:7px;color:#292523;font-weight:800}
.header-identity p{font-size:12.5px;color:#726c69;line-height:1.35}
.siteheader nav{gap:9px}
.siteheader .navbtn{width:81px;min-height:64px;font-size:12px;font-weight:680;gap:5px;border-radius:14px;border:1px solid #eee8e3;background:#fffdfa;box-shadow:0 5px 13px #4d3b3210;color:#4d4642}
.siteheader .navbtn .st-icon{width:23px;height:23px}
.siteheader .navbtn.active,.siteheader .navbtn:hover{background:#f6eae4;border-color:#efdbd2;color:#8f5e50}
.header-actions{gap:5px}.header-round{width:39px;height:39px}
.main{padding:13px 24px 12px 25px}
.study-dashboard{gap:17px}
.dash-top{grid-template-columns:1.04fr .96fr;gap:17px}
.dash-middle{grid-template-columns:1.05fr repeat(3,1fr);gap:16px}
.dash-bottom{grid-template-columns:1fr 1fr 1fr;gap:16px}
.dash-top>.st-card{height:236px;min-height:236px}
.dash-middle>.st-card,.dash-middle>.course-tile{height:229px}
.dash-bottom>.st-card{height:213px}
.st-card{background:#fffefd;border:1px solid #ebe4df;border-radius:19px;box-shadow:0 9px 26px rgba(82,62,52,.066);padding:18px 20px}
.st-card-header{margin-bottom:12px;gap:9px}
.st-card-header h2{font-size:20px;letter-spacing:-.65px;font-weight:800;color:#2c2725}
.st-card-header h2 .st-icon{color:#c7836e;width:24px;height:24px}
.muted-small{font-size:12px;color:#756c67}.muted-small strong{font-size:14px;color:#312a28}
.st-inline-button{font-size:12px;color:#71635e;padding:6px 4px;font-weight:650}
.routine-panel{padding:19px 21px}
.routine-panel .st-card-header{margin-bottom:10px}
.routine-pill{background:#f8eee9;color:#6c5a54;font-size:12px;padding:6px 12px}
.routine-pill strong{color:#bb7462}
.routine-panel .st-card-header>.st-progress{width:91px;margin-right:0}
.st-progress{height:10px;background:#eee9e6;min-width:28px}
.st-progress>span{background:#dc9685}.st-progress.st-brain>span{background:#93a9e5}.st-progress.st-reading>span{background:#88b6a1}.st-progress.st-review>span{background:#c5afcf}
.routine-row{grid-template-columns:23px 27px minmax(94px,1fr) minmax(72px,1.1fr) 40px 20px;gap:8px;min-height:43px;padding:5px 5px;border-bottom:1px solid #f1ebe7;border-radius:8px}
.routine-row:hover{background:#fbf6f2}
.routine-checkbox{width:20px;height:20px;border-radius:6px;border-color:#cdbfba}
.routine-row.done .routine-checkbox{background:#517f69;border-color:#517f69}
.routine-subject-icon .st-icon{height:23px;width:23px}
.routine-name{font-size:13px;font-weight:740;letter-spacing:-.3px;color:#34302d}
.routine-min{font-size:12px;color:#584e4a}
.routine-status{height:18px;width:18px;background:#df9e8e}
.routine-row .st-progress{height:9px}
.st-math{color:#bd7563}.st-brain{color:#6186d1}.st-reading{color:#4e8f6f}.st-review{color:#aa85b9}
.weekly-panel{padding:19px 20px}.weekly-panel .st-card-header{margin-bottom:8px}
.weekly-content-grid{grid-template-columns:163px minmax(0,1fr);gap:16px;height:165px}
.donut{width:155px;height:155px}
.weekly-rows{gap:13px}.goal-row{gap:10px}
.weekly-icon{width:35px;height:35px;border-radius:11px;background:#fff0e9}
.weekly-icon.st-brain{background:#edf1ff}.weekly-icon.st-reading{background:#edf6ed}
.weekly-heading strong{font-size:13px;font-weight:730;color:#332d29}.weekly-heading small{font-size:11px;color:#645d59}
.weekly-content .st-progress{height:9px}
.st-calendar{padding:18px 20px}.st-calendar .st-card-header{margin-bottom:9px}
.st-calendar .st-card-header h2{font-size:17px;font-weight:780}
.icon-control{width:29px;height:29px;font-size:25px;color:#574f4b}
.cal-weekdays{height:22px;font-size:11px;color:#837972;margin-bottom:6px}
.cal-dates{grid-template-rows:repeat(6,minmax(22px,1fr))}
.cal-day{width:26px;height:26px;font-size:12px;color:#49423e}
.cal-day.is-today{background:#edb2a4;color:#392823}
.cal-foot{font-size:10px;color:#857b75;margin-top:4px}
.course-tile{position:relative;border-radius:19px;gap:8px;padding:18px 11px;border:1px solid transparent;box-shadow:0 9px 26px #523c3513;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.course-tile.st-math{background:#fff0e9;border-color:#f3dad0}
.course-tile.st-brain{background:#edf1fd;border-color:#dce4f5}
.course-tile.st-reading{background:#edf5ed;border-color:#dbeadf}
.course-tile:hover{transform:translateY(-4px);box-shadow:0 16px 32px #51403820}
.course-tile-icon{margin:0}.course-tile-icon .st-icon{height:48px;width:48px;stroke-width:1.65}
.course-tile.st-math .course-tile-icon{color:#c77f65}
.course-tile.st-brain .course-tile-icon{color:#5f85cd}
.course-tile.st-reading .course-tile-icon{color:#578d6c}
.course-tile strong{font-size:21px;letter-spacing:-.75px;font-weight:800;color:#2f2927}
.tile-sub{font-size:11.5px;color:#6b625f;line-height:1.4}
.tile-action{display:inline-flex;align-items:center;justify-content:center;gap:4px;border-radius:999px;background:#fffdfb;border:1px solid #ece4dd;box-shadow:0 3px 10px #44362b0d;color:#4a3932;font-size:12px;font-weight:780;min-height:29px;padding:4px 13px;transition:background .2s}
.course-tile:hover .tile-action{background:#fff}
.course-tile.st-brain .tile-action{color:#476bac}
.course-tile.st-reading .tile-action{color:#386b50}
.tile-progress{width:78%;margin-top:1px}.tile-progress .st-progress{height:8px;background:#fffefbc0}
.lower-card{padding:19px 20px}.lower-card .st-card-header{margin-bottom:11px}.lower-card .st-card-header h2{font-size:18px}
.daily-flex{gap:19px;min-height:135px;justify-content:center}
.progress-donut{width:128px;height:128px;background:conic-gradient(#e6ab9b calc(var(--pct)*1%),#f2eae6 0)}
.progress-donut>div{width:103px;height:103px}
.progress-donut strong{font-size:30px;color:#2d2927}
.progress-donut small{font-size:11.5px;color:#716965}
.daily-checklist{font-size:12.5px;gap:8px;color:#453f3b}
.daily-dot{height:19px;width:19px;border-color:#d3c6bd}
.daily-dot.yes{background:#db9787;border-color:#db9787}
.metric-row{gap:9px}.metric-box{background:#f9f6f3;border:1px solid #f3ece7;padding:13px 4px 11px;min-height:121px}
.metric-box>span .st-icon{width:24px;height:24px}.metric-box small{font-size:11.5px;color:#756b65}
.metric-box strong{font-size:22px;font-weight:790;color:#332d29}.tiny-helper{font-size:11px;color:#827973;margin-top:9px}
.trend-rows{gap:9px}.trend-row{height:38px;grid-template-columns:23px minmax(90px,1fr) 50px 93px}
.trend-row strong{font-size:12px;font-weight:700;color:#423b38}
.trend-row>span:nth-child(3){font-size:11px;color:#746a65}

const joinOptions=(right,wrong)=>shuffle([right,...shuffle(uniq(wrong.filter(x=>x!==undefined).filter(x=>String(x)!==String(right)))).slice(0,3)]);
const qchoice=(prompt,answer,wrong,extra={})=>({type:'choice',prompt,answer,options:joinOptions(answer,wrong),...extra});
const qnum=(prompt,answer,extra={})=>({type:'number',prompt,answer,...extra});
const qseq=(prompt,seq,extra={})=>({type:'sequence',prompt,answer:seq.join(''),keys:uniq([...seq,...'1234567890'.split('')]).sort(),...extra});
const numOpts=(a,count=4)=>{let s=new Set([a]);while(s.size<count){let v=a+r(-9,9);if(v>=0)s.add(v)}return shuffle([...s])};
function makeQ(id,diff=2){const big=diff===3, p=pick(passages), d=diff;let x,y,z,seq,ans,choices;
switch(id){
case 'match': {let items=['◆','●','▲','■','★','♥','⬟','✦','⬢'];let sym=pick(items);return qchoice(`같은 기호를 찾으세요.\n${sym}  ${sym}  ${pick(items.filter(k=>k!==sym))}`,sym,shuffle(items.filter(k=>k!==sym)).slice(0,3),{note:'시각적 특징을 비교해 정답을 고르세요.'})}
case 'shadow':{let items=['▲','■','●','◆','⬟','★'];ans=pick(items);return qchoice('반쯤 가려진 형태의 원래 모양은?',ans,shuffle(items.filter(i=>i!==ans)).slice(0,3),{visual:`<div style="font-size:72px;clip-path:inset(0 45% 0 0);color:#4c65ba;line-height:1.2">${ans}</div>`})}
case 'pieces': case 'shape':{let s=['●','■','▲','◆'];let start=r(0,3);ans=s[(start+3)%4];return qchoice('도형 순서의 마지막 빈칸에 들어갈 것은?',ans,s.filter(x=>x!==ans),{visual:`<div class="focuswords">${[s[start],s[(start+1)%4],s[(start+2)%4],'?'].join('  ')}</div>`,note:'반복되는 4개 도형 규칙을 찾아보세요.'})}
case 'detective':{let icons=['☀','☂','♣','☘','☕','☎','♫','☾'];seq=shuffle(icons).slice(0,d+2);ans=pick(seq);return qchoice('방금 보인 기호에 포함된 것은?',ans,shuffle(icons.filter(a=>!seq.includes(a))).slice(0,3),{preview:seq.join('  '),previewTime:big?1500:2400})}
case 'flash':{seq=Array.from({length:d+2},()=>String(r(1,9)));return {type:'number',prompt:'나타난 숫자를 순서대로 입력하세요.',answer:seq.join(''),preview:seq.join(' '),previewTime:big?1900:3100,strict:true,note:'입력할 때 공백을 넣지 않아도 됩니다.'}}
case 'cards':{let all=['♠','♥','★','◆','☀','☘'];seq=shuffle(all).slice(0,Math.min(d+2,5));let deck=shuffle([...seq,...seq]);return {type:'pairs',prompt:'카드의 짝을 모두 찾아보세요.',answer:seq.length,deck,previewTime:1700, note:'카드를 클릭하면 뒤집힙니다.'}}
case 'reverse':{seq=Array.from({length:d+2},()=>String(r(1,9)));return {type:'sequence',prompt:'숫자를 **역순**으로 누르세요.',answer:[...seq].reverse().join(''),keys:['1','2','3','4','5','6','7','8','9'],preview:seq.join(' '),previewTime:big?2400:3400}}
case 'shuffle':{let pos=1,moves=[];for(let i=0;i<d+2;i++){let a=r(1,3),b=pick([1,2,3].filter(v=>v!==a));moves.push([a,b]);if(pos===a)pos=b;else if(pos===b)pos=a}return qchoice('시작: ①번 상자에 공이 있습니다.\n교환을 모두 마친 뒤 공의 위치는?',String(pos),['1','2','3'].filter(v=>v!==String(pos)),{visual:`<div class="focuswords">${moves.map(([a,b])=>`[${a} ↔ ${b}]`).join(' → ')}</div>`,note:'상자를 왼쪽부터 1, 2, 3으로 번호 붙여 생각하세요.'})}
case 'blocks':{x=r(2,4+d);y=r(2,4);ans=x*y;return qchoice('각 줄의 네모 개수를 세어 전체 개수를 고르세요.',String(ans),numOpts(ans).filter(a=>a!==ans).map(String),{visual:`<div class="memoryline">${Array.from({length:y},()=>`<div style="display:flex;gap:5px">${'■'.repeat(x).split('').map(()=>'<span style="color:#6d85bf;font-size:25px">■</span>').join('')}</div>`).join('')}</div>`})}
case 'scale':{let name=['빨강','파랑','초록'];seq=shuffle(name);return qchoice(`${seq[0]}이 ${seq[1]}보다 무겁고,\n${seq[1]}이 ${seq[2]}보다 무겁습니다.\n가장 가벼운 것은?`,seq[2],seq.slice(0,2),{note:'대소 관계를 순서대로 정리하세요.'})}
case 'pattern':{let a=r(2,6),v=r(2,d+3);return qchoice(`다음 숫자 규칙의 빈칸은?\n${a} → ${a+v} → ${a+2*v} → ?`,String(a+3*v),numOpts(a+3*v).filter(x=>x!==a+3*v).map(String))}
case 'mission':{x=r(4,12);y=r(3,12);ans=x===y?'같음':x>y?'A':'B';return qchoice(`A=${x}, B=${y}\n더 큰 숫자의 기호를 고르세요.`,ans,['A','B','같음'].filter(s=>s!==ans),{note:'수치를 비교하세요.'})}
case 'twosum': case 'calc25': case 'calc100':{x=r(2,9*d);y=r(2,9*d);let op=pick(['+','−','×']);if(op==='×'){x=r(2,2+d*2);y=r(2,2+d*3)}let a=op==='+'?x+y:op==='−'?x-y:x*y;return qnum(`${x} ${op} ${y} = ?`,a)}

function renderCalendar(){let y=visibleMonth.getFullYear(),m=visibleMonth.getMonth(),offset=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let cells=[];for(let i=0;i<offset;i++)cells.push('<span class="cal-empty"></span>');for(let d=1;d<=days;d++){let dt=dateKey(new Date(y,m,d)),isToday=dt===currentDay(),played=data.sessions.some(s=>s.date===dt);cells.push(`<button type="button" data-calendar-day="${dt}" class="cal-day ${isToday?'is-today':''} ${played?'has-training':''}" aria-label="${m+1}월 ${d}일${played?', 학습 기록 있음':''}">${d}${played?'<i></i>':''}</button>`)}return `<section class="st-card st-calendar" aria-label="학습 달력"><div class="st-card-header"><button type="button" data-cal-shift="-1" class="icon-control" aria-label="이전 달">‹</button><h2>${y}년 ${m+1}월</h2><button type="button" data-cal-shift="1" class="icon-control" aria-label="다음 달">›</button></div><div class="cal-grid cal-weekdays">${'일 월 화 수 목 금 토'.split(' ').map(d=>`<span>${d}</span>`).join('')}</div><div class="cal-grid cal-dates">${cells.join('')}</div><div class="cal-foot"><span class="cal-foot-dot"></span> 기록된 훈련일 ${daysTraining()}일</div></section>`}
function renderRoutine(){let n=doneCount();let rows=routineList().map((x)=>{let done=routineIsDone(x.id),secs=x.id==='review'?0:secsOfGroup(x.id,data.sessions.filter(s=>s.date===currentDay())),p=x.id==='review'?(done?100:0):safePct(secs,x.minutes*60);return `<button type="button" class="routine-row ${done?'done':''}" data-routine="${x.id}" aria-pressed="${done}"><span class="routine-checkbox">${done?stIcon('check',14):''}</span><span class="routine-subject-icon st-${x.cls}">${stIcon(x.icon,20)}</span><span class="routine-name">${x.title}</span>${stProgress(done?Math.max(p,100):p,x.cls)}<span class="routine-min">${x.minutes}분</span><span class="routine-status">${done?stIcon('check',13):''}</span></button>`}).join('');return `<section class="st-card routine-panel"><div class="st-card-header"><h2>${stIcon('clipboard',23)} 오늘의 루틴</h2><span class="routine-pill">오늘의 계획 <strong>${n}/4</strong> 완료</span><span class="st-card-spacer"></span><span class="muted-small">전체 <strong>${Math.round(n/4*100)}%</strong></span>${stProgress(n/4*100,'math')}</div><div class="routine-rows">${rows}</div></section>`}
function renderWeekly(){let w=weekRecords();let groups=['math','brain','reading'];let achieved=groups.reduce((n,id)=>n+Math.min(getWeeklyGoal(id),Math.round(secsOfGroup(id,w)/60)),0);let total=groups.reduce((n,id)=>n+getWeeklyGoal(id),0);let p=safePct(achieved,total);let circumference=2*Math.PI*39;let svg=`<svg viewBox="0 0 110 110" class="donut" role="img" aria-label="이번 주 목표 ${p}% 달성"><circle cx="55" cy="55" r="39" fill="none" stroke="#f0e9e6" stroke-width="10"/><circle cx="55" cy="55" r="39" fill="none" stroke="#e3a695" stroke-width="10" stroke-linecap="round" stroke-dasharray="${p/100*circumference} ${circumference}" transform="rotate(-90 55 55)"/><text x="55" y="53" text-anchor="middle" font-size="25" font-weight="800" fill="#292522">${p}%</text><text x="55" y="69" text-anchor="middle" font-size="9.5" fill="#726965">${achieved}/${total}분</text></svg>`;let rows=[['math','계산 훈련','calc'],['brain','두뇌 트레이닝','brain'],['reading','국어 독해','book']].map(([id,title,icon])=>{let minutes=Math.round(secsOfGroup(id,w)/60),goal=getWeeklyGoal(id);return `<div class="goal-row"><span class="weekly-icon st-${id}">${stIcon(icon,21)}</span><div class="weekly-content"><div class="weekly-heading"><strong>${title}</strong><small>${minutes} / ${goal}분</small></div>${stProgress(safePct(minutes,goal),id)}</div></div>`}).join('');return `<section class="st-card weekly-panel"><div class="st-card-header"><h2>${stIcon('target',25)} 주간 목표</h2><button class="st-inline-button" data-go="goals">목표 설정 ${stIcon('chevron',14)}</button></div><div class="weekly-content-grid">${svg}<div class="weekly-rows">${rows}</div></div></section>`}
function renderCourseTiles(){return [
 ['math','계산 훈련','calc',games.filter(g=>g.group==='math').length],
 ['brain','두뇌 트레이닝','brain',games.filter(g=>!['math','read'].includes(g.group)).length],
 ['reading','국어 독해','book',games.filter(g=>g.group==='read').length]
 ].map(([id,title,icon,n])=>{let seconds=secsOfGroup(id,data.sessions.filter(s=>s.date===currentDay())),target=routineList().find(g=>g.id===id).minutes*60;return `<button type="button" class="course-tile st-${id}" data-index="${id==='math'?'01 / MATH':id==='brain'?'02 / BRAIN':'03 / READING'}" data-go="${id}"><span class="course-tile-icon">${stIcon(icon,42)}</span><strong>${title}</strong><span class="tile-sub">${n}개 훈련 · 오늘 ${displayMinutes(seconds)} 학습</span><span class="tile-action">훈련 시작 ${stIcon('chevron',15)}</span><span class="tile-progress">${stProgress(safePct(seconds,target),id)}</span></button>`}).join('')}
function renderDailyProgress(){let n=doneCount(),pct=Math.round(n/4*100);return `<section class="st-card lower-card daily-panel"><div class="st-card-header"><h2>오늘의 진행도</h2></div><div class="daily-flex"><div class="progress-donut" style="--pct:${pct}"><div><strong>${pct}%</strong><small>${n}/4 완료</small></div></div><div class="daily-checklist">${routineList().map(r=>`<div class="daily-check"><span class="daily-dot ${routineIsDone(r.id)?'yes':''}">${routineIsDone(r.id)?'✓':''}</span>${r.title}</div>`).join('')}</div></div></section>`}
function renderMonthStats(){let m=monthRecords(),seconds=sumSecs(m),accuracy=avgAccuracy(m);return `<section class="st-card lower-card"><div class="st-card-header"><h2>이번 달 훈련 현황</h2><span class="muted-small">${visibleMonth.getMonth()+1}월</span></div><div class="metric-row"><div class="metric-box"><span>${stIcon('target',21)}</span><small>훈련일수</small><strong>${daysTraining()}일</strong></div><div class="metric-box"><span>${stIcon('clock',21)}</span><small>총 훈련시간</small><strong>${Math.round(seconds/60)}분</strong></div><div class="metric-box"><span>${stIcon('trending',21)}</span><small>평균 정답률</small><strong>${accuracy===null?'—':accuracy+'%'}</strong></div></div><p class="tiny-helper">${m.length?"실제 완료한 훈련 기록 기준":"첫 훈련을 완료하면 실제 성과가 표시됩니다."}</p></section>`}
function renderTrend(){let data14=[...Array(14)].map((_,i)=>{let d=new Date();d.setDate(d.getDate()-13+i);return {date:dateKey(d),n:data.sessions.filter(s=>s.date===dateKey(d)).reduce((a,s)=>a+(s.total||0),0)}});if(!data.sessions.length)return `<section class="st-card lower-card trend-panel"><div class="st-card-header"><h2>학습 흐름 요약</h2></div><div class="trend-empty"><span class="trend-empty-icon">${stIcon('chart',30)}</span><div><strong>첫 훈련부터 성장 기록이 시작돼요</strong><p>문제를 풀면 과목별 정답률과 학습 흐름을 확인할 수 있어요.</p></div><button type="button" class="trend-start" data-go="training">첫 훈련 시작 ${stIcon('chevron',15)}</button></div></section>`;return `<section class="st-card lower-card trend-panel"><div class="st-card-header"><h2>학습 흐름 요약</h2><button class="st-inline-button" data-go="analytics">상세 분석 ${stIcon('chevron',14)}</button></div><div class="trend-rows">${[['math','계산 훈련','calc'],['brain','두뇌 트레이닝','brain'],['reading','국어 독해','book']].map(([id,label,icon])=>{let arr=data.sessions.filter(s=>sessionHasGroup(s,id));let all=arr.flatMap(s=>s.answers?.filter(x=>id==='brain'?byId[x.id]?.group!=='read'&&byId[x.id]?.group!=='math':byId[x.id]?.group===courseKind(id))||[]);let a=all.length?Math.round(100*all.filter(x=>x.correct).length/all.length):null;let counts=data14.map(x=>data.sessions.filter(s=>s.date===x.date&&sessionHasGroup(s,id)).length);let m=Math.max(1,...counts);return `<div class="trend-row"><span class="st-${id}">${stIcon(icon,20)}</span><strong>${label}</strong><span>${a===null?'훈련 전':a+'%'}</span><div class="trend-ticks st-${id}">${counts.map(num=>`<i style="height:${Math.max(3,Math.round(num/m*23))}px;opacity:${num?'.72':'.16'}"></i>`).join('')}</div></div>`}).join('')}</div></section>`}
function renderHome(){
 const core=['math','brain','reading'];
 const complete=core.filter(id=>routineIsDone(id)).length;
 const totalCorrect=data.sessions.reduce((n,s)=>n+(Number(s.correct)||0),0);

 const level=Math.max(1,Math.floor(points/500)+1);

   ['math','계산 훈련','빠르고 정확한 계산력 향상','calc'],

 ];

 const skills=[['직감','spark','brain','orange'],['기억','layers','brain','pink'],['분석','chart','brain','blue'],['계산','calc','math','green'],['지각','target','brain','purple']];
 const skillTiles=skills.map(([label,icon,target,tone])=>`<button type="button" class="gh-skill" data-go="${target}" aria-label="${label} 훈련 보기"><span class="gh-skill-glyph gh-skill-${tone}">${stIcon(icon,24)}</span><span>${label}</span></button>`).join('');
 return `<div class="gh-root">
  <header class="gh-bar"><div class="gh-brand"><button type="button" class="gh-grid-btn" data-go="training" aria-label="전체 게임 메뉴"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="6" height="6" rx="1.4"/><rect x="14.5" y="3.5" width="6" height="6" rx="1.4"/><rect x="3.5" y="14.5" width="6" height="6" rx="1.4"/><rect x="14.5" y="14.5" width="6" height="6" rx="1.4"/></svg></button><span class="gh-separator"></span><span class="gh-mark">${stIcon('brain',29)}</span><strong>스터디트레이닝</strong></div>
  <div class="gh-status"><span class="gh-level">${stIcon('chart',20)} <strong>Lv. ${level}</strong></span><span class="gh-separator"></span><span class="gh-stars"><span aria-hidden="true">☆</span><strong>${points.toLocaleString('ko-KR')}점</strong></span><span class="gh-separator"></span><button type="button" class="gh-profile" data-go="settings" aria-label="설정 및 내 정보">${stIcon('user',25)}</button></div></header>
  <main class="gh-body"><div class="gh-center-group"><div class="gh-heading"><h1>오늘은 어떤 훈련을 할까요?</h1><p>게임처럼 즐기면서 두뇌와 독해력을 키워보세요.</p><span class="gh-title-rule"></span></div>
   <section class="gh-cards" aria-label="훈련 선택">${cards}</section>
   <nav class="gh-rail" aria-label="도전 및 기록"><button type="button" class="gh-rail-item gh-challenge" data-go="planner"><span class="gh-rail-icon">${stIcon('target',31)}</span><span class="gh-rail-title">오늘의 도전</span><span class="gh-completion">${complete} / 3 완료</span><span class="gh-steps">${core.map(id=>`<i class="${routineIsDone(id)?'is-done':''}"></i>`).join('')}</span></button>
   <button class="gh-rail-item gh-navbutton" type="button" data-test="academy"><span class="gh-rail-icon trophy-icon" aria-hidden="true">🏆</span><strong>종합 테스트</strong>${stIcon('chevron',21)}</button>
   <button class="gh-rail-item gh-navbutton" type="button" data-go="record"><span class="gh-rail-icon">${stIcon('chart',30)}</span><strong>내 기록</strong>${stIcon('chevron',21)}</button>
   <div class="gh-rail-skills"><span class="gh-skills-title">훈련 영역</span><div class="gh-skills">${skillTiles}</div></div></nav></div>
  </main></div>`;
}
function renderTrainingLanding(){return `<div class="inner-page"><div class="page-intro">계산·두뇌·국어를 분리해 집중해서 훈련하세요. 원하는 영역을 선택하면 개별 게임을 시작할 수 있습니다.</div><div class="dash-middle training-landing">${renderCourseTiles()}</div><section class="st-card inner-card"><div class="st-card-header"><h2>바로 시작하기</h2></div><div class="featured-games">${[byId.calc25,byId.cards,byId.semantic,byId.sudoku,byId.verbal,byId.connection].map(g=>`<button type="button" class="featured-game" data-id="${g.id}"><span class="featured-glyph">${stIcon(g.group==='math'?'calc':g.group==='read'?'book':'brain',23)}</span><strong>${g.title}</strong><span>${g.desc}</span>${stIcon('chevron',17)}</button>`).join('')}</div></section></div>`}
function renderPlanner(){return `<div class="inner-page planner-page"><div class="planner-two">${renderCalendar()}${renderRoutine()}</div><section class="st-card inner-card">${renderWeekly()}</section></div>`}
function renderAnalytics(){let all=data.sessions, accuracy=avgAccuracy(all),weeks=weekRecords(),recent=[...Array(14)].map((_,i)=>{let d=new Date();d.setDate(d.getDate()-13+i);return {label:`${d.getMonth()+1}/${d.getDate()}`,minutes:Math.round(sumSecs(all.filter(s=>s.date===dateKey(d)))/60)}}), max=Math.max(1,...recent.map(x=>x.minutes));return `<div class="inner-page"><div class="metric-summary"><div><small>완료한 훈련</small><strong>${all.length}<em>회</em></strong></div><div><small>총 문제</small><strong>${all.reduce((n,s)=>n+s.total,0)}<em>문제</em></strong></div><div><small>평균 정답률</small><strong>${accuracy===null?'—':accuracy+'%'} </strong></div><div><small>이번 주 훈련시간</small><strong>${Math.round(sumSecs(weeks)/60)}<em>분</em></strong></div></div><section class="st-card inner-card"><div class="st-card-header"><h2>최근 14일 학습 시간</h2><span class="muted-small">실제 세션 기록 · 분 단위</span></div><div class="large-chart">${recent.map((x,i)=>`<div class="chart-column"><div class="chart-track"><div style="height:${x.minutes?Math.max(5,x.minutes/max*100):0}%"></div></div><small>${x.label}</small></div>`).join('')}</div></section><div class="planner-two">${renderWeekly()}${renderTrend()}</div></div>`}
function renderGoals(){return `<div class="inner-page"><section class="st-card inner-card"><div class="st-card-header"><h2>주간 훈련 목표 설정</h2></div><p class="settings-note">각 과목의 목표 시간(분)을 입력해 주세요. 변경한 목표는 홈과 분석 화면에 반영됩니다.</p><form id="goal-form" class="goal-form">${[['math','계산 훈련'],['brain','두뇌 트레이닝'],['reading','국어 독해']].map(([id,label])=>`<label class="goal-input st-${id}"><span>${label}</span><input name="${id}" type="number" min="10" max="2000" step="5" value="${getWeeklyGoal(id)}" required><span>분/주</span></label>`).join('')}<button class="btn" type="submit">목표 저장</button><span id="goals-message" class="tiny-helper" aria-live="polite"></span></form></section>${renderWeekly()}</div>`}
function renderCollection(){let practiced=new Set(data.sessions.flatMap(s=>s.items.map(x=>x.id)));return `<div class="inner-page"><section class="st-card inner-card"><div class="st-card-header"><h2>나의 훈련 컬렉션</h2><span class="routine-pill">${practiced.size} / ${games.length}종 경험</span></div><p class="settings-note">한 번이라도 완료한 게임에는 완료 표시가 생깁니다. 게임을 누르면 바로 연습할 수 있습니다.</p><div class="collection-grid">${games.map(g=>`<button type="button" class="collection-item ${practiced.has(g.id)?'practiced':''}" data-id="${g.id}"><span class="collection-icon">${stIcon(g.group==='math'?'calc':g.group==='read'?'book':'brain',22)}</span><strong>${g.title}</strong>${practiced.has(g.id)?'<span class="collection-done">완료 ✓</span>':''}</button>`).join('')}</div></section></div>`}
function renderSettings(){return `<div class="inner-page"><section class="st-card inner-card"><div class="st-card-header"><h2>훈련 기본 설정</h2></div><div class="settings-area"><label>기본 난이도<select id="setting-difficulty"><option value="1" ${data.settings.difficulty===1?'selected':''}>초급</option><option value="2" ${data.settings.difficulty===2?'selected':''}>중급</option><option value="3" ${data.settings.difficulty===3?'selected':''}>고급</option></select></label><p class="settings-note">설정은 브라우저에 저장됩니다. 다른 기기로 자동 동기화되지 않습니다.</p><div class="settings-actions"><button type="button" id="settings-export" class="btn outline">${stIcon('download',17)} 기록 백업하기</button><button type="button" id="settings-clear" class="btn ghost danger">기록 초기화</button></div></div></section></div>`}
function renderHelp(){return `<div class="inner-page"><section class="st-card inner-card"><div class="st-card-header"><h2>이용 안내</h2></div><div class="help-copy"><p>계산 훈련 8종, 두뇌 트레이닝 24종, 국어 독해 17종을 별도로 선택할 수 있습니다.</p><p>훈련을 클릭해 난이도·문제 수를 설정하고 정답을 제출하면 다음 문제로 넘어갑니다. 완료한 세션은 학습 기록에 저장됩니다.</p><p>홈 화면의 체크박스는 직접 표시하거나 해제할 수 있습니다. 각 과목의 훈련을 완료하면 해당 과목도 자동으로 완료 처리됩니다.</p><p>주간 목표의 수치는 실제 훈련 시간 기록을 합산합니다. 브라우저 데이터를 삭제하면 기록도 사라질 수 있으므로 설정에서 백업해 주세요.</p><p>닌텐도·스터디포스 공식 제품이 아닌 독립 학습용 콘텐츠입니다.</p></div></section></div>`}
function onExtraPageEvents(){
 document.querySelectorAll('[data-cal-shift]').forEach(b=>b.onclick=()=>{visibleMonth=new Date(visibleMonth.getFullYear(),visibleMonth.getMonth()+Number(b.dataset.calShift),1);render()});
 document.querySelectorAll('[data-calendar-day]').forEach(b=>b.onclick=()=>{let day=b.dataset.calendarDay,records=data.sessions.filter(s=>s.date===day);showInfoModal(`${day} 학습 기록`,records.length?`${records.length}회 훈련 · ${records.reduce((n,s)=>n+s.total,0)}문제 · ${Math.round(sumSecs(records)/60)}분`:'이 날짜에는 완료된 훈련 기록이 없습니다.')});
 document.querySelectorAll('[data-routine]').forEach(b=>b.onclick=()=>{let id=b.dataset.routine,dt=currentDay();data.routineLog ||= {};data.routineLog[dt] ||= {};data.routineLog[dt][id]=!routineIsDone(id,dt);save();render()});
 document.querySelector('#goal-form')?.addEventListener('submit',e=>{e.preventDefault();let form=new FormData(e.target);data.weeklyGoals={math:Number(form.get('math')),brain:Number(form.get('brain')),reading:Number(form.get('reading'))};if(Object.values(data.weeklyGoals).some(n=>!Number.isFinite(n)||n<10||n>2000)){showInfoModal('목표 범위 확인','과목별 10분에서 2000분 사이로 설정해 주세요.');return}save();render();showInfoModal('목표 저장 완료','주간 훈련 목표가 저장되었습니다.')});
 document.querySelector('#setting-difficulty')?.addEventListener('change',e=>{data.settings.difficulty=Number(e.target.value);save()});
 document.querySelector('#settings-export')?.addEventListener('click',exportRecords);

}
function sudokuCells(){let q=session.q;return session.sudokuInput.map((row,i)=>row.map((v,j)=>`<button class="${q.fixed[i][j]?'fixed':''} ${session.sudokuFocused===`${i},${j}`?'active':''}" data-cell="${i},${j}">${v||''}</button>`).join('')).join('')}
function gridHtml(selected,show){return `<div class="grid5">${[...Array(25)].map((_,i)=>`<button type="button" class="sq ${show?'': 'clickable'} ${show&&selected.includes(i)?'selected':''}" ${show?'disabled':'data-gridcell="'+i+'"'} aria-label="${i+1}번 칸">${show&&selected.includes(i)?'◆':''}</button>`).join('')}</div>`}
function flipCard(i){let s=session,ps=s.pairState,q=s.q;if(!s||s.locked||ps.found.includes(i)||ps.open.includes(i)||ps.open.length>=2)return;ps.open.push(i);let b=$(`[data-card="${i}"]`);b.textContent=q.deck[i];b.style.background='#ebf0ff';if(ps.open.length===2){ps.tries++;let[a,c]=ps.open;if(q.deck[a]===q.deck[c]){ps.found.push(a,c);ps.open=[];$('#pair-info').textContent=`짝 ${ps.found.length/2} / ${q.answer}`;if(ps.found.length===q.deck.length){evaluate('complete')}}else{setTimeout(()=>{if(!session||session.q!==q)return;[a,c].forEach(z=>{let b=$(`[data-card="${z}"]`);if(b){b.textContent='?';b.style.background=''}});ps.open=[]},630)}}}
function validSudoku(grid,q){const valid=(a)=>a.length===4&&new Set(a).size===4&&a.every(n=>n>=1&&n<=4);for(let i=0;i<4;i++){if(!valid(grid[i])||!valid(grid.map(row=>row[i])))return false;for(let j=0;j<4;j++){if(q.fixed[i][j]&&grid[i][j]!==q.grid[i][j])return false}}for(let a=0;a<4;a+=2)for(let b=0;b<4;b+=2){if(!valid([grid[a][b],grid[a][b+1],grid[a+1][b],grid[a+1][b+1]]))return false}return true}
function evaluate(value,clicked){if(!session||session.locked||previewing)return;let s=session,q=s.q,correct=q.type==='pairs'?'complete'===value:q.type==='sudoku'?validSudoku(s.sudokuInput,q):String(value).replace(/\s/g,'')===String(q.answer).replace(/\s/g,'');s.locked=true;let dt=(Date.now()-s.questionStart)/1000;s.correct+=correct?1:0;s.score+=correct?Math.max(20,Math.round(100-Math.min(70,dt*2))):0;s.answers.push({id:s.items[s.current].id,correct,seconds:Number(dt.toFixed(1))});if(clicked){clicked.classList.add(correct?'correct':'wrong')}let msg=correct?'✓ 정답입니다.':`정답: ${q.type==='sudoku'?'규칙을 만족하는 격자':q.type==='pairs'?'모든 짝':esc(String(q.answer).slice(0,75))}`;$('#feedback').innerHTML=msg;$('#feedback').classList.toggle('bad',!correct);$$('#challenge button').forEach(b=>b.disabled=true);if(!correct&&q.type==='choice')$$('[data-answer]').forEach(b=>{if(b.dataset.answer===String(q.answer))b.classList.add('correct')});nextTick=setTimeout(()=>{if(!session)return;s.current++;if(s.current>=s.total)finishSession();else renderQuestion()},correct?750:1250)}
function finishSession(){let s=session;if(!s)return;clearTimers();let seconds=Math.max(1,Math.round((Date.now()-s.start)/1000));let record={date:today,stamp:new Date().toISOString(),label:s.label,items:s.items.map(g=>({id:g.id,group:g.group})),correct:s.correct,total:s.total,seconds,difficulty:s.diff,answers:s.answers};data.sessions.push(record);if(data.sessions.length>1500)data.sessions.splice(0,data.sessions.length-1500);save();session=null;document.body.classList.remove('in-session');updateHeader();let a=Math.round(record.correct/record.total*100);$('#page-title').textContent='훈련 완료';$('#page-desc').textContent='이번 세션의 결과가 브라우저에 저장되었습니다.';$('#content').innerHTML=`<div class="panel gamewrap resultmain" style="padding:32px 26px"><div class="resultbadge">✓</div><div class="eyebrow">SESSION COMPLETE</div><h2>${esc(record.label)}</h2><p class="tiny">${a>=90?'정확도가 높습니다. 다음 단계에도 도전해보세요.':a>=70?'좋은 출발입니다. 오답 유형을 다시 연습해보세요.':'문제 유형을 천천히 익혀 다시 도전해보세요.'}</p><div class="results"><div><strong>${a}%</strong><span>정답률</span></div><div><strong>${record.correct}/${record.total}</strong><span>맞힌 문제</span></div><div><strong>${timerText(seconds)}</strong><span>풀이 시간</span></div></div><div class="actions" style="justify-content:center"><button class="btn ghost" id="back-home">홈으로</button><button class="btn" id="again">다시 훈련 →</button></div><div class="desc" style="text-align:left;margin-top:28px"><h3>틀린 문제 유형</h3><p>${esc(uniq(record.answers.filter(x=>!x.correct).map(x=>byId[x.id].title)).join(' · ')||'모든 문제를 맞혔습니다.')}</p></div></div>`;$('#back-home').onclick=()=>setPage('home');$('#again').onclick=()=>openStart(record.items.every(x=>x.id===record.items[0].id)?record.items[0].id:null,record.label==='국어 독해 랜덤 연습'?'literacy':record.label==='계산 랜덤 연습'?'math':'brain')}
$('#brand-home').onclick=()=>setPage('home');$$('button[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));setupShellIcons();document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal'))closeModal()});render();
})();
</script></body></html>
