<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent}body{display:flex;align-items:center;justify-content:center;font-family:Georgia,'Times New Roman',serif;color:#37352f}.wrap{width:100%;text-align:center;padding:10px 16px}.greet{font-size:32px;line-height:1.15;font-weight:500;letter-spacing:-.4px}.name{display:inline-block;min-width:0;outline:none;border-radius:6px;padding:1px 3px}.name:empty:after{content:''}.name:hover,.name:focus{background:rgba(55,53,47,.06)}.date{margin-top:7px;font-family:Arial,sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#787774}.hint{opacity:0;transition:.15s;margin-top:5px;font:10px Arial,sans-serif;color:#9b9a97}.wrap:hover .hint{opacity:1}</style></head><body><div class="wrap"><div class="greet"><span id="greeting">Good Evening</span><span id="space"> </span><span id="name" class="name" contenteditable="true" spellcheck="false"></span></div><div id="date" class="date"></div><div class="hint">click after the greeting to add your name</div></div><script>const K='lifetown_minimal_greeting_name_v1';const nameEl=document.getElementById('name');nameEl.textContent=localStorage.getItem(K)||'';nameEl.addEventListener('input',()=>localStorage.setItem(K,nameEl.textContent.trim()));function render(){const d=new Date(),h=d.getHours();document.getElementById('greeting').textContent=h<12?'Good Morning':h<18?'Good Afternoon':'Good Evening';document.getElementById('date').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}render();setInterval(render,60000);</script></body></html>
