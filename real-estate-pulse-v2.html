<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Real Estate Pulse v2</title><link rel="stylesheet" href="./assets/life-town-v2.css">
<style>
:root{--panel:#fff;--soft:#f7f7f8;--line:#e5e5e8;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--blue:#007aff;--red:#d92d27;--green:#248a3d;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}
html[data-theme="dark"],html[data-lt-theme="dark"]{--panel:#1c1c1e;--soft:#2c2c2e;--line:#38383a;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--blue:#0a84ff;--red:#ff453a;--green:#30d158;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px 48px 8px 8px!important;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}
.shell{width:100%;max-width:440px;margin:0 auto}.widget{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:13px 13px 10px;box-shadow:var(--shadow)}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.kicker{font-size:8px;color:var(--muted);letter-spacing:.06em}.title{margin-top:3px;font-size:17px;font-weight:760;letter-spacing:-.04em}.subtitle{margin-top:4px;font-size:9.5px;color:var(--muted)}.rate{text-align:right}.rate-label{font-size:8px;color:var(--muted)}.rate-value{margin-top:3px;font-size:20px;font-weight:760;line-height:1}.rate-date{margin-top:4px;font-size:7.6px;color:var(--muted)}
.segment{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:12px;padding:3px;background:var(--soft);border-radius:11px}.segment button{height:28px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:9.5px;cursor:pointer}.segment button.active{background:var(--panel);color:var(--text);font-weight:720;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.summary{display:grid;grid-template-columns:1fr repeat(3,auto);gap:7px;align-items:center;margin-top:10px;padding:7px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:8.4px;color:var(--muted)}.summary strong{color:var(--text);font-weight:700}.s-up{color:var(--red)!important}.s-down{color:var(--blue)!important}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;padding:3px 2px 1px}.item{height:30px;display:flex;align-items:center;justify-content:space-between;gap:7px;border-bottom:1px solid var(--line)}.item:nth-last-child(-n+2){border-bottom:0}.name{font-size:10.2px;font-weight:650}.value{font-size:10.4px;font-weight:720;font-variant-numeric:tabular-nums}.up{color:var(--red)}.down{color:var(--blue)}.flat{color:var(--muted)}.arrow{font-size:6.5px;margin-right:2px}
.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px;padding-top:8px;border-top:1px solid var(--line);font-size:7.8px;color:var(--muted)}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--green);margin-right:4px}
@container(max-width:420px){.grid{column-gap:10px}.name{font-size:9.8px}.value{font-size:10px}}
</style></head>
<body><div class="shell"><main class="widget" id="widget" data-widget-control-root data-control-sizes="380,410,440">
<header class="header"><div><div class="kicker">KOREA WEEKLY APARTMENT</div><div class="title">Real Estate Pulse</div><div class="subtitle">전국 아파트 주간 가격 변동률</div></div><div class="rate"><div class="rate-label">한국 기준금리</div><div class="rate-value" id="baseRate">—</div><div class="rate-date" id="rateDate">BOK</div></div></header>
<div class="segment"><button class="active" data-mode="sale">매매</button><button data-mode="lease">전세</button></div>
<div class="summary"><span id="metric">주간 매매 변동률</span><strong class="s-up" id="upCount">상승 —</strong><strong class="s-down" id="downCount">하락 —</strong><strong id="flatCount">보합 —</strong></div>
<section class="grid" id="grid"></section>
<footer class="footer"><span><i class="dot"></i>한국부동산원 · 한국은행</span><span id="asOf">기준일 —</span></footer>
</main></div>
<script>
let mode='sale',data=null;const $=s=>document.querySelector(s);const fmt=v=>`${Number(v)>0?'+':''}${Number(v).toFixed(2)}%`;const cls=v=>Number(v)>0?'up':Number(v)<0?'down':'flat';const arrow=v=>Number(v)>0?'▲':Number(v)<0?'▼':'•';const date=s=>s?String(s).replaceAll('-','.'):'—';
function render(){if(!data)return;const vals=data.regions.map(r=>Number(r[mode]));$('#grid').innerHTML=data.regions.map(r=>{const v=Number(r[mode]);return `<div class="item"><span class="name">${r.name}</span><span class="value ${cls(v)}"><span class="arrow">${arrow(v)}</span>${fmt(v)}</span></div>`}).join('');$('#metric').textContent=mode==='sale'?'주간 매매 변동률':'주간 전세 변동률';$('#upCount').textContent=`상승 ${vals.filter(v=>v>0).length}`;$('#downCount').textContent=`하락 ${vals.filter(v=>v<0).length}`;$('#flatCount').textContent=`보합 ${vals.filter(v=>v===0).length}`}
document.querySelectorAll('.segment button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.segment button').forEach(x=>x.classList.toggle('active',x===b));render()});
async function load(){try{const r=await fetch('./real-estate-pulse-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;data=await r.json();$('#baseRate').textContent=`${Number(data.baseRate.value).toFixed(2)}%`;$('#rateDate').textContent=date(data.baseRate.changedAt);$('#asOf').textContent=`${date(data.asOf)} 기준`;render()}catch{$('#grid').innerHTML='<div class="item" style="grid-column:1/-1"><span class="name">데이터를 불러오지 못했습니다.</span></div>'}}load();
</script><script src="./assets/life-town-controls-v2.js"></script></body></html>
