'W',value:'+6',meta:'1주 전 대비',rating:'greed'}], note:'암호화폐 시장은 탐욕 구간입니다. 단기 가격 변동성 확대에 유의하세요.'}};let state = { market:'korea', data:{...fallbackData}, loaded:{} };function classify(score){ score = Number(score); if(!Number.isFinite(score)) return 'neutral'; if(score<25) return 'extreme fear'; if(score<45) return 'fear'; if(score<55) return 'neutral'; if(score<75) return 'greed'; return 'extreme greed'; }function parseRating(r){ return (r||'neutral').toString().trim().toLowerCase(); }function fmtNum(n, digits=1){ const x=Number(n); return Number.isFinite(x) ? new Intl.NumberFormat('ko-KR',{maximumFractionDigits:digits}).format(x) : '—'; }function fmtInt(n){ return fmtNum(n,0); }function fmtTime(s){ if(!s) return '—'; const d=new Date(s); return isNaN(d) ? '—' : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }function colorForRating(r){ r=parseRating(r); return r.includes('extreme fear')?'var(--red)':r==='fear'?'var(--orange)':r==='neutral'?'var(--yellow)':r==='greed'?'var(--green)':'var(--green)'; }function compareBlock(label,current,previous){ const delta = (Number.isFinite(current) && Number.isFinite(previous)) ? current-previous : null; let cls='flat', arrow=''; if(delta>0.04){cls='up'; arrow='↑ ';} else if(delta<-0.04){cls='down'; arrow='↓ ';} const curR = ratingEn[classify(current)] || ratingEn[parseRating(classify(current))]; const prevR = ratingEn[classify(previous)] || ratingEn[parseRating(classify(previous))]; return `<div class="compare-item"><div class="compare-label">${label}</div><div class="compare-value ${cls}">${delta===null?'—':arrow + (delta>0?'+':'') + fmtNum(delta,1)}</div><div class="compare-sub">${previous==null?'비교 데이터 없음':`${fmtNum(previous,1)} (${prevR}) → ${fmtNum(current,1)} (${curR})`}</div></div>`; }function renderCompare(d){ const h=d.headline||{}; const avg = Number.isFinite(d.one_year_average) ? d.one_year_average : h.previous_1_year; $('#compare').innerHTML = [compareBlock('전일 대비',h.score,h.previous_close), compareBlock('1주일 전 대비',h.score,h.previous_1_week), compareBlock('1개월 전 대비',h.score,h.previous_1_month), `<div class="compare-item"><div class="compare-label">1년 평균</div><div class="compare-value">${avg==null?'—':fmtNum(avg,1)}</div><div class="compare-sub">${ratingKo[classify(avg)]||'—'}</div></div>`].join(''); }function renderChart(d){ const rows=(d.history||[]).slice(-7); const svg=$("#chart"); const W=520,H=160,l=42,r=12,t=10,b=28; const pw=W-l-r, ph=H-t-b; const pts=rows.map((row,i)=>{ const x=l+(pw*(rows.length===1?0:i/(rows.length-1))); const y=t+(100-row.value)/100*ph; return {x,y,row}; }); let out=`<defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(142,201,88,.18)"/><stop offset="100%" stop-color="rgba(142,201,88,0)"/></linearGradient><linearGradient id="lineStroke" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#cdbb68"/><stop offset="46%" stop-color="#9fbe70"/><stop offset="100%" stop-color="#6ea779"/></linearGradient></defs>`; [0,25,50,75,100].forEach(v=>{ const y=t+(100-v)/100*ph; out += `<line class="gridline" x1="${l}" y1="${y}" x2="${W-r}" y2="${y}"/><text class="axis-label" x="6" y="${y+3}">${v}</text>`;}); if(pts.length){ const line=pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' '); const area = `${line} L ${pts[pts.length-1].x} ${H-b} L ${pts[0].x} ${H-b} Z`; out += `<path class="trend-area" d="${area}"/><path class="trend-line" d="${line}"/>`; pts.forEach((p,i)=>{ const color=i===pts.length-1?'#6ea779':(i<2?'#cdbb68':i<4?'#9fbe70':'#7eaf78'); const cls=i===pts.length-1?'last-dot':'dot'; out += `<circle class="${cls}" cx="${p.x}" cy="${p.y}" r="${i===pts.length-1?4.6:3.6}" fill="${color}"/>`; }); pts.forEach((p)=>{ const d=new Date(p.row.timestamp||Date.now()); const label=`${d.getMonth()+1}/${d.getDate()}`; out += `<text class="axis-label" x="${p.x}" y="${H-8}" text-anchor="middle">${label}</text>`; }); const lp=pts[pts.length-1]; const pillX=Math.min(lp.x+8,W-56), pillY=Math.max(lp.y-14,6); out += `<g><rect x="${pillX}" y="${pillY}" width="34" height="22" rx="7" fill="#6ea779" opacity=".98"/><text x="${pillX+17}" y="${pillY+14}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${fmtNum(pts[pts.length-1].row.value,1)}</text></g>`; } svg.innerHTML=out; }function renderIndicators(d){ const items=(d.indicators||[]).slice(0,5); const bgMap={"extreme fear":"rgba(223,87,87,.10)","fear":"rgba(240,120,73,.10)","neutral":"rgba(237,201,73,.10)","greed":"rgba(155,206,85,.12)","extreme greed":"rgba(97,185,66,.12)"}; $('#indicators').innerHTML = items.map(item => { const r=parseRating(item.rating||'neutral'); return `<div class="indicator"><div class="i-icon" style="color:${colorForRating(r)};background:${bgMap[r]||'var(--soft)'}">${item.icon||'•'}</div><div class="i-copy"><div class="i-name">${item.label||''}</div><div class="i-value">${item.value||'—'}</div><div class="i-meta" style="color:${colorForRating(r)}">${item.meta||''}</div></div></div>`; }).join(''); }function marketNote(market,rating){ const notes={  korea:{   'extreme fear':'한국 시장은 극도의 공포 구간입니다. 환율과 수급 변화를 함께 확인하세요.',   'fear':'한국 시장은 공포 구간입니다. 위험 회피와 외국인 수급 변화를 함께 확인하세요.',   'neutral':'한국 시장은 중립 구간입니다. 환율과 단기 모멘텀 변화를 함께 확인하세요.',   'greed':'한국 시장은 탐욕 구간입니다. 위험 선호 확대와 단기 과열 여부를 함께 확인하세요.',   'extreme greed':'한국 시장은 극도의 탐욕 구간입니다. 단기 과열과 쏠림 여부를 함께 확인하세요.'  },  us:{   'extreme fear':'미국 증시는 극도의 공포 구간입니다. 위험 회피 심리가 매우 강한 상태입니다.',   'fear':'미국 증시는 공포 구간입니다. 투자자들의 위험 회피 성향이 높아지고 있습니다.',   'neutral':'미국 증시는 중립 구간입니다. 공포와 탐욕 어느 한쪽으로 크게 치우치지 않았습니다.',   'greed':'미국 증시는 탐욕 구간입니다. 투자자들의 위험 선호가 높아지고 있습니다.',   'extreme greed':'미국 증시는 극도의 탐욕 구간입니다. 과도한 낙관과 쏠림 여부를 함께 확인하세요.'  },  crypto:{   'extreme fear':'암호화폐 시장은 극도의 공포 구간입니다. 변동성 확대에 특히 유의하세요.',   'fear':'암호화폐 시장은 공포 구간입니다. 위험 회피 심리와 변동성 확대에 유의하세요.',   'neutral':'암호화폐 시장은 중립 구간입니다. 방향성 확인이 필요한 상태입니다.',   'greed':'암호화폐 시장은 탐욕 구간입니다. 위험 선호 확대와 단기 변동성을 함께 확인하세요.',   'extreme greed':'암호화폐 시장은 극도의 탐욕 구간입니다. 단기 과열과 급격한 변동에 유의하세요.'  } }; return (notes[market]&&notes[market][rating]) || '현재 시장 심리 상태를 확인하세요.';}function renderHero(d){ const h=d.headline||{}; const score=Number(h.score)||0; const rating=parseRating(h.rating || classify(score)); const clamped=Math.max(0,Math.min(100,score)); const angle=-90 + clamped*1.8; $('#needle').style.transform=`rotate(${angle}deg)`; $('#score').classList.remove('skeleton'); $('#score').textContent=fmtNum(Math.round(score),0); $('#score').style.color=colorForRating(rating); document.documentElement.style.setProperty('--state',colorForRating(rating)); const label=ratingEn[rating] || ratingEn[classify(score)] || 'Neutral'; $('#rating').textContent=label; $('#rating').style.color=colorForRating(rating); const raw=(typeof d.note==='string'&&d.note.trim())?d.note.trim():marketNote(state.market,rating); $('#note').innerHTML=raw.replace(/\.\s+/g,'.<br>'); }function renderMeta(d){ const meta=tabMeta[state.market]; $('#mainTitle').textContent = meta.title; $('#subTitle').textContent = meta.subtitle; $('#trendTitle').textContent = meta.trend; $('#indicatorTitle').textContent = meta.indicatorTitle; $('#disclaimer').textContent = meta.disclaimer; $('#updated').textContent = fmtTime(d.updated_at || d.source_timestamp || d.headline?.timestamp); $('#sourceState').textContent = `${d.source_name || 'Source'} · ${state.loaded[state.market] ? 'live data' : 'fallback data'}`; }function render(){ document.querySelectorAll('.tab').forEach(btn=> btn.classList.toggle('active', btn.dataset.market===state.market)); const d=state.data[state.market] || fallbackData[state.market]; renderMeta(d); renderHero(d); renderCompare(d); renderChart(d); renderIndicators(d); }async function loadOne(market, path){ try{ const res = await fetch(path,{cache:'no-store'}); if(!res.ok) throw new Error(res.status); const data = await res.json(); normalizeData(market, data); state.data[market]=data; state.loaded[market]=true; }catch(err){ console.warn('fallback',market,err); state.data[market]=fallbackData[market]; state.loaded[market]=false; } }function normalizeData(market, data){ if(!Array.isArray(data.history)) data.history=[]; data.history = data.history.map(row => ({...row, value:Number(row.value)})).filter(row => Number.isFinite(row.value)); data.headline = data.headline || {}; data.headline.score = Number(data.headline.score); ['previous_close','previous_1_week','previous_1_month','previous_1_year'].forEach(k=>{ if(data.headline[k]!=null) data.headline[k]=Number(data.headline[k]); }); if(!Array.isArray(data.indicators)) data.indicators = []; if(market==='us' && data.components && !data.indicators.length){ const map = [{key:'vix',label:'변동성 (VIX)',icon:'⌁'},{key:'momentum',label:'시장 모멘텀',icon:'↗'},{key:'strength',label:'주가 강도',icon:'▥'},{key:'put_call',label:'풋/콜 비율',icon:'⚖'},{key:'junk',label:'정크본드 수요',icon:'◎'}]; data.indicators = map.map(({key,label,icon})=>{ const o=data.components[key]||{}; return {label,icon,value:(o.raw_value!=null?fmtNum(o.raw_value,2):o.score!=null?fmtNum(o.score,1):'—'),meta:o.rating ? (ratingKo[parseRating(o.rating)] || o.rating) : '',rating:o.rating || classify(o.score)}; }); } }async function refreshAll(){ await Promise.all([loadOne('korea','./korea-market-sentiment.json'), loadOne('us','./fear-greed-data.json'), loadOne('crypto','./crypto-fear-greed-data.json')]); render(); }document.querySelectorAll('.tab').forEach(btn=> btn.addEventListener('click',()=>{ state.market=btn.dataset.market; render(); })); $('#refresh').addEventListener('click', refreshAll); render(); refreshAll();</script></body></html>
