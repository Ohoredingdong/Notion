<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Market Mood</title>
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --line:#ebe9e4; --soft:#f7f6f3; --soft2:#faf9f6;
  --text:#232320; --sub:#6f706a; --muted:#a09f98; --shadow:0 8px 24px rgba(25,25,22,.035);
  --fear1:#d95b59; --fear2:#ea9450; --neutral:#d8bf59; --greed:#8cab57; --greed2:#6b9164;
  --state:#8cab57;
  --control-bg:rgba(255,255,255,.92); --control-line:#e8e6e1;
}
html[data-theme="dark"]{
  --bg:#1c1c1b; --panel:#212120; --line:#353531; --soft:#262624; --soft2:#232321;
  --text:#efefea; --sub:#c1c1bb; --muted:#8d8e89; --shadow:none;
  --fear1:#ef8681; --fear2:#f3a86c; --neutral:#d9c46e; --greed:#98bf65; --greed2:#7ca17e;
  --state:#98bf65; --control-bg:rgba(36,36,34,.92); --control-line:#3a3a36;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;min-height:100%}
body{padding:8px;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
.widget-root{position:relative;width:min(100%,364px);max-width:100%;margin:0 auto;transition:width .18s ease}
.widget-root[data-size="compact"]{width:min(100%,332px)}
.widget-root[data-size="normal"]{width:min(100%,364px)}
.widget-root[data-size="large"]{width:min(100%,430px)}
.widget{width:100%;height:462px;min-height:462px;max-height:462px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;box-shadow:var(--shadow);transition:padding .18s ease;display:flex;flex-direction:column;overflow:hidden}
.widget.size-compact{width:100%;height:448px;min-height:448px;max-height:448px;padding:12px 12px 10px}
.widget.size-large{width:100%;height:486px;min-height:486px;max-height:486px;padding:18px 18px 14px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.brand{display:flex;gap:10px;align-items:flex-start}
.brand-copy{display:flex;flex-direction:column}
.title{font-size:22px;font-weight:740;letter-spacing:-.04em;line-height:1.02}
.subtitle{margin-top:4px;font-size:12px;color:var(--sub);font-weight:560}
.updated{font-size:11px;color:var(--muted);font-weight:560;white-space:nowrap;margin-top:3px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:12px 0 12px;padding:4px;border:1px solid var(--line);border-radius:11px;background:linear-gradient(180deg,var(--soft2),var(--soft))}
.tab{height:31px;border:1px solid transparent;background:transparent;border-radius:8px;cursor:pointer;font-size:10.5px;font-weight:720;color:var(--sub);transition:.16s ease}
.tab:hover{background:var(--soft)}
.tab.active{background:var(--panel);border-color:var(--line);color:var(--text)}
.section-label{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-top:2px}
.section-title{font-size:16px;font-weight:720;letter-spacing:-.02em}
.section-meta{font-size:11px;color:var(--muted);font-weight:560}
.score-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:10px}
.score-wrap{display:flex;align-items:flex-end;gap:6px}
.score{font-size:42px;line-height:1;font-weight:760;letter-spacing:-.05em;color:var(--state)}
.score-unit{font-size:17px;color:var(--sub);font-weight:620;margin-bottom:4px}
.delta-box{text-align:right}
.delta-title{font-size:11px;color:var(--sub);font-weight:620}
.delta-sub{margin-top:4px;font-size:11px;color:var(--muted)}
.gauge{margin-top:12px}
.gauge-track{position:relative;height:11px;border-radius:999px;background:linear-gradient(90deg,var(--fear1) 0%, var(--fear2) 24%, var(--neutral) 49%, var(--greed) 74%, var(--greed2) 100%)}
.gauge-thumb{position:absolute;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);border-radius:999px;background:var(--panel);border:5px solid var(--state);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.gauge-scale,.gauge-zones{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.gauge-scale{margin-top:7px;font-size:10px;color:var(--muted);font-weight:580}
.gauge-scale span:nth-child(1){text-align:left}.gauge-scale span:nth-child(2),.gauge-scale span:nth-child(3),.gauge-scale span:nth-child(4){text-align:center}.gauge-scale span:nth-child(5){text-align:right}
.gauge-zones{margin-top:5px;font-size:10px;color:var(--sub);font-weight:600}
.gauge-zones span:nth-child(1){text-align:left}.gauge-zones span:nth-child(2),.gauge-zones span:nth-child(3),.gauge-zones span:nth-child(4){text-align:center}.gauge-zones span:nth-child(5){text-align:right}
.chart-wrap{margin-top:16px}
.chart-title{font-size:14px;font-weight:680;letter-spacing:-.02em}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;margin-top:10px;min-height:145px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:7px}
.bar-value{font-size:12px;font-weight:680;color:var(--text)}
.bar-shell{width:100%;max-width:26px;height:86px;border-radius:9px;background:var(--soft);display:flex;align-items:flex-end;justify-content:center;padding:0 0 0}
.bar{width:100%;border-radius:9px;background:color-mix(in srgb,var(--state) 28%, var(--soft));}
.bar.current{background:var(--state)}
.bar-date{font-size:11px;color:var(--muted);font-weight:560}
.footer{margin-top:auto;padding-top:7px;display:flex;justify-content:space-between;gap:8px;align-items:center;height:28px;min-height:28px;max-height:28px;overflow:hidden}
.source{min-width:0;flex:1;font-size:9.5px;color:var(--muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state-msg{flex:0 0 auto;font-size:9.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.state-msg button{height:22px;padding:0 8px;border:1px solid var(--line);background:var(--soft);border-radius:999px;font-size:9px;cursor:pointer}
.loading .score,.loading .bar-value,.loading .bar-date,.loading .source{opacity:.45}
.error-badge{display:none}
.error .error-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:10px;color:var(--muted);font-weight:620}
.controls{position:absolute;top:10px;right:-38px;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateX(6px);pointer-events:none;transition:opacity .18s ease, transform .18s ease}
.widget-root:hover .controls,.widget-root:focus-within .controls{opacity:1;transform:translateX(0);pointer-events:auto}
.ctrl{position:relative;width:28px;height:28px;border-radius:999px;border:1px solid var(--control-line);background:var(--control-bg);backdrop-filter:blur(5px);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(20,20,20,.06)}
.ctrl:hover{background:var(--panel)}
.ctrl[disabled]{opacity:.45;cursor:not-allowed}
.ctrl::after{content:attr(data-tip);position:absolute;right:36px;top:50%;transform:translateY(-50%);background:var(--panel);color:var(--sub);border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:10px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s ease}
.ctrl:hover::after,.ctrl:focus-visible::after{opacity:1}
.ctrl svg{width:14px;height:14px}
@media (hover:none),(pointer:coarse){.controls{opacity:1;transform:none;pointer-events:auto;right:-34px}}
@media (max-width:420px){.controls{right:6px;top:auto;bottom:-38px;flex-direction:row}.ctrl::after{display:none}}
@media (max-width:380px){.widget{width:min(100%,100%)}.title{font-size:20px}.score{font-size:38px}.chart{gap:8px}.bar-shell{max-width:23px;height:78px}.widget.size-large{width:min(100%,100%)}}
</style>
</head>
<body>
<div class="widget-root" id="root" data-size="normal">
  <div class="widget size-normal" id="widget">
    <div class="top">
      <div class="brand">
        <div class="brand-copy">
          <div class="title">Market Mood</div>
          <div class="subtitle">시장 온도</div>
        </div>
      </div>
      <div class="updated" id="updated">오늘 기준</div>
    </div>

    <div class="tabs" role="tablist" aria-label="market tabs">
      <button class="tab active" data-market="korea" role="tab" aria-selected="true">Korea</button>
      <button class="tab" data-market="us" role="tab" aria-selected="false">US</button>
      <button class="tab" data-market="crypto" role="tab" aria-selected="false">Crypto</button>
    </div>

    <div class="section-label">
      <div class="section-title" id="sectionTitle">오늘 지수</div>
      <div class="section-meta"><span class="error-badge" id="errorBadge">업데이트 지연</span></div>
    </div>

    <div class="score-row">
      <div class="score-wrap"><div class="score" id="score">—</div><div class="score-unit">/ 100</div></div>
      <div class="delta-box">
        <div class="delta-title" id="deltaTitle">어제: —</div>
        <div class="delta-sub" id="deltaSub">변화 없음</div>
      </div>
    </div>

    <div class="gauge">
      <div class="gauge-track"><div class="gauge-thumb" id="thumb" aria-hidden="true"></div></div>
      <div class="gauge-scale"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
      <div class="gauge-zones"><span>극심한 공포</span><span>공포</span><span>중립</span><span>탐욕</span><span>극심한 탐욕</span></div>
    </div>

    <div class="chart-wrap">
      <div class="chart-title">최근 7일 지수 흐름</div>
      <div class="chart" id="chart"></div>
    </div>

    <div class="footer">
      <div class="source" id="source">출처 로딩 중</div>
      <div class="state-msg">
        <div id="widgetState">loading...</div>
        <button id="retryBtn" type="button" hidden>Retry</button>
      </div>
    </div>
  </div>

  <div class="controls" aria-label="widget controls">
    <button class="ctrl" id="sizeBtn" data-tip="Size" type="button" aria-label="Size">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 8h14M5 12h10M5 16h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button class="ctrl" id="themeBtn" data-tip="Dark Mode" type="button" aria-label="Dark Mode">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.8a8.2 8.2 0 1 0 8.2 8.2A6.4 6.4 0 1 1 12 3.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
    <button class="ctrl" id="lockBtn" data-tip="Lock" type="button" aria-label="Lock">
      <svg id="lockIcon" viewBox="0 0 24 24" fill="none"><path d="M7 11V8.5a5 5 0 0 1 10 0V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="5" y="11" width="14" height="9" rx="2.5" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button class="ctrl" id="resetBtn" data-tip="Reset" type="button" aria-label="Reset">
      <svg viewBox="0 0 24 24" fill="none"><path d="M19 7v4h-4M5 17v-4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.5 9A6.5 6.5 0 0 0 6.6 7L5 11M6.5 15A6.5 6.5 0 0 0 17.4 17L19 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>
<script>
const STORAGE_KEY='widget.marketMood.controls.v1';
const initialTheme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
const fallbackData={
  korea:{market:'korea',updated_at:'2026-08-20T09:30:00+09:00',source_name:'Custom Korea Model',source_timestamp:'2026-08-20T09:30:00+09:00',headline:{score:52,rating:'neutral',previous_close:49,previous_1_week:46},history:[46,48,47,50,49,51,52].map((v,i)=>({timestamp:new Date(Date.now()-(6-i)*86400000).toISOString(),value:v}))},
  us:{market:'us',updated_at:'2026-08-21T00:00:00+00:00',source_name:'CNN Fear & Greed',source_timestamp:'2026-08-21T00:00:00+00:00',headline:{score:52.46,rating:'neutral',previous_close:57.03,previous_1_week:54},history:[48,51,54,55,57,58,52.46].map((v,i)=>({timestamp:new Date(Date.now()-(6-i)*86400000).toISOString(),value:v}))},
  crypto:{market:'crypto',updated_at:'2026-08-21T00:00:00+00:00',source_name:'Alternative.me',source_timestamp:'2026-08-21T00:00:00+00:00',headline:{score:72,rating:'greed',previous_close:68,previous_1_week:66},history:[59,60,62,63,67,69,72].map((v,i)=>({timestamp:new Date(Date.now()-(6-i)*86400000).toISOString(),value:v}))}
};
const tabMeta={korea:{section:'한국 시장 지수',label:'Custom Korea Model'},us:{section:'미국 시장 지수',label:'CNN Fear & Greed'},crypto:{section:'암호화폐 시장 지수',label:'Crypto Fear & Greed'}};
const ratingKo={'extreme fear':'극심한 공포','fear':'공포','neutral':'중립','greed':'탐욕','extreme greed':'극심한 탐욕'};
const app={market:'korea',data:{...fallbackData},loaded:{},status:'loading',ctrl:null};
const $=sel=>document.querySelector(sel);
function parseRating(r){return (r||'neutral').toString().trim().toLowerCase()}
function classify(score){score=Number(score);if(!Number.isFinite(score)) return 'neutral';if(score<25)return 'extreme fear';if(score<45)return 'fear';if(score<55)return 'neutral';if(score<75)return 'greed';return 'extreme greed'}
function colorForRating(r){r=parseRating(r); if(r==='extreme fear')return 'var(--fear1)'; if(r==='fear')return 'var(--fear2)'; if(r==='neutral')return 'var(--neutral)'; if(r==='greed')return 'var(--greed)'; return 'var(--greed2)'}
function fmtNum(n,d=0){const x=Number(n);return Number.isFinite(x)?new Intl.NumberFormat('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:d}).format(x):'—'}
function fmtTime(s){if(!s) return '—'; const d=new Date(s); if(isNaN(d)) return '—'; return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function dateChip(s){if(!s) return '오늘 기준'; const d=new Date(s); if(isNaN(d)) return '오늘 기준'; return `${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function shortDate(s){const d=new Date(s); if(isNaN(d)) return ''; return `${d.getMonth()+1}.${d.getDate()}`}
function loadCtrl(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch{return {}}}
function saveCtrl(){localStorage.setItem(STORAGE_KEY, JSON.stringify(app.ctrl))}
function applyTheme(theme){document.documentElement.dataset.theme=theme; app.ctrl.theme=theme; saveCtrl()}
function applySize(size){const widget=$('#widget'); const root=$('#root'); widget.classList.remove('size-compact','size-normal','size-large'); widget.classList.add(`size-${size}`); root.dataset.size=size; app.ctrl.size=size; saveCtrl(); updateControlStates()}
function updateControlStates(){const sizeBtn=$('#sizeBtn'); if(app.ctrl.locked){sizeBtn.disabled=true; sizeBtn.dataset.tip='Locked'; $('#lockIcon').innerHTML='<rect x="5" y="11" width="14" height="9" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8.7a4 4 0 0 1 8 0V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>';} else {sizeBtn.disabled=false; sizeBtn.dataset.tip='Size'; $('#lockIcon').innerHTML='<path d="M7 11V8.5a5 5 0 0 1 10 0V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="5" y="11" width="14" height="9" rx="2.5" stroke="currentColor" stroke-width="1.8"/>';}}
function setupControls(){app.ctrl={theme:initialTheme,size:'normal',locked:false,...loadCtrl()}; applyTheme(app.ctrl.theme); applySize(app.ctrl.size); $('#themeBtn').addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')); $('#sizeBtn').addEventListener('click',()=>{if(app.ctrl.locked) return; const order=['compact','normal','large']; const next=order[(order.indexOf(app.ctrl.size)+1)%order.length]; applySize(next)}); $('#lockBtn').addEventListener('click',()=>{app.ctrl.locked=!app.ctrl.locked; saveCtrl(); updateControlStates()}); $('#resetBtn').addEventListener('click',()=>{app.ctrl={theme:initialTheme,size:'normal',locked:false}; saveCtrl(); applyTheme(app.ctrl.theme); applySize(app.ctrl.size); updateControlStates()}); updateControlStates()}
function normalizeData(market,data){data.market=market; data.headline=data.headline||{}; data.headline.score=Number(data.headline.score); data.headline.previous_close=Number(data.headline.previous_close); if(!Array.isArray(data.history)) data.history=[]; data.history=data.history.map(row=>({...row,value:Number(row.value)})).filter(row=>Number.isFinite(row.value)).slice(-7); return data}
async function loadOne(market,path){try{ const res=await fetch(path,{cache:'no-store'}); if(!res.ok) throw new Error(res.status); const data=normalizeData(market, await res.json()); app.data[market]=data; app.loaded[market]=true; return true;} catch(err){ console.warn('fallback',market,err); app.data[market]=fallbackData[market]; app.loaded[market]=false; return false; }}
async function refreshAll(){app.status='loading'; render(); const results=await Promise.all([loadOne('korea','./korea-market-sentiment.json'),loadOne('us','./fear-greed-data.json'),loadOne('crypto','./crypto-fear-greed-data.json')]); app.status=results.every(Boolean)?'ready':'error'; render()}
function renderTabs(){document.querySelectorAll('.tab').forEach(btn=>{const active=btn.dataset.market===app.market; btn.classList.toggle('active',active); btn.setAttribute('aria-selected', String(active));})}
function renderMain(){const d=app.data[app.market]||fallbackData[app.market]; const h=d.headline||{}; const score=Number(h.score)||0; const rating=parseRating(h.rating||classify(score)); document.documentElement.style.setProperty('--state',colorForRating(rating)); $('#sectionTitle').textContent=tabMeta[app.market].section; $('#score').textContent=fmtNum(Math.round(score),0); $('#score').style.color=colorForRating(rating); $('#thumb').style.left=`${Math.max(0,Math.min(100,score))}%`; $('#updated').textContent=dateChip(d.updated_at||d.source_timestamp); const prev=Number(h.previous_close); $('#deltaTitle').textContent=`어제: ${Number.isFinite(prev)?fmtNum(prev,0):'—'} (${ratingKo[classify(prev)]||'—'})`; const delta=Number.isFinite(prev)?score-prev:null; const direction=delta==null?'변화 없음':delta>0?`${fmtNum(Math.abs(delta),0)} 상승`:delta<0?`${fmtNum(Math.abs(delta),0)} 하락`:'변화 없음'; $('#deltaSub').textContent=direction; const rows=(d.history||[]).slice(-7); const max=100; $('#chart').innerHTML=rows.map((row,i)=>{ const h=Math.max(14,(row.value/max)*86); const cls=i===rows.length-1?'bar current':'bar'; return `<div class="bar-col"><div class="bar-value">${fmtNum(row.value,0)}</div><div class="bar-shell"><div class="${cls}" style="height:${h}px"></div></div><div class="bar-date">${shortDate(row.timestamp)}</div></div>`}).join(''); const currentLoaded=!!app.loaded[app.market]; $('#source').textContent=`출처 · ${d.source_name||tabMeta[app.market].label}${d.market==='korea'?' · Custom':''}`; $('#root').classList.toggle('error', !currentLoaded); $('#root').classList.toggle('loading', app.status==='loading'); $('#widgetState').textContent=app.status==='loading'?'불러오는 중':currentLoaded?'':'업데이트 지연'; $('#retryBtn').hidden = currentLoaded || app.status==='loading'; }
function render(){renderTabs(); renderMain()}
function wire(){document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{app.market=btn.dataset.market; render()})); $('#retryBtn').addEventListener('click', refreshAll)}
setupControls(); wire(); render(); refreshAll();
</script>
</body>
</html>
