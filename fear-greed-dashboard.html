<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Market Sentiment</title><style>:root{--bg:#fff;--text:#20201e;--sub:#666762;--muted:#92938f;--line:#e9e9e6;--soft:#f7f7f5;--red:#df5757;--orange:#f07849;--yellow:#edc949;--lime:#9bce55;--green:#61b942}html[data-theme=dark]{--bg:#191919;--text:#f2f2ef;--sub:#b9b9b5;--muted:#8d8e89;--line:#30302f;--soft:#222221}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif}.widget{width:min(100%,1120px);margin:auto;background:var(--bg);border:1px solid var(--line);border-radius:15px;padding:22px}button{font:inherit;color:inherit}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.title{font-size:24px;font-weight:720;letter-spacing:-.035em}.subtitle{margin-top:6px;font-size:11px;color:var(--muted)}.update{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted);white-space:nowrap}.refresh{width:28px;height:28px;border:0;border-radius:7px;background:transparent;cursor:pointer;color:var(--muted)}.refresh:hover{background:var(--soft);color:var(--text)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:15px 0 16px;padding:4px;border:1px solid var(--line);border-radius:11px;background:var(--soft)}.tab{height:35px;border:0;border-radius:8px;background:transparent;color:var(--sub);cursor:pointer;font-size:11px;font-weight:700}.tab:hover{background:rgba(127,127,127,.07)}.tab.active{background:var(--bg);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{border:1px solid var(--line);border-radius:12px;background:var(--bg)}.hero{min-height:430px;padding:18px;display:flex;flex-direction:column;justify-content:space-between}.gauge-wrap{position:relative;width:min(100%,470px);margin:0 auto;aspect-ratio:2/1.14}.gauge{position:absolute;inset:0;width:100%;height:auto;overflow:visible}.arc{fill:none;stroke-width:14;stroke-linecap:round}.divider{stroke:var(--bg);stroke-width:2.8}.tick{stroke:var(--line);stroke-width:1}.tick-label{font-size:10px;fill:var(--sub)}.zone{font-size:9px;fill:var(--sub);text-anchor:middle}.needle{stroke:var(--text);stroke-width:5.8;stroke-linecap:round;transform-origin:150px 124px;transition:transform .65s cubic-bezier(.2,.75,.25,1)}.hub{fill:var(--text)}.score-block{position:absolute;left:50%;top:73%;transform:translateX(-50%);text-align:center;min-width:140px}.score{font-size:47px;line-height:.92;font-weight:680;letter-spacing:-.055em}.rating{margin-top:7px;font-size:19px;font-weight:680}.note{margin-top:10px;padding:11px 14px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:10px;line-height:1.55;color:var(--sub)}.right{display:grid;grid-template-rows:auto 1fr;gap:12px}.compare{display:grid;grid-template-columns:1fr 1fr}.compare-item{padding:15px 17px;min-height:92px}.compare-item:nth-child(odd){border-right:1px solid var(--line)}.compare-item:nth-child(-n+2){border-bottom:1px solid var(--line)}.compare-label{font-size:10px;color:var(--sub)}.compare-value{margin-top:7px;font-size:16px;font-weight:680}.compare-sub{margin-top:4px;font-size:10px;color:var(--muted)}.up{color:#3f984c}.down{color:#d45a58}.trend{padding:16px 16px 12px;min-height:216px}.section-title{font-size:12px;font-weight:680}.chart-box{height:160px;margin-top:8px}.chart{width:100%;height:100%;overflow:visible}.gridline{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}.axis{font-size:9px;fill:var(--muted)}.line{fill:none;stroke:var(--text);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.dot{fill:var(--bg);stroke:var(--text);stroke-width:2}.last-dot{fill:var(--text);stroke:var(--text)}.indicators{margin-top:12px;padding:17px 16px 14px}.indicator-row{display:grid;grid-template-columns:repeat(5,1fr);margin-top:12px}.indicator{min-width:0;padding:0 14px;border-right:1px solid var(--line);display:flex;gap:10px;align-items:center}.indicator:first-child{padding-left:0}.indicator:last-child{border-right:0;padding-right:0}.icon{width:34px;height:34px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:13px;flex:none}.i-name{font-size:9px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.i-value{margin-top:3px;font-size:15px;font-weight:680}.i-meta{margin-top:2px;font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footer{margin-top:10px;display:flex;justify-content:space-between;gap:12px;font-size:8.5px;color:var(--muted)}@media(max-width:820px){.widget{padding:16px}.grid{grid-template-columns:1fr}.indicator-row{grid-template-columns:repeat(2,1fr)}.indicator{padding:12px;border-bottom:1px solid var(--line);border-right:0}.indicator:nth-child(odd){border-right:1px solid var(--line)}}@media(max-width:520px){body{padding:4px}.widget{padding:13px}.title{font-size:18px}.subtitle{font-size:9px}.update .label{display:none}.tabs{margin:12px 0}.tab{height:33px}.hero{min-height:345px;padding:12px}.gauge-wrap{aspect-ratio:2/1.2}.score{font-size:40px}.rating{font-size:17px}.compare-item{padding:12px;min-height:82px}.indicator-row{grid-template-columns:1fr}.indicator,.indicator:nth-child(odd){border-right:0}.footer{flex-direction:column}}</style></head><body><main class="widget"><header class="top"><div><div class="title" id="title">Korea Market Sentiment</div><div class="subtitle" id="subtitle">한국 시장 심리지수 · 커스텀 모델</div></div><div class="update"><button class="refresh" id="refresh" aria-label="새로고침">↻</button><span class="label">마지막 업데이트</span><span id="updated">—</span></div></header><nav class="tabs" aria-label="시장 선택"><button class="tab active" data-market="korea">Korea</button><button class="tab" data-market="us">US</button><button class="tab" data-market="crypto">Crypto</button></nav><section class="grid"><article class="panel hero"><div class="gauge-wrap"><svg class="gauge" viewBox="0 0 300 170" aria-label="시장 심리 게이지"><path class="arc" stroke="var(--red)" d="M30 142 A120 120 0 0 1 52.9 71.5"/><path class="arc" stroke="var(--orange)" d="M52.9 71.5 A120 120 0 0 1 112.9 27.9"/><path class="arc" stroke="var(--yellow)" d="M112.9 27.9 A120 120 0 0 1 187.1 27.9"/><path class="arc" stroke="var(--lime)" d="M187.1 27.9 A120 120 0 0 1 247.1 71.5"/><path class="arc" stroke="var(--green)" d="M247.1 71.5 A120 120 0 0 1 270 142"/><g class="divider"><line x1="46.4" y1="66.8" x2="59.4" y2="76.2"/><line x1="110.4" y1="20.3" x2="115.4" y2="35.5"/><line x1="184.6" y1="35.5" x2="189.6" y2="20.3"/><line x1="240.6" y1="76.2" x2="253.6" y2="66.8"/></g><g><line class="tick" x1="29" y1="143" x2="20" y2="143"/><text class="tick-label" x="10" y="147">0</text><line class="tick" x1="65" y1="58" x2="58" y2="51"/><text class="tick-label" x="48" y="45">25</text><line class="tick" x1="150" y1="22" x2="150" y2="12"/><text class="tick-label" x="144" y="9">50</text><line class="tick" x1="235" y1="58" x2="242" y2="51"/><text class="tick-label" x="244" y="45">75</text><line class="tick" x1="271" y1="143" x2="280" y2="143"/><text class="tick-label" x="283" y="147">100</text></g><text class="zone" x="40" y="105">Extreme</text><text class="zone" x="40" y="115">Fear</text><text class="zone" x="87" y="102">Fear</text><text class="zone" x="150" y="64">Neutral</text><text class="zone" x="213" y="102">Greed</text><text class="zone" x="260" y="105">Extreme</text><text class="zone" x="260" y="115">Greed</text><line id="needle" class="needle" x1="150" y1="124" x2="150" y2="67"/><circle class="hub" cx="150" cy="124" r="3.8"/></svg><div class="score-block"><div class="score" id="score">—</div><div class="rating" id="rating">Loading</div></div></div><div class="note" id="note">데이터를 불러오는 중입니다.</div></article><div class="right"><article class="panel compare" id="compare"></article><article class="panel trend"><div class="section-title" id="trendTitle">최근 7거래일 추이</div><div class="chart-box"><svg class="chart" id="chart" viewBox="0 0 520 160" preserveAspectRatio="none"></svg></div></article></div></section><section class="panel indicators"><div class="section-title" id="indicatorTitle">구성 지표</div><div class="indicator-row" id="indicators"></div></section><footer class="footer"><span id="disclaimer">* 한국 지수는 커스텀 심리지수입니다.</span><span id="sourceState">데이터 확인 중</span></footer></main><script>const $=s=>document.querySelector(s),q=new URLSearchParams(location.search),th=q.get('theme');document.documentElement.dataset.theme=th==='light'||th==='dark'?th:(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');const meta={korea:{title:'Korea Market Sentiment',sub:'한국 시장 심리지수 · 커스텀 모델',file:'korea-market-sentiment.json',trend:'최근 7거래일 추이',ind:'구성 지표',disc:'* 한국 지수는 KOSPI·KOSDAQ·USD/KRW·모멘텀을 조합한 커스텀 심리지수입니다.'},us:{title:'US Fear & Greed',sub:'미국 증시 투자심리 · CNN 기반',file:'fear-greed-data.json',trend:'최근 7거래일 추이',ind:'세부 지표',disc:'* CNN Fear & Greed 데이터 기반 · 투자 판단의 단독 근거로 사용하지 마세요.'},crypto:{title:'Crypto Fear & Greed',sub:'암호화폐 투자심리 · Alternative.me 기반',file:'crypto-fear-greed-data.json',trend:'최근 7일 추이',ind:'참고 지표',disc:'* Alternative.me Crypto Fear & Greed 기반 · 투자 판단의 단독 근거로 사용하지 마세요.'}};const ko={'extreme fear':'극도의 공포',fear:'공포',neutral:'중립',greed:'탐욕','extreme greed':'극도의 탐욕'},en={'extreme fear':'Extreme Fear',fear:'Fear',neutral:'Neutral',greed:'Greed','extreme greed':'Extreme Greed'};let market='korea',cache={};function classify(v){v=+v;return v<25?'extreme fear':v<45?'fear':v<55?'neutral':v<75?'greed':'extreme greed'}function col(r){r=(r||'neutral').toLowerCase();return r==='extreme fear'?'var(--red)':r==='fear'?'var(--orange)':r==='neutral'?'var(--yellow)':r==='greed'?'var(--lime)':'var(--green)'}function fmt(v,d=1){return Number.isFinite(+v)?new Intl.NumberFormat('ko-KR',{maximumFractionDigits:d}).format(+v):'—'}function time(v){if(!v)return'—';let d=new Date(v);return isNaN(d)?'—':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}function note(r){return({'extreme fear':'극도의 공포 구간입니다. 위험 회피 심리가 매우 강한 상태입니다.',fear:'공포 구간입니다. 위험 회피 성향이 강해지고 있습니다.',neutral:'중립 구간입니다. 공포와 탐욕 어느 한쪽으로 크게 치우치지 않았습니다.',greed:'탐욕 구간입니다. 투자자들의 위험 선호가 높아지고 있습니다.','extreme greed':'극도의 탐욕 구간입니다. 과도한 낙관과 쏠림을 함께 점검하세요.'})[r]||'현재 시장 심리 상태를 확인하세요.'}function cmp(label,cur,prev){let delta=Number.isFinite(+prev)?cur-prev:null,cl=delta>0?'up':delta<0?'down':'',arrow=delta>0?'↑ ':delta<0?'↓ ':'';return`<div class="compare-item"><div class="compare-label">${label}</div><div class="compare-value ${cl}">${delta==null?'—':arrow+(delta>0?'+':'')+fmt(delta,1)}</div><div class="compare-sub">${prev==null?'비교 데이터 없음':fmt(prev,1)+' → '+fmt(cur,1)}</div></div>`}function usIndicators(d){let names={vix:['변동성 (VIX)','⌁'],momentum:['시장 모멘텀','↗'],strength:['주가 강도','▥'],put_call:['풋/콜 비율','⚖'],junk:['정크본드 수요','◎']};return Object.entries(names).map(([k,[label,icon]])=>{let o=(d.components||{})[k]||{};return{label,icon,value:o.raw_value!=null?fmt(o.raw_value,2):fmt(o.score,1),meta:ko[(o.rating||'').toLowerCase()]||o.rating||'',rating:o.rating||classify(o.score)}})}function normIndicators(d){if(Array.isArray(d.indicators))return d.indicators.map(x=>Array.isArray(x)?{label:x[0],icon:x[1],value:x[2],meta:x[3],rating:x[4]}:x);return usIndicators(d)}function render(d){let m=meta[market],h=d.headline||{},score=+h.score||0,r=(h.rating||classify(score)).toLowerCase();$('#title').textContent=m.title;$('#subtitle').textContent=m.sub;$('#trendTitle').textContent=m.trend;$('#indicatorTitle').textContent=m.ind;$('#disclaimer').textContent=m.disc;$('#updated').textContent=time(d.updated_at||d.source_timestamp||h.timestamp);$('#score').textContent=fmt(score,1);$('#rating').textContent=en[r]||en[classify(score)];$('#rating').style.color=col(r);$('#note').textContent=d.note||note(r);$('#needle').style.transform=`rotate(${-90+Math.max(0,Math.min(100,score))*1.8}deg)`;$('#compare').innerHTML=cmp('전일 대비',score,h.previous_close)+cmp('1주일 전 대비',score,h.previous_1_week)+cmp('1개월 전 대비',score,h.previous_1_month)+`<div class="compare-item"><div class="compare-label">1년 평균</div><div class="compare-value">${fmt(d.one_year_average??h.previous_1_year,1)}</div><div class="compare-sub">${ko[classify(d.one_year_average??h.previous_1_year)]||'—'}</div></div>`;draw(d.history||[]);let inds=normIndicators(d).slice(0,5);$('#indicators').innerHTML=inds.map(i=>`<div class="indicator"><div class="icon">${i.icon||'•'}</div><div><div class="i-name">${i.label||''}</div><div class="i-value" style="color:${col(i.rating)}">${i.value??'—'}</div><div class="i-meta">${i.meta||''}</div></div></div>`).join('');$('#sourceState').textContent=(d.source_name||'Source')+' · live data'}function draw(rows){rows=rows.slice(-7).map((r,i)=>typeof r==='number'?{timestamp:Date.now()-(6-i)*86400000,value:r}:r).filter(r=>Number.isFinite(+r.value));let W=520,H=160,l=40,r=12,t=10,b=28,pw=W-l-r,ph=H-t-b,pts=rows.map((o,i)=>({x:l+pw*(rows.length<2?0:i/(rows.length-1)),y:t+(100-o.value)/100*ph,o})),s='';[0,25,50,75,100].forEach(v=>{let y=t+(100-v)/100*ph;s+=`<line class="gridline" x1="${l}" y1="${y}" x2="${W-r}" y2="${y}"/><text class="axis" x="2" y="${y+3}">${v}</text>`});if(pts.length){let path=pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ');s+=`<path class="line" d="${path}"/>`;pts.forEach((p,i)=>{let d=new Date(p.o.timestamp||Date.now()),lab=`${d.getMonth()+1}/${d.getDate()}`;s+=`<circle class="${i===pts.length-1?'last-dot':'dot'}" cx="${p.x}" cy="${p.y}" r="3"/><text class="axis" x="${p.x}" y="152" text-anchor="middle">${lab}</text>`})}$('#chart').innerHTML=s}async function load(m=market,force=false){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.market===m));market=m;let mm=meta[m];if(cache[m]&&!force){render(cache[m]);return}$('#sourceState').textContent='데이터 확인 중';try{let res=await fetch(`${mm.file}?v=${Date.now()}`,{cache:'no-store'});if(!res.ok)throw 0;let d=await res.json();cache[m]=d;render(d)}catch(e){$('#sourceState').textContent='데이터 업데이트 대기 중';$('#note').textContent='데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.'}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>load(b.dataset.market));$('#refresh').onclick=()=>load(market,true);load('korea');</script></body></html>
