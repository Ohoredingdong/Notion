/* Centered tile bay; actual cabinet floor line is y856, excluding atlas padding. */
body .shell .fridge-stage{left:540.5px;bottom:162px;width:455px;height:calc(455px*994/570);max-width:none;aspect-ratio:auto;transform:none;perspective:2600px}
.fridge-doors{transform-style:preserve-3d}
body .shell .door.is-open{transform:rotateY(-105deg)}
body .shell .door.right.is-open{transform:rotateY(105deg)}
body .shell .display{padding:10px 8px}
body .shell .display-title{font-size:max(18px,calc(11px / var(--scene-scale,1)))}
body .shell .display-row{padding-top:10px;gap:5px}
body .shell .display-row .food-art{display:block;width:35px;height:38px}
body .shell .display-row b,body .shell .display-recipe-name{font-size:max(18px,calc(11px / var(--scene-scale,1)))}
body .shell .display-row small,body .shell .display-recipe-note{font-size:max(16px,calc(9px / var(--scene-scale,1)))}
/* Keep name/quantity together so both expiry dates fit even in a short panel. */
body .shell .display-row{display:block}
body .shell .display-row .food-art{display:none}
body .shell .display-row b,body .shell .display-row small{display:inline}
body .shell .display-row small{margin-left:5px}
body .shell .display-row small:last-child{display:block;margin-left:0}
body .shell .door-label{font-size:18px}
body .shell .quantity{font-size:max(16px,calc(11px / var(--scene-scale,1)))}
body .shell .seasoning-zone{left:5.46875%;top:33.203125%;width:21.875%;height:8.7890625%;visibility:visible;pointer-events:auto}
body .shell .counter-zone{left:74%;top:34%;width:22%;height:19%;visibility:visible;pointer-events:auto}
body .shell .seasoning-zone:after{content:&#x27;&#x27;;display:block;position:absolute;left:0;right:0;bottom:-14px;height:14px;z-index:-1;border-radius:3px;background:linear-gradient(#eac18d,#bf8e58);border-top:2px solid #f2d3a7;box-shadow:0 5px 6px #78542e35}
body .shell .seasoning-zone .item{width:var(--seasoning);height:var(--seasoning)}
body .shell .item.seasoning .item-name{font-size:max(18px,calc(12px / var(--scene-scale,1)))}
body .shell .item.decor{width:100px;height:125px}
body .shell .item.decor[data-art=&quot;cup&quot;]{width:110px;height:92px}
body .shell .item.meal{width:160px;height:125px}
body .shell .door-controls{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:10px 0 0;max-width:none;gap:6px}
body .shell .door-controls button{min-height:44px;padding:6px;font-size:12px}
@media(min-width:560px){body .shell .door-controls{grid-template-columns:repeat(4,minmax(0,1fr))}}
body .shell .room-caption{top:12px;left:12px;max-width:calc(100% - 24px);font-size:11px;padding:7px 10px}
body .shell .scene-note{display:none}
body[data-camera=&quot;fridge&quot;] .shell .seasoning-zone,body[data-camera=&quot;fridge&quot;] .shell .counter-zone{visibility:hidden;pointer-events:none}
body[data-camera=&quot;seasoning&quot;] .shell .fridge-stage,body[data-camera=&quot;counter&quot;] .shell .fridge-stage{visibility:hidden;pointer-events:none}
body[data-camera=&quot;seasoning&quot;] .shell .counter-zone,body[data-camera=&quot;counter&quot;] .shell .seasoning-zone{visibility:hidden;pointer-events:none}
body[data-camera=&quot;seasoning&quot;] .shell .door-controls,body[data-camera=&quot;counter&quot;] .shell .door-controls{display:none}
@media(max-width:360px){body .brand-icon{display:none}body .brand h1{font-size:20px}}

body[data-camera=&quot;fridge&quot;] .room-caption{width:1px;height:1px;padding:0;border:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* LCDs live outside the scaled/3D scene: browser text renders at final pixel size. */
body .shell .fridge-stage{filter:none}
.cabinet{filter:drop-shadow(6px 9px 7px #5d4c3428)}
.fridge-displays{position:absolute;inset:0;z-index:7;pointer-events:none}
.fridge-displays[hidden],.fridge-lcd[hidden]{display:none}
.fridge-lcd{
 position:absolute;container-type:inline-size;overflow:hidden;padding:1px;
 border:1px solid #c5c6ca;border-radius:11px;background:#e5e5ea;
 box-shadow:0 1px 3px #1c1c1e24;
 color:#1c1c1e;font-size:11px;line-height:1.3;pointer-events:none;filter:none;transform:none;
}
.fridge-lcd:after{content:none}
.lcd-screen{height:100%;min-width:0;display:flex;flex-direction:column;gap:4px;padding:5px;border-radius:9px;background:#f2f2f7}
.lcd-header{display:flex;align-items:center;justify-content:space-between;gap:3px;flex-shrink:0}
.lcd-title{font-size:11px;font-weight:650;line-height:1.2;letter-spacing:-.4px;white-space:normal;word-break:keep-all;color:#1c1c1e}
.lcd-total{flex-shrink:0;padding:2px 4px;border-radius:20px;background:#e3ecff;font-size:9px;font-weight:600;line-height:1.2;color:#005bbb;font-variant-numeric:tabular-nums}
.lcd-total.is-overdue{background:#ffebed;color:#b42331}
.lcd-counters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin:0;flex-shrink:0}
.lcd-counters&gt;div{display:flex;flex-direction:column;align-items:flex-start;min-width:0;padding:3px;border-radius:6px;background:var(--expiry-wash,#e9f5ed)}
.lcd-counters dt{font-size:9px;line-height:1.1;white-space:nowrap;color:#53535a}
.lcd-counters dd{margin:1px 0 0;font-size:13px;line-height:1.1;font-weight:650;font-variant-numeric:tabular-nums;color:var(--expiry,#246c46)}
.fridge-lcd [data-expiry-tone=&quot;today&quot;]{--expiry:#975015;--expiry-wash:#fff0e7}
.fridge-lcd [data-expiry-tone=&quot;tomorrow&quot;]{--expiry:#005bbb;--expiry-wash:#e9f0ff}
.fridge-lcd [data-expiry-tone=&quot;soon&quot;]{--expiry:#246c46;--expiry-wash:#e9f5ed}
.fridge-lcd [data-expiry-tone=&quot;overdue&quot;]{--expiry:#b42331;--expiry-wash:#ffebed}
.lcd-list{flex:1;min-height:0;display:grid;grid-template-rows:repeat(var(--lcd-rows),minmax(0,1fr));gap:0;padding:2px 4px;border-radius:8px;background:#fff}
.lcd-row{min-width:0;display:flex;align-items:center;gap:4px;padding:0;border:0;border-bottom:1px solid #f0f0f3;background:none}
.lcd-row:last-child{border-bottom:0}
.lcd-food{width:22px;height:24px;flex-shrink:0;display:block}
.lcd-food .food-art{width:100%;height:100%;filter:none}
.lcd-item-copy{min-width:0;flex:1}
.lcd-row b{display:block;font-size:clamp(12px,11cqw,13px);font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.3px}
.lcd-item-meta{display:flex;align-items:center;gap:4px;min-width:0;margin-top:1px;font-size:10px;line-height:1.2}
.lcd-deadline{display:flex;align-items:center;flex-shrink:0;font-size:inherit;font-weight:500;line-height:1.2;color:var(--expiry,#246c46)}
.lcd-deadline:before{content:none}
[data-expiry-tone=&quot;overdue&quot;] .lcd-deadline{font-weight:650}
.lcd-quantity{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#636366;font-variant-numeric:tabular-nums}
.lcd-empty{align-self:center;text-align:center;color:#636366;font-size:11px;line-height:1.4;word-break:keep-all}
.lcd-footer{display:flex;align-items:center;justify-content:space-between;gap:3px;font-size:10px;line-height:1.2;color:#636366;flex-shrink:0;white-space:nowrap}
.lcd-expiry-footer{flex-direction:column;align-items:stretch;gap:3px}
.lcd-expiry-footer&gt;span{display:none}
.lcd-expiry-track{display:flex;gap:2px;height:3px;overflow:hidden;border-radius:4px;background:#e5e5ea}
.lcd-expiry-track i{display:block;min-width:0;background:var(--expiry,#7a9570);border-radius:2px}
.lcd-recipe-facts{justify-content:center;gap:3px}
.lcd-recipe-facts&gt;span{padding:1px 4px;border-radius:20px;background:#fff;font-size:9px;color:#636366}
.lcd-level{color:#636366}
.lcd-menu{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:1;min-height:0;padding:3px;border-radius:8px;background:#fff}
.lcd-dish{display:grid;place-items:center;flex:1 1 20px;width:44px;min-height:20px;max-height:36px;overflow:hidden}
.lcd-dish .dish-art{display:block;width:100%;height:100%;filter:none}
.lcd-recipe{display:block;min-width:0;flex:0 0 auto;width:100%;font-size:clamp(12px,11cqw,13px);font-weight:600;line-height:1.2;text-align:center;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.3px}
.lcd-recipe-detail{flex-shrink:0;display:flex;flex-direction:column;gap:4px;padding:5px;border-radius:8px;background:#fff}
.lcd-stock{flex-shrink:0;font-size:10px;line-height:1.2;color:#636366}
.lcd-stock-label{display:flex;justify-content:space-between;gap:3px;min-width:0;white-space:nowrap}
.lcd-stock-label b{font-size:11px;font-weight:650;font-variant-numeric:tabular-nums;color:#005bbb}
.lcd-stock-track{height:3px;margin-top:3px;overflow:hidden;border-radius:4px;background:#e3ecff}
.lcd-stock-track i{display:block;height:100%;border-radius:4px;background:#006be6}
.lcd-missing{margin:0;padding-top:3px;border-top:1px solid #f0f0f3;font-size:9px;line-height:1.3;color:#636366;overflow-wrap:anywhere}
.lcd-missing span{display:block;margin-bottom:1px}
.lcd-missing b{display:block;font-size:10px;font-weight:500;color:#3a3a3c}
.fridge-lcd[data-lcd-layout=&quot;compact&quot;] .lcd-counters,.fridge-lcd[data-lcd-layout=&quot;summary&quot;] .lcd-counters,
.fridge-lcd[data-lcd-layout=&quot;compact&quot;] .lcd-total,.fridge-lcd[data-lcd-layout=&quot;summary&quot;] .lcd-total,

  setTargets(input){const next={};for(const k of Object.keys(NUTRIENTS)){const v=input[k];if(!amount(v)||v===0)throw new Error(&#x27;목표는 0보다 큰 수 또는 빈칸으로 입력해 주세요.&#x27;);next[k]=v;}state.targets=next;},
  record(input){
   if(state.meals.length&gt;=10000)throw new Error(&#x27;기록이 많아 새 입력을 멈췄어요.백업을 먼저 보관해 주세요.&#x27;);
   if(!input||!day(input.day)||!text(input.name)||typeof input.portion!==&#x27;string&#x27;||input.portion.length&gt;80||!input.nutrients||!Object.keys(NUTRIENTS).every(k=&gt;amount(input.nutrients[k])))throw new Error(&#x27;날짜와 식사·영양 입력값을 확인해 주세요.&#x27;);
   if(input.recipeId!==null)requireId(input.recipeId);
   const record={id:&#x27;meal-&#x27;+Date.now().toString(36)+&#x27;-&#x27;+(++seq),day:input.day,name:input.name.trim(),portion:input.portion,recipeId:input.recipeId,nutrients:clone(input.nutrients),source:&#x27;manual&#x27;};
   while(state.meals.some(m=&gt;m.id===record.id))record.id+=&#x27;x&#x27;;
   let earned=false;if(record.recipeId){if(!state.discovered.includes(record.recipeId))state.discovered.push(record.recipeId);if(!state.awarded.includes(record.recipeId)){state.awarded.push(record.recipeId);earned=true;}}
   state.meals.push(record);lastRemoved=null;return {record:clone(record),earned};
  },
  remove(id){const found=state.meals.find(m=&gt;m.id===id);if(!found)return false;lastRemoved=clone(found);state.meals=state.meals.filter(m=&gt;m.id!==id);return true;},
  undo(){if(!lastRemoved)return false;if(!state.meals.some(m=&gt;m.id===lastRemoved.id))state.meals.push(lastRemoved);lastRemoved=null;return true;},
  buy(id){const r=REWARDS[id];if(!r)throw new Error(&#x27;소품을 확인해 주세요.&#x27;);if(state.owned.includes(id))return false;if(summary(&#x27;&#x27;).tickets&lt;r.cost)throw new Error(&#x27;꾸밈권이 더 필요해요. 새 요리를 처음 기록하면 1개를 받아요.&#x27;);state.owned.push(id);return true;},
  equip(slot,id){if(![&#x27;frozenLeft&#x27;,&#x27;frozenRight&#x27;].includes(slot)||id!==null&amp;&amp;!state.owned.includes(id))throw new Error(&#x27;가지고 있는 소품을 골라 주세요.&#x27;);if(id)for(const key of Object.keys(state.equipped))if(state.equipped[key]===id)state.equipped[key]=null;state.equipped[slot]=id;},
  setGoal(goal){if(![&#x27;collection&#x27;,&#x27;recording&#x27;,&#x27;nutrition&#x27;].includes(goal))throw new Error(&#x27;목표를 확인해 주세요.&#x27;);state.goal=goal;},
  setLabel(label){if(!text(label,12))throw new Error(&#x27;이름표는 1~12자로 입력해 주세요.&#x27;);state.plateLabel=label.trim();}
 };
}
return {NUTRIENTS,REWARDS,blank,day,valid,validWorld,create};
});

function fields(values={},targets=false){return `&lt;div class=&quot;journal-fields&quot;&gt;${keys.map(k=&gt;{const [name,unit]=M.NUTRIENTS[k];return `&lt;label&gt;${name} &lt;small&gt;${unit}&lt;/small&gt;&lt;input name=&quot;${k}&quot; type=&quot;number&quot; step=&quot;any&quot; min=&quot;${targets?&#x27;0.01&#x27;:&#x27;0&#x27;}&quot; max=&quot;100000&quot; value=&quot;${values[k]??&#x27;&#x27;}&quot; placeholder=&quot;${targets?&#x27;미설정&#x27;:&#x27;미입력&#x27;}&quot;&gt;&lt;/label&gt;`;}).join(&#x27;&#x27;)}&lt;/div&gt;`;}

 const r=model.summary(viewDay),s=model.state();return `&lt;div class=&quot;journal-day&quot;&gt;&lt;label&gt;살펴볼 날짜&lt;input type=&quot;date&quot; id=&quot;journalDay&quot; value=&quot;${viewDay}&quot; required&gt;&lt;/label&gt;&lt;button type=&quot;button&quot; class=&quot;small-action primary&quot; data-log&gt;식사 기록&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;journal-note&quot;&gt;먹은 분량의 영양값을 직접 입력해요. 빈칸은 미입력으로 남고, 목표는 직접 정할 수 있어요.&lt;/p&gt;&lt;div class=&quot;nutrient-gauges&quot;&gt;${keys.map(k=&gt;{const n=r.nutrients[k],[name,unit]=M.NUTRIENTS[k],percent=n.percent===null?0:Math.min(100,n.percent);return `&lt;section class=&quot;nutrient-gauge&quot; data-nutrient=&quot;${k}&quot;&gt;&lt;span&gt;${name}&lt;/span&gt;&lt;strong&gt;${n.value===null?&#x27;미입력&#x27;:number(n.value)+&#x27; &lt;small&gt;&#x27;+unit+&#x27;&lt;/small&gt;&#x27;}&lt;/strong&gt;&lt;div class=&quot;gauge-track&quot; ${n.percent!==null?&#x27;role=&quot;progressbar&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot; aria-valuenow=&quot;&#x27;+number(percent)+&#x27;&quot; aria-label=&quot;&#x27;+name+&#x27; 목표 대비&quot;&#x27;:&#x27;&#x27;}&gt;&lt;i style=&quot;width:${percent}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;small&gt;${n.target===null?&#x27;목표 미설정&#x27;:n.percent===null?&#x27;목표 &#x27;+n.target+&#x27; &#x27;+unit:Math.round(n.percent)+&#x27;% · 목표 &#x27;+n.target+&#x27; &#x27;+unit}${n.missing?&#x27; · &#x27;+n.missing+&#x27;건 미입력&#x27;:&#x27;&#x27;}&lt;/small&gt;&lt;/section&gt;`;}).join(&#x27;&#x27;)}&lt;/div&gt;&lt;details class=&quot;journal-section&quot;&gt;&lt;summary&gt;하루 목표 설정&lt;/summary&gt;&lt;form id=&quot;targetsForm&quot;&gt;${fields(s.targets,true)}&lt;button class=&quot;small-action primary&quot; type=&quot;submit&quot;&gt;목표 저장&lt;/button&gt;&lt;/form&gt;&lt;/details&gt;&lt;section class=&quot;journal-section&quot;&gt;&lt;div class=&quot;journal-heading&quot;&gt;&lt;h3&gt;기록한 식사&lt;/h3&gt;&lt;button class=&quot;small-action&quot; type=&quot;button&quot; data-undo-meal&gt;취소 복구&lt;/button&gt;&lt;/div&gt;${r.rows.length?r.rows.map(m=&gt;`&lt;article class=&quot;journal-meal&quot;&gt;&lt;div&gt;&lt;strong&gt;${esc(m.name)}&lt;/strong&gt;&lt;small&gt;${esc(m.portion||&#x27;먹은 분량 메모 없음&#x27;)} · 직접 입력&lt;/small&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; data-remove-meal=&quot;${esc(m.id)}&quot;&gt;기록 취소&lt;/button&gt;&lt;/article&gt;`).join(&#x27;&#x27;):&#x27;&lt;p class=&quot;journal-empty&quot;&gt;아직 기록이 없어요. 실제로 먹은 한 끼부터 남겨 보세요.&lt;/p&gt;&#x27;}&lt;/section&gt;&lt;div class=&quot;journal-feedback&quot; role=&quot;status&quot;&gt;&lt;/div&gt;`;
}
function book(){
 const s=model.state(),r=model.summary(today());return `&lt;div class=&quot;journal-heading&quot;&gt;&lt;p&gt;&lt;strong&gt;${r.cooked.length} / ${C.length}&lt;/strong&gt; 요리 기록&lt;/p&gt;&lt;p&gt;꾸밈권 &lt;strong&gt;${r.tickets}&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;journal-note&quot;&gt;새 요리를 처음 식사로 기록하면 도감이 채워지고 꾸밈권 1개를 받아요. 재료와 조리법은 지금부터 볼 수 있어요.&lt;/p&gt;&lt;section class=&quot;goal-card&quot;&gt;&lt;label&gt;내가 고르는 목표&lt;select id=&quot;journalGoal&quot;&gt;${[[&#x27;collection&#x27;,&#x27;요리 도감 3장 채우기&#x27;],[&#x27;recording&#x27;,&#x27;오늘 식사 한 끼 기록하기&#x27;],[&#x27;nutrition&#x27;,&#x27;먹은 분량의 탄단지 기록하기&#x27;]].map(([key,label])=&gt;`&lt;option value=&quot;${key}&quot; ${key===s.goal?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${label}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;&lt;strong&gt;${r.goal.value}/${r.goal.target}${r.goal.value===r.goal.target?&#x27; · 달성했어요&#x27;:&#x27;&#x27;}&lt;/strong&gt;&lt;/section&gt;&lt;div class=&quot;recipe-book&quot;&gt;${C.map(recipe=&gt;{const count=s.meals.filter(m=&gt;m.recipeId===recipe.id).length,discovered=s.discovered.includes(recipe.id);return `&lt;button type=&quot;button&quot; data-book-recipe=&quot;${recipe.id}&quot; class=&quot;book-card ${count?&#x27;is-cooked&#x27;:&#x27;&#x27;}&quot;&gt;&lt;span class=&quot;book-art ${count?&#x27;&#x27;:&#x27;not-cooked&#x27;}&quot;&gt;${A.dishArt({id:recipe.name})}&lt;/span&gt;&lt;strong&gt;${esc(recipe.name)}&lt;/strong&gt;&lt;small&gt;${count?&#x27;요리 기록 &#x27;+count+&#x27;회&#x27;:discovered?&#x27;발견했어요 · 첫 요리 기다리는 중&#x27;:&#x27;살펴볼 수 있어요&#x27;}&lt;/small&gt;&lt;span class=&quot;book-stamp&quot;&gt;${count?&#x27;도감 등록&#x27;:recipe.time}&lt;/span&gt;&lt;/button&gt;`;}).join(&#x27;&#x27;)}&lt;/div&gt;`;
}
function detail(id){const recipe=find(id);if(!recipe)return;model.discover(id);save();K.showTray(recipe.name,`&lt;div class=&quot;journal-recipe-art&quot;&gt;${A.dishArt({id:recipe.name})}&lt;/div&gt;&lt;p class=&quot;journal-note&quot;&gt;${esc(recipe.desc)} · ${esc(recipe.time)}&lt;/p&gt;&lt;h3&gt;재료&lt;/h3&gt;&lt;dl class=&quot;recipe-amounts&quot;&gt;${Object.entries(recipe.amounts).map(([name,amount])=&gt;`&lt;div&gt;&lt;dt&gt;${esc(name)}&lt;/dt&gt;&lt;dd&gt;${esc(amount)}&lt;/dd&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/dl&gt;${recipe.water?&#x27;&lt;p class=&quot;journal-note&quot;&gt;&#x27;+esc(recipe.water)+&#x27;&lt;/p&gt;&#x27;:&#x27;&#x27;}&lt;h3&gt;만드는 순서&lt;/h3&gt;&lt;ol class=&quot;recipe-steps&quot;&gt;${recipe.steps.map(step=&gt;`&lt;li&gt;${esc(step)}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ol&gt;&lt;div class=&quot;tray-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;small-action&quot; data-preview-recipe=&quot;${id}&quot;&gt;조리대에 놓기&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;small-action primary&quot; data-log=&quot;${id}&quot;&gt;먹은 식사 기록&lt;/button&gt;&lt;/div&gt;`,&#x27;MY RECIPE BOOK&#x27;);}
function logForm(recipeId=null){
 const recipe=find(recipeId),chosen=recipeId||&#x27;&#x27;;K.showTray(&#x27;먹은 한 끼를 기록해요&#x27;,`&lt;form id=&quot;mealForm&quot;&gt;&lt;div class=&quot;journal-fields&quot;&gt;&lt;label&gt;날짜&lt;input type=&quot;date&quot; name=&quot;day&quot; value=&quot;${viewDay}&quot; required&gt;&lt;/label&gt;&lt;label&gt;도감에 연결할 요리&lt;select name=&quot;recipeId&quot;&gt;&lt;option value=&quot;&quot;&gt;직접 입력한 식사&lt;/option&gt;${C.map(r=&gt;`&lt;option value=&quot;${r.id}&quot; ${r.id===chosen?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${esc(r.name)}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;&lt;label&gt;식사 이름&lt;input name=&quot;name&quot; value=&quot;${esc(recipe?.name||&#x27;&#x27;)}&quot; required maxlength=&quot;120&quot; placeholder=&quot;먹은 음식&quot;&gt;&lt;/label&gt;&lt;label&gt;먹은 분량 메모&lt;input name=&quot;portion&quot; maxlength=&quot;80&quot; placeholder=&quot;예: 반 공기, 1인분&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;h3 class=&quot;journal-subtitle&quot;&gt;먹은 분량 전체의 영양값&lt;/h3&gt;&lt;p class=&quot;journal-note&quot;&gt;제품 영양표나 확인한 자료를 보고 입력하세요. 레시피에서 영양값을 자동 추정하지 않아요. 모르는 값은 비워 두어도 식사를 기록할 수 있어요.&lt;/p&gt;${fields()}&lt;button type=&quot;submit&quot; class=&quot;small-action primary&quot;&gt;식사 기록하기&lt;/button&gt;&lt;div class=&quot;journal-feedback&quot; role=&quot;status&quot;&gt;&lt;/div&gt;&lt;/form&gt;`,&#x27;MY MEAL&#x27;);
}
function rewards(){
 const s=model.state(),r=model.summary(today());return `&lt;div class=&quot;journal-heading&quot;&gt;&lt;strong&gt;꾸밈권 ${r.tickets}개&lt;/strong&gt;&lt;span&gt;소품 ${s.owned.length} / ${Object.keys(M.REWARDS).length}&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;journal-note&quot;&gt;처음 기록한 서로 다른 요리마다 꾸밈권 1개를 받아요. 같은 요리는 다시 지급되지 않고, 기록을 취소해도 받은 꾸밈권은 유지돼요.&lt;/p&gt;&lt;label class=&quot;journal-select&quot;&gt;붙일 곳&lt;select id=&quot;rewardSlot&quot;&gt;&lt;option value=&quot;frozenLeft&quot; ${slot===&#x27;frozenLeft&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;냉동 왼쪽 문&lt;/option&gt;&lt;option value=&quot;frozenRight&quot; ${slot===&#x27;frozenRight&#x27;?&#x27;selected&#x27;:&#x27;&#x27;}&gt;냉동 오른쪽 문&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;div class=&quot;reward-catalog&quot;&gt;${Object.entries(M.REWARDS).map(([id,reward])=&gt;{const owned=s.owned.includes(id),equipped=s.equipped[slot]===id;return `&lt;article class=&quot;reward-card&quot;&gt;&lt;span class=&quot;reward-art&quot;&gt;${charm(id,s.plateLabel)}&lt;/span&gt;&lt;strong&gt;${reward.name}&lt;/strong&gt;&lt;small&gt;${owned?&#x27;가지고 있어요&#x27;:&#x27;꾸밈권 &#x27;+reward.cost+&#x27;개&#x27;}&lt;/small&gt;&lt;button type=&quot;button&quot; class=&quot;small-action ${owned?&#x27;&#x27;:&#x27;primary&#x27;}&quot; ${!owned&amp;&amp;r.tickets&lt;reward.cost?&#x27;disabled&#x27;:&#x27;&#x27;} data-reward=&quot;${id}&quot;&gt;${equipped?&#x27;붙여 두었어요&#x27;:owned?&#x27;여기에 붙이기&#x27;:&#x27;선택해서 받기&#x27;}&lt;/button&gt;&lt;/article&gt;`;}).join(&#x27;&#x27;)}&lt;/div&gt;${s.owned.includes(&#x27;plate&#x27;)?`&lt;form id=&quot;plateForm&quot; class=&quot;journal-section&quot;&gt;&lt;label&gt;이름표 문구&lt;input name=&quot;label&quot; value=&quot;${esc(s.plateLabel)}&quot; maxlength=&quot;12&quot; required&gt;&lt;/label&gt;&lt;button class=&quot;small-action&quot; type=&quot;submit&quot;&gt;문구 바꾸기&lt;/button&gt;&lt;/form&gt;`:&#x27;&#x27;}&lt;button type=&quot;button&quot; class=&quot;small-action&quot; data-clear-charm&gt;선택한 문의 소품 떼기&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;small-action primary&quot; data-see-fridge&gt;냉장고에서 보기&lt;/button&gt;&lt;div class=&quot;journal-feedback&quot; role=&quot;status&quot;&gt;&lt;/div&gt;`;
}
function backup(){return `&lt;p class=&quot;journal-note&quot;&gt;이 시안의 재료·문 상태·식사·영양 목표·도감·소품을 함께 보관해요. 기존 앱 기록은 읽거나 변경하지 않아요.&lt;/p&gt;&lt;p class=&quot;journal-save-status&quot;&gt;${statusText()}&lt;/p&gt;&lt;label class=&quot;journal-select&quot;&gt;복사해서 보관할 기록&lt;textarea id=&quot;journalExport&quot; rows=&quot;5&quot; readonly&gt;${esc(JSON.stringify(envelope(),null,2))}&lt;/textarea&gt;&lt;/label&gt;${originalRaw?&#x27;&lt;details class=&quot;journal-section&quot;&gt;&lt;summary&gt;읽지 못한 이전 원본 보관&lt;/summary&gt;&lt;textarea rows=&quot;4&quot; readonly&gt;&#x27;+esc(originalRaw)+&#x27;&lt;/textarea&gt;&lt;/details&gt;&#x27;:&#x27;&#x27;}&lt;form id=&quot;importForm&quot; class=&quot;journal-section&quot;&gt;&lt;label&gt;이 시안의 백업 붙여넣기&lt;textarea name=&quot;backup&quot; rows=&quot;5&quot; required&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;p class=&quot;journal-note&quot;&gt;형식을 확인한 뒤 이 시안의 현재 기록을 교체해요. 읽기 오류나 다른 화면과 충돌이 있으면 원본 저장은 유지하고 임시로 불러와요.&lt;/p&gt;&lt;button class=&quot;small-action primary&quot; type=&quot;submit&quot;&gt;이 기록 불러오기&lt;/button&gt;&lt;div class=&quot;journal-feedback&quot; role=&quot;status&quot;&gt;&lt;/div&gt;&lt;/form&gt;`;}
function feedback(message){const node=$(&#x27;#trayContent .journal-feedback&#x27;);if(node)node.textContent=message;else $(&#x27;#liveMessage&#x27;).textContent=message;}
function inputNumbers(form){return Object.fromEntries(keys.map(k=&gt;[k,form.get(k)===&#x27;&#x27;?null:Number(form.get(k))]));}
document.addEventListener(&#x27;click&#x27;,event=&gt;{const b=event.target.closest(&#x27;button&#x27;);if(!b)return;try{
 if(b.id===&#x27;openJournal&#x27;)show(&#x27;nutrition&#x27;);if(b.dataset.journal)show(b.dataset.journal);
 if(b.dataset.bookRecipe)detail(b.dataset.bookRecipe);
 if(b.hasAttribute(&#x27;data-log&#x27;))logForm(b.dataset.log||null);
 if(b.dataset.previewRecipe)K.chooseRecipe(find(b.dataset.previewRecipe).name);
 if(b.dataset.removeMeal){model.remove(b.dataset.removeMeal);save();show(&#x27;nutrition&#x27;);feedback(&#x27;기록을 취소했어요. 영양 합계도 다시 계산했어요.&#x27;);}
 if(b.hasAttribute(&#x27;data-undo-meal&#x27;)){if(model.undo()){save();show(&#x27;nutrition&#x27;);feedback(&#x27;방금 취소한 기록을 복구했어요.&#x27;);}else feedback(&#x27;복구할 취소 기록이 없어요.&#x27;);}
 if(b.dataset.reward){const received=model.buy(b.dataset.reward);model.equip(slot,b.dataset.reward);save();show(&#x27;rewards&#x27;);feedback(received?&#x27;소품을 받았어요. 냉장고에 붙여 두었어요.&#x27;:&#x27;선택한 문에 붙였어요.&#x27;);}
 if(b.hasAttribute(&#x27;data-clear-charm&#x27;)){model.equip(slot,null);save();show(&#x27;rewards&#x27;);}
 if(b.hasAttribute(&#x27;data-see-fridge&#x27;)){document.querySelector(&#x27;.camera-tabs [data-camera=&quot;fridge&quot;]&#x27;).click();K.closeTray();}
}catch(e){feedback(e.message);}});
document.addEventListener(&#x27;change&#x27;,event=&gt;{try{const e=event.target;if(e.id===&#x27;journalDay&#x27;&amp;&amp;M.day(e.value)){viewDay=e.value;show(&#x27;nutrition&#x27;);}if(e.id===&#x27;journalGoal&#x27;){model.setGoal(e.value);save();show(&#x27;book&#x27;);}if(e.id===&#x27;rewardSlot&#x27;){slot=e.value;show(&#x27;rewards&#x27;);}if(e.name===&#x27;recipeId&#x27;&amp;&amp;e.closest(&#x27;#mealForm&#x27;)){const r=find(e.value);if(r)$(&#x27;#mealForm [name=&quot;name&quot;]&#x27;).value=r.name;}}catch(e){feedback(e.message);}});
document.addEventListener(&#x27;submit&#x27;,event=&gt;{const form=event.target;if(![&#x27;mealForm&#x27;,&#x27;targetsForm&#x27;,&#x27;plateForm&#x27;,&#x27;importForm&#x27;].includes(form.id))return;event.preventDefault();const f=new FormData(form);try{
 if(form.id===&#x27;mealForm&#x27;){const result=model.record({day:f.get(&#x27;day&#x27;),name:f.get(&#x27;name&#x27;),portion:f.get(&#x27;portion&#x27;),recipeId:f.get(&#x27;recipeId&#x27;)||null,nutrients:inputNumbers(f)});viewDay=f.get(&#x27;day&#x27;);save();show(&#x27;nutrition&#x27;);feedback(result.earned?&#x27;식사를 기록했어요. 도감이 채워지고 꾸밈권 1개를 받았어요.&#x27;:&#x27;식사를 기록했어요.&#x27;);}
 if(form.id===&#x27;targetsForm&#x27;){model.setTargets(inputNumbers(f));save();show(&#x27;nutrition&#x27;);feedback(&#x27;직접 정한 목표를 저장했어요.&#x27;);}
 if(form.id===&#x27;plateForm&#x27;){model.setLabel(f.get(&#x27;label&#x27;));save();show(&#x27;rewards&#x27;);}
 if(form.id===&#x27;importForm&#x27;){const data=JSON.parse(f.get(&#x27;backup&#x27;));if(!validEnvelope(data))throw new Error(&#x27;이 시안의 올바른 백업 형식인지 확인해 주세요. 원본은 변경하지 않았어요.&#x27;);loading=true;model=M.create(ids,data.play);K.restoreWorld(data.world);loading=false;save();show(&#x27;backup&#x27;);feedback(&#x27;백업을 불러왔어요.&#x27;);}
}catch(e){loading=false;feedback(e instanceof SyntaxError?&#x27;백업 JSON을 읽을 수 없어요. 현재 기록은 유지돼요.&#x27;:e.message);}});
window.addEventListener(&#x27;mini-kitchen:change&#x27;,()=&gt;{if(!loading)save();});
window.addEventListener(&#x27;mini-kitchen:layout&#x27;,updateDecorations);
window.addEventListener(&#x27;mini-kitchen:recipe&#x27;,event=&gt;{const recipe=C.find(r=&gt;r.name===event.detail.name);if(recipe){model.discover(recipe.id);save();}});
window.addEventListener(&#x27;storage&#x27;,event=&gt;{if(event.key===KEY&amp;&amp;event.newValue!==lastRaw){blocked=true;status=&#x27;conflict&#x27;;update();}});
window.addEventListener(&#x27;pageshow&#x27;,update);
window.KitchenJournal=Object.freeze({getSnapshot:()=&gt;model.state(),summary:date=&gt;model.summary(date||today()),get status(){return status;},storageKey:KEY});
update();
})();

&lt;/script&gt;
