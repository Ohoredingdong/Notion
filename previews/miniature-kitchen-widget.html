/* LCDs live outside the scaled/3D scene: browser text renders at final pixel size. */
body .shell .fridge-stage{filter:none}
.cabinet{filter:drop-shadow(6px 9px 7px #5d4c3428)}
.fridge-displays{position:absolute;inset:0;z-index:7;pointer-events:none}
.fridge-displays[hidden],.fridge-lcd[hidden]{display:none}
.door-live-display{position:absolute;display:block;z-index:1;transform-origin:0 0;backface-visibility:hidden;pointer-events:none}
/* Tall smoke-glass insets from the approved image concept, with native text.
   Reflections stay behind the content; they never blur labels or hit targets. */
.fridge-lcd{
 position:absolute;container-type:inline-size;overflow:hidden;padding:1px;
 border:1px solid #a6a298;border-radius:9px;
 background:radial-gradient(ellipse at 8% 5%,#eee5d51c,transparent 36%),radial-gradient(ellipse at 95% 48%,#a7a98616,transparent 45%),linear-gradient(155deg,#c4bcaa0a,transparent 34%,#332c230d 68%,#b7aa9410),rgba(52,50,47,.91);
 -webkit-backdrop-filter:blur(12px) saturate(.55);backdrop-filter:blur(12px) saturate(.55);
 box-shadow:inset 0 0 0 1px #ffffff2b,inset 0 1px 2px #ffffff24,0 1px 3px #362f2328;
 color:#fffefa;font-size:11px;line-height:1.3;pointer-events:none;filter:none;transform:none;
 --lcd-ring:clamp(40px,49cqw,64px);
}
.fridge-lcd:before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(ellipse 65% 18% at 4% 8%,#f2e2c222,transparent),radial-gradient(ellipse 42% 30% at 98% 40%,#52613e42,transparent),radial-gradient(ellipse 70% 16% at 0% 68%,#b19b6824,transparent),linear-gradient(115deg,#eee6d00b,transparent 36%,transparent 65%,#f7eddf05);filter:blur(6px);z-index:0}
.lcd-screen{position:relative;z-index:1;height:100%;min-width:0;display:flex;flex-direction:column;gap:5px;padding:7px;background:transparent}
.lcd-header{display:block;flex-shrink:0;padding:0;text-align:center}
.lcd-title{display:block;font-size:clamp(11px,10cqw,13px);font-weight:500;line-height:1.3;letter-spacing:-.3px;word-break:keep-all;text-align:center;color:#fffefa}
.lcd-total{display:none}
.lcd-counters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:46px 26px;gap:4px;margin:0;flex-shrink:0}
.lcd-counters>div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:0;padding:2px;border:1px solid #ffffff26;border-radius:7px;background:linear-gradient(140deg,#ffffff13,#ffffff05)}
.lcd-counters>div:first-child{grid-column:1/-1;justify-self:center;width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#ffffff13,#ffffff04);box-shadow:inset 0 0 0 3px #ffffff05}
.lcd-counters dt{font-size:9px;line-height:1.2;white-space:nowrap;color:#f7f5ef}
.lcd-counters dd{margin:0;font-size:14px;line-height:1.1;font-weight:400;font-variant-numeric:tabular-nums;color:#fffefa}
.lcd-counters>div:first-child dd{font-size:24px;line-height:1.1;margin-top:2px}
.fridge-lcd [data-expiry-tone="today"]{--expiry:#fff0d1;--expiry-bar:#edd2a2}
.fridge-lcd [data-expiry-tone="tomorrow"]{--expiry:#f0f5fa;--expiry-bar:#b9d4e9}
.fridge-lcd [data-expiry-tone="soon"]{--expiry:#eef7e6;--expiry-bar:#b4d4b8}
.fridge-lcd [data-expiry-tone="overdue"]{--expiry:#ffd4ca;--expiry-bar:#f0afa1}
.lcd-list{flex:1;min-height:0;display:grid;grid-template-rows:repeat(var(--lcd-rows),minmax(0,1fr));gap:0;border-top:1px solid #ffffff28;border-bottom:1px solid #ffffff28;background:none}
.lcd-row{min-width:0;display:flex;align-items:center;gap:5px;padding:1px 0;border-bottom:1px solid #ffffff20;background:none}
.lcd-row:last-child{border-bottom:0}
.lcd-food{width:24px;height:27px;flex-shrink:0;display:block}
.lcd-food .food-art{width:100%;height:100%;filter:none}
.lcd-item-copy{min-width:0;flex:1;text-align:center}
.lcd-row b{display:block;font-size:12px;font-weight:500;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.2px}
.lcd-item-meta{display:flex;align-items:center;justify-content:center;gap:3px;min-width:0;margin-top:2px;font-size:9px;line-height:1.2}
.lcd-deadline{display:flex;align-items:center;flex-shrink:0;font-size:inherit;font-weight:400;line-height:1.2;color:var(--expiry,#f3f5ed)}
.lcd-deadline:before{content:'·';padding-right:3px;color:#f7f5ef}
[data-expiry-tone="overdue"] .lcd-deadline{font-weight:600}
.lcd-quantity{order:-1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f7f5ef;font-variant-numeric:tabular-nums}
.lcd-empty{align-self:center;text-align:center;color:#f7f5ef;font-size:11px;line-height:1.5;word-break:keep-all}
.lcd-footer{display:flex;align-items:center;justify-content:center;gap:4px;font-size:9px;line-height:1.3;color:#f7f5ef;flex-shrink:0;text-align:center}
.lcd-expiry-footer{position:relative;min-height:13px}
.lcd-expiry-footer>span{display:block}
.fridge-lcd:has(.lcd-total.is-overdue) .lcd-expiry-footer>span{color:#ffd4ca;font-weight:600}
/* Keep the real distribution in the accessibility tree without another tiny
   chart competing with the circle and list in the approved composition. */
.lcd-expiry-track{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.lcd-recipe-facts{gap:4px;white-space:normal}
.lcd-recipe-facts>span{display:block;min-width:0;font-size:9px;line-height:1.2;text-align:center;word-break:keep-all}
.lcd-recipe-facts .lcd-level:before{content:'·';margin-right:4px}
.lcd-menu{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;flex:1;min-height:0;padding:0;background:none}
.lcd-dish{display:grid;place-items:center;flex:1 1 38px;width:100%;min-height:30px;max-height:92px;overflow:hidden}
.lcd-dish .dish-art{display:block;width:100%;height:100%;filter:none}
.lcd-recipe{display:block;min-width:0;flex:0 0 auto;width:100%;font-size:12px;font-weight:500;line-height:1.25;text-align:center;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.2px}
.lcd-recipe-detail{flex-shrink:0;display:flex;flex-direction:column;gap:5px;border-top:1px solid #ffffff28;padding-top:6px}
.lcd-stock{position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:var(--lcd-ring);align-items:center;justify-items:center;min-width:0;font-size:9px;line-height:1.2;color:#f7f5ef}
.lcd-stock:only-child{display:block;text-align:center;padding:5px 0}
.lcd-stock-label{grid-column:1;grid-row:1;display:flex;flex-direction:column-reverse;align-items:center;justify-content:center;gap:1px;z-index:1}
.lcd-stock-label>span{min-width:0;white-space:nowrap;font-size:8px}
.lcd-stock-label b{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;color:#fffefa}
.lcd-stock-track{grid-column:1;grid-row:1;width:var(--lcd-ring);height:var(--lcd-ring);border-radius:50%;background:conic-gradient(#a3ead6 var(--lcd-coverage,0%),#ffffff29 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 0);mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 0)}
.lcd-stock-track i{display:none}
.lcd-missing{display:block;min-width:0;margin:0;padding:5px 0 0;border-top:1px solid #ffffff28;font-size:9px;line-height:1.3;text-align:center;color:#f7f5ef;overflow-wrap:anywhere}
.lcd-missing span{display:block;margin-bottom:2px;word-break:keep-all}
.lcd-missing b{display:block;font-size:9px;font-weight:400;line-height:1.3;color:#fffefa;word-break:keep-all}

body .masthead{height:58px;gap:12px;margin:0;align-items:center}.brand-icon,.brand p{display:none!important}body .brand h1{font-size:25px;line-height:1.25;font-weight:700;letter-spacing:-.8px}.header-actions button{display:flex;align-items:center;gap:6px;min-width:68px;min-height:44px;padding:8px 10px;background:#fffdf9eF;border:1px solid #fff;border-radius:13px;font-size:14px;font-weight:550}.header-actions .icon{width:18px;height:18px}
.daily-balance{display:block;width:100%;text-align:left;border:1px solid #fff;border-radius:22px;background:#fffdf9f7;padding:17px 18px;box-shadow:0 4px 18px #55473309}.balance-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.balance-head b{font-size:19px;line-height:1.3;letter-spacing:-.4px}.balance-head>span{font-size:12px;color:#6b6258}.balance-values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.balance-value{min-width:0;padding:0 13px;border-left:1px solid #e2dbd2}.balance-value:first-child{padding-left:0;border-left:0}.balance-value:last-child{padding-right:0}.balance-name{display:block;font-size:13px;font-weight:600;margin-bottom:4px}.balance-number{display:flex;flex-wrap:wrap;gap:0 5px;align-items:baseline;font-variant-numeric:tabular-nums;min-height:34px}.balance-number strong{font-size:27px;line-height:1.25;font-weight:650;letter-spacing:-.8px;white-space:nowrap}.balance-number strong small{font-size:14px;font-weight:450;margin-left:1px}.balance-number>span{font-size:13px;color:#6b6258;white-space:nowrap}.balance-track{height:7px;background:#eae5df;border-radius:20px;overflow:hidden;margin-top:8px}.balance-track i{display:block;height:100%;background:var(--carb);border-radius:inherit}.balance-value:nth-child(2) .balance-track i{background:var(--protein)}.balance-value:nth-child(3) .balance-track i{background:var(--fat)}.balance-percent{display:block;font-size:12px;color:#61584e;margin-top:4px;text-align:right;font-variant-numeric:tabular-nums}.balance-empty,.balance-note{margin:11px 0 0;font-size:13px;line-height:1.5;color:#6b6258}.balance-status{display:block;font-size:12px;color:#925b42;margin-top:4px}
.expiry-summary{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:6px 0}.expiry-summary button{min-height:32px;padding:4px 8px;border:0;border-radius:10px;background:#fffdf7df;font-size:13px;color:#554b40;line-height:1.4}.expiry-summary b{font-size:14px;color:#85583f;margin-left:3px}.expiry-summary .overdue{color:#9c4b39}.expiry-summary button:hover{background:#fff}.expiry-summary>span{font-size:12px;color:#635b50}
.kitchen-view{display:block;position:relative}body .shell .kitchen-view .room{position:relative;height:var(--scene-height,480px);overflow:visible;border:0;border-radius:0;background:none;box-shadow:none}.room-caption,.scene-note{display:none!important}.scene-world{position:absolute;left:0;top:0;width:1000px;height:1200px;background:none;transform:scale(var(--scene-scale,1));transform-origin:top left}.room .fridge-stage{left:225px!important;bottom:25px!important;width:550px!important;height:calc(550px*994/570)!important;perspective:4000px;isolation:isolate}.cabinet{filter:drop-shadow(0 10px 5px #5e4e3730)}.cabinet>svg{border-radius:14px}.fridge-interiors{z-index:1}.fridge-doors{z-index:2}.door{border-radius:9px;transition:transform .56s cubic-bezier(.2,.7,.2,1)}body .shell .door.is-open,.door-cargo.is-open{transform:rotateY(-140deg)}body .shell .door.right.is-open,.door-cargo.right.is-open{transform:rotateY(140deg)}.door-back{background:none;box-shadow:none;overflow:visible}.door-back:after{display:none}.door-inside-art{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 2px #53473825)}
.door-cargo{position:absolute;z-index:3;transform-origin:left center;transform-style:preserve-3d;transition:transform .56s cubic-bezier(.2,.7,.2,1);pointer-events:none}.door-cargo.right{transform-origin:right center}.door-storage{position:absolute;inset:0;transform:rotateY(180deg);transform-style:flat;backface-visibility:hidden;pointer-events:none}.door-storage>.item{pointer-events:auto}.door-storage .item{width:150px;height:170px}.door-storage .food-art{width:100%;height:100%;filter:drop-shadow(0 5px 2px #5c493630)}.door-storage .item-label,.door-storage .item-name{display:none!important}.door-cargo.is-closing .door-storage{pointer-events:none}.door-storage .quantity{display:none}.fridge-charm.is-interior{position:absolute;pointer-events:none;filter:drop-shadow(0 3px 2px #66503620);z-index:0}.fridge-charm.is-interior .magnet-art{width:100%;height:100%}
.fridge-interiors .item{width:180px;height:170px}.fridge-interiors [data-zone^="frozen"] .item{width:205px;height:120px}.fridge-interiors [data-zone="freshRight"] .item{width:123px;height:170px}.fridge-interiors [data-zone="freshRight"] .item[data-item="tofu"]{width:180px}.fridge-interiors .food-art{width:100%;height:64%;align-self:start;filter:drop-shadow(0 4px 2px #51402b22)}.product-photo{object-fit:contain;border-radius:8px}.fridge-interiors .item-name{display:none!important}.fridge-interiors .item>.quantity{display:block;position:absolute;top:0;right:-2px;bottom:auto;left:auto;padding:1px 4px;border:1px solid #e4ded3;border-radius:5px;background:#fffdf8;color:#332e27;box-shadow:0 1px 2px #4d3a2010;font-size:calc(10px / var(--scene-scale,1));line-height:1.35;white-space:nowrap;pointer-events:none}
