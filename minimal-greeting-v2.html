<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Greeting · Life Town v2</title><link rel="stylesheet" href="./assets/life-town-v2.css"><style>
:root{--panel:#fff;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--line:#e5e5e8;--soft:#f7f7f8;--blue:#007aff;--yellow:#ffcc00;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}html[data-lt-theme="dark"]{--panel:#1c1c1e;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--line:#38383a;--soft:#2c2c2e;--blue:#0a84ff;--yellow:#ffd60a;--shadow:none}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}.root{width:100%;max-width:520px;margin:auto}.card{position:relative;min-height:138px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px 22px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;overflow:hidden}.card:before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:linear-gradient(90deg,transparent,#b8b8bd 22%,#f5f5f7 50%,#b8b8bd 78%,transparent);opacity:.52}.eyebrow{display:flex;align-items:center;gap:7px;font-size:8.8px;font-weight:680;color:var(--muted);letter-spacing:.04em}.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--yellow)}.greet{margin-top:9px;font-size:27px;line-height:1.08;font-weight:740;letter-spacing:-.05em}.name{display:inline-block;min-width:2px;outline:0;border-radius:7px;padding:1px 3px;transition:.12s}.name:hover,.name:focus{background:rgba(0,122,255,.08);color:var(--blue)}.date{margin-top:10px;font-size:9.5px;color:var(--sub);letter-spacing:.02em}.hint{margin-top:5px;font-size:8.8px;color:var(--muted);opacity:0;transition:.12s}.card:hover .hint,.name:focus~.hint{opacity:1}@media(max-width:390px){.greet{font-size:23px}.card{min-height:126px;padding:20px 18px 16px}}
</style></head><body><div class="root"><main class="card" data-widget-control-root data-control-sizes="380,450,520"><div class="eyebrow"><i></i><span id="period">TODAY</span></div><div class="greet"><span id="greeting">Good Evening</span> <span id="name" class="name" contenteditable="true" spellcheck="false"></span></div><div id="date" class="date"></div><div class="hint">이름 부분을 눌러 바로 수정할 수 있습니다.</div></main></div><script>
const K='lifetown_minimal_greeting_name_v1',nameEl=document.getElementById('name');nameEl.textContent=localStorage.getItem(K)||'';nameEl.addEventListener('input',()=>localStorage.setItem(K,nameEl.textContent.trim()));function render(){const d=new Date(),h=d.getHours();greeting.textContent=h<12?'Good Morning':h<18?'Good Afternoon':'Good Evening';period.textContent=h<12?'MORNING':h<18?'AFTERNOON':'EVENING';date.textContent=new Intl.DateTimeFormat('ko-KR',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(d)}render();setInterval(render,60000);</script><script src="./assets/life-town-controls-v2.js"></script></body></html>
