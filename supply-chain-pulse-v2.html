<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>공급망 Pulse · Life Town v2</title><link rel="stylesheet" href="./assets/life-town-v2.css"><style>
:root{--panel:#fff;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--line:#e5e5e8;--line2:#f0f0f2;--soft:#f7f7f8;--blue:#007aff;--green:#34c759;--yellow:#ffcc00;--red:#ff3b30;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}html[data-lt-theme="dark"]{--panel:#1c1c1e;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--line:#38383a;--line2:#2c2c2e;--soft:#2c2c2e;--blue:#0a84ff;--green:#30d158;--yellow:#ffd60a;--red:#ff453a;--shadow:none}*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}.root{width:100%;max-width:560px;margin:auto;container-type:inline-size}.widget{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px 14px 11px;box-shadow:var(--shadow);overflow:hidden}.widget:before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:linear-gradient(90deg,transparent,#b8b8bd 22%,#f5f5f7 50%,#b8b8bd 78%,transparent);opacity:.48}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:18px;font-weight:760;letter-spacing:-.04em}.subtitle{margin-top:4px;font-size:10px;color:var(--muted)}.update{font-size:8.8px;color:var(--muted);white-space:nowrap;padding-top:2px}.topgrid{display:grid;grid-template-columns:1fr 1.06fr;gap:9px;margin-top:11px}.card,.mini{border:1px solid var(--line);border-radius:16px;background:var(--panel)}.card{padding:12px}.ct{font-size:10.5px;font-weight:720;margin-bottom:10px}.metricrow{display:flex;justify-content:space-between;gap:10px;align-items:center}.metric{display:flex;align-items:flex-end;gap:4px}.metric .n{font-size:24px;font-weight:770;line-height:1;letter-spacing:-.04em}.metric .u{font-size:9px;color:var(--sub);padding-bottom:3px}.badge{display:inline-flex;align-items:center;min-height:23px;padding:0 8px;border-radius:999px;font-size:8.8px;font-weight:700;white-space:nowrap;background:var(--soft);color:var(--sub)}.badge.good{color:var(--green);background:rgba(52,199,89,.08)}.badge.warn{color:#8d7000;background:rgba(255,204,0,.10)}.badge.bad{color:var(--red);background:rgba(255,59,48,.07)}.badge.info{color:var(--blue);background:rgba(0,122,255,.07)}.subline{margin-top:7px;font-size:8.8px;color:var(--muted);line-height:1.4}.spark{height:110px}.spark svg{width:100%;height:100%;display:block}.grid line{stroke:var(--line2);stroke-width:1}.grid text{fill:var(--muted);font-size:8.4px}.labels{display:flex;justify-content:space-between;margin-top:4px;font-size:8.4px;color:var(--muted)}.bottom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:9px}.mini{padding:10px 11px 9px}.mt{font-size:10px;font-weight:720}.big{margin-top:8px;font-size:17px;font-weight:760;letter-spacing:-.03em;line-height:1.05}.unit{font-size:8.8px;color:var(--sub);font-weight:550}.mrow{display:flex;justify-content:space-between;gap:7px;align-items:flex-end;margin-top:7px}.note{font-size:8.8px;color:var(--muted);line-height:1.35}.delta{font-size:9px;font-weight:700;white-space:nowrap}.delta.good{color:var(--green)}.delta.bad{color:var(--red)}.sources{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:8.8px;color:var(--muted)}.sources a{color:inherit;text-decoration:none}.sources a:hover{color:var(--blue)}.loading,.error{padding:32px 8px;text-align:center;color:var(--muted);font-size:10px}@container(max-width:490px){.topgrid,.bottom{grid-template-columns:1fr}.spark{height:96px}.title{font-size:17px}}
</style></head><body><div class="root"><main class="widget" data-widget-control-root data-control-sizes="500,530,560"><header class="top"><div><div class="title">공급망 Pulse</div><div class="subtitle">공식·검증 가능한 공급망 지표</div></div><div class="update" id="updated">업데이트 확인 중</div></header><div id="content" class="loading">데이터를 불러오는 중...</div></main></div><script>
const $=s=>document.querySelector(s);function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function badge(s,t){return`<span class="badge ${t}">${esc(s)}</span>`}function rel(iso){let m=Math.max(0,Math.round((Date.now()-new Date(iso))/60000));if(m<60)return m<2?'방금 전':m+'분 전';let h=Math.floor(m/60);return h<24?h+'시간 전':Math.floor(h/24)+'일 전'}function chart(vals){let w=232,h=104,l=23,b=16,t=8,max=2,min=0,uw=h-b-t,y=v=>t+(max-v)/(max-min)*uw,bars='',lines='';[0,1,2].forEach(v=>{lines+=`<line x1="${l}" x2="${w-4}" y1="${y(v)}" y2="${y(v)}"/><text x="2" y="${y(v)+3}">${v.toFixed(0)}</text>`});vals.forEach((v,i)=>{let bw=18,g=13,x=l+i*(bw+g),yy=y(Math.max(0,v)),bh=h-b-yy;bars+=`<rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(2,bh)}" rx="2" fill="${i===vals.length-1?'var(--blue)':'rgba(142,142,147,.20)'}"/>`});return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><g class="grid">${lines}</g>${bars}</svg>`}function render(d){$('#updated').textContent=`업데이트 · ${rel(d.generated_at)}`;let g=d.gscpi,s=d.supplier_deliveries,w=d.wci,p=d.ism_prices,gChange=(g.value-g.previous).toFixed(2),gTone=g.value<g.previous?'good':'bad',gText=g.value<g.previous?'압력 완화':'압력 확대';$('#content').outerHTML=`<div id="content"><div class="topgrid"><section class="card"><div class="ct">글로벌 공급망 압력 · GSCPI</div><div class="metricrow"><div class="metric"><span class="n">${g.value.toFixed(2)}</span><span class="u">표준편차</span></div>${badge(gText,gTone)}</div><div class="subline">전월 ${g.previous.toFixed(2)} · 변화 ${Number(gChange)>0?'+':''}${gChange}<br>0 = 장기 평균, 양수 = 평균보다 높은 압력</div></section><section class="card"><div class="ct">최근 6개월 GSCPI</div><div class="spark">${chart(g.history.map(x=>x.value))}</div><div class="labels">${g.history.map(x=>`<span>${esc(x.label)}</span>`).join('')}</div></section></div><div class="bottom"><section class="mini"><div class="mt">공급 납기 · ISM</div><div class="big">${s.value.toFixed(1)} <span class="unit">index</span></div><div class="mrow"><div class="note">전월 ${s.previous.toFixed(1)}<br>50 초과 = 납기 지연</div><div class="delta ${s.change<=0?'good':'bad'}">${s.change<=0?'▼':'▲'} ${Math.abs(s.change).toFixed(1)}p</div></div></section><section class="mini"><div class="mt">해상운임 · Drewry WCI</div><div class="big">$${Number(w.value).toLocaleString()} <span class="unit">/40ft</span></div><div class="mrow"><div class="note">${esc(w.reference_date)}<br>주간 변화</div><div class="delta ${w.change_pct<=0?'good':'bad'}">${w.change_pct<=0?'▼':'▲'} ${Math.abs(w.change_pct).toFixed(0)}%</div></div></section><section class="mini"><div class="mt">원가 부담 · ISM Prices</div><div class="big">${p.value.toFixed(1)} <span class="unit">index</span></div><div class="mrow"><div class="note">전월 ${p.previous.toFixed(1)}<br>50 초과 = 가격 상승</div><div class="delta ${p.change<=0?'good':'bad'}">${p.change<=0?'▼':'▲'} ${Math.abs(p.change).toFixed(1)}p</div></div></section></div><div class="sources"><div><a href="${esc(d.sources.nyfed)}" target="_blank">NY Fed</a> · <a href="${esc(d.sources.ism)}" target="_blank">ISM</a> · <a href="${esc(d.sources.drewry)}" target="_blank">Drewry</a></div><div>${esc(d.data_as_of)}</div></div></div>`}async function load(){try{let r=await fetch('./supply-chain-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);render(await r.json())}catch{$('#content').className='error';$('#content').textContent='데이터를 불러오지 못했습니다.'}}load();
</script><script src="./assets/life-town-controls-v2.js"></script></body></html>
