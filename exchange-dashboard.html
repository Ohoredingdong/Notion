<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Exchange Widget</title>
<style>
:root{
  --bg:#ffffff;
  --text:#191919;
  --sub:#6f6f6f;
  --muted:#9a9a9a;
  --line:#ececec;
  --line-strong:#e5e5e5;
  --soft:#f7f7f6;
  --hover:#f5f5f4;
  --shadow:0 1px 2px rgba(15,15,15,.02);
}
html[data-theme="dark"]{
  --bg:#191919;
  --text:#f2f2ef;
  --sub:#b4b4b0;
  --muted:#888884;
  --line:#303030;
  --line-strong:#393939;
  --soft:#232323;
  --hover:#292929;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:transparent}
body{
  padding:8px;
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;
}
button,input{font:inherit;color:inherit}
button{appearance:none}
.widget{
  width:min(100%,900px);
  margin:0 auto;
  display:grid;
  grid-template-columns:29% 71%;
  min-height:222px;
  border:1px solid var(--line-strong);
  border-radius:10px;
  overflow:hidden;
  background:var(--bg);
  box-shadow:var(--shadow);
}
.left{
  min-width:0;
  padding:14px 16px 13px;
  display:flex;
  flex-direction:column;
  border-right:1px solid var(--line);
}
.heading-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}
.heading h1{
  margin:0;
  font-size:13px;
  line-height:1.2;
  font-weight:740;
  letter-spacing:-.02em;
}
.heading p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:9.5px;
  line-height:1.2;
}
.base{
  margin-top:20px;
  display:flex;
  align-items:center;
  gap:10px;
}
.won-mark{
  width:29px;
  height:29px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:var(--soft);
  color:#555;
  font-size:13px;
  font-weight:800;
}
.base-copy strong{
  display:block;
  font-size:10.5px;
  line-height:1.15;
}
.base-copy span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:8.5px;
}
.amount-wrap{margin-top:11px}
.amount{
  width:100%;
  padding:0;
  border:0;
  outline:0;
  background:transparent;
  font-size:26px;
  line-height:1.15;
  font-weight:610;
  letter-spacing:-.05em;
  font-variant-numeric:tabular-nums;
}
.controls{
  margin-top:auto;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px;
}
.tabs{
  display:flex;
  align-items:center;
  gap:16px;
}
.tab{
  position:relative;
  height:26px;
  padding:0;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:8.5px;
  cursor:pointer;
}
.tab.active{color:var(--text);font-weight:700}
.tab.active:after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:0;
  height:1.5px;
  border-radius:999px;
  background:var(--text);
}
.refresh-info{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  white-space:nowrap;
  font-size:8.2px;
}
.refresh-mini{
  width:21px;
  height:21px;
  display:grid;
  place-items:center;
  border:0;
  border-radius:6px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
}
.refresh-mini:hover{background:var(--hover);color:var(--text)}
.refresh-mini svg{width:12px;height:12px}
.right{
  min-width:0;
  padding:13px;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) 124px;
  grid-template-rows:1fr 1fr;
  gap:8px;
}
.currency-card,
.add-card{
  min-width:0;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--bg);
}
.currency-card{
  padding:10px 12px 9px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:background .12s ease,border-color .12s ease,transform .12s ease;
}
.currency-card:hover{
  background:var(--hover);
  border-color:var(--line-strong);
}
.card-top{
  min-width:0;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}
.currency-id{
  min-width:0;
  display:flex;
  align-items:flex-start;
  gap:9px;
}
.flag{
  width:20px;
  height:16px;
  flex:0 0 auto;
  display:grid;
  place-items:center;
  font-size:15px;
  line-height:1;
  overflow:hidden;
  border-radius:2px;
}
.copy{min-width:0}
.code{
  font-size:10px;
  font-weight:690;
  line-height:1.1;
  white-space:nowrap;
}
.name{
  margin-top:3px;
  color:var(--muted);
  font-size:8px;
  line-height:1.1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.remove{
  width:20px;
  height:20px;
  flex:0 0 auto;
  border:0;
  border-radius:5px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:12px;
  line-height:1;
  opacity:.7;
}
.remove:hover{background:var(--soft);color:var(--text);opacity:1}
.card-bottom{min-width:0;margin-top:9px}
.value{
  font-size:18px;
  line-height:1.08;
  font-weight:520;
  letter-spacing:-.035em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
.detail{
  margin-top:4px;
  color:var(--muted);
  font-size:8px;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-variant-numeric:tabular-nums;
}
.add-card{
  grid-column:3;
  grid-row:1 / span 2;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
  cursor:pointer;
  transition:background .12s ease,border-color .12s ease;
}
.add-card:hover{background:var(--hover);border-color:var(--line-strong)}
.add-inner{text-align:center;color:var(--text)}
.plus{font-size:19px;font-weight:300;line-height:1}
.add-label{margin-top:6px;font-size:9px;font-weight:640}
.add-panel{
  grid-column:3;
  grid-row:1 / span 2;
  display:none;
  flex-direction:column;
  gap:7px;
  min-width:0;
  padding:9px;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--bg);
}
.add-panel.open{display:flex}
.add-search-row{display:flex;gap:4px}
.search{
  width:100%;
  min-width:0;
  height:28px;
  padding:0 8px;
  border:1px solid var(--line);
  border-radius:6px;
  outline:0;
  background:var(--bg);
  font-size:8.5px;
}
.search:focus{border-color:#bdbdbd}
.close{
  width:28px;
  height:28px;
  flex:0 0 auto;
  border:0;
  border-radius:6px;
  background:var(--soft);
  color:var(--muted);
  cursor:pointer;
}
.results{overflow:auto;min-height:0}
.result{
  width:100%;
  min-height:28px;
  padding:0 4px;
  border:0;
  border-bottom:1px solid var(--line);
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  cursor:pointer;
  text-align:left;
  font-size:8px;
}
.result:last-child{border-bottom:0}
.result:hover{background:var(--hover)}
.result strong{font-size:8.3px}
.result span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:12px 2px;text-align:center;color:var(--muted);font-size:8px}
.loading .value,.loading .detail{opacity:.45}
.error-note{color:#b54f4f}
@media(max-width:760px){
  .widget{grid-template-columns:1fr}
  .left{border-right:0;border-bottom:1px solid var(--line)}
  .right{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto}
  .add-card,.add-panel{grid-column:1 / -1;grid-row:auto;min-height:64px}
}
@media(max-width:440px){
  body{padding:4px}
  .widget{border-radius:8px}
  .right{grid-template-columns:1fr}
  .add-card,.add-panel{grid-column:1}
  .amount{font-size:24px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="widget" id="widget">
  <section class="left">
    <div class="heading-row">
      <div class="heading">
        <h1>Exchange</h1>
        <p>KRW 기준</p>
      </div>
    </div>

    <div class="base">
      <div class="won-mark">₩</div>
      <div class="base-copy">
        <strong>KRW</strong>
        <span>대한민국 원</span>
      </div>
    </div>

    <div class="amount-wrap">
      <input id="amount" class="amount" inputmode="decimal" autocomplete="off" value="1000000" aria-label="원화 금액" />
    </div>

    <div class="controls">
      <div class="tabs" role="tablist" aria-label="표시 방식">
        <button class="tab active" type="button" data-mode="convert">환산</button>
        <button class="tab" type="button" data-mode="rate">환율</button>
      </div>
      <div class="refresh-info">
        <button class="refresh-mini" id="refresh" type="button" aria-label="환율 새로고침" title="새로고침">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M19 7v4h-4M5 17v-4h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M17.4 9A6.5 6.5 0 0 0 6.5 7L5 11M6.6 15A6.5 6.5 0 0 0 17.5 17L19 13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
        <span id="updated">—</span>
      </div>
    </div>
  </section>

  <section class="right" id="cards">
    <button class="add-card" id="addCard" type="button" aria-label="통화 추가">
      <div class="add-inner"><div class="plus">＋</div><div class="add-label">통화 추가</div></div>
    </button>
    <div class="add-panel" id="addPanel">
      <div class="add-search-row">
        <input id="search" class="search" type="search" autocomplete="off" placeholder="USD, 엔화…" aria-label="통화 검색" />
        <button id="closeAdd" class="close" type="button" aria-label="닫기">×</button>
      </div>
      <div id="results" class="results"></div>
    </div>
  </section>
</main>
<script>
const API='https://api.frankfurter.dev/v2/rates';
const STORAGE='notion_exchange_dashboard_v1';
const CURRENCIES={
  USD:{name:'미국 달러',symbol:'$',flag:'🇺🇸'},
  JPY:{name:'일본 엔',symbol:'¥',flag:'🇯🇵'},
  EUR:{name:'유로',symbol:'€',flag:'🇪🇺'},
  GBP:{name:'영국 파운드',symbol:'£',flag:'🇬🇧'},
  CNY:{name:'중국 위안',symbol:'¥',flag:'🇨🇳'},
  HKD:{name:'홍콩 달러',symbol:'HK$',flag:'🇭🇰'},
  TWD:{name:'대만 달러',symbol:'NT$',flag:'🇹🇼'},
  SGD:{name:'싱가포르 달러',symbol:'S$',flag:'🇸🇬'},
  AUD:{name:'호주 달러',symbol:'A$',flag:'🇦🇺'},
  CAD:{name:'캐나다 달러',symbol:'C$',flag:'🇨🇦'},
  CHF:{name:'스위스 프랑',symbol:'CHF',flag:'🇨🇭'},
  THB:{name:'태국 바트',symbol:'฿',flag:'🇹🇭'},
  VND:{name:'베트남 동',symbol:'₫',flag:'🇻🇳'},
  PHP:{name:'필리핀 페소',symbol:'₱',flag:'🇵🇭'},
  IDR:{name:'인도네시아 루피아',symbol:'Rp',flag:'🇮🇩'},
  MYR:{name:'말레이시아 링깃',symbol:'RM',flag:'🇲🇾'},
  INR:{name:'인도 루피',symbol:'₹',flag:'🇮🇳'},
  NZD:{name:'뉴질랜드 달러',symbol:'NZ$',flag:'🇳🇿'}
};
const ALIASES={
  '달러':'USD','미국':'USD','엔':'JPY','엔화':'JPY','일본':'JPY','유로':'EUR',
  '파운드':'GBP','영국':'GBP','위안':'CNY','위안화':'CNY','중국':'CNY',
  '홍콩':'HKD','대만':'TWD','싱가포르':'SGD','호주':'AUD','캐나다':'CAD',
  '스위스':'CHF','태국':'THB','바트':'THB','베트남':'VND','동':'VND',
  '필리핀':'PHP','인도네시아':'IDR','말레이시아':'MYR','인도':'INR','뉴질랜드':'NZD'
};
const state={
  selected:loadSelected(),
  rates:{},
  amount:1000000,
  mode:'convert',
  loading:false,
  error:'',
  updated:null
};
const $=s=>document.querySelector(s);
const amountEl=$('#amount'), cards=$('#cards'), addCard=$('#addCard'), addPanel=$('#addPanel'), search=$('#search'), results=$('#results'), updated=$('#updated');
applyTheme();
render();
fetchRates();
function applyTheme(){
  const p=new URLSearchParams(location.search).get('theme');
  const dark=matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.dataset.theme=(p==='light'||p==='dark')?p:(dark?'dark':'light');
}
function loadSelected(){
  try{
    const x=JSON.parse(localStorage.getItem(STORAGE));
    if(Array.isArray(x)&&x.length)return x.filter(c=>CURRENCIES[c]).slice(0,6);
  }catch(_){ }
  return ['USD','JPY','EUR','GBP'];
}
function saveSelected(){localStorage.setItem(STORAGE,JSON.stringify(state.selected));}
function parseAmount(v){
  const n=Number(String(v).replace(/[^\d.]/g,''));
  return Number.isFinite(n)&&n>=0?n:0;
}
function fmt(n,d=2){return new Intl.NumberFormat('ko-KR',{maximumFractionDigits:d}).format(n);}
function formatConverted(n){
  if(!Number.isFinite(n))return '—';
  if(Math.abs(n)>=100000)return fmt(n,0);
  if(Math.abs(n)>=1000)return fmt(n,1);
  return fmt(n,2);
}
function formatKRW(n){
  if(!Number.isFinite(n))return '—';
  if(Math.abs(n)>=1000)return fmt(n,0);
  return fmt(n,2);
}
function unitFor(code){return code==='JPY'?100:1;}
function escapeHtml(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');}
function render(){
  cards.querySelectorAll('.currency-card').forEach(n=>n.remove());
  state.selected.forEach((code,index)=>{
    const meta=CURRENCIES[code];
    const r=state.rates[code];
    const ok=Number.isFinite(r);
    const unit=unitFor(code);
    let value='—',detail='환율 불러오는 중';
    if(ok&&state.mode==='convert'){
      value=`${meta.symbol} ${formatConverted(state.amount*r)}`;
      detail=`${unit} ${code} = ₩${formatKRW((1/r)*unit)}`;
    }else if(ok){
      value=`₩ ${formatKRW((1/r)*unit)}`;
      detail=`${unit} ${code} 기준`;
    }
    const card=document.createElement('article');
    card.className='currency-card'+(state.loading?' loading':'');
    card.dataset.code=code;
    card.style.gridColumn=(index%2)+1;
    card.style.gridRow=Math.floor(index/2)+1;
    card.innerHTML=`
      <div class="card-top">
        <div class="currency-id">
          <div class="flag" aria-hidden="true">${escapeHtml(meta.flag)}</div>
          <div class="copy">
            <div class="code">${escapeHtml(code)}${code==='JPY'?' (100)':''}</div>
            <div class="name">${escapeHtml(meta.name)}</div>
          </div>
        </div>
        <button class="remove" type="button" data-remove="${escapeHtml(code)}" aria-label="${escapeHtml(code)} 삭제">×</button>
      </div>
      <div class="card-bottom">
        <div class="value">${escapeHtml(value)}</div>
        <div class="detail">${escapeHtml(detail)}</div>
      </div>`;
    cards.insertBefore(card,addCard);
  });
  cards.querySelectorAll('[data-remove]').forEach(btn=>btn.onclick=()=>removeCurrency(btn.dataset.remove));
  updated.textContent=state.updated?formatUpdated(state.updated):(state.loading?'불러오는 중…':'—');
  updated.classList.toggle('error-note',!!state.error);
  if(state.error)updated.textContent='불러오기 실패';
}
function formatUpdated(d){
  const pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
async function fetchRates(){
  if(state.loading)return;
  state.loading=true;state.error='';render();
  try{
    const quotes=state.selected.join(',');
    const res=await fetch(`${API}?base=KRW&quotes=${encodeURIComponent(quotes)}`,{cache:'no-store'});
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const rows=await res.json();
    const next={};
    for(const row of rows){
      if(row&&row.quote&&Number.isFinite(Number(row.rate)))next[row.quote]=Number(row.rate);
    }
    state.rates=next;
    state.updated=new Date();
  }catch(err){
    console.error(err);
    state.error='환율 데이터를 불러오지 못했습니다.';
  }finally{
    state.loading=false;render();
  }
}
function removeCurrency(code){
  if(state.selected.length<=1)return;
  state.selected=state.selected.filter(c=>c!==code);
  delete state.rates[code];saveSelected();render();fetchRates();
}
function addCurrency(code){
  if(!CURRENCIES[code]||state.selected.includes(code))return;
  if(state.selected.length>=6)return;
  state.selected.push(code);saveSelected();closeAdd();render();fetchRates();
}
function findCurrencies(q){
  const raw=q.trim(),low=raw.toLowerCase(),alias=ALIASES[raw];
  let list=Object.entries(CURRENCIES).filter(([code])=>!state.selected.includes(code));
  if(raw)list=list.filter(([code,meta])=>code.toLowerCase().includes(low)||meta.name.toLowerCase().includes(low)||alias===code);
  if(alias)list.sort(([a],[b])=>a===alias?-1:b===alias?1:0);
  return list.slice(0,8);
}
function renderResults(q=''){
  const list=findCurrencies(q);results.innerHTML='';
  if(!list.length){results.innerHTML='<div class="empty">추가할 통화가 없습니다.</div>';return;}
  for(const [code,meta] of list){
    const b=document.createElement('button');
    b.className='result';b.type='button';
    b.innerHTML=`<strong>${escapeHtml(code)}</strong><span>${escapeHtml(meta.name)}</span><span>＋</span>`;
    b.onclick=()=>addCurrency(code);results.appendChild(b);
  }
}
function openAdd(){
  if(state.selected.length>=6)return;
  addCard.style.display='none';addPanel.classList.add('open');search.value='';renderResults('');search.focus();
}
function closeAdd(){addPanel.classList.remove('open');addCard.style.display='flex';search.value='';results.innerHTML='';}
amountEl.addEventListener('input',e=>{state.amount=parseAmount(e.target.value);render();});
amountEl.addEventListener('focus',()=>amountEl.select());
amountEl.addEventListener('blur',()=>{amountEl.value=String(Math.round(state.amount));});
$('#refresh').onclick=fetchRates;
addCard.onclick=openAdd;
$('#closeAdd').onclick=closeAdd;
search.addEventListener('input',()=>renderResults(search.value));
search.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeAdd();
  if(e.key==='Enter'){
    const first=findCurrencies(search.value)[0];
    if(first)addCurrency(first[0]);
  }
});
document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{
  state.mode=btn.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===btn));
  render();
});
</script>
</body>
</html>
