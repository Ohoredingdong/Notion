<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>주담대 금리</title>
<link rel="stylesheet" href="./assets/life-town-v2.css">
<style>
:root{--bg:#fff;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--line:#e5e5e8;--soft:#f7f7f8;--blue:#007aff;--blue-soft:rgba(0,122,255,.07);--red:#ff3b30;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}
html[data-lt-theme="dark"]{--bg:#1c1c1e;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--line:#38383a;--soft:#2c2c2e;--blue:#0a84ff;--blue-soft:rgba(10,132,255,.13);--red:#ff453a;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px!important;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}.w{width:100%;max-width:330px;margin:auto;border:1px solid var(--line);border-radius:22px;background:var(--bg);overflow:hidden;box-shadow:var(--shadow);container-type:inline-size}.head{padding:13px 13px 11px;border-bottom:1px solid var(--line)}.eyebrow{font-size:8.8px;letter-spacing:.02em;color:var(--muted);font-weight:700}.title{font-size:17px;font-weight:760;letter-spacing:-.04em;margin-top:3px}.sub{font-size:10px;color:var(--muted);margin-top:4px}.badge{display:inline-flex;align-items:center;gap:4px;margin-top:7px;padding:4px 7px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-size:8.8px;font-weight:700}.hero{display:flex;align-items:flex-end;justify-content:space-between;padding:12px 13px;background:var(--soft);border-bottom:1px solid var(--line)}.hero-label{font-size:9.5px;color:var(--sub);font-weight:650}.hero-rate{font-size:26px;font-weight:740;letter-spacing:-.04em}.hero-note{font-size:8.8px;color:var(--muted);text-align:right;line-height:1.4}.rows{padding:0 13px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.name{font-size:11px;font-weight:700;white-space:nowrap}.desc{font-size:8.8px;color:var(--muted);margin-top:2px}.val{font-size:17px;font-weight:720;white-space:nowrap;font-variant-numeric:tabular-nums}.chg{font-size:8.8px;text-align:right;margin-top:2px}.up{color:var(--red)}.foot{display:flex;justify-content:space-between;gap:8px;padding:9px 13px;background:var(--soft);border-top:1px solid var(--line);font-size:8.8px;color:var(--muted)}.foot span:last-child{text-align:right}
@container(max-width:300px){.title{font-size:16px}.hero-rate{font-size:23px}.name{font-size:10.5px}.val{font-size:16px}}
</style>
<style id="finish-v3">body{padding:6px!important}.w{max-width:330px!important;border-radius:20px!important;box-shadow:none!important}.head{padding:12px 13px 10px!important}.eyebrow{font-size:8.9px!important}.title{font-size:18px!important}.sub{font-size:10px!important}.badge{margin-top:6px!important;font-size:8.7px!important;padding:4px 7px!important}.hero{padding:11px 13px!important;background:var(--bg)!important}.hero-label{font-size:9.5px!important}.hero-rate{font-size:25px!important}.hero-note{font-size:8.8px!important}.rows{padding:0 13px!important}.row{padding:10px 0!important}.name{font-size:10.8px!important}.desc{font-size:8.7px!important}.val{font-size:16px!important}.chg{font-size:8.7px!important}.foot{padding:8px 13px!important;background:var(--bg)!important;font-size:8.6px!important}</style><style>.foot a{color:inherit;text-decoration:none}.refresh-line{padding:8px 13px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);font-size:8.8px;color:var(--muted);line-height:1.5}.refresh-line span{flex:1}.refresh-line button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--sub);font:inherit;padding:4px 6px;border-radius:7px;cursor:pointer}.refresh-line[data-warning="true"]{color:#b06512}.down{color:var(--blue)}</style></head>
<body>
<main class="w" data-widget-control-root data-control-sizes="300,330,360">
<header class="head"><div class="eyebrow">공식 기준금리</div><div class="title">주담대 금리</div><div class="sub">한국은행 기준금리와 COFIX 체크</div><div class="badge">공식 발표 기준 · 실시간 은행 대출금리 아님</div></header>
<section class="hero"><div><div class="hero-label">한국은행 기준금리</div><div class="hero-rate" id="baseRate">—</div></div><div class="hero-note" id="baseNote">공식 자료 확인 중</div></section>
<section class="rows"><div class="row"><div><div class="name">신규취급액 COFIX</div><div class="desc">신규 조달비용 중심 기준</div></div><div><div class="val" id="cofix0">—</div><div class="chg" id="change0">—</div></div></div><div class="row"><div><div class="name">잔액기준 COFIX</div><div class="desc">기존 잔액의 조달비용 반영</div></div><div><div class="val" id="cofix1">—</div><div class="chg" id="change1">—</div></div></div><div class="row"><div><div class="name">신잔액기준 COFIX</div><div class="desc">포괄적 조달비용 반영</div></div><div><div class="val" id="cofix2">—</div><div class="chg" id="change2">—</div></div></div></section>
<footer class="foot"><span><a href="https://www.bok.or.kr/portal/singl/baseRate/list.do?menuNo=200643" target="_blank" rel="noopener noreferrer">한국은행</a> · <a href="https://portal.kfb.or.kr/fingoods/cofix.php" target="_blank" rel="noopener noreferrer">은행연합회</a></span><span id="cofixPeriod">COFIX 공식 발표 확인 중</span></footer>
<div class="refresh-line"><span id="rateStatus" role="status" aria-live="polite">공식 자료를 불러오고 있습니다.</span><button type="button" id="retryRates" aria-label="금리 자료 다시 불러오기">새로고침</button></div>
</main>
<script>
(()=>{
 const $=id=>document.getElementById(id),pct=n=>Number.isFinite(n)?n.toFixed(2)+'%':'—',day=s=>s?s.replaceAll('-','.'):'—';
 const delta=(n,p)=>{const d=n-p;return Math.abs(d)<.00001?'변동 없음':(d>0?'▲ +':'▼ ')+d.toFixed(2)+'%p'};
 let displayed=false;
 async function load(){
  $('retryRates').disabled=true;
  try{
   const response=await fetch('./mortgage-rates-data.json?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(15000)});
   if(!response.ok)throw new Error('HTTP '+response.status);
   const d=await response.json(),b=d.base_rate,c=d.cofix;
   const finiteRate=n=>typeof n==='number'&&Number.isFinite(n)&&n>=0&&n<=30;
   const validDay=value=>typeof value==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(value)&&Number.isFinite(Date.parse(value));
   if(!b||!c||!finiteRate(b.value)||!finiteRate(b.previous)||!validDay(b.changed_at)||!validDay(c.published_at)||!/^\d{4}-\d{2}$/.test(c.reference_month)||['new_funds','outstanding','new_outstanding'].some(k=>!finiteRate(c[k])||!finiteRate(c.previous?.[k])))throw new Error('공식 발표 자료 형식 오류');
   // Validate the complete response before replacing any visible rate.
   if(b&&Number.isFinite(b.value)){$('baseRate').textContent=pct(b.value);$('baseNote').replaceChildren(document.createTextNode(day(b.changed_at)+' 변경'),document.createElement('br'),document.createTextNode('직전 대비 '+delta(b.value,b.previous)));}
   if(c){['new_funds','outstanding','new_outstanding'].forEach((k,i)=>{if(!Number.isFinite(c[k]))throw new Error('COFIX 숫자 누락');$('cofix'+i).textContent=pct(c[k]);const el=$('change'+i),prev=c.previous?.[k];el.textContent=Number.isFinite(prev)?delta(c[k],prev):'이전 발표 없음';el.className='chg '+(c[k]>prev?'up':c[k]<prev?'down':'');});$('cofixPeriod').replaceChildren(document.createTextNode('기준월 '+day(c.reference_month)),document.createElement('br'),document.createTextNode('공시 '+day(c.published_at)));}
   displayed=true;
   const checked=new Date(d.checked_at),age=Date.now()-checked.getTime(),late=!Number.isFinite(age)||age>72*3600000;
   const warning=d.status!=='ok'||late;
   $('rateStatus').parentElement.dataset.warning=String(warning);
   const time=Number.isFinite(checked.getTime())?checked.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})+' KST':'확인 시각 없음';
   $('rateStatus').textContent=(warning?'갱신 지연 · 마지막 확인된 발표값 표시':'공식 발표 확인')+' · '+time+' · 매일 수집';
  }catch(error){$('rateStatus').textContent=displayed?'새로 불러오지 못했습니다. 마지막 표시값을 유지합니다.':'자료를 불러오지 못했습니다. 다시 시도해 주세요.';$('rateStatus').parentElement.dataset.warning='true';}
  finally{$('retryRates').disabled=false;}
 }
 $('retryRates').addEventListener('click',load);load();setInterval(load,300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
})();
</script>
<script src="./assets/life-town-controls-v2.js"></script>
</body>
</html>
