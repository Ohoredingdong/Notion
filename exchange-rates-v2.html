<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Exchange Rates v2</title><link rel="stylesheet" href="./assets/life-town-v2.css">
<style>
:root{--panel:#fff;--soft:#f7f7f8;--line:#e5e5e8;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--blue:#007aff;--green:#248a3d;--red:#d92d27;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}
html[data-theme="dark"],html[data-lt-theme="dark"]{--panel:#1c1c1e;--soft:#2c2c2e;--line:#38383a;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px 48px 8px 8px!important;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}
.shell{width:100%;max-width:500px;margin:0 auto}.widget{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:13px 13px 10px;box-shadow:var(--shadow)}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.title{font-size:17px;font-weight:760;letter-spacing:-.04em}.subtitle{margin-top:4px;font-size:9.5px;color:var(--muted)}.actions{display:flex;gap:5px}.icon{width:28px;height:28px;border:1px solid var(--line);border-radius:9px;background:var(--panel);display:grid;place-items:center;cursor:pointer}.icon svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.7}.icon.active{color:var(--blue);background:rgba(0,122,255,.06)}
.table{margin-top:11px;border-top:1px solid var(--line)}.thead,.row{display:grid;grid-template-columns:1.16fr .9fr .72fr .62fr;gap:7px;align-items:center}.thead{padding:7px 1px 5px;font-size:7.8px;color:var(--muted)}.row{padding:8px 1px;border-top:1px solid var(--line)}.currency{display:flex;align-items:baseline;gap:6px;min-width:0}.code{font-size:10.8px;font-weight:760}.name{font-size:8.2px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-size:10.7px;font-weight:740;text-align:right}.change,.pct{font-size:9.1px;font-weight:720;text-align:right}.up{color:var(--red)}.down{color:var(--blue)}
.chart-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:12px}.pair{font-size:9px;color:var(--sub);font-weight:700}.chart-price{font-size:17px;font-weight:780;letter-spacing:-.03em}.chart-change{margin-top:2px;font-size:8.5px;font-weight:720;text-align:right}.chart-wrap{height:82px;margin-top:5px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 0 2px}.chart{width:100%;height:100%;display:block;color:var(--blue)}.gridline{stroke:var(--line);stroke-width:1}.line{fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dot{fill:var(--blue);stroke:var(--panel);stroke-width:2}.axis{font-size:7px;fill:var(--muted)}
.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:7.8px;color:var(--muted)}
.loading{padding:34px;text-align:center;color:var(--muted);font-size:10px}@container(max-width:500px){.thead,.row{grid-template-columns:1fr .8fr .65fr .58fr}.name{display:none}}
</style></head>
<body><div class="shell"><main class="widget" id="widget" data-widget-control-root data-control-sizes="450,475,500">
<header class="header"><div><div class="title">Exchange Rates</div><div class="subtitle">주요 통화의 원화 환율과 USD/KRW 최근 흐름</div></div><div class="actions"><button class="icon" id="pinBtn" aria-label="고정"><svg viewBox="0 0 24 24"><path d="m15.8 3 5.2 5.2-3 1.2-2.8 5.2-2.1-2.1-4.4 4.4-1.1-1.1 4.4-4.4-2.1-2.1 5.2-2.8L15.8 3Z"/></svg></button><button class="icon" id="refreshBtn" aria-label="새로고침"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M17.5 9A6.5 6.5 0 0 0 6.6 7L4 12M6.5 15A6.5 6.5 0 0 0 17.4 17L20 12"/></svg></button></div></header>
<div id="content" class="loading">환율 데이터를 불러오는 중...</div></main></div>
<script>
const PIN='widget.exchangeRates.v2.pinned';const pin=$=>document.querySelector($);const pinBtn=pin('#pinBtn');let pinned=localStorage.getItem(PIN)==='1';pinBtn.classList.toggle('active',pinned);pinBtn.onclick=()=>{pinned=!pinned;localStorage.setItem(PIN,pinned?'1':'0');pinBtn.classList.toggle('active',pinned)};pin('#refreshBtn').onclick=()=>load();
const fmt=n=>Number(n||0).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2});const cls=n=>Number(n)>=0?'up':'down';const arrow=n=>Number(n)>=0?'▲':'▼';
function chartSvg(points){const a=(points||[]).slice(-7);if(a.length<2)return'';const vals=a.map(x=>Number(x.value)),W=520,H=100,l=8,r=8,t=10,b=18,min=Math.min(...vals),max=Math.max(...vals),range=max-min||1,pw=W-l-r,ph=H-t-b;const p=vals.map((v,i)=>({x:l+pw*i/(vals.length-1),y:t+(max-v)/range*ph}));const d=p.map((q,i)=>`${i?'L':'M'}${q.x.toFixed(1)} ${q.y.toFixed(1)}`).join(' ');return `<line class="gridline" x1="${l}" y1="${t+ph/2}" x2="${W-r}" y2="${t+ph/2}"/><path class="line" d="${d}"/><circle class="dot" cx="${p.at(-1).x}" cy="${p.at(-1).y}" r="3"/><text class="axis" x="${l}" y="${H-4}">${a[0].date.slice(5)}</text><text class="axis" x="${W-r}" y="${H-4}" text-anchor="end">${a.at(-1).date.slice(5)}</text>`}
function render(d){const rows=(d.rows||[]).map(r=>`<div class="row"><div class="currency"><span class="code">${r.code}</span><span class="name">${r.name}</span></div><div class="price">${fmt(r.price_krw)}</div><div class="change ${cls(r.change)}">${arrow(r.change)} ${fmt(Math.abs(r.change))}</div><div class="pct ${cls(r.change_pct)}">${Number(r.change_pct)>=0?'+':''}${Number(r.change_pct).toFixed(2)}%</div></div>`).join('');const u=d.usdkrw||{};pin('#content').className='';pin('#content').innerHTML=`<div class="table"><div class="thead"><span>통화</span><span style="text-align:right">원화</span><span style="text-align:right">변동</span><span style="text-align:right">등락률</span></div>${rows}</div><div class="chart-head"><div><div class="pair">USD/KRW · 7거래일</div></div><div><div class="chart-price">${fmt(u.price)}</div><div class="chart-change ${cls(u.change_pct)}">${arrow(u.change_pct)} ${Math.abs(Number(u.change_pct||0)).toFixed(2)}%</div></div></div><div class="chart-wrap"><svg class="chart" viewBox="0 0 520 100" preserveAspectRatio="none">${chartSvg(u.history)}</svg></div><footer class="footer"><span>${d.source||'ECB reference rates'}</span><span>${d.reference_date||'—'} 기준${d.stale?' · 지연':''}</span></footer>`}
async function load(){try{const r=await fetch('./exchange-rates-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;render(await r.json())}catch{pin('#content').innerHTML='<div class="loading">데이터를 불러오지 못했습니다.</div>'}}load();
</script><script src="./assets/life-town-controls-v2.js"></script></body></html>
