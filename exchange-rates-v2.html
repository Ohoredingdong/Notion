<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Exchange Rates v2</title><link rel="stylesheet" href="./assets/life-town-v2.css">
<style>
:root{--panel:#fff;--line:#e5e5e8;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--blue:#007aff;--red:#d92d27;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}
html[data-theme="dark"],html[data-lt-theme="dark"]{--panel:#1c1c1e;--line:#38383a;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--blue:#0a84ff;--red:#ff453a;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px 48px 8px 8px!important;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}
.shell{width:100%;max-width:560px;margin:0 auto}.widget{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:13px;box-shadow:var(--shadow)}.header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:17px;font-weight:760;letter-spacing:-.04em}.subtitle{margin-top:4px;font-size:9.5px;color:var(--muted)}.refresh{width:28px;height:28px;border:1px solid var(--line);border-radius:9px;background:var(--panel);cursor:pointer}.table{margin-top:11px;border-top:1px solid var(--line)}.thead,.row{display:grid;grid-template-columns:1.2fr .9fr .7fr .6fr;gap:9px;align-items:center}.thead{padding:7px 1px 5px;font-size:7.8px;color:var(--muted)}.row{padding:8px 1px;border-top:1px solid var(--line)}.currency{display:flex;gap:6px;align-items:baseline}.code{font-size:10.8px;font-weight:760}.name{font-size:8.2px;color:var(--muted)}.num{text-align:right;font-size:10.5px;font-weight:720}.up{color:var(--red)}.down{color:var(--blue)}.chart-head{display:flex;align-items:flex-end;justify-content:space-between;margin-top:12px}.pair{font-size:9px;font-weight:700;color:var(--sub)}.chart-price{font-size:17px;font-weight:780}.chart-change{font-size:8.5px;text-align:right;margin-top:2px}.chart-wrap{height:82px;margin-top:5px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 0 2px}.chart{width:100%;height:100%;display:block}.gridline{stroke:var(--line)}.line{fill:none;stroke:var(--blue);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dot{fill:var(--blue);stroke:var(--panel);stroke-width:2}.axis{font-size:7px;fill:var(--muted)}.footer{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:7.8px;color:var(--muted)}.loading{padding:32px;text-align:center;font-size:10px;color:var(--muted)}
</style></head><body><div class="shell"><main class="widget" data-widget-control-root data-control-sizes="500,530,560"><header class="header"><div><div class="title">Exchange Rates</div><div class="subtitle">주요 통화 원화 환율 · USD/KRW 7거래일</div></div><button class="refresh" id="refreshBtn" aria-label="새로고침">↻</button></header><div id="content" class="loading">환율 데이터를 불러오는 중...</div></main></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>Number(n||0).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2}),cls=n=>Number(n)>=0?'up':'down',arrow=n=>Number(n)>=0?'▲':'▼';
function graph(a){a=(a||[]).slice(-7);if(a.length<2)return'';const v=a.map(x=>+x.value),W=520,H=100,l=8,r=8,t=9,b=17,mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1,pw=W-l-r,ph=H-t-b,p=v.map((x,i)=>({x:l+pw*i/(v.length-1),y:t+(mx-x)/rg*ph})),d=p.map((q,i)=>`${i?'L':'M'}${q.x.toFixed(1)} ${q.y.toFixed(1)}`).join(' ');return `<line class="gridline" x1="${l}" y1="${t+ph/2}" x2="${W-r}" y2="${t+ph/2}"/><path class="line" d="${d}"/><circle class="dot" cx="${p.at(-1).x}" cy="${p.at(-1).y}" r="3"/><text class="axis" x="${l}" y="${H-3}">${a[0].date.slice(5)}</text><text class="axis" x="${W-r}" y="${H-3}" text-anchor="end">${a.at(-1).date.slice(5)}</text>`}
function render(d){const rows=(d.rows||[]).map(r=>`<div class="row"><div class="currency"><span class="code">${r.code}</span><span class="name">${r.name}</span></div><div class="num">${fmt(r.price_krw)}</div><div class="num ${cls(r.change)}">${arrow(r.change)} ${fmt(Math.abs(r.change))}</div><div class="num ${cls(r.change_pct)}">${+r.change_pct>=0?'+':''}${(+r.change_pct).toFixed(2)}%</div></div>`).join(''),u=d.usdkrw||{};$('#content').className='';$('#content').innerHTML=`<div class="table"><div class="thead"><span>통화</span><span style="text-align:right">원화</span><span style="text-align:right">변동</span><span style="text-align:right">등락률</span></div>${rows}</div><div class="chart-head"><div class="pair">USD/KRW</div><div><div class="chart-price">${fmt(u.price)}</div><div class="chart-change ${cls(u.change_pct)}">${arrow(u.change_pct)} ${Math.abs(+u.change_pct||0).toFixed(2)}%</div></div></div><div class="chart-wrap"><svg class="chart" viewBox="0 0 520 100" preserveAspectRatio="none">${graph(u.history)}</svg></div><div class="footer"><span>${d.source||'ECB reference rates'}</span><span>${d.reference_date||'—'} 기준${d.stale?' · 지연':''}</span></div>`}
async function load(){try{const r=await fetch('./exchange-rates-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;render(await r.json())}catch{$('#content').innerHTML='<div class="loading">데이터를 불러오지 못했습니다.</div>'}}$('#refreshBtn').onclick=load;load();
</script><script src="./assets/life-town-controls-v2.js"></script></body></html>
