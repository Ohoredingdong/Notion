<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>News Link Hub v2</title>
<link rel="stylesheet" href="./assets/life-town-v2.css">
<style>
:root{--panel:#fff;--soft:#f7f7f8;--line:#e5e5e8;--text:#111113;--sub:#6e6e73;--muted:#9a9aa0;--blue:#007aff;--green:#248a3d;--yellow:#9a7200;--red:#d92d27;--shadow:0 8px 22px rgba(0,0,0,.035),0 1px 2px rgba(0,0,0,.02)}
html[data-theme="dark"],html[data-lt-theme="dark"]{--panel:#1c1c1e;--soft:#2c2c2e;--line:#38383a;--text:#f5f5f7;--sub:#aeaeb2;--muted:#8e8e93;--blue:#0a84ff;--green:#30d158;--yellow:#ffd60a;--red:#ff453a;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{padding:8px 48px 8px 8px!important;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}.shell{width:100%;max-width:580px;margin:0 auto}.widget{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:13px 13px 11px;box-shadow:var(--shadow)}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.title{font-size:18px;font-weight:760;letter-spacing:-.04em}.subtitle{margin-top:4px;font-size:10.5px;color:var(--muted)}
.quality{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.q{height:21px;padding:0 7px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;font-size:8.4px;color:var(--sub);white-space:nowrap}.q strong{margin-left:3px;color:var(--text)}
.tabs{display:flex;gap:4px;margin-top:12px;padding:3px;background:var(--soft);border-radius:11px}.tab{flex:1;height:28px;border:0;border-radius:8px;background:transparent;font-size:9.9px;color:var(--muted);cursor:pointer}.tab.active{background:var(--panel);color:var(--text);font-weight:720;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 1px 7px}.toolbar-left{font-size:9.1px;color:var(--muted)}.filters{display:flex;gap:5px}.filters select{height:26px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:9.1px;color:var(--sub)}
.list{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:54px minmax(0,1fr) 52px;gap:9px;align-items:center;min-height:66px;padding:8px 1px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;min-width:0;overflow:hidden}.row:hover{background:linear-gradient(90deg,transparent,var(--soft),transparent)}
.topic{justify-self:start;max-width:54px;padding:4px 6px;border-radius:999px;background:rgba(0,122,255,.07);color:var(--blue);font-size:8.2px;font-weight:720;line-height:1.15;text-align:center;white-space:normal;overflow-wrap:anywhere;overflow:hidden}.topic.daily{background:rgba(255,204,0,.10);color:var(--yellow)}.topic.market{background:rgba(52,199,89,.09);color:var(--green)}
.copy{min-width:0;overflow:hidden}.headline{max-width:100%;font-size:11.6px;font-weight:720;line-height:1.34;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;word-break:keep-all}.meta{display:flex;align-items:center;gap:5px;margin-top:4px;min-width:0;overflow:hidden}.publisher{font-size:8.8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{flex:0 0 auto;max-width:78px;overflow:hidden;text-overflow:ellipsis;height:16px;padding:0 5px;border:1px solid var(--line);border-radius:999px;display:inline-flex;align-items:center;font-size:7.7px;font-weight:700}.badge.a,.badge.official{color:var(--green);background:rgba(52,199,89,.08)}.badge.b{color:var(--blue);background:rgba(0,122,255,.07)}.badge.cross{color:var(--yellow);background:rgba(255,204,0,.09)}.snippet{max-width:100%;margin-top:3px;font-size:9.2px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ago{min-width:0;font-size:8.5px;color:var(--muted);white-space:nowrap;text-align:right;overflow:hidden;text-overflow:ellipsis}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}.quick a{border:1px solid var(--line);border-radius:10px;padding:8px 9px;text-decoration:none;color:inherit;background:var(--panel)}.quick-title{font-size:9.5px;font-weight:720}.quick-sub{margin-top:2px;font-size:8.3px;color:var(--muted)}
.footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:8.2px;color:var(--muted)}.empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:10px}
@container(max-width:500px){.quick{grid-template-columns:1fr}.quality{display:none}.row{grid-template-columns:50px minmax(0,1fr)}.ago{display:none}}
</style>
</head>
<body>
<div class="shell">
<main class="widget" id="widget" data-widget-control-root data-control-sizes="500,540,580">
  <header class="header">
    <div><div class="title">News Link Hub</div><div class="subtitle">기사 · 실시간 뉴스 · 오피니언을 한 곳에서 확인</div></div>
    <div class="quality" id="quality"><span class="q">A급 <strong>—</strong></span><span class="q">교차확인 <strong>—</strong></span></div>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="news">뉴스</button>
    <button class="tab" data-tab="article">기사</button>
    <button class="tab" data-tab="realtime">실시간</button>
    <button class="tab" data-tab="opinion">오피니언</button>
  </nav>
  <div class="toolbar">
    <div class="toolbar-left" id="status">데이터 불러오는 중</div>
    <div class="filters">
      <select id="region"><option value="all">전체 지역</option><option value="kr">국내</option><option value="us">미국</option><option value="global">글로벌</option></select>
      <select id="sort"><option value="trust">신뢰순</option><option value="new">최신순</option><option value="old">오래된순</option></select>
    </div>
  </div>
  <section class="list" id="list"><div class="empty">뉴스를 불러오는 중...</div></section>
  <section class="quick">
    <a href="https://www.yna.co.kr/economy/all" target="_blank" rel="noopener"><div class="quick-title">연합뉴스 경제</div><div class="quick-sub">국내 경제 속보 · 주요 뉴스</div></a>
    <a href="https://www.reuters.com/markets/" target="_blank" rel="noopener"><div class="quick-title">Reuters Markets</div><div class="quick-sub">글로벌 시장 · 매크로 뉴스</div></a>
    <a href="https://finance.naver.com/news/" target="_blank" rel="noopener"><div class="quick-title">네이버 금융뉴스</div><div class="quick-sub">증권 · 산업 · 경제 기사</div></a>
  </section>
  <footer class="footer"><span id="source">Google News RSS · 신뢰필터</span><span id="updated">—</span></footer>
</main>
</div>
<script>
const FALLBACK={generated_at:new Date().toISOString(),quality:{tier_a:0,cross_confirmed:0},items:[]};
let state={tab:'news',region:'all',sort:'trust',data:FALLBACK};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function ago(v){const t=new Date(v).getTime();if(!Number.isFinite(t))return'—';const m=Math.max(0,Math.round((Date.now()-t)/60000));if(m<1)return'방금';if(m<60)return`${m}분 전`;const h=Math.floor(m/60);return h<24?`${h}시간 전`:`${Math.floor(h/24)}일 전`}
function score(x){if(Number.isFinite(Number(x.ranking_score)))return Number(x.ranking_score);let n=Number(x.source_score||0);if(x.official_source)n+=35;if(x.cross_confirmed)n+=28;return n}
function badge(x){let a=[];if(x.official_source)a.push('<span class="badge official">공식</span>');else if(x.source_tier==='A')a.push('<span class="badge a">A</span>');else if(x.source_tier==='B')a.push('<span class="badge b">B</span>');if(x.cross_confirmed)a.push(`<span class="badge cross">교차 ${Number(x.cross_count||2)}</span>`);return a.join('')}
function render(){
  let a=(state.data.items||[]).filter(x=>x.tab===state.tab&&(state.region==='all'||x.region===state.region));
  a.sort((x,y)=>state.sort==='new'?new Date(y.published_at)-new Date(x.published_at):state.sort==='old'?new Date(x.published_at)-new Date(y.published_at):score(y)-score(x));
  a=a.slice(0,6);
  $('#status').textContent=`${a.length}개 표시 · ${state.tab==='realtime'?'실시간 우선':'신뢰도 우선'}`;
  $('#list').innerHTML=a.length?a.map(x=>`<a class="row" href="${esc(x.url)}" target="_blank" rel="noopener">
    <span class="topic ${esc(x.topic_class||'')}">${esc(x.topic||'경제')}</span>
    <span class="copy"><span class="headline">${esc(x.title)}</span><span class="meta"><span class="publisher">${esc(x.source)}</span>${badge(x)}</span><span class="snippet">${esc(x.snippet||'')}</span></span>
    <span class="ago">${ago(x.published_at)}</span>
  </a>`).join(''):'<div class="empty">조건에 맞는 뉴스가 없습니다.</div>';
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});
$('#region').onchange=e=>{state.region=e.target.value;render()};$('#sort').onchange=e=>{state.sort=e.target.value;render()};
async function load(){try{const r=await fetch('./news-link-data.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;state.data=await r.json()}catch{state.data=FALLBACK}
 const q=state.data.quality||{};$('#quality').innerHTML=`<span class="q">A급 <strong>${Number(q.tier_a||0)}</strong></span><span class="q">교차확인 <strong>${Number(q.cross_confirmed||0)}</strong></span>`;
 $('#source').textContent=state.data.source||'Google News RSS · 신뢰필터';$('#updated').textContent=ago(state.data.generated_at);render()}
load();
</script>
<script src="./assets/life-town-controls-v2.js"></script>
</body></html>
